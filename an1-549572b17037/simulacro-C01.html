<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-AN1-C01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>

<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-AN1-C01", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Analista I, nivel técnico, OPEC 236779", "empleo_corto": "Analista I", "nivel_txt": "técnico", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 300, "funcionales": 206}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-26", "semilla": 236780, "corte_normativo": "2026-10-26"}, "pjs": [{"id": "C-E02-008-1", "caso_id": "C-E02-008", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 2", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Felipe Rojas, Analista I del grupo de control de una Dirección Seccional de Aduanas en un puerto, apoya la preparación del plan de trabajo de noviembre de 2026. El terminal recibe en promedio 300 contenedores diarios y el grupo dispone de 6 inspectores, que en conjunto pueden revisar 30 contenedores por día, el 10 % del total. Una asociación de importadores pide por escrito que no se demoren las cargas de bajo riesgo, y el jefe del grupo pide a Felipe un borrador de criterio para escoger los contenedores que se revisarán con base en los documentos de viaje recibidos antes del arribo. El borrador debe ajustarse a los principios del régimen de aduanas.", "enunciado": "¿Qué criterio de selección debe proponer Felipe en el borrador?", "opciones": [{"t": "Escoger al azar el 10 % de los contenedores de cada día para repartir la carga entre los inspectores.", "j": "Es incorrecta. Es plausible porque ajusta la selección a la capacidad real del grupo, pero toma como base el volumen diario y no el perfil de riesgo que exigen el Decreto 1165 de 2019, art. 2, numeral 5, y el art. 579. Error de granularidad.", "tipo": "granularidad"}, {"t": "Escoger los contenedores según el riesgo de los sujetos, el transporte, la unidad de carga y la mercancía.", "j": "Es correcta. El Decreto 1165 de 2019, art. 2, numeral 5, exige que el control se cumpla en el marco de un sistema de gestión del riesgo para promover la seguridad y facilitar el comercio, y el art. 579 indica que, con los documentos de viaje, se adoptan medidas respecto de sujetos, medio de transporte, unidad de carga y mercancía.", "tipo": null}, {"t": "Revisar la totalidad de los contenedores por turnos, porque la seguridad de la cadena prima sobre la agilidad.", "j": "Es incorrecta. Es plausible porque invoca la seguridad de la cadena logística, pero el Decreto 1165 de 2019, art. 2, numeral 5, une seguridad y facilitación dentro de un sistema de gestión del riesgo; revisar todo, con capacidad para el 10 %, demora las cargas de bajo riesgo. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M019", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#2", "fecha": "2026-10-26"}, {"fila": "M016", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 579", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#579", "fecha": "2026-10-26"}]}, {"id": "C-E01-008-1", "caso_id": "C-E01-008", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Aplicar", "fuente": "Ley 2586 de 2026, art. 45", "integra": ["RAZONAMIENTO MATEMATICO"], "caso": "Jorge Castaño, Analista I del punto de atención de una Dirección Seccional de Aduanas, atiende el 6 de octubre de 2026 a la representante de Ferretería Norte S.A.S. El jueves 1 de octubre se levantó el acta de hechos de una diligencia en la que se retuvieron 80 taladros por valor de $30.000.000; con base en ella se diligenció el acta de aprehensión, notificada el lunes 5 de octubre. La empresa quiere objetar la aprehensión y el avalúo, y pregunta hasta qué día puede radicar el escrito. Para el cálculo, la dependencia indica que el lunes 12 de octubre es festivo y que no hay otros días inhábiles distintos de sábados y domingos en el periodo.", "enunciado": "¿Qué fecha límite debe informar el analista para radicar el escrito de objeciones?", "opciones": [{"t": "El martes 27 de octubre, porque los 15 días hábiles corren desde el día siguiente a la notificación del acta.", "j": "Es correcta. La Ley 2586 de 2026, art. 45, concede 15 días hábiles siguientes a la notificación del acta de aprehensión para presentar el escrito de objeciones. Desde el 6 de octubre, sin contar fines de semana ni el festivo del 12, el día 15 es el martes 27 de octubre (6 al 9: 4; 13 al 16: 8; 19 al 23: 13; 26: 14; 27: 15).", "tipo": null}, {"t": "El viernes 23 de octubre, porque los 15 días hábiles se cuentan desde el día siguiente al acta de hechos.", "j": "Es incorrecta. Es plausible porque el acta de hechos es el primer documento de la diligencia. Falla porque, según la Ley 2586 de 2026, art. 40, el acta de hechos soporta la causal y el proceso se inicia con la notificación del acta de aprehensión; el art. 45 cuenta el término desde esta última. Error de fase.", "tipo": "fase"}, {"t": "El lunes 26 de octubre, porque los 15 días hábiles se cuentan incluyendo el día en que se notificó el acta.", "j": "Es incorrecta. Es plausible porque usa el término de 15 días hábiles y parte de la notificación. Falla porque la Ley 2586 de 2026, art. 45, otorga los 15 días hábiles siguientes a la notificación: el 5 de octubre no cuenta. Error de granularidad: el conteo incluye el día inicial.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M009", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 45", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#45", "fecha": "2026-10-26"}, {"fila": "M008", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 40", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#40", "fecha": "2026-10-26"}]}, {"id": "C-E06-006-1", "caso_id": "C-E06-006", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 139", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Una Analista I de la ventanilla de trámites aduaneros de la Dirección Seccional de Aduanas de Barranquilla revisa el 22 de julio de 2026 el registro de Almacenes del Atlántico S.A.S., habilitada como depósito público para mercancías en importación. En el certificado de existencia y representación expedido el 15 de julio consta que la sociedad fue declarada disuelta en mayo y que su liquidación terminó el 30 de junio de 2026. La empresa no presentó renuncia a la habilitación y en el depósito no quedan mercancías bajo control aduanero. El coordinador pide preparar la documentación de la pérdida de la habilitación con el evento que la sustenta y el documento que lo acredita.", "enunciado": "¿Qué evento debe soportar la documentación que prepara la analista?", "opciones": [{"t": "La falta de mantenimiento de los requisitos generales y especiales del depósito durante la vigencia de la habilitación.", "j": "Es incorrecta. Es plausible porque una sociedad liquidada deja de cumplir requisitos, pero el Decreto 1165 de 2019, art. 139, prevé un evento específico para la disolución y liquidación del titular (numeral 2). Usa la causal general del numeral 4 en lugar de la que describe el hecho (error de granularidad).", "tipo": "granularidad"}, {"t": "La terminación voluntaria o renuncia a la habilitación, porque la sociedad dejó de operar el depósito por decisión propia.", "j": "Es incorrecta. Es plausible porque la sociedad dejó de operar por voluntad de sus socios, pero el Decreto 1165 de 2019, art. 139, numeral 1, exige una renuncia a la habilitación, y el caso indica que no se presentó. Encuadra los hechos en un evento que no ocurrió (error de norma).", "tipo": "norma"}, {"t": "La disolución y liquidación de la persona jurídica titular de la habilitación, acreditada en el certificado de existencia.", "j": "Es correcta. El Decreto 1165 de 2019, art. 139, numeral 2, dispone que la habilitación se pierde por disolución y liquidación de la persona jurídica titular. El certificado de existencia y representación del 15 de julio acredita la disolución en mayo y la liquidación terminada el 30 de junio de 2026.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M072", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 139", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#139", "fecha": "2026-10-26"}]}, {"id": "C-E09-002-1", "caso_id": "C-E09-002", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 298", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Andrés Molina, Analista I del grupo de registro y OEA de una Dirección Seccional de Impuestos y Aduanas, apoya el reparto de las solicitudes de resolución anticipada recibidas entre el 8 y el 12 de junio. Llegaron tres: la de Lácteos Sabana S.A.S., que prevé importar en agosto cultivos lácticos por USD 25.000; la de un productor extranjero que exportará maquinaria a un comprador colombiano en septiembre; y la de Estudios Mercado Andino Ltda., firma consultora que pide la clasificación de cinco equipos médicos para un informe sectorial, sin operación de comercio exterior prevista con esos bienes. El grupo debe devolver a la ventanilla, con nota explicativa, la solicitud de quien no acredite legitimación.", "enunciado": "Al revisar la legitimación de los solicitantes, ¿qué debe preparar Andrés?", "opciones": [{"t": "Nota de devolución para la consultora, porque no pretende realizar una operación de comercio exterior con esos bienes.", "j": "Es correcta. El Decreto 1165 de 2019, art. 298, define la legitimación como la calidad de quien pretende realizar una operación de comercio exterior en relación con las mercancías objeto de la resolución; la consultora solo busca un dato para un informe sectorial.", "tipo": null}, {"t": "Nota de devolución para la consultora y el productor extranjero, porque ninguno de los dos presentará la declaración.", "j": "Es incorrecta. Es plausible porque confunde la legitimación con la calidad de declarante, pero el Decreto 1165 de 2019, art. 298, define la legitimación por la pretensión de realizar una operación de comercio exterior con las mercancías, que el productor sí tiene. Error de granularidad.", "tipo": "granularidad"}, {"t": "Nota de devolución para el productor extranjero, porque la resolución la pide el importador que declarará la mercancía en Colombia.", "j": "Es incorrecta. Es plausible porque el importador es el solicitante más frecuente, pero el Decreto 1165 de 2019, art. 298, admite solicitudes de exportadores y productores, y el productor extranjero pretende realizar una operación con esa maquinaria. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M063", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 298", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#298", "fecha": "2026-10-26"}]}, {"id": "C-E08-007-1", "caso_id": "C-E08-007", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 3", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "Usted es Analista I en el punto de atención de una Dirección Seccional de Impuestos y Aduanas. El propietario de Ferretería El Roble consulta el 4 de febrero por dos compras. La primera son 120 taladros de fabricación alemana que compró por $36.000.000 a un importador de otra ciudad, quien ya los había nacionalizado y le entregó factura de venta. La segunda son 80 pulidoras que él mismo comprará a un proveedor de Ecuador y que entrarán por un paso de frontera terrestre el 20 de febrero. Teme que en un control posterior le aprehendan los taladros por ser de procedencia extranjera y pregunta en cuál de las dos compras debe presentar declaración de importación.", "enunciado": "¿Cuál es la orientación que corresponde dar al propietario?", "opciones": [{"t": "Debe declarar las pulidoras y pedir un nuevo levante para los taladros comprados en el país", "j": "Es incorrecta. Es plausible porque acierta con las pulidoras y busca protegerse frente a un control sobre los taladros. Falla porque el levante es una etapa del trámite de importación, y la importación de los taladros, introducción al territorio según el Decreto 1165 de 2019, art. 3, ya la cumplió el primer importador. Error de fase: repite una etapa ya cumplida por otro usuario.", "tipo": "fase"}, {"t": "Debe declarar las dos compras, porque tanto taladros como pulidoras son mercancía de procedencia extranjera", "j": "Es incorrecta. Es plausible porque los taladros y las pulidoras son de procedencia extranjera y el propietario teme una aprehensión. Falla porque el Decreto 1165 de 2019, art. 3, define la importación como la introducción de esas mercancías al territorio aduanero; los taladros ya fueron introducidos y nacionalizados por otro importador. Error de granularidad: toma la procedencia del bien y no el acto de introducción.", "tipo": "granularidad"}, {"t": "Debe declarar las pulidoras, porque él mismo las introducirá al territorio aduanero desde el exterior", "j": "Es correcta. El Decreto 1165 de 2019, art. 3, define la importación como la introducción de mercancías de procedencia extranjera al territorio aduanero nacional. El propietario introducirá las pulidoras desde Ecuador; los taladros los compró en el país a quien ya los había importado, por lo que esa compra no es una importación suya.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M054", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Importación»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E09-004-1", "caso_id": "C-E09-004", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 304", "integra": ["CONTROLES ADUANEROS"], "caso": "En una inspección física del 5 de octubre, el grupo de control de una Dirección Seccional de Aduanas encuentra que 40 tambores de un aditivo, declarados por Química Andes S.A.S. con un valor de USD 60.000, tienen una composición química distinta de la descrita en la ficha técnica. El importador no ha presentado solicitud alguna sobre la clasificación de ese producto y ya obtuvo levante para otros dos lotes iguales. Daniel Rojas, Analista I de apoyo a fiscalización aduanera, debe preparar en 2 días hábiles el memorando que remite el caso al área técnica, señalar el acto con el que la DIAN podría fijar la subpartida del aditivo y anexar los análisis de laboratorio.", "enunciado": "¿Qué acto debe señalar Daniel en el memorando?", "opciones": [{"t": "Un acta de clasificación firmada por el propio Daniel, en la que asigne la subpartida según los análisis del laboratorio.", "j": "Es incorrecta. Es plausible porque Daniel organiza los análisis que sustentan la clasificación, pero el Decreto 1165 de 2019, art. 304, atribuye la asignación de la subpartida a un acto administrativo de la DIAN; el Analista I prepara el soporte y no firma ese acto. Error de competencia.", "tipo": "competencia"}, {"t": "La resolución de clasificación arancelaria, que la DIAN puede expedir de oficio según las características químicas del producto.", "j": "Es correcta. El Decreto 1165 de 2019, art. 304, permite a la DIAN expedir de oficio la resolución de clasificación arancelaria, atendiendo a las características físicas, químicas y técnicas de la mercancía; aquí no hay solicitud del importador.", "tipo": null}, {"t": "La resolución anticipada de clasificación, que la DIAN puede expedir de oficio cuando detecta diferencias en una inspección física.", "j": "Es incorrecta. Es plausible porque la resolución anticipada también versa sobre clasificación, pero el Decreto 1165 de 2019, art. 298, la expide a solicitud de un particular legitimado y antes de la importación, condiciones que no se dan en este caso. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M064", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 304", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#304", "fecha": "2026-10-26"}, {"fila": "M063", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 298", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#298", "fecha": "2026-10-26"}]}, {"id": "C-E03-009-1", "caso_id": "C-E03-009", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 25", "integra": ["OPERADOR ECONOMICO AUTORIZADO"], "caso": "Felipe Arango, Analista I del grupo de registro y OEA de la Dirección Seccional de Aduanas de Cartagena, revisa el 20 de abril la solicitud de autorización como Operador Económico Autorizado de Puerto Alianza Logística S.A.S. La empresa mueve el 60 % de sus embarques en Cartagena y el 40 % en Medellín; radicó la solicitud en Cartagena el 5 de abril y una copia en Medellín el 12 de abril. Un compañero propone dividir el expediente para que cada seccional decida sobre la parte de la operación de su jurisdicción. El analista debe definir la ruta del expediente antes de cerrar la verificación documental, prevista para el 30 de abril.", "enunciado": "Tras analizar la propuesta del compañero, ¿qué ruta debe definir el analista para el expediente?", "opciones": [{"t": "Dejar el expediente en Cartagena, que lo resuelve por las dos ciudades al recibirlo primero.", "j": "Es incorrecta. Es plausible porque la empresa radicó primero en Cartagena y allí concentra la mayor parte de sus embarques. Falla porque el Decreto 1742 de 2020, art. 25, num. 1, no fija la competencia por el orden de radicación ni por el volumen: la solicitud la resuelve la Subdirección competente. Error de norma: aplica un criterio de reparto que la norma no contiene.", "tipo": "norma"}, {"t": "Dividir el expediente para que cada seccional resuelva la parte de la operación de su propia jurisdicción.", "j": "Es incorrecta. Es plausible porque las seccionales actúan de acuerdo con su jurisdicción en otras funciones y la empresa opera en dos ciudades. Falla porque el Decreto 1742 de 2020, art. 25, num. 1, radica en una Subdirección la resolución de la solicitud OEA y la expedición de todos sus actos. Error de granularidad: fragmenta por seccional una decisión que se toma en una sola dependencia.", "tipo": "granularidad"}, {"t": "Integrar un solo expediente para la Subdirección que resuelve la solicitud OEA y expide sus actos.", "j": "Es correcta. El Decreto 1742 de 2020, art. 25, num. 1, asigna a la Subdirección competente resolver las solicitudes de autorización de Operador Económico Autorizado y proyectar y expedir todos los actos administrativos que se requieran. La solicitud es una sola aunque la operación ocurra en dos ciudades, y el analista organiza la documentación para esa Subdirección.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 25", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#25", "fecha": "2026-10-26"}]}, {"id": "C-E03-004-1", "caso_id": "C-E03-004", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 25", "integra": ["OPERADOR ECONOMICO AUTORIZADO"], "caso": "Sofía Cárdenas, Analista I del grupo de registro y OEA de la Dirección Seccional de Aduanas de Barranquilla, termina el 15 de agosto la preparación del expediente de Exportadora Caribe Verde S.A.S., que pidió la autorización como Operador Económico Autorizado en la categoría de seguridad y facilitación. El expediente reúne 9 anexos, la visita de validación se cumplió el 2 de agosto con concepto favorable y el plazo interno para el traslado vence en 5 días hábiles. El gerente de la empresa pide a la analista que proyecte y firme en la seccional la resolución de autorización, porque la visita ya salió bien. La analista debe dar al expediente el curso que corresponde.", "enunciado": "¿Qué actuación corresponde a la analista para dar curso al expediente que preparó?", "opciones": [{"t": "Enviar el expediente a la Dirección de Gestión de Aduanas para que expida la autorización.", "j": "Es incorrecta. Es plausible porque el nombre de esa dependencia sugiere que dirige toda la gestión aduanera, incluida la autorización OEA. Falla porque el Decreto 1742 de 2020, art. 25, num. 1, radica en la Subdirección que regula ese artículo la resolución de las solicitudes OEA y la expedición de todos los actos que se requieran. Error de granularidad: remite a una instancia distinta de la dependencia que resuelve.", "tipo": "granularidad"}, {"t": "Remitir el expediente a la Subdirección que resuelve las solicitudes OEA y expide sus actos.", "j": "Es correcta. El Decreto 1742 de 2020, art. 25, num. 1, dispone que la Subdirección competente resuelve las solicitudes de autorización de Operador Económico Autorizado y proyecta y expide todos los actos administrativos que se requieran. A la analista le corresponde remitir dentro del plazo interno el expediente que preparó.", "tipo": null}, {"t": "Proyectar y firmar en la seccional la resolución, dado el concepto favorable de la visita.", "j": "Es incorrecta. Es plausible porque el expediente está completo y la visita fue favorable, lo que hace pensar que solo falta formalizar. Falla porque el Decreto 1742 de 2020, art. 25, num. 1, asigna a la Subdirección competente resolver las solicitudes OEA y proyectar y expedir todos los actos administrativos; el Analista I prepara la documentación y no firma actos. Error de competencia: atribuye a la analista y a la seccional una decisión ajena.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M024", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 25", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#25", "fecha": "2026-10-26"}]}, {"id": "C-E01-001-1", "caso_id": "C-E01-001", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 3", "integra": ["CONTROLES ADUANEROS"], "caso": "Lucía Ortega, Analista I del grupo de control de una Dirección Seccional de Aduanas, organiza el expediente de una diligencia de control posterior practicada el 3 de marzo en la bodega de Comercializadora Delta S.A.S. Los funcionarios retuvieron 40 cajas de repuestos avaluadas en USD 18.000, porque la declaración de importación exhibida describe otro modelo, y las trasladaron a un depósito habilitado mientras verifican su legal introducción al territorio aduanero nacional. El 10 de marzo el representante legal de la empresa llama a la dependencia y pregunta si los repuestos ya son propiedad de la Nación. La jefe del grupo pide que la carpeta identifique con exactitud la figura que hoy recae sobre la mercancía, sin anticipar el resultado del proceso.", "enunciado": "¿Qué figura debe registrar la analista en la carpeta y explicar al representante legal?", "opciones": [{"t": "Decomiso directo: el paso de las cajas a la Nación en la misma diligencia, por tratarse de un control posterior.", "j": "Es incorrecta. Es plausible porque la Ley 2586 de 2026, art. 48, prevé un decomiso simultáneo con la aprehensión. Falla porque esa figura depende de la mercancía (por ejemplo, valor igual o inferior a 500 UVT) y no del tipo de control, y en el caso no se expidió ningún acto de decomiso: las cajas siguen retenidas mientras se verifica. Error de norma: aplica una figura con un supuesto que la ley no prevé.", "tipo": "norma"}, {"t": "Decomiso: el paso de las cajas a poder de la Nación desde la diligencia, por no estar amparadas en la declaración.", "j": "Es incorrecta. Es plausible porque la declaración no describe el modelo hallado y el decomiso es la consecuencia posible. Falla porque, según el Decreto 1165 de 2019, art. 3, el decomiso es el acto por el que la mercancía pasa a la Nación cuando no se acredita su legal introducción; aquí la verificación no ha terminado. Error de fase: anticipa el resultado del proceso.", "tipo": "fase"}, {"t": "Aprehensión: la retención cautelar de las cajas mientras se verifica su legal introducción, sin paso a la Nación.", "j": "Es correcta. El Decreto 1165 de 2019, art. 3, define la aprehensión como la medida cautelar de retención de mercancías mientras la autoridad aduanera verifica su legal introducción, permanencia y circulación. El caso describe esa fase: las cajas están retenidas y la verificación sigue en curso; el paso a la Nación corresponde al decomiso, que aún no se ha producido.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M001", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Aprehensión»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}, {"fila": "M002", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Decomiso»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E09-008-1", "caso_id": "C-E09-008", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 320", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Jorge Salcedo, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Impuestos y Aduanas, organiza el 9 de agosto la respuesta a una petición de Repuestos Motor S.A.S. La empresa importó autopartes por USD 70.000 y sostiene que su valor en aduana debe fijarse según su manual interno de precios y un contrato de distribución exclusiva. El coordinador pide a Jorge preparar en 3 días hábiles un cuadro con el marco normativo del valor en aduana que se citará en la respuesta, y que sirva para contrastar, fuente por fuente, la posición de la empresa con el marco aplicable.", "enunciado": "¿Qué fuentes debe incluir Jorge en el cuadro?", "opciones": [{"t": "El Acuerdo sobre Valoración de la OMC, la Decisión Andina 571 de 2003 con su Reglamento Comunitario y las regulaciones nacionales complementarias.", "j": "Es correcta. El Decreto 1165 de 2019, art. 320, señala que las normas de valoración comprenden el Acuerdo sobre Valoración de la OMC aprobado por la Ley 170 de 1994, la Decisión Andina 571 de 2003 y su Reglamento Comunitario, y las regulaciones nacionales complementarias.", "tipo": null}, {"t": "El Acuerdo sobre Valoración de la OMC, las regulaciones nacionales complementarias y el manual interno de precios aportado por la empresa.", "j": "Es incorrecta. Es plausible porque el manual describe la política de precios del importador, pero el Decreto 1165 de 2019, art. 320, no reconoce documentos privados como norma de valoración y la opción omite la Decisión Andina 571 de 2003. Error de norma.", "tipo": "norma"}, {"t": "La Decisión Andina 571 de 2003, su Reglamento Comunitario adoptado por la Resolución 1684 de 2014 y las demás regulaciones nacionales complementarias.", "j": "Es incorrecta. Es plausible porque reúne la normativa andina y la nacional, pero omite el Acuerdo sobre Valoración de la OMC aprobado por la Ley 170 de 1994, que el Decreto 1165 de 2019, art. 320, incluye en el marco. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M067", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 320", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#320", "fecha": "2026-10-26"}]}, {"id": "C-E04-001-1", "caso_id": "C-E04-001", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 28", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Lucía Restrepo, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, recibe el 4 de marzo la solicitud de Maquinarias del Valle Bajo S.A.S., que tramitará una importación temporal de una excavadora con valor de USD 250.000 y debe amparar las obligaciones de la modalidad con una garantía específica. El representante legal ofrece tres alternativas: un pagaré con carta de instrucciones firmado por el socio mayoritario, una prenda con entrega física de dos camiones de la empresa a la DIAN y una fiducia mercantil sobre una bodega de su propiedad. No consta que la DIAN haya reglamentado otras formas de garantía. El jefe del grupo pidió que el expediente llegue a revisión con un instrumento admisible antes del 10 de marzo, fecha prevista para presentar la declaración.", "enunciado": "Al organizar la documentación para la aceptación de la garantía, ¿cuál de los instrumentos ofrecidos debe incorporar el Analista al expediente?", "opciones": [{"t": "La fiducia mercantil en garantía constituida sobre la bodega de la empresa", "j": "Es correcta. El Decreto 1165 de 2019, art. 28, enumera como tipos de garantía la de compañía de seguros, la de entidad bancaria, la hipotecaria, la fiducia mercantil en garantía y la prenda sin tenencia; de las tres alternativas ofrecidas, la fiducia sobre la bodega es la que corresponde a uno de esos tipos.", "tipo": null}, {"t": "El pagaré con carta de instrucciones suscrito por el socio mayoritario", "j": "Es incorrecta. Es plausible porque el pagaré es un título de uso corriente para respaldar deudas, pero no corresponde a ninguno de los tipos que enumera el Decreto 1165 de 2019, art. 28 (compañía de seguros, entidad bancaria, hipotecaria, fiducia mercantil en garantía, prenda sin tenencia), y el caso descarta que la DIAN haya reglamentado otra forma. Error de norma.", "tipo": "norma"}, {"t": "La prenda de los dos camiones con entrega física de estos a la autoridad aduanera", "j": "Es incorrecta. Es plausible porque la prenda figura entre los tipos admisibles, pero el Decreto 1165 de 2019, art. 28, admite la prenda sin tenencia y aquí se ofrece entregar los camiones a la DIAN, es decir, una prenda con tenencia. Error de granularidad: confunde la modalidad de prenda que la norma permite.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M029", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#28", "fecha": "2026-10-26"}]}, {"id": "C-E02-010-1", "caso_id": "C-E02-010", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 576", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Natalia Suárez, Analista I del grupo de control de una Dirección Seccional de Aduanas, redacta el borrador del informe de una visita de control realizada el 22 de octubre de 2026 a un depósito habilitado de Logística Puerto Claro S.A.S. Durante 6 horas se verificaron 40 bultos frente a 3 declaraciones de importación y se encontraron 2 bultos sin documento soporte. El inspector anotó además que 5 operarios no tenían dotación de seguridad industrial y que una bodega vecina, ajena al depósito, almacenaba combustible. El jefe pide que el informe tenga como máximo 4 páginas y se concentre en lo que corresponde a la visita.", "enunciado": "¿Cómo debe delimitar Natalia el contenido del informe que redacta?", "opciones": [{"t": "Incluir con igual detalle los tres hallazgos, porque el control abarca otros actos similares sin límite de materia.", "j": "Es incorrecta. Es plausible porque el Decreto 1165 de 2019, art. 576, menciona investigaciones y otros actos similares, pero esa expresión se lee dentro de la finalidad del control, que es asegurar el cumplimiento de la normativa de competencia aduanera. Error de granularidad.", "tipo": "granularidad"}, {"t": "Centrarlo en los bultos y documentos verificados, porque el control busca el cumplimiento de la normativa aduanera.", "j": "Es correcta. El Decreto 1165 de 2019, art. 576, define el control aduanero como el conjunto de medidas para asegurar el cumplimiento de la normativa de competencia de la Administración Aduanera, y entre ellas están examinar mercancías y verificar documentos soporte. La dotación de los operarios y la bodega vecina quedan fuera de esa materia.", "tipo": null}, {"t": "Proponer en el informe el cierre del depósito por los bultos sin soporte y por la falta de dotación.", "j": "Es incorrecta. Es plausible porque los hallazgos parecen graves, pero la Analista prepara un borrador y no decide medidas sobre el usuario; además, el Decreto 1165 de 2019, art. 576, orienta el control a la normativa aduanera y no a la seguridad industrial. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M013", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 576", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#576", "fecha": "2026-10-26"}, {"fila": "M014", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 576", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#576", "fecha": "2026-10-26"}]}, {"id": "C-E08-010-1", "caso_id": "C-E08-010", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 173", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Usted es Analista I en la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas. Frío Total S.A.S. importó 500 refrigeradores por USD 100.000 en importación ordinaria, clasificados en una subpartida con arancel del 15 %. Pagó los tributos el 1 de marzo, obtuvo el levante el 3 de marzo y no tiene estudio de valor ni otra actuación pendiente. El 10 de marzo el gerente informa que venderá 200 unidades a un distribuidor de otra ciudad y conservará 300 en bodega, y pregunta si debe pedir a la DIAN un permiso por cada venta o esperar algún plazo antes de vender.", "enunciado": "¿Qué orientación corresponde darle sobre la venta de los refrigeradores?", "opciones": [{"t": "Puede venderlos, porque con el levante quedaron en libre disposición y permanecen sin plazo en el país", "j": "Es correcta. El Decreto 1165 de 2019, art. 173, define la importación ordinaria como la introducción de mercancías para permanecer de manera indefinida, en libre disposición, con el pago de los tributos; y el art. 3 define el levante como el acto que permite la disposición de la mercancía. Con tributos pagados y levante otorgado, la empresa puede vender.", "tipo": null}, {"t": "Debe radicar ante el grupo de control una solicitud de permiso de venta por cada lote de refrigeradores", "j": "Es incorrecta. Es plausible porque el gerente pregunta por un permiso y el grupo de control interviene en otras etapas. Falla porque, según el Decreto 1165 de 2019, arts. 3 y 173, el levante ya permitió la disposición y la importación ordinaria deja la mercancía en libre disposición; ninguna dependencia autoriza cada venta. Error de competencia: atribuye a una dependencia una decisión que no le corresponde.", "tipo": "competencia"}, {"t": "Debe esperar doce meses desde el levante, porque hasta entonces la mercancía sigue bajo control aduanero", "j": "Es incorrecta. Es plausible porque la DIAN conserva facultades de control posterior sobre las importaciones. Falla porque el Decreto 1165 de 2019, art. 173, establece que en la importación ordinaria la mercancía permanece de manera indefinida en libre disposición, y ninguna fila citada fija un plazo de espera para venderla. Error de norma: inventa una restricción temporal.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M057", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 173", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#173", "fecha": "2026-10-26"}, {"fila": "M061", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Levante»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E01-007-1", "caso_id": "C-E01-007", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Aplicar", "fuente": "Ley 2586 de 2026, art. 26", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Paula Herrera, Analista I del punto de atención de una Dirección Seccional de Aduanas, atiende el 15 de julio a Martín Rojas, quien ingresó al país como viajero el 2 de mayo con 12 relojes en su equipaje y pagó el tributo único sobre ellos. Una fiscalización posterior encontró los mismos 12 relojes exhibidos para la venta, con precio de USD 150 cada uno, en el local comercial de una sociedad de la que el viajero es socio. El ciudadano pregunta si la DIAN puede retener esos relojes ahora, cuando ya salió del aeropuerto hace más de dos meses. La analista debe orientarlo según la norma, sin anticipar decisiones de fondo.", "enunciado": "¿Qué orientación debe dar la analista al ciudadano sobre la situación de los relojes?", "opciones": [{"t": "Que la causal se limita al control en el aeropuerto, de modo que la retención no procede después de su salida.", "j": "Es incorrecta. Es plausible porque la mayoría de supuestos del num. 12 del art. 26 de la Ley 2586 de 2026 se verifican al arribo del viajero. Falla porque el mismo numeral prevé la aprehensión cuando, en control posterior, se encuentran mercancías ingresadas como viajero destinadas al comercio. Error de fase: limita la causal al control simultáneo.", "tipo": "fase"}, {"t": "Que en control posterior procede la aprehensión de mercancías ingresadas como viajero que se destinan al comercio.", "j": "Es correcta. La Ley 2586 de 2026, art. 26, num. 12, establece que también habrá lugar a la aprehensión cuando en el control posterior la autoridad aduanera encuentre mercancías introducidas bajo la modalidad de viajeros destinadas al comercio. Los relojes se exhiben para la venta en un local, y la analista orienta sin decidir.", "tipo": null}, {"t": "Que el pago del tributo único al ingresar ampara los relojes, de modo que la retención procede si no lo pagó.", "j": "Es incorrecta. Es plausible porque omitir la declaración del equipaje sujeto a tributo único es otro supuesto del num. 12 del art. 26 de la Ley 2586 de 2026. Falla porque ese pago no excluye el supuesto de control posterior por destino comercial, que es el que muestra el caso. Error de completitud: considera un supuesto del numeral y omite el aplicable.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M007", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#26", "fecha": "2026-10-26"}]}, {"id": "C-E05-003-1", "caso_id": "C-E05-003", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Lucía Mora, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, atiende el 22 de agosto a la agencia de aduanas Puerto Nuevo S.A.S. La agencia gestiona para un cliente el tránsito aduanero de 3 contenedores, con valor FOB de USD 85.000, desde el puerto de llegada hasta un depósito habilitado del interior, y la declaración de tránsito quedó en estado de revisión hace 2 días. Su representante afirma que la DIAN dirige la importación ordinaria, pero que los tránsitos y la actuación de las agencias son asuntos privados entre el transportador, el depósito y el importador. Lucía debe responder con base en la misión de la entidad y sin pronunciarse sobre el fondo de la revisión.", "enunciado": "¿Qué debe informar Lucía al representante sobre el alcance de la gestión que dirige la entidad?", "opciones": [{"t": "Que la DIAN dirige el servicio, el control y el apoyo a los regímenes y destinos aduaneros y a los auxiliares de la función aduanera.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, numeral 2, atribuye a la DIAN dirigir y administrar la gestión y operación aduanera, con el servicio, el control y el apoyo a los regímenes y destinos aduaneros y a los usuarios y auxiliares de la función pública aduanera, como la agencia.", "tipo": null}, {"t": "Que la DIAN dirige la operación de los regímenes de importación y exportación, y que en el tránsito presta apoyo cuando la agencia lo pide.", "j": "Es incorrecta. Es plausible porque importación y exportación son los regímenes más conocidos. Falla porque el Decreto 1742 de 2020, art. 3, numeral 2, extiende la gestión a los diferentes regímenes y destinos aduaneros, entre ellos el tránsito, con servicio, control y apoyo. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que la DIAN controla los destinos aduaneros como el tránsito, y que la actuación de la agencia la vigila la Superintendencia de Sociedades por ser una sociedad comercial.", "j": "Es incorrecta. Es plausible porque las agencias de aduanas son sociedades comerciales. Falla porque el Decreto 1742 de 2020, art. 3, numeral 2, incluye en la gestión de la DIAN a los auxiliares de la función pública aduanera, como las agencias de aduanas. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M039", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E07-007-1", "caso_id": "C-E07-007", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 323", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Camilo Rojas, Analista I del punto de atención de una Dirección Seccional de Impuestos y Aduanas, verifica la documentación soporte de una declaración de importación de Equipos Médicos del Sur S.A.S. antes de su presentación. La Declaración Andina del Valor, elaborada por el importador, registra un precio FOB de USD 40.000, gastos de transporte hasta el lugar de importación de USD 3.000 y seguro de USD 1.000; en su hoja de cálculo, el valor en aduana resulta de sumar esos tres conceptos. El borrador de la declaración liquida un arancel del 10 % y el importador pide confirmar la base usada antes de presentarla. La tasa de cambio no es parte de la consulta.", "enunciado": "¿Qué base gravable y qué valor de arancel, en dólares, debe confirmar el analista en el borrador?", "opciones": [{"t": "Base de USD 43.000 y arancel de USD 4.300", "j": "Es incorrecta. Suma el transporte al precio FOB, pero omite el seguro (43.000 x 10 % = 4.300), aunque la DAV lo incluye en el valor en aduana que el art. 323 del Decreto 1165 de 2019 toma como base gravable. Error de completitud.", "tipo": "completitud"}, {"t": "Base de USD 44.000 y arancel de USD 4.400", "j": "Es correcta. El art. 323 del Decreto 1165 de 2019 dispone que el valor en aduana determinado en la Declaración Andina del Valor se toma como base gravable de los tributos aduaneros. Según la DAV del caso: 40.000 + 3.000 + 1.000 = 44.000; arancel: 44.000 x 10 % = 4.400.", "tipo": null}, {"t": "Base de USD 40.000 y arancel de USD 4.000", "j": "Es incorrecta. Aplica bien la tarifa, pero toma como base el precio FOB (40.000 x 10 % = 4.000). El art. 323 del Decreto 1165 de 2019 manda tomar como base gravable el valor en aduana de la DAV, que incluye transporte y seguro. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M068", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 323", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#323", "fecha": "2026-10-26"}]}, {"id": "C-E01-006-1", "caso_id": "C-E01-006", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 26", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Sergio Pardo, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Impuestos y Aduanas, organiza las pruebas de una visita del 12 de mayo a Importadora Faro S.A.S. La declaración de importación de 300 tabletas registra un valor en aduana de USD 20.000, soportado en una factura del proveedor extranjero. La confirmación que el proveedor envió a la DIAN informa una venta por USD 50.000 para el mismo embarque. En un escritorio de la contabilidad se hallaron 25 formatos de factura en blanco con el membrete y el sello de ese proveedor. La empresa afirma que la diferencia es un asunto de valoración y no de aprehensión.", "enunciado": "¿Qué fundamento debe consignar el analista en el informe para sustentar la causal de aprehensión?", "opciones": [{"t": "Solo la diferencia de valor, que se remite al área de valoración, sin mencionar los formatos de factura hallados.", "j": "Es incorrecta. Es plausible porque la diferencia de valor también interesa al control de valoración. Falla porque deja por fuera el hallazgo de formatos del proveedor en la empresa, que la Ley 2586 de 2026, art. 26, num. 7, menciona en forma expresa como circunstancia de la causal. Error de completitud: atiende una parte de los hechos.", "tipo": "completitud"}, {"t": "La mercancía no declarada, porque el valor registrado en la declaración es inferior al que confirma el proveedor.", "j": "Es incorrecta. Es plausible porque la declaración no refleja el valor real. Falla porque las tabletas sí fueron declaradas; lo que falla son los soportes. La Ley 2586 de 2026, art. 26, num. 7, regula los documentos que no se ajustan a la realidad de la operación y los formatos del proveedor en oficinas del importador. Error de norma: causal equivocada.", "tipo": "norma"}, {"t": "Los soportes que no se ajustan a la operación declarada y los formatos del proveedor hallados en la empresa.", "j": "Es correcta. La Ley 2586 de 2026, art. 26, num. 7, prevé la causal cuando, en control posterior, los documentos soporte no se ajustan con la realidad de la operación declarada o cuando se encuentran sellos o formatos de facturas del proveedor en las oficinas del importador que pretendan soportar la operación. El caso reúne ambos hechos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M006", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#26", "fecha": "2026-10-26"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 581", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Ricardo Peña, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Impuestos y Aduanas, recibe el 3 de febrero de 2026 la orden del jefe de programa de preparar la documentación de un estudio sobre Electro Hogar Andino S.A.S. La empresa presentó 12 declaraciones de importación entre enero y diciembre de 2025, todas con levante y retiro, por un total de USD 600.000. En 3 de ellas el precio unitario de las neveras es 40 % inferior al de importaciones similares, y el estudio busca establecer si los datos declarados en el año son exactos. El plazo interno para entregar la carpeta es de 10 días hábiles. Ricardo no califica la conducta; organiza los soportes.", "enunciado": "¿Qué documentación debe organizar Ricardo para el estudio que le encargaron?", "opciones": [{"t": "Las 12 declaraciones del período y los documentos de las operaciones comerciales que soportan los precios.", "j": "Es correcta. El Decreto 1165 de 2019, art. 581, establece que en el control posterior se revisan las mercancías y los documentos relativos a las operaciones comerciales para establecer la exactitud de los datos consignados en declaraciones presentadas durante un determinado período. El estudio cubre las 12 declaraciones de 2025.", "tipo": null}, {"t": "Las declaraciones de los últimos 3 meses, que es el plazo en que la norma permite revisar operaciones con levante.", "j": "Es incorrecta. Es plausible porque supone un límite temporal para revisar operaciones cerradas, pero el Decreto 1165 de 2019, art. 581, no fija ese plazo de 3 meses y admite el control sobre las declaraciones de un período determinado. Error de norma.", "tipo": "norma"}, {"t": "Las 3 declaraciones con precio inferior y sus facturas, porque en ellas aparece la diferencia detectada.", "j": "Es incorrecta. Es plausible porque concentra el esfuerzo en las operaciones con la alerta, pero el estudio busca la exactitud de los datos del año y el Decreto 1165 de 2019, art. 581, orienta el control posterior a las declaraciones presentadas durante un determinado período; deja por fuera 9 declaraciones. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M018", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 581", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#581", "fecha": "2026-10-26"}]}, {"id": "C-E01-004-1", "caso_id": "C-E01-004", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 26", "integra": ["CONTROLES ADUANEROS"], "caso": "Felipe Arango, Analista I del grupo de control de una Dirección Seccional de Aduanas, organiza los soportes de una visita de control posterior a Motores del Valle S.A.S. En la bodega se hallaron 20 motores eléctricos cuyo serial difiere en un dígito del registrado en la declaración de importación; la marca, el modelo, la potencia y la cantidad coinciden, y el perito confirma que se trata de la misma mercancía. La empresa entrega un recibo oficial del 8 de agosto con el pago de la sanción prevista en el numeral 15.2.2.4 del artículo 15 de la Ley 2586 de 2026 por ese error. El inspector pide al analista dejar claro en el informe si la aprehensión procede.", "enunciado": "¿Qué conclusión debe consignar el analista en el informe sobre la procedencia de la aprehensión?", "opciones": [{"t": "Procede, porque los documentos soporte de la declaración no se ajustan a la realidad de los motores hallados.", "j": "Es incorrecta. Es plausible porque la diferencia de serial podría verse como un soporte que no coincide con la operación (num. 7 del art. 26 de la Ley 2586 de 2026). Falla porque la ley regula los errores de serial en el num. 2 y allí fija que, pagada la sanción y sin mercancía diferente, no procede la aprehensión. Error de norma: encuadra el hecho en otra causal.", "tipo": "norma"}, {"t": "No procede, porque el error de serial no convierte los motores en mercancía diferente y la sanción ya se pagó.", "j": "Es correcta. La Ley 2586 de 2026, art. 26, num. 2, señala que, ante errores en el serial que no conlleven a que se trate de mercancía diferente, la aprehensión solo procede cuando no se haya cancelado la sanción del numeral 15.2.2.4 del artículo 15. El perito confirmó que es la misma mercancía y el recibo del 8 de agosto acredita el pago.", "tipo": null}, {"t": "Procede, porque el serial hallado no coincide con el declarado y los motores quedan como mercancía no amparada.", "j": "Es incorrecta. Es plausible porque la mercancía no declarada o no amparada es causal de aprehensión en el num. 2 del art. 26 de la Ley 2586 de 2026. Falla porque omite la regla especial del mismo numeral para errores de serial que no generan mercancía diferente, que condiciona la aprehensión a que la sanción no se haya pagado. Error de completitud: lee la primera parte del numeral y no la excepción.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M004", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#26", "fecha": "2026-10-26"}]}, {"id": "C-E05-007-1", "caso_id": "C-E05-007", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 2", "integra": ["GARANTIAS ADUANERAS"], "caso": "Natalia Gómez, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, recibe el lunes 2 de febrero la solicitud de aprobación de una garantía global de $150.000.000 de Logística Sabana S.A.S., que necesita tenerla aceptada para iniciar operaciones el 16 de febrero. La póliza y los anexos vienen completos según la lista de chequeo. El grupo tiene 35 solicitudes pendientes y un compañero sugiere dos salidas: dejar esta al final de la fila, porque en enero la empresa presentó una póliza con un error en el NIT, o pasarla al jefe sin verificarla para no atrasarla. Natalia debe definir cómo procesa la solicitud dentro de sus funciones.", "enunciado": "¿Qué actuación se ajusta al principio que rige la función aduanera en esta situación?", "opciones": [{"t": "Verificar la póliza y los anexos con oportunidad para que el trámite avance a tiempo, sin omitir la revisión de control.", "j": "Es correcta. El Decreto 1165 de 2019, art. 2, numeral 1, hace prevalecer el servicio ágil y oportuno para facilitar el comercio exterior, sin perjuicio del control; el Decreto 1742 de 2020, art. 3, incluye el servicio y el control a los usuarios. Natalia verifica y tramita a tiempo.", "tipo": null}, {"t": "Dejar la solicitud al final de la fila hasta aclarar la duda causada por el error de enero, como una medida de control previo.", "j": "Es incorrecta. Es plausible porque el antecedente de enero parece justificar más cautela. Falla porque el Decreto 1165 de 2019, art. 2, numeral 1, hace prevalecer el servicio ágil y oportuno, y una póliza completa no se posterga por un error ya superado. Error de norma.", "tipo": "norma"}, {"t": "Pasar la solicitud al jefe sin verificar la póliza, porque la agilidad del servicio prima sobre la revisión de los documentos.", "j": "Es incorrecta. Es plausible porque el principio de eficiencia prioriza la agilidad. Falla porque el Decreto 1165 de 2019, art. 2, numeral 1, aclara que el servicio ágil se presta sin perjuicio del control, y la verificación es parte de ese control. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M043", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#2", "fecha": "2026-10-26"}, {"fila": "M039", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E04-006-1", "caso_id": "C-E04-006", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 31", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Mateo Cárdenas, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Aduanas, organiza el expediente de Ferretería Los Robles S.A.S., que importó temporalmente un generador de USD 80.000 y no lo reexportó ni terminó la modalidad al vencer el plazo, el 31 de enero. La garantía específica que ampara la modalidad sigue vigente. La liquidación preliminar arroja tributos aduaneros por $70.000.000 y una sanción propuesta de $15.000.000, más intereses en curso. La abogada del grupo le pide dejar el expediente listo para el proyecto de decisión y anotar en qué actuación y por qué conceptos se ordenará hacer efectiva la garantía.", "enunciado": "¿Qué debe anotar el Analista en la nota de organización del expediente?", "opciones": [{"t": "Que la efectividad la ordene el Analista en el oficio con que remite el expediente a la abogada", "j": "Es incorrecta. Es plausible porque el Analista tiene a cargo el expediente, pero ordenar la efectividad es una decisión que se adopta en el acto administrativo que declara el incumplimiento (Decreto 1165 de 2019, art. 31), no en un oficio de trámite del Analista. Error de competencia.", "tipo": "competencia"}, {"t": "Que el acto que declare el incumplimiento ordene la efectividad por tributos, sanción e intereses", "j": "Es correcta. El Decreto 1165 de 2019, art. 31, dispone que en el mismo acto administrativo que declare el incumplimiento se ordenará hacer efectiva la garantía por el monto de los tributos aduaneros y sanciones, así como los intereses a que hubiere lugar.", "tipo": null}, {"t": "Que la efectividad se ordene en un acto posterior, cuando quede en firme el que declare el incumplimiento", "j": "Es incorrecta. Es plausible porque parece lógico declarar primero el incumplimiento y luego cobrar, pero el Decreto 1165 de 2019, art. 31, dispone que en el mismo acto que declare el incumplimiento se ordenará hacer efectiva la garantía. Error de fase: separa en dos momentos lo que la norma une.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M033", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#31", "fecha": "2026-10-26"}]}, {"id": "C-E04-009-1", "caso_id": "C-E04-009", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 81", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Natalia Herrera, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, clasifica el 18 de noviembre tres garantías específicas cuyo plazo venció sin que el usuario acreditara el cumplimiento de la obligación. La primera respalda una importación temporal para reexportación en el mismo estado de USD 30.000. La segunda la constituyó Agroinsumos El Llano S.A.S. al declarar con preferencia arancelaria sin tener aún el certificado de origen, por $12.000.000 de tributos. La tercera ampara la finalización de una modalidad de tránsito aduanero. El jefe del grupo le pide separar la que la Ley 2586 de 2026 somete expresamente al procedimiento especial de declaratoria de efectividad; ninguna reglamentación de la DIAN ha agregado otras garantías a ese procedimiento.", "enunciado": "¿Qué garantía debe separar el Analista para ese procedimiento especial?", "opciones": [{"t": "La que ampara la finalización de la modalidad de tránsito aduanero nacional", "j": "Es incorrecta. Es plausible porque el tránsito también se ampara con garantía, pero no figura entre las garantías que enumera expresamente la Ley 2586 de 2026, art. 81, para el procedimiento especial de efectividad. Error de norma: extiende la lista a una garantía que no está en ella.", "tipo": "norma"}, {"t": "La que respalda la importación temporal para reexportación en el mismo estado", "j": "Es incorrecta. Es plausible porque la Ley 2586 de 2026, art. 81, incluye una garantía de importación, pero es la de la modalidad de importación en cumplimiento de garantía, no la de importación temporal. Error de granularidad: confunde dos modalidades de importación.", "tipo": "granularidad"}, {"t": "La que se constituyó para allegar después el certificado de origen", "j": "Es correcta. La Ley 2586 de 2026, art. 81, numeral 1, somete al procedimiento especial la garantía otorgada para allegar el certificado de origen que acredita el tratamiento preferencial, conforme con el art. 185 del Decreto 1165 de 2019; es la que constituyó Agroinsumos El Llano S.A.S.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 81", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#81", "fecha": "2026-10-26"}]}, {"id": "C-E09-010-1", "caso_id": "C-E09-010", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 3", "integra": ["RAZONAMIENTO MATEMATICO"], "caso": "Ricardo León, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, organiza el 21 de septiembre la liquidación preliminar de una importación de Hogar Fácil S.A.S. para el informe que pide su coordinador. Los conceptos registrados son: derechos de aduana por $8.000.000; un impuesto percibido con motivo de la importación por $15.200.000; y un recargo por servicio de pesaje, cuyo monto se limita al costo aproximado del servicio prestado por la aduana, por $400.000. El coordinador pide reportar por separado el total de tributos aduaneros y el de los demás cargos, sin redondear cifras y con el concepto de cada valor.", "enunciado": "¿Qué total de tributos aduaneros debe reportar Ricardo?", "opciones": [{"t": "$8.000.000, porque los tributos aduaneros comprenden los derechos de aduana y excluyen los demás impuestos de la importación.", "j": "Es incorrecta. Es plausible porque los derechos de aduana son el tributo aduanero más típico, pero el Decreto 1165 de 2019, art. 3, incluye además los otros derechos, impuestos o recargos percibidos en la importación o con motivo de ella. Error de norma.", "tipo": "norma"}, {"t": "$23.200.000, porque suma los derechos de aduana y el impuesto, y excluye el recargo por el servicio de pesaje.", "j": "Es correcta. El Decreto 1165 de 2019, art. 3, define los tributos aduaneros como los derechos de aduana y los demás derechos, impuestos o recargos percibidos con motivo de la importación, salvo los recargos limitados al costo aproximado del servicio: $8.000.000 + $15.200.000 = $23.200.000.", "tipo": null}, {"t": "$23.600.000, porque suma los derechos de aduana, el impuesto y el recargo por el servicio de pesaje.", "j": "Es incorrecta. Es plausible porque el recargo también se cobra con motivo de la importación, pero el Decreto 1165 de 2019, art. 3, excluye de los tributos aduaneros los recargos cuyo monto se limita al costo aproximado de los servicios prestados por la aduana. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M070", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Tributos aduaneros»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E09-003-1", "caso_id": "C-E09-003", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 304", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Luisa Pardo, Analista I del punto de atención de una Dirección Seccional de Aduanas, atiende el 14 de julio a la agencia de aduanas que tramita la importación de 300 sensores industriales de Automatización Delta S.A.S., por USD 18.000. La importadora obtuvo en mayo una resolución de clasificación arancelaria de la DIAN para ese mismo producto, expedida a su solicitud con base en sus características técnicas. El declarante pregunta si debe conservar esa resolución junto con la factura, el documento de transporte y la Declaración Andina del Valor, o si basta con citar su número en un correo. La declaración de importación se presentará el 18 de julio y la mercancía está en depósito.", "enunciado": "¿Qué debe indicar Luisa sobre la resolución en la documentación de la operación?", "opciones": [{"t": "Que es documento soporte de la Declaración Andina del Valor y debe anexarse a ese formulario de valoración.", "j": "Es incorrecta. Es plausible porque la Declaración Andina del Valor también es un soporte de la operación, pero el Decreto 1165 de 2019, art. 304, asigna a la resolución de clasificación la calidad de soporte de la declaración de importación, no de la valoración. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que es un concepto orientador sin efecto obligatorio, de modo que basta con mencionarlo en el correo enviado al declarante.", "j": "Es incorrecta. Es plausible porque muchos pronunciamientos de la DIAN tienen carácter orientador, pero el Decreto 1165 de 2019, art. 304, define la resolución de clasificación como acto administrativo de carácter obligatorio. Error de norma.", "tipo": "norma"}, {"t": "Que es documento soporte de la declaración de importación y debe conservarse con los demás soportes de la operación.", "j": "Es correcta. El Decreto 1165 de 2019, art. 304, dispone que la resolución de clasificación arancelaria se constituye en documento soporte de la declaración de importación, por lo que se organiza con la factura, el documento de transporte y la Declaración Andina del Valor.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M064", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 304", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#304", "fecha": "2026-10-26"}]}, {"id": "C-E07-004-1", "caso_id": "C-E07-004", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Aplicar", "fuente": "Ley 2586 de 2026, art. 48", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "Jorge Salas, Analista I del grupo de control de una Dirección Seccional de Aduanas, organiza tres actas de aprehensión levantadas el mismo día en el puerto, cada una a un usuario distinto, para remitirlas a la dependencia que decide. El acta 101 corresponde a mercancía de USD 5.000; el acta 102, a mercancía de USD 6.250, y el acta 103, a mercancía de USD 7.000. La dependencia indicó convertir con una tasa de $4.000 por dólar y usar una UVT de $50.000. Las tres actas tienen causal de aprehensión registrada y ninguna tiene avalúo distinto. El coordinador pidió entregar la clasificación por tipo de proceso antes del cierre de la jornada.", "enunciado": "Según la cuantía, ¿cómo debe clasificar el analista las actas al organizar su remisión?", "opciones": [{"t": "Actas 101 y 102 para decomiso directo; acta 103 para el proceso ordinario", "j": "Es correcta. El art. 48, num. 1, de la Ley 2586 de 2026 permite el decomiso directo cuando la mercancía tiene un valor inferior o igual a 500 UVT (500 x 50.000 = 25.000.000). Acta 101: 5.000 x 4.000 = 20.000.000 (400 UVT); acta 102: 6.250 x 4.000 = 25.000.000 (500 UVT, igual al tope); acta 103: 7.000 x 4.000 = 28.000.000 (560 UVT), que supera el tope.", "tipo": null}, {"t": "Actas 101, 102 y 103 para el proceso ordinario, por su valor conjunto", "j": "Es incorrecta. Suma las tres actas (20.000.000 + 25.000.000 + 28.000.000 = 73.000.000, 1.460 UVT) como si fueran una sola aprehensión; cada acta corresponde a un usuario distinto y el art. 48 de la Ley 2586 de 2026 evalúa el valor de la mercancía de cada aprehensión. Error de granularidad.", "tipo": "granularidad"}, {"t": "Acta 101 para decomiso directo; actas 102 y 103 para el proceso ordinario", "j": "Es incorrecta. Convierte bien los valores, pero trata el tope como estrictamente inferior a 500 UVT y deja por fuera el acta 102, que vale exactamente 500 UVT. El art. 48 de la Ley 2586 de 2026 incluye
