el valor igual a 500 UVT. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M010", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 48", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#48", "fecha": "2026-10-26"}]}, {"id": "C-E06-007-1", "caso_id": "C-E06-007", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Aplicar", "fuente": "Decreto 3568 de 2011, art. 1", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "En el punto de atención de la Dirección Seccional de Impuestos y Aduanas de Medellín, un Analista I recibe el 9 de septiembre de 2026 tres consultas sobre el programa OEA. Rosa Elena Quintero, persona natural con establecimiento de comercio en Itagüí, importa insumos textiles por unos USD 400.000 al año. Global Supply Panamá Inc., sociedad sin domicilio ni sucursal en Colombia, exporta maquinaria hacia Cartagena. Inversiones Llano Verde S.A.S., con sede en Rionegro, administra finca raíz y no realiza operaciones de comercio exterior. El coordinador pide clasificar las consultas según quién puede ser sujeto de la autorización, antes de que la DIAN verifique requisitos y gestión del riesgo.", "enunciado": "¿Qué clasificación de las consultas debe registrar el analista?", "opciones": [{"t": "Puede serlo Rosa Elena Quintero, porque está establecida en Colombia y realiza actividades de la cadena de suministro internacional.", "j": "Es correcta. El Decreto 3568 de 2011, art. 1, define al OEA como la persona natural o jurídica establecida en Colombia que, como parte de la cadena de suministro internacional, realiza actividades reguladas por la legislación aduanera. Global Supply Panamá no está establecida en Colombia e Inversiones Llano Verde no hace parte de esa cadena; la verificación posterior de requisitos y riesgo corresponde al art. 22 del Decreto 1165 de 2019.", "tipo": null}, {"t": "Pueden serlo Rosa Elena Quintero y Global Supply Panamá Inc., porque ambas forman parte activa de la cadena de suministro internacional.", "j": "Es incorrecta. Es plausible porque las dos participan en la cadena de suministro, pero el Decreto 3568 de 2011, art. 1, exige además estar establecido en Colombia, condición que no cumple Global Supply Panamá. Aplica solo uno de los elementos de la definición (error de granularidad).", "tipo": "granularidad"}, {"t": "No procede para ninguna, porque la autorización OEA se reserva a personas jurídicas que ya operan en comercio exterior.", "j": "Es incorrecta. Es plausible porque muchos operadores autorizados son sociedades, pero el Decreto 3568 de 2011, art. 1, admite a la persona natural o jurídica establecida en Colombia. Excluye a Rosa Elena Quintero con un requisito que la norma no exige (error de norma).", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M044", "norma": "Decreto 3568 de 2011 (Operador Económico Autorizado)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_3568_2011.htm#1", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#22", "fecha": "2026-10-26"}]}, {"id": "C-E04-008-1", "caso_id": "C-E04-008", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Aplicar", "fuente": "Ley 2586 de 2026, art. 43", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "Sergio Patiño, Analista I del punto de atención de una Dirección Seccional de Impuestos y Aduanas, atiende el 2 de abril a Distribuidora Nogales S.A.S., a la que le aprehendieron 300 tabletas electrónicas por no estar amparadas en una declaración de importación. La mercancía tiene valor FOB de USD 40.000, no tiene restricciones legales ni administrativas para su importación y aún corre el término para presentar el escrito de objeción a la aprehensión. La empresa quiere solicitar la entrega de las tabletas antes de la decisión de fondo y pide orientación sobre la garantía que debe aportar con la solicitud para que esta se organice completa.", "enunciado": "¿Qué condiciones de la garantía debe verificar el Analista al organizar la solicitud?", "opciones": [{"t": "Garantía por USD 30.000, equivalente al 75 % del valor FOB, con término de 15 meses", "j": "Es incorrecta. Es plausible porque el 75 % aparece en la misma norma, pero corresponde al valor de rescate de la mercancía decomisada; la Ley 2586 de 2026, art. 43, exige una garantía equivalente al 100 % del valor FOB. Error de norma: toma el porcentaje de otra figura.", "tipo": "norma"}, {"t": "Garantía por USD 40.000, equivalente al 100 % del valor FOB, con término de 15 meses", "j": "Es correcta. La Ley 2586 de 2026, art. 43, permite la entrega de mercancía aprehendida sin restricciones, antes de la decisión de fondo, previa garantía equivalente al 100 % del valor FOB o del avalúo, otorgada dentro del término para el escrito de objeción y constituida por 15 meses.", "tipo": null}, {"t": "Garantía por USD 40.000, equivalente al 100 % del valor FOB, con término de 24 meses", "j": "Es incorrecta. Es plausible porque el monto es correcto y 24 meses es la vigencia mínima de las garantías globales bancarias o de seguros, pero la Ley 2586 de 2026, art. 43, fija para la garantía en reemplazo de aprehensión un término de 15 meses. Error de norma: aplica el plazo de otra garantía.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M035", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#43", "fecha": "2026-10-26"}]}, {"id": "C-E06-003-1", "caso_id": "C-E06-003", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Analizar", "fuente": "Decreto 3568 de 2011, art. 8", "integra": ["CONTROLES ADUANEROS"], "caso": "Un Analista I del grupo de control de la Dirección Seccional de Aduanas de Buenaventura organiza el informe mensual de septiembre de 2026 sobre Agroexportadora del Pacífico S.A.S., autorizada como Operador Económico Autorizado. En el mes la empresa tuvo tres operaciones: una exportación de 18 contenedores de banano, una importación de fertilizantes por USD 150.000 y un tránsito aduanero de maquinaria hacia Bogotá. La Policía Nacional inspeccionó físicamente la importación y la exportación. El jefe del grupo pide que el informe distinga, por operación y por autoridad, dónde aplica el beneficio de disminución de controles del programa OEA, para revisar si los criterios de selectividad lo están reconociendo.", "enunciado": "¿Qué clasificación del beneficio debe quedar consignada en el informe?", "opciones": [{"t": "Disminución de inspecciones de la DIAN y de la Policía Nacional en las tres operaciones, por tratarse de un usuario OEA.", "j": "Es incorrecta. Es plausible porque la DIAN sí disminuye sus controles en las tres operaciones, pero el Decreto 3568 de 2011, art. 8, numeral 8.1.5, limita la disminución de inspecciones físicas de la Policía Nacional a las exportaciones. Extiende el beneficio de una autoridad a operaciones que la norma no cubre (error de granularidad).", "tipo": "granularidad"}, {"t": "Disminución de controles de la DIAN en las tres operaciones y de inspecciones físicas de la Policía Nacional solo en la exportación.", "j": "Es correcta. El Decreto 3568 de 2011, art. 8, numeral 8.1.5, prevé la disminución de reconocimientos e inspecciones físicas y documentales de la DIAN en exportación, importación y tránsito aduanero, y la disminución de inspecciones físicas de la Policía Nacional solo para exportaciones. La inspección policial de la importación queda por fuera del beneficio.", "tipo": null}, {"t": "Disminución de inspecciones de la DIAN y de la Policía Nacional solo en la exportación, sin beneficio en la importación ni en el tránsito.", "j": "Es incorrecta. Es plausible porque acierta en el alcance del beneficio frente a la Policía Nacional, pero omite que el Decreto 3568 de 2011, art. 8, numeral 8.1.5, también prevé la disminución de controles de la DIAN en importación y tránsito aduanero. Resuelve solo una parte de la clasificación (error de completitud).", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M046", "norma": "Decreto 3568 de 2011 (Operador Económico Autorizado)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_3568_2011.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E05-006-1", "caso_id": "C-E05-006", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 1", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Ricardo Salas, Analista I del punto de atención de una Dirección Seccional de Aduanas, recibe el 11 de julio a la representante de Transportes Altiplano S.A.S. La empresa movilizó en tránsito aduanero, desde el puerto hasta una ciudad del interior, 2 contenedores con mercancía de USD 64.000; el trayecto de 1.100 km terminó con 3 días de retraso frente al plazo autorizado. La representante sostiene que, una vez la carga sale del puerto de llegada, las normas aduaneras dejan de aplicarse y que la demora es un asunto contractual con el importador. Ricardo debe orientarla sobre el ámbito de aplicación del régimen de aduanas, sin pronunciarse sobre una eventual sanción, que le corresponde a otra dependencia.", "enunciado": "¿Qué orientación corresponde dar a la representante de la transportadora?", "opciones": [{"t": "Que el régimen de aduanas regula el ingreso y la salida de la mercancía, y el traslado interno se rige por el contrato de transporte.", "j": "Es incorrecta. Es plausible porque el transporte sí tiene un contrato entre particulares. Falla porque el Decreto 1165 de 2019, art. 1, regula también la permanencia y el traslado de las mercancías, y el tránsito aduanero se rige por la norma aduanera. Error de norma.", "tipo": "norma"}, {"t": "Que el régimen de aduanas se aplica en todo el territorio aduanero nacional y regula también el traslado de la mercancía.", "j": "Es correcta. El Decreto 1165 de 2019, art. 1, se aplica en la totalidad del Territorio Aduanero Nacional y regula las relaciones con quienes intervienen en el ingreso, permanencia, traslado y salida de las mercancías. El Decreto 1742 de 2020, art. 3, incluye el tránsito entre los destinos que la DIAN controla.", "tipo": null}, {"t": "Que el régimen de aduanas se aplica en los puertos y pasos de frontera, que son los lugares por donde la mercancía ingresa al país.", "j": "Es incorrecta. Es plausible porque el ingreso de la mercancía ocurre en esos lugares. Falla porque el Decreto 1165 de 2019, art. 1, dispone que el decreto se aplica en la totalidad del Territorio Aduanero Nacional y no en algunos puntos de él. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M042", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#1", "fecha": "2026-10-26"}, {"fila": "M039", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E05-009-1", "caso_id": "C-E05-009", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Camila Herrera, Analista I del punto de atención de una Dirección Seccional de Impuestos y Aduanas, atiende el 26 de mayo al contador de Importadora Los Robles S.A.S. La empresa nacionalizó equipos médicos por USD 30.000 y pagó en la declaración de importación un arancel del 5 % y un IVA del 19 %. Ahora el municipio donde vende los equipos le exige el impuesto de industria y comercio, y el contador pregunta si debe presentar ante la DIAN su inconformidad con ese cobro junto con una consulta sobre el IVA pagado. Camila debe orientarlo según los asuntos que competen a la entidad, sin resolver el fondo de ninguna de las dos consultas.", "enunciado": "¿Qué orientación debe dar Camila sobre la entidad que conoce cada asunto?", "opciones": [{"t": "Que la DIAN conoce lo relativo al IVA y a los derechos de aduana, y el impuesto municipal le corresponde al municipio.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, atribuye a la DIAN la administración del impuesto sobre las ventas y de los derechos de aduana, así como de los demás impuestos internos del orden nacional. El impuesto de industria y comercio es municipal y no está en esa competencia.", "tipo": null}, {"t": "Que la DIAN conoce los dos asuntos, porque el impuesto municipal se causó con ocasión de una operación de comercio exterior.", "j": "Es incorrecta. Es plausible porque los equipos ingresaron por una importación. Falla porque el Decreto 1742 de 2020, art. 1, asigna a la DIAN los impuestos del orden nacional cuya competencia no esté asignada a otras entidades, y el impuesto municipal es del orden territorial. Error de competencia.", "tipo": "competencia"}, {"t": "Que la DIAN conoce los derechos de aduana, y tanto el IVA como el impuesto municipal le corresponden a la entidad territorial.", "j": "Es incorrecta. Es plausible porque acierta en los derechos de aduana y en el impuesto municipal. Falla porque el Decreto 1742 de 2020, art. 1, también asigna a la DIAN el impuesto sobre las ventas, que es un impuesto nacional, incluso cuando se paga en la importación. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M037", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E03-005-1", "caso_id": "C-E03-005", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 27", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Diego Salazar, Analista I de la ventanilla de trámites aduaneros de la Dirección Seccional de Aduanas de Cúcuta, consolida en septiembre 14 quejas de usuarios de importación temporal y de tránsito aduanero. Según las quejas, en Cúcuta se exigen 3 documentos soporte para un trámite que en la Dirección Seccional de Aduanas de Cartagena se atiende con 2, y el tiempo de respuesta pasa de 2 a 6 días hábiles. Ninguna queja alega una infracción ni una solicitud de autorización especial; todas piden uniformidad en la atención. El jefe de la seccional pide identificar a qué dependencia debe ir el informe para que la práctica se armonice entre seccionales.", "enunciado": "Tras analizar el objeto de las quejas, ¿a qué dependencia corresponde dirigir el informe consolidado?", "opciones": [{"t": "A la Subdirección que resuelve las solicitudes OEA, por tratarse de usuarios frecuentes.", "j": "Es incorrecta. Es plausible porque los usuarios frecuentes podrían ser candidatos a OEA y esa Subdirección trabaja con operadores. Falla porque el Decreto 1742 de 2020, art. 25, num. 1, le asigna resolver solicitudes de autorización OEA, y las quejas no versan sobre esa autorización sino sobre la atención de regímenes, que corresponde al art. 27, num. 1. Error de norma: aplica la función de otra dependencia.", "tipo": "norma"}, {"t": "A la Subdirección que dirige la facilitación del servicio en la aplicación de regímenes.", "j": "Es correcta. El Decreto 1742 de 2020, art. 27, num. 1, asigna a esa Subdirección dirigir las actividades de facilitación del servicio de la operación aduanera en relación con la debida aplicación de los regímenes aduaneros, para su ejecución en las Direcciones Seccionales. Las quejas piden uniformidad entre seccionales en la atención de importación temporal y tránsito.", "tipo": null}, {"t": "A la Dirección Seccional de Aduanas de Cartagena, cuya práctica sirve de modelo a Cúcuta.", "j": "Es incorrecta. Es plausible porque Cartagena exige menos documentos y responde más rápido, y es una seccional del mismo nivel. Falla porque una seccional no dirige la actividad de otra; el Decreto 1742 de 2020, art. 27, num. 1, asigna a una dependencia de la estructura central dirigir la facilitación del servicio en la aplicación de los regímenes para su ejecución en las seccionales. Error de granularidad: ubica la solución en el nivel local.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M025", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 27", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#27", "fecha": "2026-10-26"}]}, {"id": "C-E03-006-1", "caso_id": "C-E03-006", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 70", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "Carolina Restrepo, Analista I de apoyo a fiscalización aduanera de la Dirección Seccional de Aduanas de Medellín, participa el 7 de octubre en una diligencia de control en un depósito de la ciudad. Se hallan 120 cajas de calzado por un valor estimado de USD 12.000 sin la declaración de importación que soporte su ingreso al país. El funcionario a cargo levanta el acta y pide a la analista ordenar el registro fotográfico, el inventario y los documentos aportados por el tenedor en un plazo de 2 días hábiles. El tenedor exige que la analista le informe allí mismo el monto de la sanción y le permita pagarla para cerrar el asunto.", "enunciado": "¿Qué actuación debe aplicar la analista frente al hallazgo de la diligencia?", "opciones": [{"t": "Enviar el expediente al nivel central, que investiga las infracciones de todas las seccionales.", "j": "Es incorrecta. Es plausible porque el nivel central dirige y coordina a las seccionales y el valor del hallazgo es alto. Falla porque el Decreto 1742 de 2020, art. 70, num. 14, asigna a las Direcciones Seccionales investigar y sancionar las infracciones aduaneras de acuerdo con su jurisdicción. Error de granularidad: sube el asunto a un nivel distinto del que tiene la función.", "tipo": "granularidad"}, {"t": "Organizar el expediente para que la seccional investigue y decida la infracción en su jurisdicción.", "j": "Es correcta. El Decreto 1742 de 2020, art. 70, nums. 13 y 14, asigna a las Direcciones Seccionales cumplir y hacer cumplir las normas aduaneras y prevenir, reprimir, investigar y sancionar las infracciones de acuerdo con su jurisdicción. La analista prepara y ordena la documentación en el plazo dado para que la seccional de Medellín actúe.", "tipo": null}, {"t": "Liquidar la sanción en el acta e indicar al tenedor el valor que debe pagar en la diligencia.", "j": "Es incorrecta. Es plausible porque el tenedor pide una salida rápida y la seccional tiene la función de sancionar, según el Decreto 1742 de 2020, art. 70, num. 14. Falla porque esa función se ejerce por la seccional conforme a las normas vigentes y tras investigar; el Analista I prepara la documentación y no impone sanciones. Error de competencia: atribuye a la analista una decisión de fondo.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M026", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 70", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#70", "fecha": "2026-10-26"}]}, {"id": "C-E06-008-1", "caso_id": "C-E06-008", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 22", "integra": ["CONTROLES ADUANEROS"], "caso": "Un Analista I del grupo de registro y OEA de la Dirección Seccional de Aduanas de Bogotá prepara el 1 de octubre de 2026 el expediente de la solicitud OEA de Químicos Sabana S.A.S., importadora con operaciones por USD 12 millones en 2025. La lista de chequeo muestra 14 de 16 requisitos verificados; faltan el estudio de seguridad del asociado de transporte y la visita de validación a la planta. El área de gestión del riesgo aún no ha emitido el perfil de la empresa. Un compañero sugiere enviar el expediente para autorización por el volumen de operaciones y porque la empresa no registra sanciones, y completar lo pendiente después de la decisión.", "enunciado": "¿Qué paso corresponde al analista en esta fase del trámite?", "opciones": [{"t": "Completar la verificación de los dos requisitos pendientes y obtener el perfil de riesgo antes de enviar el expediente a decisión.", "j": "Es correcta. El Decreto 1165 de 2019, art. 22, condiciona la autorización al cumplimiento previo de los requisitos y a la aplicación del sistema de gestión del riesgo. Con dos requisitos sin verificar y sin perfil de riesgo, el expediente no está listo para que la autoridad competente decida.", "tipo": null}, {"t": "Remitir el expediente con base en el volumen de operaciones y la ausencia de sanciones, sin esperar el perfil de riesgo.", "j": "Es incorrecta. Es plausible porque el volumen y el historial son información útil, pero el Decreto 1165 de 2019, art. 22, toma como base el sistema de gestión del riesgo y el cumplimiento de requisitos, no el tamaño de las operaciones. Sustituye el criterio legal por otro (error de norma).", "tipo": "norma"}, {"t": "Remitir el expediente para decisión y completar después de ella los dos requisitos pendientes y el perfil de riesgo de la empresa.", "j": "Es incorrecta. Es plausible porque al final se verificaría todo, pero el Decreto 1165 de 2019, art. 22, exige que el cumplimiento de requisitos sea previo a la autorización. Invierte el orden del procedimiento (error de fase).", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M047", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#22", "fecha": "2026-10-26"}]}, {"id": "C-E06-004-1", "caso_id": "C-E06-004", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 77", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "La Analista I del grupo de registro y OEA de la Dirección Seccional de Aduanas de Santa Marta recibe el 8 de septiembre de 2026 un informe de la división de control. El 3 de septiembre, en un contenedor de Frutas del Magdalena S.A.S., exportador autorizado como Operador Económico Autorizado, se halló una sustancia no declarada durante una inspección. La carga había sido entregada por la transportadora Rutas del Norte Ltda., asociado de negocio registrado por el exportador. La visita de seguimiento de julio de 2026 había encontrado al día los requisitos mínimos de seguridad del exportador. El jefe pide preparar el borrador de la documentación con la causal que corresponde a los hechos, sin calificar todavía la responsabilidad.", "enunciado": "¿En qué causal debe encuadrar la analista la documentación que prepara?", "opciones": [{"t": "Suspensión de beneficios por materialización de un incidente en operaciones realizadas a través de un asociado de negocio.", "j": "Es correcta. La Ley 2586 de 2026, art. 77, numeral 2, señala como causal de suspensión de beneficios la materialización de un incidente en las operaciones de comercio exterior del OEA o de sus asociados de negocio. El hallazgo ocurrió en una carga entregada por la transportadora registrada como asociado, mientras los requisitos de seguridad del exportador estaban al día.", "tipo": null}, {"t": "Cancelación de la autorización por obtención de la calidad de OEA mediante medios irregulares o fraudulentos comprobados.", "j": "Es incorrecta. Es plausible por la gravedad del hallazgo, pero la causal de la Ley 2586 de 2026, art. 79, numeral 1, se refiere a la forma en que se obtuvo la autorización, hecho que el caso no menciona. Aplica la figura de cancelación en lugar de la de suspensión (error de norma).", "tipo": "norma"}, {"t": "Suspensión de beneficios por incumplimiento de las obligaciones, condiciones o requisitos mínimos de seguridad del exportador.", "j": "Es incorrecta. Es plausible porque es otra causal de suspensión del mismo artículo, pero la Ley 2586 de 2026, art. 77, numeral 1, exige un incumplimiento de requisitos, y la visita de julio los encontró al día. Elige el numeral que no corresponde a los hechos del caso (error de granularidad).", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M049", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 77", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#77", "fecha": "2026-10-26"}]}, {"id": "C-E04-005-1", "caso_id": "C-E04-005", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 30", "integra": ["RAZONAMIENTO MATEMATICO"], "caso": "Daniela Ospina, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, prepara el 20 de septiembre la verificación de la primera renovación de la garantía global de Depósito Logístico La Ensenada S.A.S. Cuando se constituyó la garantía, el monto exigido por la norma era de $800.000.000, pero la empresa la expidió voluntariamente por $1.000.000.000. Desde entonces no hubo efectividades ni cambios en la habilitación; la empresa no tiene sanciones en firme por infracciones graves o gravísimas en los últimos 36 meses y está al día en sus obligaciones tributarias, aduaneras y cambiarias. La garantía vence el 30 de octubre. La empresa radicó el proyecto de renovación y pide conocer el monto mínimo que debe asegurar, para que el expediente se organice sin devoluciones antes del vencimiento.", "enunciado": "¿Qué monto mínimo debe verificar el Analista en el proyecto de renovación?", "opciones": [{"t": "$750.000.000, equivalentes al 75 % del valor por el que se expidió la garantía", "j": "Es incorrecta. Es plausible porque aplica el porcentaje correcto, pero lo calcula sobre $1.000.000.000, valor expedido voluntariamente, cuando el Decreto 1165 de 2019, art. 30, toma como base el monto exigido para la constitución. Error de granularidad: base de cálculo equivocada.", "tipo": "granularidad"}, {"t": "$600.000.000, equivalentes al 75 % del monto exigido al constituir la garantía", "j": "Es correcta. El Decreto 1165 de 2019, art. 30, numeral 2.1, dispone que para la primera renovación el monto será del 75 % del monto exigido para la constitución: 75 % de $800.000.000 da $600.000.000. El mayor valor que la empresa expidió por voluntad propia no cambia la base.", "tipo": null}, {"t": "$800.000.000, equivalentes al 100 % del monto exigido al constituir la garantía", "j": "Es incorrecta. Es plausible porque mantener el monto exigido parece la opción más segura, pero el Decreto 1165 de 2019, art. 30, numeral 2.1, reduce el monto de la primera renovación al 75 % del exigido. Error de norma: omite la disminución que fija la norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M032", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 30", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#30", "fecha": "2026-10-26"}]}, {"id": "C-E03-007-1", "caso_id": "C-E03-007", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 6", "integra": ["GARANTIAS ADUANERAS"], "caso": "Mateo Galeano, Analista I del grupo de registro y OEA de la Dirección Seccional de Aduanas de Medellín, prepara el traslado del expediente de Agencia Andes Carga S.A.S., que cambió su domicilio a Bogotá el 1 de julio. La empresa informa que el 70 % de sus importaciones llega por vía aérea y el 30 % por carretera, y que mantiene una garantía global vigente por COP 200 millones. El formato de traslado pide listar las direcciones seccionales de aduanas del nivel local con sede en la nueva ciudad, para que el usuario sepa dónde gestionar sus trámites. El analista debe entregar el formato antes del 10 de julio y con dependencias de la estructura vigente.", "enunciado": "¿Qué dependencias debe registrar el analista en el formato de traslado?", "opciones": [{"t": "Las seccionales de Aduanas de Bogotá y de Bogotá - Aeropuerto El Dorado, del nivel local.", "j": "Es correcta. El Decreto 1742 de 2020, art. 6, incluye en el nivel local, dentro de las Direcciones Seccionales de Aduanas, la Dirección Seccional de Aduanas de Bogotá y la Dirección Seccional de Aduanas de Bogotá - Aeropuerto El Dorado. Son las dos sedes aduaneras del nivel local en la nueva ciudad del usuario.", "tipo": null}, {"t": "Las seccionales de Impuestos y de Aduanas de Bogotá, como sedes del nivel local.", "j": "Es incorrecta. Es plausible porque ambas figuran en el nivel local del Decreto 1742 de 2020, art. 6, con sede en Bogotá. Falla porque el formato pide seccionales de aduanas y la de Impuestos de Bogotá aparece en el grupo de Direcciones Seccionales de Impuestos, mientras que se omite la de Bogotá - Aeropuerto El Dorado. Error de norma: lee mal la lista del artículo.", "tipo": "norma"}, {"t": "La Dirección Seccional de Aduanas de Bogotá, como sede aduanera de toda la ciudad capital.", "j": "Es incorrecta. Es plausible porque esa seccional lleva el nombre de la ciudad y figura en el nivel local del Decreto 1742 de 2020, art. 6. Falla porque el mismo artículo lista en Bogotá dos seccionales de aduanas: la de Bogotá y la de Bogotá - Aeropuerto El Dorado; omitir esta última deja fuera la vía aérea de la empresa. Error de granularidad: reduce a una sede lo que la estructura divide en dos.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M021", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E06-001-1", "caso_id": "C-E06-001", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 23", "integra": ["GARANTIAS ADUANERAS"], "caso": "Una Analista I de garantías de la Dirección Seccional de Aduanas de Cartagena recibe el 14 de agosto de 2026 dos oficios sobre la garantía de $200.000.000 que respalda sus obligaciones aduaneras como importadoras (no se trata de una garantía en reemplazo de medida cautelar). El primero es de Textiles del Caribe S.A.S., autorizada como Operador Económico Autorizado mediante resolución del 2 de febrero de 2025 en el tipo de usuario importador, que no registra suspensión ni cancelación. El segundo es de Logística Puerto Claro S.A.S., que radicó su solicitud de autorización OEA el 10 de junio de 2026 y cuyo trámite sigue en verificación de requisitos. Ambas piden que se les exima de constituir la garantía. La coordinadora exige que cada expediente refleje la situación jurídica actual.", "enunciado": "¿Cómo debe organizar la analista la documentación de las dos peticiones?", "opciones": [{"t": "Registrar para Textiles del Caribe el tratamiento de no constituir garantía y mantener para Logística Puerto Claro el trámite de la garantía.", "j": "Es correcta. El Decreto 1165 de 2019, art. 23, numeral 2.1, reconoce al usuario autorizado el tratamiento de no constituir garantías para respaldar sus obligaciones aduaneras. Textiles del Caribe tiene autorización vigente sin suspensión ni cancelación; Logística Puerto Claro solo tiene una solicitud en verificación y por eso sigue sujeta al trámite ordinario.", "tipo": null}, {"t": "Registrar para Textiles del Caribe una reducción del cincuenta por ciento de la garantía y exigir a Logística Puerto Claro la garantía por su valor total.", "j": "Es incorrecta. Acierta al tratar distinto a las dos empresas, pero para las obligaciones aduaneras que respalda la garantía del caso el Decreto 1165 de 2019, art. 23, numeral 2.1, reconoce al usuario autorizado el tratamiento de no constituir garantías, no una reducción de su valor. Error de norma.", "tipo": "norma"}, {"t": "Registrar para ambas empresas el tratamiento de no constituir garantía, porque las dos ya iniciaron ante la DIAN su trámite como OEA.", "j": "Es incorrecta. Es plausible porque ambas empresas están vinculadas al programa OEA, pero el beneficio del Decreto 1165 de 2019, art. 23, numeral 2.1, nace de la autorización otorgada y no de la radicación de la solicitud. Adelanta a Logística Puerto Claro un efecto que corresponde a una etapa posterior del trámite (error de fase).", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M048", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 23", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#23", "fecha": "2026-10-26"}]}, {"id": "C-E05-010-1", "caso_id": "C-E05-010", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Sergio Vargas, Analista I del grupo de control de una Dirección Seccional de Aduanas, prepara el 3 de noviembre la documentación sobre Flores del Valle S.A.S., empresa exportadora. En 6 declaraciones de exportación del semestre la empresa declaró un valor FOB total de USD 300.000, pero los reintegros canalizados por el mercado cambiario suman USD 390.000, y una parte de los gastos de transporte asociados se pagó en el exterior. El coordinador le pide establecer si esa diferencia de USD 90.000 entra en el campo de control de la entidad o si debe archivarse, porque la mercancía ya fue embarcada y salió del territorio aduanero nacional.", "enunciado": "¿Qué debe consignar Sergio en la documentación sobre el alcance del control?", "opciones": [{"t": "Que la diferencia se archiva, porque la mercancía salió del territorio y la operación aduanera quedó cumplida con el embarque.", "j": "Es incorrecta. Es plausible porque el embarque cierra la etapa física de la exportación. Falla porque el Decreto 1165 de 2019, art. 1, regula también la salida de las mercancías y el Decreto 1742 de 2020, art. 3, numeral 3, mantiene el control de las obligaciones de la exportación después del embarque. Error de fase.", "tipo": "fase"}, {"t": "Que la diferencia entra en el control de la DIAN sobre obligaciones aduaneras y cambiarias, incluida la posible sobrefacturación.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, numeral 3, asigna a la DIAN controlar y vigilar las obligaciones aduaneras y cambiarias por exportación, los gastos asociados y la sobrefacturación. La diferencia de USD 90.000 y los gastos pagados en el exterior caben en ese control.", "tipo": null}, {"t": "Que la diferencia entra en el control de la DIAN, pero limitado a la obligación aduanera, porque los reintegros son asuntos privados.", "j": "Es incorrecta. Es plausible porque reconoce que la operación sigue sujeta a control. Falla porque el Decreto 1742 de 2020, art. 3, numeral 3, incluye las obligaciones cambiarias de la exportación, a las que pertenecen los reintegros. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M040", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}, {"fila": "M042", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E02-007-1", "caso_id": "C-E02-007", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 578", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Paula Gómez, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, valida los reportes semanales del grupo de control. Agroinsumos La Pradera S.A.S. presentó el 2 de octubre de 2026 una declaración de importación anticipada por 600 sacos de fertilizante por USD 45.000; el buque llegará el 12 de octubre. El 6 de octubre el grupo de control revisó los datos de esa declaración y de su factura, con la mercancía todavía en altamar. Un compañero registró la actuación como control previo porque la carga no había llegado. Paula debe corregir o confirmar el registro antes del cierre semanal, previsto para el 9 de octubre.", "enunciado": "¿Cómo debe quedar registrada la actuación en el reporte que valida Paula?", "opciones": [{"t": "Como control previo, porque ocurrió antes de la llegada del buque y de la descarga de la mercancía.", "j": "Es incorrecta. Es plausible porque la mercancía seguía en altamar, pero el Decreto 1165 de 2019, art. 578, numeral 1, toma como referencia la presentación de la declaración y no la llegada del medio de transporte; aquí la declaración ya estaba presentada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Como control posterior, porque la revisión documental de una declaración corresponde a la fiscalización.", "j": "Es incorrecta. Es plausible porque la fiscalización revisa declaraciones y documentos, pero el Decreto 1165 de 2019, art. 578, numeral 3, reserva el control posterior a lo ejercido después de la nacionalización, que en este caso no ha ocurrido. Error de norma.", "tipo": "norma"}, {"t": "Como control simultáneo, porque ocurrió tras presentar la declaración y antes de la nacionalización.", "j": "Es correcta. El Decreto 1165 de 2019, art. 578, numeral 2, define el control simultáneo como el ejercido desde la presentación de la declaración aduanera hasta la nacionalización. La declaración anticipada se presentó el 2 de octubre y la revisión ocurrió el 6, de modo que el registro del compañero debe corregirse aunque la carga no haya llegado.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M015", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 578", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#578", "fecha": "2026-10-26"}]}, {"id": "C-E07-002-1", "caso_id": "C-E07-002", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Aplicar", "fuente": "Ley 2586 de 2026, art. 43", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "GARANTIAS ADUANERAS"], "caso": "Andrés Peña, Analista I del grupo de garantías de una Dirección Seccional de Impuestos y Aduanas, recibe la solicitud de Ferretería Los Cerros S.A.S. para que le entreguen unas herramientas aprehendidas antes de la decisión de fondo. La mercancía no tiene restricciones para su importación y la solicitud llegó dentro del término para presentar el escrito de objeción. Según los documentos del expediente, el valor FOB de las herramientas, expresado en pesos, es $80.000.000; el flete internacional fue $5.000.000 y el seguro $1.000.000. Aún no se ha practicado avalúo. El usuario adjunta una póliza por $60.000.000, porque afirma que con ese valor podría rescatar la mercancía, y pide que se tramite sin cambios.", "enunciado": "Al organizar la documentación de la garantía en reemplazo de aprehensión, ¿qué monto y qué término debe verificar el analista en la póliza?", "opciones": [{"t": "$80.000.000, constituida por un término de quince meses", "j": "Es correcta. El art. 43 de la Ley 2586 de 2026 exige una garantía equivalente al 100 % del valor FOB o del avalúo, según el caso, constituida por un término de 15 meses. Como no hay avalúo, la base es el valor FOB: 80.000.000 x 100 % = 80.000.000. La póliza de 60.000.000 resulta insuficiente.", "tipo": null}, {"t": "$86.000.000, constituida por un término de quince meses", "j": "Es incorrecta. Suma al valor FOB el flete y el seguro (80.000.000 + 5.000.000 + 1.000.000 = 86.000.000), como si la base fuera el valor CIF; el art. 43 de la Ley 2586 de 2026 toma el 100 % del valor FOB o del avalúo, y en este caso no hay avalúo. Error de granularidad.", "tipo": "granularidad"}, {"t": "$60.000.000, constituida por un término de quince meses", "j": "Es incorrecta. Toma el 75 % del valor FOB (80.000.000 x 0,75 = 60.000.000), cifra que el art. 43 de la Ley 2586 de 2026 usa para el rescate de la mercancía decomisada y no para el monto de la garantía, que debe ser del 100 %. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M035", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#43", "fecha": "2026-10-26"}]}, {"id": "C-E09-001-1", "caso_id": "C-E09-001", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 298", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Marta Quintero, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, recibe el 3 de marzo una solicitud de Textiles del Litoral S.A.S. La empresa pide una resolución anticipada sobre el origen de dos embarques de hilados. El primero ingresó con declaración de importación aceptada el 20 de febrero y obtuvo levante el 24 de febrero. El segundo, por USD 40.000, se embarcará en abril con el mismo proveedor y al amparo del mismo acuerdo comercial. La empresa adjunta facturas, fichas técnicas y la declaración del productor. El jefe del grupo pide a Marta organizar la solicitud antes de pasarla al área que estudia el fondo y separar lo que procede de lo que no procede.", "enunciado": "¿Cómo debe organizar Marta la solicitud recibida?", "opciones": [{"t": "Devolverla completa, porque la resolución anticipada solo puede versar sobre clasificación arancelaria y no sobre el origen.", "j": "Es incorrecta. Es plausible porque la clasificación es el uso más conocido de la figura, pero el Decreto 1165 de 2019, art. 298, numeral 3, permite expedir resoluciones anticipadas sobre si una mercancía es originaria. Error de norma.", "tipo": "norma"}, {"t": "Tramitarla respecto del embarque de abril, porque la resolución anticipada se expide antes de la importación de la mercancía.", "j": "Es correcta. El Decreto 1165 de 2019, art. 298, define la resolución anticipada como el acto que se expide antes de la importación de una mercancía; el primer embarque ya se importó, con declaración aceptada y levante, de modo que la solicitud solo encaja para el embarque de abril.", "tipo": null}, {"t": "Tramitarla respecto de ambos embarques, porque el primero aún puede revisarse mientras no venza el plazo de firmeza de la declaración.", "j": "Es incorrecta. Es plausible porque la declaración del primer embarque todavía puede ser objeto de control, pero el Decreto 1165 de 2019, art. 298, ubica la resolución anticipada antes de la importación, y esa fase ya pasó para el embarque de febrero. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M063", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 298", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#298", "fecha": "2026-10-26"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 576", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Sandra Vélez, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Impuestos y Aduanas, prepara el 15 de julio de 2026 el requerimiento de información que el jefe de división firmará en una investigación a Muebles Sabana Real S.A.S. En 2025 la empresa importó tableros por USD 90.000 dentro de un programa de 18 meses para fabricar muebles de exportación, y debe demostrar el uso de los insumos importados. En una visita previa, su contador se negó a mostrar los libros de inventario y alegó que la DIAN solo puede revisar declaraciones aduaneras. El requerimiento debe precisar qué registros se piden y con qué fundamento.", "enunciado": "¿Qué fundamento debe consignar Sandra en el requerimiento para pedir los registros?", "opciones": [{"t": "Que el control se limita a la declaración de importación de los tableros y a su factura comercial.", "j": "Es incorrecta. Es plausible porque la declaración y la factura son los soportes más visibles, pero el Decreto 1165 de 2019, art. 581, incluye las operaciones de perfeccionamiento, y probar el uso de los insumos exige los registros de inventario. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que la revisión de los libros se apoya en las normas del impuesto de renta, aplicables a los importadores.", "j": "Es incorrecta. Es plausible porque los libros también tienen efectos tributarios, pero la facultad de revisarlos dentro del control aduanero está en el Decreto 1165 de 2019, art. 576, y el art. 581 la extiende a las operaciones de perfeccionamiento; acudir a la norma de renta equivoca el fundamento. Error de norma.", "tipo": "norma"}, {"t": "Que el control puede revisar la contabilidad y los registros del usuario y las operaciones de perfeccionamiento.", "j": "Es correcta. El Decreto 1165 de 2019, art. 576, permite que el control consista en revisar la contabilidad y demás registros de los usuarios aduaneros, y el art. 581 dispone que el control posterior recae sobre las operaciones de perfeccionamiento y el cumplimiento de los requisitos de la modalidad. La negativa del contador no tiene sustento.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M014", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 576", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#576", "fecha": "2026-10-26"}, {"fila": "M018", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 581", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#581", "fecha": "2026-10-26"}]}, {"id": "C-E04-010-1", "caso_id": "C-E04-010", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 29", "integra": ["CONTROLES ADUANEROS"], "caso": "Julián Escobar, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, revisa el 5 de julio la póliza global que presentó Puerto Seco del Norte S.A.S. dentro del trámite de habilitación como depósito público. La póliza, de compañía de seguros, tiene un valor de $700.000.000 y vigencia de 24 meses. Su objeto dice: «asegurar el pago de los tributos aduaneros de las mercancías almacenadas en el depósito». La aseguradora explica que excluyó sanciones e intereses porque, a su juicio, la garantía responde por la obligación tributaria principal. El expediente debe pasar a revisión del jefe del grupo el 9 de julio con las observaciones del Analista.", "enunciado": "¿Qué observación debe dejar el Analista sobre el objeto asegurable de la póliza?", "opciones": [{"t": "Que debe indicar la disposición legal de cada obligación, como se exige en las globales", "j": "Es incorrecta. Es plausible porque el art. 29 del Decreto 1165 de 2019 sí pide indicar la disposición legal que contiene la obligación, pero ese requisito adicional es para las garantías específicas; además, no corrige la exclusión de sanciones e intereses. Error de granularidad: aplica a la global un requisito de la específica.", "tipo": "granularidad"}, {"t": "Que es adecuado, porque la garantía global responde por los tributos de la obligación principal", "j": "Es incorrecta. Es plausible porque la garantía es accesoria a la obligación aduanera, pero el Decreto 1165 de 2019, arts. 28 y 29, precisa que asegura el pago de tributos aduaneros, sanciones e intereses; limitarla a tributos deja sin amparo parte de lo exigido. Error de completitud.", "tipo": "completitud"}, {"t": "Que debe asegurar tributos aduaneros, sanciones e intereses derivados del incumplimiento", "j": "Es correcta. El Decreto 1165 de 2019, art. 29, exige que toda garantía global tenga como objeto asegurable el pago de los tributos aduaneros, sanciones e intereses derivados del incumplimiento de las obligaciones aduaneras, en concordancia con el art. 28, que la define como obligación accesoria con ese alcance.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M027", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#28", "fecha": "2026-10-26"}, {"fila": "M030", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#29", "fecha": "2026-10-26"}]}, {"id": "C-E06-002-1", "caso_id": "C-E06-002", "caso_pos": 1, "caso_n": 1, "eje": "OPERADOR ECONOMICO AUTORIZADO", "bloom": "Aplicar", "fuente": "Decreto 3568 de 2011, art. 10", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "En el punto de atención de la Dirección Seccional de Impuestos y Aduanas de Pereira, un Analista I atiende el 20 de octubre de 2026 al representante de Cafés de Altura S.A.S., exportador autorizado como Operador Económico Autorizado desde el 15 de septiembre de 2020. El representante cuenta que un asesor externo le advirtió que la autorización vencía a los cinco años y que la empresa lleva más de un año operando con ella vencida. La empresa no tiene notificado ningún acto de suspensión de beneficios ni de cancelación, y su última exportación, por USD 80.000, se tramitó el 2 de octubre con los beneficios del programa. El representante pide orientación escrita antes de radicar una nueva solicitud completa.", "enunciado": "¿Qué información debe consignar el analista en la respuesta escrita al usuario?", "opciones": [{"t": "Que la autorización venció en septiembre de 2025 y que la empresa debe radicar una nueva solicitud completa para recuperar la calidad de OEA.", "j": "Es incorrecta. Es plausible porque otras autorizaciones y garantías aduaneras tienen plazos, pero el Decreto 3568 de 2011, art. 10, fija una vigencia indefinida para la autorización OEA. Aplica un plazo de cinco años que la norma no establece (error de norma).", "tipo": "norma"}, {"t": "Que la autorización tiene vigencia indefinida y sigue produciendo efectos mientras no se configure una causal de suspensión o cancelación.", "j": "Es correcta. El Decreto 3568 de 2011, art. 10, dispone que la autorización OEA tiene vigencia indefinida, salvo que se presente una causal de interrupción o cancelación, hoy leída con la Ley 2586 de 2026. Cafés de Altura no tiene acto de suspensión ni de cancelación, de modo que su autorización de 2020 sigue vigente y no requiere una nueva solicitud.", "tipo": null}, {"t": "Que la autorización es indefinida para la calidad de OEA, pero que los beneficios del programa deben renovarse cada cinco años.", "j": "Es incorrecta. Es plausible porque reconoce la vigencia indefinida, pero separa la calidad de OEA de sus beneficios y somete estos a una renovación periódica que el Decreto 3568 de 2011, art. 10, no contempla. Confunde el nivel al que se aplica la vigencia (error de granularidad).", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M045", "norma": "Decreto 3568 de 2011 (Operador Económico Autorizado)", "articulo": "art. 10", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_3568_2011.htm#10", "fecha": "2026-10-26"}]}, {"id": "C-E03-010-1", "caso_id": "C-E03-010", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 70", "integra": ["CONTROLES ADUANEROS"], "caso": "Paula Jiménez, Analista I del grupo de control de la Dirección Seccional de Aduanas de Cali, verifica el 14 de mayo, en control posterior, una importación de llantas por USD 45.000. La declaración registra 250 unidades y el documento de transporte, 300. El usuario reconoce la diferencia, anuncia que acudirá a la dependencia del nivel central que dirige la facilitación del servicio para que resuelva el caso sin sanción y pide a la analista suspender el informe hasta recibir esa respuesta. El informe de control tiene un plazo de entrega de 10 días hábiles y el jefe del grupo no ha autorizado ninguna prórroga.", "enunciado": "¿Qué procedimiento debe aplicar la analista con el informe de la diferencia hallada?", "opciones": [{"t": "Entregar el informe en el plazo para que la seccional investigue en su jurisdicción.", "j": "Es correcta. El Decreto 1742 de 2020, art. 70, nums. 13 y 14, asigna a las Direcciones Seccionales hacer cumplir las normas aduaneras e investigar y sancionar las infracciones de acuerdo con su jurisdicción, mientras que el art. 27, num. 1, limita la Subdirección a dirigir la facilitación del servicio. La analista entrega el informe en el plazo para que la seccional de Cali actúe.", "tipo": null}, {"t": "Trasladar el hallazgo a la Subdirección de facilitación para que defina si hubo infracción.", "j": "Es incorrecta. Es plausible porque el usuario invoca a esa Subdirección y el Decreto 1742 de 2020, art. 27, num. 1, la relaciona con la aplicación de los regímenes. Falla porque esa función es de facilitación del servicio; investigar y sancionar infracciones corresponde a la seccional según el art. 70, num. 14. Error de norma: atribuye a la dependencia de facilitación una función de control.", "tipo": "norma"}, {"t": "Suspender el informe hasta que el usuario reciba la respuesta de la dependencia central.", "j": "Es incorrecta. Es plausible porque parece prudente esperar un pronunciamiento antes de informar. Falla porque el informe tiene plazo de 10 días hábiles sin prórroga, y la respuesta pedida no condiciona la función de la seccional de investigar las infracciones en su jurisdicción, según el Decreto 1742 de 2020, art. 70, num. 14. Error de fase: aplaza la etapa de informar a la espera de un trámite ajeno.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M026", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 70", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#70", "fecha": "2026-10-26"}, {"fila": "M025", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 27", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#27", "fecha": "2026-10-26"}]}, {"id": "C-E03-001-1", "caso_id": "C-E03-001", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 4", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Andrés Ríos, Analista I de la ventanilla de trámites aduaneros de la Dirección Seccional de Aduanas de Medellín, atiende el 4 de marzo a la representante de Confecciones Valle Alto S.A.S. La empresa radicó el 26 de febrero una solicitud de levante para una importación ordinaria de telas por USD 85.000, con factura comercial y documento de transporte completos. El trámite figura en estudio desde hace cinco días hábiles. La representante sostiene que, por superar USD 50.000, el expediente debió pasar a otro nivel de la entidad y pide que se traslade. El coordinador indica al analista que oriente a la usuaria con la estructura vigente de la DIAN, sin anticipar el sentido de la decisión sobre el levante.", "enunciado": "Para orientar a la usuaria, ¿en qué nivel de la estructura de la DIAN debe ubicar el analista a la dependencia que adelanta el trámite?", "opciones": [{"t": "En el nivel delegado, porque la seccional ejerce en la ciudad funciones que le delega el Director General.", "j": "Es incorrecta. Es plausible porque el nivel delegado es uno de los tres niveles del Decreto 1742 de 2020, art. 4, y el término sugiere actuación por delegación. Falla porque el art. 6 del mismo decreto ubica la Dirección Seccional de Aduanas de Medellín en la estructura del nivel local, no en el delegado. Error de granularidad: confunde el nivel de la estructura al que pertenece la dependencia.", "tipo": "granularidad"}, {"t": "En el nivel local, porque la Dirección Seccional de Aduanas de Medellín integra la estructura local.", "j": "Es correcta. El Decreto 1742 de 2020, art. 4, organiza la DIAN en nivel central, nivel local y nivel delegado, y el art. 6 incluye la Dirección Seccional de Aduanas de Medellín en la estructura del nivel local. El trámite de levante sigue en esa seccional y el valor de la operación no cambia el nivel de la dependencia.", "tipo": null}, {"t": "En el nivel central, porque la cuantía de la importación supera el tope que puede atender una seccional.", "j": "Es incorrecta. Es plausible porque el nivel central existe según el Decreto 1742 de 2020, art. 4, y la usuaria asocia el valor alto con instancias superiores. Falla porque ni el art. 4 ni el art. 6 fijan un tope en dólares para que una seccional del nivel local atienda un trámite; la Dirección Seccional de Aduanas de Medellín figura en el nivel local. Error de norma: aplica una regla de cuantía inexistente.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M020", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#4", "fecha": "2026-10-26"}, {"fila": "M021", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E01-009-1", "caso_id": "C-E01-009", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 48", "integra": ["RAZONAMIENTO MATEMATICO"], "caso": "Natalia Ríos, Analista I del grupo de control de una Dirección Seccional de Aduanas, organiza tres expedientes de aprehensión del 9 de septiembre para el reparto interno. El lote A, de juguetes, tiene un avalúo de $18.000.000; el lote B, de cosméticos, de $25.000.000; y el lote C, de llantas, de $31.000.000. Ninguno corresponde a otra categoría especial de mercancía. Para esta revisión, la jefe del grupo indica usar una UVT de $50.000. Debe separar los expedientes que se tramitan con decomiso directo de los que siguen el proceso ordinario y anotar en la carátula de estos últimos el término con que cuenta la autoridad para expedir y notificar el acto de fondo.", "enunciado": "¿Cómo debe organizar la analista los tres expedientes y qué término debe anotar en la carátula?", "opciones": [{"t": "A y B con decomiso directo; C en proceso ordinario, con 15 días hábiles para expedir y notificar el acto de fondo.", "j": "Es incorrecta. Es plausible porque la separación de los lotes es correcta y 15 días hábiles es un término del mismo proceso. Falla porque ese plazo corresponde al escrito de objeciones (art. 45 de la Ley 2586 de 2026); para el acto de fondo el art. 47 fija 70 días hábiles. Error de norma: plazo equivocado.", "tipo": "norma"}, {"t": "Solo A con decomiso directo; B y C en proceso ordinario, con 70 días hábiles para expedir y notificar el fondo.", "j": "Es incorrecta. Es plausible porque el cálculo del tope y el término son correctos. Falla porque la Ley 2586 de 2026, art. 48, num. 1, incluye la mercancía de valor igual a 500 UVT, y el lote B vale exactamente $25.000.000. Error de granularidad: aplica el límite como estrictamente inferior.", "tipo": "granularidad"}, {"t": "A y B con decomiso directo; C en proceso ordinario, con 70 días hábiles para expedir y notificar el acto de fondo.", "j": "Es correcta. La Ley 2586 de 2026, art. 48, num. 1, permite el decomiso directo para mercancías de valor inferior o igual a 500 UVT; con UVT de $50.000 el tope es $25.000.000, de modo que entran A y B (B lo iguala). El art. 47 da 70 días hábiles para expedir y notificar el acto de fondo del proceso ordinario de C.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M010", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 48", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#48", "fecha": "2026-10-26"}, {"fila": "M011", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 47", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#47", "fecha": "2026-10-26"}]}, {"id": "C-E02-003-1", "caso_id": "C-E02-003", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 579", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Carolina Ruiz, Analista I del grupo de control de una Dirección Seccional de Aduanas en un puerto marítimo, recibe el 14 de abril de 2026 el manifiesto de carga y los documentos de transporte de un buque que atracará el 16 de abril. Entre 180 contenedores figura uno consignado a Importaciones Brisa del Mar S.A.S., empresa inscrita en el RUT hace 2 meses, descrito como repuestos varios, con 22.000 kg de peso bruto y USD 3.000 de valor en la factura. Aún no se ha presentado declaración de importación. El jefe del grupo pide un informe que sirva de base para adoptar medidas de control antes del arribo. Carolina no ordena actuaciones: prepara la información.", "enunciado": "¿Cómo debe organizar Carolina la información del informe que le pidieron?", "opciones": [{"t": "Esperar a que se presente la declaración de importación y preparar con ella la solicitud de inspección física.", "j": "Es incorrecta. Es plausible porque la declaración aporta datos completos de la operación, pero el Decreto 1165 de 2019, art. 579, prevé que las medidas se adopten con la información de los documentos de viaje, y el jefe pidió el informe para actuar antes del arribo. Esperar la declaración traslada la tarea a otra etapa. Error de fase.", "tipo": "fase"}, {"t": "Describir la mercancía transportada y su valor para que el jefe decida si el contenedor es de riesgo.", "j": "Es incorrecta. Es plausible porque la descripción vaga y el valor bajo frente al peso son señales de riesgo, pero el Decreto 1165 de 2019, art. 579, menciona también a los sujetos involucrados, el medio de transporte y la unidad de carga; el informe omite al consignatario recién inscrito y los demás elementos. Error de completitud.", "tipo": "completitud"}, {"t": "Cruzar los datos de los documentos de viaje sobre el sujeto, el transporte, la unidad de carga y la mercancía.", "j": "Es correcta. El Decreto 1165 de 2019, art. 579, dispone que, con la información recibida de los documentos de viaje, la autoridad adopte medidas respecto de grupos de riesgo, sectores sensibles, sujetos involucrados, medio de transporte, unidad de carga y mercancía transportada. Organizar el informe con esos elementos permite al jefe decidir antes del arribo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M016", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 579", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#579", "fecha": "2026-10-26"}]}, {"id": "C-E09-009-1", "caso_id": "C-E09-009", "caso_pos": 1, "caso_n": 1, "eje": "VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 323", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Natalia Gómez, Analista I del grupo de control de una Dirección Seccional de Aduanas, revisa una muestra de declaraciones de importación ordinaria. En la de Calzado Andino S.A.S., por USD 16.000, la declaración se presentó y aceptó el 4 de abril a las 10:00, y la Declaración Andina del Valor tiene fecha de elaboración del 5 de abril. La agencia de aduanas explica que la elaboró al día siguiente porque el proveedor envió tarde la factura de fletes, y que los cálculos del valor no cambiaron. La mercancía no está entre las excepciones del artículo 327 del Decreto 1165 de 2019. Natalia debe registrar el resultado en la hoja de verificación.", "enunciado": "¿Qué resultado debe registrar Natalia en la hoja de verificación?", "opciones": [{"t": "Soporte no conforme, porque la Declaración Andina del Valor debía elaborarse antes de presentar y aceptar la declaración.", "j": "Es correcta. El Decreto 1165 de 2019, art. 323, establece que la Declaración Andina del Valor, por ser documento soporte de la declaración aduanera, debe elaborarse antes de la presentación y aceptación de la declaración de importación; aquí se elaboró un día después.", "tipo": null}, {"t": "Soporte conforme, porque la Declaración Andina del Valor puede elaborarse después de la aceptación si los cálculos no varían.", "j": "Es incorrecta. Es plausible porque los cálculos del valor no cambiaron, pero el Decreto 1165 de 2019, art. 323, exige elaborar la Declaración Andina del Valor antes de la presentación y aceptación de la declaración de importación. Error de fase.", "tipo": "fase"}, {"t": "Soporte conforme, porque la Declaración Andina del Valor se exige en importaciones con valor superior a USD 20.000.", "j": "Es incorrecta. Es plausible porque algunas exigencias aduaneras dependen de montos, pero el Decreto 1165 de 2019, art. 323, exige la Declaración Andina del Valor para toda mercancía importada, salvo las excepciones del art. 327, y el caso aclara que esta mercancía no está exceptuada. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M068", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 323", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#323", "fecha": "2026-10-26"}]}, {"id": "C-E02-002-1", "caso_id": "C-E02-002", "caso_pos": 1, "caso_n": 1, "eje": "CONTROLES ADUANEROS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 578", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Andrés Molina, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Impuestos y Aduanas, organiza los expedientes que el grupo de control revisará en junio de 2026. Uno corresponde a Montajes Industriales del Norte S.A.S., que el 2 de febrero obtuvo levante de una declaración de importación temporal para reexportación en el mismo estado de dos grúas por USD 250.000, con un plazo de 12 meses. La declaración indica que la modalidad terminará con la reexportación, que todavía no se ha producido, y la garantía sigue vigente. El grupo de control quiere verificar que las grúas permanezcan en la obra autorizada. La empresa alega que con el levante la operación quedó cerrada.", "enunciado": "¿En qué fase de control debe clasificar Andrés el expediente y por qué razón?", "opciones": [{"t": "Control posterior, porque con el levante la mercancía quedó a disposición del importador y la operación se cerró.", "j": "Es incorrecta. Es plausible porque el levante suele marcar el paso al control posterior en la importación ordinaria, pero el Decreto 1165 de 2019, art. 578, numeral 3, exige para esa fase la nacionalización o la finalización del régimen o modalidad, y la importación temporal sigue abierta hasta la reexportación. Error de fase.", "tipo": "fase"}, {"t": "Control previo, porque la verificación se adelanta antes de presentar la declaración que pondrá fin a la modalidad.", "j": "Es incorrecta. Toma como referencia la futura declaración de reexportación y no la declaración de importación temporal ya presentada. El Decreto 1165 de 2019, art. 578, numeral 1, reserva el control previo al que se ejerce antes de presentar la declaración aduanera, y la operación revisada ya tiene declaración con levante. Error de granularidad.", "tipo": "granularidad"}, {"t": "Control simultáneo, porque la modalidad temporal no ha finalizado y la verificación ocurre mientras sigue abierta.", "j": "Es correcta. El Decreto 1165 de 2019, art. 578, numeral 2, extiende el control simultáneo desde la presentación de la declaración hasta que las mercancías se nacionalicen o finalice el régimen o modalidad de que se trate. La declaración se presentó, la modalidad termina con la reexportación y esta no ha ocurrido, por lo que la verificación de junio es simultánea.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M015", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 578", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#578", "fecha": "2026-10-26"}]}, {"id": "C-E08-006-1", "caso_id": "C-E08-006", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 113", "integra": ["OPERADOR ECONOMICO AUTORIZADO"], "caso": "Usted es Analista I del grupo de registro y OEA de una Dirección Seccional de Aduanas. Logística Andina Global S.A.S., certificada como Operador Económico Autorizado en su condición de importador, radicó el 12 de septiembre dos solicitudes: actuar como agente de carga internacional desde el 1 de noviembre y usar los tratamientos de usuario aduanero con trámite simplificado. Su abogado afirma que la certificación OEA basta para la primera actividad y que para la segunda es suficiente una inscripción. A usted le corresponde preparar, en un plazo interno de diez días hábiles, la lista de chequeo de requisitos del expediente para el profesional que sustanciará la decisión.", "enunciado": "¿Qué figura debe consignar en la lista de chequeo para cada una de las solicitudes?", "opciones": [{"t": "Autorización para actuar como agente de carga e inscripción para usar el trámite simplificado", "j": "Es incorrecta. Es plausible porque acierta con el agente de carga y acoge el argumento del abogado sobre la segunda solicitud. Falla porque el Decreto 1165 de 2019, art. 113, exige autorización también para hacer uso de los tratamientos como usuario aduanero con trámite simplificado. Error de completitud: resuelve bien una de las dos solicitudes.", "tipo": "completitud"}, {"t": "Sin requisito adicional para ambas, porque la certificación OEA vigente ya cubre las dos actividades", "j": "Es incorrecta. Es plausible porque la certificación OEA otorga beneficios y la empresa ya fue evaluada por la DIAN. Falla porque el Decreto 1165 de 2019, art. 113, dispone que se deberá contar con autorización para actuar como agente de carga internacional y para usar el trámite simplificado; la certificación como importador no sustituye esa exigencia. Error de norma.", "tipo": "norma"}, {"t": "Autorización para actuar como agente de carga y autorización para usar el trámite simplificado", "j": "Es correcta. El Decreto 1165 de 2019, art. 113, establece que se deberá contar con autorización para desarrollar la actividad de agente de carga internacional y para hacer uso de los tratamientos como usuarios aduaneros con trámite simplificado. Las dos solicitudes requieren la misma figura y así deben quedar en la lista de chequeo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M071", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 113", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#113", "fecha": "2026-10-26"}]}, {"id": "C-E05-008-1", "caso_id": "C-E05-008", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 2", "integra": ["OPERADOR ECONOMICO AUTORIZADO"], "caso": "Diego Restrepo, Analista I del grupo de registro y OEA de una Dirección Seccional de Aduanas, atiende el 7 de septiembre al representante de Lácteos del Norte S.A.S., empresa autorizada como Operador Económico Autorizado. Una importación de 18 toneladas de maquinaria, por USD 120.000, fue seleccionada para inspección física. El representante pide que la DIAN deje sin efecto la inspección, porque el principio de eficiencia obliga a la entidad a facilitar el comercio y su empresa ya superó una validación de seguridad. Agrega que cada día de retraso le cuesta $3.000.000. Diego no decide sobre la inspección, pero debe orientar al usuario y remitir una nota a la dependencia que atiende la diligencia.", "enunciado": "¿Qué orientación debe dar Diego al representante sobre el alcance del principio que invoca?", "opciones": [{"t": "Que el principio obliga a levantar la inspección a quien acredite su calidad de operador autorizado y el costo diario del retraso.", "j": "Es incorrecta. Es plausible porque el principio busca facilitar el comercio y la empresa tiene una autorización especial. Falla porque el Decreto 1165 de 2019, art. 2, numeral 1, preserva el control de la autoridad aduanera y no convierte la agilidad en exención de la inspección. Error de norma.", "tipo": "norma"}, {"t": "Que el principio exige un servicio ágil y oportuno en la diligencia, sin que la autoridad deje de ejercer su control.", "j": "Es correcta. El Decreto 1165 de 2019, art. 2, numeral 1, hace prevalecer el servicio ágil y oportuno sin perjuicio de que la autoridad aduanera ejerza su control. El Decreto 1742 de 2020, art. 3, incluye el control de las operaciones de comercio exterior. La inspección se atiende con prontitud y no se suprime por el principio.", "tipo": null}, {"t": "Que el principio rige los trámites de ventanilla, y las diligencias de inspección física se sujetan a las reglas de control.", "j": "Es incorrecta. Es plausible porque distingue el servicio del control. Falla porque el Decreto 1165 de 2019, art. 2, numeral 1, rige las actuaciones administrativas relativas a la función aduanera en general, incluida la inspección, que debe atenderse con agilidad. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M043", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#2", "fecha": "2026-10-26"}, {"fila": "M039", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E08-005-1", "caso_id": "C-E08-005", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 3", "integra": ["CONTROLES ADUANEROS"], "caso": "Usted es Analista I en el punto de atención de una Dirección Seccional de Impuestos y Aduanas. La gerente de Insumos Agrícolas del Llano S.A.S. recibió el 3 de agosto un requerimiento porque en la declaración presentada por su agencia de aduanas figura la modalidad de importación temporal para reexportación en el mismo estado, aunque los 50 tanques de riego, por USD 25.000, se instalaron de forma permanente en sus fincas. Ella sostiene que la modalidad la asigna la DIAN al revisar la carga y que el documento de transporte, emitido por la naviera, es el que informa el destino de la mercancía. Pide orientación antes del 18 de agosto, día en que vence el plazo para responder.", "enunciado": "¿Qué orientación corresponde darle sobre quién indicó la modalidad cuestionada en el requerimiento?", "opciones": [{"t": "La asignó la DIAN al revisar la carga y la anotó luego en la declaración de importación", "j": "Es incorrecta. Es plausible porque la autoridad aduanera revisa la carga y puede cuestionar lo declarado, como ocurre con el requerimiento. Falla porque el Decreto 1165 de 2019, art. 3, establece que es el declarante quien indica el régimen en la declaración aduanera; la autoridad recibe y controla esa información. Error de competencia: traslada a la DIAN un acto del declarante.", "tipo": "competencia"}, {"t": "La informó la naviera en el documento de transporte, que la declaración se limitó a reproducir", "j": "Es incorrecta. Es plausible porque el documento de transporte acompaña la carga y contiene datos de destino. Falla porque el Decreto 1165 de 2019, art. 3, ubica la indicación del régimen en la declaración aduanera, mediante la cual el declarante suministra además los elementos e información que pide la autoridad; no es una copia del documento de transporte. Error de granularidad: confunde el documento soporte con la declaración.", "tipo": "granularidad"}, {"t": "La indicó su agencia de aduanas, como declarante, en la declaración presentada a nombre de la empresa", "j": "Es correcta. El Decreto 1165 de 2019, art. 3, define la declaración aduanera como el acto o documento mediante el cual el declarante indica el régimen aduanero específico aplicable a las mercancías y suministra la información que la autoridad requiere. La modalidad cuestionada figura en la declaración que presentó la agencia de aduanas a nombre de la empresa; no provino de la DIAN ni de la naviera.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M062", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 3 (definición «Declaración aduanera»)", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E04-002-1", "caso_id": "C-E04-002", "caso_pos": 1, "caso_n": 1, "eje": "GARANTIAS ADUANERAS", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 28", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Andrés Molina, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, revisa el 15 de mayo tres solicitudes de importación temporal para reexportación en el mismo estado presentadas por Eventos Cordillera S.A.S. La primera, de USD 60.000, quedó amparada con una póliza específica aceptada el 2 de mayo. Las otras dos, de USD 25.000 y USD 15.000, llegaron sin garantía propia, y la empresa pide que la póliza ya aceptada las cubra porque su valor asegurado excede la suma de ambas. La empresa no tiene garantía global vigente ante la DIAN, y el Analista debe dejar anotado en el expediente el estado de amparo de cada solicitud antes de continuar el trámite.", "enunciado": "¿Qué estado de amparo debe anotar el Analista para las dos solicitudes que llegaron sin garantía propia?", "opciones": [{"t": "Amparadas por la póliza aceptada, porque se volvió global al cubrir más de un trámite", "j": "Es incorrecta. Es plausible porque la garantía global ampara varias operaciones del mismo usuario, pero el Decreto 1165 de 2019, art. 28, distingue los dos tipos desde su constitución y una póliza específica no cambia de naturaleza por la petición del usuario. Error de norma: atribuye a la específica un efecto que la norma reserva a la global.", "tipo": "norma"}, {"t": "Sin amparo, porque la póliza aceptada cubre la operación para la cual se constituyó", "j": "Es correcta. Según el Decreto 1165 de 2019, art. 28, las garantías específicas amparan el cumplimiento de obligaciones de una operación o trámite en particular; la póliza de la primera solicitud no se extiende a las otras dos, y la empresa no tiene garantía global que ampare varias operaciones.", "tipo": null}, {"t": "Amparadas por la póliza aceptada, porque su valor asegurado cubre la suma de ambas operaciones", "j": "Es incorrecta. Es plausible porque el valor asegurado alcanza para las dos operaciones, pero el Decreto 1165 de 2019, art. 28, dispone que la garantía específica ampara las obligaciones de una operación o trámite en particular; el monto no amplía su objeto. Error de granularidad: mide el amparo por el valor y no por la operación.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M028", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#28", "fecha": "2026-10-26"}]}, {"id": "C-E07-003-1", "caso_id": "C-E07-003", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 18", "integra": ["OPERADOR ECONOMICO AUTORIZADO"], "caso": "Lucí
