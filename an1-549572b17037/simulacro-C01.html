a Gómez, Analista I de apoyo a fiscalización aduanera, prepara la hoja de cálculo que acompañará el proyecto de acto sancionatorio contra Comercializadora Puerto Azul S.A.S., autorizada como Operador Económico Autorizado. La dependencia competente ya determinó que la conducta es una infracción sancionable con multa de 200 UVT y fijó para el cálculo una UVT de $50.000. La misma conducta se cometió por primera vez hace 30 meses; el Requerimiento Especial Aduanero por esa primera infracción se expidió 8 meses después de cometida, y la segunda infracción, objeto del expediente actual, ocurrió hace 4 meses. El abogado ponente pidió el valor en pesos para revisarlo antes de firmar.", "enunciado": "¿Qué valor de la multa debe registrar la analista en la hoja de cálculo que entrega al abogado ponente?", "opciones": [{"t": "$10.000.000, porque la segunda infracción ocurrió fuera del periodo de dos años", "j": "Es incorrecta. Calcula bien la multa base (200 x 50.000 = 10.000.000), pero cuenta los dos años desde la primera infracción (30 - 4 = 26 meses). El art. 18, num. 5, de la Ley 2586 de 2026 cuenta el periodo desde el día siguiente a la expedición del Requerimiento Especial Aduanero. Error de granularidad.", "tipo": "granularidad"}, {"t": "$7.000.000, porque la sanción del OEA se reduce en un treinta por ciento", "j": "Es incorrecta. Reconoce que procede la reducción, pero resta el 30 % (10.000.000 x 0,70 = 7.000.000). El art. 18, num. 5, de la Ley 2586 de 2026 dice que la sanción se reduce al 30 %, no en un 30 %. Error de granularidad.", "tipo": "granularidad"}, {"t": "$3.000.000, porque la segunda infracción ocurrió dentro del periodo de dos años", "j": "Es correcta. La multa base es 200 UVT x 50.000 = 10.000.000 (Ley 2586 de 2026, art. 14, multa expresada en UVT). El REA se expidió hace 30 - 8 = 22 meses y la segunda infracción ocurrió hace 4 meses: 22 - 4 = 18 meses después, dentro de los dos años. El art. 18, num. 5, reduce la sanción al 30 %: 10.000.000 x 0,30 = 3.000.000.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M052", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 18", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#18", "fecha": "2026-10-26"}, {"fila": "M051", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 14", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#14", "fecha": "2026-10-26"}]}, {"id": "C-E07-009-1", "caso_id": "C-E07-009", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Analizar", "fuente": "Razonamiento cuantitativo con datos del caso", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Ricardo León, Analista I del punto de atención de una Dirección Seccional de Impuestos y Aduanas, organiza los turnos para una jornada especial de radicación de documentos de importación. En una jornada de prueba, 3 analistas procesaron 36 trámites en 6 horas, con el mismo tipo de trámite y el mismo ritmo cada uno. Para la jornada especial, la división espera 96 trámites y el punto de atención abrirá 8 horas. El jefe del grupo pidió que la propuesta indique cuántos analistas asignar, con la condición de mantener el ritmo de la prueba y de no dejar trámites pendientes para el día siguiente, y que la cifra quede explicada en el cuadro de turnos.", "enunciado": "¿Cuántos analistas debe proponer el analista en el cuadro de turnos de la jornada especial?", "opciones": [{"t": "Seis analistas, porque cada uno procesa dos trámites por hora", "j": "Es correcta. Ritmo: 36 / (3 x 6) = 2 trámites por analista por hora; en 8 horas cada analista procesa 16; 96 / 16 = 6 analistas. Comprobación: 6 x 8 x 2 = 96. (Ítem sin norma: razonamiento con los datos del caso).", "tipo": null}, {"t": "Once analistas, porque los trámites y las horas aumentan a la vez", "j": "Es incorrecta. Trata las horas como si fueran directamente proporcionales al número de analistas (3 x 96/36 x 8/6 = 10,7, que redondea a 11). Más horas de atención reducen el personal necesario: la relación es inversa. Error de granularidad.", "tipo": "granularidad"}, {"t": "Ocho analistas, porque los trámites aumentan en la misma proporción", "j": "Es incorrecta. Aplica la proporción con los trámites (3 x 96 / 36 = 8), pero no tiene en cuenta que la jornada pasa de 6 a 8 horas, dato que reduce el número de analistas necesarios. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": []}, {"id": "C-E07-006-1", "caso_id": "C-E07-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 171", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Diana Ortiz, Analista I de la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas, revisa el caso de Textiles Montebello S.A.S. Sus telas llegaron al territorio aduanero nacional por el puerto el 3 de marzo de 2026 y quedaron almacenadas. El 5 de marzo se sometieron a la modalidad de tránsito hacia la jurisdicción de la seccional, y ese tránsito se canceló el 12 de marzo, cuando la mercancía quedó de nuevo en depósito. El importador no presentó declaración anticipada y pregunta hasta qué día puede presentar la declaración de importación en término. La analista debe dejar la respuesta anotada en el registro de atención de la ventanilla.", "enunciado": "¿Qué fecha límite debe anotar la analista para la presentación de la declaración de importación?", "opciones": [{"t": "El 3 de abril de 2026, un mes después de la llegada", "j": "Es incorrecta. Cuenta bien el mes desde la llegada (3 de marzo a 3 de abril), pero omite que el tránsito suspendió el término. El art. 171 del Decreto 1165 de 2019 dispone que la duración del tránsito suspende el término hasta la cancelación del régimen. Error de completitud.", "tipo": "completitud"}, {"t": "El 12 de abril de 2026, un mes después de cancelado el tránsito", "j": "Es incorrecta. Reconoce el efecto del tránsito, pero lo trata como si reiniciara el término desde su cancelación (12 de marzo a 12 de abril). El art. 171 del Decreto 1165 de 2019 habla de suspensión: los 2 días corridos antes del tránsito ya se consumieron. Error de granularidad.", "tipo": "granularidad"}, {"t": "El 10 de abril de 2026, sumando los días de tránsito", "j": "Es correcta. El art. 175 del Decreto 1165 de 2019 remite al término del art. 171: un mes contado desde la llegada (3 de marzo a 3 de abril), suspendido mientras dura el tránsito. El tránsito duró del 5 al 12 de marzo, 7 días; 3 de abril + 7 días = 10 de abril de 2026.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M053", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 171", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#171", "fecha": "2026-10-26"}, {"fila": "M058", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 175", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#175", "fecha": "2026-10-26"}]}, {"id": "C-E05-005-1", "caso_id": "C-E05-005", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS"], "caso": "Paola Cárdenas, Analista I del grupo de control de una Dirección Seccional de Aduanas, atiende el 18 de abril una consulta del depósito habilitado Almacenes del Pacífico S.A.S. En sus bodegas permanecen 120 cajas de repuestos, con valor de USD 9.500, que según el acto que consta en el expediente fueron declaradas en abandono a favor de la Nación el 2 de abril. El depósito informa que cobra $1.200.000 mensuales por almacenamiento y propone vender las cajas a un tercero para cubrir esa deuda, o devolverlas al consignatario si este le paga. Paola debe preparar la respuesta para la firma del jefe del grupo, sin decidir sobre el cobro que reclama el depósito.", "enunciado": "¿Qué debe indicar la respuesta que prepara Paola sobre la administración y disposición de esa mercancía?", "opciones": [{"t": "Que a la DIAN le corresponde administrar y disponer de las cajas declaradas en abandono, de modo que el depósito no puede venderlas.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, numeral 4, atribuye a la DIAN administrar y disponer de las mercancías aprehendidas, decomisadas o declaradas en abandono a favor de la Nación. La respuesta preparada lo informa sin pronunciarse sobre el cobro del depósito.", "tipo": null}, {"t": "Que el depósito puede disponer de las cajas para cubrir el almacenamiento, con la condición de informar a la DIAN el valor de la venta.", "j": "Es incorrecta. Es plausible porque el depósito custodia la mercancía y tiene un crédito por almacenamiento. Falla porque el Decreto 1742 de 2020, art. 3, numeral 4, asigna a la DIAN administrar y disponer de las mercancías declaradas en abandono a favor de la Nación. Error de competencia.", "tipo": "competencia"}, {"t": "Que el consignatario todavía puede retirar las cajas si paga al depósito el almacenamiento y presenta la declaración de importación.", "j": "Es incorrecta. Es plausible porque antes de la declaratoria el interesado podía recuperar la mercancía. Falla porque las cajas ya fueron declaradas en abandono a favor de la Nación y, según el Decreto 1742 de 2020, art. 3, numeral 4, su administración y disposición corresponden a la DIAN. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M041", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E07-010-1", "caso_id": "C-E07-010", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO MATEMATICO", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 30", "integra": ["GARANTIAS ADUANERAS"], "caso": "Sandra Castro, Analista I del grupo de garantías de una Dirección Seccional de Aduanas, organiza para aprobación la garantía global de seguros que presentó Almacenadora Río Claro S.A.S. por una habilitación que sigue vigente. La póliza rige desde el 1 de febrero de 2026 hasta el 1 de agosto de 2027. En el objeto asegurable, la aseguradora escribió que ampara el pago de los tributos aduaneros derivados del incumplimiento de las obligaciones aduaneras del usuario. El jefe del grupo pidió una sola comunicación al usuario con todos los ajustes necesarios, para evitar devoluciones sucesivas, y que la analista no envíe la póliza a aprobación mientras no se ajuste.", "enunciado": "¿Qué ajustes debe incluir la analista en la comunicación que prepara para el usuario?", "opciones": [{"t": "Ampliar la vigencia en veinticuatro meses e incluir sanciones e intereses", "j": "Es incorrecta. Corrige el objeto, pero suma 24 meses al vencimiento actual (hasta el 1 de agosto de 2029), como si la vigencia mínima del art. 30, num. 1.1, del Decreto 1165 de 2019 se contara desde el vencimiento y no desde el inicio de la póliza. Error de granularidad.", "tipo": "granularidad"}, {"t": "Ampliar la vigencia en seis meses y conservar el objeto pactado por la aseguradora", "j": "Es incorrecta. Calcula bien la ampliación (24 - 18 = 6 meses), pero deja el objeto limitado a tributos, cuando el art. 29 del Decreto 1165 de 2019 exige amparar tributos, sanciones e intereses. Atiende uno de los dos ajustes. Error de completitud.", "tipo": "completitud"}, {"t": "Ampliar la vigencia en seis meses e incluir sanciones e intereses en el objeto", "j": "Es correcta. La póliza cubre 18 meses (1-feb-2026 a 1-ago-2027) y el Decreto 1165 de 2019, art. 30, num. 1.1, exige a la garantía global una vigencia mínima de 24 meses: 24 - 18 = 6 meses, hasta el 1 de febrero de 2028. El art. 29 del mismo decreto exige que el objeto asegurable garantice el pago de tributos, sanciones e intereses.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M031", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 30", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#30", "fecha": "2026-10-26"}, {"fila": "M030", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#29", "fecha": "2026-10-26"}]}, {"id": "C-E08-002-1", "caso_id": "C-E08-002", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 175", "integra": ["CONTROLES ADUANEROS"], "caso": "Usted es Analista I del grupo de control de una Dirección Seccional de Impuestos y Aduanas y verifica operaciones sujetas a declaración anticipada obligatoria. Aceros del Caribe S.A.S. importa 18 toneladas de láminas por USD 45.000; el documento de transporte indica que el buque llega el viernes 20 de marzo. El agente de aduanas informa que presentará la declaración el martes 17 de marzo, porque la carga sigue en altamar y, a su juicio, basta con declarar antes del arribo. El trayecto no está calificado como trayecto corto y no aplica ninguna excepción a la regla general. Su coordinador le pide dejar en la hoja de control la fecha límite de presentación y si la fecha propuesta la cumple, antes de la reunión con el importador.", "enunciado": "¿Qué debe registrar en la hoja de control sobre la oportunidad de la declaración?", "opciones": [{"t": "Fecha límite el 15 de marzo, 5 días calendario antes de la llegada; la fecha propuesta no la cumple", "j": "Es correcta. El Decreto 1165 de 2019, art. 175, dispone que la declaración anticipada obligatoria se presenta, por regla general, con una antelación mínima de 5 días calendario. Contados hacia atrás desde el 20 de marzo, el último día es el 15 de marzo, de modo que la presentación del 17 de marzo no cumple la antelación exigida.", "tipo": null}, {"t": "Fecha límite el 19 de marzo, un día antes de la llegada; la fecha propuesta sí la cumple", "j": "Es incorrecta. Es plausible porque el Decreto 1165 de 2019, art. 175, permite presentar la declaración en forma anticipada a la llegada, y eso es lo que alega el agente. Falla porque la operación está sujeta a declaración anticipada obligatoria, que exige una antelación mínima de 5 días calendario. Error de completitud: aplica la primera parte del artículo y omite la regla especial.", "tipo": "completitud"}, {"t": "Fecha límite el 13 de marzo, cinco días hábiles antes de la llegada; la fecha propuesta no la cumple", "j": "Es incorrecta. Es plausible porque acierta en que el 17 de marzo es tardío y muchos plazos aduaneros se cuentan en días hábiles. Falla porque el Decreto 1165 de 2019, art. 175, fija la antelación mínima en 5 días calendario, no hábiles, y la fecha límite correcta es el 15 de marzo. Error de norma: aplica un tipo de día distinto del previsto.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M058", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 175", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#175", "fecha": "2026-10-26"}]}, {"id": "C-E08-003-1", "caso_id": "C-E08-003", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 343", "integra": ["VALORACION CLASIFICACION ARANCELARIA Y ORIGEN DE LAS MERCANCIAS"], "caso": "Usted es Analista I en el punto de atención de una Dirección Seccional de Aduanas. Café Cumbre Verde S.A.S., productora nacional, prepara dos envíos para el 9 de junio. El primero son 2.000 kilos de café tostado vendidos por USD 30.000 a un comprador de Canadá, que lo distribuirá en tiendas de ese país y exige la prueba de origen colombiano para acceder a la preferencia arancelaria. El segundo son tres máquinas tostadoras de fabricación nacional que se exhibirán durante 40 días en una feria en Ecuador y volverán al país sin ninguna transformación. La gerente quiere declarar los dos envíos bajo una sola modalidad y le pide a usted ordenar la documentación.", "enunciado": "¿Cómo debe organizar la documentación según la modalidad de exportación de cada envío?", "opciones": [{"t": "Café en exportación definitiva y tostadoras en exportación temporal para perfeccionamiento pasivo", "j": "Es incorrecta. Es plausible porque acierta con el café y elige una modalidad temporal para las tostadoras, que también figura en el Decreto 1165 de 2019, art. 343. Falla porque el perfeccionamiento supone un proceso sobre la mercancía y las tostadoras volverán sin transformación, supuesto de la exportación temporal para reimportación en el mismo estado. Error de norma.", "tipo": "norma"}, {"t": "Los dos envíos en exportación definitiva, pues ambos salen del territorio aduanero con destino a otro país", "j": "Es incorrecta. Es plausible porque los dos envíos cumplen la definición general de exportación como salida de mercancías hacia otro país. Falla porque el Decreto 1165 de 2019, art. 346, reserva la exportación definitiva para mercancías que van a uso o consumo definitivo en el exterior, y las tostadoras regresan. Error de granularidad: aplica la definición del régimen y no distingue la modalidad.", "tipo": "granularidad"}, {"t": "Café en exportación definitiva y tostadoras en exportación temporal para reimportación en el mismo estado", "j": "Es correcta. El Decreto 1165 de 2019, art. 346, define la exportación definitiva como la salida de mercancías nacionales para su uso o consumo definitivo en otro país, caso del café vendido en Canadá. El art. 343 enumera la exportación temporal para reimportación en el mismo estado, que corresponde a las tostadoras que regresan sin cambios después de la feria.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M059", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 343", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#343", "fecha": "2026-10-26"}, {"fila": "M060", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 346", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#346", "fecha": "2026-10-26"}]}, {"id": "C-E08-001-1", "caso_id": "C-E08-001", "caso_pos": 1, "caso_n": 1, "eje": "REGIMEN DE IMPORTACION Y EXPORTACION", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 173", "integra": ["GARANTIAS ADUANERAS"], "caso": "Usted es Analista I en la ventanilla de trámites aduaneros de una Dirección Seccional de Aduanas. El representante de Textiles del Valle Alto S.A.S. entrega la documentación de cuatro telares industriales por USD 80.000, que llegarán el 14 de abril para quedarse en la planta de la empresa sin fecha de salida; la empresa ya liquidó arancel e IVA y piensa vender dos telares en 2028. El representante recuerda que el año pasado trajo dos telares por seis meses para una feria, los devolvió al exterior y para esa operación constituyó una garantía ante la DIAN. Pide que la carpeta de esta operación se arme igual que la anterior, con la póliza incluida.", "enunciado": "Al preparar la carpeta, ¿qué modalidad de importación debe verificar que figure en la declaración?", "opciones": [{"t": "Importación temporal para perfeccionamiento activo de bienes de capital, porque los telares se usarán en producción", "j": "Es incorrecta. Es plausible porque los telares son bienes de capital y la submodalidad 7.1 del Decreto 1165 de 2019, art. 172, menciona ese tipo de bienes. Falla porque el dato decisivo no es el tipo de bien sino la permanencia indefinida en libre disposición con pago de tributos, que corresponde a la importación ordinaria del art. 173. Error de granularidad: toma una característica del bien en lugar de la finalidad de la operación.", "tipo": "granularidad"}, {"t": "Importación temporal para reexportación en el mismo estado, con garantía que respalde la salida de los telares", "j": "Es incorrecta. Es plausible porque repite la modalidad y la garantía de la operación del año anterior, en la que los telares volvieron al exterior. Falla porque esta vez los telares se quedan en el país sin fecha de salida y con tributos liquidados, supuesto que el Decreto 1165 de 2019, art. 173, asigna a la importación ordinaria y no a una modalidad temporal del art. 172. Error de norma.", "tipo": "norma"}, {"t": "Importación ordinaria, porque los telares quedarán de forma indefinida en libre disposición con pago de tributos", "j": "Es correcta. El Decreto 1165 de 2019, art. 173, define la importación ordinaria como la introducción de mercancías extranjeras para permanecer en el territorio de manera indefinida, en libre disposición y con el pago de los tributos aduaneros; el art. 172 la enumera como modalidad del régimen. Los telares se quedan sin fecha de salida, con arancel e IVA liquidados y podrán venderse.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M056", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 172", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#172", "fecha": "2026-10-26"}, {"fila": "M057", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 173", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#173", "fecha": "2026-10-26"}]}, {"id": "C-E01-002-1", "caso_id": "C-E01-002", "caso_pos": 1, "caso_n": 1, "eje": "CAUSALES DE APREHENSION Y DECOMISO DE MERCANCIAS", "bloom": "Analizar", "fuente": "Ley 2586 de 2026, art. 26", "integra": ["REGIMEN DE IMPORTACION Y EXPORTACION"], "caso": "Andrés Rubio, Analista I de apoyo a fiscalización aduanera de una Dirección Seccional de Impuestos y Aduanas costera, prepara el informe de una operación del 14 de junio. Una embarcación de la empresa ficticia Naviera Coral atracó a las 23:00 en una playa que no es lugar habilitado para el ingreso de mercancías. A bordo había 200 cajas de electrodomésticos: 150 llegaron con factura comercial y lista de empaque, y 50 sin documento alguno. El capitán no alegó avería ni arribo forzoso. Al día siguiente, el apoderado de la empresa presentó un escrito en el que pide excluir del informe las 150 cajas facturadas, porque a su juicio esos documentos acreditan la compra en el exterior.", "enunciado": "¿Cómo debe delimitar el analista, en el informe, las mercancías comprendidas por la causal que se configura?", "opciones": [{"t": "Incluye solo las 50 cajas sin documentos, bajo la causal de mercancía no declarada, y anexa las facturas restantes.", "j": "Es incorrecta. Es plausible porque la causal de mercancía no declarada o no amparada (art. 26, num. 2, de la Ley 2586 de 2026) también conduce a aprehensión. Falla porque el hecho del caso es el ingreso por lugar no habilitado, que encaja en el num. 1 (mercancía no presentada) y alcanza a toda la carga a bordo. Error de norma: cita el numeral equivocado y reduce el alcance.", "tipo": "norma"}, {"t": "Incluye solo las 50 cajas sin documentos, bajo la causal de mercancía no presentada, y excluye las facturadas.", "j": "Es incorrecta. Es plausible porque las 50 cajas carecen de todo soporte y la factura parece acreditar la compra. Falla porque la Ley 2586 de 2026, art. 26, num. 1, dispone que, si el ingreso ocurre por lugar no habilitado, la aprehensión y decomiso recae sobre las mercancías a bordo del medio de transporte, sin distinguir si traen factura. Error de granularidad: toma como unidad la caja y no la carga a bordo.", "tipo": "granularidad"}, {"t": "Incluye las 200 cajas a bordo, bajo la causal de mercancía no presentada por ingreso en lugar no habilitado.", "j": "Es correcta. La Ley 2586 de 2026, art. 26, num. 1, establece como causal la mercancía no presentada y precisa que, en el ingreso por lugar no habilitado, la aprehensión y decomiso recae sobre las mercancías a bordo del medio de transporte. El capitán no alegó arribo forzoso, de modo que la excepción no aplica y la factura no excluye a las 150 cajas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M003", "norma": "Ley 2586 de 2026 (régimen sancionatorio y de decomiso en materia aduanera)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_2586_2026.htm#26", "fecha": "2026-10-26"}]}], "likert": [{"clave": "C", "nombre": "Competencias comportamentales", "caracter": "Clasificatoria", "items": [{"ind": "Adaptabilidad nivel 2", "t": "Después de un cambio de procedimiento reviso mis resultados para identificar qué debo hacer distinto en las siguientes operaciones.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 1", "t": "Tengo en cuenta las sugerencias de los usuarios sobre la atención, aunque no esté obligado a aplicarlas.", "inv": false}, {"ind": "Comunicación efectiva nivel 2", "t": "Comparto con otras áreas la información de un hallazgo que les sirve, en el formato que ellas usan aunque deba rehacer mi resumen.", "inv": false}, {"ind": "Orientación al logro nivel 1", "t": "Me fijo metas para reducir los errores en mis registros aunque nadie las mida.", "inv": false}, {"ind": "Orientación al logro nivel 1", "t": "Termino la revisión de las declaraciones asignadas en el día aunque algunas exijan consultar el arancel con detalle.", "inv": false}, {"ind": "Control", "t": "Siempre he entendido a la primera todo lo que me explican en el trabajo.", "inv": false, "control": true}, {"ind": "Adaptabilidad nivel 1", "t": "Acepto cambios de turno en el puerto o el aeropuerto cuando aumenta la llegada de carga, aunque eso altere mis planes personales de la semana.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 1", "t": "Respondo las solicitudes de los usuarios en el orden que me resulta más cómodo y no según su fecha de radicación.", "inv": true}, {"ind": "Trabajo en equipo nivel 1", "t": "Reconozco ante el jefe el aporte de un compañero en un hallazgo que presentamos juntos.", "inv": false}, {"ind": "Comportamiento ético   set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },

};

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function trunc2(x){ return (Math.floor(x * 100) / 100).toFixed(2).replace(".", ","); }
function fmtTime(ms){
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtMin(m){ const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h ${String(r).padStart(2,"0")} min` : `${r} min`; }

function construir(c){
  let items = [];
  if (c.modo === "practica") {
    BANCO.pjs.forEach((it, i) => { if (it.eje === c.eje) items.push({ p:"F", i }); });
  } else {
    items = BANCO.pjs.map((_, i) => ({ p:"F", i }));
    if (c.modo === "completo") SECC.forEach(s => s.items.forEach((_, i) => items.push({ p:s.clave, i })));
  }
  const limite = c.modo === "completo" ? M.tiempo_min.completo : c.modo === "funcionales" ? M.tiempo_min.funcionales : 0;
  return { cfg:{...c}, items, resp:{}, dud:{}, idx:0, inicio:Date.now(), limiteMin:limite, fin:null };
}

function itemDe(ref){
  if (ref.p === "F") return BANCO.pjs[ref.i];
  return SECC.find(s => s.clave === ref.p).items[ref.i];
}

function guardar(){ store.set(KEY_STATE, S); }

/* ------------------------------ INICIO ------------------------------ */
function vistaInicio(){
  stopTimer();
  const hist = store.get(KEY_HIST, []);
  const enCurso = S && !S.fin;
  const nF = BANCO.pjs.length;
  const fmtF = `Selección múltiple, ${M.n_opciones} opciones (PJS)`;
  const filaF = ["Competencias funcionales", String(nF), fmtF, `${M.caracter}, mínimo ${trunc2(M.minimo)}`];
  const nPrac = BANCO.pjs.filter(i => i.eje === cfg.eje).length;
  const comp = cfg.modo === "completo"
    ? [filaF, ...SECC.map(s => [s.nombre, String(s.items.length), "Likert de 4 niveles", s.caracter || "Clasificatoria"])]
    : cfg.modo === "funcionales" ? [filaF]
      : [["Práctica: " + cfg.eje, String(nPrac), "PJS con retroalimentación inmediata", "Sin tiempo"]];
  const total = comp.reduce((a, r) => a + Number(r[1]), 0);
  const tiempo = cfg.modo === "completo" ? fmtMin(M.tiempo_min.completo) : cfg.modo === "funcionales" ? fmtMin(M.tiempo_min.funcionales) : "libre";

  app.innerHTML = `
  <header class="masthead">
    <span class="eyebrow">${esc(M.convocatoria)} · Pruebas escritas · Cuadernillo ${esc(M.codigo)}</span>
    <h1>Simulacro para ${esc(M.empleo_corto || M.empleo)}</h1>
    <div class="meta"><span>Nivel ${esc(M.nivel_txt)}</span><span>${EJES.length} ejes funcionales</span>${SECC.map(s => `<span>${s.items.length} ${esc(s.nombre.toLowerCase())}</span>`).join("")}</div>
  </header>
  ${enCurso ? `<div class="sheet panel" style="margin-bottom:20px">
      <div class="row" style="justify-content:space-between">
        <div><h2>Tienes un intento sin entregar</h2><p class="muted">${esc(nombreModo(S.cfg))} · ${Object.keys(S.resp).length} de ${S.items.length} respondidas</p></div>
        <div class="row"><button class="btn primary" id="seguir">Continuar intento</button><button class="btn" id="descartar">Descartar</button></div>
      </div></div>` : ""}
  <div class="setup">
    <section class="sheet panel" aria-labelledby="t-modo">
      <h2 id="t-modo">Configura el intento</h2>
      <div class="choice" role="group" aria-label="Modo">
        ${SECC.length ? opcionModo("completo","Simulacro completo",`Todas las pruebas en una sesión de ${fmtMin(M.tiempo_min.completo)}.`) : ""}
        ${opcionModo("funcionales","Solo competencias funcionales",`Los ${nF} ítems PJS con ${fmtMin(M.tiempo_min.funcionales)}.`)}
        ${opcionModo("practica","Práctica por eje","Los ítems de un eje, sin reloj, con la justificación después de cada respuesta.")}
      </div>
      <div class="row" ${cfg.modo === "practica" ? "" : "hidden"}>
        <label for="eje" class="muted">Eje</label>
        <select id="eje">${EJES.map(e => `<option ${e === cfg.eje ? "selected" : ""}>${esc(e)}</option>`).join("")}</select>
      </div>
      <div class="tablewrap"><table class="compo">
        <thead><tr><th>Prueba</th><th class="num">Ítems</th><th>Formato</th><th>Carácter</th></tr></thead>
        <tbody>${comp.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}
        <tr><td><b>Total</b></td><td class="num"><b>${total}</b></td><td colspan="2" class="muted">Tiempo: ${tiempo}</td></tr></tbody>
      </table></div>
      <div class="row"><button class="btn primary" id="empezar">Empezar</button></div>
      <p class="note">${esc(M.aviso)}</p>
    </section>
    <section class="sheet panel" aria-labelledby="t-ejes">
      <h2 id="t-ejes">Ejes funcionales del empleo</h2>
      <ul class="ejes">${EJES.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
      <details>
        <summary>Protocolo de lectura del ítem PJS</summary>
        <ol class="proto">
          <li>Lee el enunciado primero e identifica la tarea que te piden.</li>
          <li>Marca en el caso el actor, los datos, las restricciones y la fase del procedimiento.</li>
          <li>Si el caso trae varias preguntas, resuelve cada una con el dato que le corresponde.</li>
          <li>Prueba cada opción contra cinco filtros: fase, nivel de detalle, completitud, norma y competencia.</li>
          <li>Nombra la norma que respalda tu elección. Si no puedes, vuelve al caso.</li>
        </ol>
      </details>
      ${hist.length ? `<details open><summary>Intentos anteriores</summary>
        <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Modo</th><th class="num">Funcionales</th><th class="num">Escala</th></tr></thead>
        <tbody>${hist.slice(-8).reverse().map(h => `<tr><td class="mono">${esc(h.fecha)}</td><td>${esc(h.modo)}</td><td class="num">${h.ac}/${h.n}</td><td class="num">${esc(h.esc)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    </section>
  </div>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;
  app.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { cfg.modo = b.dataset.modo; vistaInicio(); });
  const ej = document.getElementById("eje"); if (ej) ej.onchange = e => { cfg.eje = e.target.value; vistaInicio(); };
  document.getElementById("empezar").onclick = () => { S = construir(cfg); guardar(); vistaPrueba(); };
  if (enCurso) {
    document.getElementById("seguir").onclick = vistaPrueba;
    document.getElementById("descartar").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };

}
function opcionModo(v, t, d){
  return `<button class="opt-card" data-modo="${v}" aria-pressed="${cfg.modo === v}"><span class="dot"></span><span><b>${t}</b><span>${d}</span></span></button>`;
}
function nombreModo(c){
  return c.modo === "completo" ? "Simulacro completo" : c.modo === "funcionales" ? "Solo funcionales" : `Práctica: ${c.eje}`;
}

/* ------------------------------ PRUEBA ------------------------------ */
function restante(){ return S.limiteMin ? S.limiteMin * 60000 - (Date.now() - S.inicio) : null; }
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function tick(){
  const el = document.getElementById("clock");
  const r = restante();
  if (r === null || !el) return;
  el.textContent = fmtTime(r);
  el.classList.toggle("low", r < 15 * 60000);
  if (r <= 0) entregar();
}

function vistaPrueba(){
  confirmando = false;
  stopTimer();
  render();
  if (S.limiteMin) timer = setInterval(tick, 1000);
}

function render(){
  const ref = S.items[S.idx];
  const it = itemDe(ref);
  const n = S.items.length;
  const resp = S.resp[S.idx];
  const practica = S.cfg.modo === "practica";
  const respondidas = Object.keys(S.resp).length;
  const r = restante();
  const revelar = practica && resp !== undefined && ref.p === "F";

  let cuerpo;
  if (ref.p === "F") {
    const sub = it.caso_n > 1 ? ` <span class="sub-caso">· caso compartido, pregunta ${it.caso_pos} de ${it.caso_n}</span>` : "";
    cuerpo = `
      <div><div class="block-label">Caso${sub}</div><p class="caso">${esc(it.caso)}</p></div>
      <div><div class="block-label">Enunciado</div><p class="enun">${esc(it.enunciado)}</p></div>
      <div class="opts" role="group" aria-label="Opciones de respuesta">
        ${it.opciones.map((o, k) => {
          let cls = "op";
          if (revelar && k === it.clave) cls += " is-key";
          if (revelar && k === resp && k !== it.clave) cls += " is-wrong";
          return `<button class="${cls}" data-k="${k}" aria-pressed="${resp === k}" ${revelar ? "disabled" : ""}><span class="bub">${LETRAS[k]}</span><span>${esc(o.t)}</span></button>`;
        }).join("")}
      </div>
      ${revelar ? `<div class="feedback">
        <div class="row"><span class="chip ${resp === it.clave ? "ok" : "bad"}">${resp === it.clave ? "Correcta" : "Incorrecta"}</span><span class="tag">${esc(it.bloom)}</span><span class="tag">${esc(it.fuente)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
        ${justificaciones(it)}
      </div>` : ""}`;
  } else {
    cuerpo = `
      <div><div class="block-label">Afirmación</div><p class="enun">${esc(it.t)}</p></div>
      <div class="opts" role="group" aria-label="Escala de acuerdo">
        ${LIKERT.map((l, k) => `<button class="op" data-k="${k}" aria-pressed="${resp === k}"><span class="bub">${LETRAS[k]}</span><span>${l}</span></button>`).join("")}
      </div>`;
  }

  app.innerHTML = `
  <div class="bar">
    <div class="row">
      <div><span class="eyebrow">${esc(nombreModo(S.cfg))}</span><div class="mono">${respondidas}/${n} respondidas</div></div>
      <div class="row">
        ${r !== null ? `<span class="clock" id="clock" aria-label="Tiempo restante">${fmtTime(r)}</span>` : ""}
        <button class="btn" id="salir">Pausar</button>
        <button class="btn ink" id="entregar">Entregar</button>
      </div>
    </div>
    <div class="progress"><i style="width:${(respondidas / n * 100).toFixed(1)}%"></i></div>
  </div>
  ${confirmando ? `<div class="confirm" style="margin-bottom:16px">
      <p><b>¿Entregar el cuadernillo?</b> Tienes ${n - respondidas} preguntas sin responder${Object.values(S.dud).filter(Boolean).length ? ` y ${Object.values(S.dud).filter(Boolean).length} marcadas como dudosas` : ""}. Una omisión en funcionales cuenta como no acierto.</p>
      <div class="row"><button class="btn primary" id="si">Entregar ahora</button><button class="btn" id="no">Seguir respondiendo</button></div>
    </div>` : ""}
  <div class="exam">
    <article class="sheet item">
      <div class="head">
        <span class="qnum">Pregunta ${S.idx + 1} de ${n}</span>
        <span class="eyebrow">${esc(PARTE[ref.p])}${practica ? " · " + esc(it.eje) : ""}</span>
      </div>
      ${cuerpo}
      <div class="nav">
        <button class="btn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn flag" id="flag" aria-pressed="${!!S.dud[S.idx]}">${S.dud[S.idx] ? "Marcada como dudosa" : "Marcar como dudosa"}</button>
        <button class="btn primary" id="next">${S.idx === n - 1 ? "Revisar y entregar" : "Siguiente"}</button>
      </div>
    </article>
    <aside class="sheet omr" aria-label="Hoja de respuestas">
      ${Object.keys(PARTE).filter(p => S.items.some(x => x.p === p)).map(p => `
        <div><h3>${esc(PARTE[p])}</h3><div class="grid">
          ${S.items.map((x, k) => x.p !== p ? "" : `<button class="cell${S.resp[k] !== undefined ? " done" : ""}${S.dud[k] ? " flagged" : ""}${k === S.idx ? " current" : ""}" data-go="${k}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join("")}
        </div></div>`).join("")}
      <div class="legend"><span><i class="d"></i>Respondida</span><span><i></i>Pendiente</span><span><i class="f"></i>Dudosa</span></div>
    </aside>
  </div>`;

  app.querySelectorAll(".op[data-k]").forEach(b => b.onclick = () => {
    S.resp[S.idx] = Number(b.dataset.k); guardar(); render();
  });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.idx = Number(b.dataset.go); guardar(); render(); });
  document.getElementById("prev").onclick = () => { if (S.idx > 0) { S.idx--; guardar(); render(); } };
  document.getElementById("next").onclick = () => {
    if (S.idx < n - 1) { S.idx++; guardar(); render(); window.scrollTo({ top:0 }); }
    else { confirmando = true; render(); window.scrollTo({ top:0 }); }
  };
  document.getElementById("flag").onclick = () => { S.dud[S.idx] = !S.dud[S.idx]; guardar(); render(); };
  document.getElementById("salir").onclick = () => { guardar(); vistaInicio(); };
  document.getElementById("entregar").onclick = () => { confirmando = true; render(); window.scrollTo({ top:0 }); };
  const si = document.getElementById("si"); if (si) si.onclick = entregar;
  const no = document.getElementById("no"); if (no) no.onclick = () => { confirmando = false; render(); };
}

function justificaciones(it){
  const sop = (it.soporte || []).map(s => `<p class="muted" style="font-size:.82rem">Soporte: ${esc(s.norma)}, ${esc(s.articulo)} · verificado el ${esc(s.fecha)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">fuente oficial</a></p>`).join("");
  return it.opciones.map((o, k) => `<div class="just"><span class="l">${LETRAS[k]}</span><span>${esc(o.j)}${o.tipo ? ` <span class="tag">${esc(TIPO_TXT[o.tipo])}</span>` : ""}</span></div>`).join("") + sop;
}

function entregar(){
  stopTimer();
  if (!S.fin) {
    S.fin = Date.now();
    const r = calcular();
    const hist = store.get(KEY_HIST, []);
    const d = new Date(S.fin);
    hist.push({ fecha: d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit" }),
      modo: nombreModo(S.cfg), ac: r.ac, n: r.nF, esc: trunc2(r.escala) });
    store.set(KEY_HIST, hist.slice(-30));
    guardar();
  }
  vistaResultados();
}

/* ------------------------------ RESULTADOS ------------------------------ */
function calcular(){
  let ac = 0, nF = 0;
  const porEje = {}, porBloom = {}, porTipo = {};
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); nF++;
    const r = S.resp[k];
    porEje[it.eje] = porEje[it.eje] || { ac:0, n:0 };
    porBloom[it.bloom] = porBloom[it.bloom] || { ac:0, n:0 };
    porEje[it.eje].n++; porBloom[it.bloom].n++;
    if (r === it.clave) { ac++; porEje[it.eje].ac++; porBloom[it.bloom].ac++; }
    else {
      const tipo = r === undefined ? "omision" : it.opciones[r].tipo;
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
    }
  });
  const escala = nF ? ac / nF * 100 : 0;
  const ind = {}; let ctrlAcuerdo = 0, ctrlN = 0, extremos = 0, nL = 0;
  S.items.forEach((ref, k) => {
    if (ref.p === "F") return;
    const it = itemDe(ref); const r = S.resp[k];
    if (r === undefined) return;
    if (it.control) { ctrlN++; if (r >= 2) ctrlAcuerdo++; return; }
    nL++;
    if (r === 3 || (it.inv && r === 0)) extremos++;
    const v = it.inv ? 4 - r : r + 1;
    const key = PARTE[ref.p] + " · " + it.ind;
    ind[key] = ind[key] || { s:0, n:0 };
    ind[key].s += v; ind[key].n++;
  });
  return { ac, nF, escala, porEje, porBloom, porTipo, ind, ctrlAcuerdo, ctrlN, extremos, nL };
}

function vistaResultados(){
  stopTimer();
  const R = calcular();
  const pasa = R.escala >= M.minimo;
  const dur = S.fin ? fmtTime(S.fin - S.inicio) : "";
  const hayLikert = S.items.some(x => x.p !== "F");
  const fav = R.nL ? R.extremos / R.nL : 0;
  const ctrlRate = R.ctrlN ? R.ctrlAcuerdo / R.ctrlN : 0;
  const alerta = ctrlRate >= .5 || fav >= .7;
  const tiposOrden = Object.entries(R.porTipo).sort((a, b) => b[1] - a[1]);
  const minTxt = trunc2(M.minimo);

  app.innerHTML = `
  <header class="masthead">
    <span class="eyebrow">Resultado · ${esc(nombreModo(S.cfg))} · ${esc(M.codigo)}</span>
    <h1>${pasa ? "Superas" : "No alcanzas"} el mínimo de ${minTxt} en funcionales</h1>
    <div class="meta"><span>Tiempo usado ${dur}</span><span>${Object.keys(S.resp).length}/${S.items.length} respondidas</span></div>
  </header>
  <div class="score">
    <div class="sheet kpi"><span class="eyebrow">Aciertos funcionales</span><span class="v">${R.ac}/${R.nF}</span><span class="muted">${R.nF - R.ac} errores u omisiones</span></div>
    <div class="sheet kpi"><span class="eyebrow">Escala 0 a 100</span><span class="v">${trunc2(R.escala)}</span><span><span class="chip ${pasa ? "ok" : "bad"}">${pasa ? "Supera " + minTxt : "Por debajo de " + minTxt}</span></span></div>
    <div class="sheet kpi"><span class="eyebrow">Aciertos para ${minTxt}</span><span class="v">${Math.ceil(R.nF * M.minimo / 100)}</span><span class="muted">Si la escala fuera porcentual</span></div>
  </div>
  <p class="note" style="margin-bottom:16px">La escala es lineal (aciertos / ítems × 100) y truncada a dos decimales. La fórmula oficial se aplica después del análisis psicométrico de los ítems y puede diferir.</p>
  <div class="res-grid">
    <section class="sheet"><h2>Aciertos por eje</h2>
      <div class="tablewrap"><table><thead><tr><th>Eje</th><th class="num">Aciertos</th><th></th></tr></thead><tbody>
      ${Object.entries(R.porEje).sort((a, b) => a[1].ac / a[1].n - b[1].ac / b[1].n).map(([e, v]) => {
        const p = v.ac / v.n; return `<tr><td>${esc(e)}</td><td class="num">${v.ac}/${v.n}</td><td style="width:90px"><div class="meter"><i class="${p >= .7 ? "ok" : p >= .5 ? "warn" : "bad"}" style="width:${p * 100}%"></i></div></td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="muted" style="font-size:.85rem">Ordenado de menor a mayor acierto. Repasa primero los ejes de arriba en modo práctica.</p>
    </section>
    <section class="sheet"><h2>Por qué fallaste</h2>
      ${tiposOrden.length ? `<div class="tablewrap"><table><thead><tr><th>Tipo de distractor elegido</th><th class="num">Veces</th></tr></thead><tbody>
      ${tiposOrden.map(([t, c]) => `<tr><td>${t === "omision" ? "Sin responder" : esc(TIPO_TXT[t])}</td><td class="num">${c}</td></tr>`).join("")}</tbody></table></div>` : `<p>Sin errores en funcionales.</p>`}
      <h3>Por nivel cognitivo</h3>
      <div class="tablewrap"><table><thead><tr><th>Bloom revisada</th><th class="num">Aciertos</th></tr></thead><tbody>
      ${["Recordar","Comprender","Aplicar","Analizar","Evaluar","Crear"].filter(b => R.porBloom[b]).map(b => `<tr><td>${b}</td><td class="num">${R.porBloom[b].ac}/${R.porBloom[b].n}</td></tr>`).join("")}</tbody></table></div>
    </section>
  </div>
  ${hayLikert ? `<section class="sheet" style="padding:14px;display:grid;gap:10px;margin-bottom:16px">
    <div class="row" style="justify-content:space-between"><h2>Perfil de autoinforme</h2><span class="chip ${alerta ? "warn" : "ok"}">${alerta ? "Patrón muy favorable" : "Patrón sin alertas"}</span></div>
    <p class="muted" style="font-size:.88rem">Estas pruebas no tienen respuestas correctas. El perfil es una lectura de entrenamiento: promedio de 1 a 4 por indicador, con las afirmaciones invertidas recodificadas. Acuerdo con afirmaciones de control: ${R.ctrlAcuerdo} de ${R.ctrlN}. Respuestas extremas favorables: ${Math.round(fav * 100)} %. ${alerta ? "Un patrón así es el que las subescalas de control de la prueba real buscan detectar." : ""}</p>
    <div class="tablewrap"><table><thead><tr><th>Indicador</th><th class="num">Promedio</th><th></th></tr></thead><tbody>
    ${Object.entries(R.ind).map(([k, v]) => { const m = v.s / v.n; return `<tr><td>${esc(k)}</td><td class="num">${m.toFixed(2).replace(".", ",")}</td><td style="width:110px"><div class="meter"><i style="width:${(m - 1) / 3 * 100}%"></i></div></td></tr>`; }).join("")}
    </tbody></table></div>
  </section>` : ""}
  <section aria-labelledby="t-rev">
    <div class="row" style="justify-content:space-between"><h2 id="t-rev">Revisión de funcionales</h2>
      <div class="row"><button class="btn" id="inicio">Volver al inicio</button></div></div>
    <div class="filters" role="group" aria-label="Filtro">
      ${[["todos","Todas"],["errores","Solo errores"],["dudosas","Solo dudosas"]].map(([v, l]) => `<button class="btn" data-f="${v}" aria-pressed="${filtro === v}">${l}</button>`).join("")}
    </div>
    <div class="review">${revision()}</div>
  </section>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; vistaResultados(); });
  document.getElementById("inicio").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };
  window.scrollTo({ top:0 });
}

function revision(){
  const out = [];
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); const r = S.resp[k]; const ok = r === it.clave;
    if (filtro === "errores" && ok) return;
    if (filtro === "dudosas" && !S.dud[k]) return;
    out.push(`<article class="sheet rv">
      <div class="head"><span class="qnum">Pregunta ${k + 1}</span>
        <span class="tag ${ok ? "ok" : "bad"}">${ok ? "Acierto" : r === undefined ? "Omitida" : "Error"}</span>
        ${S.dud[k] ? `<span class="tag warn">Dudosa</span>` : ""}
        <span class="tag">${esc(it.eje)}</span><span class="tag">${esc(it.bloom)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
      <p class="caso">${esc(it.caso)}</p>
      <p class="enun">${esc(it.enunciado)}</p>
      <div class="opts">${it.opciones.map((o, j) => `<div class="op${j === it.clave ? " is-key" : ""}${j === r && !ok ? " is-wrong" : ""}" aria-pressed="${j === r}"><span class="bub">${LETRAS[j]}</span><span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="feedback">
        ${justificaciones(it)}
        <p class="muted" style="font-size:.82rem">Fuente: ${esc(it.fuente)}</p>
      </div>
    </article>`);
  });
  return out.length ? out.join("") : `<p class="muted">No hay preguntas con este filtro.</p>`;
}

/* ------------------------------ ARRANQUE ------------------------------ */
if (S && S.fin) vistaResultados();
else vistaInicio();
</script>
