tema de correspondencia?", "opciones": [{"t": "Como comunicación informativa, porque el ciudadano no invocó el derecho de petición", "j": "Es incorrecta. Es plausible porque el escrito no nombra el derecho, pero la Ley 1437 de 2011, art. 13, señala que no es necesario invocarlo; el compañero aplica una exigencia que la norma descarta. Error de norma.", "tipo": "norma"}, {"t": "Como derecho de petición que contiene una solicitud de información y una queja", "j": "Es correcta. La Ley 1437 de 2011, art. 13 (modificado por la Ley 1755 de 2015), establece que toda actuación que inicie una persona ante las autoridades implica el ejercicio del derecho de petición sin necesidad de invocarlo, y que mediante él se puede requerir información y formular quejas.", "tipo": null}, {"t": "Como queja, sin registrar la solicitud de información que el escrito también trae", "j": "Es incorrecta. Es plausible porque la queja es la parte más visible, pero el art. 13 de la Ley 1437 de 2011 reconoce ambas actuaciones como modalidades del derecho de petición; registrar solo una deja sin trámite la otra. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M049", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 13", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#13", "fecha": "2026-10-26"}]}, {"id": "C-E03-013-1", "caso_id": "C-E03-013", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Constitución Política de Colombia, art. 113", "integra": ["RAZONAMIENTO CATEGORIAL", "GESTION DOCUMENTAL"], "caso": "Óscar Lemus, Facilitador IV de la ventanilla de correspondencia de la Dirección Seccional de Impuestos de Puerto Lindo, registra el 13 de noviembre tres comunicaciones: un oficio del Juzgado Segundo Civil del Circuito, una solicitud de una comisión del Congreso de la República y una consulta del Ministerio de Hacienda y Crédito Público. El sistema de registro tiene un campo obligatorio, «rama del poder público del remitente», y no permite guardar un radicado con ese campo vacío. Óscar debe cerrar el registro del día a las 5:00 p. m.", "enunciado": "¿Cómo debe diligenciar Óscar el campo en los registros del día?", "opciones": [{"t": "Judicial para el juzgado, legislativa para la comisión y de control para el ministerio.", "j": "Es incorrecta. Acierta con dos remitentes, pero la Constitución Política, art. 113, no incluye una rama de control entre las ramas del poder público; el ministerio pertenece a la ejecutiva. Error de norma.", "tipo": "norma"}, {"t": "Judicial para el juzgado y legislativa para la comisión, y dejar el ministerio para revisión posterior.", "j": "Es incorrecta. Clasifica bien dos remitentes, pero deja sin diligenciar el tercero, que también encaja en una de las ramas de la Constitución Política, art. 113, y el sistema no permite guardar el campo vacío. Error de completitud.", "tipo": "completitud"}, {"t": "Judicial para el juzgado, legislativa para la comisión y ejecutiva para el ministerio.", "j": "Es correcta. La Constitución Política, art. 113, define como ramas del poder público la legislativa, la ejecutiva y la judicial; el juzgado pertenece a la judicial, la comisión del Congreso a la legislativa y el ministerio a la ejecutiva.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M083", "norma": "Constitución Política de Colombia", "articulo": "art. 113", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#113", "fecha": "2026-10-26"}]}, {"id": "C-E04-010-1", "caso_id": "C-E04-010", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Ley 527 de 1999, art. 6", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Usted es Facilitador IV del punto de atención de una Dirección Seccional. El 21 de abril de 2026 la empresa Textiles del Valle Ltda. envía por el canal electrónico habilitado un mensaje con una solicitud que, según el procedimiento, debe constar por escrito. El texto del mensaje solo dice que el escrito va adjunto, pero el archivo llega dañado y el sistema de radicación no logra abrirlo. Usted debe tramitar el mensaje en el sistema de radicación antes de enviarlo a la dependencia competente.", "enunciado": "¿Cómo debe registrar usted la recepción de ese mensaje de datos?", "opciones": [{"t": "Registrar la recepción y dejar constancia de que el adjunto no es accesible para su consulta.", "j": "Es correcta. La Ley 527 de 1999, art. 6, exige que la información del mensaje de datos sea accesible para su posterior consulta para tenerla como escrito, y el art. 12, numeral 1, repite esa condición para su conservación; el adjunto dañado no la cumple y debe quedar registrado así.", "tipo": null}, {"t": "Registrar la recepción del mensaje como escrito completo y revisar la legibilidad del adjunto cuando se tramite.", "j": "Es incorrecta. Parece ágil porque no detiene la radicación, pero la Ley 527 de 1999, art. 6, solo da por satisfecho el escrito si la información es accesible para consulta, y esa condición se verifica al recibir, no después. Error de fase.", "tipo": "fase"}, {"t": "Registrar la recepción y rechazar la solicitud porque el escrito adjunto no pudo abrirse.", "j": "Es incorrecta. Acierta en registrar la recepción y en que el adjunto no cumple la condición de accesibilidad de la Ley 527 de 1999, art. 6, pero rechazar una solicitud es una decisión que no corresponde al facilitador del nivel asistencial, que registra y deja constancia. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M093", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#6", "fecha": "2026-10-26"}, {"fila": "M095", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E05-017-1", "caso_id": "C-E05-017", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.4", "integra": ["TABLAS DE RETENCION"], "caso": "Hugo Beltrán, Facilitador IV del archivo de gestión de la División de Gestión Administrativa y Financiera de una Dirección Seccional, revisa 18 cajas de la subserie Comprobantes de Préstamo de Elementos, cuyo tiempo de retención venció en 2025. La TRD marca la disposición final de esa subserie con E y la ficha de valoración la sustenta. El jefe de la división quiere destruirlas el 15 de diciembre para liberar espacio, pero aún no existe el acta del Comité Institucional de Gestión y Desempeño que apruebe esa eliminación.", "enunciado": "¿Qué debe informar Hugo al jefe antes de la fecha prevista para destruir las cajas?", "opciones": [{"t": "Que la eliminación puede hacerse, porque la tabla marca la E y la valoración la sustenta", "j": "Es incorrecta. Es plausible porque dos de los requisitos se cumplen, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 también exige la aprobación del comité, que no existe. Verifica solo una parte. Error de completitud.", "tipo": "completitud"}, {"t": "Que el jefe de la división puede aprobar la eliminación firmando el inventario", "j": "Es incorrecta. Es plausible porque el jefe responde por el archivo de su división, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 atribuye la aprobación al Comité Institucional de Gestión y Desempeño o a quien haga sus veces. Error de competencia.", "tipo": "competencia"}, {"t": "Que la eliminación está fijada y sustentada, pero le falta la aprobación del comité", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.5.4, exige que la eliminación esté establecida en la TRD, sustentada en la valoración y aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces; falta el último requisito.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M038", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.4", "fecha": "2026-10-26"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["OFIMATICA"], "caso": "En una Dirección Seccional se implementa el Sistema de Gestión de Documentos Electrónicos de Archivo y el área de tecnología ya lo habilitó para el grupo de apoyo administrativo. El Facilitador IV Luis Arango, del grupo de apoyo administrativo, gestiona las solicitudes de certificaciones que llegan por el canal electrónico; el 4 de agosto recibe 23, con radicados del 2026-2201 al 2026-2223. Un compañero le sugiere guardarlas en una carpeta compartida del equipo y subir cada expediente al sistema cuando se expida la certificación, porque así se cargan menos archivos sueltos durante el trámite.", "enunciado": "¿Qué debe entender Luis sobre el momento de incorporar los expedientes al sistema?", "opciones": [{"t": "Que se incorporan en un solo expediente por día, con las 23 solicitudes recibidas juntas.", "j": "Es incorrecta. Es plausible porque agrupa lo recibido en una misma fecha, pero cada solicitud es un trámite y el expediente se conforma por trámite según el CCD y la TRD (Acuerdo AGN 001 de 2024, art. 4.3.2.1). Error de granularidad: usa el día como unidad documental.", "tipo": "granularidad"}, {"t": "Que se incorporan al expedir la certificación, cuando cada expediente ya reúne sus documentos.", "j": "Es incorrecta. Es plausible porque el expediente queda completo al expedir la certificación, pero el art. 4.3.2.1 del Acuerdo AGN 001 de 2024 exige incorporarlo al SGDEA desde el inicio del trámite. Error de fase: aplaza la incorporación al final.", "tipo": "fase"}, {"t": "Que se incorporan desde el inicio de cada trámite, conforme al Cuadro de Clasificación y la TRD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar los expedientes electrónicos según el CCD y la TRD e incorporarlos al SGDEA desde el inicio del trámite hasta su finalización, y el art. 1.3.4 exige gestionarlos en ese sistema y no en repositorios sueltos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}, {"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-001-1", "caso_id": "C-E03-001", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["GESTION DOCUMENTAL"], "caso": "Laura Méndez, Facilitadora IV de la ventanilla de correspondencia de la Dirección Seccional de Impuestos de Villa Serena, recibe el 3 de marzo dos escritos de una misma ciudadana. En el primero, radicado 2026-0311, pregunta por el saldo de su impuesto sobre las ventas del último bimestre. En el segundo, radicado 2026-0312, reclama por el cobro del impuesto predial de su casa, que liquida la alcaldía. El procedimiento del área exige clasificar cada asunto antes de las 4:00 p. m. del mismo día, para repartirlo a la dependencia que corresponda o al trámite de asuntos ajenos.", "enunciado": "¿Cómo debe clasificar Laura los escritos recibidos antes del reparto?", "opciones": [{"t": "Clasificar ambos como asuntos de la DIAN y definir la no competencia del segundo después de hacer el reparto.", "j": "Es incorrecta. Es plausible porque los dos escritos llegan a la ventanilla y tratan de impuestos, pero el procedimiento pide clasificar antes de repartir y el predial no es un impuesto del orden nacional según el Decreto 1742 de 2020, art. 1. Error de fase.", "tipo": "fase"}, {"t": "Clasificar el primero como asunto de la DIAN y el segundo como asunto ajeno, para el trámite de no competencia.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, asigna a la DIAN la administración del impuesto sobre las ventas y de los demás impuestos internos del orden nacional cuya competencia no esté asignada a otras entidades; el predial lo liquida la alcaldía, de modo que el segundo escrito sale por el trámite de asuntos ajenos.", "tipo": null}, {"t": "Clasificar el primero como asunto de la DIAN y responder ella misma el segundo con el valor del predial.", "j": "Es incorrecta. Acierta con el impuesto sobre las ventas, pero atribuye a la Facilitador IV la respuesta de fondo sobre un tributo que liquida otra entidad; el Decreto 1742 de 2020, art. 1, no da a la DIAN ese asunto y el cargo solo clasifica y reparte. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E05-003-1", "caso_id": "C-E05-003", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.8", "integra": ["GESTION DOCUMENTAL"], "caso": "Sandra Ruiz, Facilitadora IV del archivo de gestión de la División de Gestión de Cobranzas de una Dirección Seccional, conforma el expediente de una facilidad de pago de la sociedad ficticia Textiles Mirador S.A.S. Tiene cuatro documentos: la solicitud radicada el 3 de marzo, el requerimiento de garantías del 10 de marzo, la respuesta de la sociedad del 18 de marzo y la resolución que concede la facilidad del 2 de abril. La carpeta ya está clasificada en su subserie. El jefe pide dejar la carpeta lista para la revisión de calidad del viernes.", "enunciado": "¿En qué orden debe Sandra ubicar los documentos dentro de la unidad documental?", "opciones": [{"t": "Según la secuencia del trámite: solicitud, requerimiento, respuesta y resolución", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.8, numeral 2, dispone que los tipos documentales se ordenen de forma que se evidencie el desarrollo del trámite (principio de orden original); las fechas del caso muestran esa secuencia.", "tipo": null}, {"t": "Primero la resolución que concede la facilidad y después los demás, del más reciente al más antiguo", "j": "Es incorrecta. Es plausible porque la resolución es el documento más consultado, pero el art. 4.3.1.8, numeral 2, del Acuerdo AGN 001 de 2024 exige ordenar los tipos de modo que se evidencie el desarrollo del trámite; poner la decisión al inicio invierte las etapas. Error de fase.", "tipo": "fase"}, {"t": "Agrupados por remitente: primero los de la sociedad y luego los que produjo la entidad", "j": "Es incorrecta. Es plausible porque separar por remitente parece ordenado, pero el principio de orden original (Acuerdo AGN 001 de 2024, art. 4.3.1.8, num. 2) toma como base la secuencia del trámite y no el autor de cada documento. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M029", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.8", "fecha": "2026-10-26"}]}, {"id": "C-E01-003-1", "caso_id": "C-E01-003", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 43", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "En el grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Andrés Molina organiza en el sistema de correspondencia tres documentos del expediente 2026-0388, serie Peticiones: un auto del 6 de junio que ordena pedir un certificado a otra dependencia; una resolución del 20 de junio que niega de fondo lo solicitado por Lácteos Valle Verde Ltda.; y un auto del 24 de junio que archiva por desistimiento una segunda solicitud, con lo cual esta no puede continuar. El sistema obliga a marcar los documentos contra los que caben recursos.", "enunciado": "¿Qué documentos debe marcar el facilitador en el sistema?", "opciones": [{"t": "Los tres documentos, porque todos fueron expedidos dentro de la misma actuación y obran en el expediente.", "j": "Es incorrecta. Es plausible porque los tres pertenecen al mismo expediente, pero el art. 74 de la Ley 1437 de 2011 concede los recursos contra los actos definitivos, y el auto que pide un certificado no decide el fondo ni impide continuar (art. 43). Clasifica por expediente y no por contenido. Error de granularidad.", "tipo": "granularidad"}, {"t": "Solo la resolución que niega de fondo, porque los autos se clasifican como actos de trámite dentro de la actuación.", "j": "Es incorrecta. Es plausible porque muchos autos impulsan el trámite, pero el art. 43 de la Ley 1437 de 2011 también califica como definitivo el acto que hace imposible continuar la actuación, como el auto de archivo descrito. Deja por fuera un acto definitivo. Error de completitud.", "tipo": "completitud"}, {"t": "La resolución que niega de fondo y el auto de archivo, porque uno decide el asunto y el otro impide continuarlo.", "j": "Es correcta. Ley 1437 de 2011, arts. 43 y 74: son definitivos los actos que deciden directa o indirectamente el fondo o hacen imposible continuar la actuación, y por regla general contra ellos proceden reposición y apelación. La resolución del 20 de junio y el auto del 24 de junio cumplen esa condición.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}, {"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}]}, {"id": "C-E02-003-1", "caso_id": "C-E02-003", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 36", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, el Facilitador IV Camilo Duarte atiende a Rosa Quintero, ciudadana que pide examinar el expediente de una solicitud de devolución radicada en febrero por Textiles La Pradera Ltda. El expediente tiene 86 folios y, dentro de él, el grupo responsable ya formó un cuaderno separado con documentos que la ley califica como reservados. La solicitud sigue en trámite y el grupo responsable envió el expediente al punto para otra diligencia. Rosa insiste en revisar hoy el expediente completo y en obtener copia de los folios que consulte.", "enunciado": "¿Cómo debe Camilo atender la petición de la ciudadana?", "opciones": [{"t": "Permitir el examen del expediente en su estado actual, salvo el cuaderno de documentos reservados.", "j": "Es correcta. La Ley 1437 de 2011, art. 36, da derecho a examinar los expedientes en el estado en que se encuentren, salvo los documentos o cuadernos sujetos a reserva, que van en cuaderno separado; el Acuerdo AGN 001 de 2024, art. 7.1.3, precisa que la reserva aplica a la información y no al expediente completo.", "tipo": null}, {"t": "Negar la consulta hasta que termine el trámite y la decisión de la solicitud quede en firme.", "j": "Es incorrecta. Es plausible porque la solicitud aún no tiene decisión, pero el art. 36 de la Ley 1437 de 2011 permite examinar los expedientes en el estado en que se encuentren. Error de fase: traslada la consulta a una etapa posterior que la norma no exige.", "tipo": "fase"}, {"t": "Permitir el examen de los 86 folios, porque el derecho de consulta cubre el expediente entero.", "j": "Es incorrecta. Es plausible porque el art. 36 de la Ley 1437 de 2011 reconoce a cualquier persona el derecho a examinar expedientes, pero la misma norma exceptúa los documentos o cuadernos sujetos a reserva. Error de completitud: aplica la regla general y omite la excepción.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M058", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-26"}, {"fila": "M045", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 7.1.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#7.1.3", "fecha": "2026-10-26"}]}, {"id": "C-E01-013-1", "caso_id": "C-E01-013", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 67", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, el Facilitador IV Mauricio Vega recibe a una auxiliar contable de Panificadora San Telmo S.A.S., citada para notificarse de la Resolución 1402, que pone fin a una actuación. La citación va dirigida al representante legal, Germán Rueda. La auxiliar muestra su carné de empleada, pero no trae poder ni autorización escrita del representante. Afirma que el señor Rueda está de viaje hasta el 30 de octubre y pide que la notifiquen a ella y le entreguen la copia del acto.", "enunciado": "¿Cómo debe atender el facilitador la solicitud de la auxiliar?", "opciones": [{"t": "Entregarle copia del acto ahora y dejar la diligencia de notificación para cuando traiga la autorización.", "j": "Es incorrecta. Es plausible porque parece un punto medio de servicio, pero en el art. 67 de la Ley 1437 de 2011 la entrega de la copia hace parte de la diligencia de notificación y se hace a quien está facultado para notificarse. Adelanta un paso de la diligencia. Error de fase.", "tipo": "fase"}, {"t": "Surtir la diligencia con ella y entregarle copia íntegra del acto con la anotación de la fecha y de la hora.", "j": "Es incorrecta. Es plausible porque describe bien el contenido de la diligencia, pero el art. 67 de la Ley 1437 de 2011 la limita al interesado, su representante, su apoderado o la persona autorizada; notificar a quien no lo es constituye extralimitación (Constitución Política, art. 6). Error de competencia.", "tipo": "competencia"}, {"t": "No surtir la diligencia con ella e indicarle que acuda el representante, un apoderado o alguien autorizado.", "j": "Es correcta. Ley 1437 de 2011, art. 67: las decisiones que ponen término a una actuación se notifican personalmente al interesado, a su representante o apoderado, o a la persona autorizada por el interesado. La auxiliar no tiene ninguna de esas calidades, y notificarla excedería la función (Constitución Política, art. 6).", "tipo": null}], "clave": 2, "soporte": [{"fila": "M066", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 67", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#67", "fecha": "2026-10-26"}, {"fila": "M081", "norma": "Constitución Política de Colombia", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E07-006-1", "caso_id": "C-E07-006", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Liliana, Facilitadora IV del archivo de gestión de un grupo de apoyo administrativo, recibe de su coordinadora el encargo de reunir la información para definir qué pasará con las cajas de dos subseries cuyo tiempo de retención ya terminó. En la reunión, un compañero sugiere conservar la subserie Conceptos, la más consultada en 2025, y eliminar la subserie Constancias, que ocupa más estantería. Liliana revisa la TRD: en la columna de disposición final, Conceptos tiene la sigla E y Constancias la sigla S. El Programa de Gestión Documental contiene la metodología de aplicación.", "enunciado": "¿Qué debe informar Liliana sobre el destino de la subserie Constancias?", "opciones": [{"t": "Que se elimina por el volumen que ocupa, porque la subserie Conceptos es la más consultada", "j": "Es incorrecta. Es plausible porque el espacio y la consulta son datos útiles de gestión, pero el art. 4.5.1 del Acuerdo AGN 001 de 2024 toma como base la valoración registrada en la TRD, que para Constancias es selección, no el volumen ni el uso reciente. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que su destino lo decide la coordinadora según el espacio disponible en la bodega del grupo", "j": "Es incorrecta. Es plausible porque la coordinadora dirige el grupo, pero la disposición final no depende de su criterio: el art. 4.5.1 del Acuerdo AGN 001 de 2024 la sujeta a la valoración registrada en la TRD y a la metodología del PGD. Error de competencia.", "tipo": "competencia"}, {"t": "Que se le aplica la selección registrada en la TRD, con la metodología que fija el PGD", "j": "Es correcta. El art. 4.5.1 del Acuerdo AGN 001 de 2024 ordena aplicar la disposición final de acuerdo con la valoración registrada en la TRD, con la metodología establecida en el PGD, y el art. 4.5.3 identifica la selección con la sigla S del campo de disposición final, que es la que tiene Constancias.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M035", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.1", "fecha": "2026-10-26"}, {"fila": "M037", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.3", "fecha": "2026-10-26"}]}, {"id": "C-E06-011-1", "caso_id": "C-E06-011", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.6", "integra": ["GESTION DOCUMENTAL"], "caso": "Felipe Duarte, Facilitador IV del archivo de gestión de una Dirección Seccional, encuentra el 21 de octubre en su correo electrónico institucional un mensaje de la señora Rosa Méndez con una petición y dos anexos en PDF. El mensaje trae nombre, cédula y la dirección electrónica de la remitente para recibir respuesta. Felipe no maneja correspondencia y su jefe le pide no dejar correr el término sin control. La entidad tiene una ventanilla única integrada a la sede electrónica, y el mensaje no tiene aún número de radicado.", "enunciado": "¿Qué debe hacer Felipe con el mensaje recibido?", "opciones": [{"t": "Pedir a la señora que radique la petición en la ventanilla, porque llegó al buzón personal de un servidor.", "j": "Es incorrecta. Parece ordenar el canal, pero el num. 6 del art. 7 de la Ley 1437 de 2011 obliga a tramitar las peticiones que lleguen por medios electrónicos. Error de norma.", "tipo": "norma"}, {"t": "Guardarlo en el expediente del archivo de gestión y avisar al área que debe responderlo.", "j": "Es incorrecta. Avisar al área es útil, pero el art. 4.2.6 del Acuerdo AGN 001 de 2024 exige radicar primero en la ventanilla única; archivar antes de radicar invierte el orden del procedimiento. Error de fase.", "tipo": "fase"}, {"t": "Remitirlo a la ventanilla única con sus anexos, para radicarlo y verificar los datos de contacto.", "j": "Es correcta. El art. 4.2.6 del Acuerdo AGN 001 de 2024 ordena remitir a la ventanilla única las comunicaciones que ingresen por los correos institucionales de los servidores, para radicarlas con sus anexos y verificar los datos de contacto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M021", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.6", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E03-014-1", "caso_id": "C-E03-014", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 1", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Beatriz Ocampo, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Impuestos de Sabana Nueva, revisa el 17 de noviembre el boletín interno que se distribuye el 19 de noviembre para la semana de la cultura de la legalidad. El texto dice: «Colombia es un Estado social de derecho, organizado como república federal, con entidades territoriales sin autonomía». La jefe del grupo pidió a Beatriz contrastar la frase con el artículo constitucional citado e informarle el ajuste antes de la distribución, sin cambiar el resto del boletín.", "enunciado": "¿Qué ajuste debe informar Beatriz a la jefe del grupo?", "opciones": [{"t": "Publicar el boletín en la fecha prevista y corregir la frase en una fe de erratas posterior.", "j": "Es incorrecta. Es plausible porque evita retrasar el boletín, pero la jefe pidió el ajuste antes de la distribución; la frase contradice la Constitución Política, art. 1, y circularía con el error. Error de fase.", "tipo": "fase"}, {"t": "Cambiar federal por unitaria y descentralizada, y reconocer la autonomía de las entidades territoriales.", "j": "Es correcta. La Constitución Política, art. 1, define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales; el ajuste corrige los dos errores de la frase antes de la distribución.", "tipo": null}, {"t": "Cambiar federal por unitaria y conservar la mención de las entidades territoriales sin autonomía administrativa.", "j": "Es incorrecta. Corrige la forma de la república, pero deja intacto el error sobre las entidades territoriales; la Constitución Política, art. 1, las reconoce con autonomía. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M084", "norma": "Constitución Política de Colombia", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E04-008-1", "caso_id": "C-E04-008", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 594 de 2000, art. 19", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. El 15 de septiembre de 2026 la jefatura anuncia que el archivo de gestión dejará de manejar en papel la serie Peticiones, Quejas y Reclamos y la administrará en un medio electrónico nuevo. Las carpetas de 2025 aún no tienen ordenación ni foliación, y nadie ha evaluado la seguridad ni la perdurabilidad del medio elegido. La jefatura le pide preparar un informe breve sobre los requisitos que debe cumplir la entidad para incorporar esa tecnología.", "enunciado": "¿Qué requisitos debe señalar usted en el informe para la jefatura?", "opciones": [{"t": "Pasar las carpetas al nuevo medio y organizarlas archivísticamente después de la migración.", "j": "Es incorrecta. Parece práctico porque acelera el cambio de soporte, pero la Ley 594 de 2000, art. 19, pone la organización archivística como requisito para incorporar la tecnología, no como tarea posterior, y omite los estudios técnicos. Error de fase.", "tipo": "fase"}, {"t": "Organizar archivísticamente los documentos y realizar los estudios técnicos del medio elegido.", "j": "Es correcta. La Ley 594 de 2000, art. 19, permite incorporar tecnologías en la administración de los archivos siempre que se cumplan la organización archivística de los documentos y la realización de estudios técnicos sobre conservación, seguridad, perdurabilidad y reproducción.", "tipo": null}, {"t": "Realizar estudios técnicos sobre conservación, seguridad y perdurabilidad del medio elegido.", "j": "Es incorrecta. Es plausible porque los estudios técnicos son un requisito expreso, pero la Ley 594 de 2000, art. 19, exige también la organización archivística de los documentos, que en el caso falta. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M005", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E03-009-1", "caso_id": "C-E03-009", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Ley 599 de 2000, art. 434B", "integra": ["GESTION DOCUMENTAL"], "caso": "Ramiro Vélez, Facilitador IV de correspondencia de la Dirección Seccional de Impuestos de Cerro Azul, radica el 20 de octubre un escrito anónimo con el número 2026-9031. El escrito afirma que la sociedad Comercial Andina del Llano S.A.S. incluyó en su declaración de renta facturas de proveedores que no existen, para pagar menos impuesto, y anexa copia de tres facturas. El procedimiento exige registrar el asunto con una descripción que no califique los hechos y repartirlo en dos días hábiles a la dependencia de la función que corresponda.", "enunciado": "¿Cómo debe registrar y repartir Ramiro el escrito?", "opciones": [{"t": "Registrarlo como evasión comprobada y comunicar a la sociedad la sanción penal que le corresponde.", "j": "Es incorrecta. Retoma la conducta de la Ley 599 de 2000, art. 434B, pero da por comprobado un hecho y anuncia una sanción, decisiones que no corresponden a correspondencia; el procedimiento pide describir sin calificar. Error de competencia.", "tipo": "competencia"}, {"t": "Registrarlo como queja general y archivarlo hasta que la sociedad presente una corrección de su declaración.", "j": "Es incorrecta. Parece prudente porque no califica los hechos, pero detiene el reparto que el procedimiento exige en dos días; la verificación es fiscalización, función que el Decreto 1742 de 2020, art. 3, asigna a la DIAN y que ocurre después del reparto. Error de fase.", "tipo": "fase"}, {"t": "Registrarlo como posible inclusión de costos inexistentes y repartirlo a la dependencia de fiscalización.", "j": "Es correcta. La Ley 599 de 2000, art. 434B, menciona la inclusión de costos o gastos inexistentes en una declaración, y el Decreto 1742 de 2020, art. 3, num. 1, asigna a la DIAN la fiscalización del impuesto de renta; describir el hecho como posible y repartirlo cumple el procedimiento sin calificar.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M100", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 434B", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#434B", "fecha": "2026-10-26"}, {"fila": "M097", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E01-004-1", "caso_id": "C-E01-004", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 45", "integra": ["GESTION DOCUMENTAL"], "caso": "La Facilitadora IV Diana Herrera, del archivo de gestión de una Dirección Seccional, recibe para incorporar al expediente la Resolución 0912 del 3 de agosto, que resolvió una solicitud de Transportes La Sabana S.A.S. El 19 de agosto el funcionario competente firmó un acto que corrige el número de identificación tributaria, digitado con dos cifras invertidas, sin variar lo decidido. El representante de la empresa llama a preguntar si con esa corrección vuelve a empezar el término para demandar. La tabla de retención ubica ambos documentos en la serie Resoluciones.", "enunciado": "¿Qué debe registrar la facilitadora sobre el trámite que sigue el acto de corrección?", "opciones": [{"t": "Que se archiva junto a la resolución, porque al no cambiar la decisión no necesita darse a conocer.", "j": "Es incorrecta. Es plausible porque la corrección no altera lo decidido, pero el art. 45 de la Ley 1437 de 2011 ordena notificarla o comunicarla a todos los interesados. Omite un paso obligatorio del trámite. Error de completitud.", "tipo": "completitud"}, {"t": "Que se remite para notificarlo o comunicarlo a los interesados, sin anotar un plazo nuevo para demandar.", "j": "Es correcta. Ley 1437 de 2011, art. 45: los errores de digitación se corrigen en cualquier tiempo, la corrección no cambia el sentido de la decisión ni revive los términos para demandar, y debe notificarse o comunicarse a todos los interesados.", "tipo": null}, {"t": "Que se remite para notificarlo a los interesados y que desde esa fecha corre otra vez el plazo para demandar.", "j": "Es incorrecta. Es plausible porque el acto de corrección sí debe notificarse o comunicarse, pero el art. 45 de la Ley 1437 de 2011 dispone que la corrección no revive los términos legales para demandar. Atribuye a la corrección un efecto que la norma excluye. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M063", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 45", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#45", "fecha": "2026-10-26"}]}, {"id": "C-E02-001-1", "caso_id": "C-E02-001", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.7", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Paula Ríos, Facilitadora IV del archivo de gestión de una Dirección Seccional, custodia el expediente de la solicitud de devolución de saldo a favor que Ferretería El Cóndor S.A.S. radicó con el número 2026-0417 el 3 de marzo. El 12 de mayo llega por ventanilla, con el radicado nuevo 2026-0955, un escrito del mismo contribuyente que aporta los certificados bancarios pedidos en el requerimiento de ese trámite. La solicitud sigue en estudio y el grupo de devoluciones no ha proferido decisión. Una compañera sugiere abrir una carpeta con el número del radicado nuevo.", "enunciado": "¿Qué debe hacer Paula con el escrito recibido?", "opciones": [{"t": "Abrir un expediente nuevo con el radicado del escrito, porque cada radicado forma su propia unidad.", "j": "Es incorrecta. Es plausible porque cada comunicación recibe un radicado propio en ventanilla, pero el radicado identifica la comunicación y no define la unidad documental: el art. 4.3.1.7 del Acuerdo AGN 001 de 2024 agrupa los documentos por trámite. Error de granularidad: toma el radicado como unidad en lugar del trámite.", "tipo": "granularidad"}, {"t": "Incorporarlo al expediente abierto de la solicitud, porque hace parte del mismo trámite en curso.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.7, ordena conformar los expedientes con la totalidad de los documentos agrupados en desarrollo de un mismo trámite, y la Ley 1437 de 2011, art. 36, dispone que los documentos de una misma actuación se organicen en un solo expediente. El escrito responde al requerimiento de la solicitud que sigue en estudio.", "tipo": null}, {"t": "Guardarlo aparte hasta que se decida la solicitud y luego sumarlo al expediente ya cerrado.", "j": "Es incorrecta. Es plausible porque el expediente estará completo al terminar el trámite, pero el art. 36 de la Ley 1437 de 2011 exige acumular los documentos de la actuación en el expediente mientras se tramita, y el cierre solo procede al finalizar el trámite (Acuerdo AGN 001 de 2024, art. 4.3.1.9). Error de fase: aplaza la incorporación a una etapa posterior.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M028", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.7", "fecha": "2026-10-26"}, {"fila": "M058", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-26"}]}, {"id": "C-E05-001-1", "caso_id": "C-E05-001", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.4", "integra": ["GESTION DOCUMENTAL"], "caso": "Lucía Márquez, Facilitadora IV del archivo de gestión de la División de Gestión de Fiscalización de una Dirección Seccional, recibe 40 carpetas sin código que llegaron desde correspondencia. El Cuadro de Clasificación Documental vigente asigna a la sección el código 1205, a la serie Programas de Fiscalización el código 1205.45 y a la subserie Investigaciones de Oficio el código 1205.45.02. Las carpetas contienen expedientes de investigaciones de oficio abiertas en 2026. La jefa pidió dejar listos los rótulos antes del viernes, sin crear códigos distintos de los que trae el cuadro.", "enunciado": "¿Qué código debe registrar Lucía en el rótulo de las carpetas al clasificarlas?", "opciones": [{"t": "El código 1205.45.02, que representa sección, serie y subserie según el cuadro", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena que las agrupaciones se codifiquen representando la jerarquía en que se subdivide el fondo (secciones, series y subseries) conforme al Cuadro de Clasificación Documental; los expedientes pertenecen a la subserie Investigaciones de Oficio.", "tipo": null}, {"t": "El código 1205.45, porque la serie reúne todos los expedientes de fiscalización", "j": "Es incorrecta. Es plausible porque la serie sí agrupa los programas de fiscalización, pero el artículo 4.3.1.4 del Acuerdo AGN 001 de 2024 exige codificar la jerarquía completa hasta la subserie cuando el cuadro la prevé; quedarse en la serie pierde un nivel. Error de granularidad.", "tipo": "granularidad"}, {"t": "El código que asigne el archivo central cuando reciba la transferencia primaria", "j": "Es incorrecta. Es plausible porque el archivo central revisa las transferencias, pero el Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena codificar las agrupaciones conforme al Cuadro de Clasificación Documental, y el cuadro vigente ya trae el código de la subserie; dejar el rótulo pendiente de otra dependencia aplaza una codificación que ya está definida. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-005-1", "caso_id": "C-E03-005", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Ley 1762 de 2015, art. 1", "integra": ["OFIMATICA"], "caso": "Paula Cifuentes, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Aduanas de Bahía Norte, prepara el 6 de agosto las diapositivas de la campaña contra el contrabando que se presentará el 12 de agosto ante gremios de comerciantes. El coordinador le pide que la diapositiva inicial resuma el objeto de la ley anticontrabando con las operaciones ilegales que esa ley nombra. El borrador recibido menciona solo el contrabando y el coordinador exige que la frase no agregue conductas que la ley no nombra.", "enunciado": "¿Qué frase debe incluir Paula en la diapositiva inicial?", "opciones": [{"t": "Fortalecer la lucha contra la competencia desleal por contrabando, lavado de activos y financiación del terrorismo.", "j": "Es incorrecta. Es plausible porque el lavado de activos suele citarse junto con la financiación del terrorismo, pero la Ley 1762 de 2015, art. 1, nombra el contrabando, el lavado de activos y la defraudación fiscal, no la financiación del terrorismo. Error de norma.", "tipo": "norma"}, {"t": "Fortalecer la lucha contra la competencia desleal por contrabando, lavado de activos y defraudación fiscal.", "j": "Es correcta. La Ley 1762 de 2015, art. 1, fija como objeto fortalecer la lucha contra la competencia desleal realizada en operaciones ilegales de contrabando, lavado de activos y defraudación fiscal; la frase recoge las tres conductas sin agregar otras.", "tipo": null}, {"t": "Fortalecer la lucha contra la competencia desleal que generan las personas en operaciones ilegales de contrabando.", "j": "Es incorrecta. Recoge bien la competencia desleal y el contrabando, pero repite el vacío del borrador: la Ley 1762 de 2015, art. 1, nombra también el lavado de activos y la defraudación fiscal. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M098", "norma": "Ley 1762 de 2015 (ley anticontrabando)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1762_2015.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E03-011-1", "caso_id": "C-E03-011", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 209", "integra": ["OFIMATICA"], "caso": "Hernán Duque, Facilitador IV del grupo de apoyo administrativo de la Dirección Seccional de Impuestos de Altamira, revisa el 4 de noviembre el documento de inducción para el personal de apoyo de una campaña de cobro persuasivo. Un recuadro titulado «Principios de la función administrativa» enumera igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y confidencialidad. El documento se publica el 7 de noviembre y debe coincidir con el texto constitucional; Hernán puede corregir el recuadro y debe avisar del cambio a la coordinadora antes de la publicación.", "enunciado": "¿Qué ajuste debe hacer Hernán en el recuadro?", "opciones": [{"t": "Reemplazar confidencialidad por legalidad, que es el principio que completa la lista constitucional.", "j": "Es incorrecta. La legalidad suena propia de la administración, pero la Constitución Política, art. 209, no la incluye en la lista de principios de la función administrativa; el que falta es publicidad. Error de norma.", "tipo": "norma"}, {"t": "Conservar los siete principios del recuadro y añadir publicidad al final como octavo principio.", "j": "Es incorrecta. Es plausible porque incorpora el principio que falta, pero mantiene confidencialidad, que la Constitución Política, art. 209, no menciona; el recuadro queda con un principio ajeno al texto. Error de completitud.", "tipo": "completitud"}, {"t": "Reemplazar confidencialidad por publicidad, que es el principio que completa la lista constitucional.", "j": "Es correcta. La Constitución Política, art. 209, enumera igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad; confidencialidad no figura y publicidad es el principio que falta.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M079", "norma": "Constitución Política de Colombia", "articulo": "art. 209", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#209", "fecha": "2026-10-26"}]}, {"id": "C-E05-002-1", "caso_id": "C-E05-002", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.2", "integra": ["GESTION DOCUMENTAL"], "caso": "En el grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Andrés Pineda revisa una caja con 25 oficios que la División de Gestión Jurídica produjo en 2025 al tramitar conceptos internos. La caja llegó por error al archivo de gestión de su grupo, mezclada con las actas de comité del propio grupo, también de 2025. El coordinador le pide clasificar el contenido con el Cuadro de Clasificación Documental y le recuerda que el inventario documental del grupo debe entregarse el lunes siguiente.", "enunciado": "¿Qué criterio debe aplicar Andrés para agrupar los oficios encontrados en la caja?", "opciones": [{"t": "Ubicarlos en la sección de la oficina que los produjo y en la serie que el cuadro le asigna", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.2, obliga a respetar el principio de procedencia, que determina la oficina productora a partir de la estructura orgánico-funcional, y el art. 4.3.1.4 manda clasificar en secciones y series conforme al cuadro; los oficios son de la División de Gestión Jurídica.", "tipo": null}, {"t": "Ordenarlos por fecha de radicación, sin código, hasta que la oficina jurídica los solicite", "j": "Es incorrecta. Es plausible porque ordenar por fecha aporta algún control, pero omite la clasificación por sección y serie que exige el Acuerdo AGN 001 de 2024, art. 4.3.1.4; deja sin resolver lo que pidió el coordinador. Error de completitud.", "tipo": "completitud"}, {"t": "Ubicarlos en la serie de actas del grupo, porque llegaron en la misma caja y del mismo año", "j": "Es incorrecta. Es plausible porque la caja y el año coinciden, pero el principio de procedencia (Acuerdo AGN 001 de 2024, art. 4.3.1.2) atiende a la oficina que produjo los documentos y no al lugar donde se encontraron; asigna los oficios a una dependencia que no los produjo. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M024", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.2", "fecha": "2026-10-26"}, {"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E07-007-1", "caso_id": "C-E07-007", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.2", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Hernán, Facilitador IV del archivo de gestión de una Dirección Seccional, organiza cajas de la subserie Resoluciones de Gestión Tributaria, que documentan decisiones de la entidad frente a los contribuyentes. La TRD le asigna dos años en gestión, ocho en archivo central y, en disposición final, la sigla CT. Un auxiliar nuevo le pregunta si al terminar los diez años podrá tomarse una muestra y descartar el resto, como se hace con otra subserie marcada con la sigla S. Las cajas entrarán en el plan de transferencias de 2027.", "enunciado": "¿Qué debe explicar Hernán al auxiliar sobre el destino de esa subserie?", "opciones": [{"t": "Que la sigla indica conservación total por el valor de los documentos como testimonio", "j": "Es correcta. El art. 4.5.2 del Acuerdo AGN 001 de 2024 establece que la conservación total se fija en el campo disposición final de la TRD con la sigla CT, teniendo en cuenta valores como evidencia y testimonio de las funciones y decisiones de las instituciones.", "tipo": null}, {"t": "Que al cumplir los diez años el archivo central puede tomar una muestra y eliminar el resto", "j": "Es incorrecta. Es plausible porque la muestra existe para las subseries marcadas con S, pero confunde las categorías: el art. 4.5.2 del Acuerdo AGN 001 de 2024 asigna a la sigla CT la conservación total, que no admite muestreo ni descarte. Error de norma.", "tipo": "norma"}, {"t": "Que la conservación total se decidirá cuando el comité revise las cajas en el archivo central", "j": "Es incorrecta. Es plausible porque las cajas pasarán luego al archivo central, pero la conservación total ya quedó establecida en el campo disposición final de la TRD, como dispone el art. 4.5.2 del Acuerdo AGN 001 de 2024; no se aplaza a una revisión posterior. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M036", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.2", "fecha": "2026-10-26"}]}, {"id": "C-E07-015-1", "caso_id": "C-E07-015", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.1.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Elena, Facilitadora IV de correspondencia de una Dirección Seccional, recibe de la División de Fiscalización 22 oficios ya respondidos para que los archive. Como la ventanilla de correspondencia los radicó y despachó, una compañera propone guardarlos en una carpeta de la TRD de correspondencia. Elena observa que los oficios se produjeron en desarrollo de funciones de fiscalización y que la TRD de esa división incluye la subserie Requerimientos de Información. El archivo de gestión de Fiscalización recibe documentos los martes y jueves, y la próxima recepción es pasado mañana.", "enunciado": "¿Qué criterio debe aplicar Elena para clasificar los oficios?", "opciones": [{"t": "La TRD de la oficina que produjo los oficios en desarrollo de sus funciones", "j": "Es correcta. El numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 indica que la TRD valora los documentos que se producen en desarrollo de las funciones de cada unidad administrativa u oficina productora; los oficios son de Fiscalización y caben en su subserie.", "tipo": null}, {"t": "La TRD de correspondencia, porque esa dependencia radicó y despachó los oficios", "j": "Es incorrecta. Es plausible porque correspondencia intervino en el radicado y el envío, pero el numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 vincula la TRD a las funciones de la oficina productora, que aquí es Fiscalización. Error de competencia.", "tipo": "competencia"}, {"t": "La serie general de comunicaciones oficiales, porque los oficios son correspondencia enviada", "j": "Es incorrecta. Es plausible porque los oficios son comunicaciones, pero clasificarlos por su forma ignora la función que los produjo; el numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 valora los documentos según las funciones de la oficina productora. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M039", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.1.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.1.1", "fecha": "2026-10-26"}]}, {"id": "C-E02-007-1", "caso_id": "C-E02-007", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.2", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Al revisar el archivo de gestión del grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Óscar Lemus encuentra tres carpetas de actas del Comité de Cartera producidas entre 2024 y 2025 por el Grupo de Cobranzas, que las prestó para una auditoría y no las reclamó. Su propio grupo guarda actas de comités internos con una denominación parecida. Para ahorrar espacio en el depósito, una compañera propone integrarlas a la serie Actas del grupo de apoyo administrativo, porque comparten tipo documental. Las carpetas no tienen rótulo de serie.", "enunciado": "¿Qué debe tener en cuenta Óscar para organizar esas carpetas?", "opciones": [{"t": "Que pertenecen a la serie Actas de su grupo, porque coinciden en el tipo documental.", "j": "Es incorrecta. Es plausible porque el tipo documental es el mismo, pero la procedencia se define por la unidad productora y no por la forma del documento (Acuerdo AGN 001 de 2024, art. 4.3.1.2). Error de granularidad: agrupa por un criterio equivocado.", "tipo": "granularidad"}, {"t": "Que pertenecen al grupo que las custodia, porque quedaron en su archivo tras el préstamo.", "j": "Es incorrecta. Es plausible porque las carpetas están hoy bajo custodia del grupo de apoyo, pero la tenencia física no cambia la oficina productora que fija el art. 4.3.1.2 del Acuerdo AGN 001 de 2024. Error de competencia: atribuye los documentos a la dependencia equivocada.", "tipo": "competencia"}, {"t": "Que pertenecen al Grupo de Cobranzas, que las produjo en desarrollo de sus funciones.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.2, exige respetar el principio de procedencia, que determina la oficina que produce los documentos en desarrollo de sus funciones, y la Ley 594 de 2000, art. 11, obliga a organizar los archivos con ese principio.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.2", "fecha": "2026-10-26"}, {"fila": "M002", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-26"}]}, {"id": "C-E06-013-1", "caso_id": "C-E06-013", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1712 de 2014, art. 2", "integra": ["TABLAS DE RETENCION"], "caso": "Germán Castro, Facilitador IV del archivo de gestión de una Dirección Seccional, recibe el 26 de octubre la solicitud de un estudiante que pide consultar el informe de gestión del año anterior, archivado en la serie Informes. El documento no tiene marca de reserva y ninguna ley restringe su contenido. Una compañera opina que solo debe mostrarse a quien acredite un interés directo. La tabla de retención documental indica que la serie permanece dos años en el archivo de gestión antes de su transferencia. Germán debe responder la solicitud ese mismo día.", "enunciado": "¿Qué criterio de acceso debe aplicar Germán a la solicitud?", "opciones": [{"t": "Remitir la solicitud al archivo central, que es el que custodia los documentos de consulta pública.", "j": "Es incorrecta. El archivo central recibe las transferencias, pero según la tabla de retención el informe sigue en el archivo de gestión; la opción traslada la solicitud a una etapa posterior del ciclo. Error de fase.", "tipo": "fase"}, {"t": "Permitir la consulta, porque el informe es público y no hay reserva legal que lo limite.", "j": "Es correcta. El art. 2 de la Ley 1712 de 2014 establece que toda información en custodia de un sujeto obligado es pública y solo puede reservarse por disposición constitucional o legal, en armonía con el art. 74 de la Constitución.", "tipo": null}, {"t": "Permitir la consulta de un resumen del informe y reservar el resto del documento.", "j": "Es incorrecta. Da acceso parcial, pero el art. 4 de la Ley 1712 de 2014 solo admite restringir por excepciones contempladas en la ley o la Constitución, y aquí no existe ninguna. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M085", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#2", "fecha": "2026-10-26"}, {"fila": "M077", "norma": "Constitución Política de Colombia", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#74", "fecha": "2026-10-26"}, {"fila": "M087", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#4", "fecha": "2026-10-26"}]}, {"id": "C-E04-009-1", "caso_id": "C-E04-009", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 1.3.4", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional. Los documentos de los procesos de compra del área, como estudios previos y propuestas, se gestionan desde marzo de 2026 en una plataforma transaccional de uso común de las entidades del Estado. En una reunión del 9 de octubre, un compañero sostiene que esos documentos no hacen parte de los archivos del área porque la plataforma la administra otra entidad. Usted debe aclarar a quién corresponde garantizar su organización, conservación y acceso.", "enunciado": "¿Qué debe aclarar usted sobre la responsabilidad frente a esos documentos?", "opciones": [{"t": "La entidad que administra la plataforma responde por la conformación, conservación y acceso.", "j": "Es incorrecta. Es plausible porque esa entidad opera la plataforma, pero el Acuerdo AGN 001 de 2024, art. 1.3.4, deja la responsabilidad en el sujeto obligado que gestiona sus documentos allí, en articulación con su área de tecnologías. Error de competencia.", "tipo": "competencia"}, {"t": "La entidad debe garantizar la consulta de los documentos, y la plataforma responde por su conservación.", "j": "Es incorrecta. Resulta plausible porque el acceso es parte de la obligación, pero el Acuerdo AGN 001 de 2024, art. 1.3.4, exige a la entidad garantizar además la conformación de expedientes, la organización, la conservación y la preservación. Error de completitud.", "tipo": "completitud"}, {"t": "La entidad, con el área de tecnologías, debe garantizar la conformación, conservación y acceso.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 1.3.4, asigna a los sujetos obligados, en articulación con las áreas de tecnologías de la información, la responsabilidad de garantizar la conformación de expedientes, organización, conservación, preservación y acceso de los documentos gestionados en plataformas transaccionales de uso común.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E05-008-1", "caso_id": "C-E05-008", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 19", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "La Facilitadora IV Natalia Gómez atiende la ventanilla de correspondencia de una Dirección Seccional. El 4 de agosto llega el radicado 2026-2210 de Hernán Duarte, que dice solamente: «Solicito lo mismo de la vez pasada, por favor». No anexa documentos ni identifica trámite, acto o dependencia, ni explica qué espera recibir. El escrito es cortés, y en el sistema no aparece ninguna petición anterior de esa persona. Su coordinadora, que firma los oficios de salida, le pide clasificar el escrito y proyectar el oficio que corresponda a esa clasificación para su firma.", "enunciado": "¿En qué categoría debe clasificar Natalia el escrito para proyectar el oficio?", "opciones": [{"t": "Petición reiterativa, que se responde remitiéndose a la contestación anterior", "j": "Es incorrecta. Es plausible porque el escrito alude a una vez pasada, pero la remisión a respuestas anteriores del art. 19 de la Ley 1437 de 2011 supone una petición ya resuelta, y el sistema no registra ninguna; presupone una etapa que no ocurrió. Error de fase.", "tipo": "fase"}, {"t": "Petición incompleta, que se devuelve para que el peticionario allegue los anexos faltantes", "j": "Es incorrecta. Es plausible porque el escrito no trae anexos, pero el art. 19 de la Ley 1437 de 2011 prohíbe devolver peticiones por considerarlas incompletas; el problema es que no se entiende el objeto. Error de norma.", "tipo": "norma"}, {"t": "Petición cuyo objeto no se comprende, que se devuelve para que se aclare en diez días", "j": "Es correcta. La Ley 1437 de 2011, art. 19 (modificado por la Ley 1755 de 2015), dispone que cuando no se comprenda la finalidad u objeto de la petición esta se devolverá al interesado para que la corrija o aclare dentro de los diez días siguientes; el escrito no permite saber qué se pide.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M054", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E05-016-1", "caso_id": "C-E05-016", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.2", "integra": ["TABLAS DE RETENCION"], "caso": "La Facilitadora IV Juliana Torres apoya la actualización de la Tabla de Retención Documental del grupo de apoyo administrativo de una Dirección Seccional. Revisa dos subseries: Actas del Comité de Dirección, que registran desde 1995 las decisiones sobre la gestión de la seccional, y Planillas de Control de Visitantes, con 300 cajas cuyo contenido también está registrado en el sistema de acceso del edificio. El borrador deja en blanco la disposición final de ambas y el coordinador le pide proponer la de cada una para el proyecto que estudiará el comité.", "enunciado": "¿Qué disposición final debe proponer Juliana para cada subserie?", "opciones": [{"t": "Conservación total para las actas y selección para las planillas de control de visitantes", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.5.2, reserva la conservación total a documentos con valor como evidencia de las decisiones de las instituciones, y el art. 4.5.3 aplica la selección a series de gran volumen o cuyo contenido se encuentra registrado en otras; así se reparten las dos subseries.", "tipo": null}, {"t": "Selección para las actas, por sus años, y conservación total para las planillas, por su volumen", "j": "Es incorrecta. Es plausible porque menciona las dos disposiciones de la tabla, pero las invierte: el Acuerdo AGN 001 de 2024 asocia la selección (art. 4.5.3) al gran volumen o al contenido registrado en otras fuentes, y la conservación total (art. 4.5.2) al valor de evidencia de decisiones. Error de norma.", "tipo": "norma"}, {"t": "Ninguna por ahora, hasta que el archivo central la defina en la transferencia primaria", "j": "Es incorrecta. Es plausible porque el archivo central interviene en las transferencias, pero el Acuerdo AGN 001 de 2024, arts. 4.5.2 y 4.5.3, exige que la disposición final quede establecida en la TRD, que es lo que se está elaborando; aplazarla la traslada a otra etapa. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M036", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.2", "fecha": "2026-10-26"}, {"fila": "M037", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.3", "fecha": "2026-10-26"}]}, {"id": "C-E07-002-1", "caso_id": "C-E07-002", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.9", "integra": ["GESTION DOCUMENTAL"], "caso": "Paula, Facilitadora IV del archivo de gestión de un grupo de apoyo administrativo, revisa el expediente de una solicitud de facilidad de pago de la empresa Distribuidora El Roble S.A.S. El primer documento se radicó el 10 de febrero de 2023 y el último acto, que puso fin al trámite, se comunicó el 14 de agosto de 2025. La TRD asigna a la subserie dos años en archivo de gestión. Su coordinador le pide informar desde cuándo corre ese tiempo, pues el expediente todavía figura como abierto en el control de la dependencia.", "enunciado": "¿Qué debe informar Paula al coordinador sobre el cómputo del tiempo de retención?", "opciones": [{"t": "Que el expediente debe cerrarse porque el trámite finalizó y desde ese cierre corre el tiempo", "j": "Es correcta. El art. 4.3.1.9 del Acuerdo AGN 001 de 2024 dispone que el cierre se hace una vez finalizado el trámite que dio origen a la unidad documental y que desde el cierre empiezan a contar los tiempos de la TRD; el trámite terminó en agosto de 2025 y el expediente sigue abierto.", "tipo": null}, {"t": "Que el tiempo se cuenta desde la radicación del primer documento que dio origen al expediente", "j": "Es incorrecta. Es plausible porque el primer radicado abre el expediente, pero el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 fija el inicio del cómputo en el cierre de la unidad documental, no en su apertura. Toma una fecha base equivocada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que el tiempo se cuenta desde la fecha en que el expediente se entregue al archivo central", "j": "Es incorrecta. Es plausible porque la entrega al archivo central marca un cambio de fase, pero esa entrega ocurre después de cumplir el tiempo en gestión; el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 hace correr ese tiempo desde el cierre. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M030", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.9", "fecha": "2026-10-26"}]}, {"id": "C-E01-015-1", "caso_id": "C-E01-015", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 77", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "A la ventanilla de una Dirección Seccional llega por correo certificado un escrito de reposición contra la Resolución 0659, firmado por la abogada Teresa Lozano. El Facilitador IV Esteban Mora verifica en el expediente 2026-0442 que la abogada fue reconocida como apoderada de Óptica Visión Central Ltda. mediante auto del 3 de junio. El escrito llegó dentro del término, pero no trae sello de presentación personal ante notario, y un compañero sugiere devolverlo. El acto lo expidió la jefa de una división de la seccional.", "enunciado": "¿Qué trámite debe dar el facilitador al escrito?", "opciones": [{"t": "Radicarlo sin exigir presentación personal y remitirlo a la jefa que expidió el acto, ante quien se tramita.", "j": "Es correcta. Ley 1437 de 2011, arts. 77 y 74: el escrito del recurso no requiere presentación personal si quien lo presenta ha sido reconocido en la actuación, y la reposición se interpone ante quien expidió la decisión.", "tipo": null}, {"t": "Devolverlo para que la apoderada lo presente en persona y luego remitirlo a la jefa que expidió el acto.", "j": "Es incorrecta. Es plausible porque la presentación personal se exige en otros trámites, pero el art. 77 de la Ley 1437 de 2011 dispensa de ella a quien ha sido reconocido en la actuación, como la apoderada. Impone un requisito que la norma no prevé. Error de norma.", "tipo": "norma"}, {"t": "Radicarlo sin exigir presentación personal y remitirlo al superior inmediato de la jefa que expidió el acto.", "j": "Es incorrecta. Es plausible porque el superior conoce de la apelación, pero el art. 74, num. 1, de la Ley 1437 de 2011 asigna la reposición a quien expidió la decisión. Envía el escrito a una autoridad equivocada. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M071", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 77", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#77", "fecha": "2026-10-26"}, {"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}]}, {"id": "C-E06-001-1", "caso_id": "C-E06-001", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 15", "integra": ["GESTION DOCUMENTAL"], "caso": "Lucía Prada, Facilitadora IV de la ventanilla de una Dirección Seccional, recibe el 14 de abril a las 10:20 a. m. una solicitud de actualización de datos de la sociedad ficticia Comercializadora Alfa S. A. S. La norma del trámite exige anexar el certificado de existencia y representación legal, y el representante no lo trae. Lucía se lo advierte en el acto, pero él insiste en que el escrito quede radicado ese mismo día. El último radicado de entrada asignado en el sistema es el 004318 y la ventanilla cierra a mediodía.", "enunciado": "¿Cómo debe proceder Lucía con la radicación del escrito?", "opciones": [{"t": "Radicarlo con el consecutivo 004319 y remitirlo al área para que esta pida luego el certificado.", "j": "Es incorrecta. Asigna bien el consecutivo, pero omite la constancia de los requisitos faltantes que el art. 15 de la Ley 1437 de 2011 exige en el acto de recibo. Error de completitud.", "tipo": "completitud"}, {"t": "Radicarlo con el consecutivo 004319, fecha y hora, y dejar constancia del certificado faltante.", "j": "Es correcta. El art. 15 de la Ley 1437 de 2011 dispone que, si el peticionario insiste, se radique dejando constancia de los documentos faltantes, y el art. 4.2.3 del Acuerdo AGN 001 de 2024 exige el número consecutivo con fecha y hora de recibo.", "tipo": null}, {"t": "Devolver el escrito y asignarle radicado cuando el representante entregue el certificado.", "j": "Es incorrecta. Parece prudente esperar el anexo, pero el art. 15 de la Ley 1437 de 2011 ordena radicar cuando el peticionario insiste; la opción aplaza la radicación a una etapa posterior. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M051", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 15", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#15", "fecha": "2026-10-26"}, {"fila": "M018", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.3", "fecha": "2026-10-26"}]}, {"id": "C-E06-002-1", "caso_id": "C-E06-002", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 14", "integra": ["GESTION DOCUMENTAL"], "caso": "Andrés Mejía, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, lleva el control de términos de las peticiones. El 3 de marzo se radicó una petición de copias de documentos del archivo de gestión. Cuando han corrido nueve de los diez días del término, la jefe del área le informa que las copias no estarán listas a tiempo por un traslado de expedientes y le entrega un oficio para el peticionario. Andrés debe revisar el oficio y despacharlo ese mismo día con radicado de salida.", "enunciado": "¿Qué debe verificar Andrés en el oficio antes de despacharlo?", "opciones": [{"t": "Que informe el nuevo plazo de veinte días aunque omita los motivos de la demora.", "j": "Es incorrecta. Respeta el límite del doble del término, pero el parágrafo del art. 14 de la Ley 1437 de 2011 exige expresar los motivos de la demora junto con el plazo. Error de completitud.", "tipo": "completitud"}, {"t": "Que exprese los motivos de la demora y fije un plazo que no exceda de veinte días.", "j": "Es correcta. El parágrafo del art. 14 de la Ley 1437 de 2011 obliga a informar, antes del vencimiento, los motivos de la demora y un plazo razonable que no exceda del doble del inicial; para copias el término es de diez días (num. 1).", "tipo": null}, {"t": "Que exprese los motivos de la demora y fije un plazo de hasta treinta días, el doble del término general.", "j": "Es incorrecta. Es plausible porque aplica el límite del doble, pero lo calcula sobre el término general de quince días; el num. 1 del art. 14 de la Ley 1437 de 2011 fija diez días para las peticiones de documentos, y el parágrafo limita el nuevo plazo al doble del inicialmente previsto, es decir, veinte días. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M050", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 14", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#14", "fecha": "2026-10-26"}]}, {"id": "C-E06-006-1", "caso_id": "C-E06-006", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 17", "integra": ["GESTION DOCUMENTAL"], "caso": "Paula Gómez, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, controla las peticiones repartidas al área de devoluciones. La petición con radicado 009115 entró el 1 de agosto. El 8 de agosto, la funcionaria que la estudia le informa que falta un extracto bancario que el solicitante debe aportar para que el área decida de fondo, y que la actuación puede continuar si lo allega. Paula debe registrar en el sistema de control la gestión que sigue y los plazos asociados a esa gestión.", "enunciado": "¿Qué gestión y plazos debe registrar Paula para esta petición?", "opciones": [{"t": "Archivo de la petición por incompleta y aviso al solicitante para que la presente de nuevo.", "j": "Es incorrecta. El archivo puede llegar si el peticionario no completa, pero el art. 17 de la Ley 1437 de 2011 exige primero el requerimiento; la opción salta a una etapa posterior. Error de fase.", "tipo": "fase"}, {"t": "Requerimiento al solicitante dentro de los quince días siguientes a la radicación, para completar en diez días.", "j": "Es incorrecta. Identifica bien el requerimiento, pero toma el término general de respuesta del art. 14 y un plazo de diez días; el art. 17 de la Ley 1437 de 2011 fija diez días para requerir y un mes para completar. Error de norma.", "tipo": "norma"}, {"t": "Requerimiento al solicitante dentro de los diez días siguientes a la radicación, para completar en un mes.", "j": "Es correcta. El art. 17 de la Ley 1437 de 2011 ordena requerir al peticionario dentro de los diez días siguientes a la radicación, cuando la petición está incompleta, para que la complete en el término máximo de un mes.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M053", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 17", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#17", "fecha": "2026-10-26"}]}, {"id": "C-E04-014-1", "caso_id": "C-E04-014", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 12", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. El área conserva las facturas electrónicas que los contribuyentes aportaron en formato XML dentro de solicitudes radicadas entre enero y junio de 2026. Para ahorrar espacio, un compañero propone guardar solo una imagen de la representación gráfica de cada factura y borrar los archivos XML recibidos, porque la imagen también se puede abrir y leer. La TRD fija para esa serie un tiempo de retención de diez años. Usted debe explicar qué condición de conservación pone en riesgo la propuesta.", "enunciado": "¿Qué debe explicar usted a su compañero sobre la conservación de esas facturas?", "opciones": [{"t": "Que debe conservarse el XML recibido o un formato que demuestre reproducir exactamente su información.", "j": "Es correcta. La Ley 527 de 1999, art. 12, numeral 2, exige que el mensaje de datos se conserve en el formato en que se generó, envió o recibió, o en uno que permita demostrar que reproduce con exactitud la información; una imagen sin el XML no lo demuestra.", "tipo": null}, {"t": "Que la imagen sirve porque permite consultar el contenido de cada factura en cualquier momento posterior.", "j": "Es incorrecta. Es plausible porque la imagen cumple la accesibilidad del numeral 1 de la Ley 527 de 1999, art. 12, pero no atiende el numeral 2 sobre el formato de generación o recepción. Error de completitud.", "tipo": "completitud"}, {"t": "Que la imagen puede guardarse ahora y compararse con el XML cuando alguien pida consultarlo.", "j": "Es incorrecta. Parece prudente por
