<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-FA4-C03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-FA4-C03", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Facilitador IV, nivel asistencial, OPEC 236902", "empleo_corto": "Facilitador IV", "nivel_txt": "asistencial", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 300, "funcionales": 206}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-26", "semilla": 236905, "corte_normativo": "2026-10-26"}, "pjs": [{"id": "C-E07-014-1", "caso_id": "C-E07-014", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.4.1", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Ricardo, Facilitador IV del grupo de apoyo administrativo, recopila los cambios ocurridos en la Dirección Seccional durante 2026 para un reporte al grupo de gestión documental. En marzo se nombró una nueva jefa en la División de Recaudo. En mayo, una resolución trasladó el trámite de devoluciones de la División de Recaudo a la División de Cobranzas. En agosto se amplió el horario del punto de atención. El grupo de gestión documental le pide señalar cuál de esos hechos exige actualizar la TRD antes del cierre de la vigencia.", "enunciado": "¿Qué hecho debe registrar Ricardo como causa de actualización de la TRD?", "opciones": [{"t": "La ampliación del horario del punto de atención, porque modifica la recepción de documentos", "j": "Es incorrecta. Es plausible porque el horario afecta el flujo de documentos recibidos, pero no figura entre las causales del art. 5.1.4.1 del Acuerdo AGN 001 de 2024, que no incluye cambios en la atención al público. Error de norma.", "tipo": "norma"}, {"t": "El traslado del trámite de devoluciones, porque redistribuye funciones entre las dos divisiones", "j": "Es correcta. El numeral 4 del art. 5.1.4.1 del Acuerdo AGN 001 de 2024 dispone que la TRD debe actualizarse cuando se redistribuyan funciones entre las unidades administrativas; el traslado de devoluciones entre divisiones es ese caso.", "tipo": null}, {"t": "El nombramiento de la nueva jefa, porque cambia quién responde por la producción documental", "j": "Es incorrecta. Es plausible porque la jefa dirige la producción documental de la división, pero el art. 5.1.4.1 del Acuerdo AGN 001 de 2024 se refiere a cambios de estructura y funciones, no al cambio de la persona que ocupa un cargo. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M040", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.4.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.4.1", "fecha": "2026-10-26"}]}, {"id": "C-E01-005-1", "caso_id": "C-E01-005", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 83", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En la ventanilla de una Dirección Seccional, el Facilitador IV Camilo Suárez atiende a Lucía Méndez, quien radicó una petición el 10 de febrero con el número 2026-ER-004512. El sistema de correspondencia muestra que la petición se repartió a la dependencia el 1 de marzo y que el 6 de mayo se firmó una resolución, todavía pendiente de citación. Hoy es 15 de mayo y la usuaria pregunta qué efecto tiene que nadie le haya notificado una respuesta. El facilitador no puede adelantarle el contenido de la resolución firmada.", "enunciado": "¿Qué debe informar el facilitador a la usuaria sobre su petición?", "opciones": [{"t": "Que ya existe una decisión expresa, porque la resolución se firmó antes de cumplirse los tres meses.", "j": "Es incorrecta. Es plausible porque el acto ya está firmado, pero el art. 83 de la Ley 1437 de 2011 exige que la decisión esté notificada dentro del plazo; firmar no equivale a notificar. Confunde la expedición con la notificación. Error de fase.", "tipo": "fase"}, {"t": "Que pasaron tres meses desde que la presentó sin decisión notificada, por lo que se entiende negada.", "j": "Es correcta. Ley 1437 de 2011, art. 83: transcurridos tres meses desde la presentación de una petición sin que se haya notificado decisión que la resuelva, se entiende que es negativa. Del 10 de febrero al 15 de mayo pasaron más de tres meses y la resolución firmada no se ha notificado.", "tipo": null}, {"t": "Que los tres meses se cuentan desde el reparto a la dependencia, de modo que aún no hay silencio.", "j": "Es incorrecta. Es plausible porque el reparto marca el inicio del trabajo interno, pero el art. 83 de la Ley 1437 de 2011 cuenta los tres meses a partir de la presentación de la petición. Toma una fecha de inicio equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M072", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 83", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#83", "fecha": "2026-10-26"}]}, {"id": "C-E03-017-1", "caso_id": "C-E03-017", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Julián Restrepo, Facilitador IV de la ventanilla de la Dirección Seccional de Aduanas de Puerto Claro, atiende el 30 de noviembre a una comerciante de la ciudad que pregunta por unas mercancías suyas declaradas en abandono a favor de la Nación en septiembre, según el acta 2026-AB-077. Ella quiere saber qué entidad dispondrá de ellas y dejar por escrito, en ese momento, una solicitud de información sobre su destino. El protocolo de ventanilla prohíbe anticipar el resultado de actuaciones en curso y exige radicar el mismo día toda solicitud escrita.", "enunciado": "¿Cómo debe atender Julián a la comerciante?", "opciones": [{"t": "Informarle que su administración compete a la DIAN y pedirle que vuelva cuando termine la actuación.", "j": "Es incorrecta. Da bien la competencia del Decreto 1742 de 2020, art. 1, pero aplaza la radicación que el protocolo exige el mismo día; la solicitud escrita debe entrar ahora, no al final de la actuación. Error de fase.", "tipo": "fase"}, {"t": "Informarle que su administración y disposición compete a la DIAN y radicar la solicitud ese mismo día.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, asigna a la DIAN la declaración en abandono a favor de la Nación de mercancías y su administración y disposición; Julián informa esa competencia sin anticipar resultados y radica el escrito en el día.", "tipo": null}, {"t": "Informarle que las mercancías se le devolverán al pagar los tributos y radicar su solicitud de información.", "j": "Es incorrecta. Radica la solicitud como pide el protocolo, pero anticipa un resultado que no le corresponde decidir ni anunciar; el Decreto 1742 de 2020, art. 1, asigna a la DIAN la disposición de esas mercancías, no al servidor de ventanilla. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E04-013-1", "caso_id": "C-E04-013", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. Debe incorporar al Sistema de Gestión de Documentos Electrónicos de Archivo los documentos de un proceso de cobro iniciado el 14 de enero de 2026. Un compañero los cargó agrupados por tipo de archivo: una carpeta para documentos de texto, otra para imágenes y otra para hojas de cálculo. La TRD del área ubica ese proceso en la serie Procesos de Cobro, subserie Cobro Coactivo. Usted debe corregir la organización del expediente electrónico.", "enunciado": "¿Con qué criterio debe organizar usted los documentos en el sistema?", "opciones": [{"t": "Conformar un expediente en la serie y subserie que fijan el CCD y la TRD dentro del sistema.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, exige conformar los expedientes electrónicos de acuerdo con el CCD y la TRD e incorporarlos al SGDEA, y el art. 1.3.4 reitera que su gestión se hace de conformidad con esos instrumentos.", "tipo": null}, {"t": "Pedir al área de tecnologías que defina la serie del expediente y que lo reorganice en el sistema.", "j": "Es incorrecta. Es plausible porque el Acuerdo AGN 001 de 2024, art. 1.3.4, pide articulación con tecnologías, pero la clasificación la fijan el CCD y la TRD y la ejecuta el archivo de gestión, no el área técnica. Error de competencia.", "tipo": "competencia"}, {"t": "Conservar las carpetas por tipo de archivo, que facilitan abrir cada documento en el sistema.", "j": "Es incorrecta. Parece funcional para el manejo técnico, pero el Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar el expediente según el CCD y la TRD; agrupar por formato usa un criterio ajeno a la clasificación documental. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}, {"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E01-012-1", "caso_id": "C-E01-012", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 65", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "La Facilitadora IV Liliana Correa, del grupo de correspondencia de una Dirección Seccional, recibe dos actos firmados el 9 de julio para distribuir. La Resolución 0081 fija nuevas reglas de turnos y horarios para todas las personas que acudan a los puntos de atención de la seccional. La Resolución 0082 niega a Construcciones Puerto Alto S.A.S. una solicitud de facilidad de pago radicada con el número 2026-ER-011907. El formato de distribución obliga a escoger, para cada acto, el canal por el que produce efectos frente a sus destinatarios.", "enunciado": "¿Cómo debe clasificar la facilitadora cada acto en el formato?", "opciones": [{"t": "El de la empresa se envía a notificación y el de turnos rige desde su firma, sin otro trámite de difusión.", "j": "Es incorrecta. Es plausible porque acierta con el acto particular, pero el art. 65 de la Ley 1437 de 2011 dispone que los actos de carácter general no son obligatorios mientras no se publiquen. Omite la publicación. Error de completitud.", "tipo": "completitud"}, {"t": "El de turnos se remite para publicación en el Diario Oficial y el de la empresa se envía a notificación.", "j": "Es correcta. Ley 1437 de 2011, arts. 65 y 66: los actos de carácter general no son obligatorios mientras no se publiquen en el Diario Oficial o en las gacetas territoriales, y los de carácter particular deben notificarse. La Resolución 0081 es general y la 0082, particular.", "tipo": null}, {"t": "Ambos se envían a notificación personal, porque los dos fueron firmados por la misma autoridad seccional.", "j": "Es incorrecta. Es plausible porque ambos salen de la misma dependencia, pero los arts. 65 y 66 de la Ley 1437 de 2011 distinguen por el carácter del acto: el general se publica y el particular se notifica. Clasifica por autor y no por destinatario. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M064", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 65", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#65", "fecha": "2026-10-26"}, {"fila": "M065", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 66", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#66", "fecha": "2026-10-26"}]}, {"id": "C-E05-015-1", "caso_id": "C-E05-015", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1712 de 2014, art. 19", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Gustavo León, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, registra en el índice de información la carpeta de una investigación penal por contrabando que la entidad apoya, todavía sin medida de aseguramiento. Una ley prohíbe expresamente el acceso a esos documentos durante la investigación. El 12 de mayo llega el radicado 2026-1101 de un periodista que pide copia completa de la carpeta. El jefe responde las solicitudes de acceso; Gustavo debe clasificar la carpeta en el índice, que obliga a escoger una sola categoría por carpeta.", "enunciado": "¿Qué categoría de información debe asignar Gustavo a la carpeta en el índice?", "opciones": [{"t": "Información pública reservada, por la investigación del delito y la prohibición legal", "j": "Es correcta. La Ley 1712 de 2014, art. 19, literal d, define como reservada la información cuyo acceso esté expresamente prohibido por norma legal y afecte la investigación y persecución de delitos mientras no se haga efectiva la medida de aseguramiento; la carpeta cumple ambas condiciones.", "tipo": null}, {"t": "Información pública sin excepción, porque la solicitud proviene de un periodista", "j": "Es incorrecta. Es plausible porque la información pública es la regla, pero deja de lado la prohibición legal y la etapa de la investigación, que según la Ley 1712 de 2014, art. 19, convierten la carpeta en reservada con independencia de quién pida. Error de completitud.", "tipo": "completitud"}, {"t": "Información pública clasificada, porque el acceso puede dañar derechos de los investigados", "j": "Es incorrecta. Es plausible porque los investigados tienen derechos que proteger, pero la Ley 1712 de 2014, art. 19, literal d, ubica la investigación de delitos con prohibición legal en la información reservada por intereses públicos, no en la clasificada del art. 18. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M090", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#19", "fecha": "2026-10-26"}, {"fila": "M089", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 18", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#18", "fecha": "2026-10-26"}]}, {"id": "C-E04-012-1", "caso_id": "C-E04-012", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV de la ventanilla de radicación de una Dirección Seccional. El 3 de agosto de 2026 llega por el canal electrónico la respuesta del contribuyente Agroinsumos del Llano S.A.S. al requerimiento que la División de Fiscalización le envió con el radicado 2026-0412. El mensaje cita ese número en el asunto y trae dos anexos. Un compañero sugiere registrarlo como solicitud nueva, con trámite propio, para no demorar su envío a la dependencia que adelanta el requerimiento. Usted debe registrar y distribuir el documento en el sistema de gestión de documentos.", "enunciado": "¿Cómo debe registrar usted el documento recibido en el sistema?", "opciones": [{"t": "Registrarlo como solicitud nueva, con trámite propio, y distribuirlo a la División de Fiscalización.", "j": "Es incorrecta. Parece ágil porque el documento llega a la dependencia, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, pide vincular el documento a su trámite; abrir uno nuevo describe el documento en un nivel que rompe su relación con el radicado previo. Error de granularidad.", "tipo": "granularidad"}, {"t": "Registrarlo con sus metadatos, vincularlo al trámite del radicado 2026-0412 y distribuirlo.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.1, ordena la recepción, el registro, la vinculación a un trámite y la distribución con su descripción (metadatos), de modo que el documento quede disponible y recuperable dentro del trámite al que responde.", "tipo": null}, {"t": "Incorporarlo al expediente del requerimiento y registrar sus metadatos cuando se responda.", "j": "Es incorrecta. Es plausible porque el documento pertenece a ese expediente, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, exige el registro con su descripción desde la recepción, antes de cualquier actuación posterior. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M016", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.1", "fecha": "2026-10-26"}]}, {"id": "C-E01-007-1", "caso_id": "C-E01-007", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 36", "integra": ["TABLAS DE RETENCION"], "caso": "El Facilitador IV Felipe Arango, del grupo de apoyo administrativo de una Dirección Seccional, clasifica la serie Peticiones según la tabla de retención documental. Encuentra dos carpetas abiertas a nombre de Agroinsumos El Llano S.A.S.: la 2026-0233, radicada el 8 de abril, y la 2026-0310, radicada el 29 de abril. Ambas piden la misma corrección de un registro ante la misma dependencia, y cada una tiene un sustanciador distinto. Uno de ellos ya proyectó una respuesta favorable y el otro, una desfavorable, sin que ninguno haya firmado.", "enunciado": "¿Qué debe hacer el facilitador con las dos carpetas?", "opciones": [{"t": "Unir por su cuenta las dos carpetas y anular el segundo radicado para dejar vigente un solo trámite.", "j": "Es incorrecta. Es plausible porque el resultado buscado es un solo expediente, pero la acumulación se dispone de oficio o a petición por la autoridad (Ley 1437 de 2011, art. 36), y anular radicados excede la labor de apoyo (Constitución Política, art. 6). Error de competencia.", "tipo": "competencia"}, {"t": "Informar al jefe para que acumule las actuaciones en un solo expediente y evite decisiones contradictorias.", "j": "Es correcta. Ley 1437 de 2011, art. 36: los documentos de una misma actuación se organizan en un solo expediente, al que se acumulan los que se tramiten ante la misma autoridad, con el fin de evitar decisiones contradictorias. El facilitador advierte la situación para que se ordene la acumulación.", "tipo": null}, {"t": "Mantener cada solicitud en su propia carpeta, porque tienen números de radicado y fechas de entrada diferentes.", "j": "Es incorrecta. Es plausible porque cada radicado suele abrir carpeta, pero el art. 36 de la Ley 1437 de 2011 organiza el expediente por actuación y no por radicado, y manda acumular para evitar decisiones contradictorias. Usa una unidad de organización equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M058", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-26"}, {"fila": "M081", "norma": "Constitución Política de Colombia", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E01-002-1", "caso_id": "C-E01-002", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 76", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, la Facilitadora IV Marcela Ríos recibe a Óscar Pineda, quien trae por escrito un recurso de reposición contra la Resolución 1123, expedida el 14 de abril y notificada personalmente al señor Pineda el 2 de mayo. Según el calendario de la seccional, hoy corresponde al octavo día hábil posterior a esa diligencia. El usuario está inquieto porque un conocido le dijo que el plazo corría desde la firma del acto. La radicación debe quedar dirigida a la dependencia que expidió la resolución.", "enunciado": "¿Qué debe informar la facilitadora al usuario mientras radica el escrito?", "opciones": [{"t": "Que el término para recurrir es de cinco días desde la notificación, por lo que el escrito resulta tardío.", "j": "Es incorrecta. Es plausible porque el plazo de cinco días aparece en la citación y en el aviso (arts. 68 y 69), pero el art. 76 de la Ley 1437 de 2011 fija diez días para interponer los recursos. Confunde plazos de etapas distintas. Error de norma.", "tipo": "norma"}, {"t": "Que el escrito llega dentro de los diez días siguientes a la notificación personal, de modo que está en término.", "j": "Es correcta. Ley 1437 de 2011, art. 76: los recursos de reposición y apelación se interponen por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella. El escrito llega el octavo día hábil después de la notificación del 2 de mayo, de modo que está en término.", "tipo": null}, {"t": "Que el plazo de diez días se cuenta desde la expedición del acto, por lo que el escrito llega fuera de término.", "j": "Es incorrecta. Es plausible porque la fecha de expedición aparece en el acto y el usuario la menciona, pero el art. 76 de la Ley 1437 de 2011 cuenta los diez días desde la notificación, no desde la firma. Toma una base de conteo equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M070", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 76", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#76", "fecha": "2026-10-26"}, {"fila": "M066", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 67", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#67", "fecha": "2026-10-26"}]}, {"id": "C-E02-017-1", "caso_id": "C-E02-017", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 27", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, el Facilitador IV Esteban Mora atiende el 11 de noviembre a Gloria Benítez, quien pide consultar y obtener copia de las actas de 2025 del comité de archivo de la seccional. Esteban verifica en el Índice de Información Clasificada y Reservada que esas actas están calificadas como información pública y que reposan en el archivo de gestión de su grupo. Un compañero le dice que exija a la ciudadana un escrito que explique para qué quiere las actas antes de mostrárselas.", "enunciado": "¿Cómo debe Esteban atender la solicitud de Gloria?", "opciones": [{"t": "Permitir la consulta de las actas y tramitar la copia, porque no tienen carácter reservado.", "j": "Es correcta. La Ley 594 de 2000, art. 27, reconoce a todas las personas el derecho a consultar los documentos de archivos públicos y a obtener copia, siempre que no sean reservados, y la Ley 1712 de 2014, art. 16, pide que los archivos promuevan el acceso a la información pública.", "tipo": null}, {"t": "Pedir el escrito con el motivo de la consulta y permitir la revisión cuando lo radique.", "j": "Es incorrecta. Es plausible porque deja constancia de la solicitud, pero el art. 27 de la Ley 594 de 2000 reconoce el derecho a consultar y obtener copia de documentos no reservados sin exigir que se explique el motivo. Error de norma: añade un requisito que la norma no prevé.", "tipo": "norma"}, {"t": "Permitir la consulta de las actas y negar la copia, porque su expedición exige autorización del comité.", "j": "Es incorrecta. Es plausible porque la consulta en sala es la forma más común de acceso, pero el art. 27 de la Ley 594 de 2000 reconoce también el derecho a obtener copia de los documentos no reservados, sin otra autorización. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M009", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 27", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#27", "fecha": "2026-10-26"}, {"fila": "M088", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#16", "fecha": "2026-10-26"}]}, {"id": "C-E06-005-1", "caso_id": "C-E06-005", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 16", "integra": ["GESTION DOCUMENTAL"], "caso": "Diana Rojas, Facilitadora IV de la ventanilla única de una Dirección Seccional, revisa un escrito que llegó por correo postal el 20 de julio. Va dirigido a la Dirección Seccional, trae nombre completo y cédula del señor Hernán Silva, explica qué solicita y por qué, y está firmado. No relaciona anexos porque el señor no aporta documentos. Al pie solo aparece un número de celular, sin dirección física ni electrónica. El señor es persona natural sin inscripción en el registro mercantil. Diana debe terminar la verificación antes de pasar el escrito a radicación.", "enunciado": "¿Qué elemento del contenido mínimo debe registrar Diana como ausente en el escrito?", "opciones": [{"t": "La dirección donde el peticionario recibirá la correspondencia de respuesta.", "j": "Es correcta. El num. 2 del art. 16 de la Ley 1437 de 2011 exige indicar la dirección donde se recibirá correspondencia, y el art. 4.2.6 del Acuerdo AGN 001 de 2024 pide verificar los datos de contacto para dar respuesta.", "tipo": null}, {"t": "La relación de los documentos que el peticionario desee presentar con el escrito.", "j": "Es incorrecta. Es un elemento del art. 16 de la Ley 1437 de 2011, pero se refiere a los documentos que el peticionario desee presentar; si no aporta ninguno, no hay relación que exigir. Error de granularidad.", "tipo": "granularidad"}, {"t": "La dirección electrónica, que toda persona debe indicar en sus peticiones escritas.", "j": "Es incorrecta. La dirección electrónica figura en el num. 2 del art. 16 de la Ley 1437 de 2011, pero es obligatoria para quien deba estar inscrito en el registro mercantil; para el señor es opcional. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M052", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#16", "fecha": "2026-10-26"}, {"fila": "M021", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.6", "fecha": "2026-10-26"}]}, {"id": "C-E04-018-1", "caso_id": "C-E04-018", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.1", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Usted es Facilitador IV del punto de atención de una Dirección Seccional. El 19 de octubre de 2026 el señor Julián Ortega pregunta por un escrito que radicó en marzo. La búsqueda por su nombre no arroja resultados; al filtrar por fecha, usted encuentra el registro 2026-0377, sin remitente ni asunto, distribuido al Grupo de Gestión de Cobranzas. El usuario necesita saber dónde está su escrito, que trataba de una solicitud de facilidad de pago. Usted debe atenderlo y dejar el registro en condiciones de recuperación para futuras consultas.", "enunciado": "¿Qué debe hacer usted con el registro además de informar al usuario?", "opciones": [{"t": "Completar en el registro los metadatos de remitente y asunto, según el procedimiento del área.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.1, exige que el registro de los documentos lleve su descripción (metadatos) para garantizar la disponibilidad, recuperación y acceso para la consulta durante todo el ciclo vital.", "tipo": null}, {"t": "Pedir al usuario que radique de nuevo el escrito para que quede con sus datos completos.", "j": "Es incorrecta. Parece una salida rápida, pero duplica el documento y traslada al usuario una tarea de registro de la entidad; el Acuerdo AGN 001 de 2024, art. 4.2.1, asigna esa descripción a la gestión documental. Error de competencia.", "tipo": "competencia"}, {"t": "Informar al usuario la dependencia que tiene su escrito y dejar el registro tal como está.", "j": "Es incorrecta. Es plausible porque resuelve la consulta inmediata del usuario, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, exige que la descripción garantice la recuperación durante todo el ciclo vital, y el registro sigue sin metadatos. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M016", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.1", "fecha": "2026-10-26"}]}, {"id": "C-E07-004-1", "caso_id": "C-E07-004", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.4.3", "integra": ["OFIMATICA"], "caso": "Sandra, Facilitadora IV del grupo de apoyo administrativo, alista la transferencia primaria de 40 expedientes de la subserie Peticiones, Quejas y Reclamos: 25 en papel y 15 electrónicos, todos cerrados en 2022 y con su tiempo de retención en gestión cumplido según la TRD. Los físicos tienen la hoja de control diligenciada. Los electrónicos están en el repositorio de la dependencia, ordenados por carpetas, pero su índice electrónico no tiene firma. La entrega al archivo central está programada para el 20 de noviembre y el cronograma no admite prórroga.", "enunciado": "¿Qué debe verificar Sandra antes de entregar los expedientes electrónicos?", "opciones": [{"t": "Que el archivo central firme el índice electrónico cuando reciba los expedientes transferidos", "j": "Es incorrecta. Es plausible porque el archivo central recibe y revisa la transferencia, pero el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que el índice firmado acompañe a los expedientes cuando se realiza la transferencia, no que se firme después de recibirlos. Error de fase.", "tipo": "fase"}, {"t": "Que cada expediente electrónico vaya acompañado de su índice electrónico firmado", "j": "Es correcta. El parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 dispone que, al transferir, las unidades documentales vayan con la hoja de control o el índice electrónico firmado; los 15 expedientes electrónicos tienen índice sin firma.", "tipo": null}, {"t": "Que las carpetas del repositorio conserven el orden cronológico de los documentos de cada expediente", "j": "Es incorrecta. Es plausible porque el orden de los documentos es parte de la organización del expediente, pero no suple el requisito que falta: el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que las unidades documentales vayan con su índice electrónico firmado. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M034", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.4.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.4.3", "fecha": "2026-10-26"}]}, {"id": "C-E02-013-1", "caso_id": "C-E02-013", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 6.1.1.4", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "En el depósito del archivo de gestión de una Dirección Seccional, la Facilitadora IV Juliana Ortiz encuentra el 7 de marzo excrementos de roedores junto a dos estantes y cajas mordidas de la serie Peticiones, Quejas y Reclamos de 2025, que contienen 14 expedientes. El higrómetro del depósito registra valores normales durante la última semana y las estanterías están firmes. Debe reportar el hallazgo al coordinador con el programa de conservación preventiva que corresponde, pues el formato de reporte permite marcar una sola casilla de programa.", "enunciado": "¿Qué programa debe marcar Juliana en el reporte?", "opciones": [{"t": "Almacenamiento y realmacenamiento, porque las cajas mordidas de los 14 expedientes deben reemplazarse.", "j": "Es incorrecta. Es plausible porque las cajas dañadas sí requieren cambio, pero atiende el efecto sobre las unidades y deja sin tratar la plaga, que el num. 3 del art. 6.1.1.4 del Acuerdo AGN 001 de 2024 asigna a saneamiento ambiental. Error de completitud.", "tipo": "completitud"}, {"t": "Monitoreo y control de condiciones ambientales, que vigila humedad y temperatura.", "j": "Es incorrecta. Es plausible porque es otro programa sobre el ambiente del depósito, pero el higrómetro está en valores normales y el hallazgo es biológico, que el art. 6.1.1.4 del Acuerdo AGN 001 de 2024 ubica en saneamiento ambiental. Error de granularidad: confunde categorías vecinas.", "tipo": "granularidad"}, {"t": "Saneamiento ambiental, que comprende desinfección, desratización y desinsectación.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 6.1.1.4, num. 3, incluye la desratización en el programa de saneamiento ambiental, que responde a la presencia de roedores; la Ley 594 de 2000, art. 46, exige aplicar el sistema integrado de conservación en cada fase del ciclo vital, también en gestión.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M043", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 6.1.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#6.1.1.4", "fecha": "2026-10-26"}, {"fila": "M010", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 46", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#46", "fecha": "2026-10-26"}]}, {"id": "C-E02-008-1", "caso_id": "C-E02-008", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.8", "integra": ["TABLAS DE RETENCION"], "caso": "Sandra Molina, Facilitadora IV del archivo de gestión de una Dirección Seccional, conforma el expediente de un recurso de reconsideración, subserie que la Tabla de Retención Documental asigna a la División Jurídica. Tiene sobre la mesa el escrito del recurso radicado el 5 de febrero, el auto admisorio del 19 de febrero, un memorial de pruebas del 3 de marzo y la resolución del 28 de mayo que decidió el recurso. Su jefe le pide dejar la resolución al principio para que la consulten primero.", "enunciado": "¿En qué orden debe Sandra ubicar los documentos dentro del expediente?", "opciones": [{"t": "Escrito, auto admisorio, memorial y resolución, en la secuencia en que se tramitó el recurso.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.8, num. 2, dispone que los tipos documentales se ordenen de forma que se evidencie el desarrollo del trámite, y el art. 4.3.1.3 fija el orden original como la secuencia en que se gestionan hasta su resolución definitiva.", "tipo": null}, {"t": "Primero la resolución y luego los demás por fecha, porque la decisión es lo más consultado.", "j": "Es incorrecta. Es plausible porque facilita la consulta de la decisión, pero el art. 4.3.1.8 del Acuerdo AGN 001 de 2024 ordena los tipos documentales de modo que evidencien el desarrollo del trámite. Error de granularidad: aplica un criterio de uso y no el orden original.", "tipo": "granularidad"}, {"t": "Escrito, auto y resolución, con el memorial de pruebas en una carpeta aparte de la actuación.", "j": "Es incorrecta. Es plausible porque respeta la secuencia de los actos principales, pero el memorial hace parte del mismo trámite y el expediente debe reunir la totalidad de sus documentos para garantizar su integridad (Acuerdo AGN 001 de 2024, art. 4.3.1.3). Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M029", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.8", "fecha": "2026-10-26"}, {"fila": "M025", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.3", "fecha": "2026-10-26"}]}, {"id": "C-E03-015-1", "caso_id": "C-E03-015", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Decreto 1083 de 2015, art. 2.2.22.3.2", "integra": ["GESTION DOCUMENTAL"], "caso": "Fabián Rojas, Facilitador IV del archivo de gestión de la Dirección Seccional de Aduanas de Costa Brava, debe explicar el 20 de noviembre, en la reunión mensual del área, por qué el control de los préstamos documentales se reporta en el Modelo Integrado de Planeación y Gestión. En octubre registró 142 préstamos y 9 devoluciones vencidas. Un compañero sostiene que el modelo solo sirve para calificar a los servidores al final del año, y la coordinadora pidió a Fabián aclarar el punto con el texto reglamentario.", "enunciado": "¿Qué aclaración debe dar Fabián en la reunión?", "opciones": [{"t": "Que el control de préstamos es seguimiento y control de la gestión del área, para la cual el MIPG es marco de referencia.", "j": "Es correcta. El Decreto 1083 de 2015, art. 2.2.22.3.2, define el MIPG como un marco de referencia para dirigir, planear, ejecutar, hacer seguimiento, evaluar y controlar la gestión de las entidades; registrar préstamos y devoluciones vencidas es seguimiento y control de esa gestión.", "tipo": null}, {"t": "Que el control de préstamos se reporta al cierre de la vigencia, cuando el MIPG revisa los resultados obtenidos.", "j": "Es incorrecta. Acierta en que el modelo mira resultados, pero lo ubica solo al final; el Decreto 1083 de 2015, art. 2.2.22.3.2, lo define como referencia desde la planeación y la ejecución hasta el seguimiento y el control. Error de fase.", "tipo": "fase"}, {"t": "Que el control de préstamos se reporta porque el MIPG califica el desempeño de quien atiende el archivo.", "j": "Es incorrecta. Es plausible porque retoma la idea del compañero de que el modelo califica a los servidores, pero confunde el MIPG con la evaluación del desempeño laboral; el Decreto 1083 de 2015, art. 2.2.22.3.2, lo define como marco de referencia para la gestión de las entidades. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M091", "norma": "Decreto 1083 de 2015 (Único Reglamentario del Sector Función Pública)", "articulo": "art. 2.2.22.3.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1083_2015.htm#2.2.22.3.2", "fecha": "2026-10-26"}]}, {"id": "C-E06-004-1", "caso_id": "C-E06-004", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 21", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Camilo Herrera, Facilitador IV del punto de atención de una Dirección Seccional, atiende a la señora Elena Vargas, quien radicó por escrito el 2 de junio una petición dirigida por error a la DIAN. Correspondencia la remitió el 5 de junio a la gobernación, autoridad competente para el asunto, y la gobernación la recibió el 9 de junio, según el sello de recibido en la copia del oficio remisorio. La señora pregunta desde qué fecha se cuenta el término que tiene la gobernación para responderle, porque quiere saber cuándo reclamar.", "enunciado": "¿Qué debe informarle Camilo a la señora sobre el inicio del término?", "opciones": [{"t": "Que el término corre desde el día siguiente al 5 de junio, cuando salió el oficio remisorio.", "j": "Es incorrecta. La remisión es un paso del trámite de traslado, pero el art. 21 de la Ley 1437 de 2011 no cuenta desde el envío sino desde que la autoridad competente recibe la petición. Error de fase.", "tipo": "fase"}, {"t": "Que el término corre desde el día siguiente al 9 de junio, cuando lo recibió la gobernación.", "j": "Es correcta. El art. 21 de la Ley 1437 de 2011 dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", "tipo": null}, {"t": "Que el término corre desde el día siguiente al 2 de junio, cuando radicó en la DIAN.", "j": "Es incorrecta. Toma la fecha de la primera radicación, que es la regla general de recepción, pero el art. 21 de la Ley 1437 de 2011 cuenta el término desde la recepción por la autoridad competente. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M055", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 21", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#21", "fecha": "2026-10-26"}]}, {"id": "C-E05-007-1", "caso_id": "C-E05-007", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 13", "integra": ["GESTION DOCUMENTAL"], "caso": "Ricardo Mesa, Facilitador IV de la ventanilla de correspondencia de una Dirección Seccional, recibe el 14 de mayo el radicado 2026-1132 de la empresa ficticia Logística Andina Ltda. En el escrito, la empresa pide examinar el expediente de su solicitud de certificación y obtener copia de dos oficios que reposan en él. El formulario del sistema exige seleccionar la modalidad de la actuación antes de enviarla a la dependencia que custodia el expediente, la División de Gestión de Asistencia al Cliente. El escrito no expresa inconformidad alguna.", "enunciado": "¿Qué modalidad debe registrar Ricardo en el formulario para esa actuación?", "opciones": [{"t": "Examinar y requerir copias de documentos, porque pide ver el expediente y dos copias", "j": "Es correcta. La Ley 1437 de 2011, art. 13 (modificado por la Ley 1755 de 2015), incluye entre las actuaciones del derecho de petición la de examinar y requerir copias de documentos, que coincide con lo que pide la empresa.", "tipo": null}, {"t": "Consulta, porque la empresa formula una pregunta a la entidad sobre su expediente", "j": "Es incorrecta. Es plausible porque la consulta también es modalidad del derecho de petición, pero la Ley 1437 de 2011, art. 13, la distingue de examinar y requerir copias de documentos, que es lo pedido. Ubica la actuación en una categoría vecina. Error de granularidad.", "tipo": "granularidad"}, {"t": "Solicitud de copias, sin registrar el examen del expediente que la acompaña", "j": "Es incorrecta. Es plausible porque las copias sí se piden, pero el art. 13 de la Ley 1437 de 2011 agrupa examinar y requerir copias de documentos en una misma modalidad y el escrito pide las dos cosas; registrar solo las copias deja por fuera el examen. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M049", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 13", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#13", "fecha": "2026-10-26"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.4", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Diana Castro, Facilitadora IV del Grupo de Correspondencia de una Dirección Seccional, clasifica en el sistema de gestión documental los documentos del 18 de julio. Uno es un oficio producido por la División de Gestión de Fiscalización que solicita información a un tercero y que hará parte de la subserie Programas de Fiscalización. El sistema muestra campos para el código de sección, serie y subserie. Un compañero le propone registrar como código el nombre del tercero, porque así el oficio aparece más rápido en las búsquedas del grupo.", "enunciado": "¿Con qué criterio debe Diana clasificar el oficio en el sistema?", "opciones": [{"t": "Con el código que le asigne la dependencia productora al archivarlo, cuando termine el trámite.", "j": "Es incorrecta. Es plausible porque la dependencia productora conforma el expediente, pero la clasificación conforme al CCD se hace desde el registro del documento y no se aplaza al archivo final (Acuerdo AGN 001 de 2024, art. 4.3.1.4). Error de fase.", "tipo": "fase"}, {"t": "Con el código del Grupo de Correspondencia, porque es la dependencia que registra el oficio.", "j": "Es incorrecta. Es plausible porque Correspondencia es quien opera el sistema, pero el art. 4.3.1.4 del Acuerdo AGN 001 de 2024 clasifica conforme a la estructura orgánico-funcional de quien produce, aquí la División de Gestión de Fiscalización. Error de competencia: toma la dependencia equivocada.", "tipo": "competencia"}, {"t": "Con el código de la sección de Fiscalización y de la subserie Programas de Fiscalización del CCD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena clasificar conforme a la estructura orgánico-funcional y codificar secciones, series y subseries según el CCD; el oficio lo produjo la División de Gestión de Fiscalización para la subserie Programas de Fiscalización.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-018-1", "caso_id": "C-E03-018", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["GESTION DOCUMENTAL"], "caso": "Carolina Ibáñez, Facilitadora IV de correspondencia de la Dirección Seccional de Aduanas de Bahía Norte, recibe el 2 de diciembre el oficio 2026-J-552 del Juzgado Primero Penal del Circuito, que pide copia de las actas de aprehensión de licores de un operativo de agosto. El formato de radicación exige dos campos antes del reparto: la rama del poder público del remitente y el asunto misional de la petición, según el catálogo de competencias de la entidad. El reparto de la mañana vence a las 11:00 a. m.", "enunciado": "¿Qué valores debe registrar Carolina en los dos campos del formato?", "opciones": [{"t": "Rama judicial y asunto de fiscalización tributaria del impuesto sobre las ventas de licores.", "j": "Es incorrecta. Acierta con la rama, pero ubica la petición en un tributo interno; las actas de aprehensión pertenecen a la gestión aduanera que el Decreto 1742 de 2020, art. 1, describe con la aprehensión de mercancías. Error de norma.", "tipo": "norma"}, {"t": "Rama ejecutiva, porque el oficio llega a una entidad del Gobierno, y asunto de gestión aduanera.", "j": "Es incorrecta. Acierta con el asunto, pero toma la rama del destinatario y no la del remitente; un juzgado pertenece a la rama judicial según la Constitución Política, art. 113. Error de granularidad.", "tipo": "granularidad"}, {"t": "Rama judicial y asunto de gestión aduanera, en la parte de aprehensión de mercancías.", "j": "Es correcta. La Constitución Política, art. 113, ubica a los juzgados en la rama judicial, y el Decreto 1742 de 2020, art. 1, incluye en la gestión aduanera la aprehensión de mercancías; los dos campos quedan diligenciados antes del reparto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}, {"fila": "M083", "norma": "Constitución Política de Colombia", "articulo": "art. 113", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#113", "fecha": "2026-10-26"}]}, {"id": "C-E04-007-1", "caso_id": "C-E04-007", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional. Desde el 1 de agosto de 2026 el grupo produce en medio electrónico las actas de comité de seguimiento, que forman la subserie Actas de Comité. Al revisar la TRD vigente usted encuentra ese tipo documental con su código, sus tiempos de retención y su disposición final. La coordinadora le pide informar qué requisito del documento electrónico de archivo falta atender en la TRD antes de conformar los expedientes de la subserie.", "enunciado": "¿Qué debe informar usted a la coordinadora sobre el registro en la TRD?", "opciones": [{"t": "Que basta con almacenar las actas en medio electrónico durante todo su ciclo de vida.", "j": "Es incorrecta. Parece suficiente porque el artículo también exige el almacenamiento electrónico durante el ciclo de vida, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, pide además registrar en la TRD los formatos de los tipos documentales. Error de completitud.", "tipo": "completitud"}, {"t": "Que el formato electrónico de las actas se registra en la TRD al transferirlas al archivo central.", "j": "Es incorrecta. Es plausible porque la transferencia es un momento de control documental, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, vincula el registro del formato a la conformación de los expedientes, que ocurre desde la producción. Error de fase.", "tipo": "fase"}, {"t": "Que la TRD debe registrar el formato electrónico de las actas para conformar sus expedientes.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, establece que quienes produzcan documentos por medios electrónicos deben registrar en las TRD los formatos electrónicos de los tipos documentales, para la conformación de los expedientes, series o subseries.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E02-018-1", "caso_id": "C-E02-018", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 22", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Cada mañana, la Facilitadora IV Alejandra Suárez, del Grupo de Correspondencia de una Dirección Seccional, recibe entre 60 y 80 comunicaciones, les asigna radicado y las entrega a la dependencia que debe tramitarlas; esa labor ocupa la mayor parte de su jornada. El 3 de abril, el grupo de apoyo administrativo le pide clasificar sus tareas según los procesos archivísticos del programa de gestión documental para un informe trimestral. Alejandra duda sobre cómo nombrar la entrega a las dependencias, porque otra compañera reportó esa misma tarea como consulta.", "enunciado": "¿Con qué proceso archivístico debe Alejandra registrar esa tarea en el informe?", "opciones": [{"t": "Consulta, porque las dependencias acceden a las comunicaciones para poder tramitarlas.", "j": "Es incorrecta. Es plausible porque las dependencias leen las comunicaciones que reciben, pero la consulta es el acceso a documentos ya organizados; llevar lo radicado a quien lo tramita es otro proceso del art. 22 de la Ley 594 de 2000. Error de granularidad: confunde procesos vecinos.", "tipo": "granularidad"}, {"t": "Distribución, porque la tarea lleva lo radicado a la dependencia que debe tramitarlo.", "j": "Es correcta. La Ley 594 de 2000, art. 22, enumera la producción o recepción, la distribución, la consulta, la organización, la recuperación y la disposición final; entregar las comunicaciones radicadas a la dependencia competente es distribución, y el art. 12 hace responsable a la administración de esa gestión.", "tipo": null}, {"t": "Recepción, porque la tarea forma parte del ingreso de las comunicaciones a la entidad.", "j": "Es incorrecta. Es plausible porque la recepción y la radicación preceden a la entrega, pero el art. 22 de la Ley 594 de 2000 distingue la recepción de la distribución, que es la etapa siguiente. Error de fase: nombra la etapa anterior.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M004", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#22", "fecha": "2026-10-26"}, {"fila": "M003", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E07-010-1", "caso_id": "C-E07-010", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.5.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Diana, Facilitadora IV del archivo de gestión de una Dirección Seccional, consulta el estado de la TRD actualizada en 2026. La versión fue aprobada por el Comité Institucional de Gestión y Desempeño en junio y enviada en julio para su inscripción, pero a 26 de octubre todavía no se ha emitido el Certificado de Inscripción en el Registro Único de Series Documentales. Su coordinador le pide preparar con esa versión la eliminación de 20 cajas de una subserie marcada con E y la transferencia de otras 30 cajas de expedientes cerrados, ambas para la primera semana de noviembre.", "enunciado": "¿Qué debe informar Diana al coordinador sobre las dos tareas encargadas?", "opciones": [{"t": "Que el Comité puede autorizar el uso de la versión de 2026 mientras se emite el certificado del RUSD", "j": "Es incorrecta. Es plausible porque el Comité aprobó la versión, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 liga la implementación a la emisión del Certificado de Inscripción en el RUSD, no a una autorización interna. Error de competencia.", "tipo": "competencia"}, {"t": "Que con la versión de 2026 la transferencia puede hacerse ya y la eliminación espera el certificado del RUSD", "j": "Es incorrecta. Es plausible porque la eliminación suele verse como la tarea más delicada, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 condiciona a la emisión del certificado tanto la disposición final como las transferencias. Error de fase.", "tipo": "fase"}, {"t": "Que ninguna de las dos tareas puede hacerse con la versión de 2026 hasta que se emita el certificado del RUSD", "j": "Es correcta. El art. 5.1.5.1 del Acuerdo AGN 001 de 2024 dispone que las transferencias documentales y la disposición final se efectúan una vez emitido el Certificado de Inscripción en el RUSD; la versión de 2026 aún no lo tiene, así que ninguna de las dos tareas se aplica con ella.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M041", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.5.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.5.1", "fecha": "2026-10-26"}]}, {"id": "C-E06-008-1", "caso_id": "C-E06-008", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 19", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Natalia Suárez, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, clasifica peticiones para su reparto. El señor Óscar Pineda radicó el 10 de octubre una solicitud que ya había presentado en junio; en julio el área se la negó porque no aportó el certificado de residencia exigido. En el nuevo escrito el señor repite la solicitud y anexa ese certificado. Una compañera sugiere marcarla como reiterativa para que el área conteste con la respuesta de julio. Natalia debe definir la clasificación antes del reparto diario.", "enunciado": "¿Cómo debe clasificar Natalia la petición en el sistema de reparto?", "opciones": [{"t": "Como petición rechazable, para que el área la devuelva por repetir un asunto resuelto.", "j": "Es incorrecta. Confunde la petición reiterativa con la irrespetuosa, que es la que el art. 19 de la Ley 1437 de 2011 sanciona con rechazo; además, esa norma prohíbe devolver peticiones por considerarlas inadecuadas. Error de norma.", "tipo": "norma"}, {"t": "Como reiterativa ya resuelta, para que el área se remita a la respuesta de julio.", "j": "Es incorrecta. El art. 19 de la Ley 1437 de 2011 permite remitirse a respuestas anteriores, pero exceptúa las peticiones negadas por no acreditar requisitos cuando la nueva los subsana. Error de completitud.", "tipo": "completitud"}, {"t": "Como petición que subsana el requisito negado, para que el área la resuelva de nuevo.", "j": "Es correcta. El art. 19 de la Ley 1437 de 2011 excluye de la remisión a respuestas anteriores las peticiones que se negaron por no acreditar requisitos, siempre que la nueva petición los subsane, como ocurre con el certificado aportado.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M054", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E06-018-1", "caso_id": "C-E06-018", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 22", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Beatriz Ocampo, Facilitadora IV de la ventanilla de una Dirección Seccional, radica el 5 de noviembre con el número 013420 una queja escrita del señor Pablo Ruiz por el trato que recibió de un servidor del punto de atención. El reglamento interno de peticiones de la Dirección Seccional asigna las quejas al grupo de quejas y reclamos. El servidor señalado pide a Beatriz que le entregue la queja para responderla él mismo y evitar que el caso escale. Beatriz debe repartir el documento en el sistema esa misma mañana.", "enunciado": "¿A quién debe repartir Beatriz la queja radicada?", "opciones": [{"t": "Al servidor señalado, para que dé su versión y conteste al señor en el término.", "j": "Es incorrecta. Busca una respuesta rápida, pero el num. 7 del art. 7 y el art. 22 de la Ley 1437 de 2011 asignan las quejas a la dependencia especializada que fija la reglamentación interna. Error de competencia.", "tipo": "competencia"}, {"t": "Al grupo de quejas y reclamos, que el reglamento interno designa para atenderlas.", "j": "Es correcta. El art. 22 de la Ley 1437 de 2011 remite a la reglamentación interna la manera de atender las quejas, y el num. 7 del art. 7 ordena atribuirlas a dependencias especializadas.", "tipo": null}, {"t": "Al archivo de gestión, hasta que el señor ratifique la queja en forma presencial.", "j": "Es incorrecta. Parece una verificación prudente, pero la queja ya está radicada y el art. 22 de la Ley 1437 de 2011 exige tramitarla según la reglamentación interna; la opción detiene el trámite antes del reparto. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M056", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#22", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E07-016-1", "caso_id": "C-E07-016", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["GESTION DOCUMENTAL"], "caso": "Felipe, Facilitador IV del archivo de gestión de un grupo de apoyo administrativo, debe entregar el 15 de diciembre al archivo central 35 expedientes cerrados de la subserie Acuerdos de Pago, con tiempo de retención en gestión cumplido según la TRD. Cada carpeta tiene su hoja de control. El grupo no ha elaborado el inventario documental de la subserie, y el coordinador le propone enviar las cajas con un oficio que indique el número total de carpetas para cumplir la fecha. El archivo central no recibe entregas fuera del cronograma anual.", "enunciado": "¿Qué debe hacer Felipe para preparar la entrega?", "opciones": [{"t": "Elaborar el inventario documental de los expedientes y remitirlos con sus respectivas hojas de control", "j": "Es correcta. El art. 26 de la Ley 594 de 2000 obliga a elaborar inventarios que aseguren el control de los documentos en sus fases, y el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que las unidades transferidas vayan con su hoja de control.", "tipo": null}, {"t": "Enviar las carpetas con sus hojas de control y el oficio que indica el número total", "j": "Es incorrecta. Es plausible porque cumple la hoja de control que exige el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024, pero un conteo de carpetas no es inventario; el art. 26 de la Ley 594 de 2000 obliga a inventariar los documentos para su control en las fases. Error de completitud.", "tipo": "completitud"}, {"t": "Enviar las cajas en la fecha y elaborar el inventario cuando el archivo central las reciba", "j": "Es incorrecta. Es plausible porque cumple la fecha programada, pero deja sin control los documentos durante el cambio de fase; el art. 26 de la Ley 594 de 2000 busca asegurar el control de los documentos en sus diferentes fases, lo que exige el inventario antes de entregar. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M008", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-26"}, {"fila": "M034", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.4.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.4.3", "fecha": "2026-10-26"}]}, {"id": "C-E01-010-1", "caso_id": "C-E01-010", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 91", "integra": ["TABLAS DE RETENCION"], "caso": "Al preparar la transferencia primaria según la tabla de retención documental, la Facilitadora IV Natalia Ospina, del archivo de gestión de una Dirección Seccional, revisa el expediente de la Resolución 0215, que ordenó a Distribuidora El Prado Ltda. reintegrar una suma. El acto quedó en firme el 14 de febrero de 2020 y el expediente ingresó al archivo de gestión el 9 de marzo de 2023. Después de la constancia de firmeza no obra ningún documento de ejecución de la autoridad. Hoy es 26 de octubre de 2026 y el formato de transferencia pide observaciones.", "enunciado": "¿Qué observación debe informar la facilitadora en el formato?", "opciones": [{"t": "Que el acto conserva obligatoriedad, porque el término para ejecutarlo es de diez años desde su firmeza.", "j": "Es incorrecta. Es plausible porque existen plazos largos en otras materias, pero el art. 91, num. 3, de la Ley 1437 de 2011 fija cinco años. Aplica un plazo que la norma no prevé. Error de norma.", "tipo": "norma"}, {"t": "Que el acto conserva obligatoriedad, porque los cinco años se cuentan desde su ingreso al archivo de gestión.", "j": "Es incorrecta. Es plausible porque la fecha de ingreso al archivo es la que maneja la facilitadora, pero el art. 91, num. 3, de la Ley 1437 de 2011 cuenta los cinco años desde que el acto está en firme. Toma una base de cómputo equivocada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que el acto pudo perder obligatoriedad, porque pasaron más de cinco años en firme sin actos para ejecutarlo.", "j": "Es correcta. Ley 1437 de 2011, art. 91, num. 3: el acto en firme pierde obligatoriedad cuando, al cabo de cinco años de estar en firme, la autoridad no ha realizado los actos que le corresponden para ejecutarlo. Desde el 14 de febrero de 2020 pasaron más de cinco años sin ejecución.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M075", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 91", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#91", "fecha": "2026-10-26"}]}, {"id": "C-E07-017-1", "caso_id": "C-E07-017", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Ley 594 de 2000, art. 24", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Teresa, Facilitadora IV del punto de atención de una Dirección Seccional, recibe a un practicante que organiza las comunicaciones de 2026 en carpetas por mes, porque considera que la TRD es una guía opcional de la oficina de archivo. Entre los documentos hay 14 peticiones de ciudadanos radicadas en el sistema y 9 oficios enviados por el punto de atención. La coordinadora le pide a Teresa explicarle al practicante cómo deben quedar archivados esos documentos antes del cierre de la vigencia, cuando se hará la revisión del archivo de gestión.", "enunciado": "¿Qué debe explicar Teresa al practicante?", "opciones": [{"t": "Que las peticiones van al expediente de su subserie y los oficios pueden quedar por mes", "j": "Es incorrecta. Es plausible porque acierta con las peticiones, pero deja fuera los oficios enviados; el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 incluye también las comunicaciones oficiales enviadas. Error de completitud.", "tipo": "completitud"}, {"t": "Que la TRD es obligatoria y las carpetas por mes cumplen si cada una lleva el nombre de la serie", "j": "Es incorrecta. Es plausible porque reconoce la obligatoriedad del art. 24 de la Ley 594 de 2000, pero agrupar por mes no conforma el expediente de la serie o subserie que exige el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que la TRD es obligatoria y peticiones y oficios van al expediente de su serie o subserie", "j": "Es correcta. El art. 24 de la Ley 594 de 2000 hace obligatorio que las entidades del Estado elaboren y adopten la TRD, y el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 ordena incluir las comunicaciones enviadas o recibidas y las peticiones en el expediente de la serie o subserie según la TRD.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M007", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 24", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#24", "fecha": "2026-10-26"}, {"fila": "M020", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E05-006-1", "caso_id": "C-E05-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 13", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, la Facilitadora IV Paola Herrera recibe el escrito de Jorge Villa, radicado con el número 2026-0815. En él pide información sobre los requisitos para solicitar una cita presencial y, además, formula una queja por el trato que recibió en la fila del 3 de febrero. El escrito no menciona el derecho de petición ni cita norma alguna. Un compañero sugiere registrarlo como comunicación informativa sin término de respuesta. El sistema obliga a escoger la tipología al radicar.", "enunciado": "¿Cómo debe clasificar Paola el escrito en el sis
