<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-FA4-C01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>

<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-FA4-C01", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Facilitador IV, nivel asistencial, OPEC 236902", "empleo_corto": "Facilitador IV", "nivel_txt": "asistencial", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 300, "funcionales": 206}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-26", "semilla": 236903, "corte_normativo": "2026-10-26"}, "pjs": [{"id": "C-E06-005-1", "caso_id": "C-E06-005", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 16", "integra": ["GESTION DOCUMENTAL"], "caso": "Diana Rojas, Facilitadora IV de la ventanilla única de una Dirección Seccional, revisa un escrito que llegó por correo postal el 20 de julio. Va dirigido a la Dirección Seccional, trae nombre completo y cédula del señor Hernán Silva, explica qué solicita y por qué, y está firmado. No relaciona anexos porque el señor no aporta documentos. Al pie solo aparece un número de celular, sin dirección física ni electrónica. El señor es persona natural sin inscripción en el registro mercantil. Diana debe terminar la verificación antes de pasar el escrito a radicación.", "enunciado": "¿Qué elemento del contenido mínimo debe registrar Diana como ausente en el escrito?", "opciones": [{"t": "La relación de los documentos que el peticionario desee presentar con el escrito.", "j": "Es incorrecta. Es un elemento del art. 16 de la Ley 1437 de 2011, pero se refiere a los documentos que el peticionario desee presentar; si no aporta ninguno, no hay relación que exigir. Error de granularidad.", "tipo": "granularidad"}, {"t": "La dirección donde el peticionario recibirá la correspondencia de respuesta.", "j": "Es correcta. El num. 2 del art. 16 de la Ley 1437 de 2011 exige indicar la dirección donde se recibirá correspondencia, y el art. 4.2.6 del Acuerdo AGN 001 de 2024 pide verificar los datos de contacto para dar respuesta.", "tipo": null}, {"t": "La dirección electrónica, que toda persona debe indicar en sus peticiones escritas.", "j": "Es incorrecta. La dirección electrónica figura en el num. 2 del art. 16 de la Ley 1437 de 2011, pero es obligatoria para quien deba estar inscrito en el registro mercantil; para el señor es opcional. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M052", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#16", "fecha": "2026-10-26"}, {"fila": "M021", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.6", "fecha": "2026-10-26"}]}, {"id": "C-E02-012-1", "caso_id": "C-E02-012", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.2", "integra": ["OFIMATICA"], "caso": "La coordinadora del grupo de apoyo administrativo de una Dirección Seccional pide al Facilitador IV Ricardo Pardo que participe en el diseño de un formato nuevo para registrar el préstamo de expedientes del archivo de gestión. El formato se usará desde el 1 de diciembre, en papel en la sede principal y como formulario electrónico en dos puntos de atención. Ricardo tiene un modelo que circula entre compañeros, sin un procedimiento documentado detrás, y le proponen adoptarlo tal cual por la premura del plazo. El formato quedará en el listado oficial de formatos del área.", "enunciado": "¿Con qué base debe Ricardo apoyar el diseño del formato?", "opciones": [{"t": "Con un diseño fijado para el papel de la sede, que los puntos de atención adapten luego.", "j": "Es incorrecta. Es plausible porque resuelve el soporte de la sede principal, pero el art. 4.1.2 del Acuerdo AGN 001 de 2024 pide determinar en el procedimiento el soporte o formato electrónico y los medios de producción de cada uso previsto. Error de completitud.", "tipo": "completitud"}, {"t": "Con el modelo que circula entre compañeros, para documentar el procedimiento tras usarlo.", "j": "Es incorrecta. Es plausible por la premura del plazo, pero el art. 4.1.2 del Acuerdo AGN 001 de 2024 exige generar los documentos a partir de procedimientos planificados y documentados antes de producirlos. Error de fase: invierte el orden entre procedimiento y producción.", "tipo": "fase"}, {"t": "Con un procedimiento documentado que defina soporte, diseño y medios de producción.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.2, ordena generar los documentos a partir de procedimientos planificados y documentados en los que se determine su soporte o formato electrónico, el diseño y los medios y técnicas de producción.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M014", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.2", "fecha": "2026-10-26"}]}, {"id": "C-E03-008-1", "caso_id": "C-E03-008", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Ley 599 de 2000, art. 434B", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Sofía Arango, Facilitadora IV del punto de atención de la Dirección Seccional de Impuestos de Valle Hondo, revisa el 15 de octubre el texto del volante de una campaña dirigida a contribuyentes omisos, que se imprime el 17 de octubre. El borrador afirma que el monto que define el delito de defraudación o evasión tributaria lo calcula el servidor que atiende al contribuyente en el punto. La coordinadora pidió a Sofía contrastar cada frase con el artículo penal citado e informarle las correcciones antes de enviar el volante a impresión.", "enunciado": "¿Qué corrección debe informar Sofía a la coordinadora sobre esa frase?", "opciones": [{"t": "Que el monto se define cuando el contribuyente presente la declaración que había omitido.", "j": "Es incorrecta. Vincula el monto a un momento real del trámite de los omisos, pero la Ley 599 de 2000, art. 434B, no lo hace depender de la presentación de la declaración sino de la liquidación oficial. Error de fase.", "tipo": "fase"}, {"t": "Que el monto se define por liquidación oficial de la autoridad tributaria competente.", "j": "Es correcta. La Ley 599 de 2000, art. 434B, señala que el monto de la conducta se define en todos los casos por liquidación oficial de la autoridad tributaria competente; ni el servidor del punto ni el contribuyente lo fijan.", "tipo": null}, {"t": "Que el monto lo calcula el contador del contribuyente cuando corrige la declaración presentada.", "j": "Es incorrecta. Es plausible porque el contador prepara las cifras de la declaración, pero la Ley 599 de 2000, art. 434B, deja la definición del monto a la autoridad tributaria competente y no al particular. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M100", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 434B", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#434B", "fecha": "2026-10-26"}]}, {"id": "C-E06-003-1", "caso_id": "C-E06-003", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 21", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Sofía Cárdenas, Facilitadora IV de correspondencia de una Dirección Seccional, recibe el 6 de mayo, por escrito y con radicado 007702, una petición del señor Julián Ortiz sobre el cobro de una multa de tránsito impuesta por la secretaría de movilidad de su municipio. El señor la dirigió a la DIAN porque creyó que la entidad recaudaba esa obligación. El jefe del grupo confirma que la DIAN no conoce de ese asunto y que la secretaría de movilidad es la autoridad competente. Sofía debe tramitar el escrito esa misma semana.", "enunciado": "¿Qué gestión debe realizar Sofía con la petición?", "opciones": [{"t": "Remitirla a la secretaría dentro de los cinco días siguientes y enviar al señor copia del oficio remisorio.", "j": "Es correcta. El art. 21 de la Ley 1437 de 2011 ordena, cuando la petición escrita llega a autoridad no competente, remitirla al competente dentro de los cinco días siguientes a la recepción y enviar copia del oficio remisorio al peticionario.", "tipo": null}, {"t": "Informar al señor dentro de los cinco días que la DIAN no es competente y archivar el escrito.", "j": "Es incorrecta. Acierta en el aviso y en el plazo, pero el art. 21 de la Ley 1437 de 2011 también exige remitir la petición al competente cuando este existe; archivarla deja el trámite a medias. Error de completitud.", "tipo": "completitud"}, {"t": "Devolver el escrito al señor para que él mismo lo presente ante la secretaría de movilidad del municipio.", "j": "Es incorrecta. Resulta plausible porque el asunto es de otra autoridad, pero el art. 21 de la Ley 1437 de 2011 asigna a la entidad que recibe, no al ciudadano, la carga de remitir la petición al competente. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M055", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 21", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#21", "fecha": "2026-10-26"}]}, {"id": "C-E05-016-1", "caso_id": "C-E05-016", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.2", "integra": ["TABLAS DE RETENCION"], "caso": "La Facilitadora IV Juliana Torres apoya la actualización de la Tabla de Retención Documental del grupo de apoyo administrativo de una Dirección Seccional. Revisa dos subseries: Actas del Comité de Dirección, que registran desde 1995 las decisiones sobre la gestión de la seccional, y Planillas de Control de Visitantes, con 300 cajas cuyo contenido también está registrado en el sistema de acceso del edificio. El borrador deja en blanco la disposición final de ambas y el coordinador le pide proponer la de cada una para el proyecto que estudiará el comité.", "enunciado": "¿Qué disposición final debe proponer Juliana para cada subserie?", "opciones": [{"t": "Selección para las actas, por sus años, y conservación total para las planillas, por su volumen", "j": "Es incorrecta. Es plausible porque menciona las dos disposiciones de la tabla, pero las invierte: el Acuerdo AGN 001 de 2024 asocia la selección (art. 4.5.3) al gran volumen o al contenido registrado en otras fuentes, y la conservación total (art. 4.5.2) al valor de evidencia de decisiones. Error de norma.", "tipo": "norma"}, {"t": "Conservación total para las actas y selección para las planillas de control de visitantes", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.5.2, reserva la conservación total a documentos con valor como evidencia de las decisiones de las instituciones, y el art. 4.5.3 aplica la selección a series de gran volumen o cuyo contenido se encuentra registrado en otras; así se reparten las dos subseries.", "tipo": null}, {"t": "Ninguna por ahora, hasta que el archivo central la defina en la transferencia primaria", "j": "Es incorrecta. Es plausible porque el archivo central interviene en las transferencias, pero el Acuerdo AGN 001 de 2024, arts. 4.5.2 y 4.5.3, exige que la disposición final quede establecida en la TRD, que es lo que se está elaborando; aplazarla la traslada a otra etapa. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M036", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.2", "fecha": "2026-10-26"}, {"fila": "M037", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.3", "fecha": "2026-10-26"}]}, {"id": "C-E03-004-1", "caso_id": "C-E03-004", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["TABLAS DE RETENCION"], "caso": "Jorge Ríos, Facilitador IV del archivo de gestión de la Dirección Seccional de Impuestos de Monteverde, recibe el 21 de julio el radicado 2026-4470, en el que una sociedad pide que le devuelvan un saldo a favor de su declaración de renta del año gravable 2025. La tabla de retención del área ordena las series por función general de la entidad: recaudación, fiscalización, cobro y devolución. Jorge debe ubicar el documento en la serie correcta antes del préstamo del expediente programado para el 23 de julio.", "enunciado": "¿En qué serie debe ubicar Jorge el documento recibido?", "opciones": [{"t": "En la serie de devolución, porque la solicitud pide el reintegro de un saldo del impuesto de renta.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, num. 1, distingue la devolución como una función de la DIAN en la administración del impuesto sobre la renta, separada de la recaudación y de la fiscalización; la solicitud pide justamente esa devolución.", "tipo": null}, {"t": "En la serie de fiscalización, porque la entidad revisará la declaración antes de devolver el saldo.", "j": "Es incorrecta. Anticipa una revisión que podría ocurrir más adelante, pero lo que llega ahora es una solicitud de devolución, función que el Decreto 1742 de 2020, art. 3, num. 1, nombra por separado; se clasifica por lo que el documento pide. Error de fase.", "tipo": "fase"}, {"t": "En la serie de recaudación, porque el saldo a favor nació de un pago del impuesto de renta.", "j": "Es incorrecta. Es plausible porque el saldo se originó en lo recaudado, pero el Decreto 1742 de 2020, art. 3, num. 1, trata la recaudación y la devolución como funciones distintas y el documento pide la segunda. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M097", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E04-004-1", "caso_id": "C-E04-004", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV de la ventanilla de radicación de una Dirección Seccional. El 7 de julio de 2026 revisa los registros del día y encuentra que un compañero radicó doce documentos entrantes anotando solo el número y la fecha; dejó vacíos el remitente, el asunto y el trámite al que corresponde cada uno. Dos de esos documentos responden a requerimientos en curso de la División de Recaudo. El compañero afirma que con el número de radicado basta para ubicarlos. Usted debe explicarle qué exige el registro en el sistema de gestión de documentos.", "enunciado": "¿Qué debe explicar usted a su compañero sobre el registro de esos documentos?", "opciones": [{"t": "Con el número y la fecha de radicado queda asegurada la trazabilidad de los documentos.", "j": "Es incorrecta. Suena suficiente porque el número es el identificador del documento, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, pide vincular a un trámite y registrar la descripción con metadatos que garanticen recuperación y acceso. Error de completitud.", "tipo": "completitud"}, {"t": "Debe llevar los metadatos y la vinculación al trámite, para recuperar y consultar el documento.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.1, exige la recepción, el registro, la vinculación a un trámite y la distribución con su respectiva descripción (metadatos), que garanticen la disponibilidad, recuperación y acceso a los documentos durante todo el ciclo vital.", "tipo": null}, {"t": "El registro debe incluir la descripción de cada documento cuando se transfiera al archivo central.", "j": "Es incorrecta. Es plausible porque en la transferencia también se describen documentos, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, ubica la descripción en la recepción, el registro y la distribución, para que el documento sea recuperable desde su ingreso. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M016", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.1", "fecha": "2026-10-26"}]}, {"id": "C-E07-010-1", "caso_id": "C-E07-010", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.5.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Diana, Facilitadora IV del archivo de gestión de una Dirección Seccional, consulta el estado de la TRD actualizada en 2026. La versión fue aprobada por el Comité Institucional de Gestión y Desempeño en junio y enviada en julio para su inscripción, pero a 26 de octubre todavía no se ha emitido el Certificado de Inscripción en el Registro Único de Series Documentales. Su coordinador le pide preparar con esa versión la eliminación de 20 cajas de una subserie marcada con E y la transferencia de otras 30 cajas de expedientes cerrados, ambas para la primera semana de noviembre.", "enunciado": "¿Qué debe informar Diana al coordinador sobre las dos tareas encargadas?", "opciones": [{"t": "Que con la versión de 2026 la transferencia puede hacerse ya y la eliminación espera el certificado del RUSD", "j": "Es incorrecta. Es plausible porque la eliminación suele verse como la tarea más delicada, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 condiciona a la emisión del certificado tanto la disposición final como las transferencias. Error de fase.", "tipo": "fase"}, {"t": "Que el Comité puede autorizar el uso de la versión de 2026 mientras se emite el certificado del RUSD", "j": "Es incorrecta. Es plausible porque el Comité aprobó la versión, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 liga la implementación a la emisión del Certificado de Inscripción en el RUSD, no a una autorización interna. Error de competencia.", "tipo": "competencia"}, {"t": "Que ninguna de las dos tareas puede hacerse con la versión de 2026 hasta que se emita el certificado del RUSD", "j": "Es correcta. El art. 5.1.5.1 del Acuerdo AGN 001 de 2024 dispone que las transferencias documentales y la disposición final se efectúan una vez emitido el Certificado de Inscripción en el RUSD; la versión de 2026 aún no lo tiene, así que ninguna de las dos tareas se aplica con ella.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M041", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.5.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.5.1", "fecha": "2026-10-26"}]}, {"id": "C-E07-012-1", "caso_id": "C-E07-012", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.4.1", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Mauricio, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, recibe el 2 de septiembre la resolución interna que crea un grupo interno de trabajo dedicado a la fiscalización de comercio electrónico. El nuevo grupo empezará a producir documentos el 1 de octubre. La TRD vigente se actualizó en enero y no contempla ese grupo. Su coordinadora le pide informar al grupo de gestión documental si la resolución tiene efecto sobre la TRD antes de organizar el archivo del nuevo grupo, que ya pidió carpetas y cajas.", "enunciado": "¿Qué debe informar Mauricio al grupo de gestión documental?", "opciones": [{"t": "Que la creación del grupo interno de trabajo es un caso en que la TRD debe actualizarse", "j": "Es correcta. El numeral 2 del art. 5.1.4.1 del Acuerdo AGN 001 de 2024 dispone que la TRD debe actualizarse cuando se creen o supriman grupos internos de trabajo; la resolución crea uno que la versión vigente no contempla.", "tipo": null}, {"t": "Que basta con abrir carpetas para el grupo nuevo dentro de las series ya incluidas en la TRD", "j": "Es incorrecta. Es plausible porque abrir carpetas permite archivar desde el primer día, pero no atiende la causal: el numeral 2 del art. 5.1.4.1 del Acuerdo AGN 001 de 2024 exige actualizar la TRD cuando se crean grupos internos de trabajo. Error de completitud.", "tipo": "completitud"}, {"t": "Que la TRD se revisará en la siguiente vigencia, porque la actualización de enero sigue vigente", "j": "Es incorrecta. Es plausible porque la TRD se actualizó hace pocos meses, pero el art. 5.1.4.1 del Acuerdo AGN 001 de 2024 liga la actualización a los hechos que la causan, no a un calendario anual; la creación del grupo ya ocurrió. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M040", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.4.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.4.1", "fecha": "2026-10-26"}]}, {"id": "C-E07-016-1", "caso_id": "C-E07-016", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["GESTION DOCUMENTAL"], "caso": "Felipe, Facilitador IV del archivo de gestión de un grupo de apoyo administrativo, debe entregar el 15 de diciembre al archivo central 35 expedientes cerrados de la subserie Acuerdos de Pago, con tiempo de retención en gestión cumplido según la TRD. Cada carpeta tiene su hoja de control. El grupo no ha elaborado el inventario documental de la subserie, y el coordinador le propone enviar las cajas con un oficio que indique el número total de carpetas para cumplir la fecha. El archivo central no recibe entregas fuera del cronograma anual.", "enunciado": "¿Qué debe hacer Felipe para preparar la entrega?", "opciones": [{"t": "Elaborar el inventario documental de los expedientes y remitirlos con sus respectivas hojas de control", "j": "Es correcta. El art. 26 de la Ley 594 de 2000 obliga a elaborar inventarios que aseguren el control de los documentos en sus fases, y el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que las unidades transferidas vayan con su hoja de control.", "tipo": null}, {"t": "Enviar las carpetas con sus hojas de control y el oficio que indica el número total", "j": "Es incorrecta. Es plausible porque cumple la hoja de control que exige el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024, pero un conteo de carpetas no es inventario; el art. 26 de la Ley 594 de 2000 obliga a inventariar los documentos para su control en las fases. Error de completitud.", "tipo": "completitud"}, {"t": "Enviar las cajas en la fecha y elaborar el inventario cuando el archivo central las reciba", "j": "Es incorrecta. Es plausible porque cumple la fecha programada, pero deja sin control los documentos durante el cambio de fase; el art. 26 de la Ley 594 de 2000 busca asegurar el control de los documentos en sus diferentes fases, lo que exige el inventario antes de entregar. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M008", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-26"}, {"fila": "M034", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.4.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.4.3", "fecha": "2026-10-26"}]}, {"id": "C-E03-015-1", "caso_id": "C-E03-015", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Decreto 1083 de 2015, art. 2.2.22.3.2", "integra": ["GESTION DOCUMENTAL"], "caso": "Fabián Rojas, Facilitador IV del archivo de gestión de la Dirección Seccional de Aduanas de Costa Brava, debe explicar el 20 de noviembre, en la reunión mensual del área, por qué el control de los préstamos documentales se reporta en el Modelo Integrado de Planeación y Gestión. En octubre registró 142 préstamos y 9 devoluciones vencidas. Un compañero sostiene que el modelo solo sirve para calificar a los servidores al final del año, y la coordinadora pidió a Fabián aclarar el punto con el texto reglamentario.", "enunciado": "¿Qué aclaración debe dar Fabián en la reunión?", "opciones": [{"t": "Que el control de préstamos se reporta porque el MIPG califica el desempeño de quien atiende el archivo.", "j": "Es incorrecta. Es plausible porque retoma la idea del compañero de que el modelo califica a los servidores, pero confunde el MIPG con la evaluación del desempeño laboral; el Decreto 1083 de 2015, art. 2.2.22.3.2, lo define como marco de referencia para la gestión de las entidades. Error de norma.", "tipo": "norma"}, {"t": "Que el control de préstamos es seguimiento y control de la gestión del área, para la cual el MIPG es marco de referencia.", "j": "Es correcta. El Decreto 1083 de 2015, art. 2.2.22.3.2, define el MIPG como un marco de referencia para dirigir, planear, ejecutar, hacer seguimiento, evaluar y controlar la gestión de las entidades; registrar préstamos y devoluciones vencidas es seguimiento y control de esa gestión.", "tipo": null}, {"t": "Que el control de préstamos se reporta al cierre de la vigencia, cuando el MIPG revisa los resultados obtenidos.", "j": "Es incorrecta. Acierta en que el modelo mira resultados, pero lo ubica solo al final; el Decreto 1083 de 2015, art. 2.2.22.3.2, lo define como referencia desde la planeación y la ejecución hasta el seguimiento y el control. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M091", "norma": "Decreto 1083 de 2015 (Único Reglamentario del Sector Función Pública)", "articulo": "art. 2.2.22.3.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1083_2015.htm#2.2.22.3.2", "fecha": "2026-10-26"}]}, {"id": "C-E01-005-1", "caso_id": "C-E01-005", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 83", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En la ventanilla de una Dirección Seccional, el Facilitador IV Camilo Suárez atiende a Lucía Méndez, quien radicó una petición el 10 de febrero con el número 2026-ER-004512. El sistema de correspondencia muestra que la petición se repartió a la dependencia el 1 de marzo y que el 6 de mayo se firmó una resolución, todavía pendiente de citación. Hoy es 15 de mayo y la usuaria pregunta qué efecto tiene que nadie le haya notificado una respuesta. El facilitador no puede adelantarle el contenido de la resolución firmada.", "enunciado": "¿Qué debe informar el facilitador a la usuaria sobre su petición?", "opciones": [{"t": "Que ya existe una decisión expresa, porque la resolución se firmó antes de cumplirse los tres meses.", "j": "Es incorrecta. Es plausible porque el acto ya está firmado, pero el art. 83 de la Ley 1437 de 2011 exige que la decisión esté notificada dentro del plazo; firmar no equivale a notificar. Confunde la expedición con la notificación. Error de fase.", "tipo": "fase"}, {"t": "Que pasaron tres meses desde que la presentó sin decisión notificada, por lo que se entiende negada.", "j": "Es correcta. Ley 1437 de 2011, art. 83: transcurridos tres meses desde la presentación de una petición sin que se haya notificado decisión que la resuelva, se entiende que es negativa. Del 10 de febrero al 15 de mayo pasaron más de tres meses y la resolución firmada no se ha notificado.", "tipo": null}, {"t": "Que los tres meses se cuentan desde el reparto a la dependencia, de modo que aún no hay silencio.", "j": "Es incorrecta. Es plausible porque el reparto marca el inicio del trabajo interno, pero el art. 83 de la Ley 1437 de 2011 cuenta los tres meses a partir de la presentación de la petición. Toma una fecha de inicio equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M072", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 83", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#83", "fecha": "2026-10-26"}]}, {"id": "C-E01-014-1", "caso_id": "C-E01-014", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 6", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "En una revisión interna del grupo de correspondencia de una Dirección Seccional se detecta que doce citaciones para notificación personal, de actos expedidos el 1 de septiembre, siguen el 15 de septiembre en la bandeja de salida del Facilitador IV Daniel Rojas. El facilitador, empleado de planta, explica que no las envió porque nadie se lo recordó y que, como apoya tareas operativas, su situación es la de cualquier particular. El coordinador le pide un informe escrito sobre su posición frente al régimen de responsabilidad.", "enunciado": "¿Qué debe reconocer el facilitador en su informe?", "opciones": [{"t": "Que, como empleado del Estado, es servidor público y responde también por omitir el envío dentro del plazo.", "j": "Es correcta. Constitución Política, arts. 123 y 6: los empleados del Estado son servidores públicos, y estos responden por infringir la Constitución y las leyes y por omisión o extralimitación en sus funciones. Las citaciones debían enviarse dentro de los cinco días siguientes a la expedición (Ley 1437 de 2011, art. 68).", "tipo": null}, {"t": "Que la responsabilidad es del jefe que firmó los actos, porque él cumple labores de apoyo operativo.", "j": "Es incorrecta. Es plausible porque el jefe expide los actos, pero el envío de las citaciones era tarea del facilitador, y el art. 6 de la Constitución Política hace responsable a cada servidor por la omisión en el ejercicio de sus funciones. Desplaza la responsabilidad a otro servidor. Error de competencia.", "tipo": "competencia"}, {"t": "Que responde como particular, de modo que solo le es exigible infringir de manera directa la Constitución o la ley.", "j": "Es incorrecta. Es plausible porque reproduce la regla de los particulares del art. 6 de la Constitución Política, pero el facilitador es empleado del Estado y, por tanto, servidor público (art. 123), que responde además por omisión. Aplica la regla de otro sujeto. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M081", "norma": "Constitución Política de Colombia", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#6", "fecha": "2026-10-26"}, {"fila": "M082", "norma": "Constitución Política de Colombia", "articulo": "art. 123", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#123", "fecha": "2026-10-26"}, {"fila": "M067", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 68", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#68", "fecha": "2026-10-26"}]}, {"id": "C-E01-017-1", "caso_id": "C-E01-017", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 35", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "El Facilitador IV Gustavo Ibarra, del punto de atención de una Dirección Seccional, recibe una llamada de Nelly Cifuentes, propietaria de una papelería en un municipio a cuatro horas de la sede. Ella quiere aportar documentos a su actuación 2026-0705 y pregunta si debe viajar, porque alguien le dijo que solo se reciben en papel. La seccional tiene habilitado un buzón electrónico oficial de radicación y la etapa de pruebas vence el 6 de noviembre. Hoy es 28 de octubre y la usuaria ya tiene los documentos escaneados.", "enunciado": "¿Qué debe informar el facilitador a la usuaria?", "opciones": [{"t": "Que puede enviarlos por el buzón electrónico, pero que solo valen cuando lleguen los originales en papel.", "j": "Es incorrecta. Es plausible porque reconoce el canal electrónico, pero el art. 35 de la Ley 1437 de 2011 da al medio electrónico la misma aptitud para adelantar el procedimiento, y exigir además el papel contraría la economía y la celeridad (art. 3). Resuelve solo a medias. Error de completitud.", "tipo": "completitud"}, {"t": "Que debe radicar los documentos en papel en la sede, porque la actuación se inició por escrito físico.", "j": "Es incorrecta. Es plausible porque la actuación empezó en papel, pero el art. 35 de la Ley 1437 de 2011 permite adelantar los procedimientos por escrito, verbalmente o por medios electrónicos. Restringe el medio sin soporte normativo. Error de norma.", "tipo": "norma"}, {"t": "Que puede radicar los documentos por el buzón electrónico oficial, pues la actuación admite ese medio.", "j": "Es correcta. Ley 1437 de 2011, art. 35: los procedimientos administrativos se adelantan por escrito, verbalmente o por medios electrónicos. El buzón habilitado le permite aportar antes del 6 de noviembre, en línea con los principios de economía y celeridad (art. 3).", "tipo": null}], "clave": 2, "soporte": [{"fila": "M059", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 35", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#35", "fecha": "2026-10-26"}, {"fila": "M057", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E05-013-1", "caso_id": "C-E05-013", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 74", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Teresa Vargas, Facilitadora IV de la ventanilla de correspondencia de una Dirección Seccional, recibe el radicado 2026-3550 de la sociedad ficticia Metales Arauca S.A.S. El escrito controvierte la resolución definitiva que expidió el jefe de la División de Gestión Jurídica y pide que ese mismo funcionario la revoque; no menciona al superior. La resolución fue firmada el 2 de octubre. El sistema exige indicar el tipo de recurso y la dependencia destinataria al registrar el documento. Teresa no evalúa si el recurso prospera ni si fue presentado a tiempo.", "enunciado": "¿Qué tipo de recurso y qué destinatario debe registrar Teresa en el sistema?", "opciones": [{"t": "Reposición, dirigido al jefe de la División de Gestión Jurídica que expidió el acto", "j": "Es correcta. La Ley 1437 de 2011, art. 74, numeral 1, prevé contra los actos definitivos el recurso de reposición ante quien expidió la decisión para que la aclare, modifique, adicione o revoque; la sociedad pide la revocatoria a ese mismo funcionario.", "tipo": null}, {"t": "Reposición, dirigido al Grupo de Documentación que custodia el expediente", "j": "Es incorrecta. Es plausible porque acierta en el recurso, pero el art. 74, numeral 1, de la Ley 1437 de 2011 lo radica ante quien expidió la decisión, no ante la dependencia que guarda el expediente. Error de competencia.", "tipo": "competencia"}, {"t": "Apelación, dirigido al director seccional como inmediato superior de quien expidió el acto", "j": "Es incorrecta. Es plausible porque la apelación también procede contra actos definitivos, pero el art. 74, numeral 2, de la Ley 1437 de 2011 la surte ante el superior, y el escrito se dirige a quien decidió. Confunde los dos recursos. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}, {"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}]}, {"id": "C-E05-001-1", "caso_id": "C-E05-001", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.4", "integra": ["GESTION DOCUMENTAL"], "caso": "Lucía Márquez, Facilitadora IV del archivo de gestión de la División de Gestión de Fiscalización de una Dirección Seccional, recibe 40 carpetas sin código que llegaron desde correspondencia. El Cuadro de Clasificación Documental vigente asigna a la sección el código 1205, a la serie Programas de Fiscalización el código 1205.45 y a la subserie Investigaciones de Oficio el código 1205.45.02. Las carpetas contienen expedientes de investigaciones de oficio abiertas en 2026. La jefa pidió dejar listos los rótulos antes del viernes, sin crear códigos distintos de los que trae el cuadro.", "enunciado": "¿Qué código debe registrar Lucía en el rótulo de las carpetas al clasificarlas?", "opciones": [{"t": "El código que asigne el archivo central cuando reciba la transferencia primaria", "j": "Es incorrecta. Es plausible porque el archivo central revisa las transferencias, pero el Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena codificar las agrupaciones conforme al Cuadro de Clasificación Documental, y el cuadro vigente ya trae el código de la subserie; dejar el rótulo pendiente de otra dependencia aplaza una codificación que ya está definida. Error de fase.", "tipo": "fase"}, {"t": "El código 1205.45, porque la serie reúne todos los expedientes de fiscalización", "j": "Es incorrecta. Es plausible porque la serie sí agrupa los programas de fiscalización, pero el artículo 4.3.1.4 del Acuerdo AGN 001 de 2024 exige codificar la jerarquía completa hasta la subserie cuando el cuadro la prevé; quedarse en la serie pierde un nivel. Error de granularidad.", "tipo": "granularidad"}, {"t": "El código 1205.45.02, que representa sección, serie y subserie según el cuadro", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena que las agrupaciones se codifiquen representando la jerarquía en que se subdivide el fondo (secciones, series y subseries) conforme al Cuadro de Clasificación Documental; los expedientes pertenecen a la subserie Investigaciones de Oficio.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E02-008-1", "caso_id": "C-E02-008", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.8", "integra": ["TABLAS DE RETENCION"], "caso": "Sandra Molina, Facilitadora IV del archivo de gestión de una Dirección Seccional, conforma el expediente de un recurso de reconsideración, subserie que la Tabla de Retención Documental asigna a la División Jurídica. Tiene sobre la mesa el escrito del recurso radicado el 5 de febrero, el auto admisorio del 19 de febrero, un memorial de pruebas del 3 de marzo y la resolución del 28 de mayo que decidió el recurso. Su jefe le pide dejar la resolución al principio para que la consulten primero.", "enunciado": "¿En qué orden debe Sandra ubicar los documentos dentro del expediente?", "opciones": [{"t": "Primero la resolución y luego los demás por fecha, porque la decisión es lo más consultado.", "j": "Es incorrecta. Es plausible porque facilita la consulta de la decisión, pero el art. 4.3.1.8 del Acuerdo AGN 001 de 2024 ordena los tipos documentales de modo que evidencien el desarrollo del trámite. Error de granularidad: aplica un criterio de uso y no el orden original.", "tipo": "granularidad"}, {"t": "Escrito, auto admisorio, memorial y resolución, en la secuencia en que se tramitó el recurso.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.8, num. 2, dispone que los tipos documentales se ordenen de forma que se evidencie el desarrollo del trámite, y el art. 4.3.1.3 fija el orden original como la secuencia en que se gestionan hasta su resolución definitiva.", "tipo": null}, {"t": "Escrito, auto y resolución, con el memorial de pruebas en una carpeta aparte de la actuación.", "j": "Es incorrecta. Es plausible porque respeta la secuencia de los actos principales, pero el memorial hace parte del mismo trámite y el expediente debe reunir la totalidad de sus documentos para garantizar su integridad (Acuerdo AGN 001 de 2024, art. 4.3.1.3). Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M029", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.8", "fecha": "2026-10-26"}, {"fila": "M025", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.3", "fecha": "2026-10-26"}]}, {"id": "C-E04-002-1", "caso_id": "C-E04-002", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Ley 527 de 1999, art. 8", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. Para un expediente se requiere conservar en su forma original un certificado electrónico que el contribuyente Comercial Andina S.A.S. generó en forma definitiva el 10 de abril de 2026. Llegan dos archivos: el del 12 de abril trae un código de verificación que coincide con el registrado al generarse; el del 14 de abril fue guardado de nuevo por el remitente con anotaciones y su código ya no coincide. Ambos pueden mostrarse en pantalla. Usted debe incorporar uno solo al expediente electrónico.", "enunciado": "¿Cuál archivo debe registrar usted como original en el expediente y con qué fundamento?", "opciones": [{"t": "El del 14 de abril, porque es la versión más reciente y puede mostrarse a quien la solicite.", "j": "Es incorrecta. Es plausible porque la versión reciente suele ser la vigente y cumple el literal b de la Ley 527 de 1999, art. 8, pero falta la garantía de integridad del literal a, pues el código ya no coincide. Error de completitud.", "tipo": "completitud"}, {"t": "El del 12 de abril, porque existe garantía confiable de integridad desde su forma definitiva.", "j": "Es correcta. La Ley 527 de 1999, art. 8, literal a, exige una garantía confiable de que se conservó la integridad de la información desde que se generó por primera vez en su forma definitiva, y el literal b, que pueda mostrarse; el archivo del 12 de abril cumple ambas condiciones.", "tipo": null}, {"t": "El del 14 de abril, y verificar su código de integridad cuando se cierre el expediente.", "j": "Es incorrecta. Parece razonable porque prevé una verificación, pero la Ley 527 de 1999, art. 8, exige la garantía de integridad para tener el mensaje como original y esa verificación debe hacerse al incorporarlo, no al cierre; además el código ya no coincide. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M094", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E01-007-1", "caso_id": "C-E01-007", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 36", "integra": ["TABLAS DE RETENCION"], "caso": "El Facilitador IV Felipe Arango, del grupo de apoyo administrativo de una Dirección Seccional, clasifica la serie Peticiones según la tabla de retención documental. Encuentra dos carpetas abiertas a nombre de Agroinsumos El Llano S.A.S.: la 2026-0233, radicada el 8 de abril, y la 2026-0310, radicada el 29 de abril. Ambas piden la misma corrección de un registro ante la misma dependencia, y cada una tiene un sustanciador distinto. Uno de ellos ya proyectó una respuesta favorable y el otro, una desfavorable, sin que ninguno haya firmado.", "enunciado": "¿Qué debe hacer el facilitador con las dos carpetas?", "opciones": [{"t": "Mantener cada solicitud en su propia carpeta, porque tienen números de radicado y fechas de entrada diferentes.", "j": "Es incorrecta. Es plausible porque cada radicado suele abrir carpeta, pero el art. 36 de la Ley 1437 de 2011 organiza el expediente por actuación y no por radicado, y manda acumular para evitar decisiones contradictorias. Usa una unidad de organización equivocada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Unir por su cuenta las dos carpetas y anular el segundo radicado para dejar vigente un solo trámite.", "j": "Es incorrecta. Es plausible porque el resultado buscado es un solo expediente, pero la acumulación se dispone de oficio o a petición por la autoridad (Ley 1437 de 2011, art. 36), y anular radicados excede la labor de apoyo (Constitución Política, art. 6). Error de competencia.", "tipo": "competencia"}, {"t": "Informar al jefe para que acumule las actuaciones en un solo expediente y evite decisiones contradictorias.", "j": "Es correcta. Ley 1437 de 2011, art. 36: los documentos de una misma actuación se organizan en un solo expediente, al que se acumulan los que se tramiten ante la misma autoridad, con el fin de evitar decisiones contradictorias. El facilitador advierte la situación para que se ordene la acumulación.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M058", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-26"}, {"fila": "M081", "norma": "Constitución Política de Colombia", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E05-002-1", "caso_id": "C-E05-002", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.2", "integra": ["GESTION DOCUMENTAL"], "caso": "En el grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Andrés Pineda revisa una caja con 25 oficios que la División de Gestión Jurídica produjo en 2025 al tramitar conceptos internos. La caja llegó por error al archivo de gestión de su grupo, mezclada con las actas de comité del propio grupo, también de 2025. El coordinador le pide clasificar el contenido con el Cuadro de Clasificación Documental y le recuerda que el inventario documental del grupo debe entregarse el lunes siguiente.", "enunciado": "¿Qué criterio debe aplicar Andrés para agrupar los oficios encontrados en la caja?", "opciones": [{"t": "Ordenarlos por fecha de radicación, sin código, hasta que la oficina jurídica los solicite", "j": "Es incorrecta. Es plausible porque ordenar por fecha aporta algún control, pero omite la clasificación por sección y serie que exige el Acuerdo AGN 001 de 2024, art. 4.3.1.4; deja sin resolver lo que pidió el coordinador. Error de completitud.", "tipo": "completitud"}, {"t": "Ubicarlos en la sección de la oficina que los produjo y en la serie que el cuadro le asigna", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.2, obliga a respetar el principio de procedencia, que determina la oficina productora a partir de la estructura orgánico-funcional, y el art. 4.3.1.4 manda clasificar en secciones y series conforme al cuadro; los oficios son de la División de Gestión Jurídica.", "tipo": null}, {"t": "Ubicarlos en la serie de actas del grupo, porque llegaron en la misma caja y del mismo año", "j": "Es incorrecta. Es plausible porque la caja y el año coinciden, pero el principio de procedencia (Acuerdo AGN 001 de 2024, art. 4.3.1.2) atiende a la oficina que produjo los documentos y no al lugar donde se encontraron; asigna los oficios a una dependencia que no los produjo. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M024", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.2", "fecha": "2026-10-26"}, {"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-006-1", "caso_id": "C-E03-006", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Ley 599 de 2000, art. 319", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Diego Salcedo, Facilitador IV del punto de atención de la Dirección Seccional de Aduanas de Frontera Sur, atiende el 18 de septiembre a un ciudadano que informa que un vecino entra cada semana electrodomésticos desde el país limítrofe por una trocha sin control aduanero. El ciudadano calcula el valor de cada cargamento y lo deja anotado. El protocolo del punto exige diligenciar el formato de información recibida con los datos que la norma penal describe para esa conducta y enviarlo a la dependencia competente en el mismo turno, sin calificar los hechos.", "enunciado": "¿Qué datos debe destacar Diego en el formato antes de enviarlo?", "opciones": [{"t": "El tipo de electrodomésticos y la frecuencia semanal de los ingresos que relata el ciudadano en el punto.", "j": "Es incorrecta. Son datos útiles del relato, pero la Ley 599 de 2000, art. 319, describe la conducta por el lugar no habilitado de ingreso y por la cuantía de la mercancía; omitir esos dos elementos deja incompleto el formato. Error de completitud.", "tipo": "completitud"}, {"t": "La calificación de los hechos como delito de contrabando y la multa que corresponde al vecino.", "j": "Es incorrecta. Usa el lenguaje de la Ley 599 de 2000, art. 319, pero calificar la conducta y tasar la multa no corresponde al Facilitador IV ni al punto de atención; el protocolo pide informar sin calificar. Error de competencia.", "tipo": "competencia"}, {"t": "El ingreso de mercancías por un lugar no habilitado y el valor estimado que reporta el ciudadano.", "j": "Es correcta. La Ley 599 de 2000, art. 319, describe la introducción de mercancías por lugares no habilitados en cuantía superior a cincuenta salarios mínimos; destacar el lugar y el valor estimado entrega a la dependencia competente los datos que la norma usa, sin calificar los hechos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M099", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 319", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#319", "fecha": "2026-10-26"}]}, {"id": "C-E04-003-1", "caso_id": "C-E04-003", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Ley 527 de 1999, art. 12", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del grupo de correspondencia de una Dirección Seccional. La serie Comunicaciones Oficiales de la TRD del área tiene un tiempo de retención de dos años en el archivo de gestión. El 20 de mayo de 2026 se migran los correos recibidos del buzón institucional a un nuevo repositorio. En la prueba con el radicado 2026-0815, la herramienta conserva el adjunto en su formato original, pero descarta el encabezado con remitente, destinatario, fecha y hora de recepción. El jefe le pide verificar la migración antes de aprobarla.", "enunciado": "¿Qué debe verificar usted para informar si la migración permite cumplir la conservación de esos mensajes?", "opciones": [{"t": "Que el adjunto se convierta a un formato de imagen, para que la serie pueda consultarse fuera del sistema.", "j": "Es incorrecta. Puede parecer útil para la consulta, pero la Ley 527 de 1999, art. 12, numeral 2, pide conservar el formato en que se generó o recibió, o uno que demuestre reproducir con exactitud la información, y la conversión no resuelve la pérdida del encabezado. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que el adjunto abra y pueda consultarse, porque así se conserva lo que contiene el mensaje.", "j": "Es incorrecta. Es plausible porque la accesibilidad es la primera condición de la Ley 527 de 1999, art. 12, pero el artículo exige además conservar el formato y la información de origen, destino, fecha y hora, que la herramienta descarta. Error de completitud.", "tipo": "completitud"}, {"t": "Que se conserven accesibles el adjunto, su formato y los datos de origen, destino, fecha y hora.", "j": "Es correcta. La Ley 527 de 1999, art. 12, numerales 1 a 3, exige que la información sea accesible, que se conserve en su formato o en uno que la reproduzca con exactitud y que se conserve la información sobre origen, destino, fecha y hora del envío o recepción.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M095", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E05-004-1", "caso_id": "C-E05-004", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.8", "integra": ["TABLAS DE RETENCION"], "caso": "El Facilitador IV Camilo Ortega apoya el archivo de gestión de la División de Gestión de Fiscalización de una Dirección Seccional. Encuentra que un compañero conformó las carpetas de 2026 por tipo de documento: una con todos los autos, otra con todos los requerimientos y otra con todas las respuestas, aunque pertenecen a 12 investigaciones distintas de la subserie Investigaciones de Oficio. La tabla de retención se aplica por subserie y la revisión de calidad del archivo está programada para el mes siguiente. El coordinador pide un informe del ajuste necesario.", "enunciado": "¿Qué debe informar Camilo al coordinador sobre la conformación de esas carpetas?", "opciones": [{"t": "Que la reorganización corresponde al archivo central cuando reciba las carpetas", "j": "Es incorrecta. Es plausible porque el archivo central recibe las transferencias, pero el art. 4.3.1.8 del Acuerdo AGN 001 de 2024 hace responsables a las oficinas productoras de la conformación de las unidades; aplazarla la desplaza a otra etapa. Error de fase.", "tipo": "fase"}, {"t": "Que basta con rotular cada carpeta con el nombre del tipo documental que hoy contiene", "j": "Es incorrecta. Es plausible porque el rótulo mejora la identificación, pero no corrige la conformación: el Acuerdo AGN 001 de 2024, art. 4.3.1.8, exige que la unidad se clasifique según el cuadro y que sus tipos evidencien el trámite. Resuelve solo una parte. Error de completitud.", "tipo": "completitud"}, {"t": "Que cada investigación debe ser una unidad de la subserie, ordenada según su trámite", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.8, numerales 1 y 2, dispone que la clasificación de las unidades documentales se base en el Cuadro de Clasificación Documental y que los tipos se ordenen para evidenciar el desarrollo del trámite; agrupar por tipo rompe ambos criterios.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M029", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.8", "fecha": "2026-10-26"}]}, {"id": "C-E02-018-1", "caso_id": "C-E02-018", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 22", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Cada mañana, la Facilitadora IV Alejandra Suárez, del Grupo de Correspondencia de una Dirección Seccional, recibe entre 60 y 80 comunicaciones, les asigna radicado y las entrega a la dependencia que debe tramitarlas; esa labor ocupa la mayor parte de su jornada. El 3 de abril, el grupo de apoyo administrativo le pide clasificar sus tareas según los procesos archivísticos del programa de gestión documental para un informe trimestral. Alejandra duda sobre cómo nombrar la entrega a las dependencias, porque otra compañera reportó esa misma tarea como consulta.", "enunciado": "¿Con qué proceso archivístico debe Alejandra registrar esa tarea en el informe?", "opciones": [{"t": "Distribución, porque la tarea lleva lo radicado a la dependencia que debe tramitarlo.", "j": "Es correcta. La Ley 594 de 2000, art. 22, enumera la producción o recepción, la distribución, la consulta, la organización, la recuperación y la disposición final; entregar las comunicaciones radicadas a la dependencia competente es distribución, y el art. 12 hace responsable a la administración de esa gestión.", "tipo": null}, {"t": "Recepción, porque la tarea forma parte del ingreso de las comunicaciones a la entidad.", "j": "Es incorrecta. Es plausible porque la recepción y la radicación preceden a la entrega, pero el art. 22 de la Ley 594 de 2000 distingue la recepción de la distribución, que es la etapa siguiente. Error de fase: nombra la etapa anterior.", "tipo": "fase"}, {"t": "Consulta, porque las dependencias acceden a las comunicaciones para poder tramitarlas.", "j": "Es incorrecta. Es plausible porque las dependencias leen las comunicaciones que reciben, pero la consulta es el acceso a documentos ya organizados; llevar lo radicado a quien lo tramita es otro proceso del art. 22 de la Ley 594 de 2000. Error de granularidad: confunde procesos vecinos.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M004", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#22", "fecha": "2026-10-26"}, {"fila": "M003", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E01-008-1", "caso_id": "C-E01-008", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 87", "integra": ["GESTION DOCUMENTAL"], "caso": "La Facilitadora IV Sandra Peña, del grupo de correspondencia de una Dirección Seccional, actualiza el estado de la Resolución 1550, que resolvió una solicitud de Ferretería Los Andes Ltda. y admite reposición y apelación. El aviso se entregó en la dirección del expediente el 2 de septiembre y la notificación quedó surtida al finalizar el 3 de septiembre. El término de diez días para recurrir venció el 17 de septiembre. Hoy, 25 de septiembre, la ventanilla certifica que no ingresó ningún escrito sobre ese acto. El sistema exige una fecha exacta.", "enunciado": "¿Qué fecha de firmeza debe registrar la facilitadora?", "opciones": [{"t": "El 17 de septiembre, día en que venció el término de diez días para interponer los recursos.", "j": "Es incorrecta. Es plausible porque la firmeza depende de ese vencimiento, pero el art. 87, num. 3, de la Ley 1437 de 2011 la fija desde el día siguiente al vencimiento. Desplaza el cómputo un día. Error de granularidad.", "tipo": "granularidad"}, {"t": "El 4 de septiembre, día siguiente a aquel en que quedó surtida la notificación por aviso.", "j": "Es incorrecta. Es plausible porque el num. 1 del art. 87 de la Ley 1437 de 2011 fija la firmeza al día siguiente de la notificación, pero esa regla aplica cuando no procede ningún recurso, y este acto admite reposición y apelación. Ubica la firmeza en una etapa anterior. Error de fase.", "tipo": "fase"}, {"t": "El 18 de septiembre, día siguiente al vencimiento del término para recurrir sin recurso presentado.", "j": "Es correcta. Ley 1437 de 2011, art. 87, num. 3: el acto queda en firme desde el día siguiente al vencimiento del término para interponer los recursos, si no se interpusieron. El término de diez días (art. 76) venció el 17 de septiembre sin escritos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M073", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 87", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#87", "fecha": "2026-10-26"}, {"fila": "M070", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 76", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#76", "fecha": "2026-10-26"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.4", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Diana Castro, Facilitadora IV del Grupo de Correspondencia de una Dirección Seccional, clasifica en el sistema de gestión documental los documentos del 18 de julio. Uno es un oficio producido por la División de Gestión de Fiscalización que solicita información a un tercero y que hará parte de la subserie Programas de Fiscalización. El sistema muestra campos para el código de sección, serie y subserie. Un compañero le propone registrar como código el nombre del tercero, porque así el oficio aparece más rápido en las búsquedas del grupo.", "enunciado": "¿Con qué criterio debe Diana clasificar el oficio en el sistema?", "opciones": [{"t": "Con el código del Grupo de Correspondencia, porque es la dependencia que registra el oficio.", "j": "Es incorrecta. Es plausible porque Correspondencia es quien opera el sistema, pero el art. 4.3.1.4 del Acuerdo AGN 001 de 2024 clasifica conforme a la estructura orgánico-funcional de quien produce, aquí la División de Gestión de Fiscalización. Error de competencia: toma la dependencia equivocada.", "tipo": "competencia"}, {"t": "Con el código que le asigne la dependencia productora al archivarlo, cuando termine el trámite.", "j": "Es incorrecta. Es plausible porque la dependencia productora conforma el expediente, pero la clasificación conforme al CCD se hace desde el registro del documento y no se aplaza al archivo final (Acuerdo AGN 001 de 2024, art. 4.3.1.4). Error de fase.", "tipo": "fase"}, {"t": "Con el código de la sección de Fiscalización y de la subserie Programas de Fiscalización del CCD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena clasificar conforme a la estructura orgánico-funcional y codificar secciones, series y subseries según el CCD; el oficio lo produjo la División de Gestión de Fiscalización para la subserie Programas de Fiscalización.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E06-010-1", "caso_id": "C-E06-010", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 7", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Mónica Ávila, Facilitadora IV del punto de atención de una Dirección Seccional, atiende con un sistema de turnos en horario de 8:00 a. m. a 4:00 p. m. El señor Tomás Rincón ingresó a las 3:52 p. m., tomó el turno 087 y a las 4:05 p. m. aún esperaba, con dos turnos antes del suyo. Un compañero propone cerrar la atención y citar al señor para el día siguiente, porque la jornada terminó y el personal de seguridad ya cerró la puerta de la sede. Mónica debe decidir cómo atender el turno pendiente.", "enunciado": "¿Cómo debe proceder Mónica con el señor Rincón?", "opciones": [{"t": "Atenderlo ese día, porque ingresó a la oficina dentro del horario normal de atención.", "j": "Es correcta. El num. 3 del art. 7 de la Ley 1437 de 2011 impone el deber de atender a todas las personas que hubieran ingresado a las oficinas dentro del horario normal de atención.", "tipo": null}, {"t": "Indicarle que presente su solicitud por el canal electrónico, que opera todo el día.", "j": "Es incorrecta. El canal electrónico es un medio válido, pero no reemplaza la atención personal debida a quien ingresó dentro del horario, según el num. 3 del art. 7 de la Ley 1437 de 2011. Error de completitud.", "tipo": "completitud"}, {"t": "Asignarle un turno prioritario para la primera hora de la jornada siguiente.", "j": "Es incorrecta. Ofrece un trato considerado, pero traslada a otra jornada una atención que el num. 3 del art. 7 de la Ley 1437 de 2011 obliga a prestar el mismo día. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E01-010-1", "caso_id": "C-E01-010", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 91", "integra": ["TABLAS DE RETENCION"], "caso": "Al preparar la transferencia primaria según la tabla de retención documental, la Facilitadora IV Natalia Ospina, del archivo de gestión de una Dirección Seccional, revisa el expediente de la Resolución 0215, que ordenó a Distribuidora El Prado Ltda. reintegrar una suma. El acto quedó en firme el 14 de febrero de 2020 y el expediente ingresó al archivo de gestión el 9 de marzo de 2023. Después de la constancia de firmeza no obra ningún documento de ejecución de la autoridad. Hoy es 26 de octubre de 2026 y el formato de transferencia pide observaciones.", "enunciado": "¿Qué observación debe informar la facilitadora en el formato?", "opciones": [{"t": "Que el acto conserva obligatoriedad, porque el término para ejecutarlo es de diez años desde su firmeza.", "j": "Es incorrecta. Es plausible porque existen plazos largos en otras materias, pero el art. 91, num. 3, de la Ley 1437 de 2011 fija cinco años. Aplica un plazo que la norma no prevé. Error de norma.", "tipo": "norma"}, {"t": "Que el acto conserva obligatoriedad, porque los cinco años se cuentan desde su ingreso al archivo de gestión.", "j": "Es incorrecta. Es plausible porque la fecha de ingreso al archivo es la que maneja la facilitadora, pero el art. 91, num. 3, de la Ley 1437 de 2011 cuenta los cinco años desde que el acto está en firme. Toma una base de cómputo equivocada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que el acto pudo perder obligatoriedad, porque pasaron más de cinco años en firme sin actos para ejecutarlo.", "j": "Es correcta. Ley 1437 de 2011, art. 91, num. 3: el acto en firme pierde obligatoriedad cuando, al cabo de cinco años de estar en firme, la autoridad no ha realizado los actos que le corresponden para ejecutarlo. Desde el 14 de febrero de 2020 pasaron más de cinco años sin ejecución.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M075", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 91", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#91", "fecha": "2026-10-26"}]}, {"id": "C-E05-006-1", "caso_id": "C-E05-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 13", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, la Facilitadora IV Paola Herrera recibe el escrito de Jorge Villa, radicado con el número 2026-0815. En él pide información sobre los requisitos para solicitar una cita presencial y, además, formula una queja por el trato que recibió en la fila del 3
