de febrero. El escrito no menciona el derecho de petición ni cita norma alguna. Un compañero sugiere registrarlo como comunicación informativa sin término de respuesta. El sistema obliga a escoger la tipología al radicar.", "enunciado": "¿Cómo debe clasificar Paola el escrito en el sistema de correspondencia?", "opciones": [{"t": "Como comunicación informativa, porque el ciudadano no invocó el derecho de petición", "j": "Es incorrecta. Es plausible porque el escrito no nombra el derecho, pero la Ley 1437 de 2011, art. 13, señala que no es necesario invocarlo; el compañero aplica una exigencia que la norma descarta. Error de norma.", "tipo": "norma"}, {"t": "Como derecho de petición que contiene una solicitud de información y una queja", "j": "Es correcta. La Ley 1437 de 2011, art. 13 (modificado por la Ley 1755 de 2015), establece que toda actuación que inicie una persona ante las autoridades implica el ejercicio del derecho de petición sin necesidad de invocarlo, y que mediante él se puede requerir información y formular quejas.", "tipo": null}, {"t": "Como queja, sin registrar la solicitud de información que el escrito también trae", "j": "Es incorrecta. Es plausible porque la queja es la parte más visible, pero el art. 13 de la Ley 1437 de 2011 reconoce ambas actuaciones como modalidades del derecho de petición; registrar solo una deja sin trámite la otra. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M049", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 13", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#13", "fecha": "2026-10-26"}]}, {"id": "C-E01-011-1", "caso_id": "C-E01-011", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.9", "integra": ["OFIMATICA"], "caso": "El 2 de enero, primer día hábil del año, el Facilitador IV Ricardo León, del grupo de apoyo administrativo de una Dirección Seccional, debe numerar tres resoluciones firmadas esa mañana. El último acto del año anterior quedó con el número 1874, y la herramienta automatizada de numeración propone el 1875 para el primero. A media mañana la herramienta deja de responder y soporte técnico calcula que volverá a funcionar en dos días. El jefe necesita las resoluciones numeradas hoy para enviar las citaciones correspondientes.", "enunciado": "¿Cómo debe numerar el facilitador las resoluciones?", "opciones": [{"t": "Seguir desde el 1875 en un registro manual y cargar esos números en la herramienta cuando vuelva a operar.", "j": "Es incorrecta. Es plausible porque conserva el orden de la serie anterior, pero el art. 4.2.9 del Acuerdo AGN 001 de 2024 manda iniciar la numeración desde el número uno a partir del 1 de enero de cada año. Usa como unidad un consecutivo de varios años. Error de granularidad.", "tipo": "granularidad"}, {"t": "Iniciar en el número 1 en un registro manual y seguir el orden consecutivo, que luego se refleja en la herramienta.", "j": "Es correcta. Acuerdo AGN 001 de 2024, art. 4.2.9: la numeración de los actos es consecutiva y desde el 1 de enero de cada año se inicia en el número uno, con sistemas manuales, mecánicos o automatizados. El registro manual permite numerar hoy y cumplir el envío de citaciones (Ley 1437 de 2011, art. 68).", "tipo": null}, {"t": "Esperar a que la herramienta opere y numerar entonces las tres resoluciones en el orden en que se firmaron.", "j": "Es incorrecta. Es plausible porque evita registros paralelos, pero el art. 4.2.9 del Acuerdo AGN 001 de 2024 admite sistemas manuales, y esperar retrasa la citación, que debe enviarse dentro de los cinco días siguientes a la expedición (Ley 1437 de 2011, art. 68). Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M023", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.9", "fecha": "2026-10-26"}, {"fila": "M067", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 68", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#68", "fecha": "2026-10-26"}]}, {"id": "C-E01-003-1", "caso_id": "C-E01-003", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 43", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "En el grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Andrés Molina organiza en el sistema de correspondencia tres documentos del expediente 2026-0388, serie Peticiones: un auto del 6 de junio que ordena pedir un certificado a otra dependencia; una resolución del 20 de junio que niega de fondo lo solicitado por Lácteos Valle Verde Ltda.; y un auto del 24 de junio que archiva por desistimiento una segunda solicitud, con lo cual esta no puede continuar. El sistema obliga a marcar los documentos contra los que caben recursos.", "enunciado": "¿Qué documentos debe marcar el facilitador en el sistema?", "opciones": [{"t": "Solo la resolución que niega de fondo, porque los autos se clasifican como actos de trámite dentro de la actuación.", "j": "Es incorrecta. Es plausible porque muchos autos impulsan el trámite, pero el art. 43 de la Ley 1437 de 2011 también califica como definitivo el acto que hace imposible continuar la actuación, como el auto de archivo descrito. Deja por fuera un acto definitivo. Error de completitud.", "tipo": "completitud"}, {"t": "La resolución que niega de fondo y el auto de archivo, porque uno decide el asunto y el otro impide continuarlo.", "j": "Es correcta. Ley 1437 de 2011, arts. 43 y 74: son definitivos los actos que deciden directa o indirectamente el fondo o hacen imposible continuar la actuación, y por regla general contra ellos proceden reposición y apelación. La resolución del 20 de junio y el auto del 24 de junio cumplen esa condición.", "tipo": null}, {"t": "Los tres documentos, porque todos fueron expedidos dentro de la misma actuación y obran en el expediente.", "j": "Es incorrecta. Es plausible porque los tres pertenecen al mismo expediente, pero el art. 74 de la Ley 1437 de 2011 concede los recursos contra los actos definitivos, y el auto que pide un certificado no decide el fondo ni impide continuar (art. 43). Clasifica por expediente y no por contenido. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}, {"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}]}, {"id": "C-E06-011-1", "caso_id": "C-E06-011", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.6", "integra": ["GESTION DOCUMENTAL"], "caso": "Felipe Duarte, Facilitador IV del archivo de gestión de una Dirección Seccional, encuentra el 21 de octubre en su correo electrónico institucional un mensaje de la señora Rosa Méndez con una petición y dos anexos en PDF. El mensaje trae nombre, cédula y la dirección electrónica de la remitente para recibir respuesta. Felipe no maneja correspondencia y su jefe le pide no dejar correr el término sin control. La entidad tiene una ventanilla única integrada a la sede electrónica, y el mensaje no tiene aún número de radicado.", "enunciado": "¿Qué debe hacer Felipe con el mensaje recibido?", "opciones": [{"t": "Remitirlo a la ventanilla única con sus anexos, para radicarlo y verificar los datos de contacto.", "j": "Es correcta. El art. 4.2.6 del Acuerdo AGN 001 de 2024 ordena remitir a la ventanilla única las comunicaciones que ingresen por los correos institucionales de los servidores, para radicarlas con sus anexos y verificar los datos de contacto.", "tipo": null}, {"t": "Guardarlo en el expediente del archivo de gestión y avisar al área que debe responderlo.", "j": "Es incorrecta. Avisar al área es útil, pero el art. 4.2.6 del Acuerdo AGN 001 de 2024 exige radicar primero en la ventanilla única; archivar antes de radicar invierte el orden del procedimiento. Error de fase.", "tipo": "fase"}, {"t": "Pedir a la señora que radique la petición en la ventanilla, porque llegó al buzón personal de un servidor.", "j": "Es incorrecta. Parece ordenar el canal, pero el num. 6 del art. 7 de la Ley 1437 de 2011 obliga a tramitar las peticiones que lleguen por medios electrónicos. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M021", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.6", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E03-003-1", "caso_id": "C-E03-003", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Marta Quiroga, Facilitadora IV del punto de atención móvil que la Dirección Seccional de Impuestos de Río Alto instaló el 9 de mayo en la plaza de mercado, recibe en una hora tres consultas: una sobre el gravamen a los movimientos financieros, otra sobre el impuesto nacional a la gasolina y al ACPM, y otra sobre el impuesto de vehículos que cobra el departamento. La campaña atiende solo asuntos de la entidad y el formato de atención exige marcar, antes del cierre de las 2:00 p. m., cuáles consultas se registran como propias.", "enunciado": "¿Qué consultas debe registrar Marta como propias de la DIAN en el formato?", "opciones": [{"t": "La del gravamen a los movimientos financieros y la del impuesto nacional a la gasolina, porque ambos son tributos nacionales.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, num. 1, encarga a la DIAN administrar el gravamen a los movimientos financieros y el impuesto nacional a la gasolina y al ACPM, ambos tributos del orden nacional; el impuesto de vehículos lo cobra el departamento y no figura entre esas funciones.", "tipo": null}, {"t": "La del gravamen a los movimientos financieros, porque nace de una operación bancaria del contribuyente.", "j": "Es incorrecta. Es plausible porque el gravamen sí figura en el Decreto 1742 de 2020, art. 3, num. 1, pero omite el impuesto nacional a la gasolina y al ACPM, que la misma norma incluye entre los tributos que administra la DIAN. Error de completitud.", "tipo": "completitud"}, {"t": "Las tres consultas, porque la campaña registra todo tributo que pague el contribuyente en la plaza.", "j": "Es incorrecta. Es plausible porque las tres consultas tratan de impuestos, pero el Decreto 1742 de 2020, art. 3, num. 1, limita la función de la DIAN a los impuestos del orden nacional cuya competencia no esté asignada a otras entidades; el de vehículos lo cobra el departamento. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M097", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["OFIMATICA"], "caso": "En una Dirección Seccional se implementa el Sistema de Gestión de Documentos Electrónicos de Archivo y el área de tecnología ya lo habilitó para el grupo de apoyo administrativo. El Facilitador IV Luis Arango, del grupo de apoyo administrativo, gestiona las solicitudes de certificaciones que llegan por el canal electrónico; el 4 de agosto recibe 23, con radicados del 2026-2201 al 2026-2223. Un compañero le sugiere guardarlas en una carpeta compartida del equipo y subir cada expediente al sistema cuando se expida la certificación, porque así se cargan menos archivos sueltos durante el trámite.", "enunciado": "¿Qué debe entender Luis sobre el momento de incorporar los expedientes al sistema?", "opciones": [{"t": "Que se incorporan desde el inicio de cada trámite, conforme al Cuadro de Clasificación y la TRD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar los expedientes electrónicos según el CCD y la TRD e incorporarlos al SGDEA desde el inicio del trámite hasta su finalización, y el art. 1.3.4 exige gestionarlos en ese sistema y no en repositorios sueltos.", "tipo": null}, {"t": "Que se incorporan en un solo expediente por día, con las 23 solicitudes recibidas juntas.", "j": "Es incorrecta. Es plausible porque agrupa lo recibido en una misma fecha, pero cada solicitud es un trámite y el expediente se conforma por trámite según el CCD y la TRD (Acuerdo AGN 001 de 2024, art. 4.3.2.1). Error de granularidad: usa el día como unidad documental.", "tipo": "granularidad"}, {"t": "Que se incorporan al expedir la certificación, cuando cada expediente ya reúne sus documentos.", "j": "Es incorrecta. Es plausible porque el expediente queda completo al expedir la certificación, pero el art. 4.3.2.1 del Acuerdo AGN 001 de 2024 exige incorporarlo al SGDEA desde el inicio del trámite. Error de fase: aplaza la incorporación al final.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}, {"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-001-1", "caso_id": "C-E03-001", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["GESTION DOCUMENTAL"], "caso": "Laura Méndez, Facilitadora IV de la ventanilla de correspondencia de la Dirección Seccional de Impuestos de Villa Serena, recibe el 3 de marzo dos escritos de una misma ciudadana. En el primero, radicado 2026-0311, pregunta por el saldo de su impuesto sobre las ventas del último bimestre. En el segundo, radicado 2026-0312, reclama por el cobro del impuesto predial de su casa, que liquida la alcaldía. El procedimiento del área exige clasificar cada asunto antes de las 4:00 p. m. del mismo día, para repartirlo a la dependencia que corresponda o al trámite de asuntos ajenos.", "enunciado": "¿Cómo debe clasificar Laura los escritos recibidos antes del reparto?", "opciones": [{"t": "Clasificar el primero como asunto de la DIAN y responder ella misma el segundo con el valor del predial.", "j": "Es incorrecta. Acierta con el impuesto sobre las ventas, pero atribuye a la Facilitador IV la respuesta de fondo sobre un tributo que liquida otra entidad; el Decreto 1742 de 2020, art. 1, no da a la DIAN ese asunto y el cargo solo clasifica y reparte. Error de competencia.", "tipo": "competencia"}, {"t": "Clasificar ambos como asuntos de la DIAN y definir la no competencia del segundo después de hacer el reparto.", "j": "Es incorrecta. Es plausible porque los dos escritos llegan a la ventanilla y tratan de impuestos, pero el procedimiento pide clasificar antes de repartir y el predial no es un impuesto del orden nacional según el Decreto 1742 de 2020, art. 1. Error de fase.", "tipo": "fase"}, {"t": "Clasificar el primero como asunto de la DIAN y el segundo como asunto ajeno, para el trámite de no competencia.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, asigna a la DIAN la administración del impuesto sobre las ventas y de los demás impuestos internos del orden nacional cuya competencia no esté asignada a otras entidades; el predial lo liquida la alcaldía, de modo que el segundo escrito sale por el trámite de asuntos ajenos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E02-013-1", "caso_id": "C-E02-013", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 6.1.1.4", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "En el depósito del archivo de gestión de una Dirección Seccional, la Facilitadora IV Juliana Ortiz encuentra el 7 de marzo excrementos de roedores junto a dos estantes y cajas mordidas de la serie Peticiones, Quejas y Reclamos de 2025, que contienen 14 expedientes. El higrómetro del depósito registra valores normales durante la última semana y las estanterías están firmes. Debe reportar el hallazgo al coordinador con el programa de conservación preventiva que corresponde, pues el formato de reporte permite marcar una sola casilla de programa.", "enunciado": "¿Qué programa debe marcar Juliana en el reporte?", "opciones": [{"t": "Monitoreo y control de condiciones ambientales, que vigila humedad y temperatura.", "j": "Es incorrecta. Es plausible porque es otro programa sobre el ambiente del depósito, pero el higrómetro está en valores normales y el hallazgo es biológico, que el art. 6.1.1.4 del Acuerdo AGN 001 de 2024 ubica en saneamiento ambiental. Error de granularidad: confunde categorías vecinas.", "tipo": "granularidad"}, {"t": "Almacenamiento y realmacenamiento, porque las cajas mordidas de los 14 expedientes deben reemplazarse.", "j": "Es incorrecta. Es plausible porque las cajas dañadas sí requieren cambio, pero atiende el efecto sobre las unidades y deja sin tratar la plaga, que el num. 3 del art. 6.1.1.4 del Acuerdo AGN 001 de 2024 asigna a saneamiento ambiental. Error de completitud.", "tipo": "completitud"}, {"t": "Saneamiento ambiental, que comprende desinfección, desratización y desinsectación.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 6.1.1.4, num. 3, incluye la desratización en el programa de saneamiento ambiental, que responde a la presencia de roedores; la Ley 594 de 2000, art. 46, exige aplicar el sistema integrado de conservación en cada fase del ciclo vital, también en gestión.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M043", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 6.1.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#6.1.1.4", "fecha": "2026-10-26"}, {"fila": "M010", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 46", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#46", "fecha": "2026-10-26"}]}, {"id": "C-E07-009-1", "caso_id": "C-E07-009", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.4", "integra": ["GESTION DOCUMENTAL"], "caso": "Óscar, Facilitador IV del archivo de gestión de un grupo de apoyo administrativo, tiene a cargo 45 cajas de la subserie Comunicaciones Informativas, con tiempo de retención cumplido y marcada con E en la TRD. El 5 de octubre su coordinador le pide destruirlas esa semana para liberar espacio en la bodega. Óscar revisa el acta más reciente del Comité Institucional de Gestión y Desempeño, del 28 de septiembre, y no encuentra la eliminación de esa subserie entre los temas tratados ni aprobados. La bodega tiene capacidad para pocas semanas más.", "enunciado": "¿Qué debe informar Óscar al coordinador antes de actuar?", "opciones": [{"t": "Que la eliminación puede aprobarla el coordinador con la firma del acta de destrucción", "j": "Es incorrecta. Es plausible porque el coordinador responde por el grupo y suele firmar actas, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 asigna la aprobación de la eliminación al Comité Institucional de Gestión y Desempeño. Error de competencia.", "tipo": "competencia"}, {"t": "Que la eliminación requiere la aprobación del Comité, que todavía no consta en el acta revisada", "j": "Es correcta. El art. 4.5.4 del Acuerdo AGN 001 de 2024 exige que la eliminación esté establecida en la TRD con la sigla E y, además, que sea aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces; el acta revisada no la incluye.", "tipo": null}, {"t": "Que la eliminación procede porque la TRD la registra y el tiempo de retención está cumplido", "j": "Es incorrecta. Es plausible porque cumple dos condiciones reales, la sigla E y el tiempo, pero omite la tercera: el art. 4.5.4 del Acuerdo AGN 001 de 2024 exige la aprobación del Comité Institucional de Gestión y Desempeño. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M038", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-018-1", "caso_id": "C-E03-018", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["GESTION DOCUMENTAL"], "caso": "Carolina Ibáñez, Facilitadora IV de correspondencia de la Dirección Seccional de Aduanas de Bahía Norte, recibe el 2 de diciembre el oficio 2026-J-552 del Juzgado Primero Penal del Circuito, que pide copia de las actas de aprehensión de licores de un operativo de agosto. El formato de radicación exige dos campos antes del reparto: la rama del poder público del remitente y el asunto misional de la petición, según el catálogo de competencias de la entidad. El reparto de la mañana vence a las 11:00 a. m.", "enunciado": "¿Qué valores debe registrar Carolina en los dos campos del formato?", "opciones": [{"t": "Rama judicial y asunto de gestión aduanera, en la parte de aprehensión de mercancías.", "j": "Es correcta. La Constitución Política, art. 113, ubica a los juzgados en la rama judicial, y el Decreto 1742 de 2020, art. 1, incluye en la gestión aduanera la aprehensión de mercancías; los dos campos quedan diligenciados antes del reparto.", "tipo": null}, {"t": "Rama judicial y asunto de fiscalización tributaria del impuesto sobre las ventas de licores.", "j": "Es incorrecta. Acierta con la rama, pero ubica la petición en un tributo interno; las actas de aprehensión pertenecen a la gestión aduanera que el Decreto 1742 de 2020, art. 1, describe con la aprehensión de mercancías. Error de norma.", "tipo": "norma"}, {"t": "Rama ejecutiva, porque el oficio llega a una entidad del Gobierno, y asunto de gestión aduanera.", "j": "Es incorrecta. Acierta con el asunto, pero toma la rama del destinatario y no la del remitente; un juzgado pertenece a la rama judicial según la Constitución Política, art. 113. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}, {"fila": "M083", "norma": "Constitución Política de Colombia", "articulo": "art. 113", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#113", "fecha": "2026-10-26"}]}, {"id": "C-E07-015-1", "caso_id": "C-E07-015", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.1.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Elena, Facilitadora IV de correspondencia de una Dirección Seccional, recibe de la División de Fiscalización 22 oficios ya respondidos para que los archive. Como la ventanilla de correspondencia los radicó y despachó, una compañera propone guardarlos en una carpeta de la TRD de correspondencia. Elena observa que los oficios se produjeron en desarrollo de funciones de fiscalización y que la TRD de esa división incluye la subserie Requerimientos de Información. El archivo de gestión de Fiscalización recibe documentos los martes y jueves, y la próxima recepción es pasado mañana.", "enunciado": "¿Qué criterio debe aplicar Elena para clasificar los oficios?", "opciones": [{"t": "La serie general de comunicaciones oficiales, porque los oficios son correspondencia enviada", "j": "Es incorrecta. Es plausible porque los oficios son comunicaciones, pero clasificarlos por su forma ignora la función que los produjo; el numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 valora los documentos según las funciones de la oficina productora. Error de granularidad.", "tipo": "granularidad"}, {"t": "La TRD de correspondencia, porque esa dependencia radicó y despachó los oficios", "j": "Es incorrecta. Es plausible porque correspondencia intervino en el radicado y el envío, pero el numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 vincula la TRD a las funciones de la oficina productora, que aquí es Fiscalización. Error de competencia.", "tipo": "competencia"}, {"t": "La TRD de la oficina que produjo los oficios en desarrollo de sus funciones", "j": "Es correcta. El numeral 1 del art. 5.1.1.1 del Acuerdo AGN 001 de 2024 indica que la TRD valora los documentos que se producen en desarrollo de las funciones de cada unidad administrativa u oficina productora; los oficios son de Fiscalización y caben en su subserie.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M039", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.1.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.1.1", "fecha": "2026-10-26"}]}, {"id": "C-E04-013-1", "caso_id": "C-E04-013", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. Debe incorporar al Sistema de Gestión de Documentos Electrónicos de Archivo los documentos de un proceso de cobro iniciado el 14 de enero de 2026. Un compañero los cargó agrupados por tipo de archivo: una carpeta para documentos de texto, otra para imágenes y otra para hojas de cálculo. La TRD del área ubica ese proceso en la serie Procesos de Cobro, subserie Cobro Coactivo. Usted debe corregir la organización del expediente electrónico.", "enunciado": "¿Con qué criterio debe organizar usted los documentos en el sistema?", "opciones": [{"t": "Conformar un expediente en la serie y subserie que fijan el CCD y la TRD dentro del sistema.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, exige conformar los expedientes electrónicos de acuerdo con el CCD y la TRD e incorporarlos al SGDEA, y el art. 1.3.4 reitera que su gestión se hace de conformidad con esos instrumentos.", "tipo": null}, {"t": "Conservar las carpetas por tipo de archivo, que facilitan abrir cada documento en el sistema.", "j": "Es incorrecta. Parece funcional para el manejo técnico, pero el Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar el expediente según el CCD y la TRD; agrupar por formato usa un criterio ajeno a la clasificación documental. Error de granularidad.", "tipo": "granularidad"}, {"t": "Pedir al área de tecnologías que defina la serie del expediente y que lo reorganice en el sistema.", "j": "Es incorrecta. Es plausible porque el Acuerdo AGN 001 de 2024, art. 1.3.4, pide articulación con tecnologías, pero la clasificación la fijan el CCD y la TRD y la ejecuta el archivo de gestión, no el área técnica. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}, {"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E06-002-1", "caso_id": "C-E06-002", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 14", "integra": ["GESTION DOCUMENTAL"], "caso": "Andrés Mejía, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, lleva el control de términos de las peticiones. El 3 de marzo se radicó una petición de copias de documentos del archivo de gestión. Cuando han corrido nueve de los diez días del término, la jefe del área le informa que las copias no estarán listas a tiempo por un traslado de expedientes y le entrega un oficio para el peticionario. Andrés debe revisar el oficio y despacharlo ese mismo día con radicado de salida.", "enunciado": "¿Qué debe verificar Andrés en el oficio antes de despacharlo?", "opciones": [{"t": "Que exprese los motivos de la demora y fije un plazo que no exceda de veinte días.", "j": "Es correcta. El parágrafo del art. 14 de la Ley 1437 de 2011 obliga a informar, antes del vencimiento, los motivos de la demora y un plazo razonable que no exceda del doble del inicial; para copias el término es de diez días (num. 1).", "tipo": null}, {"t": "Que informe el nuevo plazo de veinte días aunque omita los motivos de la demora.", "j": "Es incorrecta. Respeta el límite del doble del término, pero el parágrafo del art. 14 de la Ley 1437 de 2011 exige expresar los motivos de la demora junto con el plazo. Error de completitud.", "tipo": "completitud"}, {"t": "Que exprese los motivos de la demora y fije un plazo de hasta treinta días, el doble del término general.", "j": "Es incorrecta. Es plausible porque aplica el límite del doble, pero lo calcula sobre el término general de quince días; el num. 1 del art. 14 de la Ley 1437 de 2011 fija diez días para las peticiones de documentos, y el parágrafo limita el nuevo plazo al doble del inicialmente previsto, es decir, veinte días. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M050", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 14", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#14", "fecha": "2026-10-26"}]}, {"id": "C-E06-018-1", "caso_id": "C-E06-018", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 22", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Beatriz Ocampo, Facilitadora IV de la ventanilla de una Dirección Seccional, radica el 5 de noviembre con el número 013420 una queja escrita del señor Pablo Ruiz por el trato que recibió de un servidor del punto de atención. El reglamento interno de peticiones de la Dirección Seccional asigna las quejas al grupo de quejas y reclamos. El servidor señalado pide a Beatriz que le entregue la queja para responderla él mismo y evitar que el caso escale. Beatriz debe repartir el documento en el sistema esa misma mañana.", "enunciado": "¿A quién debe repartir Beatriz la queja radicada?", "opciones": [{"t": "Al archivo de gestión, hasta que el señor ratifique la queja en forma presencial.", "j": "Es incorrecta. Parece una verificación prudente, pero la queja ya está radicada y el art. 22 de la Ley 1437 de 2011 exige tramitarla según la reglamentación interna; la opción detiene el trámite antes del reparto. Error de fase.", "tipo": "fase"}, {"t": "Al grupo de quejas y reclamos, que el reglamento interno designa para atenderlas.", "j": "Es correcta. El art. 22 de la Ley 1437 de 2011 remite a la reglamentación interna la manera de atender las quejas, y el num. 7 del art. 7 ordena atribuirlas a dependencias especializadas.", "tipo": null}, {"t": "Al servidor señalado, para que dé su versión y conteste al señor en el término.", "j": "Es incorrecta. Busca una respuesta rápida, pero el num. 7 del art. 7 y el art. 22 de la Ley 1437 de 2011 asignan las quejas a la dependencia especializada que fija la reglamentación interna. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M056", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#22", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E06-013-1", "caso_id": "C-E06-013", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1712 de 2014, art. 2", "integra": ["TABLAS DE RETENCION"], "caso": "Germán Castro, Facilitador IV del archivo de gestión de una Dirección Seccional, recibe el 26 de octubre la solicitud de un estudiante que pide consultar el informe de gestión del año anterior, archivado en la serie Informes. El documento no tiene marca de reserva y ninguna ley restringe su contenido. Una compañera opina que solo debe mostrarse a quien acredite un interés directo. La tabla de retención documental indica que la serie permanece dos años en el archivo de gestión antes de su transferencia. Germán debe responder la solicitud ese mismo día.", "enunciado": "¿Qué criterio de acceso debe aplicar Germán a la solicitud?", "opciones": [{"t": "Permitir la consulta, porque el informe es público y no hay reserva legal que lo limite.", "j": "Es correcta. El art. 2 de la Ley 1712 de 2014 establece que toda información en custodia de un sujeto obligado es pública y solo puede reservarse por disposición constitucional o legal, en armonía con el art. 74 de la Constitución.", "tipo": null}, {"t": "Remitir la solicitud al archivo central, que es el que custodia los documentos de consulta pública.", "j": "Es incorrecta. El archivo central recibe las transferencias, pero según la tabla de retención el informe sigue en el archivo de gestión; la opción traslada la solicitud a una etapa posterior del ciclo. Error de fase.", "tipo": "fase"}, {"t": "Permitir la consulta de un resumen del informe y reservar el resto del documento.", "j": "Es incorrecta. Da acceso parcial, pero el art. 4 de la Ley 1712 de 2014 solo admite restringir por excepciones contempladas en la ley o la Constitución, y aquí no existe ninguna. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M085", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#2", "fecha": "2026-10-26"}, {"fila": "M077", "norma": "Constitución Política de Colombia", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#74", "fecha": "2026-10-26"}, {"fila": "M087", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#4", "fecha": "2026-10-26"}]}, {"id": "C-E02-011-1", "caso_id": "C-E02-011", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "El Grupo de Devoluciones de una Dirección Seccional definió que, desde el 1 de julio de 2026, el tipo documental Concepto de verificación se producirá en formato electrónico y no en papel. La Facilitadora IV Carolina Vega, del archivo de gestión, revisa la Tabla de Retención Documental vigente y observa que la subserie Solicitudes de Devolución describe ese tipo documental en soporte papel. Su jefe le pide informar qué debe quedar registrado para que los expedientes de la subserie se conformen con los nuevos documentos.", "enunciado": "¿Qué debe informar Carolina a su jefe?", "opciones": [{"t": "Que basta con guardar los conceptos electrónicos en el repositorio del grupo y numerarlos.", "j": "Es incorrecta. Es plausible porque los conceptos quedan almacenados, pero el art. 4.1.4 del Acuerdo AGN 001 de 2024 exige registrar en la TRD los formatos electrónicos de los tipos documentales para conformar los expedientes. Error de completitud.", "tipo": "completitud"}, {"t": "Que el formato electrónico del tipo documental debe registrarse en la Tabla de Retención.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, ordena a quien produce documentos por medios electrónicos registrar en la TRD los formatos electrónicos de los tipos documentales para la conformación de los expedientes, series o subseries.", "tipo": null}, {"t": "Que el formato se registra en la Tabla cuando la subserie se transfiera al archivo central.", "j": "Es incorrecta. Es plausible porque señala el registro en la TRD, pero lo aplaza a la transferencia, cuando el art. 4.1.4 del Acuerdo AGN 001 de 2024 lo liga a la decisión de producir electrónicamente y a la conformación de los expedientes. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E05-015-1", "caso_id": "C-E05-015", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1712 de 2014, art. 19", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Gustavo León, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, registra en el índice de información la carpeta de una investigación penal por contrabando que la entidad apoya, todavía sin medida de aseguramiento. Una ley prohíbe expresamente el acceso a esos documentos durante la investigación. El 12 de mayo llega el radicado 2026-1101 de un periodista que pide copia completa de la carpeta. El jefe responde las solicitudes de acceso; Gustavo debe clasificar la carpeta en el índice, que obliga a escoger una sola categoría por carpeta.", "enunciado": "¿Qué categoría de información debe asignar Gustavo a la carpeta en el índice?", "opciones": [{"t": "Información pública clasificada, porque el acceso puede dañar derechos de los investigados", "j": "Es incorrecta. Es plausible porque los investigados tienen derechos que proteger, pero la Ley 1712 de 2014, art. 19, literal d, ubica la investigación de delitos con prohibición legal en la información reservada por intereses públicos, no en la clasificada del art. 18. Error de norma.", "tipo": "norma"}, {"t": "Información pública reservada, por la investigación del delito y la prohibición legal", "j": "Es correcta. La Ley 1712 de 2014, art. 19, literal d, define como reservada la información cuyo acceso esté expresamente prohibido por norma legal y afecte la investigación y persecución de delitos mientras no se haga efectiva la medida de aseguramiento; la carpeta cumple ambas condiciones.", "tipo": null}, {"t": "Información pública sin excepción, porque la solicitud proviene de un periodista", "j": "Es incorrecta. Es plausible porque la información pública es la regla, pero deja de lado la prohibición legal y la etapa de la investigación, que según la Ley 1712 de 2014, art. 19, convierten la carpeta en reservada con independencia de quién pida. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M090", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#19", "fecha": "2026-10-26"}, {"fila": "M089", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 18", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#18", "fecha": "2026-10-26"}]}, {"id": "C-E01-012-1", "caso_id": "C-E01-012", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 65", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "La Facilitadora IV Liliana Correa, del grupo de correspondencia de una Dirección Seccional, recibe dos actos firmados el 9 de julio para distribuir. La Resolución 0081 fija nuevas reglas de turnos y horarios para todas las personas que acudan a los puntos de atención de la seccional. La Resolución 0082 niega a Construcciones Puerto Alto S.A.S. una solicitud de facilidad de pago radicada con el número 2026-ER-011907. El formato de distribución obliga a escoger, para cada acto, el canal por el que produce efectos frente a sus destinatarios.", "enunciado": "¿Cómo debe clasificar la facilitadora cada acto en el formato?", "opciones": [{"t": "El de turnos se remite para publicación en el Diario Oficial y el de la empresa se envía a notificación.", "j": "Es correcta. Ley 1437 de 2011, arts. 65 y 66: los actos de carácter general no son obligatorios mientras no se publiquen en el Diario Oficial o en las gacetas territoriales, y los de carácter particular deben notificarse. La Resolución 0081 es general y la 0082, particular.", "tipo": null}, {"t": "El de la empresa se envía a notificación y el de turnos rige desde su firma, sin otro trámite de difusión.", "j": "Es incorrecta. Es plausible porque acierta con el acto particular, pero el art. 65 de la Ley 1437 de 2011 dispone que los actos de carácter general no son obligatorios mientras no se publiquen. Omite la publicación. Error de completitud.", "tipo": "completitud"}, {"t": "Ambos se envían a notificación personal, porque los dos fueron firmados por la misma autoridad seccional.", "j": "Es incorrecta. Es plausible porque ambos salen de la misma dependencia, pero los arts. 65 y 66 de la Ley 1437 de 2011 distinguen por el carácter del acto: el general se publica y el particular se notifica. Clasifica por autor y no por destinatario. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M064", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 65", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#65", "fecha": "2026-10-26"}, {"fila": "M065", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 66", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#66", "fecha": "2026-10-26"}]}, {"id": "C-E07-001-1", "caso_id": "C-E07-001", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.5", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Andrés, Facilitador IV de la ventanilla de una Dirección Seccional, recibe el 3 de marzo de 2026 una petición escrita de la señora Lucía Pardo sobre la devolución de un saldo a favor. La radica con el número 2026-ER-004517 en el sistema de correspondencia y verifica que el asunto corresponde a la subserie Devoluciones y Compensaciones de la TRD del grupo. Un compañero le sugiere guardar la copia impresa en la carpeta de peticiones de ventanilla, porque el registro en el sistema ya deja constancia. El expediente de la peticionaria está abierto en el archivo de gestión.", "enunciado": "Para archivar correctamente el documento recibido, ¿qué debe hacer Andrés?", "opciones": [{"t": "Guardar el documento en la carpeta de ventanilla hasta su respuesta y luego llevarlo al expediente", "j": "Es incorrecta. Es plausible porque el documento termina en el expediente, pero aplaza la inclusión a una etapa posterior y mientras tanto lo deja fuera de la serie o subserie que fija la TRD, contra el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Error de fase.", "tipo": "fase"}, {"t": "Dejar la petición registrada en el sistema de correspondencia como constancia suficiente del trámite", "j": "Es incorrecta. Es plausible porque el radicado prueba la recepción, pero el registro en un sistema automatizado no reemplaza la inclusión en el expediente que exige el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Resuelve solo el registro y omite la conformación del expediente. Error de completitud.", "tipo": "completitud"}, {"t": "Incluir la petición en el expediente de la subserie que fija la TRD, aunque conste en el sistema", "j": "Es correcta. El parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 ordena que las peticiones presentadas por ciudadanos, sin importar que estén registradas en sistemas manuales o automatizados, se incluyan en el expediente de la serie o subserie según la TRD; aquí es la subserie Devoluciones y Compensaciones, con expediente abierto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M020", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E07-002-1", "caso_id": "C-E07-002", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.9", "integra": ["GESTION DOCUMENTAL"], "caso": "Paula, Facilitadora IV del archivo de gestión de un grupo de apoyo administrativo, revisa el expediente de una solicitud de facilidad de pago de la empresa Distribuidora El Roble S.A.S. El primer documento se radicó el 10 de febrero de 2023 y el último acto, que puso fin al trámite, se comunicó el 14 de agosto de 2025. La TRD asigna a la subserie dos años en archivo de gestión. Su coordinador le pide informar desde cuándo corre ese tiempo, pues el expediente todavía figura como abierto en el control de la dependencia.", "enunciado": "¿Qué debe informar Paula al coordinador sobre el cómputo del tiempo de retención?", "opciones": [{"t": "Que el tiempo se cuenta desde la fecha en que el expediente se entregue al archivo central", "j": "Es incorrecta. Es plausible porque la entrega al archivo central marca un cambio de fase, pero esa entrega ocurre después de cumplir el tiempo en gestión; el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 hace correr ese tiempo desde el cierre. Error de fase.", "tipo": "fase"}, {"t": "Que el expediente debe cerrarse porque el trámite finalizó y desde ese cierre corre el tiempo", "j": "Es correcta. El art. 4.3.1.9 del Acuerdo AGN 001 de 2024 dispone que el cierre se hace una vez finalizado el trámite que dio origen a la unidad documental y que desde el cierre empiezan a contar los tiempos de la TRD; el trámite terminó en agosto de 2025 y el expediente sigue abierto.", "tipo": null}, {"t": "Que el tiempo se cuenta desde la radicación del primer documento que dio origen al expediente", "j": "Es incorrecta. Es plausible porque el primer radicado abre el expediente, pero el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 fija el inicio del cómputo en el cierre de la unidad documental, no en su apertura. Toma una fecha base equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M030", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.9", "fecha": "2026-10-26"}]}, {"id": "C-E07-007-1", "caso_id": "C-E07-007", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.2", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Hernán, Facilitador IV del archivo de gestión de una Dirección Seccional, organiza cajas de la subserie Resoluciones de Gestión Tributaria, que documentan decisiones de la entidad frente a los contribuyentes. La TRD le asigna dos años en gestión, ocho en archivo central y, en disposición final, la sigla CT. Un auxiliar nuevo le pregunta si al terminar los diez años podrá tomarse una muestra y descartar el resto, como se hace con otra subserie marcada con la sigla S. Las cajas entrarán en el plan de transferencias de 2027.", "enunciado": "¿Qué debe explicar Hernán al auxiliar sobre el destino de esa subserie?", "opciones": [{"t": "Que la conservación total se decidirá cuando el comité revise las cajas en el archivo central", "j": "Es incorrecta. Es plausible porque las cajas pasarán luego al archivo central, pero la conservación total ya quedó establecida en el campo disposición final de la TRD, como dispone el art. 4.5.2 del Acuerdo AGN 001 de 2024; no se aplaza a una revisión posterior. Error de fase.", "tipo": "fase"}, {"t": "Que al cumplir los diez años el archivo central puede tomar una muestra y eliminar el resto", "j": "Es incorrecta. Es plausible porque la muestra existe para las subseries marcadas con S, pero confunde las categorías: el art. 4.5.2 del Acuerdo AGN 001 de 2024 asigna a la sigla CT la conservación total, que no admite muestreo ni descarte. Error de norma.", "tipo": "norma"}, {"t": "Que la sigla indica conservación total por el valor de los documentos como testimonio", "j": "Es correcta. El art. 4.5.2 del Acuerdo AGN 001 de 2024 establece que la conservación total se fija en el campo disposición final de la TRD con la sigla CT, teniendo en cuenta valores como evidencia y testimonio de las funciones y decisiones de las instituciones.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.2", "fecha": "2026-10-26"}]}, {"id": "C-E04-005-1", "caso_id": "C-E04-005", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.5", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Usted es Facilitador IV del grupo de correspondencia de una Dirección Seccional. El 2 de junio de 2026 se radicó con el número 2026-1190 un derecho de petición del señor Andrés Rueda y se distribuyó por el sistema a la División de Gestión de Fiscalización. El 5 de junio la planilla electrónica de control aún no muestra la constancia de recepción del servidor encargado del trámite. El término de respuesta ya está corriendo y el usuario llamó para preguntar por su solicitud. Usted debe actuar sobre el control de la distribución.", "enunciado": "¿Qué acción de control le corresponde a usted frente a esa comunicación?", "opciones": [{"t": "Esperar a que venza el término de respuesta de la petición y entonces activar la alerta de seguimiento.", "j": "Es incorrecta. Es plausible porque la alerta sirve para controlar el término, pero el Acuerdo AGN 001 de 2024, art. 4.2.5, prevé la alerta para el seguimiento de los tiempos, no para registrar que ya vencieron. Error de fase.", "tipo": "fase"}, {"t": "Constatar en la planilla la recepción del servidor competente y activar la alerta de respuesta.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.5, ordena disponer de planillas o formatos electrónicos que permitan constatar la recepción de los documentos por las personas competentes de su gestión y trámite, y de servicios de alerta para el seguimiento a los tiempos de respuesta.", "tipo": null}, {"t": "Proyectar y enviar usted la respuesta al peticionario para que el término no se venza.", "j": "Es incorrecta. Parece diligente frente al usuario, pero responder de fondo la petición corresponde a la dependencia competente; el Acuerdo AGN 001 de 2024, art. 4.2.5, asigna a correspondencia el control de la recepción y las alertas. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M019", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E02-010-1", "caso_id": "C-E02-010", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.3.1", "integra": ["OFIMATICA"], "caso": "Mónica Reyes, Facilitadora IV de la ventanilla de una Dirección Seccional, recibe el 21 de octubre en papel una solicitud de inscripción de Distribuidora Las Acacias S.A.S., con radicado 2026-3307. La empresa remite ese mismo día, por el canal electrónico, los anexos en formato digital: estados financieros y certificado de existencia. El papel se archiva en carpeta física y los anexos quedan en el repositorio electrónico del área. Un compañero propone imprimir los anexos y borrar la versión digital para tener todo en un solo lugar.", "enunciado": "¿Cómo debe Mónica conformar el expediente de la solicitud?", "opciones": [{"t": "Como una sola unidad híbrida, con cada parte en su soporte original y su vínculo archivístico.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.3.1, dispone que los documentos físicos y electrónicos de un mismo trámite, aunque separados por conservarse en sus formatos nativos, formen una sola unidad documental con vínculo archivístico apoyado en herramientas tecnológicas.", "tipo": null}, {"t": "Como dos expedientes independientes, uno físico y otro electrónico, según el soporte recibido.", "j": "Es incorrecta. Es plausible porque las partes se conservan en lugares distintos, pero el art. 4.3.3.1 del Acuerdo AGN 001 de 2024 exige que formen una sola unidad documental en razón al trámite. Error de granularidad: divide la unidad por soporte y no por trámite.", "tipo": "granularidad"}, {"t": "Como un expediente en papel, con los anexos impresos y la versión digital retirada del área.", "j": "Es incorrecta. Es plausible porque reúne todo en un solo soporte, pero el art. 4.3.3.1 del Acuerdo AGN 001 de 2024 manda conservar los documentos en sus formatos nativos; borrar los anexos electrónicos elimina los originales recibidos. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M032", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.3.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.3.1", "fecha": "2026-10-26"}]}, {"id": "C-E04-006-1", "caso_id": "C-E04-006", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. El 5 de febrero de 2026 inició un trámite de devolución de saldos a favor del contribuyente Logística Sabana S.A.S. Los documentos producidos hasta ahora están en una carpeta compartida de red. Un compañero propone subirlos al Sistema de Gestión de Documentos Electrónicos de Archivo cuando el trámite termine, previsto para diciembre. El Cuadro de Clasificación Documental del área tiene la serie Devoluciones y su subserie correspondiente. Usted debe organizar el expediente electrónico.", "enunciado": "¿Cómo debe proceder usted con el expediente electrónico de ese trámite?", "opciones": [{"t": "Conformarlo según el CCD y la TRD e incorporarlo al sistema desde el inicio del trámite.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar los expedientes electrónicos de acuerdo con el CCD y la TRD e incorporarlos al SGDEA desde el inicio de un trámite, actuación o procedimiento hasta su finalización o disposición final.", "tipo": null}, {"t": "Incorporarlo al sistema cuando termine el trámite, clasificado en la serie y subserie de la TRD.", "j": "Es incorrecta. Es plausible porque respeta la clasificación por serie y subserie, pero el Acuerdo AGN 001 de 2024, art. 4.3.2.1, exige incorporar el expediente desde el inicio del trámite y no al finalizarlo. Error de fase.", "tipo": "fase"}, {"t": "Incorporarlo al sistema desde ahora en la carpeta general del área, sin serie ni subserie.", "j": "Es incorrecta. Resulta plausible porque atiende la oportunidad de la incorporación, pero el Acuerdo AGN 001 de 2024, art. 4.3.2.1, pide conformar el expediente según el CCD y la TRD, es decir, en su serie y subserie. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}]}, {"id": "C-E06-006-1", "caso_id": "C-E06-006", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 17", "integra": ["GESTION DOCUMENTAL"], "caso": "Paula Gómez, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, controla las peticiones repartidas al área de devoluciones. La petición con radicado 009115 entró el 1 de agosto. El 8 de agosto, la funcionaria que la estudia le informa que falta un extracto bancario que el solicitante debe aportar para que el área decida de fondo, y que la actuación puede continuar si lo allega. Paula debe registrar en el sistema de control la gestión que sigue y los plazos asociados a esa gestión.", "enunciado": "¿Qué gestión y plazos debe registrar Paula para esta petición?", "opciones": [{"t": "Requerimiento al solicitante dentro de los diez días siguientes a la radicación, para completar en un mes.", "j": "Es correcta. El art. 17 de la Ley 1437 de 2011 ordena requerir al peticionario dentro de los diez días siguientes a la radicación, cuando la petición está incompleta, para que la complete en el término máximo de un mes.", "tipo": null}, {"t": "Archivo de la petición por incompleta y aviso al solicitante para que la presente de nuevo.", "j": "Es incorrecta. El archivo puede llegar si el peticionario no completa, pero el art. 17 de la Ley 1437 de 2011 exige primero el requerimiento; la opción salta a una etapa posterior. Error de fase.", "tipo": "fase"}, {"t": "Requerimiento al solicitante dentro de los quince días siguientes a la radicación, para completar en diez días.", "j": "Es incorrecta. Identifica bien el requerimiento, pero toma el término general de respuesta del art. 14 y un plazo de diez días; el art. 17 de la Ley 1437 de 2011 fija diez días para requerir y un mes para completar. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M053", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 17", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#17", "fecha": "2026-10-26"}]}, {"id": "C-E03-014-1", "caso_id": "C-E03-014", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 1", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Beatriz Ocampo, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Impuestos de Sabana Nueva, revisa el 17 de noviembre el boletín interno que se distribuye el 19 de noviembre para la semana de la cultura de la legalidad. El texto dice: «Colombia es un Estado social de derecho, organizado como república federal, con entidades territoriales sin autonomía». La jefe del grupo pidió a Beatriz contrastar la frase con el artículo constitucional citado e informarle el ajuste antes de la distribución, sin cambiar el resto del boletín.", "enunciado": "¿Qué ajuste debe informar Beatriz a la jefe del grupo?", "opciones": [{"t": "Cambiar federal por unitaria y conservar la mención de las entidades territoriales sin autonomía administrativa.", "j": "Es incorrecta. Corrige la forma de la república, pero deja intacto el error sobre las entidades territoriales; la Constitución Política, art. 1, las reconoce con autonomía. Error de completitud.", "tipo": "completitud"}, {"t": "Cambiar federal por unitaria y descentralizada, y reconocer la autonomía de las entidades territoriales.", "j": "Es correcta. La Constitución Política, art. 1, define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales; el ajuste corrige los dos errores de la frase antes de la distribución.", "tipo": null}, {"t": "Publicar el boletín en la fecha prevista y corregir la frase en una fe de erratas posterior.", "j": "Es incorrecta. Es plausible porque evita retrasar el boletín, pero la jefe pidió el ajuste antes de la distribución; la frase contradice la Constitución Política, art. 1, y circularía con el error. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M084", "norma": "Constitución Política de Colombia", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E04-011-1", "caso_id": "C-E04-011", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 8", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Usted es Facilitador IV del punto de atención de una Dirección Seccional. El 11 de mayo de 2026 la señora Patricia Gil solicita el original de la resolución que resolvió su recurso, expedida el 28 de abril con firma electrónica del funcionario competente. El sistema muestra que el documento no ha cambiado desde su firma y que puede verse en pantalla o descargarse. La usuaria insiste en que solo acepta una copia en papel con sello como original. Usted debe explicarle en qué condiciones el documento electrónico sirve como original.", "enunciado": "¿Qué debe explicar usted a la usuaria sobre el carácter de original de la resolución?", "opciones": [{"t": "Que el original es la copia impresa con sello y firma manuscrita que expida la entidad.", "j": "Es incorrecta. Resulta plausible por la costumbre del papel sellado, pero la Ley 527 de 1999, art. 8, da al mensaje de datos el valor de original cuando cumple sus condiciones; el criterio de la opción no es el que fija la norma aplicable. Error de norma.", "tipo": "norma"}, {"t": "Que sirve como original si hay garantía confiable de su integridad y puede mostrarse a la usuaria.", "j": "Es correcta. La Ley 527 de 1999, art. 8, establece que el requisito de original queda satisfecho con un mensaje de datos si existe garantía confiable de que se conservó la integridad desde su forma definitiva y si puede mostrarse a la persona a quien se deba presentar.", "tipo": null}, {"t": "Que el documento sirve como original porque puede mostrarse en pantalla y descargarse.", "j": "Es incorrecta. Es plausible porque el literal b de la Ley 527 de 1999, art. 8, exige que la información pueda mostrarse, pero el literal a pide además una garantía confiable de integridad desde su forma definitiva. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M094", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E07-008-1", "caso_id": "C-E07-008", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.3", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Natalia, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, apoya la disposición final de la subserie Constancias de Entrega, marcada con S en la TRD. Son 300 cajas de gran volumen cuyo contenido se repite en el sistema de información de la entidad. El procedimiento aprobado fija una muestra del 5 % con método aleatorio por año. El 9 de noviembre su jefe inmediato le pide escoger las cajas que le parezcan más interesantes y dejar el resto listo para eliminar esa misma semana.", "enunciado": "¿Cómo debe Natalia apoyar la escogencia de las cajas que se conservarán?", "opciones": [{"t": "Tomar las cajas que el jefe considere más representativas de la gestión del grupo", "j": "Es incorrecta. Es plausible porque el jefe orienta el trabajo de Natalia, pero la escogencia no depende de su apreciación: el art. 4.5.3 del Acuerdo AGN 001 de 2024 la sujeta a los tamaños de muestra y métodos de selección sustentados. Error de competencia.", "tipo": "competencia"}, {"t": "Tomar cajas de cada año hasta completar el 5 %, con el criterio que ella considere mejor", "j": "Es incorrecta. Es plausible porque respeta el tamaño de la muestra, pero omite el método aleatorio; el art. 4.5.3 del Acuerdo AGN 001 de 2024 exige que la selección se sustente en el tamaño de la muestra y también en el método de selección. Error de completitud.", "tipo": "completitud"}, {"t": "Tomar la muestra del 5 % con el método aleatorio que sustenta la selección", "j": "Es correcta. El art. 4.5.3 del Acuerdo AGN 001 de 2024 dispone que la selección, aplicable a subseries de gran volumen o de contenido repetido marcadas con S en la TRD, debe estar sustentada en los tamaños de las muestras y en los métodos de selección; aquí son 5 % y método aleatorio.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M037", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.3", "fecha": "2026-10-26"}]}, {"id": "C-E06-007-1", "caso_id": "C-E06-007", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 19", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Ricardo León, Facilitador IV de la ventanilla de una Dirección Seccional, clasifica la correspondencia del día. El escrito con radicado 010240, recibido el 2 de septiembre, es respetuoso y trae los datos completos del remitente, pero mezcla frases sueltas sobre un vecino, un pago y una oficina sin decir qué pide ni a quién. La profesional que revisa los ingresos confirma que no es posible entender la finalidad del escrito. Ricardo debe registrar en el sistema el tratamiento que sigue antes de cerrar la clasificación de la jornada.", "enunciado": "¿Qué tratamiento debe registrar Ricardo para el escrito?", "opciones": [{"t": "Reparto a una dependencia para que responda lo que alcance a entender.", "j": "Es incorrecta. Mantiene el escrito en trámite, pero ignora que el art. 19 de la Ley 1437 de 2011 ordena devolverlo para aclaración cuando no se comprende su objeto. Error de completitud.", "tipo": "completitud"}, {"t": "Archivo inmediato del escrito, porque no se comprende su finalidad ni su objeto.", "j": "Es incorrecta. El art. 19 de la Ley 1437 de 2011 prevé el archivo, pero solo después de que el interesado no corrija o aclare dentro de los diez días; la opción anticipa esa etapa. Error de fase.", "tipo": "fase"}, {"t": "Devolución al interesado para que lo aclare en diez días, so pena de archivo.", "j": "Es correcta. El art. 19 de la Ley 1437 de 2011 dispone que, cuando no se comprenda la finalidad u objeto de la petición, se devuelva al interesado para que la corrija o aclare dentro de los diez días siguientes; si no lo hace, se archiva.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M054", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E04-016-1", "caso_id": "C-E04-016", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. La subserie Informes de Gestión, producida en medio electrónico, cumplió el 30 de junio de 2026 su tiempo de retención en el archivo de gestión y debe transferirse al archivo central. Para liberar espacio en el servidor, que está cerca de su capacidad máxima, un compañero propone imprimir los informes, transferir las carpetas en papel y borrar los archivos electrónicos. La entidad tiene aprobado su Plan de Preservación Digital a largo plazo. Usted debe preparar la transferencia.", "enunciado": "¿Cómo debe preparar usted la transferencia de esos documentos electrónicos de archivo?", "opciones": [{"t": "Transferirlos en papel y conservar en el servidor solo los informes que considere más consultados.", "j": "Es incorrecta. Parece un equilibrio razonable, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, se aplica a todos los documentos electrónicos de archivo, y decidir cuáles conservar no corresponde al facilitador. Error de competencia.", "tipo": "competencia"}, {"t": "Transferirlos en papel y borrar los electrónicos, porque la retención en el archivo de gestión ya terminó.", "j": "Es incorrecta. Es plausible porque la retención en gestión sí terminó, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, exige que los documentos permanezcan almacenados electrónicamente durante todo su ciclo de vida, no solo en la etapa de gestión. Error de fase.", "tipo": "fase"}, {"t": "Transferirlos en medio electrónico, según los procesos archivísticos y el Plan de Preservación Digital.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, dispone que los documentos electrónicos de archivo se traten conforme a los principios y procesos archivísticos y permanezcan almacenados electrónicamente durante todo su ciclo de vida, de conformidad con el Plan de Preservación Digital a largo plazo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-012-1", "caso_id": "C-E03-012", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 2", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Gloria Peña, Facilitadora IV del punto de atención de la Dirección Seccional de Impuestos de Llano Grande, apoya el 10 de noviembre una campaña que explica a vendedores informales cómo inscribirse y facturar para entrar al comercio formal. El 12 de noviembre debe entregar al coordinador el informe de la jornada, con 64 personas atendidas y 21 inscripciones iniciadas. El formato del informe pide señalar el fin esencial del Estado al que sirve la campaña, según el artículo constitucional que la coordinación fijó como referencia para todas las jornadas.", "enunciado": "¿Qué fin esencial debe señalar Gloria en el informe?", "opciones": [{"t": "Facilitar la participación de todos en la vida económica de la Nación.", "j": "Es correcta. La Constitución Política, art. 2, señala como fin esencial facilitar la participación de todos en la vida económica, política, administrativa y cultural de la Nación; la campaña acerca a los vendedores informales a la vida económica formal.", "tipo": null}, {"t": "Asegurar la convivencia pacífica y la vigencia de un orden justo entre los comerciantes.", "j": "Es incorrecta. Es un fin del art. 2 de la Constitución Política y la campaña puede contribuir a él, pero la actividad descrita busca que los vendedores entren a la vida económica formal, que es otro fin del mismo artículo, más preciso para el informe. Error de granularidad.", "tipo": "granularidad"}, {"t": "Garantizar el recaudo oportuno de los tributos, como fin esencial que fija la Constitución.", "j": "Es incorrecta. Es plausible porque la DIAN recauda, pero el art. 2 de la Constitución Política no incluye el recaudo entre los fines esenciales del Estado; confunde una función de la entidad con un fin constitucional. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M080", "norma": "Constitución Política de Colombia", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#2", "fecha": "2026-10-26"}]}, {"id": "C-E02-007-1", "caso_id": "C-E02-007", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.2", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Al revisar el archivo de gestión del grupo de apoyo administrativo de una Dirección Seccional, el Facilitador IV Óscar Lemus encuentra tres carpetas de actas del Comité de Cartera producidas entre 2024 y 2025 por el Grupo de Cobranzas, que las prestó para una auditoría y no las reclamó. Su propio grupo guarda actas de comités internos con una denominación parecida. Para ahorrar espacio en el depósito, una compañera propone integrarlas a la serie Actas del grupo de apoyo administrativo, porque comparten tipo documental. Las carpetas no tienen rótulo de serie.", "enunciado": "¿Qué debe tener en cuenta Óscar para organizar esas carpetas?", "opciones": [{"t": "Que pertenecen al grupo que las custodia, porque quedaron en su archivo tras el préstamo.", "j": "Es incorrecta. Es plausible porque las carpetas están hoy bajo custodia del grupo de apoyo, pero la tenencia física no cambia la oficina productora que fija el art. 4.3.1.2 del Acuerdo AGN 001 de 2024. Error de competencia: atribuye los documentos a la dependencia equivocada.", "tipo": "competencia"}, {"t": "Que pertenecen a la serie Actas de su grupo, porque coinciden en el tipo documental.", "j": "Es incorrecta. Es plausible porque el tipo documental es el mismo, pero la procedencia se define por la unidad productora y no por la forma del documento (Acuerdo AGN 001 de 2024, art. 4.3.1.2). Error de granularidad: agrupa por un criterio equivocado.", "tipo": "granularidad"}, {"t": "Que pertenecen al Grupo de Cobranzas, que las produjo en desarrollo de sus funciones.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.2, exige respetar el principio de procedencia, que determina la oficina que produce los documentos en desarrollo de sus funciones, y la Ley 594 de 2000, art. 11, obliga a organizar los archivos con ese principio.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.2", "fecha": "2026-10-26"}, {"fila": "M002", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-26"}]}, {"id": "C-E04-001-1", "caso_id": "C-E04-001", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 6", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Usted es Facilitador IV en la ventanilla de una Dirección Seccional. El 3 de marzo de 2026 la ciudadana Laura Méndez remite por el buzón electrónico habilitado una solicitud de copia de un oficio, con un archivo adjunto que se abre sin dificultad y puede consultarse en el sistema de radicación. El instructivo del área indica que esa clase de solicitud debe constar por escrito. Un compañero propone devolver el mensaje y pedirle que lo presente impreso en la ventanilla física. Usted debe informar a la ciudadana y al compañero cómo se cumple el requisito en este caso.", "enunciado": "¿Qué debe informar usted sobre el cumplimiento del requisito de que la solicitud conste por escrito?", "opciones": [{"t": "La solicitud llegó como mensaje de datos y debe presentarse impresa y firmada antes de radicarla.", "j": "Es incorrecta. Es plausible porque muchos instructivos se redactaron pensando en el papel, pero la Ley 527 de 1999, art. 6, da por cumplido el requisito de escrito con el mensaje de datos accesible; exigir la impresión previa ubica el trámite en una etapa que la norma no pide. Error de fase.", "tipo": "fase"}, {"t": "El requisito queda cumplido con el mensaje de datos, porque su contenido es accesible para consulta.", "j": "Es correcta. La Ley 527 de 1999, art. 6, dispone que cuando una norma exija que la información conste por escrito, el requisito queda satisfecho con un mensaje de datos si la información es accesible para su posterior consulta, como ocurre con el adjunto que se abre en el sistema.", "tipo": null}, {"t": "Corresponde al facilitador declarar no presentada la solicitud por haber llegado sin soporte en papel.", "j": "Es incorrecta. Resulta plausible porque el facilitador recibe y revisa la solicitud, pero declarar no presentada una petición es una decisión de fondo que no le corresponde al nivel asistencial y, además, la Ley 527 de 1999, art. 6, reconoce el mensaje de datos como escrito. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M093", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E05-007-1", "caso_id": "C-E05-007", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 13", "integra": ["GESTION DOCUMENTAL"], "caso": "Ricardo Mesa, Facilitador IV de la ventanilla de correspondencia de una Dirección Seccional, recibe el 14 de mayo el radicado 2026-1132 de la empresa ficticia Logística Andina Ltda. En el escrito, la empresa pide examinar el expediente de su solicitud de certificación y obtener copia de dos oficios que reposan en él. El formulario del sistema exige seleccionar la modalidad de la actuación antes de enviarla a la dependencia que custodia el expediente, la División de Gestión de Asistencia al Cliente. El escrito no expresa inconformidad alguna.", "enunciado": "¿Qué modalidad debe registrar Ricardo en el formulario para esa actuación?", "opciones": [{"t": "Examinar y requerir copias de documentos, porque pide ver el expediente y dos copias", "j": "Es correcta. La Ley 1437 de 2011, art. 13 (modificado por la Ley 1755 de 2015), incluye entre las actuaciones del derecho de petición la de examinar y requerir copias de documentos, que coincide con lo que pide la empresa.", "tipo": null}, {"t": "Solicitud de copias, sin registrar el examen del expediente que la acompaña", "j": "Es incorrecta. Es plausible porque las copias sí se piden, pero el art. 13 de la Ley 1437 de 2011 agrupa examinar y requerir copias de documentos en una misma modalidad y el escrito pide las dos cosas; registrar solo las copias deja por fuera el examen. Error de completitud.", "tipo": "completitud"}, {"t": "Consulta, porque la empresa formula una pregunta a la entidad sobre su expediente", "j": "Es incorrecta. Es plausible porque la consulta también es modalidad del derecho de petición, pero la Ley 1437 de 2011, art. 13, la distingue de examinar y requerir copias de documentos, que es lo pedido. Ubica la actuación en una categoría vecina. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M049", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 13", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#13", "fecha": "2026-10-26"}]}, {"id": "C-E05-011-1", "caso_id": "C-E05-011", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 43", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "La Facilitadora IV Gloria Benítez organiza la correspondencia de salida de la División de Gestión de Liquidación de una Dirección Seccional. Debe marcar en el sistema los actos definitivos del expediente del contribuyente ficticio Raúl Peña. Encuentra un auto del 5 de febrero que ordena una inspección, un oficio del 19 de febrero que so
