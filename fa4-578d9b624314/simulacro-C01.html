licita información a un tercero y una liquidación oficial del 30 de abril que determina el impuesto a cargo. Solo los actos definitivos activan en el sistema la alerta de notificación prioritaria.", "enunciado": "¿Qué documento del expediente debe marcar Gloria como acto definitivo?", "opciones": [{"t": "El auto que ordena la inspección, porque es el primero que impulsa la actuación", "j": "Es incorrecta. Es plausible porque el auto pone en marcha una diligencia, pero impulsar la actuación no es decidir el fondo ni impedir que continúe (Ley 1437 de 2011, art. 43); es un acto de una etapa previa. Error de fase.", "tipo": "fase"}, {"t": "El oficio dirigido al tercero, porque contiene una orden escrita de la autoridad", "j": "Es incorrecta. Es plausible porque el oficio expresa una solicitud formal, pero el criterio del art. 43 de la Ley 1437 de 2011 no es la forma escrita, sino que el acto decida el fondo o haga imposible continuar. Error de granularidad.", "tipo": "granularidad"}, {"t": "La liquidación oficial, porque decide el fondo al determinar el impuesto a cargo", "j": "Es correcta. La Ley 1437 de 2011, art. 43, define como actos definitivos los que deciden directa o indirectamente el fondo del asunto o hacen imposible continuar la actuación; la liquidación oficial resuelve el fondo al determinar el impuesto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}]}], "likert": [{"clave": "C", "nombre": "Competencias comportamentales", "caracter": "Clasificatoria", "items": [{"ind": "Orientación al usuario y al ciudadano nivel 1", "t": "Propongo mejoras a un formato cuando veo que los usuarios cometen el mismo error al diligenciarlo.", "inv": false}, {"ind": "Adaptabilidad nivel 1", "t": "Reorganizo mis prioridades del día cuando llega una instrucción urgente que desplaza lo que tenía planeado.", "inv": false}, {"ind": "Comportamiento ético nivel 4", "t": "Cuestiono ante el nivel directivo una práctica del área que considero irregular aunque sea habitual.", "inv": false}, {"ind": "Comunicación efectiva nivel 2", "t": "Confirmo con el destinatario que entendió la instrucción antes de cerrar una comunicación interna.", "inv": false}, {"ind": "Control", "t": "Siempre he cumplido todos mis compromisos laborales sin excepción.", "inv": false, "control": true}, {"ind": "Orientación al logro nivel 3", "t": "Mido cuánto tiempo me toma radicar y busco formas de reducirlo sin saltar pasos del procedimiento.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 2", "t": "Hago seguimiento a una petición que remití para confirmar que llegó a la dependencia competente.", "inv": false}, {"ind": "Comportamiento ético nivel 1", "t": "Comento con personas cercanas datos de un caso cuando no revelo el nombre del contribuyente.", "inv": true}, {"ind": "Comunicación efectiva nivel 2", "t": "Escribo los oficios de remisión con los datos completos para que la dependencia no tenga que preguntar.", "inv": false}, {"ind": "Control", "t": "Jamás he usado el teléfono para asuntos personales en el trabajo.", "inv": false, "control": true}, {"ind": "Comportamiento ético nivel 1", "t": "Registro en el expediente un error mío aunque nadie más lo haya notado.", "inv": false}, {"ind": "Orientación al logro nivel 3", "t": "Organizo mis tareas de archivo para cumplir el plan de transferencias aunque surjan solicitudes urgentes.", "inv": false}, {"ind": "Comunicación efectiva nivel 1", "t": "Escucho completo el planteamiento de un ciudadano antes de responder aunque haya fila de espera.", "inv": false}, {"ind": "Comportamiento ético nivel 1", "t": "Rechazo atenciones de un contribuyente aunque se presenten como un gesto de cortesía sin importancia.", "inv": false}, {"ind": "Control", "t": "Nunca me he equivocado al interpretar una instrucción.", "inv": false, "control": true}, {"ind": "Adaptabilidad nivel 1", "t": "Acepto tareas de un área distinta a la mía cuando la carga de trabajo cambia de un día para otro.", "inv": false}, {"ind": "Trabajo en equipo nivel 1", "t": "Comparto con el grupo una herramienta que me ahorra tiempo aunque me haya costado construirla.", "inv": false}, {"ind": "Orientación al logro nivel 3", "t": "Si cumplo el mínimo que me piden, no veo necesario mejorar la forma en que hago mi trabajo.", "inv": true}, {"ind": "Comportamiento ético nivel 4", "t": "Propongo controles para un riesgo de corrupción que detecto aunque no sea parte de mis funciones.", "inv": false}, {"ind": "Control", "t": "Nunca he sentido molestia con un compañero de trabajo.", "inv": false, "control": true}, {"ind": "Comunicación efectiva nivel 2", "t": "Doy por entendida una instrucción del jefe aunque me queden dudas, para no interrumpirlo.", "inv": true}, {"ind": "Trabajo en equipo nivel 1", "t": "Informo al equipo los avances de mis tareas compartidas sin esperar a que me pregunten.", "inv": false}, {"ind": "Trabajo en equipo nivel 1", "t": "Acepto la decisión del grupo aunque yo hubiera preferido otra alternativa.", "inv": false}, {"ind": "Adaptabilidad nivel 1", "t": "Prefiero seguir el procedimiento que conozco cuando me piden aplicar uno nuevo con plazos cortos.", "inv": true}, {"ind": "Control", "t": "Nunca he sentido cansancio al final de una jornada.", "inv": false, "control": true}, {"ind": "Comunicación efectiva nivel 2", "t": "Cuando un compañero me explica un cambio de procedimiento, pregunto lo que no quedó claro aunque la fila de atención esté larga.", "inv": false}, {"ind": "Adaptabilidad nivel 1", "t": "Ajusto mi forma de trabajar cuando cambia un procedimiento, aunque el anterior me resultara más cómodo.", "inv": false}, {"ind": "Trabajo en equipo nivel 1", "t": "Prefiero terminar mis radicaciones antes que ayudar a un compañero atrasado con la distribución del día.", "inv": true}, {"ind": "Comportamiento ético nivel 1", "t": "Aplico el mismo criterio a contribuyentes conocidos y desconocidos aunque me pidan un trato especial.", "inv": false}, {"ind": "Control", "t": "En toda mi vida laboral nunca he llegado tarde.", "inv": false, "control": true}, {"ind": "Orientación al logro nivel 3", "t": "Reviso mis registros del día para detectar errores antes de que lleguen a otra dependencia.", "inv": false}, {"ind": "Comportamiento ético nivel 4", "t": "Promuevo en mi equipo la revisión de decisiones que pueden afectar la transparencia aunque eso alargue los procesos.", "inv": false}, {"ind": "Comunicación efectiva nivel 2", "t": "Ajusto el lenguaje de una respuesta cuando el ciudadano no conoce los términos del trámite.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 2", "t": "Atiendo con la misma disposición al último ciudadano de la jornada que al primero.", "inv": false}, {"ind": "Control", "t": "Siempre mantengo la calma, sin importar la situación.", "inv": false, "control": true}, {"ind": "Adaptabilidad nivel 1", "t": "Aprendo a usar un nuevo aplicativo de la entidad aunque deba dedicarle tiempo después de mi jornada.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 2", "t": "Informo al ciudadano el estado real de su trámite aunque la noticia no sea la que espera.", "inv": false}, {"ind": "Comportamiento ético nivel 1", "t": "Informo a mi jefe un conflicto de interés en un expediente aunque eso retrase la actuación.", "inv": false}, {"ind": "Orientación al logro nivel 3", "t": "Propongo ajustes al control de correspondencia cuando detecto que se repiten retrasos en la distribución.", "inv": false}, {"ind": "Control", "t": "Jamás he dejado una tarea para después.", "inv": false, "control": true}, {"ind": "Comunicación efectiva nivel 1", "t": "Explico a un contribuyente el motivo de un requerimiento con palabras sencillas aunque la atención tome más tiempo.", "inv": false}, {"ind": "Comunicación efectiva nivel 1", "t": "Respondo los correos con el const M = BANCO.meta;

};
const PARTE = { F:"Competencias funcionales" };
SECC.forEach(s => { PARTE[s.clave] = s.nombre; });

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

let cfg = { modo: SECC.length ? "completo" : "funcionales", eje: EJES[0] };
let S = store.get(KEY_STATE, null);

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function trunc2(x){ return (Math.floor(x * 100) / 100).toFixed(2).replace(".", ","); }
function fmtTime(ms){
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtMin(m){ const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h ${String(r).padStart(2,"0")} min` : `${r} min`; }

function construir(c){
  let items = [];
  if (c.modo === "practica") {
    BANCO.pjs.forEach((it, i) => { if (it.eje === c.eje) items.push({ p:"F", i }); });
  } else {
    items = BANCO.pjs.map((_, i) => ({ p:"F", i }));
    if (c.modo === "completo") SECC.forEach(s => s.items.forEach((_, i) => items.push({ p:s.clave, i })));
  }
  const limite = c.modo === "completo" ? M.tiempo_min.completo : c.modo === "funcionales" ? M.tiempo_min.funcionales : 0;
  return { cfg:{...c}, items, resp:{}, dud:{}, idx:0, inicio:Date.now(), limiteMin:limite, fin:null };
}

function itemDe(ref){
  if (ref.p === "F") return BANCO.pjs[ref.i];
  return SECC.find(s => s.clave === ref.p).items[ref.i];
}

function guardar(){ store.set(KEY_STATE, S); }

      : [["Práctica: " + cfg.eje, String(nPrac), "PJS con retroalimentación inmediata", "Sin tiempo"]];

  ${enCurso ? `<div class="sheet panel" style="margin-bottom:20px">

        <div class="row"><button class="btn primary" id="seguir">Continuar intento</button><button class="btn" id="descartar">Descartar</button></div>

      </div>
      <div class="row" ${cfg.modo === "practica" ? "" : "hidden"}>
        <label for="eje" class="muted">Eje</label>
        <select id="eje">${EJES.map(e => `<option ${e === cfg.eje ? "selected" : ""}>${esc(e)}</option>`).join("")}</select>
      </div>
      <div class="tablewrap"><table class="compo">
        <thead><tr><th>Prueba</th><th class="num">Ítems</th><th>Formato</th><th>Carácter</th></tr></thead>
        <tbody>${comp.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}
        <tr><td><b>Total</b></td><td class="num"><b>${total}</b></td><td colspan="2" class="muted">Tiempo: ${tiempo}</td></tr></tbody>
      </table></div>
      <div class="row"><button class="btn primary" id="empezar">Empezar</button></div>
      <p class="note">${esc(M.aviso)}</p>

    <section class="sheet panel" aria-labelledby="t-ejes">

          <li>Prueba cada opción contra cinco filtros: fase, nivel de detalle, completitud, norma y competencia.</li>

        </ol>
      </details>
      ${hist.length ? `<details open><summary>Intentos anteriores</summary>
        <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Modo</th><th class="num">Funcionales</th><th class="num">Escala</th></tr></thead>
        <tbody>${hist.slice(-8).reverse().map(h => `<tr><td class="mono">${esc(h.fecha)}</td><td>${esc(h.modo)}</td><td class="num">${h.ac}/${h.n}</td><td class="num">${esc(h.esc)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    </section>
  </div>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;
  app.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { cfg.modo = b.dataset.modo; vistaInicio(); });
  const ej = document.getElementById("eje"); if (ej) ej.onchange = e => { cfg.eje = e.target.value; vistaInicio(); };
  document.getElementById("empezar").onclick = () => { S = construir(cfg); guardar(); vistaPrueba(); };
  if (enCurso) {
    document.getElementById("seguir").onclick = vistaPrueba;
    document.getElementById("descartar").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };
  }

function opcionModo(v, t, d){
  return `<button class="opt-card" data-modo="${v}" aria-pressed="${cfg.modo === v}"><span class="dot"></span><span><b>${t}</b><span>${d}</span></span></button>`;
}
function nombreModo(c){
  return c.modo === "completo" ? "Simulacro completo" : c.modo === "funcionales" ? "Solo funcionales" : `Práctica: ${c.eje}`;
}

/* ------------------------------ PRUEBA ------------------------------ */
function restante(){ return S.limiteMin ? S.limiteMin * 60000 - (Date.now() - S.inicio) : null; }
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function tick(){
  const el = document.getElementById("clock");
  const r = restante();
  if (r === null || !el) return;
  el.textContent = fmtTime(r);
  el.classList.toggle("low", r < 15 * 60000);
  if (r <= 0) entregar();
}

function vistaPrueba(){
  confirmando = false;
  stopTimer();
  render();
  if (S.limiteMin) timer = setInterval(tick, 1000);
}

function render(){
  const ref = S.items[S.idx];
  const it = itemDe(ref);
  const n = S.items.length;
  const resp = S.resp[S.idx];
  const practica = S.cfg.modo === "practica";
  const respondidas = Object.keys(S.resp).length;
  const r = restante();
  const revelar = practica && resp !== undefined && ref.p === "F";

  let cuerpo;
  if (ref.p === "F") {
    const sub = it.caso_n > 1 ? ` <span class="sub-caso">· caso compartido, pregunta ${it.caso_pos} de ${it.caso_n}</span>` : "";
    cuerpo = `
      <div><div class="block-label">Caso${sub}</div><p class="caso">${esc(it.caso)}</p></div>
      <div><div class="block-label">Enunciado</div><p class="enun">${esc(it.enunciado)}</p></div>
      <div class="opts" role="group" aria-label="Opciones de respuesta">
        ${it.opciones.map((o, k) => {
          let cls = "op";
          if (revelar && k === it.clave) cls += " is-key";
          if (revelar && k === resp && k !== it.clave) cls += " is-wrong";
          return `<button class="${cls}" data-k="${k}" aria-pressed="${resp === k}" ${revelar ? "disabled" : ""}><span class="bub">${LETRAS[k]}</span><span>${esc(o.t)}</span></button>`;
        }).join("")}
      </div>
      ${revelar ? `<div class="feedback">
        <div class="row"><span class="chip ${resp === it.clave ? "ok" : "bad"}">${resp === it.clave ? "Correcta" : "Incorrecta"}</span><span class="tag">${esc(it.bloom)}</span><span class="tag">${esc(it.fuente)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
        ${justificaciones(it)}
      </div>` : ""}`;
  } else {
    cuerpo = `
      <div><div class="block-label">Afirmación</div><p class="enun">${esc(it.t)}</p></div>
      <div class="opts" role="group" aria-label="Escala de acuerdo">
        ${LIKERT.map((l, k) => `<button class="op" data-k="${k}" aria-pressed="${resp === k}"><span class="bub">${LETRAS[k]}</span><span>${l}</span></button>`).join("")}
      </div>`;
  }

  app.innerHTML = `
  <div class="bar">
    <div class="row">
      <div><span class="eyebrow">${esc(nombreModo(S.cfg))}</span><div class="mono">${respondidas}/${n} respondidas</div></div>
      <div class="row">
        ${r !== null ? `<span class="clock" id="clock" aria-label="Tiempo restante">${fmtTime(r)}</span>` : ""}
        <button class="btn" id="salir">Pausar</button>
        <button class="btn ink" id="entregar">Entregar</button>
      </div>
    </div>
    <div class="progress"><i style="width:${(respondidas / n * 100).toFixed(1)}%"></i></div>
  </div>
  ${confirmando ? `<div class="confirm" style="margin-bottom:16px">
      <p><b>¿Entregar el cuadernillo?</b> Tienes ${n - respondidas} preguntas sin responder${Object.values(S.dud).filter(Boolean).length ? ` y ${Object.values(S.dud).filter(Boolean).length} marcadas como dudosas` : ""}. Una omisión en funcionales cuenta como no acierto.</p>
      <div class="row"><button class="btn primary" id="si">Entregar ahora</button><button class="btn" id="no">Seguir respondiendo</button></div>
    </div>` : ""}
  <div class="exam">
    <article class="sheet item">
      <div class="head">
        <span class="qnum">Pregunta ${S.idx + 1} de ${n}</span>
        <span class="eyebrow">${esc(PARTE[ref.p])}${practica ? " · " + esc(it.eje) : ""}</span>
      </div>
      ${cuerpo}
      <div class="nav">
        <button class="btn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn flag" id="flag" aria-pressed="${!!S.dud[S.idx]}">${S.dud[S.idx] ? "Marcada como dudosa" : "Marcar como dudosa"}</button>
        <button class="btn primary" id="next">${S.idx === n - 1 ? "Revisar y entregar" : "Siguiente"}</button>
      </div>
    </article>
    <aside class="sheet omr" aria-label="Hoja de respuestas">
      ${Object.keys(PARTE).filter(p => S.items.some(x => x.p === p)).map(p => `
        <div><h3>${esc(PARTE[p])}</h3><div class="grid">
          ${S.items.map((x, k) => x.p !== p ? "" : `<button class="cell${S.resp[k] !== undefined ? " done" : ""}${S.dud[k] ? " flagged" : ""}${k === S.idx ? " current" : ""}" data-go="${k}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join("")}
        </div></div>`).join("")}
      <div class="legend"><span><i class="d"></i>Respondida</span><span><i></i>Pendiente</span><span><i class="f"></i>Dudosa</span></div>
    </aside>
  </div>`;

  app.querySelectorAll(".op[data-k]").forEach(b => b.onclick = () => {
    S.resp[S.idx] = Number(b.dataset.k); guardar(); render();
  });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.idx = Number(b.dataset.go); guardar(); render(); });
  document.getElementById("prev").onclick = () => { if (S.idx > 0) { S.idx--; guardar(); render(); } };
  document.getElementById("next").onclick = () => {
    if (S.idx < n - 1) { S.idx++; guardar(); render(); window.scrollTo({ top:0 }); }
    else { confirmando = true; render(); window.scrollTo({ top:0 }); }
  };
  document.getElementById("flag").onclick = () => { S.dud[S.idx] = !S.dud[S.idx]; guardar(); render(); };
  document.getElementById("salir").onclick = () => { guardar(); vistaInicio(); };
  document.getElementById("entregar").onclick = () => { confirmando = true; render(); window.scrollTo({ top:0 }); };
  const si = document.getElementById("si"); if (si) si.onclick = entregar;
  const no = document.getElementById("no"); if (no) no.onclick = () => { confirmando = false; render(); };
}

function justificaciones(it){
  const sop = (it.soporte || []).map(s => `<p class="muted" style="font-size:.82rem">Soporte: ${esc(s.norma)}, ${esc(s.articulo)} · verificado el ${esc(s.fecha)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">fuente oficial</a></p>`).join("");
  return it.opciones.map((o, k) => `<div class="just"><span class="l">${LETRAS[k]}</span><span>${esc(o.j)}${o.tipo ? ` <span class="tag">${esc(TIPO_TXT[o.tipo])}</span>` : ""}</span></div>`).join("") + sop;
}

function entregar(){
  stopTimer();
  if (!S.fin) {
    S.fin = Date.now();
    const r = calcular();
    const hist = store.get(KEY_HIST, []);
    const d = new Date(S.fin);
    hist.push({ fecha: d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit" }),
      modo: nombreModo(S.cfg), ac: r.ac, n: r.nF, esc: trunc2(r.escala) });
    store.set(KEY_HIST, hist.slice(-30));
    guardar();
  }
  vistaResultados();
}

/* ------------------------------ RESULTADOS ------------------------------ */
function calcular(){
  let ac = 0, nF = 0;
  const porEje = {}, porBloom = {}, porTipo = {};
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); nF++;
    const r = S.resp[k];
    porEje[it.eje] = porEje[it.eje] || { ac:0, n:0 };
    porBloom[it.bloom] = porBloom[it.bloom] || { ac:0, n:0 };
    porEje[it.eje].n++; porBloom[it.bloom].n++;
    if (r === it.clave) { ac++; porEje[it.eje].ac++; porBloom[it.bloom].ac++; }
    else {
      const tipo = r === undefined ? "omision" : it.opciones[r].tipo;
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
    }
  });
  const escala = nF ? ac / nF * 100 : 0;
  const ind = {}; let ctrlAcuerdo = 0, ctrlN = 0, extremos = 0, nL = 0;
  S.items.forEach((ref, k) => {
    if (ref.p === "F") return;
    const it = itemDe(ref); const r = S.resp[k];
    if (r === undefined) return;
    if (it.control) { ctrlN++; if (r >= 2) ctrlAcuerdo++; return; }
    nL++;
    if (r === 3 || (it.inv && r === 0)) extremos++;
    const v = it.inv ? 4 - r : r + 1;
    const key = PARTE[ref.p] + " · " + it.ind;
    ind[key] = ind[key] || { s:0, n:0 };
    ind[key].s += v; ind[key].n++;
  });
  return { ac, nF, escala, porEje, porBloom, porTipo, ind, ctrlAcuerdo, ctrlN, extremos, nL };
}

function vistaResultados(){
  stopTimer();
  const R = calcular();
  const pasa = R.escala >= M.minimo;
  const dur = S.fin ? fmtTime(S.fin - S.inicio) : "";
  const hayLikert = S.items.some(x => x.p !== "F");
  const fav = R.nL ? R.extremos / R.nL : 0;
  const ctrlRate = R.ctrlN ? R.ctrlAcuerdo / R.ctrlN : 0;
  const alerta = ctrlRate >= .5 || fav >= .7;
  const tiposOrden = Object.entries(R.porTipo).sort((a, b) => b[1] - a[1]);
  const minTxt = trunc2(M.minimo);

  app.innerHTML = `
  <header class="masthead">
    <span class="eyebrow">Resultado · ${esc(nombreModo(S.cfg))} · ${esc(M.codigo)}</span>
    <h1>${pasa ? "Superas" : "No alcanzas"} el mínimo de ${minTxt} en funcionales</h1>
    <div class="meta"><span>Tiempo usado ${dur}</span><span>${Object.keys(S.resp).length}/${S.items.length} respondidas</span></div>
  </header>
  <div class="score">
    <div class="sheet kpi"><span class="eyebrow">Aciertos funcionales</span><span class="v">${R.ac}/${R.nF}</span><span class="muted">${R.nF - R.ac} errores u omisiones</span></div>
    <div class="sheet kpi"><span class="eyebrow">Escala 0 a 100</span><span class="v">${trunc2(R.escala)}</span><span><span class="chip ${pasa ? "ok" : "bad"}">${pasa ? "Supera " + minTxt : "Por debajo de " + minTxt}</span></span></div>
    <div class="sheet kpi"><span class="eyebrow">Aciertos para ${minTxt}</span><span class="v">${Math.ceil(R.nF * M.minimo / 100)}</span><span class="muted">Si la escala fuera porcentual</span></div>
  </div>
  <p class="note" style="margin-bottom:16px">La escala es lineal (aciertos / ítems × 100) y truncada a dos decimales. La fórmula oficial se aplica después del análisis psicométrico de los ítems y puede diferir.</p>
  <div class="res-grid">
    <section class="sheet"><h2>Aciertos por eje</h2>
      <div class="tablewrap"><table><thead><tr><th>Eje</th><th class="num">Aciertos</th><th></th></tr></thead><tbody>
      ${Object.entries(R.porEje).sort((a, b) => a[1].ac / a[1].n - b[1].ac / b[1].n).map(([e, v]) => {
        const p = v.ac / v.n; return `<tr><td>${esc(e)}</td><td class="num">${v.ac}/${v.n}</td><td style="width:90px"><div class="meter"><i class="${p >= .7 ? "ok" : p >= .5 ? "warn" : "bad"}" style="width:${p * 100}%"></i></div></td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="muted" style="font-size:.85rem">Ordenado de menor a mayor acierto. Repasa primero los ejes de arriba en modo práctica.</p>
    </section>
    <section class="sheet"><h2>Por qué fallaste</h2>
      ${tiposOrden.length ? `<div class="tablewrap"><table><thead><tr><th>Tipo de distractor elegido</th><th class="num">Veces</th></tr></thead><tbody>
      ${tiposOrden.map(([t, c]) => `<tr><td>${t === "omision" ? "Sin responder" : esc(TIPO_TXT[t])}</td><td class="num">${c}</td></tr>`).join("")}</tbody></table></div>` : `<p>Sin errores en funcionales.</p>`}
      <h3>Por nivel cognitivo</h3>
      <div class="tablewrap"><table><thead><tr><th>Bloom revisada</th><th class="num">Aciertos</th></tr></thead><tbody>
      ${["Recordar","Comprender","Aplicar","Analizar","Evaluar","Crear"].filter(b => R.porBloom[b]).map(b => `<tr><td>${b}</td><td class="num">${R.porBloom[b].ac}/${R.porBloom[b].n}</td></tr>`).join("")}</tbody></table></div>
    </section>
  </div>
  ${hayLikert ? `<section class="sheet" style="padding:14px;display:grid;gap:10px;margin-bottom:16px">
    <div class="row" style="justify-content:space-between"><h2>Perfil de autoinforme</h2><span class="chip ${alerta ? "warn" : "ok"}">${alerta ? "Patrón muy favorable" : "Patrón sin alertas"}</span></div>
    <p class="muted" style="font-size:.88rem">Estas pruebas no tienen respuestas correctas. El perfil es una lectura de entrenamiento: promedio de 1 a 4 por indicador, con las afirmaciones invertidas recodificadas. Acuerdo con afirmaciones de control: ${R.ctrlAcuerdo} de ${R.ctrlN}. Respuestas extremas favorables: ${Math.round(fav * 100)} %. ${alerta ? "Un patrón así es el que las subescalas de control de la prueba real buscan detectar." : ""}</p>
    <div class="tablewrap"><table><thead><tr><th>Indicador</th><th class="num">Promedio</th><th></th></tr></thead><tbody>
    ${Object.entries(R.ind).map(([k, v]) => { const m = v.s / v.n; return `<tr><td>${esc(k)}</td><td class="num">${m.toFixed(2).replace(".", ",")}</td><td style="width:110px"><div class="meter"><i style="width:${(m - 1) / 3 * 100}%"></i></div></td></tr>`; }).join("")}
    </tbody></table></div>
  </section>` : ""}
  <section aria-labelledby="t-rev">
    <div class="row" style="justify-content:space-between"><h2 id="t-rev">Revisión de funcionales</h2>
      <div class="row"><button class="btn" id="inicio">Volver al inicio</button></div></div>
    <div class="filters" role="group" aria-label="Filtro">
      ${[["todos","Todas"],["errores","Solo errores"],["dudosas","Solo dudosas"]].map(([v, l]) => `<button class="btn" data-f="${v}" aria-pressed="${filtro === v}">${l}</button>`).join("")}
    </div>
    <div class="review">${revision()}</div>
  </section>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; vistaResultados(); });
  document.getElementById("inicio").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };
  window.scrollTo({ top:0 });
}

function revision(){
  const out = [];
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); const r = S.resp[k]; const ok = r === it.clave;
    if (filtro === "errores" && ok) return;
    if (filtro === "dudosas" && !S.dud[k]) return;
    out.push(`<article class="sheet rv">
      <div class="head"><span class="qnum">Pregunta ${k + 1}</span>
        <span class="tag ${ok ? "ok" : "bad"}">${ok ? "Acierto" : r === undefined ? "Omitida" : "Error"}</span>
        ${S.dud[k] ? `<span class="tag warn">Dudosa</span>` : ""}
        <span class="tag">${esc(it.eje)}</span><span class="tag">${esc(it.bloom)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
      <p class="caso">${esc(it.caso)}</p>
      <p class="enun">${esc(it.enunciado)}</p>
      <div class="opts">${it.opciones.map((o, j) => `<div class="op${j === it.clave ? " is-key" : ""}${j === r && !ok ? " is-wrong" : ""}" aria-pressed="${j === r}"><span class="bub">${LETRAS[j]}</span><span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="feedback">
        ${justificaciones(it)}
        <p class="muted" style="font-size:.82rem">Fuente: ${esc(it.fuente)}</p>
      </div>
    </article>`);
  });
  return out.length ? out.join("") : `<p class="muted">No hay preguntas con este filtro.</p>`;
}

/* ------------------------------ ARRANQUE ------------------------------ */
if (S && S.fin) vistaResultados();
else vistaInicio();
</script>
</body>
</html>
