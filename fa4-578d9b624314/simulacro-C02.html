tar la copia, porque no tienen carácter reservado.", "j": "Es correcta. La Ley 594 de 2000, art. 27, reconoce a todas las personas el derecho a consultar los documentos de archivos públicos y a obtener copia, siempre que no sean reservados, y la Ley 1712 de 2014, art. 16, pide que los archivos promuevan el acceso a la información pública.", "tipo": null}, {"t": "Permitir la consulta de las actas y negar la copia, porque su expedición exige autorización del comité.", "j": "Es incorrecta. Es plausible porque la consulta en sala es la forma más común de acceso, pero el art. 27 de la Ley 594 de 2000 reconoce también el derecho a obtener copia de los documentos no reservados, sin otra autorización. Error de completitud.", "tipo": "completitud"}, {"t": "Pedir el escrito con el motivo de la consulta y permitir la revisión cuando lo radique.", "j": "Es incorrecta. Es plausible porque deja constancia de la solicitud, pero el art. 27 de la Ley 594 de 2000 reconoce el derecho a consultar y obtener copia de documentos no reservados sin exigir que se explique el motivo. Error de norma: añade un requisito que la norma no prevé.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M009", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 27", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#27", "fecha": "2026-10-26"}, {"fila": "M088", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#16", "fecha": "2026-10-26"}]}, {"id": "C-E06-003-1", "caso_id": "C-E06-003", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 21", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Sofía Cárdenas, Facilitadora IV de correspondencia de una Dirección Seccional, recibe el 6 de mayo, por escrito y con radicado 007702, una petición del señor Julián Ortiz sobre el cobro de una multa de tránsito impuesta por la secretaría de movilidad de su municipio. El señor la dirigió a la DIAN porque creyó que la entidad recaudaba esa obligación. El jefe del grupo confirma que la DIAN no conoce de ese asunto y que la secretaría de movilidad es la autoridad competente. Sofía debe tramitar el escrito esa misma semana.", "enunciado": "¿Qué gestión debe realizar Sofía con la petición?", "opciones": [{"t": "Remitirla a la secretaría dentro de los cinco días siguientes y enviar al señor copia del oficio remisorio.", "j": "Es correcta. El art. 21 de la Ley 1437 de 2011 ordena, cuando la petición escrita llega a autoridad no competente, remitirla al competente dentro de los cinco días siguientes a la recepción y enviar copia del oficio remisorio al peticionario.", "tipo": null}, {"t": "Devolver el escrito al señor para que él mismo lo presente ante la secretaría de movilidad del municipio.", "j": "Es incorrecta. Resulta plausible porque el asunto es de otra autoridad, pero el art. 21 de la Ley 1437 de 2011 asigna a la entidad que recibe, no al ciudadano, la carga de remitir la petición al competente. Error de competencia.", "tipo": "competencia"}, {"t": "Informar al señor dentro de los cinco días que la DIAN no es competente y archivar el escrito.", "j": "Es incorrecta. Acierta en el aviso y en el plazo, pero el art. 21 de la Ley 1437 de 2011 también exige remitir la petición al competente cuando este existe; archivarla deja el trámite a medias. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M055", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 21", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#21", "fecha": "2026-10-26"}]}, {"id": "C-E05-013-1", "caso_id": "C-E05-013", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 74", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Teresa Vargas, Facilitadora IV de la ventanilla de correspondencia de una Dirección Seccional, recibe el radicado 2026-3550 de la sociedad ficticia Metales Arauca S.A.S. El escrito controvierte la resolución definitiva que expidió el jefe de la División de Gestión Jurídica y pide que ese mismo funcionario la revoque; no menciona al superior. La resolución fue firmada el 2 de octubre. El sistema exige indicar el tipo de recurso y la dependencia destinataria al registrar el documento. Teresa no evalúa si el recurso prospera ni si fue presentado a tiempo.", "enunciado": "¿Qué tipo de recurso y qué destinatario debe registrar Teresa en el sistema?", "opciones": [{"t": "Reposición, dirigido al Grupo de Documentación que custodia el expediente", "j": "Es incorrecta. Es plausible porque acierta en el recurso, pero el art. 74, numeral 1, de la Ley 1437 de 2011 lo radica ante quien expidió la decisión, no ante la dependencia que guarda el expediente. Error de competencia.", "tipo": "competencia"}, {"t": "Reposición, dirigido al jefe de la División de Gestión Jurídica que expidió el acto", "j": "Es correcta. La Ley 1437 de 2011, art. 74, numeral 1, prevé contra los actos definitivos el recurso de reposición ante quien expidió la decisión para que la aclare, modifique, adicione o revoque; la sociedad pide la revocatoria a ese mismo funcionario.", "tipo": null}, {"t": "Apelación, dirigido al director seccional como inmediato superior de quien expidió el acto", "j": "Es incorrecta. Es plausible porque la apelación también procede contra actos definitivos, pero el art. 74, numeral 2, de la Ley 1437 de 2011 la surte ante el superior, y el escrito se dirige a quien decidió. Confunde los dos recursos. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}, {"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}]}, {"id": "C-E06-010-1", "caso_id": "C-E06-010", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 7", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Mónica Ávila, Facilitadora IV del punto de atención de una Dirección Seccional, atiende con un sistema de turnos en horario de 8:00 a. m. a 4:00 p. m. El señor Tomás Rincón ingresó a las 3:52 p. m., tomó el turno 087 y a las 4:05 p. m. aún esperaba, con dos turnos antes del suyo. Un compañero propone cerrar la atención y citar al señor para el día siguiente, porque la jornada terminó y el personal de seguridad ya cerró la puerta de la sede. Mónica debe decidir cómo atender el turno pendiente.", "enunciado": "¿Cómo debe proceder Mónica con el señor Rincón?", "opciones": [{"t": "Asignarle un turno prioritario para la primera hora de la jornada siguiente.", "j": "Es incorrecta. Ofrece un trato considerado, pero traslada a otra jornada una atención que el num. 3 del art. 7 de la Ley 1437 de 2011 obliga a prestar el mismo día. Error de fase.", "tipo": "fase"}, {"t": "Atenderlo ese día, porque ingresó a la oficina dentro del horario normal de atención.", "j": "Es correcta. El num. 3 del art. 7 de la Ley 1437 de 2011 impone el deber de atender a todas las personas que hubieran ingresado a las oficinas dentro del horario normal de atención.", "tipo": null}, {"t": "Indicarle que presente su solicitud por el canal electrónico, que opera todo el día.", "j": "Es incorrecta. El canal electrónico es un medio válido, pero no reemplaza la atención personal debida a quien ingresó dentro del horario, según el num. 3 del art. 7 de la Ley 1437 de 2011. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E06-013-1", "caso_id": "C-E06-013", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1712 de 2014, art. 2", "integra": ["TABLAS DE RETENCION"], "caso": "Germán Castro, Facilitador IV del archivo de gestión de una Dirección Seccional, recibe el 26 de octubre la solicitud de un estudiante que pide consultar el informe de gestión del año anterior, archivado en la serie Informes. El documento no tiene marca de reserva y ninguna ley restringe su contenido. Una compañera opina que solo debe mostrarse a quien acredite un interés directo. La tabla de retención documental indica que la serie permanece dos años en el archivo de gestión antes de su transferencia. Germán debe responder la solicitud ese mismo día.", "enunciado": "¿Qué criterio de acceso debe aplicar Germán a la solicitud?", "opciones": [{"t": "Remitir la solicitud al archivo central, que es el que custodia los documentos de consulta pública.", "j": "Es incorrecta. El archivo central recibe las transferencias, pero según la tabla de retención el informe sigue en el archivo de gestión; la opción traslada la solicitud a una etapa posterior del ciclo. Error de fase.", "tipo": "fase"}, {"t": "Permitir la consulta de un resumen del informe y reservar el resto del documento.", "j": "Es incorrecta. Da acceso parcial, pero el art. 4 de la Ley 1712 de 2014 solo admite restringir por excepciones contempladas en la ley o la Constitución, y aquí no existe ninguna. Error de completitud.", "tipo": "completitud"}, {"t": "Permitir la consulta, porque el informe es público y no hay reserva legal que lo limite.", "j": "Es correcta. El art. 2 de la Ley 1712 de 2014 establece que toda información en custodia de un sujeto obligado es pública y solo puede reservarse por disposición constitucional o legal, en armonía con el art. 74 de la Constitución.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M085", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#2", "fecha": "2026-10-26"}, {"fila": "M077", "norma": "Constitución Política de Colombia", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#74", "fecha": "2026-10-26"}, {"fila": "M087", "norma": "Ley 1712 de 2014 (transparencia y acceso a la información pública)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1712_2014.htm#4", "fecha": "2026-10-26"}]}, {"id": "C-E07-007-1", "caso_id": "C-E07-007", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.2", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Hernán, Facilitador IV del archivo de gestión de una Dirección Seccional, organiza cajas de la subserie Resoluciones de Gestión Tributaria, que documentan decisiones de la entidad frente a los contribuyentes. La TRD le asigna dos años en gestión, ocho en archivo central y, en disposición final, la sigla CT. Un auxiliar nuevo le pregunta si al terminar los diez años podrá tomarse una muestra y descartar el resto, como se hace con otra subserie marcada con la sigla S. Las cajas entrarán en el plan de transferencias de 2027.", "enunciado": "¿Qué debe explicar Hernán al auxiliar sobre el destino de esa subserie?", "opciones": [{"t": "Que al cumplir los diez años el archivo central puede tomar una muestra y eliminar el resto", "j": "Es incorrecta. Es plausible porque la muestra existe para las subseries marcadas con S, pero confunde las categorías: el art. 4.5.2 del Acuerdo AGN 001 de 2024 asigna a la sigla CT la conservación total, que no admite muestreo ni descarte. Error de norma.", "tipo": "norma"}, {"t": "Que la sigla indica conservación total por el valor de los documentos como testimonio", "j": "Es correcta. El art. 4.5.2 del Acuerdo AGN 001 de 2024 establece que la conservación total se fija en el campo disposición final de la TRD con la sigla CT, teniendo en cuenta valores como evidencia y testimonio de las funciones y decisiones de las instituciones.", "tipo": null}, {"t": "Que la conservación total se decidirá cuando el comité revise las cajas en el archivo central", "j": "Es incorrecta. Es plausible porque las cajas pasarán luego al archivo central, pero la conservación total ya quedó establecida en el campo disposición final de la TRD, como dispone el art. 4.5.2 del Acuerdo AGN 001 de 2024; no se aplaza a una revisión posterior. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M036", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.2", "fecha": "2026-10-26"}]}, {"id": "C-E07-010-1", "caso_id": "C-E07-010", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 5.1.5.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Diana, Facilitadora IV del archivo de gestión de una Dirección Seccional, consulta el estado de la TRD actualizada en 2026. La versión fue aprobada por el Comité Institucional de Gestión y Desempeño en junio y enviada en julio para su inscripción, pero a 26 de octubre todavía no se ha emitido el Certificado de Inscripción en el Registro Único de Series Documentales. Su coordinador le pide preparar con esa versión la eliminación de 20 cajas de una subserie marcada con E y la transferencia de otras 30 cajas de expedientes cerrados, ambas para la primera semana de noviembre.", "enunciado": "¿Qué debe informar Diana al coordinador sobre las dos tareas encargadas?", "opciones": [{"t": "Que el Comité puede autorizar el uso de la versión de 2026 mientras se emite el certificado del RUSD", "j": "Es incorrecta. Es plausible porque el Comité aprobó la versión, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 liga la implementación a la emisión del Certificado de Inscripción en el RUSD, no a una autorización interna. Error de competencia.", "tipo": "competencia"}, {"t": "Que con la versión de 2026 la transferencia puede hacerse ya y la eliminación espera el certificado del RUSD", "j": "Es incorrecta. Es plausible porque la eliminación suele verse como la tarea más delicada, pero el art. 5.1.5.1 del Acuerdo AGN 001 de 2024 condiciona a la emisión del certificado tanto la disposición final como las transferencias. Error de fase.", "tipo": "fase"}, {"t": "Que ninguna de las dos tareas puede hacerse con la versión de 2026 hasta que se emita el certificado del RUSD", "j": "Es correcta. El art. 5.1.5.1 del Acuerdo AGN 001 de 2024 dispone que las transferencias documentales y la disposición final se efectúan una vez emitido el Certificado de Inscripción en el RUSD; la versión de 2026 aún no lo tiene, así que ninguna de las dos tareas se aplica con ella.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M041", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 5.1.5.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#5.1.5.1", "fecha": "2026-10-26"}]}, {"id": "C-E06-001-1", "caso_id": "C-E06-001", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 15", "integra": ["GESTION DOCUMENTAL"], "caso": "Lucía Prada, Facilitadora IV de la ventanilla de una Dirección Seccional, recibe el 14 de abril a las 10:20 a. m. una solicitud de actualización de datos de la sociedad ficticia Comercializadora Alfa S. A. S. La norma del trámite exige anexar el certificado de existencia y representación legal, y el representante no lo trae. Lucía se lo advierte en el acto, pero él insiste en que el escrito quede radicado ese mismo día. El último radicado de entrada asignado en el sistema es el 004318 y la ventanilla cierra a mediodía.", "enunciado": "¿Cómo debe proceder Lucía con la radicación del escrito?", "opciones": [{"t": "Devolver el escrito y asignarle radicado cuando el representante entregue el certificado.", "j": "Es incorrecta. Parece prudente esperar el anexo, pero el art. 15 de la Ley 1437 de 2011 ordena radicar cuando el peticionario insiste; la opción aplaza la radicación a una etapa posterior. Error de fase.", "tipo": "fase"}, {"t": "Radicarlo con el consecutivo 004319, fecha y hora, y dejar constancia del certificado faltante.", "j": "Es correcta. El art. 15 de la Ley 1437 de 2011 dispone que, si el peticionario insiste, se radique dejando constancia de los documentos faltantes, y el art. 4.2.3 del Acuerdo AGN 001 de 2024 exige el número consecutivo con fecha y hora de recibo.", "tipo": null}, {"t": "Radicarlo con el consecutivo 004319 y remitirlo al área para que esta pida luego el certificado.", "j": "Es incorrecta. Asigna bien el consecutivo, pero omite la constancia de los requisitos faltantes que el art. 15 de la Ley 1437 de 2011 exige en el acto de recibo. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M051", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 15", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#15", "fecha": "2026-10-26"}, {"fila": "M018", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.3", "fecha": "2026-10-26"}]}, {"id": "C-E07-016-1", "caso_id": "C-E07-016", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["GESTION DOCUMENTAL"], "caso": "Felipe, Facilitador IV del archivo de gestión de un grupo de apoyo administrativo, debe entregar el 15 de diciembre al archivo central 35 expedientes cerrados de la subserie Acuerdos de Pago, con tiempo de retención en gestión cumplido según la TRD. Cada carpeta tiene su hoja de control. El grupo no ha elaborado el inventario documental de la subserie, y el coordinador le propone enviar las cajas con un oficio que indique el número total de carpetas para cumplir la fecha. El archivo central no recibe entregas fuera del cronograma anual.", "enunciado": "¿Qué debe hacer Felipe para preparar la entrega?", "opciones": [{"t": "Elaborar el inventario documental de los expedientes y remitirlos con sus respectivas hojas de control", "j": "Es correcta. El art. 26 de la Ley 594 de 2000 obliga a elaborar inventarios que aseguren el control de los documentos en sus fases, y el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que las unidades transferidas vayan con su hoja de control.", "tipo": null}, {"t": "Enviar las carpetas con sus hojas de control y el oficio que indica el número total", "j": "Es incorrecta. Es plausible porque cumple la hoja de control que exige el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024, pero un conteo de carpetas no es inventario; el art. 26 de la Ley 594 de 2000 obliga a inventariar los documentos para su control en las fases. Error de completitud.", "tipo": "completitud"}, {"t": "Enviar las cajas en la fecha y elaborar el inventario cuando el archivo central las reciba", "j": "Es incorrecta. Es plausible porque cumple la fecha programada, pero deja sin control los documentos durante el cambio de fase; el art. 26 de la Ley 594 de 2000 busca asegurar el control de los documentos en sus diferentes fases, lo que exige el inventario antes de entregar. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M008", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-26"}, {"fila": "M034", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.4.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.4.3", "fecha": "2026-10-26"}]}, {"id": "C-E01-008-1", "caso_id": "C-E01-008", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 87", "integra": ["GESTION DOCUMENTAL"], "caso": "La Facilitadora IV Sandra Peña, del grupo de correspondencia de una Dirección Seccional, actualiza el estado de la Resolución 1550, que resolvió una solicitud de Ferretería Los Andes Ltda. y admite reposición y apelación. El aviso se entregó en la dirección del expediente el 2 de septiembre y la notificación quedó surtida al finalizar el 3 de septiembre. El término de diez días para recurrir venció el 17 de septiembre. Hoy, 25 de septiembre, la ventanilla certifica que no ingresó ningún escrito sobre ese acto. El sistema exige una fecha exacta.", "enunciado": "¿Qué fecha de firmeza debe registrar la facilitadora?", "opciones": [{"t": "El 4 de septiembre, día siguiente a aquel en que quedó surtida la notificación por aviso.", "j": "Es incorrecta. Es plausible porque el num. 1 del art. 87 de la Ley 1437 de 2011 fija la firmeza al día siguiente de la notificación, pero esa regla aplica cuando no procede ningún recurso, y este acto admite reposición y apelación. Ubica la firmeza en una etapa anterior. Error de fase.", "tipo": "fase"}, {"t": "El 18 de septiembre, día siguiente al vencimiento del término para recurrir sin recurso presentado.", "j": "Es correcta. Ley 1437 de 2011, art. 87, num. 3: el acto queda en firme desde el día siguiente al vencimiento del término para interponer los recursos, si no se interpusieron. El término de diez días (art. 76) venció el 17 de septiembre sin escritos.", "tipo": null}, {"t": "El 17 de septiembre, día en que venció el término de diez días para interponer los recursos.", "j": "Es incorrecta. Es plausible porque la firmeza depende de ese vencimiento, pero el art. 87, num. 3, de la Ley 1437 de 2011 la fija desde el día siguiente al vencimiento. Desplaza el cómputo un día. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M073", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 87", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#87", "fecha": "2026-10-26"}, {"fila": "M070", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 76", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#76", "fecha": "2026-10-26"}]}, {"id": "C-E06-018-1", "caso_id": "C-E06-018", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 22", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Beatriz Ocampo, Facilitadora IV de la ventanilla de una Dirección Seccional, radica el 5 de noviembre con el número 013420 una queja escrita del señor Pablo Ruiz por el trato que recibió de un servidor del punto de atención. El reglamento interno de peticiones de la Dirección Seccional asigna las quejas al grupo de quejas y reclamos. El servidor señalado pide a Beatriz que le entregue la queja para responderla él mismo y evitar que el caso escale. Beatriz debe repartir el documento en el sistema esa misma mañana.", "enunciado": "¿A quién debe repartir Beatriz la queja radicada?", "opciones": [{"t": "Al servidor señalado, para que dé su versión y conteste al señor en el término.", "j": "Es incorrecta. Busca una respuesta rápida, pero el num. 7 del art. 7 y el art. 22 de la Ley 1437 de 2011 asignan las quejas a la dependencia especializada que fija la reglamentación interna. Error de competencia.", "tipo": "competencia"}, {"t": "Al archivo de gestión, hasta que el señor ratifique la queja en forma presencial.", "j": "Es incorrecta. Parece una verificación prudente, pero la queja ya está radicada y el art. 22 de la Ley 1437 de 2011 exige tramitarla según la reglamentación interna; la opción detiene el trámite antes del reparto. Error de fase.", "tipo": "fase"}, {"t": "Al grupo de quejas y reclamos, que el reglamento interno designa para atenderlas.", "j": "Es correcta. El art. 22 de la Ley 1437 de 2011 remite a la reglamentación interna la manera de atender las quejas, y el num. 7 del art. 7 ordena atribuirlas a dependencias especializadas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M056", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#22", "fecha": "2026-10-26"}, {"fila": "M047", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#7", "fecha": "2026-10-26"}]}, {"id": "C-E03-014-1", "caso_id": "C-E03-014", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 1", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Beatriz Ocampo, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Impuestos de Sabana Nueva, revisa el 17 de noviembre el boletín interno que se distribuye el 19 de noviembre para la semana de la cultura de la legalidad. El texto dice: «Colombia es un Estado social de derecho, organizado como república federal, con entidades territoriales sin autonomía». La jefe del grupo pidió a Beatriz contrastar la frase con el artículo constitucional citado e informarle el ajuste antes de la distribución, sin cambiar el resto del boletín.", "enunciado": "¿Qué ajuste debe informar Beatriz a la jefe del grupo?", "opciones": [{"t": "Cambiar federal por unitaria y descentralizada, y reconocer la autonomía de las entidades territoriales.", "j": "Es correcta. La Constitución Política, art. 1, define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales; el ajuste corrige los dos errores de la frase antes de la distribución.", "tipo": null}, {"t": "Publicar el boletín en la fecha prevista y corregir la frase en una fe de erratas posterior.", "j": "Es incorrecta. Es plausible porque evita retrasar el boletín, pero la jefe pidió el ajuste antes de la distribución; la frase contradice la Constitución Política, art. 1, y circularía con el error. Error de fase.", "tipo": "fase"}, {"t": "Cambiar federal por unitaria y conservar la mención de las entidades territoriales sin autonomía administrativa.", "j": "Es incorrecta. Corrige la forma de la república, pero deja intacto el error sobre las entidades territoriales; la Constitución Política, art. 1, las reconoce con autonomía. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M084", "norma": "Constitución Política de Colombia", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E05-017-1", "caso_id": "C-E05-017", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.4", "integra": ["TABLAS DE RETENCION"], "caso": "Hugo Beltrán, Facilitador IV del archivo de gestión de la División de Gestión Administrativa y Financiera de una Dirección Seccional, revisa 18 cajas de la subserie Comprobantes de Préstamo de Elementos, cuyo tiempo de retención venció en 2025. La TRD marca la disposición final de esa subserie con E y la ficha de valoración la sustenta. El jefe de la división quiere destruirlas el 15 de diciembre para liberar espacio, pero aún no existe el acta del Comité Institucional de Gestión y Desempeño que apruebe esa eliminación.", "enunciado": "¿Qué debe informar Hugo al jefe antes de la fecha prevista para destruir las cajas?", "opciones": [{"t": "Que la eliminación está fijada y sustentada, pero le falta la aprobación del comité", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.5.4, exige que la eliminación esté establecida en la TRD, sustentada en la valoración y aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces; falta el último requisito.", "tipo": null}, {"t": "Que el jefe de la división puede aprobar la eliminación firmando el inventario", "j": "Es incorrecta. Es plausible porque el jefe responde por el archivo de su división, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 atribuye la aprobación al Comité Institucional de Gestión y Desempeño o a quien haga sus veces. Error de competencia.", "tipo": "competencia"}, {"t": "Que la eliminación puede hacerse, porque la tabla marca la E y la valoración la sustenta", "j": "Es incorrecta. Es plausible porque dos de los requisitos se cumplen, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 también exige la aprobación del comité, que no existe. Verifica solo una parte. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M038", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.4", "fecha": "2026-10-26"}]}, {"id": "C-E01-014-1", "caso_id": "C-E01-014", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Constitución Política de Colombia, art. 6", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "En una revisión interna del grupo de correspondencia de una Dirección Seccional se detecta que doce citaciones para notificación personal, de actos expedidos el 1 de septiembre, siguen el 15 de septiembre en la bandeja de salida del Facilitador IV Daniel Rojas. El facilitador, empleado de planta, explica que no las envió porque nadie se lo recordó y que, como apoya tareas operativas, su situación es la de cualquier particular. El coordinador le pide un informe escrito sobre su posición frente al régimen de responsabilidad.", "enunciado": "¿Qué debe reconocer el facilitador en su informe?", "opciones": [{"t": "Que, como empleado del Estado, es servidor público y responde también por omitir el envío dentro del plazo.", "j": "Es correcta. Constitución Política, arts. 123 y 6: los empleados del Estado son servidores públicos, y estos responden por infringir la Constitución y las leyes y por omisión o extralimitación en sus funciones. Las citaciones debían enviarse dentro de los cinco días siguientes a la expedición (Ley 1437 de 2011, art. 68).", "tipo": null}, {"t": "Que responde como particular, de modo que solo le es exigible infringir de manera directa la Constitución o la ley.", "j": "Es incorrecta. Es plausible porque reproduce la regla de los particulares del art. 6 de la Constitución Política, pero el facilitador es empleado del Estado y, por tanto, servidor público (art. 123), que responde además por omisión. Aplica la regla de otro sujeto. Error de norma.", "tipo": "norma"}, {"t": "Que la responsabilidad es del jefe que firmó los actos, porque él cumple labores de apoyo operativo.", "j": "Es incorrecta. Es plausible porque el jefe expide los actos, pero el envío de las citaciones era tarea del facilitador, y el art. 6 de la Constitución Política hace responsable a cada servidor por la omisión en el ejercicio de sus funciones. Desplaza la responsabilidad a otro servidor. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M081", "norma": "Constitución Política de Colombia", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#6", "fecha": "2026-10-26"}, {"fila": "M082", "norma": "Constitución Política de Colombia", "articulo": "art. 123", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#123", "fecha": "2026-10-26"}, {"fila": "M067", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 68", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#68", "fecha": "2026-10-26"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.2.1", "integra": ["OFIMATICA"], "caso": "En una Dirección Seccional se implementa el Sistema de Gestión de Documentos Electrónicos de Archivo y el área de tecnología ya lo habilitó para el grupo de apoyo administrativo. El Facilitador IV Luis Arango, del grupo de apoyo administrativo, gestiona las solicitudes de certificaciones que llegan por el canal electrónico; el 4 de agosto recibe 23, con radicados del 2026-2201 al 2026-2223. Un compañero le sugiere guardarlas en una carpeta compartida del equipo y subir cada expediente al sistema cuando se expida la certificación, porque así se cargan menos archivos sueltos durante el trámite.", "enunciado": "¿Qué debe entender Luis sobre el momento de incorporar los expedientes al sistema?", "opciones": [{"t": "Que se incorporan en un solo expediente por día, con las 23 solicitudes recibidas juntas.", "j": "Es incorrecta. Es plausible porque agrupa lo recibido en una misma fecha, pero cada solicitud es un trámite y el expediente se conforma por trámite según el CCD y la TRD (Acuerdo AGN 001 de 2024, art. 4.3.2.1). Error de granularidad: usa el día como unidad documental.", "tipo": "granularidad"}, {"t": "Que se incorporan desde el inicio de cada trámite, conforme al Cuadro de Clasificación y la TRD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.2.1, ordena conformar los expedientes electrónicos según el CCD y la TRD e incorporarlos al SGDEA desde el inicio del trámite hasta su finalización, y el art. 1.3.4 exige gestionarlos en ese sistema y no en repositorios sueltos.", "tipo": null}, {"t": "Que se incorporan al expedir la certificación, cuando cada expediente ya reúne sus documentos.", "j": "Es incorrecta. Es plausible porque el expediente queda completo al expedir la certificación, pero el art. 4.3.2.1 del Acuerdo AGN 001 de 2024 exige incorporarlo al SGDEA desde el inicio del trámite. Error de fase: aplaza la incorporación al final.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M031", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.2.1", "fecha": "2026-10-26"}, {"fila": "M013", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.4", "fecha": "2026-10-26"}]}, {"id": "C-E06-017-1", "caso_id": "C-E06-017", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.2", "integra": ["OFIMATICA"], "caso": "Esteban Vélez, Facilitador IV de la ventanilla única de una Dirección Seccional, atiende el 4 de noviembre a la señora Laura Fajardo. Ella presentó el 30 de octubre una petición por la sede electrónica de la entidad y recibió en pantalla un número de radicado con fecha y hora. Trae el escrito impreso porque un vecino le dijo que solo la entrega física en ventanilla cuenta como presentación. La sede electrónica de la entidad está integrada a la ventanilla única, y la fila del día es larga.", "enunciado": "¿Qué debe informarle Esteban a la señora sobre su petición?", "opciones": [{"t": "Que debe radicar el impreso como anexo del radicado que obtuvo en la sede.", "j": "Es incorrecta. Parece un control adicional, pero repite una recepción que ya se cumplió en la sede electrónica según el art. 4.2.2 del Acuerdo AGN 001 de 2024. Error de fase.", "tipo": "fase"}, {"t": "Que debe radicar el impreso en ventanilla para que el término corra desde hoy.", "j": "Es incorrecta. Supone que la recepción válida es física, pero el num. 1 del art. 5 de la Ley 1437 de 2011 admite peticiones por cualquier medio idóneo. Error de norma.", "tipo": "norma"}, {"t": "Que su petición quedó presentada el 30 de octubre con el radicado que recibió.", "j": "Es correcta. El art. 4.2.2 del Acuerdo AGN 001 de 2024 admite que la ventanilla única gestione la recepción y radicación integrada a la sede electrónica, y el num. 1 del art. 5 de la Ley 1437 de 2011 reconoce cualquier medio idóneo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M017", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.2", "fecha": "2026-10-26"}, {"fila": "M046", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#5", "fecha": "2026-10-26"}]}, {"id": "C-E02-018-1", "caso_id": "C-E02-018", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 22", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Cada mañana, la Facilitadora IV Alejandra Suárez, del Grupo de Correspondencia de una Dirección Seccional, recibe entre 60 y 80 comunicaciones, les asigna radicado y las entrega a la dependencia que debe tramitarlas; esa labor ocupa la mayor parte de su jornada. El 3 de abril, el grupo de apoyo administrativo le pide clasificar sus tareas según los procesos archivísticos del programa de gestión documental para un informe trimestral. Alejandra duda sobre cómo nombrar la entrega a las dependencias, porque otra compañera reportó esa misma tarea como consulta.", "enunciado": "¿Con qué proceso archivístico debe Alejandra registrar esa tarea en el informe?", "opciones": [{"t": "Recepción, porque la tarea forma parte del ingreso de las comunicaciones a la entidad.", "j": "Es incorrecta. Es plausible porque la recepción y la radicación preceden a la entrega, pero el art. 22 de la Ley 594 de 2000 distingue la recepción de la distribución, que es la etapa siguiente. Error de fase: nombra la etapa anterior.", "tipo": "fase"}, {"t": "Consulta, porque las dependencias acceden a las comunicaciones para poder tramitarlas.", "j": "Es incorrecta. Es plausible porque las dependencias leen las comunicaciones que reciben, pero la consulta es el acceso a documentos ya organizados; llevar lo radicado a quien lo tramita es otro proceso del art. 22 de la Ley 594 de 2000. Error de granularidad: confunde procesos vecinos.", "tipo": "granularidad"}, {"t": "Distribución, porque la tarea lleva lo radicado a la dependencia que debe tramitarlo.", "j": "Es correcta. La Ley 594 de 2000, art. 22, enumera la producción o recepción, la distribución, la consulta, la organización, la recuperación y la disposición final; entregar las comunicaciones radicadas a la dependencia competente es distribución, y el art. 12 hace responsable a la administración de esa gestión.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M004", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 22", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#22", "fecha": "2026-10-26"}, {"fila": "M003", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E03-001-1", "caso_id": "C-E03-001", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["GESTION DOCUMENTAL"], "caso": "Laura Méndez, Facilitadora IV de la ventanilla de correspondencia de la Dirección Seccional de Impuestos de Villa Serena, recibe el 3 de marzo dos escritos de una misma ciudadana. En el primero, radicado 2026-0311, pregunta por el saldo de su impuesto sobre las ventas del último bimestre. En el segundo, radicado 2026-0312, reclama por el cobro del impuesto predial de su casa, que liquida la alcaldía. El procedimiento del área exige clasificar cada asunto antes de las 4:00 p. m. del mismo día, para repartirlo a la dependencia que corresponda o al trámite de asuntos ajenos.", "enunciado": "¿Cómo debe clasificar Laura los escritos recibidos antes del reparto?", "opciones": [{"t": "Clasificar el primero como asunto de la DIAN y el segundo como asunto ajeno, para el trámite de no competencia.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, asigna a la DIAN la administración del impuesto sobre las ventas y de los demás impuestos internos del orden nacional cuya competencia no esté asignada a otras entidades; el predial lo liquida la alcaldía, de modo que el segundo escrito sale por el trámite de asuntos ajenos.", "tipo": null}, {"t": "Clasificar ambos como asuntos de la DIAN y definir la no competencia del segundo después de hacer el reparto.", "j": "Es incorrecta. Es plausible porque los dos escritos llegan a la ventanilla y tratan de impuestos, pero el procedimiento pide clasificar antes de repartir y el predial no es un impuesto del orden nacional según el Decreto 1742 de 2020, art. 1. Error de fase.", "tipo": "fase"}, {"t": "Clasificar el primero como asunto de la DIAN y responder ella misma el segundo con el valor del predial.", "j": "Es incorrecta. Acierta con el impuesto sobre las ventas, pero atribuye a la Facilitador IV la respuesta de fondo sobre un tributo que liquida otra entidad; el Decreto 1742 de 2020, art. 1, no da a la DIAN ese asunto y el cargo solo clasifica y reparte. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M096", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E06-015-1", "caso_id": "C-E06-015", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.7", "integra": ["GESTION DOCUMENTAL"], "caso": "Hugo Navarro, Facilitador IV de correspondencia de una Dirección Seccional, recibe el 28 de octubre la respuesta firmada a la petición 012004, cuyo término vence ese mismo día. La jefe del área le pide enviarla de inmediato desde el correo institucional del área y dejar la radicación de salida para la semana siguiente, porque hoy el sistema funciona con lentitud. La ventanilla única está abierta y la herramienta tecnológica, aunque lenta, sí permite generar radicados. Hugo debe despachar la respuesta antes del cierre de la jornada.", "enunciado": "¿Qué debe hacer Hugo con la respuesta antes de despacharla?", "opciones": [{"t": "Registrar en la respuesta el mismo número de radicado de entrada de la petición.", "j": "Es incorrecta. Vincula la respuesta con la petición, pero el art. 4.2.7 del Acuerdo AGN 001 de 2024 exige un radicado propio de salida, distinto del de entrada. Error de granularidad.", "tipo": "granularidad"}, {"t": "Enviarla hoy y asignarle el radicado de salida cuando se normalice el sistema.", "j": "Es incorrecta. Cumple con enviar a tiempo, pero el art. 4.2.7 del Acuerdo AGN 001 de 2024 exige el radicado de salida con fecha y hora de envío; radicar después altera el orden del trámite. Error de fase.", "tipo": "fase"}, {"t": "Asignarle hoy un consecutivo único de salida con fecha y hora, y luego enviarla.", "j": "Es correcta. El art. 4.2.7 del Acuerdo AGN 001 de 2024 dispone que las comunicaciones enviadas lleven un número consecutivo único de radicado de salida, con constancia de fecha y hora de envío, para oficializar el trámite y cumplir los términos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M022", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.7", "fecha": "2026-10-26"}]}, {"id": "C-E07-009-1", "caso_id": "C-E07-009", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.4", "integra": ["GESTION DOCUMENTAL"], "caso": "Óscar, Facilitador IV del archivo de gestión de un grupo de apoyo administrativo, tiene a cargo 45 cajas de la subserie Comunicaciones Informativas, con tiempo de retención cumplido y marcada con E en la TRD. El 5 de octubre su coordinador le pide destruirlas esa semana para liberar espacio en la bodega. Óscar revisa el acta más reciente del Comité Institucional de Gestión y Desempeño, del 28 de septiembre, y no encuentra la eliminación de esa subserie entre los temas tratados ni aprobados. La bodega tiene capacidad para pocas semanas más.", "enunciado": "¿Qué debe informar Óscar al coordinador antes de actuar?", "opciones": [{"t": "Que la eliminación requiere la aprobación del Comité, que todavía no consta en el acta revisada", "j": "Es correcta. El art. 4.5.4 del Acuerdo AGN 001 de 2024 exige que la eliminación esté establecida en la TRD con la sigla E y, además, que sea aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces; el acta revisada no la incluye.", "tipo": null}, {"t": "Que la eliminación procede porque la TRD la registra y el tiempo de retención está cumplido", "j": "Es incorrecta. Es plausible porque cumple dos condiciones reales, la sigla E y el tiempo, pero omite la tercera: el art. 4.5.4 del Acuerdo AGN 001 de 2024 exige la aprobación del Comité Institucional de Gestión y Desempeño. Error de completitud.", "tipo": "completitud"}, {"t": "Que la eliminación puede aprobarla el coordinador con la firma del acta de destrucción", "j": "Es incorrecta. Es plausible porque el coordinador responde por el grupo y suele firmar actas, pero el art. 4.5.4 del Acuerdo AGN 001 de 2024 asigna la aprobación de la eliminación al Comité Institucional de Gestión y Desempeño. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M038", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.4", "fecha": "2026-10-26"}]}, {"id": "C-E04-016-1", "caso_id": "C-E04-016", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. La subserie Informes de Gestión, producida en medio electrónico, cumplió el 30 de junio de 2026 su tiempo de retención en el archivo de gestión y debe transferirse al archivo central. Para liberar espacio en el servidor, que está cerca de su capacidad máxima, un compañero propone imprimir los informes, transferir las carpetas en papel y borrar los archivos electrónicos. La entidad tiene aprobado su Plan de Preservación Digital a largo plazo. Usted debe preparar la transferencia.", "enunciado": "¿Cómo debe preparar usted la transferencia de esos documentos electrónicos de archivo?", "opciones": [{"t": "Transferirlos en papel y borrar los electrónicos, porque la retención en el archivo de gestión ya terminó.", "j": "Es incorrecta. Es plausible porque la retención en gestión sí terminó, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, exige que los documentos permanezcan almacenados electrónicamente durante todo su ciclo de vida, no solo en la etapa de gestión. Error de fase.", "tipo": "fase"}, {"t": "Transferirlos en papel y conservar en el servidor solo los informes que considere más consultados.", "j": "Es incorrecta. Parece un equilibrio razonable, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, se aplica a todos los documentos electrónicos de archivo, y decidir cuáles conservar no corresponde al facilitador. Error de competencia.", "tipo": "competencia"}, {"t": "Transferirlos en medio electrónico, según los procesos archivísticos y el Plan de Preservación Digital.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, dispone que los documentos electrónicos de archivo se traten conforme a los principios y procesos archivísticos y permanezcan almacenados electrónicamente durante todo su ciclo de vida, de conformidad con el Plan de Preservación Digital a largo plazo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E01-004-1", "caso_id": "C-E01-004", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 45", "integra": ["GESTION DOCUMENTAL"], "caso": "La Facilitadora IV Diana Herrera, del archivo de gestión de una Dirección Seccional, recibe para incorporar al expediente la Resolución 0912 del 3 de agosto, que resolvió una solicitud de Transportes La Sabana S.A.S. El 19 de agosto el funcionario competente firmó un acto que corrige el número de identificación tributaria, digitado con dos cifras invertidas, sin variar lo decidido. El representante de la empresa llama a preguntar si con esa corrección vuelve a empezar el término para demandar. La tabla de retención ubica ambos documentos en la serie Resoluciones.", "enunciado": "¿Qué debe registrar la facilitadora sobre el trámite que sigue el acto de corrección?", "opciones": [{"t": "Que se remite para notificarlo a los interesados y que desde esa fecha corre otra vez el plazo para demandar.", "j": "Es incorrecta. Es plausible porque el acto de corrección sí debe notificarse o comunicarse, pero el art. 45 de la Ley 1437 de 2011 dispone que la corrección no revive los términos legales para demandar. Atribuye a la corrección un efecto que la norma excluye. Error de norma.", "tipo": "norma"}, {"t": "Que se remite para notificarlo o comunicarlo a los interesados, sin anotar un plazo nuevo para demandar.", "j": "Es correcta. Ley 1437 de 2011, art. 45: los errores de digitación se corrigen en cualquier tiempo, la corrección no cambia el sentido de la decisión ni revive los términos para demandar, y debe notificarse o comunicarse a todos los interesados.", "tipo": null}, {"t": "Que se archiva junto a la resolución, porque al no cambiar la decisión no necesita darse a conocer.", "j": "Es incorrecta. Es plausible porque la corrección no altera lo decidido, pero el art. 45 de la Ley 1437 de 2011 ordena notificarla o comunicarla a todos los interesados. Omite un paso obligatorio del trámite. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M063", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 45", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#45", "fecha": "2026-10-26"}]}, {"id": "C-E07-008-1", "caso_id": "C-E07-008", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.5.3", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Natalia, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, apoya la disposición final de la subserie Constancias de Entrega, marcada con S en la TRD. Son 300 cajas de gran volumen cuyo contenido se repite en el sistema de información de la entidad. El procedimiento aprobado fija una muestra del 5 % con método aleatorio por año. El 9 de noviembre su jefe inmediato le pide escoger las cajas que le parezcan más interesantes y dejar el resto listo para eliminar esa misma semana.", "enunciado": "¿Cómo debe Natalia apoyar la escogencia de las cajas que se conservarán?", "opciones": [{"t": "Tomar la muestra del 5 % con el método aleatorio que sustenta la selección", "j": "Es correcta. El art. 4.5.3 del Acuerdo AGN 001 de 2024 dispone que la selección, aplicable a subseries de gran volumen o de contenido repetido marcadas con S en la TRD, debe estar sustentada en los tamaños de las muestras y en los métodos de selección; aquí son 5 % y método aleatorio.", "tipo": null}, {"t": "Tomar las cajas que el jefe considere más representativas de la gestión del grupo", "j": "Es incorrecta. Es plausible porque el jefe orienta el trabajo de Natalia, pero la escogencia no depende de su apreciación: el art. 4.5.3 del Acuerdo AGN 001 de 2024 la sujeta a los tamaños de muestra y métodos de selección sustentados. Error de competencia.", "tipo": "competencia"}, {"t": "Tomar cajas de cada año hasta completar el 5 %, con el criterio que ella considere mejor", "j": "Es incorrecta. Es plausible porque respeta el tamaño de la muestra, pero omite el método aleatorio; el art. 4.5.3 del Acuerdo AGN 001 de 2024 exige que la selección se sustente en el tamaño de la muestra y también en el método de selección. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M037", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.5.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.5.3", "fecha": "2026-10-26"}]}, {"id": "C-E02-015-1", "caso_id": "C-E02-015", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 6.1.1.1", "integra": ["OFIMATICA"], "caso": "En el archivo de gestión de una Dirección Seccional, el Facilitador IV Felipe Cárdenas digitaliza el 15 de septiembre expedientes de la serie Actas de Comité de 2023 para atender consultas desde los puntos de atención. Un acta tiene una firma borrosa y un compañero sugiere retocar la imagen digital para que la firma se vea completa y reemplazar el archivo escaneado en el repositorio, sin dejar constancia del cambio. La consulta de esa acta está programada para el día siguiente por un grupo de otra seccional.", "enunciado": "¿Qué atributo de la documentación pondría en riesgo la propuesta del compañero?", "opciones": [{"t": "La integridad, porque la imagen retocada altera el contenido del acta sin dejar constancia.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 6.1.1.1, fija como propósito del SIC mantener la integridad, autenticidad, fiabilidad y accesibilidad de la documentación; retocar la firma y reemplazar el archivo sin constancia altera el contenido del documento.", "tipo": null}, {"t": "La accesibilidad, porque la imagen retocada impide la consulta desde los puntos de atención.", "j": "Es incorrecta. Es plausible porque la digitalización busca facilitar la consulta, pero la imagen retocada sigue siendo consultable; lo que se pierde es la correspondencia con el original, atributo distinto entre los del art. 6.1.1.1 del Acuerdo AGN 001 de 2024. Error de granularidad: confunde atributos.", "tipo": "granularidad"}, {"t": "La perdurabilidad del soporte, porque la digitalización expone el acta en papel al deterioro.", "j": "Es incorrecta. Es plausible porque la perdurabilidad aparece en los estudios técnicos del art. 19 de la Ley 594 de 2000, pero esa norma trata la incorporación de tecnologías; la alteración de la imagen afecta los atributos del art. 6.1.1.1 del Acuerdo AGN 001 de 2024. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M042", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 6.1.1.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#6.1.1.1", "fecha": "2026-10-26"}]}, {"id": "C-E06-004-1", "caso_id": "C-E06-004", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 21", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Camilo Herrera, Facilitador IV del punto de atención de una Dirección Seccional, atiende a la señora Elena Vargas, quien radicó por escrito el 2 de junio una petición dirigida por error a la DIAN. Correspondencia la remitió el 5 de junio a la gobernación, autoridad competente para el asunto, y la gobernación la recibió el 9 de junio, según el sello de recibido en la copia del oficio remisorio. La señora pregunta desde qué fecha se cuenta el término que tiene la gobernación para responderle, porque quiere saber cuándo reclamar.", "enunciado": "¿Qué debe informarle Camilo a la señora sobre el inicio del término?", "opciones": [{"t": "Que el término corre desde el día siguiente al 9 de junio, cuando lo recibió la gobernación.", "j": "Es correcta. El art. 21 de la Ley 1437 de 2011 dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", "tipo": null}, {"t": "Que el término corre desde el día siguiente al 5 de junio, cuando salió el oficio remisorio.", "j": "Es incorrecta. La remisión es un paso del trámite de traslado, pero el art. 21 de la Ley 1437 de 2011 no cuenta desde el envío sino desde que la autoridad competente recibe la petición. Error de fase.", "tipo": "fase"}, {"t": "Que el término corre desde el día siguiente al 2 de junio, cuando radicó en la DIAN.", "j": "Es incorrecta. Toma la fecha de la primera radicación, que es la regla general de recepción, pero el art. 21 de la Ley 1437 de 2011 cuenta el término desde la recepción por la autoridad competente. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M055", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 21", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#21", "fecha": "2026-10-26"}]}, {"id": "C-E04-014-1", "caso_id": "C-E04-014", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 12", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. El área conserva las facturas electrónicas que los contribuyentes aportaron en formato XML dentro de solicitudes radicadas entre enero y junio de 2026. Para ahorrar espacio, un compañero propone guardar solo una imagen de la representación gráfica de cada factura y borrar los archivos XML recibidos, porque la imagen también se puede abrir y leer. La TRD fija para esa serie un tiempo de retención de diez años. Usted debe explicar qué condición de conservación pone en riesgo la propuesta.", "enunciado": "¿Qué debe explicar usted a su compañero sobre la conservación de esas facturas?", "opciones": [{"t": "Que la imagen sirve porque permite consultar el contenido de cada factura en cualquier momento posterior.", "j": "Es incorrecta. Es plausible porque la imagen cumple la accesibilidad del numeral 1 de la Ley 527 de 1999, art. 12, pero no atiende el numeral 2 sobre el formato de generación o recepción. Error de completitud.", "tipo": "completitud"}, {"t": "Que debe conservarse el XML recibido o un formato que demuestre reproducir exactamente su información.", "j": "Es correcta. La Ley 527 de 1999, art. 12, numeral 2, exige que el mensaje de datos se conserve en el formato en que se generó, envió o recibió, o en uno que permita demostrar que reproduce con exactitud la información; una imagen sin el XML no lo demuestra.", "tipo": null}, {"t": "Que la imagen puede guardarse ahora y compararse con el XML cuando alguien pida consultarlo.", "j": "Es incorrecta. Parece prudente porque prevé una comparación, pero si el XML se borra ya no habrá con qué demostrar la exactitud; la Ley 527 de 1999, art. 12, exige esa condición desde que se conserva el documento. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M095", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E03-005-1", "caso_id": "C-E03-005", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Ley 1762 de 2015, art. 1", "integra": ["OFIMATICA"], "caso": "Paula Cifuentes, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Aduanas de Bahía Norte, prepara el 6 de agosto las diapositivas de la campaña contra el contrabando que se presentará el 12 de agosto ante gremios de comerciantes. El coordinador le pide que la diapositiva inicial resuma el objeto de la ley anticontrabando con las operaciones ilegales que esa ley nombra. El borrador recibido menciona solo el contrabando y el coordinador exige que la frase no agregue conductas que la ley no nombra.", "enunciado": "¿Qué frase debe incluir Paula en la diapositiva inicial?", "opciones": [{"t": "Fortalecer la lucha contra la competencia desleal por contrabando, lavado de activos y financiación del terrorismo.", "j": "Es incorrecta. Es plausible porque el lavado de activos suele citarse junto con la financiación del terrorismo, pero la Ley 1762 de 2015, art. 1, nombra el contrabando, el lavado de activos y la defraudación fiscal, no la financiación del terrorismo. Error de norma.", "tipo": "norma"}, {"t": "Fortalecer la lucha contra la competencia desleal que generan las personas en operaciones ilegales de contrabando.", "j": "Es incorrecta. Recoge bien la competencia desleal y el contrabando, pero repite el vacío del borrador: la Ley 1762 de 2015, art. 1, nombra también el lavado de activos y la defraudación fiscal. Error de completitud.", "tipo": "completitud"}, {"t": "Fortalecer la lucha contra la competencia desleal por contrabando, lavado de activos y defraudación fiscal.", "j": "Es correcta. La Ley 1762 de 2015, art. 1, fija como objeto fortalecer la lucha contra la competencia desleal realizada en operaciones ilegales de contrabando, lavado de activos y defraudación fiscal; la frase recoge las tres conductas sin agregar otras.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M098", "norma": "Ley 1762 de 2015 (ley anticontrabando)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1762_2015.htm#1", "fecha": "2026-10-26"}]}, {"id": "C-E03-013-1", "caso_id": "C-E03-013", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Constitución Política de Colombia, art. 113", "integra": ["RAZONAMIENTO CATEGORIAL", "GESTION DOCUMENTAL"], "caso": "Óscar Lemus, Facilitador IV de la ventanilla de correspondencia de la Dirección Seccional de Impuestos de Puerto Lindo, registra el 13 de noviembre tres comunicaciones: un oficio del Juzgado Segundo Civil del Circuito, una solicitud de una comisión del Congreso de la República y una consulta del Ministerio de Hacienda y Crédito Público. El sistema de registro tiene un campo obligatorio, «rama del poder público del remitente», y no permite guardar un radicado con ese campo vacío. Óscar debe cerrar el registro del día a las 5:00 p. m.", "enunciado": "¿Cómo debe diligenciar Óscar el campo en los registros del día?", "opciones": [{"t": "Judicial para el juzgado y legislativa para la comisión, y dejar el ministerio para revisión posterior.", "j": "Es incorrecta. Clasifica bien dos remitentes, pero deja sin diligenciar el tercero, que también encaja en una de las ramas de la Constitución Política, art. 113, y el sistema no permite guardar el campo vacío. Error de completitud.", "tipo": "completitud"}, {"t": "Judicial para el juzgado, legislativa para la comisión y de control para el ministerio.", "j": "Es incorrecta. Acierta con dos remitentes, pero la Constitución Política, art. 113, no incluye una rama de control entre las ramas del poder público; el ministerio pertenece a la ejecutiva. Error de norma.", "tipo": "norma"}, {"t": "Judicial para el juzgado, legislativa para la comisión y ejecutiva para el ministerio.", "j": "Es correcta. La Constitución Política, art. 113, define como ramas del poder público la legislativa, la ejecutiva y la judicial; el juzgado pertenece a la judicial, la comisión del Congreso a la legislativa y el ministerio a la ejecutiva.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M083", "norma": "Constitución Política de Colombia", "articulo": "art. 113", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#113", "fecha": "2026-10-26"}]}, {"id": "C-E02-012-1", "caso_id": "C-E02-012", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.2", "integra": ["OFIMATICA"], "caso": "La coordinadora del grupo de apoyo administrativo de una Dirección Seccional pide al Facilitador IV Ricardo Pardo que participe en el diseño de un formato nuevo para registrar el préstamo de expedientes del archivo de gestión. El formato se usará desde el 1 de diciembre, en papel en la sede principal y como formulario electrónico en dos puntos de atención. Ricardo tiene un modelo que circula entre compañeros, sin un procedimiento documentado detrás, y le proponen adoptarlo tal cual por la premura del plazo. El formato quedará en el listado oficial de formatos del área.", "enunciado": "¿Con qué base debe Ricardo apoyar el diseño del formato?", "opciones": [{"t": "Con un diseño fijado para el papel de la sede, que los puntos de atención adapten luego.", "j": "Es incorrecta. Es plausible porque resuelve el soporte de la sede principal, pero el art. 4.1.2 del Acuerdo AGN 001 de 2024 pide determinar en el procedimiento el soporte o formato electrónico y los medios de producción de cada uso previsto. Error de completitud.", "tipo": "completitud"}, {"t": "Con un procedimiento documentado que defina soporte, diseño y medios de producción.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.2, ordena generar los documentos a partir de procedimientos planificados y documentados en los que se determine su soporte o formato electrónico, el diseño y los medios y técnicas de producción.", "tipo": null}, {"t": "Con el modelo que circula entre compañeros, para documentar el procedimiento tras usarlo.", "j": "Es incorrecta. Es plausible por la premura del plazo, pero el art. 4.1.2 del Acuerdo AGN 001 de 2024 exige generar los documentos a partir de procedimientos planificados y documentados antes de producirlos. Error de fase: invierte el orden entre procedimiento y producción.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M014", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.2", "fecha": "2026-10-26"}]}, {"id": "C-E05-011-1", "caso_id": "C-E05-011", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 43", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "La Facilitadora IV Gloria Benítez organiza la correspondencia de salida de la División de Gestión de Liquidación de una Dirección Seccional. Debe marcar en el sistema los actos definitivos del expediente del contribuyente ficticio Raúl Peña. Encuentra un auto del 5 de febrero que ordena una inspección, un oficio del 19 de febrero que solicita información a un tercero y una liquidación oficial del 30 de abril que determina el impuesto a cargo. Solo los actos definitivos activan en el sistema la alerta de notificación prioritaria.", "enunciado": "¿Qué documento del expediente debe marcar Gloria como acto definitivo?", "opciones": [{"t": "El auto que ordena la inspección, porque es el primero que impulsa la actuación", "j": "Es incorrecta. Es plausible porque el auto pone en marcha una diligencia, pero impulsar la actuación no es decidir el fondo ni impedir que continúe (Ley 1437 de 2011, art. 43); es un acto de una etapa previa. Error de fase.", "tipo": "fase"}, {"t": "El oficio dirigido al tercero, porque contiene una orden escrita de la autoridad", "j": "Es incorrecta. Es plausible porque el oficio expresa una solicitud formal, pero el criterio del art. 43 de la Ley 1437 de 2011 no es la forma escrita, sino que el acto decida el fondo o haga imposible continuar. Error de granularidad.", "tipo": "granularidad"}, {"t": "La liquidación oficial, porque decide el fondo al determinar el impuesto a cargo", "j": "Es correcta. La Ley 1437 de 2011, art. 43, define como actos definitivos los que deciden directa o indirectamente el fondo del asunto o hacen imposible continuar la actuación; la liquidación oficial resuelve el fondo al determinar el impuesto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M061", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 43", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#43", "fecha": "2026-10-26"}]}, {"id": "C-E04-004-1", "caso_id": "C-E04-004", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.1", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV de la ventanilla de radicación de una Dirección Seccional. El 7 de julio de 2026 revisa los registros del día y encuentra que un compañero radicó doce documentos entrantes anotando solo el número y la fecha; dejó vacíos el remitente, el asunto y el trámite al que corresponde cada uno. Dos de esos documentos responden a requerimientos en curso de la División de Recaudo. El compañero afirma que con el número de radicado basta para ubicarlos. Usted debe explicarle qué exige el registro en el sistema de gestión de documentos.", "enunciado": "¿Qué debe explicar usted a su compañero sobre el registro de esos documentos?", "opciones": [{"t": "Debe llevar los metadatos y la vinculación al trámite, para recuperar y consultar el documento.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.1, exige la recepción, el registro, la vinculación a un trámite y la distribución con su respectiva descripción (metadatos), que garanticen la disponibilidad, recuperación y acceso a los documentos durante todo el ciclo vital.", "tipo": null}, {"t": "Con el número y la fecha de radicado queda asegurada la trazabilidad de los documentos.", "j": "Es incorrecta. Suena suficiente porque el número es el identificador del documento, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, pide vincular a un trámite y registrar la descripción con metadatos que garanticen recuperación y acceso. Error de completitud.", "tipo": "completitud"}, {"t": "El registro debe incluir la descripción de cada documento cuando se transfiera al archivo central.", "j": "Es incorrecta. Es plausible porque en la transferencia también se describen documentos, pero el Acuerdo AGN 001 de 2024, art. 4.2.1, ubica la descripción en la recepción, el registro y la distribución, para que el documento sea recuperable desde su ingreso. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M016", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.1", "fecha": "2026-10-26"}]}, {"id": "C-E03-010-1", "caso_id": "C-E03-010", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Constitución Política de Colombia, art. 209", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Elena Vargas, Facilitadora IV del punto de atención de la Dirección Seccional de Impuestos de San Mateo, asigna turnos el 26 de octubre durante una jornada de actualización del registro tributario. A las 9:10 a. m. llega un antiguo compañero de colegio con el turno 47 y le pide pasar antes porque tiene prisa. En la fila esperan los turnos 39 a 46, y la regla del punto da prelación a personas con condición de atención preferencial, que él no acredita. Al cierre, el supervisor revisa la planilla de turnos atendidos.", "enunciado": "¿Cómo debe atender Elena la petición del compañero?", "opciones": [{"t": "Pedir al supervisor que autorice el cambio de turno, porque la prelación depende del criterio del jefe.", "j": "Es incorrecta. Consultar al superior parece prudente, pero la regla del punto ya define quién tiene prelación y el art. 209 de la Constitución Política exige imparcialidad; trasladar la decisión al supervisor no corresponde a un caso ya resuelto por la regla. Error de competencia.", "tipo": "competencia"}, {"t": "Atenderlo de inmediato, porque el principio de celeridad obliga a despachar primero a quien manifiesta prisa.", "j": "Es incorrecta. La celeridad figura en la Constitución Política, art. 209, pero se refiere a la agilidad del servicio para todos y no a preferir a quien la pide; aplicarla así desconoce la igualdad e imparcialidad del mismo artículo. Error de norma.", "tipo": "norma"}, {"t": "Mantener el orden de turnos, conforme a los principios de igualdad e imparcialidad de la función administrativa.", "j": "Es correcta. La Constitución Política, art. 209, funda la función administrativa en los principios de igualdad e imparcialidad; el compañero no acredita prelación y adelantarlo favorecería a un conocido frente a los turnos 39 a 46.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M079", "norma": "Constitución Política de Colombia", "articulo": "art. 209", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#209", "fecha": "2026-10-26"}]}, {"id": "C-E03-003-1", "caso_id": "C-E03-003", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 3", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Marta Quiroga, Facilitadora IV del punto de atención móvil que la Dirección Seccional de Impuestos de Río Alto instaló el 9 de mayo en la plaza de mercado, recibe en una hora tres consultas: una sobre el gravamen a los movimientos financieros, otra sobre el impuesto nacional a la gasolina y al ACPM, y otra sobre el impuesto de vehículos que cobra el departamento. La campaña atiende solo asuntos de la entidad y el formato de atención exige marcar, antes del cierre de las 2:00 p. m., cuáles consultas se registran como propias.", "enunciado": "¿Qué consultas debe registrar Marta como propias de la DIAN en el formato?", "opciones": [{"t": "La del gravamen a los movimientos financieros y la del impuesto nacional a la gasolina, porque ambos son tributos nacionales.", "j": "Es correcta. El Decreto 1742 de 2020, art. 3, num. 1, encarga a la DIAN administrar el gravamen a los movimientos financieros y el impuesto nacional a la gasolina y al ACPM, ambos tributos del orden nacional; el impuesto de vehículos lo cobra el departamento y no figura entre esas funciones.", "tipo": null}, {"t": "La del gravamen a los movimientos financieros, porque nace de una operación bancaria del contribuyente.", "j": "Es incorrecta. Es plausible porque el gravamen sí figura en el Decreto 1742 de 2020, art. 3, num. 1, pero omite el impuesto nacional a la gasolina y al ACPM, que la misma norma incluye entre los tributos que administra la DIAN. Error de completitud.", "tipo": "completitud"}, {"t": "Las tres consultas, porque la campaña registra todo tributo que pague el contribuyente en la plaza.", "j": "Es incorrecta. Es plausible porque las tres consultas tratan de impuestos, pero el Decreto 1742 de 2020, art. 3, num. 1, limita la función de la DIAN a los impuestos del orden nacional cuya competencia no esté asignada a otras entidades; el de vehículos lo cobra el departamento. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M097", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#3", "fecha": "2026-10-26"}]}, {"id": "C-E04-007-1", "caso_id": "C-E04-007", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional. Desde el 1 de agosto de 2026 el grupo produce en medio electrónico las actas de comité de seguimiento, que forman la subserie Actas de Comité. Al revisar la TRD vigente usted encuentra ese tipo documental con su código, sus tiempos de retención y su disposición final. La coordinadora le pide informar qué requisito del documento electrónico de archivo falta atender en la TRD antes de conformar los expedientes de la subserie.", "enunciado": "¿Qué debe informar usted a la coordinadora sobre el registro en la TRD?", "opciones": [{"t": "Que el formato electrónico de las actas se registra en la TRD al transferirlas al archivo central.", "j": "Es incorrecta. Es plausible porque la transferencia es un momento de control documental, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, vincula el registro del formato a la conformación de los expedientes, que ocurre desde la producción. Error de fase.", "tipo": "fase"}, {"t": "Que la TRD debe registrar el formato electrónico de las actas para conformar sus expedientes.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, establece que quienes produzcan documentos por medios electrónicos deben registrar en las TRD los formatos electrónicos de los tipos documentales, para la conformación de los expedientes, series o subseries.", "tipo": null}, {"t": "Que basta con almacenar las actas en medio electrónico durante todo su ciclo de vida.", "j": "Es incorrecta. Parece suficiente porque el artículo también exige el almacenamiento electrónico durante el ciclo de vida, pero el Acuerdo AGN 001 de 2024, art. 4.1.4, pide además registrar en la TRD los formatos de los tipos documentales. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E03-009-1", "caso_id": "C-E03-009", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Ley 599 de 2000, art. 434B", "integra": ["GESTION DOCUMENTAL"], "caso": "Ramiro Vélez, Facilitador IV de correspondencia de la Dirección Seccional de Impuestos de Cerro Azul, radica el 20 de octubre un escrito anónimo con el número 2026-9031. El escrito afirma que la sociedad Comercial Andina del Llano S.A.S. incluyó en su declaración de renta facturas de proveedores que no existen, para pagar menos impuesto, y anexa copia de tres facturas. El procedimiento exige registrar el asunto con una descripción que no califique los hechos y repartirlo en dos días hábiles a la dependencia de la función que corresponda.", "enunciado": "¿Cómo debe registrar y repartir Ramiro el escrito?", "opciones": [{"t": "Registrarlo como posible inclusión de costos inexistentes y repartirlo a la dependencia de fiscalización.", "j": "Es correcta. La Ley 599 de 2000, art. 434B, menciona la inclusión de costos o gastos inexistentes en una declaración, y el Decreto 1742 de 2020, art. 3, num. 1, asigna a la DIAN la fiscalización del impuesto de renta; describir el hecho como posible y repartirlo cumple el procedimiento sin calificar.", "tipo": null}, {"t": "Registrarlo como queja general y archivarlo hasta que la sociedad presente una corrección de su declaración.", "j": "Es incorrecta. Parece prudente porque no califica los hechos, pero detiene el reparto que el procedimiento exige en dos días; la verificación es fiscalización, función que el Decreto 1742 de 2020, art. 3, asigna a la DIAN y que ocurre después del reparto. Error de fase.", "tipo": "fase"}, {"t": "Registrarlo como evasión comprobada y comunicar a la sociedad la sanción penal que le corresponde.", "j": "Es incorrecta. Retoma la conducta de la Ley 599 de 2000, art. 434B, pero da por comprobado un hecho y anuncia una sanción, decisiones que no corresponden a correspondencia; el procedimiento pide describir sin calificar. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M100", "norma": "Ley 599 de 2000 (Código Penal)", "articulo":
