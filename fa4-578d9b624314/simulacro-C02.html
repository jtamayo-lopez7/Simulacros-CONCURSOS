<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-FA4-C02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>

<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-FA4-C02", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Facilitador IV, nivel asistencial, OPEC 236902", "empleo_corto": "Facilitador IV", "nivel_txt": "asistencial", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 300, "funcionales": 206}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-26", "semilla": 236904, "corte_normativo": "2026-10-26"}, "pjs": [{"id": "C-E01-011-1", "caso_id": "C-E01-011", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.9", "integra": ["OFIMATICA"], "caso": "El 2 de enero, primer día hábil del año, el Facilitador IV Ricardo León, del grupo de apoyo administrativo de una Dirección Seccional, debe numerar tres resoluciones firmadas esa mañana. El último acto del año anterior quedó con el número 1874, y la herramienta automatizada de numeración propone el 1875 para el primero. A media mañana la herramienta deja de responder y soporte técnico calcula que volverá a funcionar en dos días. El jefe necesita las resoluciones numeradas hoy para enviar las citaciones correspondientes.", "enunciado": "¿Cómo debe numerar el facilitador las resoluciones?", "opciones": [{"t": "Esperar a que la herramienta opere y numerar entonces las tres resoluciones en el orden en que se firmaron.", "j": "Es incorrecta. Es plausible porque evita registros paralelos, pero el art. 4.2.9 del Acuerdo AGN 001 de 2024 admite sistemas manuales, y esperar retrasa la citación, que debe enviarse dentro de los cinco días siguientes a la expedición (Ley 1437 de 2011, art. 68). Error de fase.", "tipo": "fase"}, {"t": "Iniciar en el número 1 en un registro manual y seguir el orden consecutivo, que luego se refleja en la herramienta.", "j": "Es correcta. Acuerdo AGN 001 de 2024, art. 4.2.9: la numeración de los actos es consecutiva y desde el 1 de enero de cada año se inicia en el número uno, con sistemas manuales, mecánicos o automatizados. El registro manual permite numerar hoy y cumplir el envío de citaciones (Ley 1437 de 2011, art. 68).", "tipo": null}, {"t": "Seguir desde el 1875 en un registro manual y cargar esos números en la herramienta cuando vuelva a operar.", "j": "Es incorrecta. Es plausible porque conserva el orden de la serie anterior, pero el art. 4.2.9 del Acuerdo AGN 001 de 2024 manda iniciar la numeración desde el número uno a partir del 1 de enero de cada año. Usa como unidad un consecutivo de varios años. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M023", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.9", "fecha": "2026-10-26"}, {"fila": "M067", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 68", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#68", "fecha": "2026-10-26"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.4", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Diana Castro, Facilitadora IV del Grupo de Correspondencia de una Dirección Seccional, clasifica en el sistema de gestión documental los documentos del 18 de julio. Uno es un oficio producido por la División de Gestión de Fiscalización que solicita información a un tercero y que hará parte de la subserie Programas de Fiscalización. El sistema muestra campos para el código de sección, serie y subserie. Un compañero le propone registrar como código el nombre del tercero, porque así el oficio aparece más rápido en las búsquedas del grupo.", "enunciado": "¿Con qué criterio debe Diana clasificar el oficio en el sistema?", "opciones": [{"t": "Con el código que le asigne la dependencia productora al archivarlo, cuando termine el trámite.", "j": "Es incorrecta. Es plausible porque la dependencia productora conforma el expediente, pero la clasificación conforme al CCD se hace desde el registro del documento y no se aplaza al archivo final (Acuerdo AGN 001 de 2024, art. 4.3.1.4). Error de fase.", "tipo": "fase"}, {"t": "Con el código del Grupo de Correspondencia, porque es la dependencia que registra el oficio.", "j": "Es incorrecta. Es plausible porque Correspondencia es quien opera el sistema, pero el art. 4.3.1.4 del Acuerdo AGN 001 de 2024 clasifica conforme a la estructura orgánico-funcional de quien produce, aquí la División de Gestión de Fiscalización. Error de competencia: toma la dependencia equivocada.", "tipo": "competencia"}, {"t": "Con el código de la sección de Fiscalización y de la subserie Programas de Fiscalización del CCD.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.4, ordena clasificar conforme a la estructura orgánico-funcional y codificar secciones, series y subseries según el CCD; el oficio lo produjo la División de Gestión de Fiscalización para la subserie Programas de Fiscalización.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E01-016-1", "caso_id": "C-E01-016", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 42", "integra": ["GESTION DOCUMENTAL"], "caso": "En el grupo de apoyo administrativo de una Dirección Seccional, la Facilitadora IV Carolina Pardo revisa la lista de chequeo documental de un proyecto de resolución antes de pasarlo a firma. En la actuación 2026-0619, Alimentos del Cauca S.A.S. pidió el 5 de mayo renovar el permiso de uso de la cafetería de la sede, y el 20 de mayo Logística Ruta Norte Ltda., reconocida como tercero, pidió oportunamente un pronunciamiento sobre la garantía del permiso. El proyecto analiza las pruebas y decide solo la renovación. La lista exige anotar observaciones sobre el contenido de la decisión.", "enunciado": "¿Qué observación debe registrar la facilitadora en la lista de chequeo?", "opciones": [{"t": "Que la petición del tercero puede atenderse en un acto posterior, después de notificar el proyectado.", "j": "Es incorrecta. Es plausible porque parece agilizar la renovación, pero el art. 42 de la Ley 1437 de 2011 ordena que la decisión resuelva todas las peticiones oportunas en el mismo acto. Traslada a otra etapa lo que debe decidirse ahora. Error de fase.", "tipo": "fase"}, {"t": "Que el proyecto no resuelve la petición del tercero reconocido, lo cual debe advertirse antes de la firma.", "j": "Es correcta. Ley 1437 de 2011, art. 42: la decisión, que será motivada, resolverá todas las peticiones planteadas oportunamente dentro de la actuación por el peticionario y por los terceros reconocidos. El proyecto omite la petición de Logística Ruta Norte Ltda.", "tipo": null}, {"t": "Que el proyecto cumple, porque está motivado en las pruebas y resuelve la solicitud de renovación de quien inició el trámite.", "j": "Es incorrecta. Es plausible porque la motivación con pruebas es un requisito del art. 42 de la Ley 1437 de 2011, pero el mismo artículo exige resolver también las peticiones de los terceros reconocidos. Verifica solo una parte de los requisitos. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M060", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 42", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#42", "fecha": "2026-10-26"}]}, {"id": "C-E01-002-1", "caso_id": "C-E01-002", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 76", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, la Facilitadora IV Marcela Ríos recibe a Óscar Pineda, quien trae por escrito un recurso de reposición contra la Resolución 1123, expedida el 14 de abril y notificada personalmente al señor Pineda el 2 de mayo. Según el calendario de la seccional, hoy corresponde al octavo día hábil posterior a esa diligencia. El usuario está inquieto porque un conocido le dijo que el plazo corría desde la firma del acto. La radicación debe quedar dirigida a la dependencia que expidió la resolución.", "enunciado": "¿Qué debe informar la facilitadora al usuario mientras radica el escrito?", "opciones": [{"t": "Que el escrito llega dentro de los diez días siguientes a la notificación personal, de modo que está en término.", "j": "Es correcta. Ley 1437 de 2011, art. 76: los recursos de reposición y apelación se interponen por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella. El escrito llega el octavo día hábil después de la notificación del 2 de mayo, de modo que está en término.", "tipo": null}, {"t": "Que el término para recurrir es de cinco días desde la notificación, por lo que el escrito resulta tardío.", "j": "Es incorrecta. Es plausible porque el plazo de cinco días aparece en la citación y en el aviso (arts. 68 y 69), pero el art. 76 de la Ley 1437 de 2011 fija diez días para interponer los recursos. Confunde plazos de etapas distintas. Error de norma.", "tipo": "norma"}, {"t": "Que el plazo de diez días se cuenta desde la expedición del acto, por lo que el escrito llega fuera de término.", "j": "Es incorrecta. Es plausible porque la fecha de expedición aparece en el acto y el usuario la menciona, pero el art. 76 de la Ley 1437 de 2011 cuenta los diez días desde la notificación, no desde la firma. Toma una base de conteo equivocada. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M070", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 76", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#76", "fecha": "2026-10-26"}, {"fila": "M066", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 67", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#67", "fecha": "2026-10-26"}]}, {"id": "C-E05-006-1", "caso_id": "C-E05-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 13", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, la Facilitadora IV Paola Herrera recibe el escrito de Jorge Villa, radicado con el número 2026-0815. En él pide información sobre los requisitos para solicitar una cita presencial y, además, formula una queja por el trato que recibió en la fila del 3 de febrero. El escrito no menciona el derecho de petición ni cita norma alguna. Un compañero sugiere registrarlo como comunicación informativa sin término de respuesta. El sistema obliga a escoger la tipología al radicar.", "enunciado": "¿Cómo debe clasificar Paola el escrito en el sistema de correspondencia?", "opciones": [{"t": "Como queja, sin registrar la solicitud de información que el escrito también trae", "j": "Es incorrecta. Es plausible porque la queja es la parte más visible, pero el art. 13 de la Ley 1437 de 2011 reconoce ambas actuaciones como modalidades del derecho de petición; registrar solo una deja sin trámite la otra. Error de completitud.", "tipo": "completitud"}, {"t": "Como comunicación informativa, porque el ciudadano no invocó el derecho de petición", "j": "Es incorrecta. Es plausible porque el escrito no nombra el derecho, pero la Ley 1437 de 2011, art. 13, señala que no es necesario invocarlo; el compañero aplica una exigencia que la norma descarta. Error de norma.", "tipo": "norma"}, {"t": "Como derecho de petición que contiene una solicitud de información y una queja", "j": "Es correcta. La Ley 1437 de 2011, art. 13 (modificado por la Ley 1755 de 2015), establece que toda actuación que inicie una persona ante las autoridades implica el ejercicio del derecho de petición sin necesidad de invocarlo, y que mediante él se puede requerir información y formular quejas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M049", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 13", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#13", "fecha": "2026-10-26"}]}, {"id": "C-E05-009-1", "caso_id": "C-E05-009", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 19", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Mónica Salas, Facilitadora IV del grupo de apoyo administrativo de una Dirección Seccional, recibe el 9 de septiembre el radicado 2026-2984 de la sociedad ficticia Granos del Valle S.A.S. La sociedad pide otra vez una autorización que le fue negada el 20 de junio porque no acreditó la experiencia exigida. Ahora adjunta las certificaciones de experiencia que faltaban y no discute la decisión de junio. Un compañero propone contestar con copia de la respuesta de junio. La coordinadora decide el fondo; Mónica solo debe clasificar el radicado antes de entregarlo.", "enunciado": "¿Cómo debe clasificar Mónica el radicado antes de entregarlo a la coordinadora?", "opciones": [{"t": "Como petición reiterativa ya resuelta, para remitirse a la respuesta enviada en junio", "j": "Es incorrecta. Es plausible porque la sociedad repite lo pedido, pero el art. 19 de la Ley 1437 de 2011 exceptúa de la remisión a respuestas anteriores las peticiones negadas por no acreditar requisitos cuando la nueva los subsana; aplica la regla sin su excepción. Error de completitud.", "tipo": "completitud"}, {"t": "Como petición nueva que subsana el requisito negado, sin remitirse a la respuesta anterior", "j": "Es correcta. La Ley 1437 de 2011, art. 19 (modificado por la Ley 1755 de 2015), permite remitirse a respuestas anteriores en peticiones reiterativas, salvo que se trate de peticiones negadas por no acreditar requisitos, siempre que en la nueva se subsane; la sociedad aportó la experiencia que faltaba.", "tipo": null}, {"t": "Como recurso contra la negativa de junio, para enviarlo al superior del funcionario que la firmó", "j": "Es incorrecta. Es plausible porque el escrito se relaciona con una decisión negativa, pero no la controvierte: aporta el requisito que faltaba y vuelve a pedir, que es el supuesto de nueva petición que subsana previsto en el art. 19 de la Ley 1437 de 2011; tratarlo como recurso lo desvía a un trámite y a un servidor que no corresponden a esa nueva petición. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M054", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E07-001-1", "caso_id": "C-E07-001", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.5", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Andrés, Facilitador IV de la ventanilla de una Dirección Seccional, recibe el 3 de marzo de 2026 una petición escrita de la señora Lucía Pardo sobre la devolución de un saldo a favor. La radica con el número 2026-ER-004517 en el sistema de correspondencia y verifica que el asunto corresponde a la subserie Devoluciones y Compensaciones de la TRD del grupo. Un compañero le sugiere guardar la copia impresa en la carpeta de peticiones de ventanilla, porque el registro en el sistema ya deja constancia. El expediente de la peticionaria está abierto en el archivo de gestión.", "enunciado": "Para archivar correctamente el documento recibido, ¿qué debe hacer Andrés?", "opciones": [{"t": "Incluir la petición en el expediente de la subserie que fija la TRD, aunque conste en el sistema", "j": "Es correcta. El parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 ordena que las peticiones presentadas por ciudadanos, sin importar que estén registradas en sistemas manuales o automatizados, se incluyan en el expediente de la serie o subserie según la TRD; aquí es la subserie Devoluciones y Compensaciones, con expediente abierto.", "tipo": null}, {"t": "Guardar el documento en la carpeta de ventanilla hasta su respuesta y luego llevarlo al expediente", "j": "Es incorrecta. Es plausible porque el documento termina en el expediente, pero aplaza la inclusión a una etapa posterior y mientras tanto lo deja fuera de la serie o subserie que fija la TRD, contra el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Error de fase.", "tipo": "fase"}, {"t": "Dejar la petición registrada en el sistema de correspondencia como constancia suficiente del trámite", "j": "Es incorrecta. Es plausible porque el radicado prueba la recepción, pero el registro en un sistema automatizado no reemplaza la inclusión en el expediente que exige el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Resuelve solo el registro y omite la conformación del expediente. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M020", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E05-003-1", "caso_id": "C-E05-003", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.8", "integra": ["GESTION DOCUMENTAL"], "caso": "Sandra Ruiz, Facilitadora IV del archivo de gestión de la División de Gestión de Cobranzas de una Dirección Seccional, conforma el expediente de una facilidad de pago de la sociedad ficticia Textiles Mirador S.A.S. Tiene cuatro documentos: la solicitud radicada el 3 de marzo, el requerimiento de garantías del 10 de marzo, la respuesta de la sociedad del 18 de marzo y la resolución que concede la facilidad del 2 de abril. La carpeta ya está clasificada en su subserie. El jefe pide dejar la carpeta lista para la revisión de calidad del viernes.", "enunciado": "¿En qué orden debe Sandra ubicar los documentos dentro de la unidad documental?", "opciones": [{"t": "Agrupados por remitente: primero los de la sociedad y luego los que produjo la entidad", "j": "Es incorrecta. Es plausible porque separar por remitente parece ordenado, pero el principio de orden original (Acuerdo AGN 001 de 2024, art. 4.3.1.8, num. 2) toma como base la secuencia del trámite y no el autor de cada documento. Error de granularidad.", "tipo": "granularidad"}, {"t": "Primero la resolución que concede la facilidad y después los demás, del más reciente al más antiguo", "j": "Es incorrecta. Es plausible porque la resolución es el documento más consultado, pero el art. 4.3.1.8, numeral 2, del Acuerdo AGN 001 de 2024 exige ordenar los tipos de modo que se evidencie el desarrollo del trámite; poner la decisión al inicio invierte las etapas. Error de fase.", "tipo": "fase"}, {"t": "Según la secuencia del trámite: solicitud, requerimiento, respuesta y resolución", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.8, numeral 2, dispone que los tipos documentales se ordenen de forma que se evidencie el desarrollo del trámite (principio de orden original); las fechas del caso muestran esa secuencia.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M029", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.8", "fecha": "2026-10-26"}]}, {"id": "C-E04-003-1", "caso_id": "C-E04-003", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Ley 527 de 1999, art. 12", "integra": ["TABLAS DE RETENCION"], "caso": "Usted es Facilitador IV del grupo de correspondencia de una Dirección Seccional. La serie Comunicaciones Oficiales de la TRD del área tiene un tiempo de retención de dos años en el archivo de gestión. El 20 de mayo de 2026 se migran los correos recibidos del buzón institucional a un nuevo repositorio. En la prueba con el radicado 2026-0815, la herramienta conserva el adjunto en su formato original, pero descarta el encabezado con remitente, destinatario, fecha y hora de recepción. El jefe le pide verificar la migración antes de aprobarla.", "enunciado": "¿Qué debe verificar usted para informar si la migración permite cumplir la conservación de esos mensajes?", "opciones": [{"t": "Que el adjunto abra y pueda consultarse, porque así se conserva lo que contiene el mensaje.", "j": "Es incorrecta. Es plausible porque la accesibilidad es la primera condición de la Ley 527 de 1999, art. 12, pero el artículo exige además conservar el formato y la información de origen, destino, fecha y hora, que la herramienta descarta. Error de completitud.", "tipo": "completitud"}, {"t": "Que se conserven accesibles el adjunto, su formato y los datos de origen, destino, fecha y hora.", "j": "Es correcta. La Ley 527 de 1999, art. 12, numerales 1 a 3, exige que la información sea accesible, que se conserve en su formato o en uno que la reproduzca con exactitud y que se conserve la información sobre origen, destino, fecha y hora del envío o recepción.", "tipo": null}, {"t": "Que el adjunto se convierta a un formato de imagen, para que la serie pueda consultarse fuera del sistema.", "j": "Es incorrecta. Puede parecer útil para la consulta, pero la Ley 527 de 1999, art. 12, numeral 2, pide conservar el formato en que se generó o recibió, o uno que demuestre reproducir con exactitud la información, y la conversión no resuelve la pérdida del encabezado. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M095", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#12", "fecha": "2026-10-26"}]}, {"id": "C-E02-005-1", "caso_id": "C-E02-005", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 1.3.2", "integra": ["TABLAS DE RETENCION"], "caso": "Hernán Gil, Facilitador IV del archivo de gestión del Grupo de Cobranzas de una Dirección Seccional, recibe el 2 de septiembre la comunicación de su traslado al Grupo de Correspondencia, efectivo desde el 16 de septiembre. En su puesto quedan 140 expedientes de la serie Procesos de Cobro, organizados según el Cuadro de Clasificación Documental. La coordinadora le propone dejar las cajas rotuladas y enviar un correo con la lista de cajas, para no frenar la recepción diaria de documentos del grupo durante esas dos semanas.", "enunciado": "¿Cómo debe Hernán entregar los documentos a su cargo?", "opciones": [{"t": "Mediante el correo con la lista de cajas, porque los expedientes ya están rotulados y ordenados.", "j": "Es incorrecta. Es plausible porque las cajas rotuladas permiten ubicar los expedientes, pero una lista de cajas no es el inventario documental conforme al CCD que exige el art. 1.3.2 del Acuerdo AGN 001 de 2024. Error de completitud: cumple la entrega solo en parte.", "tipo": "completitud"}, {"t": "Mediante inventario documental elaborado desde el nuevo grupo, cuando ya haya asumido el cargo.", "j": "Es incorrecta. Es plausible porque usa el inventario que pide la norma, pero el art. 1.3.2 del Acuerdo AGN 001 de 2024 liga la entrega al momento del traslado para no interrumpir la gestión; hacerlo después deja los expedientes sin responsable. Error de fase.", "tipo": "fase"}, {"t": "Mediante inventario documental conforme al Cuadro de Clasificación, antes de que rija el traslado.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 1.3.2, ordena que el servidor trasladado entregue los documentos mediante inventarios documentales conforme al CCD para garantizar la continuidad de la gestión, en concordancia con la responsabilidad del servidor sobre los documentos (Ley 594 de 2000, art. 4, lit. d).", "tipo": null}], "clave": 2, "soporte": [{"fila": "M012", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 1.3.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#1.3.2", "fecha": "2026-10-26"}, {"fila": "M001", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#4", "fecha": "2026-10-26"}]}, {"id": "C-E03-007-1", "caso_id": "C-E03-007", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Comprender", "fuente": "Ley 599 de 2000, art. 319", "integra": ["OFIMATICA"], "caso": "Natalia Gómez, Facilitadora IV del grupo de apoyo administrativo de la Dirección Seccional de Aduanas de Puerto Claro, ajusta el 2 de octubre la plantilla de hoja de cálculo que el equipo usa en los operativos para inventariar mercancías retenidas. La jefe del grupo le pide crear una columna que exprese la cuantía en la misma unidad que usa el tipo penal de contrabando, para que el área competente compare sin conversiones. La plantilla ya trae columnas en pesos y en dólares, y debe quedar lista antes del operativo del 6 de octubre.", "enunciado": "¿Qué unidad y referencia debe registrar Natalia en la nueva columna?", "opciones": [{"t": "Salarios mínimos mensuales legales vigentes, con referencia a una cuantía de cien o más.", "j": "Es incorrecta. Acierta con la unidad, pero toma el umbral de cien salarios mínimos de la Ley 599 de 2000, art. 434B, que describe la defraudación o evasión tributaria y no el contrabando del art. 319. Error de norma.", "tipo": "norma"}, {"t": "Valor aduanero por unidad de mercancía, con referencia al precio de cada artículo.", "j": "Es incorrecta. Es plausible porque el art. 319 de la Ley 599 de 2000 menciona el valor aduanero, pero lo usa para la multa; la cuantía de la conducta se mide en salarios mínimos sobre el total de las mercancías y no por artículo. Error de granularidad.", "tipo": "granularidad"}, {"t": "Salarios mínimos legales mensuales, con referencia a una cuantía superior a cincuenta.", "j": "Es correcta. La Ley 599 de 2000, art. 319, expresa la cuantía del contrabando en salarios mínimos legales mensuales y la fija en más de cincuenta; la columna replica esa unidad para que el área competente compare sin convertir.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M099", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 319", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#319", "fecha": "2026-10-26"}]}, {"id": "C-E04-011-1", "caso_id": "C-E04-011", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 8", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Usted es Facilitador IV del punto de atención de una Dirección Seccional. El 11 de mayo de 2026 la señora Patricia Gil solicita el original de la resolución que resolvió su recurso, expedida el 28 de abril con firma electrónica del funcionario competente. El sistema muestra que el documento no ha cambiado desde su firma y que puede verse en pantalla o descargarse. La usuaria insiste en que solo acepta una copia en papel con sello como original. Usted debe explicarle en qué condiciones el documento electrónico sirve como original.", "enunciado": "¿Qué debe explicar usted a la usuaria sobre el carácter de original de la resolución?", "opciones": [{"t": "Que el documento sirve como original porque puede mostrarse en pantalla y descargarse.", "j": "Es incorrecta. Es plausible porque el literal b de la Ley 527 de 1999, art. 8, exige que la información pueda mostrarse, pero el literal a pide además una garantía confiable de integridad desde su forma definitiva. Error de completitud.", "tipo": "completitud"}, {"t": "Que sirve como original si hay garantía confiable de su integridad y puede mostrarse a la usuaria.", "j": "Es correcta. La Ley 527 de 1999, art. 8, establece que el requisito de original queda satisfecho con un mensaje de datos si existe garantía confiable de que se conservó la integridad desde su forma definitiva y si puede mostrarse a la persona a quien se deba presentar.", "tipo": null}, {"t": "Que el original es la copia impresa con sello y firma manuscrita que expida la entidad.", "j": "Es incorrecta. Resulta plausible por la costumbre del papel sellado, pero la Ley 527 de 1999, art. 8, da al mensaje de datos el valor de original cuando cumple sus condiciones; el criterio de la opción no es el que fija la norma aplicable. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M094", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E07-017-1", "caso_id": "C-E07-017", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Comprender", "fuente": "Ley 594 de 2000, art. 24", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Teresa, Facilitadora IV del punto de atención de una Dirección Seccional, recibe a un practicante que organiza las comunicaciones de 2026 en carpetas por mes, porque considera que la TRD es una guía opcional de la oficina de archivo. Entre los documentos hay 14 peticiones de ciudadanos radicadas en el sistema y 9 oficios enviados por el punto de atención. La coordinadora le pide a Teresa explicarle al practicante cómo deben quedar archivados esos documentos antes del cierre de la vigencia, cuando se hará la revisión del archivo de gestión.", "enunciado": "¿Qué debe explicar Teresa al practicante?", "opciones": [{"t": "Que las peticiones van al expediente de su subserie y los oficios pueden quedar por mes", "j": "Es incorrecta. Es plausible porque acierta con las peticiones, pero deja fuera los oficios enviados; el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 incluye también las comunicaciones oficiales enviadas. Error de completitud.", "tipo": "completitud"}, {"t": "Que la TRD es obligatoria y peticiones y oficios van al expediente de su serie o subserie", "j": "Es correcta. El art. 24 de la Ley 594 de 2000 hace obligatorio que las entidades del Estado elaboren y adopten la TRD, y el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024 ordena incluir las comunicaciones enviadas o recibidas y las peticiones en el expediente de la serie o subserie según la TRD.", "tipo": null}, {"t": "Que la TRD es obligatoria y las carpetas por mes cumplen si cada una lleva el nombre de la serie", "j": "Es incorrecta. Es plausible porque reconoce la obligatoriedad del art. 24 de la Ley 594 de 2000, pero agrupar por mes no conforma el expediente de la serie o subserie que exige el parágrafo del art. 4.2.5 del Acuerdo AGN 001 de 2024. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M007", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 24", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#24", "fecha": "2026-10-26"}, {"fila": "M020", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E01-012-1", "caso_id": "C-E01-012", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 65", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "La Facilitadora IV Liliana Correa, del grupo de correspondencia de una Dirección Seccional, recibe dos actos firmados el 9 de julio para distribuir. La Resolución 0081 fija nuevas reglas de turnos y horarios para todas las personas que acudan a los puntos de atención de la seccional. La Resolución 0082 niega a Construcciones Puerto Alto S.A.S. una solicitud de facilidad de pago radicada con el número 2026-ER-011907. El formato de distribución obliga a escoger, para cada acto, el canal por el que produce efectos frente a sus destinatarios.", "enunciado": "¿Cómo debe clasificar la facilitadora cada acto en el formato?", "opciones": [{"t": "Ambos se envían a notificación personal, porque los dos fueron firmados por la misma autoridad seccional.", "j": "Es incorrecta. Es plausible porque ambos salen de la misma dependencia, pero los arts. 65 y 66 de la Ley 1437 de 2011 distinguen por el carácter del acto: el general se publica y el particular se notifica. Clasifica por autor y no por destinatario. Error de granularidad.", "tipo": "granularidad"}, {"t": "El de la empresa se envía a notificación y el de turnos rige desde su firma, sin otro trámite de difusión.", "j": "Es incorrecta. Es plausible porque acierta con el acto particular, pero el art. 65 de la Ley 1437 de 2011 dispone que los actos de carácter general no son obligatorios mientras no se publiquen. Omite la publicación. Error de completitud.", "tipo": "completitud"}, {"t": "El de turnos se remite para publicación en el Diario Oficial y el de la empresa se envía a notificación.", "j": "Es correcta. Ley 1437 de 2011, arts. 65 y 66: los actos de carácter general no son obligatorios mientras no se publiquen en el Diario Oficial o en las gacetas territoriales, y los de carácter particular deben notificarse. La Resolución 0081 es general y la 0082, particular.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M064", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 65", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#65", "fecha": "2026-10-26"}, {"fila": "M065", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 66", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#66", "fecha": "2026-10-26"}]}, {"id": "C-E05-005-1", "caso_id": "C-E05-005", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.2", "integra": ["MISIONALIDAD DE LA DIAN"], "caso": "Diana Céspedes, Facilitadora IV de correspondencia de una Dirección Seccional, organiza documentos recogidos durante un traslado de oficinas. Halla 15 informes de visitas de control a establecimientos producidos y firmados por funcionarios de la División de Gestión de Fiscalización, aunque estaban en un estante del Grupo de Documentación. El jefe de ese grupo sugiere archivarlos en sus propias series para no demorar el inventario, que vence el 30 de junio. La estructura orgánico-funcional vigente asigna las visitas de control a Fiscalización. Diana debe registrar la agrupación de cada informe en el inventario.", "enunciado": "¿A qué agrupación documental debe asignar Diana los informes al organizarlos?", "opciones": [{"t": "A una carpeta de documentos varios, mientras pasa la fecha de entrega del inventario", "j": "Es incorrecta. Es plausible porque evita retrasar el inventario, pero difiere la organización y crea una agrupación ajena a la estructura orgánico-funcional que exige el Acuerdo AGN 001 de 2024, art. 4.3.1.2. Error de fase.", "tipo": "fase"}, {"t": "A la sección de Fiscalización, oficina que los produjo en ejercicio de sus funciones", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.2, ordena respetar el principio de procedencia para determinar, desde la estructura orgánico-funcional, la oficina que produce los documentos en desarrollo de sus funciones; las visitas de control son función de Fiscalización.", "tipo": null}, {"t": "A las series del Grupo de Documentación, donde estaban al momento del traslado", "j": "Es incorrecta. Es plausible porque allí estaban físicamente y así se agiliza el inventario, pero el Acuerdo AGN 001 de 2024, art. 4.3.1.2, determina la procedencia por la oficina que produce los documentos en desarrollo de sus funciones, no por el lugar de hallazgo. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M024", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.2", "fecha": "2026-10-26"}]}, {"id": "C-E01-015-1", "caso_id": "C-E01-015", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 77", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "A la ventanilla de una Dirección Seccional llega por correo certificado un escrito de reposición contra la Resolución 0659, firmado por la abogada Teresa Lozano. El Facilitador IV Esteban Mora verifica en el expediente 2026-0442 que la abogada fue reconocida como apoderada de Óptica Visión Central Ltda. mediante auto del 3 de junio. El escrito llegó dentro del término, pero no trae sello de presentación personal ante notario, y un compañero sugiere devolverlo. El acto lo expidió la jefa de una división de la seccional.", "enunciado": "¿Qué trámite debe dar el facilitador al escrito?", "opciones": [{"t": "Radicarlo sin exigir presentación personal y remitirlo al superior inmediato de la jefa que expidió el acto.", "j": "Es incorrecta. Es plausible porque el superior conoce de la apelación, pero el art. 74, num. 1, de la Ley 1437 de 2011 asigna la reposición a quien expidió la decisión. Envía el escrito a una autoridad equivocada. Error de competencia.", "tipo": "competencia"}, {"t": "Radicarlo sin exigir presentación personal y remitirlo a la jefa que expidió el acto, ante quien se tramita.", "j": "Es correcta. Ley 1437 de 2011, arts. 77 y 74: el escrito del recurso no requiere presentación personal si quien lo presenta ha sido reconocido en la actuación, y la reposición se interpone ante quien expidió la decisión.", "tipo": null}, {"t": "Devolverlo para que la apoderada lo presente en persona y luego remitirlo a la jefa que expidió el acto.", "j": "Es incorrecta. Es plausible porque la presentación personal se exige en otros trámites, pero el art. 77 de la Ley 1437 de 2011 dispensa de ella a quien ha sido reconocido en la actuación, como la apoderada. Impone un requisito que la norma no prevé. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M071", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 77", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#77", "fecha": "2026-10-26"}, {"fila": "M069", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 74", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#74", "fecha": "2026-10-26"}]}, {"id": "C-E04-002-1", "caso_id": "C-E04-002", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Aplicar", "fuente": "Ley 527 de 1999, art. 8", "integra": ["GESTION DOCUMENTAL"], "caso": "Usted es Facilitador IV del archivo de gestión de una Dirección Seccional. Para un expediente se requiere conservar en su forma original un certificado electrónico que el contribuyente Comercial Andina S.A.S. generó en forma definitiva el 10 de abril de 2026. Llegan dos archivos: el del 12 de abril trae un código de verificación que coincide con el registrado al generarse; el del 14 de abril fue guardado de nuevo por el remitente con anotaciones y su código ya no coincide. Ambos pueden mostrarse en pantalla. Usted debe incorporar uno solo al expediente electrónico.", "enunciado": "¿Cuál archivo debe registrar usted como original en el expediente y con qué fundamento?", "opciones": [{"t": "El del 14 de abril, y verificar su código de integridad cuando se cierre el expediente.", "j": "Es incorrecta. Parece razonable porque prevé una verificación, pero la Ley 527 de 1999, art. 8, exige la garantía de integridad para tener el mensaje como original y esa verificación debe hacerse al incorporarlo, no al cierre; además el código ya no coincide. Error de fase.", "tipo": "fase"}, {"t": "El del 14 de abril, porque es la versión más reciente y puede mostrarse a quien la solicite.", "j": "Es incorrecta. Es plausible porque la versión reciente suele ser la vigente y cumple el literal b de la Ley 527 de 1999, art. 8, pero falta la garantía de integridad del literal a, pues el código ya no coincide. Error de completitud.", "tipo": "completitud"}, {"t": "El del 12 de abril, porque existe garantía confiable de integridad desde su forma definitiva.", "j": "Es correcta. La Ley 527 de 1999, art. 8, literal a, exige una garantía confiable de que se conservó la integridad de la información desde que se generó por primera vez en su forma definitiva, y el literal b, que pueda mostrarse; el archivo del 12 de abril cumple ambas condiciones.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M094", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E02-011-1", "caso_id": "C-E02-011", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.1.4", "integra": ["TABLAS DE RETENCION"], "caso": "El Grupo de Devoluciones de una Dirección Seccional definió que, desde el 1 de julio de 2026, el tipo documental Concepto de verificación se producirá en formato electrónico y no en papel. La Facilitadora IV Carolina Vega, del archivo de gestión, revisa la Tabla de Retención Documental vigente y observa que la subserie Solicitudes de Devolución describe ese tipo documental en soporte papel. Su jefe le pide informar qué debe quedar registrado para que los expedientes de la subserie se conformen con los nuevos documentos.", "enunciado": "¿Qué debe informar Carolina a su jefe?", "opciones": [{"t": "Que el formato electrónico del tipo documental debe registrarse en la Tabla de Retención.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.1.4, ordena a quien produce documentos por medios electrónicos registrar en la TRD los formatos electrónicos de los tipos documentales para la conformación de los expedientes, series o subseries.", "tipo": null}, {"t": "Que el formato se registra en la Tabla cuando la subserie se transfiera al archivo central.", "j": "Es incorrecta. Es plausible porque señala el registro en la TRD, pero lo aplaza a la transferencia, cuando el art. 4.1.4 del Acuerdo AGN 001 de 2024 lo liga a la decisión de producir electrónicamente y a la conformación de los expedientes. Error de fase.", "tipo": "fase"}, {"t": "Que basta con guardar los conceptos electrónicos en el repositorio del grupo y numerarlos.", "j": "Es incorrecta. Es plausible porque los conceptos quedan almacenados, pero el art. 4.1.4 del Acuerdo AGN 001 de 2024 exige registrar en la TRD los formatos electrónicos de los tipos documentales para conformar los expedientes. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M015", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.1.4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.1.4", "fecha": "2026-10-26"}]}, {"id": "C-E04-001-1", "caso_id": "C-E04-001", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Ley 527 de 1999, art. 6", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Usted es Facilitador IV en la ventanilla de una Dirección Seccional. El 3 de marzo de 2026 la ciudadana Laura Méndez remite por el buzón electrónico habilitado una solicitud de copia de un oficio, con un archivo adjunto que se abre sin dificultad y puede consultarse en el sistema de radicación. El instructivo del área indica que esa clase de solicitud debe constar por escrito. Un compañero propone devolver el mensaje y pedirle que lo presente impreso en la ventanilla física. Usted debe informar a la ciudadana y al compañero cómo se cumple el requisito en este caso.", "enunciado": "¿Qué debe informar usted sobre el cumplimiento del requisito de que la solicitud conste por escrito?", "opciones": [{"t": "El requisito queda cumplido con el mensaje de datos, porque su contenido es accesible para consulta.", "j": "Es correcta. La Ley 527 de 1999, art. 6, dispone que cuando una norma exija que la información conste por escrito, el requisito queda satisfecho con un mensaje de datos si la información es accesible para su posterior consulta, como ocurre con el adjunto que se abre en el sistema.", "tipo": null}, {"t": "Corresponde al facilitador declarar no presentada la solicitud por haber llegado sin soporte en papel.", "j": "Es incorrecta. Resulta plausible porque el facilitador recibe y revisa la solicitud, pero declarar no presentada una petición es una decisión de fondo que no le corresponde al nivel asistencial y, además, la Ley 527 de 1999, art. 6, reconoce el mensaje de datos como escrito. Error de competencia.", "tipo": "competencia"}, {"t": "La solicitud llegó como mensaje de datos y debe presentarse impresa y firmada antes de radicarla.", "j": "Es incorrecta. Es plausible porque muchos instructivos se redactaron pensando en el papel, pero la Ley 527 de 1999, art. 6, da por cumplido el requisito de escrito con el mensaje de datos accesible; exigir la impresión previa ubica el trámite en una etapa que la norma no pide. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M093", "norma": "Ley 527 de 1999 (mensajes de datos y comercio electrónico)", "articulo": "art. 6", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0527_1999.htm#6", "fecha": "2026-10-26"}]}, {"id": "C-E05-008-1", "caso_id": "C-E05-008", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 19", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "La Facilitadora IV Natalia Gómez atiende la ventanilla de correspondencia de una Dirección Seccional. El 4 de agosto llega el radicado 2026-2210 de Hernán Duarte, que dice solamente: «Solicito lo mismo de la vez pasada, por favor». No anexa documentos ni identifica trámite, acto o dependencia, ni explica qué espera recibir. El escrito es cortés, y en el sistema no aparece ninguna petición anterior de esa persona. Su coordinadora, que firma los oficios de salida, le pide clasificar el escrito y proyectar el oficio que corresponda a esa clasificación para su firma.", "enunciado": "¿En qué categoría debe clasificar Natalia el escrito para proyectar el oficio?", "opciones": [{"t": "Petición cuyo objeto no se comprende, que se devuelve para que se aclare en diez días", "j": "Es correcta. La Ley 1437 de 2011, art. 19 (modificado por la Ley 1755 de 2015), dispone que cuando no se comprenda la finalidad u objeto de la petición esta se devolverá al interesado para que la corrija o aclare dentro de los diez días siguientes; el escrito no permite saber qué se pide.", "tipo": null}, {"t": "Petición incompleta, que se devuelve para que el peticionario allegue los anexos faltantes", "j": "Es incorrecta. Es plausible porque el escrito no trae anexos, pero el art. 19 de la Ley 1437 de 2011 prohíbe devolver peticiones por considerarlas incompletas; el problema es que no se entiende el objeto. Error de norma.", "tipo": "norma"}, {"t": "Petición reiterativa, que se responde remitiéndose a la contestación anterior", "j": "Es incorrecta. Es plausible porque el escrito alude a una vez pasada, pero la remisión a respuestas anteriores del art. 19 de la Ley 1437 de 2011 supone una petición ya resuelta, y el sistema no registra ninguna; presupone una etapa que no ocurrió. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M054", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 19", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#19", "fecha": "2026-10-26"}]}, {"id": "C-E04-015-1", "caso_id": "C-E04-015", "caso_pos": 1, "caso_n": 1, "eje": "OFIMATICA", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.5", "integra": ["RAZONAMIENTO CATEGORIAL"], "caso": "Usted es Facilitador IV del grupo de correspondencia de una Dirección Seccional. El área recibe comunicaciones oficiales por la ventanilla física y por el buzón electrónico institucional. Desde el 1 de septiembre de 2026, las electrónicas se controlan en una planilla del sistema con constancia de recepción y alertas, pero las físicas se entregan a las dependencias sin ningún registro de quién las recibe. Una auditoría interna programada para el 30 de octubre le pide clasificar qué canales deben quedar cubiertos por el control y cuáles no lo están hoy.", "enunciado": "¿Qué debe informar usted a la auditoría sobre los canales que debe cubrir el control y su situación actual?", "opciones": [{"t": "Las físicas se controlan en la dependencia cuando registra su respuesta, así que hoy no falta ningún canal.", "j": "Es incorrecta. Parece razonable porque la dependencia registra lo que responde, pero el Acuerdo AGN 001 de 2024, art. 4.2.5, exige constatar la recepción por la persona competente al distribuir, no al responder; por eso hoy sí falta cubrir el canal físico. Error de fase.", "tipo": "fase"}, {"t": "Debe cubrirse solo el buzón electrónico, porque es el único canal que admite alertas automáticas.", "j": "Es incorrecta. Es plausible porque las alertas se asocian con medios automatizados, pero el Acuerdo AGN 001 de 2024, art. 4.2.5, admite sistemas manuales o automatizados y exige constatar la recepción por canales físicos o electrónicos. Error de completitud.", "tipo": "completitud"}, {"t": "Deben cubrirse los canales físico y electrónico; hoy el físico no tiene constancia de recepción.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.5, ordena disponer de sistemas manuales o automatizados que, mediante planillas o formatos electrónicos, permitan constatar la recepción por los canales habilitados, físicos o electrónicos; hoy solo el buzón electrónico tiene esa constancia, de modo que falta cubrir la ventanilla física.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M019", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.5", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.5", "fecha": "2026-10-26"}]}, {"id": "C-E07-004-1", "caso_id": "C-E07-004", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.4.3", "integra": ["OFIMATICA"], "caso": "Sandra, Facilitadora IV del grupo de apoyo administrativo, alista la transferencia primaria de 40 expedientes de la subserie Peticiones, Quejas y Reclamos: 25 en papel y 15 electrónicos, todos cerrados en 2022 y con su tiempo de retención en gestión cumplido según la TRD. Los físicos tienen la hoja de control diligenciada. Los electrónicos están en el repositorio de la dependencia, ordenados por carpetas, pero su índice electrónico no tiene firma. La entrega al archivo central está programada para el 20 de noviembre y el cronograma no admite prórroga.", "enunciado": "¿Qué debe verificar Sandra antes de entregar los expedientes electrónicos?", "opciones": [{"t": "Que el archivo central firme el índice electrónico cuando reciba los expedientes transferidos", "j": "Es incorrecta. Es plausible porque el archivo central recibe y revisa la transferencia, pero el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que el índice firmado acompañe a los expedientes cuando se realiza la transferencia, no que se firme después de recibirlos. Error de fase.", "tipo": "fase"}, {"t": "Que cada expediente electrónico vaya acompañado de su índice electrónico firmado", "j": "Es correcta. El parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 dispone que, al transferir, las unidades documentales vayan con la hoja de control o el índice electrónico firmado; los 15 expedientes electrónicos tienen índice sin firma.", "tipo": null}, {"t": "Que las carpetas del repositorio conserven el orden cronológico de los documentos de cada expediente", "j": "Es incorrecta. Es plausible porque el orden de los documentos es parte de la organización del expediente, pero no suple el requisito que falta: el parágrafo 2 del art. 4.4.3 del Acuerdo AGN 001 de 2024 exige que las unidades documentales vayan con su índice electrónico firmado. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M034", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.4.3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.4.3", "fecha": "2026-10-26"}]}, {"id": "C-E05-018-1", "caso_id": "C-E05-018", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO CATEGORIAL", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.2.9", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "La Facilitadora IV Rosa Quintero lleva el registro de resoluciones del despacho de una Dirección Seccional. La última resolución de 2025 recibió el número 1842 el 30 de diciembre. El 2 de enero de 2026 el director firma la primera resolución del año y, horas después, una segunda. Un compañero propone usar los números 1843 y 1844 para no romper la secuencia; otro sugiere darles a ambas el número 1, con las letras A y B, porque se firmaron el mismo día. Rosa debe dejar el registro listo esa misma tarde.", "enunciado": "¿Qué números debe registrar Rosa para las resoluciones firmadas por el director?", "opciones": [{"t": "Los números 1 y 2 de 2026, en el orden en que el director firmó cada resolución", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.2.9, dispone numerar los actos administrativos de forma consecutiva y reiniciar desde el número uno a partir del 1 de enero de cada año, con sistemas manuales, mecánicos o automatizados.", "tipo": null}, {"t": "El número 1 de 2026 para ambas, con las letras A y B, porque se firmaron el mismo día", "j": "Es incorrecta. Es plausible porque acierta en reiniciar desde el número uno, pero el Acuerdo AGN 001 de 2024, art. 4.2.9, exige numeración consecutiva de los actos: la segunda resolución recibe el número 2, no una variante del 1. Aplica solo una parte de la regla. Error de completitud.", "tipo": "completitud"}, {"t": "Los números 1843 y 1844, para mantener la secuencia de la numeración del año anterior", "j": "Es incorrecta. Es plausible porque conserva el consecutivo, pero el Acuerdo AGN 001 de 2024, art. 4.2.9, ordena reiniciar la numeración desde el número uno a partir del 1 de enero de cada año; toma como base el periodo equivocado. Error de granularidad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M023", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.2.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.2.9", "fecha": "2026-10-26"}]}, {"id": "C-E02-002-1", "caso_id": "C-E02-002", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Comprender", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.9", "integra": ["TABLAS DE RETENCION"], "caso": "Jorge Salas, Facilitador IV del grupo de apoyo administrativo de una Dirección Seccional, revisa el expediente de una solicitud de actualización del RUT radicada el 14 de enero de 2026. La resolución que resolvió la solicitud se notificó el 20 de abril, quedó en firme el 6 de mayo sin recursos y ese día el grupo dio por finalizado el trámite. La Tabla de Retención Documental asigna a esa subserie dos años en el archivo de gestión. El coordinador pide a Jorge que informe a la ventanilla desde qué fecha se cuenta ese tiempo.", "enunciado": "¿Desde qué fecha debe informar Jorge que se cuenta la retención?", "opciones": [{"t": "Desde el cierre del expediente, que procede al finalizar el trámite con la firmeza del 6 de mayo.", "j": "Es correcta. El Acuerdo AGN 001 de 2024, art. 4.3.1.9, dispone que el cierre se hace una vez finalizado el trámite administrativo y que, cerrada la unidad documental, se empiezan a contar los tiempos de retención de la TRD.", "tipo": null}, {"t": "Desde el 14 de enero de 2026, día en que se radicó la solicitud y se abrió el expediente.", "j": "Es incorrecta. Es plausible porque la radicación marca la apertura del expediente, pero el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 cuenta los tiempos de retención desde el cierre de la unidad documental. Error de granularidad: toma una fecha base equivocada para el cómputo.", "tipo": "granularidad"}, {"t": "Desde el 20 de abril, día en que se notificó la resolución que resolvió la solicitud.", "j": "Es incorrecta. Es plausible porque la notificación da a conocer la decisión, pero el trámite no había terminado: faltaba la firmeza, y el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 cuenta la retención desde el cierre, que procede una vez finalizado el trámite. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M030", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.9", "fecha": "2026-10-26"}]}, {"id": "C-E06-012-1", "caso_id": "C-E06-012", "caso_pos": 1, "caso_n": 1, "eje": "SERVICIO Y ATENCION AL USUARIO", "bloom": "Comprender", "fuente": "Ley 1437 de 2011, art. 8", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Carolina Peña, Facilitadora IV del punto de atención de una Dirección Seccional, actualiza la cartelera y la sección de la página electrónica a cargo de su grupo. Ya publicó las normas de competencia, las funciones de cada dependencia, los trámites con sus términos, los actos de carácter general, los documentos exigidos y la localización y horarios de las dependencias. El 23 de octubre un ciudadano le pregunta ante quién presentar una queja por la atención recibida, y Carolina comprueba que esa información no aparece publicada. Su jefe le pide completar la publicación antes del 30 de octubre.", "enunciado": "¿Qué información debe incorporar Carolina en la publicación?", "opciones": [{"t": "Los actos administrativos particulares expedidos en el mes, con su texto completo.", "j": "Es incorrecta. El art. 8 de la Ley 1437 de 2011 incluye actos administrativos, pero solo los de carácter general (num. 4), y no responde al vacío sobre quejas que detectó Carolina. Error de granularidad.", "tipo": "granularidad"}, {"t": "La dependencia y el cargo o nombre del servidor a quien se dirigen quejas y reclamos.", "j": "Es correcta. El num. 7 del art. 8 de la Ley 1437 de 2011 obliga a mantener a disposición del público la dependencia y el cargo o nombre del servidor a quien debe dirigirse en caso de una queja o reclamo.", "tipo": null}, {"t": "La dependencia encargada de atender quejas, sin datos del servidor responsable.", "j": "Es incorrecta. Señala la dependencia, pero el num. 7 del art. 8 de la Ley 1437 de 2011 exige también el cargo o nombre del servidor a quien debe dirigirse la queja. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M048", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 8", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#8", "fecha": "2026-10-26"}]}, {"id": "C-E01-001-1", "caso_id": "C-E01-001", "caso_pos": 1, "caso_n": 1, "eje": "FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 69", "integra": ["GESTION DOCUMENTAL"], "caso": "Julián Cárdenas, Facilitador IV del grupo de correspondencia de una Dirección Seccional, controla la Resolución 0417, que niega a la exservidora Gloria Salcedo el reconocimiento de unas horas extras. La citación para notificación personal se envió el 4 de marzo al correo electrónico que figura en el expediente, y el acuse confirma recibo ese mismo día. Al cierre del quinto día hábil siguiente nadie ha comparecido. El jefe le pide preparar el envío que sigue, pero el expediente físico está en préstamo en el archivo de gestión hasta mañana.", "enunciado": "¿Qué debe verificar el facilitador en el envío que le encargaron preparar?", "opciones": [{"t": "Que se envíe una segunda citación al mismo correo y se esperen otros cinco días hábiles antes de acudir al aviso.", "j": "Es incorrecta. Es plausible porque la citación ya se usó y repetirla parece prudente, pero el art. 69 de la Ley 1437 de 2011 ordena pasar al aviso cuando, cumplidos cinco días del envío de la citación (art. 68), no se pudo notificar personalmente. Repite una etapa ya agotada. Error de fase.", "tipo": "fase"}, {"t": "Que el aviso vaya con copia íntegra del acto, recursos, plazos, autoridades y la advertencia sobre la notificación.", "j": "Es correcta. Ley 1437 de 2011, art. 69: si la notificación personal no se logra al cabo de cinco días del envío de la citación, se remite aviso con copia íntegra del acto, que indica la fecha, la autoridad que lo expidió, los recursos, las autoridades ante quienes se interponen, los plazos y la advertencia de que la notificación se considera surtida al finalizar el día siguiente al de la entrega.", "tipo": null}, {"t": "Que el aviso transcriba la parte resolutiva del acto e indique los recursos que proceden y la autoridad que lo expidió.", "j": "Es incorrecta. Es plausible porque el aviso sí debe nombrar recursos y autoridad, pero el art. 69 de la Ley 1437 de 2011 exige copia íntegra del acto, no un extracto, y además los plazos, las autoridades ante quienes se recurre y la advertencia sobre cuándo se surte la notificación. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M068", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 69", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#69", "fecha": "2026-10-26"}, {"fila": "M067", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 68", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#68", "fecha": "2026-10-26"}]}, {"id": "C-E07-018-1", "caso_id": "C-E07-018", "caso_pos": 1, "caso_n": 1, "eje": "TABLAS DE RETENCION", "bloom": "Aplicar", "fuente": "Acuerdo AGN 001 de 2024, art. 4.3.1.9", "integra": ["FUNDAMENTO DE LOS ACTOS ADMINISTRATIVOS"], "caso": "Juliana, Facilitadora IV del archivo de gestión de una Dirección Seccional, revisa expedientes para el plan de transferencias. El expediente de liquidación oficial de Inversiones Los Cerezos S.A.S. contiene un acto proferido el 12 de abril de 2021, pero el 3 de junio de 2021 la empresa interpuso un recurso que todavía no ha sido resuelto. La TRD fija tres años en gestión para la subserie. Un compañero calcula ese tiempo desde la fecha del acto y propone incluir el expediente en la transferencia de diciembre de 2026.", "enunciado": "¿Qué debe registrar Juliana sobre ese expediente en la revisión?", "opciones": [{"t": "Que cumplió los tres años contados desde el acto y puede incluirse en la transferencia", "j": "Es incorrecta. Es plausible porque el acto es la decisión principal del expediente, pero el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 cuenta la retención desde el cierre, que exige finalizar el trámite; con el recurso pendiente el trámite sigue en curso. Error de granularidad.", "tipo": "granularidad"}, {"t": "Que puede transferirse abierto para que el archivo central agregue la decisión del recurso", "j": "Es incorrecta. Es plausible porque el archivo central podría recibir documentos posteriores, pero el art. 4.3.1.9 del Acuerdo AGN 001 de 2024 exige cerrar la unidad al finalizar el trámite antes de contar los tiempos que permiten transferir. Error de fase.", "tipo": "fase"}, {"t": "Que sigue abierto mientras el trámite no finalice, y su retención aún no empieza a contar", "j": "Es correcta. El art. 4.3.1.9 del Acuerdo AGN 001 de 2024 dispone que el cierre se hace una vez finalizado el trámite que dio origen al expediente y que desde el cierre corren los tiempos de la TRD; el recurso pendiente mantiene el trámite abierto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M030", "norma": "Acuerdo AGN 001 de 2024 (Acuerdo Único de la Función Archivística)", "articulo": "art. 4.3.1.9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/acuerdo_archivo_0001_2024.htm#4.3.1.9", "fecha": "2026-10-26"}]}, {"id": "C-E03-006-1", "caso_id": "C-E03-006", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Ley 599 de 2000, art. 319", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "Diego Salcedo, Facilitador IV del punto de atención de la Dirección Seccional de Aduanas de Frontera Sur, atiende el 18 de septiembre a un ciudadano que informa que un vecino entra cada semana electrodomésticos desde el país limítrofe por una trocha sin control aduanero. El ciudadano calcula el valor de cada cargamento y lo deja anotado. El protocolo del punto exige diligenciar el formato de información recibida con los datos que la norma penal describe para esa conducta y enviarlo a la dependencia competente en el mismo turno, sin calificar los hechos.", "enunciado": "¿Qué datos debe destacar Diego en el formato antes de enviarlo?", "opciones": [{"t": "La calificación de los hechos como delito de contrabando y la multa que corresponde al vecino.", "j": "Es incorrecta. Usa el lenguaje de la Ley 599 de 2000, art. 319, pero calificar la conducta y tasar la multa no corresponde al Facilitador IV ni al punto de atención; el protocolo pide informar sin calificar. Error de competencia.", "tipo": "competencia"}, {"t": "El tipo de electrodomésticos y la frecuencia semanal de los ingresos que relata el ciudadano en el punto.", "j": "Es incorrecta. Son datos útiles del relato, pero la Ley 599 de 2000, art. 319, describe la conducta por el lugar no habilitado de ingreso y por la cuantía de la mercancía; omitir esos dos elementos deja incompleto el formato. Error de completitud.", "tipo": "completitud"}, {"t": "El ingreso de mercancías por un lugar no habilitado y el valor estimado que reporta el ciudadano.", "j": "Es correcta. La Ley 599 de 2000, art. 319, describe la introducción de mercancías por lugares no habilitados en cuantía superior a cincuenta salarios mínimos; destacar el lugar y el valor estimado entrega a la dependencia competente los datos que la norma usa, sin calificar los hechos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M099", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 319", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#319", "fecha": "2026-10-26"}]}, {"id": "C-E02-017-1", "caso_id": "C-E02-017", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 27", "integra": ["SERVICIO Y ATENCION AL USUARIO"], "caso": "En el punto de atención de una Dirección Seccional, el Facilitador IV Esteban Mora atiende el 11 de noviembre a Gloria Benítez, quien pide consultar y obtener copia de las actas de 2025 del comité de archivo de la seccional. Esteban verifica en el Índice de Información Clasificada y Reservada que esas actas están calificadas como información pública y que reposan en el archivo de gestión de su grupo. Un compañero le dice que exija a la ciudadana un escrito que explique para qué quiere las actas antes de mostrárselas.", "enunciado": "¿Cómo debe Esteban atender la solicitud de Gloria?", "opciones": [{"t": "Permitir la consulta de las actas y trami
