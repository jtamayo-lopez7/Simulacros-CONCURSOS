<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-GE2-C02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-GE2-C02", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Gestor II, nivel profesional, OPEC 236765", "empleo_corto": "Gestor II", "nivel_txt": "profesional", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 240, "funcionales": 165}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-24", "semilla": 236767, "corte_normativo": "2026-10-24"}, "pjs": [{"id": "C-E03-003-1", "caso_id": "C-E03-003", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 641", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Paula Herrera, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, verifica la declaración de renta del año gravable 2024 de Textiles Brisa Andina S.A.S. Según el calendario, el plazo venció el 14 de mayo de 2025, y la declaración se presentó el 21 de julio de 2025. En ella figura un impuesto a cargo de 48.000.000 de pesos, un anticipo para el año siguiente de 13.000.000 de pesos y un saldo a pagar de 61.000.000 de pesos. La sociedad no liquidó sanción. No hubo emplazamiento previo y el expediente no registra solicitud de reducción. La coordinadora pide fijar, como punto de partida del proyecto, la sanción que la sociedad debió liquidar, con el cálculo de los meses de retardo, para revisarlo en el comité del grupo.", "enunciado": "Calcule la sanción por extemporaneidad que la sociedad debió liquidar en su declaración, antes de cualquier incremento o graduación.", "opciones": [{"t": "7.200.000 pesos, que corresponden al 5 % del impuesto a cargo por tres meses o fracción de retardo.", "j": "Es correcta. Es la sanción que la sociedad debió liquidar y pagar: el art. 641 del Estatuto Tributario fija el 5 % del total del impuesto a cargo por cada mes o fracción de mes calendario de retardo: del 14 de mayo al 21 de julio hay dos meses y una fracción, es decir tres periodos; 15 % de 48.000.000 da 7.200.000, por debajo del tope del 100 %.", "tipo": null}, {"t": "9.150.000 pesos, que corresponden al 5 % del saldo a pagar declarado por tres meses o fracción de retardo.", "j": "Es incorrecta. Es plausible porque el saldo a pagar es la cifra que el contribuyente debía cancelar, pero el art. 641 del Estatuto Tributario toma como base el total del impuesto a cargo o la retención, no el saldo que incluye el anticipo (error de granularidad).", "tipo": "granularidad"}, {"t": "4.800.000 pesos, que corresponden al 5 % del impuesto a cargo por dos meses completos de retardo.", "j": "Es incorrecta. Es plausible porque entre el 14 de mayo y el 14 de julio corren dos meses completos, pero el art. 641 del Estatuto Tributario cuenta cada mes o fracción de mes calendario; los siete días posteriores forman una fracción que suma un tercer mes (error de completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E03-010-1", "caso_id": "C-E03-010", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 640", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Sergio Pineda, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, revisa la liquidación oficial de revisión proyectada para Alimentos Río Verde S.A.S. por la renta del año gravable 2023. El proyecto impone sanción por inexactitud de 96 millones de pesos y la gradúa con los criterios del Código de Procedimiento Administrativo y de lo Contencioso Administrativo: daño causado, beneficio obtenido y ausencia de reincidencia. La sociedad aceptó parcialmente los hechos al responder el requerimiento especial el 9 de septiembre de 2026 y alegó que las sanciones deben graduarse por lesividad, proporcionalidad, gradualidad y favorabilidad. El proyecto debe ir al comité de la división el 6 de noviembre de 2026, y el coordinador pide que su sustento normativo quede explícito en la parte motiva.", "enunciado": "Valore el régimen de graduación que debe sustentar el proyecto antes de llevarlo al comité.", "opciones": [{"t": "Graduar con los criterios del código y con los del estatuto en forma acumulada, para obtener la menor sanción.", "j": "Es incorrecta. Es plausible sumar ambos regímenes en favor del contribuyente, pero el art. 50 de la Ley 1437 de 2011 opera salvo lo dispuesto en leyes especiales, de modo que no concurre con el art. 640 del Estatuto Tributario; acumularlos desconoce esa reserva (error de completitud).", "tipo": "completitud"}, {"t": "Mantener la sanción sin graduar en la liquidación y aplazar la graduación al trámite del recurso de reconsideración.", "j": "Es incorrecta. Es plausible pensar que la graduación puede revisarse al resolver el recurso, pero el art. 640 del Estatuto Tributario ordena atender sus reglas para aplicar el régimen sancionatorio, lo que ocurre al imponer la sanción en la liquidación oficial (error de fase).", "tipo": "fase"}, {"t": "Graduar según el artículo 640 del estatuto, pues el criterio del código cede ante la ley especial tributaria.", "j": "Es correcta. El art. 640 del Estatuto Tributario ordena que la aplicación del régimen sancionatorio del Estatuto atienda lo dispuesto en ese artículo, y el art. 50 de la Ley 1437 de 2011 gradúa las sanciones salvo lo dispuesto en leyes especiales; la inexactitud es una sanción del Estatuto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M065", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 640", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#640", "fecha": "2026-10-24"}, {"fila": "M074", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 50", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#50", "fecha": "2026-10-24"}]}, {"id": "C-E01-005-1", "caso_id": "C-E01-005", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 32", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Paula Ríos, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, participa desde el 2 de febrero de 2026 en la selección de casos para el plan de control del segundo semestre. Uno de los expedientes es Soluciones Logísticas Omega S.A.S., filial de un grupo con matriz en el exterior. En su declaración de renta del año gravable 2024 dedujo pagos por regalías a la matriz por 9.800 UVT, equivalentes al 22 % de sus ingresos, y su documentación comprobatoria compara márgenes con empresas de otro sector. Además, dos ingenieros de una vinculada extranjera permanecieron en el país 230 días dirigiendo contratos con clientes locales. La jefatura pide identificar, antes del comité del 20 de febrero, la función del nivel central que enmarca el diseño de la acción de control, para solicitar el apoyo técnico correspondiente.", "enunciado": "¿Qué encuadre debe sustentar Paula para solicitar el apoyo técnico en el diseño de la acción?", "opciones": [{"t": "La función de formular acciones sobre operaciones económicas internacionales, incluidos precios de transferencia y establecimientos permanentes.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 32, numeral 2, asigna «formular, diseñar, elaborar, desarrollar y documentar acciones de control» contra la evasión, el fraude fiscal y el abuso «en materia de operaciones económicas internacionales incluidas las de precios de transferencia, inversión extranjera, establecimientos permanentes». Las regalías a la matriz con comparables deficientes y la permanencia de los ingenieros corresponden a esas materias.", "tipo": null}, {"t": "La función de formular acciones contra la evasión, el fraude y el abuso tributarios, porque se discuten deducciones del impuesto de renta.", "j": "Es incorrecta. Es plausible porque el Decreto 1742 de 2020, artículo 29, numeral 2, cubre acciones contra la evasión, el fraude fiscal y el abuso en materia tributaria, y la deducción está en una declaración de renta. Falla porque el caso reúne precios de transferencia con vinculadas del exterior y un posible establecimiento permanente, materias que el artículo 32, numeral 2, asigna de forma específica; el encuadre general pierde el nivel de detalle que exige el caso. Error de granularidad.", "tipo": "granularidad"}, {"t": "La función de control posterior sobre los regímenes aduaneros, porque los pagos al exterior se originan en servicios importados por la filial colombiana.", "j": "Es incorrecta. Es plausible porque hay pagos al exterior y el control posterior es una función de fiscalización del nivel central. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, refiere el control posterior a infracciones a los regímenes aduaneros sobre mercancías; las regalías y la presencia de personal extranjero son asuntos de renta internacional regulados en el artículo 32, numeral 2. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M055", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 32", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#32", "fecha": "2026-10-24"}, {"fila": "M053", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#29", "fecha": "2026-10-24"}]}, {"id": "C-E07-005-1", "caso_id": "C-E07-005", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 591", "integra": ["IMPOSICION DE SANCIONES"], "caso": "La Gestor II Natalia Ruiz, de la división de fiscalización y liquidación de una Dirección Seccional, participa el 9 de septiembre de 2026 en una visita de control a la bodega de Comercial Fronteriza del Sur S.A.S. Allí se hallan 1.240 pares de calzado deportivo de origen extranjero, con avalúo preliminar de 310 millones de pesos. La sociedad exhibe dos declaraciones de importación que amparan 800 pares; para los 440 restantes presenta una factura de compra a un proveedor local que no menciona declaración de importación alguna. El representante legal sostiene que la diferencia es un error de inventario y pide cerrar la diligencia sin más trámite. El acta debe dejar delimitado el objeto de la investigación que se abrirá respecto de los 440 pares, sin anticipar la sanción aplicable ni la liquidación de tributos, que se definirán en etapas posteriores del procedimiento.", "enunciado": "Decida cómo debe delimitarse en el acta el objeto de la investigación sobre los pares sin respaldo.", "opciones": [{"t": "Determinar si los 440 pares causaron tributos aduaneros que no se declararon ni pagaron y si configuran una infracción o una causal de decomiso.", "j": "Es correcta. El Decreto 1165 de 2019, art. 591, numeral 2, faculta para adelantar investigaciones que establezcan la ocurrencia de hechos generadores de obligaciones aduaneras no declaradas o no satisfechas, o de hechos constitutivos de infracción o decomiso. Los 440 pares sin declaración que los ampare, respaldados solo por una factura local, encajan en ambos supuestos, y el acta debe dejarlos abiertos sin anticipar sanción ni liquidación.", "tipo": null}, {"t": "Determinar si los 440 pares configuran contrabando para remitirlos a la autoridad penal, sin abrir investigación aduanera mientras curse esa actuación.", "j": "Es incorrecta. Parece prudente ante un posible ilícito, pero el Decreto 1165 de 2019, art. 591, numeral 2, radica en la DIAN la investigación de hechos generadores no declarados y de hechos constitutivos de infracción o decomiso; un eventual traslado a la autoridad penal no sustituye esa función. Error de competencia: desplaza la actuación aduanera a otra autoridad.", "tipo": "competencia"}, {"t": "Determinar si los 440 pares causaron tributos aduaneros que no se declararon ni pagaron, y reservar la infracción o el decomiso para cuando se liquide la deuda.", "j": "Es incorrecta. Es plausible porque la falta de declaración sugiere tributos no pagados, pero el Decreto 1165 de 2019, art. 591, numeral 2, incluye en el mismo objeto de investigación la ocurrencia de hechos constitutivos de infracción o decomiso, sin supeditarla a una liquidación previa. Error de completitud: recorta el objeto de la investigación.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M016", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E06-004-1", "caso_id": "C-E06-004", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 683", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Mateo Gil, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración de renta del año gravable 2023 de Comercializadora Gamma S.A.S. Los extractos bancarios y los cruces con terceros soportan ingresos omitidos por 310 UVT. Una extrapolación hecha con el margen promedio del sector, sin ninguna prueba propia del contribuyente, arrojaría 900 UVT. El coordinador sugiere proponer los 900 UVT en el requerimiento especial para que la empresa negocie a la baja en su respuesta. El proyecto debe estar en el despacho de la jefatura el 30 de noviembre de 2026 y la empresa ya respondió un requerimiento ordinario en el que aportó la totalidad de su contabilidad. Mateo debe fijar la cifra que llevará al requerimiento especial y sustentar su posición ante la jefatura.", "enunciado": "¿Qué decisión sobre la cifra del requerimiento especial resiste mejor una revisión de su sustento?", "opciones": [{"t": "Proponer los 900 UVT en el requerimiento y reducirlos a 310 UVT en la liquidación oficial, una vez la empresa controvierta la extrapolación.", "j": "Es incorrecta. Es plausible porque la respuesta del contribuyente es la etapa en la que se discuten las cifras. Falla porque traslada a una fase posterior la corrección de un exceso que ya se conoce; el Estatuto Tributario, art. 683, exige que la aplicación de la ley esté presidida desde el inicio por el espíritu de justicia. Error de fase.", "tipo": "fase"}, {"t": "Proponer los 900 UVT, porque el deber de contribuir al financiamiento del Estado permite a la Administración fijar la base de mayor recaudo.", "j": "Es incorrecta. Resulta plausible porque invoca el deber constitucional de contribuir (Constitución Política, art. 95, num. 9). Falla porque ese mismo numeral sujeta la contribución a conceptos de justicia y equidad, y el Estatuto Tributario, art. 683, prohíbe exigir más de lo que la ley ha querido. Error de norma: lee el deber sin su límite.", "tipo": "norma"}, {"t": "Proponer los 310 UVT soportados, porque el Estado no aspira a exigir al contribuyente más de aquello con lo que la ley quiere que coadyuve.", "j": "Es correcta. El Estatuto Tributario, art. 683, ordena que la aplicación recta de las leyes esté presidida por un relevante espíritu de justicia y que al contribuyente no se le exija más de lo que la ley ha querido; la Constitución Política, art. 95, num. 9, enmarca el deber de contribuir en la justicia y la equidad. Solo los 310 UVT tienen prueba.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M050", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 683", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#683", "fecha": "2026-10-24"}, {"fila": "M092", "norma": "Constitución Política de Colombia", "articulo": "art. 95", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#95", "fecha": "2026-10-24"}]}, {"id": "C-E11-007-1", "caso_id": "C-E11-007", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestora II Natalia Prieto, de la División de Fiscalización y Liquidación de una Dirección Seccional, analiza un insumo sobre Inmobiliaria Cerros del Valle S.A.S. En febrero de 2025 la sociedad vendió un lote a su vinculada Proyectos Arrayán S.A.S. por $1.800.000.000, cuando el avalúo comercial vigente era de $3.000.000.000. Cincuenta días después, Proyectos Arrayán revendió el lote a un tercero independiente por $3.050.000.000 y compensó la ganancia con pérdidas fiscales acumuladas. Las dos sociedades tienen los mismos accionistas y el expediente no registra una razón comercial distinta de la reducción del impuesto. Cada venta, examinada por separado, cuenta con escritura pública y pago bancario. La investigación está en la etapa de fiscalización, antes de cualquier acto de determinación, y la División debe fijar la línea de la propuesta.", "enunciado": "Evalúe el hallazgo y decida el enfoque que debe sustentar la propuesta de la División.", "opciones": [{"t": "Examinar cada venta por separado y archivar el insumo, porque las dos tienen escritura pública y pago bancario.", "j": "Es incorrecta. Es plausible porque cada venta, vista aislada, cumple las formalidades y tiene soporte. Sin embargo, el Estatuto Tributario, art. 869, se refiere a la 'serie de operaciones' y permite desconocer sus efectos aunque cada paso sea formalmente válido. Error de granularidad: analiza cada transacción y pierde de vista la serie que produce el beneficio.", "tipo": "granularidad"}, {"t": "Remitir el insumo a la autoridad penal como posible lavado de activos y suspender la actuación tributaria de la División.", "j": "Es incorrecta. Resulta plausible porque las operaciones entre vinculadas con precios atípicos son señales de alerta que también se analizan en materia de lavado de activos. Sin embargo, el hallazgo describe un menor impuesto mediante una serie de operaciones, que el Estatuto Tributario, art. 869, asigna a la Administración Tributaria para recaracterizar. Error de competencia: traslada a otra autoridad un asunto de la División.", "tipo": "competencia"}, {"t": "Examinar las dos ventas como una serie que puede constituir abuso y proponer su recaracterización y la pérdida de efectos.", "j": "Es correcta. El Estatuto Tributario, art. 869, permite a la Administración 'recaracterizar o reconfigurar toda operación o serie de operaciones que constituya abuso en materia tributaria y, consecuentemente, desconocer sus efectos'. La venta a una vinculada muy por debajo del avalúo, la reventa a valor de mercado en cincuenta días, la compensación con pérdidas y la ausencia de razón comercial se valoran en conjunto, con las facultades del art. 684.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M011", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869", "fecha": "2026-10-24"}, {"fila": "M007", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}]}, {"id": "C-E02-002-1", "caso_id": "C-E02-002", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 742", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Como Gestor II de la División de Fiscalización y Liquidación, usted proyecta un pliego de cargos contra Distribuciones Río Claro Ltda. por presentar fuera de plazo la información exógena del año gravable 2023, cuyo vencimiento era el 14 de mayo de 2024. El expediente contiene los 1.840 registros reportados. En el folio 27 obra una impresión de pantalla sin fecha de consulta ni firma de quien la generó, que indica envío el 3 de julio de 2024. En el folio 31 obra una certificación del área de tecnología que registra el envío el 30 de mayo de 2024. Un compañero sugiere expedir el pliego con el folio 27, porque muestra el mayor retraso. El jefe de la división necesita el proyecto en diez días hábiles y no hay otra actuación probatoria en curso.", "enunciado": "Diagnostique la situación probatoria del expediente frente a la sanción que se pretende proponer.", "opciones": [{"t": "La contradicción debe resolverla el área de archivo de la Seccional, que responde por la veracidad de los folios del expediente.", "j": "Es incorrecta. Es plausible porque la Ley 594 de 2000, art. 16, asigna a los responsables del archivo velar por la veracidad de los documentos, pero establecer qué folio demuestra la fecha de envío es una valoración probatoria del funcionario que proyecta el acto, no una tarea archivística. Error de competencia.", "tipo": "competencia"}, {"t": "El pliego puede expedirse con el folio 27, y la contradicción con el folio 31 se resolverá cuando el contribuyente responda los cargos.", "j": "Es incorrecta. Es plausible porque la respuesta al pliego permite controvertir pruebas, pero traslada a una fase posterior la depuración probatoria que corresponde antes de proponer la sanción: el Estatuto Tributario, art. 742, exige que la sanción se funde en hechos demostrados en el expediente, y el folio 27 no demuestra la fecha de envío. Error de fase.", "tipo": "fase"}, {"t": "El pliego debe fundarse en la certificación del folio 31; la impresión del folio 27, sin fecha ni autor, no demuestra el envío.", "j": "Es correcta. El Estatuto Tributario, art. 742, exige que la imposición de sanciones se funde en los hechos que aparezcan demostrados en el respectivo expediente. La certificación del área de tecnología del folio 31 demuestra el envío del 30 de mayo de 2024; la impresión del folio 27, sin fecha de consulta ni autor, no lo demuestra. La Ley 594 de 2000, art. 16, obliga además a velar por la autenticidad y veracidad de los documentos que se incorporan al expediente.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M012", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 742", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#742", "fecha": "2026-10-24"}, {"fila": "M096", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#16", "fecha": "2026-10-24"}]}, {"id": "C-E07-003-1", "caso_id": "C-E07-003", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 684", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "La Gestor II Paula Cifuentes, de la división de fiscalización y liquidación de una Dirección Seccional, recibe dos insumos para clasificar en el plan de fiscalización de 2026. Ambos provienen de los cruces de la información exógena del año gravable 2024 que los terceros reportaron a la DIAN. En el primero, varios clientes reportaron pagos por 1.920 millones de pesos a Transportes Montaña Azul S.A.S., que no presentó declaración de renta por ese año aunque figura en el RUT como responsable del impuesto. En el segundo, Ferretería La Esquina S.A.S. declaró ingresos por 3.050 millones de pesos, mientras sus clientes reportaron compras por 3.870 millones. La coordinación pide clasificar cada insumo según la facultad del artículo 684 del Estatuto Tributario que sustenta la apertura, antes del comité de programación del 15 de abril de 2026, sin pronunciarse aún sobre sanciones.", "enunciado": "Decida la clasificación que debe presentarse al comité de programación para cada uno de los dos insumos.", "opciones": [{"t": "El de Transportes Montaña Azul va a investigación de hechos no declarados y el de Ferretería La Esquina a verificación de la exactitud de lo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 684, literal b, faculta para adelantar investigaciones que establezcan hechos generadores no declarados, caso de la sociedad que no presentó declaración pese a recibir pagos; el literal a faculta para verificar la exactitud de las declaraciones, caso de la ferretería que declaró ingresos inferiores a lo reportado. Los cruces de información del art. 631 sustentan ambos insumos.", "tipo": null}, {"t": "El de Transportes Montaña Azul va a investigación de hechos no declarados y el de Ferretería La Esquina se archiva por la presunción de veracidad.", "j": "Es incorrecta. Clasifica bien el primer insumo, pero la presunción de veracidad no impide que la Administración, según el Estatuto Tributario, art. 684, literal a, verifique la exactitud de las declaraciones cuando lo considere necesario; la diferencia de 820 millones frente a lo reportado por terceros justifica esa verificación. Error de norma: usa el art. 746 como causal de archivo.", "tipo": "norma"}, {"t": "Ambos se clasifican como verificación de la exactitud de lo declarado, porque los dos provienen de cruces de información con terceros del mismo año.", "j": "Es incorrecta. Es plausible porque los dos insumos nacen de cruces de información del Estatuto Tributario, art. 631, pero el art. 684 distingue entre verificar la exactitud de las declaraciones (literal a) y establecer hechos generadores no declarados (literal b); Transportes Montaña Azul no presentó declaración, así que no hay exactitud que verificar. Error de granularidad: clasifica por el origen del dato y no por la facultad.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}, {"fila": "M003", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 631", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#631", "fecha": "2026-10-24"}]}, {"id": "C-E05-009-1", "caso_id": "C-E05-009", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 589", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Natalia Vargas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, evalúa la corrección que presentó Alimentos Iota S.A.S. a su declaración de IVA del tercer bimestre de 2025, cuyo plazo venció el 10 de julio de 2025. La corrección, enviada por el servicio informático electrónico al que está obligada la sociedad el 22 de septiembre de 2026, incluye IVA descontable omitido por 120 millones de pesos y convierte un saldo a pagar de 45 millones en un saldo a favor de 75 millones. La sociedad no ha sido objeto de requerimiento especial ni de pliego de cargos. Su revisor fiscal sostiene que la declaración puede corregirse durante tres años y que el formulario se envió por el medio obligado. La jefatura pide decidir si la corrección produce efectos.", "enunciado": "Evalúe la oportunidad de la corrección y decida si debe aceptarse.", "opciones": [{"t": "Debe aceptarse, porque se presentó dentro de los tres años y antes de cualquier requerimiento especial.", "j": "Es incorrecta. Es plausible porque el Estatuto Tributario, art. 588, concede tres años para corregir antes del requerimiento especial. Pero esa regla gobierna las correcciones que aumentan el impuesto; esta aumenta el saldo a favor y se rige por el art. 589; la opción aplica la norma de otro tipo de corrección (norma).", "tipo": "norma"}, {"t": "No debe aceptarse, porque al aumentar el saldo a favor el plazo era el año siguiente al vencimiento.", "j": "Es correcta. El Estatuto Tributario, art. 589, ordena que la corrección que disminuye el valor a pagar o aumenta el saldo a favor se presente por el medio obligado dentro del año siguiente al vencimiento del término para declarar. Ese año terminó el 10 de julio de 2026 y la corrección se envió el 22 de septiembre de 2026.", "tipo": null}, {"t": "Debe aceptarse, porque se presentó por el medio obligado, que es la condición que exige esta corrección.", "j": "Es incorrecta. Resulta atractiva porque el Estatuto Tributario, art. 589, exige presentar la corrección por el medio al que está obligado el contribuyente, y así ocurrió. Pero la norma exige además hacerlo dentro del año siguiente al vencimiento del término para declarar; la opción toma una condición y omite la otra (completitud).", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}, {"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}]}, {"id": "C-E06-005-1", "caso_id": "C-E06-005", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Constitución Política de Colombia, art. 363", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Valentina Ortiz, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa en noviembre de 2025 la declaración de un impuesto nacional de período mensual presentada por Industrias Épsilon S.A. para septiembre de 2025, con una base gravable de 2.000 UVT. Una ley publicada el 14 de octubre de 2025 elevó la tarifa de ese impuesto del 4 % al 6 % y no fijó regla de transición. Un memorando de la Dirección Seccional fechado el 20 de octubre recomienda aplicar la tarifa del 6 % a todos los períodos de 2025 para uniformar las liquidaciones. La empresa declaró y pagó con la tarifa del 4 %. Valentina debe decidir qué tarifa usar en la liquidación del período de septiembre antes de proyectar un emplazamiento para corregir.", "enunciado": "¿Qué tarifa debe aplicar Valentina al período de septiembre y con qué fundamento?", "opciones": [{"t": "La del 4 %, porque la ley tributaria no se aplica con retroactividad y un memorando no puede fijar la tarifa de un impuesto.", "j": "Es correcta. La Constitución Política, art. 363, dispone que las leyes tributarias no se aplicarán con retroactividad, y el art. 338 reserva a la ley fijar directamente las tarifas de los impuestos. El período de septiembre es anterior a la publicación de la ley, y el memorando de la seccional carece de aptitud para modificar la tarifa.", "tipo": null}, {"t": "La del 6 %, porque el principio de eficiencia del sistema tributario permite unificar en un mismo año la tarifa de todos los períodos.", "j": "Es incorrecta. Resulta plausible porque la uniformidad facilita la gestión y la eficiencia es un principio del sistema (Constitución Política, art. 363). Falla porque el mismo artículo prohíbe aplicar las leyes tributarias con retroactividad, y septiembre es anterior a la ley. Error de norma.", "tipo": "norma"}, {"t": "La del 6 %, porque la Dirección Seccional puede definir mediante memorando la tarifa aplicable a los contribuyentes de su jurisdicción.", "j": "Es incorrecta. Es plausible porque la seccional imparte instrucciones internas de trabajo a sus servidores. Falla porque la Constitución Política, art. 338, exige que la ley fije directamente las tarifas de los impuestos; un memorando no tiene esa competencia. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M090", "norma": "Constitución Política de Colombia", "articulo": "art. 363", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#363", "fecha": "2026-10-24"}, {"fila": "M091", "norma": "Constitución Política de Colombia", "articulo": "art. 338", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#338", "fecha": "2026-10-24"}]}, {"id": "C-E09-008-1", "caso_id": "C-E09-008", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 555-2", "integra": ["NORMAS Y TECNICAS DE AUDITORIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Julián Herrera, de la división de fiscalización y liquidación de una Dirección Seccional, revisa el informe de una visita de verificación realizada el 8 de octubre de 2026 a un local de venta de repuestos para motocicletas. El funcionario visitador encontró al propietario, Óscar Linares, atendiendo al público con un inventario estimado en 1.200 UVT, sin inscripción en el RUT, con ventas de 4.600 UVT en 2025 según los reportes de sus proveedores y de las entidades financieras, y con talonarios de remisión en lugar de facturas. El propietario aportó su matrícula mercantil vigente y afirmó que el RUT solo corresponde a quienes declaran renta. El borrador del informe concluye que la matrícula mercantil sirve como registro de identificación ante la DIAN y que solo debe exigirse la factura. El Gestor debe aprobar o ajustar las conclusiones antes de que el informe pase al expediente y se definan las acciones de control.", "enunciado": "¿Qué ajuste debe sustentar el Gestor sobre las conclusiones del borrador del informe?", "opciones": [{"t": "Debe mantenerlas, porque la matrícula mercantil cumple ante la DIAN la función de identificar y ubicar al comerciante que factura sus ventas.", "j": "Es incorrecta. Es plausible porque la matrícula mercantil también identifica al comerciante; falla porque el Estatuto Tributario, art. 555-2, define el RUT, administrado por la DIAN, como el mecanismo único para identificar, ubicar y clasificar a los sujetos, de modo que otro registro no lo sustituye. Error de norma: aplica a la DIAN un registro de otro régimen.", "tipo": "norma"}, {"t": "Debe precisar que el RUT es el mecanismo único para identificar, ubicar y clasificar al comerciante, quien además debe facturar sus operaciones.", "j": "Es correcta. El Estatuto Tributario, art. 555-2, establece que el RUT constituye el mecanismo único para identificar, ubicar y clasificar, por lo que la matrícula mercantil no lo reemplaza; y el art. 615 obliga a quien tiene la calidad de comerciante a expedir factura o documento equivalente por cada operación. Las dos observaciones deben constar en el informe.", "tipo": null}, {"t": "Debe registrar la falta de RUT, pero retirar la observación sobre la factura, porque las remisiones que el comerciante conserva soportan cada venta.", "j": "Es incorrecta. Es plausible porque corrige el error sobre el RUT y porque las remisiones dejan rastro de las ventas; falla porque el Estatuto Tributario, art. 615, exige expedir factura o documento equivalente, y una remisión comercial no tiene esa naturaleza. Error de granularidad: asimila un documento interno de despacho al soporte que la norma exige.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M078", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 555-2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#555-2", "fecha": "2026-10-24"}, {"fila": "M079", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 615", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#615", "fecha": "2026-10-24"}]}, {"id": "C-E05-010-1", "caso_id": "C-E05-010", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 691", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Ricardo Salas, Gestor II de fiscalización de una Dirección Seccional cuya estructura separa la Unidad de Fiscalización y la Unidad de Liquidación, adelanta la investigación del impuesto de renta del año gravable 2022 de Minera Kappa S.A. El requerimiento especial, firmado por el jefe de la Unidad de Fiscalización, se notificó en marzo de 2026, y el contribuyente lo respondió en junio con soportes que revelan pagos al exterior por 1.900 millones de pesos no examinados en la auditoría. Con base en esa respuesta, el Gestor proyecta una ampliación al requerimiento especial. El jefe de la Unidad de Fiscalización solicita que el proyecto vuelva a su despacho para firmarlo, porque fue él quien suscribió el requerimiento inicial. La coordinadora pide verificar la dependencia competente antes de enviar el proyecto a firma y registrar el reparto en el expediente.", "enunciado": "Determine quién debe proferir el acto proyectado y sustente su decisión.", "opciones": [{"t": "El jefe de la Unidad de Fiscalización, porque quien profirió el requerimiento especial debe suscribir su ampliación.", "j": "Es incorrecta. Es plausible porque el jefe de la Unidad de Fiscalización suscribió el requerimiento inicial y conoce la investigación. Pero el Estatuto Tributario, art. 691, atribuye al Jefe de la Unidad de Liquidación proferir las ampliaciones a los requerimientos especiales; la opción asigna el acto a una dependencia sin esa competencia (competencia).", "tipo": "competencia"}, {"t": "El Gestor II que sustanció la investigación, porque el proyecto de ampliación es un acto de trámite interno.", "j": "Es incorrecta. Resulta atractiva porque el Gestor proyectó el acto y conoce el expediente. Pero el Estatuto Tributario, art. 691, radica la facultad de proferir las ampliaciones en el Jefe de la Unidad de Liquidación, y proyectar no equivale a proferir; la opción confunde la sustanciación con la competencia para firmar (competencia).", "tipo": "competencia"}, {"t": "El jefe de la Unidad de Liquidación, porque a esa jefatura corresponde proferir las ampliaciones al requerimiento.", "j": "Es correcta. El Estatuto Tributario, art. 691, dispone que corresponde al Jefe de la Unidad de Liquidación proferir las ampliaciones a los requerimientos especiales, además de las liquidaciones de revisión, corrección y aforo y los demás actos de determinación oficial.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 691", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#691", "fecha": "2026-10-24"}]}, {"id": "C-E11-005-1", "caso_id": "C-E11-005", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Aplicar", "fuente": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN), art. 3", "integra": ["NORMATIVA CAMBIARIA"], "caso": "La Gestora II Diana Ospina, de la División de Fiscalización y Liquidación de una Dirección Seccional, adelanta una investigación cambiaria contra Distribuidora Litoral Norte Ltda., importadora de repuestos. La DIAN exigió exhibir las declaraciones de cambio de siete pagos al exterior realizados en 2025, por un total de USD 340.000. La empresa exhibió seis: cuatro coinciden con los soportes bancarios y comerciales; dos registran un numeral cambiario distinto del que corresponde a la operación. Para el séptimo pago, de USD 18.000, la empresa reconoce que no presentó la declaración de cambio en la oportunidad legal. Las operaciones se canalizaron por intermediarios del mercado cambiario y ninguna pasó por cuenta de compensación. El expediente está en la etapa de formulación de cargos y la jefatura pide cuantificar en UVT la multa propuesta con los datos verificados.", "enunciado": "Determine el monto de la multa que corresponde proponer según los hallazgos verificados.", "opciones": [{"t": "25 UVT, porque solo la declaración no presentada a tiempo configura una conducta sancionable.", "j": "Es incorrecta. Parece plausible porque la falta de declaración es la infracción más visible del caso. Sin embargo, el Decreto Ley 2245 de 2011, art. 3, numeral 1, también sanciona presentar la declaración 'con datos equivocados', como ocurre con los dos numerales cambiarios errados. Error de completitud: deja fuera dos de las tres conductas sancionables.", "tipo": "completitud"}, {"t": "175 UVT, porque la multa se impone por cada uno de los siete pagos incluidos en la exigencia.", "j": "Es incorrecta. Resulta plausible porque la exigencia de exhibición abarcó los siete pagos y la multa es por unidad. Sin embargo, el Decreto Ley 2245 de 2011, art. 3, numeral 1, impone la multa por cada declaración que incurre en la conducta, no por cada operación revisada; cuatro declaraciones son correctas. Error de granularidad: toma como unidad de cálculo el universo revisado y no las declaraciones infractoras.", "tipo": "granularidad"}, {"t": "75 UVT, porque tres declaraciones incurren en conducta sancionable y la multa se impone por cada una.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 3, numeral 1, sanciona no presentar la declaración de cambio en la oportunidad legal y presentarla con datos equivocados con multa de 25 UVT 'por cada declaración'. Hay dos declaraciones con numeral equivocado y una no presentada a tiempo: tres por 25 UVT dan 75 UVT. Las cuatro correctas no generan multa.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#3", "fecha": "2026-10-24"}]}, {"id": "C-E10-002-1", "caso_id": "C-E10-002", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 705", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Una Dirección Seccional adelanta un programa sobre deducciones improcedentes. El Gestor II Bedoya revisa el expediente de Insumos del Valle S.A.S., que presentó su declaración del impuesto sobre la renta del año gravable 2021 el 7 de abril de 2022, cuando el plazo para declarar de ese contribuyente vencía el 10 de abril de 2022. La investigación documentó deducciones sin soporte por 3.100 UVT y un ingreso omitido por 900 UVT. El proyecto de requerimiento especial quedó elaborado el 20 de marzo de 2025 y la dependencia de notificaciones informa que, por la carga del canal de correo certificado, el envío solo podría surtirse el 28 de abril de 2025. El contribuyente no ha corregido su declaración ni ha sido emplazado para corregir, y el expediente no registra suspensión de términos.", "enunciado": "Diagnostique el efecto que tiene sobre la actuación la fecha en que se podría surtir la notificación proyectada.", "opciones": [{"t": "La notificación es oportuna porque el término para notificar el requerimiento especial es de cinco años contados desde el vencimiento del plazo para declarar.", "j": "Es incorrecta. Resulta atractiva porque el art. 714 del Estatuto Tributario prevé términos de firmeza más largos para ciertas declaraciones, pero el art. 705 fija para el requerimiento especial tres años desde el vencimiento del plazo para declarar y el caso no presenta ningún supuesto de término especial. Error de norma.", "tipo": "norma"}, {"t": "La notificación conserva efectos porque el proyecto de requerimiento se elaboró dentro del término, que se interrumpe con la suscripción del acto.", "j": "Es incorrecta. Resulta atractiva porque el acto se elaboró el 20 de marzo de 2025, pero el art. 705 del Estatuto Tributario exige la notificación dentro del término y no basta con suscribir el proyecto. Error de fase.", "tipo": "fase"}, {"t": "La notificación sería tardía: el plazo de tres años venció el 10 de abril de 2025 y sin requerimiento notificado la declaración queda en firme.", "j": "Es correcta. El art. 705 del Estatuto Tributario ordena notificar el requerimiento especial a más tardar dentro de los tres años siguientes al vencimiento del plazo para declarar, y el art. 714 dispone la firmeza de la declaración si en ese lapso no se notificó requerimiento especial.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M035", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 705", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#705", "fecha": "2026-10-24"}, {"fila": "M045", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 714", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#714", "fecha": "2026-10-24"}]}, {"id": "C-E08-010-1", "caso_id": "C-E08-010", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 2", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II revisa el expediente de la sociedad Alimentos del Alto Magdalena S. A. S., en el que se comprobó que seis declaraciones de cambio por pagos de importación, con vencimiento de la oportunidad legal entre el 10 de abril y el 28 de agosto, se presentaron el 3 de diciembre, es decir, después de la notificación del requerimiento ordinario del 20 de noviembre. El monto canalizado suma USD 740.000 y los documentos soporte coinciden con las facturas. El apoderado sostiene que la presentación posterior extinguió la contravención y que, en todo caso, la multa solo podría liquidarse cuando la sociedad acepte el número de declaraciones omitidas al responder los cargos. El expediente está en valoración probatoria y el proyecto de pliego de cargos debe incluir el fundamento del cálculo de la multa.", "enunciado": "¿Cómo debe diagnosticar el Gestor II la configuración de la infracción y el fundamento del cálculo de la multa?", "opciones": [{"t": "La contravención se configuró al vencer la oportunidad legal de cada declaración y la multa se calcula en 25 UVT por cada una de las seis.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 2, sitúa la infracción en el momento de la transgresión del régimen, y el art. 3, numeral 1, impone multa de veinticinco (25) UVT por cada declaración no presentada dentro de la oportunidad legal.", "tipo": null}, {"t": "La presentación del 3 de diciembre extingue la contravención administrativa y permite cerrar la investigación cambiaria sin liquidar multa alguna.", "j": "Es incorrecta. Resulta plausible porque la obligación formal quedó cumplida, pero el Decreto Ley 2245 de 2011, art. 2, califica como infracción la transgresión del régimen vigente al momento de los hechos y el art. 3, numeral 1, la sanciona por cada declaración. Error de completitud.", "tipo": "completitud"}, {"t": "La contravención se configura con la notificación del requerimiento ordinario y la multa se liquida cuando el investigado acepte las declaraciones omitidas.", "j": "Es incorrecta. Resulta plausible porque el requerimiento marca el inicio de la discusión con el investigado, pero el Decreto Ley 2245 de 2011, art. 2, fija la infracción en el momento de la transgresión y su cuantificación no depende de la aceptación. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M022", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#2", "fecha": "2026-10-24"}, {"fila": "M024", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#3", "fecha": "2026-10-24"}]}, {"id": "C-E04-007-1", "caso_id": "C-E04-007", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Un Gestor II de la Subdirección de Apoyo en la Lucha contra el Delito Aduanero y Fiscal debe consolidar el informe de gestión del cuarto trimestre de 2025 sobre denuncias recibidas, con corte al 31 de diciembre y entrega el 20 de enero de 2026 en el formato y la periodicidad definidos por el Director General, que exige reportar todas las denuncias recibidas en el periodo, por tipo y con su estado (direccionada, en análisis o archivada), sin datos de identificación de los denunciados. En el aplicativo figuran 58 denuncias: 31 por evasión, 18 por contrabando y 9 por presunto lavado de activos. De estas últimas, siete fueron direccionadas a entidades externas y dos siguen en análisis preliminar. El coordinador propone excluir del informe las nueve denuncias de lavado de activos y dejar constancia en un documento reservado de la dependencia, porque los hechos fueron trasladados a otra entidad y mencionarlos podría afectar investigaciones en curso.", "enunciado": "¿Qué debe decidir el Gestor sobre la propuesta del coordinador antes de remitir el informe?", "opciones": [{"t": "Rechazarla en parte y reportar solo las dos denuncias en análisis preliminar, porque las siete direccionadas pasaron a ser gestión de la entidad receptora.", "j": "Es incorrecta. Es plausible porque el expediente de las siete salió de la dependencia. Falla porque el Decreto 1742 de 2020, art. 33, ordena presentar el informe en la forma que fije el Director General, y esa forma pide todas las denuncias del periodo con su estado, incluido el de direccionada; recortar el informe a lo pendiente desconoce el formato. Error de granularidad.", "tipo": "granularidad"}, {"t": "Rechazarla y reportar las 58 denuncias por tipo y estado, sin identificar a los denunciados, en la forma fijada por el Director General.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, exige presentar los informes periódicos de gestión en la forma y oportunidad que establezca el Director General. La forma fijada en el caso exige todas las denuncias recibidas en el periodo, por tipo y con su estado, de modo que entran las nueve de lavado de activos; omitir los datos de identificación de los denunciados atiende la reserva que preocupa al coordinador.", "tipo": null}, {"t": "Acogerla y dejar las nueve denuncias en el documento reservado, pues la reserva de la información penal prevalece sobre el formato del informe de gestión.", "j": "Es incorrecta. Es plausible porque la reserva de la información penal exige cuidado en su manejo. Falla porque el Decreto 1742 de 2020, art. 33, obliga a presentar los informes periódicos de gestión en la forma y oportunidad que establezca el Director General, y la forma fijada exige todas las denuncias del periodo sin datos de identificación de los denunciados, lo que ya protege la reserva. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M059", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E10-004-1", "caso_id": "C-E10-004", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 691", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "En una Dirección Seccional, el requerimiento especial contra Agroinsumos del Norte S.A.S. por el impuesto sobre la renta del año gravable 2022 se notificó el 4 de febrero de 2026. La respuesta del contribuyente, radicada el 15 de marzo de 2026, aporta contratos que obligan a replantear la cifra propuesta y revelan una operación de venta de activos no analizada. El expediente pasó a la unidad de liquidación, donde el Gestor II Herrera prepara dos actos: una ampliación al requerimiento especial por 1.200 UVT adicionales y el proyecto de liquidación de revisión. El jefe de la unidad de fiscalización, que firmó el requerimiento inicial, ofrece suscribir también los dos nuevos actos para no demorar el reparto, mientras el jefe de la unidad de liquidación resuelve otros expedientes del mismo programa.", "enunciado": "Valore la propuesta de firma que se formula para los dos actos que prepara el Gestor II.", "opciones": [{"t": "Es admisible porque quien profirió el requerimiento especial conserva la competencia sobre los actos que derivan de esa misma investigación.", "j": "Es incorrecta. Parece coherente con la continuidad del expediente, pero el art. 691 del Estatuto Tributario separa la determinación oficial y la radica en el jefe de la unidad de liquidación. Error de competencia.", "tipo": "competencia"}, {"t": "Es admisible para la ampliación del requerimiento, por ser acto de trámite, y debe reservarse al jefe de liquidación la liquidación de revisión.", "j": "Es incorrecta. Resulta verosímil porque la ampliación precede a la decisión de fondo, pero el art. 691 del Estatuto Tributario enumera la ampliación entre los actos del jefe de la unidad de liquidación. Error de granularidad.", "tipo": "granularidad"}, {"t": "Es inadmisible: la ampliación al requerimiento especial y la liquidación de revisión corresponden al jefe de la unidad de liquidación.", "j": "Es correcta. El art. 691 del Estatuto Tributario atribuye al jefe de la unidad de liquidación las ampliaciones a los requerimientos especiales y las liquidaciones de revisión, mientras el art. 688 limita al jefe de fiscalización a los actos de trámite y previos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 691", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#691", "fecha": "2026-10-24"}, {"fila": "M030", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 688", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#688", "fecha": "2026-10-24"}]}, {"id": "C-E10-006-1", "caso_id": "C-E10-006", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869-1", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "El Gestor II Lozano analiza el expediente de Inversiones Caribe S.A.S., cuyo plazo para declarar el impuesto sobre la renta del año gravable 2023 venció el 16 de mayo de 2024. El papel de trabajo de auditoría describe tres operaciones encadenadas en noviembre de 2023: venta de un inmueble a una vinculada por 4.900 UVT, retroarriendo inmediato del mismo bien y cesión del contrato a un tercero domiciliado en el exterior, con un efecto fiscal conjunto de 2.300 UVT menos de renta líquida. El auditor dejó constancia de indicios documentales sobre la ausencia de propósito de negocios en la secuencia, pero no hay prueba plena. El 11 de junio de 2026 el expediente está en investigación y en la coordinación hay posiciones encontradas sobre el paso siguiente.", "enunciado": "Diagnostique la actuación que habilita la normativa al funcionario competente con el material probatorio descrito.", "opciones": [{"t": "Proponer la liquidación de revisión con el efecto fiscal calculado, porque los indicios documentales respaldan la recaracterización de las tres operaciones.", "j": "Es incorrecta. Resulta tentadora porque el efecto fiscal está cuantificado, pero el art. 869-1 del Estatuto Tributario interpone el emplazamiento especial antes de la determinación oficial del abuso. Error de fase.", "tipo": "fase"}, {"t": "Cerrar la investigación y archivar el expediente, ya que la secuencia de operaciones no se puede discutir sin prueba plena del propósito elusivo.", "j": "Es incorrecta. Parece prudente frente a un acervo incompleto, pero el art. 869-1 del Estatuto Tributario se satisface con prueba sumaria de las razones del emplazamiento especial. Error de completitud.", "tipo": "completitud"}, {"t": "Emitir un emplazamiento especial, dentro del término de firmeza, con las razones de la posible configuración de abuso sustentadas en prueba sumaria.", "j": "Es correcta. El art. 869-1 del Estatuto Tributario obliga al funcionario competente que, dentro del término de firmeza, evidencie una posible operación abusiva, a emitir emplazamiento especial explicando las razones sustentadas siquiera en prueba sumaria, y el art. 714 fija ese término de firmeza.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M054", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869-1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869-1", "fecha": "2026-10-24"}, {"fila": "M045", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 714", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#714", "fecha": "2026-10-24"}]}, {"id": "C-E11-006-1", "caso_id": "C-E11-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 746", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Felipe Arango, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración del impuesto sobre la renta del año gravable 2024 de Confecciones Altamar S.A.S. Los costos declarados equivalen al 92 % de los ingresos, mientras el promedio del sector según estudios internos es del 70 %. En mayo de 2026 la División envió un requerimiento ordinario que pidió soportes de los ingresos por exportaciones; la sociedad respondió a tiempo y no se le ha solicitado prueba alguna sobre los costos. Ninguna norma exige para esos costos una comprobación especial adicional. El jefe del grupo propone incluir en el requerimiento especial el rechazo de la diferencia de costos frente al promedio sectorial, sin más actuaciones previas. La declaración no está en firme y el término para notificar el requerimiento especial vence en abril de 2028.", "enunciado": "Evalúe la propuesta del jefe del grupo y decida la actuación que procede sobre los costos.", "opciones": [{"t": "Acoger la propuesta, porque el requerimiento ordinario de mayo ya pidió pruebas y la presunción de veracidad decayó.", "j": "Es incorrecta. Resulta plausible porque ya existe un requerimiento ordinario respondido dentro del expediente. Sin embargo, ese requerimiento versó sobre los ingresos por exportaciones; sobre los costos no se ha solicitado comprobación, de modo que el Estatuto Tributario, art. 746, los sigue considerando ciertos. Error de completitud: extiende a los costos una solicitud que cubrió otro hecho.", "tipo": "completitud"}, {"t": "Acoger la propuesta, porque la brecha frente al promedio sectorial basta para rechazar los costos en el requerimiento especial.", "j": "Es incorrecta. Es plausible porque una diferencia de 22 puntos frente al sector es un indicio relevante para seleccionar el caso. Sin embargo, el Estatuto Tributario, art. 746, tiene por ciertos los hechos declarados mientras no se haya solicitado una comprobación especial, y el art. 684 faculta a verificar la exactitud antes de proponer modificaciones. Error de fase: salta la verificación y pasa directo a la determinación.", "tipo": "fase"}, {"t": "Solicitar primero la comprobación de los costos, porque mientras no se pida se tienen por ciertos los hechos declarados.", "j": "Es correcta. El Estatuto Tributario, art. 746, considera ciertos los hechos consignados en la declaración 'siempre y cuando que sobre tales hechos, no se haya solicitado una comprobación especial, ni la ley la exija'. Sobre los costos no se ha pedido prueba ni la ley la exige; con la facultad del art. 684, literal a, la División debe verificar su exactitud antes de proponer su rechazo, y el término lo permite.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M013", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 746", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#746", "fecha": "2026-10-24"}, {"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}]}, {"id": "C-E03-007-1", "caso_id": "C-E03-007", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 651", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Natalia Fuentes, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, investiga a Logística Portuaria Delta S.A.S. El 2 de febrero de 2026 la división le envió un requerimiento ordinario de información con plazo de quince días para entregar las facturas de compra de 2025 de cinco proveedores. La sociedad respondió el 20 de febrero de 2026, dentro del plazo, pero anexó facturas de 2024 de esos proveedores. Su reporte de información exógena de 2025 se presentó en término y sin errores. El apoderado afirma que la sociedad cumplió porque contestó a tiempo y que la falta, de existir, la debe tramitar el área que administra la información exógena. La Gestor II debe valorar si la conducta es sancionable antes de proponer la actuación.", "enunciado": "Valore si la respuesta de la sociedad configura la conducta sancionable y bajo qué supuesto.", "opciones": [{"t": "La configura, porque se respondió a tiempo con un contenido que no corresponde a lo que se solicitó.", "j": "Es correcta. El art. 651 del Estatuto Tributario sanciona a quienes se les haya solicitado informaciones o pruebas y cuyo contenido no corresponda a lo solicitado, aunque se entregue dentro del plazo; las facturas de 2024 no son las de 2025 que pidió el requerimiento.", "tipo": null}, {"t": "La configura, pero su trámite corresponde al área de exógena, porque la norma sanciona a los obligados a reportar.", "j": "Es incorrecta. Es plausible porque el art. 651 del Estatuto Tributario alcanza a los obligados a suministrar información tributaria, pero también a aquellas personas a quienes se les haya solicitado informaciones o pruebas; la falta surge del requerimiento de la división y no del reporte de exógena, que se presentó sin errores (error de competencia).", "tipo": "competencia"}, {"t": "No la configura, pues la respuesta llegó dentro del plazo y la norma reprocha no suministrar o hacerlo tarde.", "j": "Es incorrecta. Es plausible porque el art. 651 del Estatuto Tributario sanciona no suministrar la información o hacerlo fuera de plazo, pero el mismo texto incluye el caso en que el contenido presente errores o no corresponda a lo solicitado; la lectura omite ese supuesto (error de completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M071", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 651", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#651", "fecha": "2026-10-24"}]}, {"id": "C-E09-005-1", "caso_id": "C-E09-005", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 1", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestora II Diana Castaño, de la división de fiscalización y liquidación de una Dirección Seccional, estudia el expediente de Transportes Sierra Verde S.A.S., sociedad que en el año gravable 2024 obtuvo ingresos por 38.000 UVT según la información reportada por sus clientes. La sociedad no presentó la declaración de renta, cuyo plazo venció el 9 de mayo de 2025, y tampoco ha recibido liquidación oficial. En la respuesta a un requerimiento ordinario del 15 de julio de 2026, el representante legal sostiene que la obligación de pagar el impuesto aún no ha nacido, pues no se ha presentado declaración ni la Administración ha determinado el tributo mediante un acto en firme. La Gestora debe fijar el momento de origen de la obligación para orientar la propuesta de determinación oficial del impuesto que llevará al comité de la división.", "enunciado": "¿Qué debe concluir la Gestora sobre el momento en que se originó la obligación tributaria sustancial de la sociedad?", "opciones": [{"t": "Se originará cuando quede en firme la liquidación oficial que profiera la Administración, pues ese acto es el que determina el tributo a pagar.", "j": "Es incorrecta. Es plausible porque la liquidación oficial cuantifica el impuesto cuando el contribuyente no lo hace; falla porque el Estatuto Tributario, art. 1, sitúa el origen de la obligación sustancial en la realización del presupuesto generador, y el acto oficial solo determina una obligación ya nacida. Error de fase: confunde el momento de la determinación con el del nacimiento.", "tipo": "fase"}, {"t": "Se originó con la inscripción de la sociedad en el RUT como responsable del impuesto sobre la renta, que la vinculó al pago de ese tributo.", "j": "Es incorrecta. Es plausible porque el RUT identifica y clasifica a los sujetos obligados; falla porque la inscripción es una obligación formal (Estatuto Tributario, art. 555-2) y la obligación sustancial nace de la realización del hecho generador, según el art. 1. Error de norma: atribuye a la regla del registro el origen del deber de pagar.", "tipo": "norma"}, {"t": "Se originó cuando la sociedad realizó en 2024 los presupuestos que la ley prevé como generadores del impuesto, aunque no haya declarado.", "j": "Es correcta. El Estatuto Tributario, art. 1, dispone que la obligación tributaria sustancial se origina al realizarse el presupuesto o los presupuestos previstos en la ley como generadores del impuesto, y que tiene por objeto el pago del tributo. La sociedad obtuvo los ingresos en 2024; la falta de declaración o de liquidación oficial no impide que la obligación haya nacido.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M077", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E08-004-1", "caso_id": "C-E08-004", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Evaluar", "fuente": "Decreto Ley 2245 de 2011, art. 1", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "NORMAS Y TECNICAS DE AUDITORIA"], "caso": "Un informe de auditoría interna entregado el 20 de mayo a la División de Fiscalización y Liquidación de una Dirección Seccional identifica tres grupos de operaciones en una misma cadena de negocios. El primero: presunta subfacturación en importaciones de la sociedad Insumos del Pacífico S. A. S. por USD 900.000 declarados frente a USD 1.400.000 pagados al exterior. El segundo: endeudamiento externo de una persona natural por USD 250.000 sin registro, con dos desembolsos en mar
