zo y abril. El tercero: operaciones de un intermediario del mercado cambiario cuya vigilancia y control corresponden a la autoridad de supervisión financiera. El informe sugiere una sola investigación que abarque los tres grupos. El Gestor II debe fijar el alcance de la actuación antes de solicitar la apertura del expediente, con el programa de control cambiario de la vigencia como referencia.", "enunciado": "¿Cómo debe decidir el Gestor II el alcance de la actuación cambiaria que adelantará la Seccional?", "opciones": [{"t": "Abarcar los tres grupos de operaciones, porque la vigilancia del régimen cambiario en la jurisdicción cubre a todo sujeto que movilice divisas.", "j": "Es incorrecta. Resulta plausible por la unidad económica de la cadena de negocios, pero el Decreto Ley 2245 de 2011, art. 1, limita la actuación a las infracciones cuya vigilancia y control corresponden por competencia a la DIAN. Error de competencia.", "tipo": "competencia"}, {"t": "Abarcar la subfacturación en importaciones y el endeudamiento externo de la persona natural, y excluir las operaciones del intermediario del mercado cambiario.", "j": "Es correcta. El Decreto 1742 de 2020, art. 31, numeral 2, asigna el control del régimen cambiario en importación, subfacturación y endeudamiento externo de personas naturales cuando la vigilancia no sea competencia de otras entidades, y el Decreto Ley 2245 de 2011, art. 1, delimita así la actuación.", "tipo": null}, {"t": "Aplazar el alcance de la actuación hasta que la autoridad de supervisión financiera resuelva la situación del intermediario y devuelva el informe de auditoría.", "j": "Es incorrecta. Resulta plausible porque los tres grupos aparecen enlazados en un mismo informe, pero el Decreto 1742 de 2020, art. 31, numeral 2, habilita la planeación y el control de las operaciones propias sin esperar a otra entidad. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M021", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#1", "fecha": "2026-10-24"}, {"fila": "M057", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}]}, {"id": "C-E06-006-1", "caso_id": "C-E06-006", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869", "integra": ["NORMAS Y TECNICAS DE AUDITORIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Camilo Vargas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, audita el impuesto sobre la renta del año gravable 2024 de Inversiones Zeta S.A.S. El 10 de febrero de 2024 la empresa vendió un lote a Holding Eta S.A.S., sociedad del mismo grupo, sin empleados ni oficina propia, por $1.200 millones, cuando un avalúo de enero de 2024 lo estimaba en $2.000 millones. El 15 de abril de 2024 Holding Eta revendió el lote a un tercero no vinculado por $2.050 millones y compensó la ganancia con pérdidas fiscales acumuladas. Los contratos cumplen sus formalidades y cada operación, mirada por separado, se ajusta al derecho privado. El jefe de la división pide a Camilo, antes de proyectar el requerimiento especial, un diagnóstico sobre cómo debe la Administración tratar estas operaciones.", "enunciado": "¿Qué diagnóstico debe sustentar Camilo sobre el tratamiento de las operaciones?", "opciones": [{"t": "Revisar solo la venta a Holding Eta y aceptar la reventa al tercero, porque cada contrato es válido y debe analizarse de manera independiente.", "j": "Es incorrecta. Resulta plausible porque cada contrato cumple sus formalidades y la venta a la vinculada es la que muestra el menor precio. Falla porque el Estatuto Tributario, art. 869, permite recaracterizar una serie de operaciones, y el efecto de abuso aparece al mirar juntas la venta y la reventa. Error de granularidad.", "tipo": "granularidad"}, {"t": "Tratar la venta y la reventa como una serie que puede constituir abuso, cuyos efectos la Administración puede recaracterizar y desconocer.", "j": "Es correcta. El Estatuto Tributario, art. 869, faculta a la Administración Tributaria para recaracterizar o reconfigurar toda operación o serie de operaciones que constituya abuso en materia tributaria y desconocer sus efectos. La venta a una vinculada sin sustancia por debajo del avalúo y la reventa inmediata a precio de mercado deben valorarse en conjunto, dentro de la fiscalización que el Decreto 1742 de 2020, art. 1, asigna a la DIAN.", "tipo": null}, {"t": "Aceptar las dos operaciones hasta que un juez declare la simulación de los contratos, porque la DIAN no puede desconocer actos válidos.", "j": "Es incorrecta. Es plausible porque la validez civil de los contratos suele discutirse ante los jueces. Falla porque el Estatuto Tributario, art. 869, atribuye a la propia Administración Tributaria la facultad de recaracterizar la operación abusiva y desconocer sus efectos. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M011", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869", "fecha": "2026-10-24"}, {"fila": "M083", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E11-010-1", "caso_id": "C-E11-010", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 641", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II Ricardo Mora, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración del impuesto sobre la renta del año gravable 2023 de Ferretería Los Almendros S.A.S. El plazo para declarar venció el 15 de abril de 2024 y la declaración se presentó el 3 de junio de 2026, por iniciativa propia de la sociedad y sin actuación previa de la Administración. El impuesto a cargo declarado es de $12.000.000. En la misma declaración la sociedad liquidó una sanción por extemporaneidad de $15.600.000, equivalente a 26 meses de retardo al cinco por ciento. El contador sostiene que el cálculo es correcto porque cada fracción de mes cuenta como mes completo. La revisión está en la etapa de verificación de la sanción autoliquidada, sin considerar otros factores de graduación ni intereses.", "enunciado": "Diagnostique la inconsistencia de la sanción autoliquidada y determine el valor que corresponde.", "opciones": [{"t": "$12.000.000, porque los 26 meses suman 130 % y la sanción no puede exceder el impuesto a cargo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 641, fija el 5 % del impuesto a cargo por cada mes o fracción de mes de retardo, 'sin exceder del ciento por ciento (100%) del impuesto'. Del 15 de abril de 2024 al 3 de junio de 2026 hay 25 meses completos y una fracción, 26 periodos que suman 130 %; el tope reduce la sanción a $12.000.000.", "tipo": null}, {"t": "$15.000.000, porque se cuentan solo los 25 meses completos de retardo y se descarta la fracción final del periodo.", "j": "Es incorrecta. Resulta plausible porque del 15 de abril de 2024 al 15 de mayo de 2026 hay 25 meses completos. Sin embargo, el Estatuto Tributario, art. 641, cuenta cada mes o fracción de mes calendario, lo que da 26 periodos, y además limita la sanción al 100 % del impuesto. Error de granularidad: descarta la fracción final y omite el tope.", "tipo": "granularidad"}, {"t": "$15.600.000, porque los 26 meses de retardo están bien contados y cada mes suma el cinco por ciento.", "j": "Es incorrecta. Es plausible porque el conteo de 26 periodos, con la fracción final, es correcto y el 5 % por mes es la tarifa del Estatuto Tributario, art. 641. Sin embargo, la misma norma limita la sanción 'sin exceder del ciento por ciento (100%) del impuesto', y el 130 % supera ese límite. Error de completitud: aplica la tarifa y omite el tope.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E01-008-1", "caso_id": "C-E01-008", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Sergio Luna, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, apoya la consolidación del informe de gestión sobre denuncias del primer trimestre de 2026. Entre enero y marzo se radicaron 86 denuncias: 51 por evasión, 22 por contrabando, 9 por presunto lavado de activos y 4 por corrupción; 70 ya fueron direccionadas y 16 siguen en precrítica al cierre del trimestre. Una circular del Director General fija un formato único y un plazo de diez días hábiles después del cierre de cada trimestre para estos informes. El director seccional prefiere un informe semestral en formato propio, con el argumento de que reduce la carga del equipo. Sergio debe entregar el borrador el 8 de abril y anexar la trazabilidad de los radicados de cada denuncia en el expediente electrónico.", "enunciado": "¿Cómo debe Sergio estructurar la entrega del informe para cumplir la regla que rige estos reportes?", "opciones": [{"t": "Con el formato único del Director General, pero con corte semestral, porque así lo dispuso el director seccional para su jurisdicción.", "j": "Es incorrecta. Es plausible porque respeta el formato de la circular y atiende la preferencia del director seccional, que dirige la gestión en su territorio. Falla porque el Decreto 1742 de 2020, artículo 33, remite al Director General tanto la forma como la «oportunidad» de los informes; la circular fijó un plazo trimestral, y el corte semestral acoge la forma y omite la oportunidad. Error de completitud.", "tipo": "completitud"}, {"t": "Con el formato único y el plazo trimestral del Director General, e incluir las denuncias direccionadas y las que siguen en precrítica.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 33, ordena presentar «los informes periódicos de su gestión en la forma y oportunidad que establezca el Director General», y el numeral 3 del mismo artículo define esa gestión como recibir, clasificar y direccionar las denuncias. El consolidado trimestral, en el formato de la circular, recoge las 86 denuncias del periodo: 70 direccionadas y 16 en clasificación.", "tipo": null}, {"t": "Con el formato y el plazo trimestral del Director General, con las 70 denuncias direccionadas, y las demás en el informe siguiente.", "j": "Es incorrecta. Es plausible porque acoge la forma y la oportunidad que fijó el Director General y reporta lo que ya tiene un resultado. Falla porque el Decreto 1742 de 2020, artículo 33, exige informes periódicos «de su gestión», y esa gestión comprende recibir, clasificar y direccionar las denuncias (numeral 3); las 16 que siguen en precrítica ya fueron recibidas en el trimestre y su clasificación está en curso, de modo que aplazarlas confunde la etapa del trámite con el periodo del informe. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M059", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E04-005-1", "caso_id": "C-E04-005", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "En la fiscalización del impuesto de renta del año gravable 2025 de Inversiones Cumbre S.A.S., un Gestor II de la división de fiscalización y liquidación de una Dirección Seccional establece que la sociedad compró tres inmuebles por 2.700 millones de pesos entre marzo y agosto de 2025. Los pagos se hicieron con consignaciones en efectivo del socio mayoritario, cuyos ingresos declarados en 2024 equivalen a 1.200 UVT. La sociedad no registró pasivos con el socio ni aportes de capital. El 14 de septiembre de 2026 el Gestor entrega a su jefe un borrador de memorando que dice: «Se configuró el delito de lavado de activos; se compulsan copias y la división se abstiene de proponer la liquidación de revisión hasta que exista sentencia penal». La sociedad aún no ha recibido requerimiento especial.", "enunciado": "¿Qué defecto debe diagnosticar el jefe en el borrador del memorando antes de firmarlo?", "opciones": [{"t": "El memorando omite citar el artículo 323 con su modificación de 2015; con esa precisión normativa la compulsa quedaría bien sustentada.", "j": "Es incorrecta. Es plausible porque la Ley 599 de 2000, art. 323, fue modificada por la Ley 1762 de 2015 y citar la versión vigente es buena práctica. Falla porque el defecto no es de cita: el memorando declara configurado un delito, calificación que no corresponde a la DIAN según el Decreto 1742 de 2020, art. 33. Error de granularidad.", "tipo": "granularidad"}, {"t": "El memorando califica el delito, cuando a la DIAN le corresponde poner en conocimiento los hechos de adquisición de bienes con posible origen ilícito.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, núm. 1, asigna a la DIAN las acciones de investigación administrativa y el deber de poner en conocimiento inmediato de la autoridad competente la posible comisión de delitos. Adquirir bienes con recursos de origen no justificado coincide con conductas de la Ley 599 de 2000, art. 323, pero la DIAN reporta y no tipifica.", "tipo": null}, {"t": "El memorando es prematuro, porque los hechos deben informarse después de que la liquidación oficial de revisión quede en firme.", "j": "Es incorrecta. Es plausible porque la firmeza da certeza sobre los ingresos omitidos. Falla porque el Decreto 1742 de 2020, art. 33, núm. 1, ordena poner en conocimiento inmediato la posible comisión de delitos; atar el aviso a la firmeza del acto tributario lo aplaza sin fundamento. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M027", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 323", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#323", "fecha": "2026-10-24"}]}, {"id": "C-E05-005-1", "caso_id": "C-E05-005", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 712", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Luisa Ortega, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, efectúa el control de calidad del proyecto de liquidación de revisión de la declaración de IVA de Servicios Épsilon S.A.S. El documento identifica la razón social y el NIT del contribuyente, detalla las bases gravables recalculadas, que suman 2.450 millones de pesos, y liquida un mayor impuesto de 465,5 millones con la sanción correspondiente. El campo de la fecha quedó en blanco porque se diligenciará al momento de la firma, y el encabezado menciona el año 2025 sin indicar a qué bimestre corresponde el ajuste. El expediente contiene seis declaraciones bimestrales del mismo año, dos de ellas con requerimiento especial vigente. La jefatura exige que el acto salga sin vicios de contenido y que la lista de chequeo quede archivada en el expediente.", "enunciado": "Determine qué omisión del proyecto debe corregirse para que el acto cumpla su contenido mínimo.", "opciones": [{"t": "Precisar el bimestre del ajuste, porque el período gravable es contenido obligatorio del acto.", "j": "Es correcta. El Estatuto Tributario, art. 712, lit. b, exige que la liquidación de revisión indique el período gravable al que corresponde. Con seis declaraciones bimestrales del mismo año, mencionar 2025 no identifica la declaración modificada; los otros elementos del art. 712 que describe el caso (razón social, NIT, bases de cuantificación y monto del impuesto y la sanción) ya figuran en el proyecto.", "tipo": null}, {"t": "Diligenciar la fecha antes de la firma, porque sin ella el acto carece de un requisito y no puede notificarse.", "j": "Es incorrecta. Es plausible porque la fecha aparece en la lista del Estatuto Tributario, art. 712, lit. a. Pero la misma norma prevé que, en caso de no indicarse, se tendrá como tal la de su notificación, de modo que su ausencia no impide la notificación; la opción pasa por alto ese detalle de la regla (granularidad).", "tipo": "granularidad"}, {"t": "Transcribir la respuesta al requerimiento especial, porque el contenido mínimo del acto exige incluirla íntegra.", "j": "Es incorrecta. Resulta atractiva porque la respuesta del contribuyente es una pieza central del expediente. Pero el Estatuto Tributario, art. 712, enumera fecha, período, nombre o razón social, NIT, bases de cuantificación y monto de tributos y sanciones, sin incluir esa transcripción; la opción añade un elemento ajeno a la lista legal (completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M040", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 712", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#712", "fecha": "2026-10-24"}]}, {"id": "C-E04-009-1", "caso_id": "C-E04-009", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["NORMATIVA CAMBIARIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El 18 de agosto de 2026 una Dirección Seccional recibe tres insumos sobre la Trilladora San Marcial S.A.S.: un informe de una entidad de vigilancia que reporta compras de divisas por 420.000 dólares sin reintegro en el mercado cambiario, una denuncia ciudadana que atribuye al gerente la recepción de dinero de un tercero que no identifica, y un reporte interno que muestra ingresos declarados en 2025 por 3.400 UVT frente a consignaciones por diez veces ese valor. Un Gestor II debe hacer la precrítica en tres días hábiles. El jefe de la división le indica que, por economía procesal, se consolide todo en un único expediente cambiario y que los demás hechos se valoren cuando termine esa actuación, ya que el informe de la entidad de vigilancia es el insumo con mayor respaldo documental.", "enunciado": "¿Qué objeción debe plantear el Gestor a la instrucción recibida?", "opciones": [{"t": "Que el expediente único es viable, pero la precrítica debe suspenderse hasta que el gerente identifique al tercero del que recibió el dinero denunciado y se aclare su origen.", "j": "Es incorrecta. Es plausible porque la identificación del tercero daría solidez a la denuncia. Falla porque el Decreto 1742 de 2020, art. 33, sitúa la clasificación y el direccionamiento en el momento de recibir la denuncia, no después de recaudar prueba adicional. Error de fase.", "tipo": "fase"}, {"t": "Que los hechos de presunto lavado y los tributarios deben clasificarse y direccionarse a la dependencia de la DIAN o a la entidad competente que corresponda, sin esperar el cierre del expediente cambiario.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, núm. 3, ordena recibir, clasificar y direccionar a las dependencias de la DIAN y a las entidades competentes las denuncias por evasión y lavado de activos: los hechos tributarios van a la dependencia de fiscalización de la propia DIAN y el presunto lavado a la dependencia o entidad competente. El Decreto Ley 2245 de 2011, art. 7, permite abrir en paralelo la actuación cambiaria con el informe recibido.", "tipo": null}, {"t": "Que la actuación cambiaria no puede abrirse con el informe de la entidad de vigilancia, porque el traslado de otras autoridades exige una queja ciudadana que lo respalde y lo haga creíble.", "j": "Es incorrecta. Es plausible porque en el caso coexisten un informe oficial y una denuncia ciudadana. Falla porque el Decreto Ley 2245 de 2011, art. 7, admite el inicio por traslado de otras autoridades o por informes de terceros, sin exigir que una fuente respalde a la otra. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M005", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#7", "fecha": "2026-10-24"}]}, {"id": "C-E05-002-1", "caso_id": "C-E05-002", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 702", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Julián Rojas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe para revisión técnica el expediente de IVA del cuarto bimestre de 2024 de Distribuidora Beta Ltda. El 3 de febrero de 2026 la División notificó una liquidación de revisión que rechazó IVA descontable por 410 millones de pesos, glosa propuesta en el requerimiento especial de 2025. El contribuyente interpuso recurso, que sigue en trámite. En marzo de 2026, un cruce con la facturación electrónica revela ingresos por 1.350 millones de pesos omitidos en esa misma declaración, que no se mencionaron en el requerimiento ni en su ampliación. El auditor que detectó el cruce propone proferir una segunda liquidación de revisión para el mismo bimestre, con el argumento de que el término legal para hacerlo aún no ha vencido. La coordinadora pide un concepto antes de asignar recursos a esa actuación.", "enunciado": "Decida si la actuación que propone el auditor es procedente y sustente su decisión.", "opciones": [{"t": "Procede ampliar el requerimiento especial para incorporar los ingresos y luego reliquidar el bimestre.", "j": "Es incorrecta. Resulta atractiva porque la ampliación es el medio para incorporar hechos al debate antes de liquidar, según el Estatuto Tributario, art. 711. Pero esa etapa ya se cerró con la liquidación de revisión notificada, y el art. 702 impide una nueva modificación; la opción retrocede a una fase agotada del procedimiento (fase).", "tipo": "fase"}, {"t": "No procede, porque la liquidación privada de ese bimestre ya fue modificada la vez que la ley permite.", "j": "Es correcta. El Estatuto Tributario, art. 702, faculta a la Administración para modificar las liquidaciones privadas por una sola vez mediante liquidación de revisión. La declaración del cuarto bimestre ya fue modificada por el acto notificado el 3 de febrero de 2026, de modo que el hallazgo posterior no habilita un segundo acto de revisión.", "tipo": null}, {"t": "Procede, porque los ingresos omitidos son hechos nuevos que no fueron objeto del primer acto de revisión.", "j": "Es incorrecta. Es plausible porque los ingresos no se discutieron en el primer acto y el art. 711 del Estatuto Tributario limita cada liquidación a los hechos del requerimiento. Pero el art. 702 permite modificar la liquidación privada por una sola vez, con independencia de que aparezcan hechos nuevos; la opción omite ese límite (completitud).", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M037", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 702", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#702", "fecha": "2026-10-24"}, {"fila": "M039", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 711", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#711", "fecha": "2026-10-24"}]}, {"id": "C-E10-010-1", "caso_id": "C-E10-010", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 720", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "La liquidación oficial de revisión contra Textiles Sabana S.A.S. por el impuesto sobre la renta del año gravable 2022, que adicionó 2.750 UVT de renta líquida, se notificó el 21 de abril de 2026. El 12 de mayo de 2026 el representante legal radica un escrito en la Dirección Seccional en el que expone argumentos contra la adición, aporta dos certificaciones bancarias y pide dejar sin efecto el acto. El escrito no indica el nombre del recurso y fue repartido a la división de fiscalización y liquidación, donde el Gestor II Pineda revisa jurídicamente el expediente. En el reparto algunos funcionarios proponen tratar el escrito como petición de revocatoria directa y otros como simple solicitud de aclaración, con archivo del radicado. El expediente conserva la constancia de notificación del acto y del radicado.", "enunciado": "Diagnostique la calificación jurídica que corresponde al escrito radicado por el representante legal.", "opciones": [{"t": "Debe tratarse como recurso de reconsideración, porque contra las liquidaciones oficiales procede ese recurso y el escrito controvierte la adición.", "j": "Es correcta. El art. 720 del Estatuto Tributario dispone que contra las liquidaciones oficiales y demás actos producidos en relación con los impuestos administrados procede el recurso de reconsideración, y el art. 29 de la Constitución Política exige aplicar el debido proceso.", "tipo": null}, {"t": "Debe tratarse como petición de revocatoria directa del acto, porque el interesado pide dejarlo sin efecto y aporta prueba documental nueva.", "j": "Es incorrecta. Resulta verosímil por la pretensión del escrito, pero el art. 720 del Estatuto Tributario fija la reconsideración como el medio de impugnación contra la liquidación oficial notificada. Error de norma.", "tipo": "norma"}, {"t": "Debe tratarse como solicitud de aclaración del acto notificado y archivarse el radicado, porque el escrito no identifica el recurso que interpone.", "j": "Es incorrecta. Es plausible por la informalidad del escrito, pero el archivo desconoce el recurso que el art. 720 del Estatuto Tributario concede contra las liquidaciones oficiales y el debido proceso del art. 29 de la Constitución Política. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M049", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 720", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#720", "fecha": "2026-10-24"}, {"fila": "M046", "norma": "Constitución Política de Colombia", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#29", "fecha": "2026-10-24"}]}, {"id": "C-E09-007-1", "caso_id": "C-E09-007", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 686", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "La Gestora II Natalia Ospina, de la división de fiscalización y liquidación de una Dirección Seccional, investiga la declaración de renta del año gravable 2024 de Constructora Puerto Alto S.A.S., que registra costos por 6.500 UVT soportados en compras a Ferretería El Cerro S.A.S. El 4 de mayo de 2026 la Gestora envió a la ferretería, que no está siendo investigada, un requerimiento de información para que aportara las facturas, los comprobantes de pago y el registro de despachos a la constructora, con un plazo de respuesta que venció el 19 de mayo. La ferretería respondió el 2 de junio que solo debe entregar información sobre sus propias declaraciones y que cualquier dato sobre sus clientes debe pedirse directamente a la constructora. La Gestora debe decidir cómo tratar esa respuesta en el expediente y dejar constancia de su decisión.", "enunciado": "¿Qué decisión debe tomar la Gestora frente a la respuesta de la ferretería?", "opciones": [{"t": "Aceptarla, porque pedir información a un tercero que no está siendo investigado exige una autorización judicial previa.", "j": "Es incorrecta. Es plausible porque algunas medidas sobre terceros sí requieren control judicial; falla porque el Estatuto Tributario, art. 686, deja a juicio de la Administración la necesidad de la información y no condiciona el requerimiento a una orden del juez. Error de competencia: atribuye a otra autoridad una facultad propia de la DIAN.", "tipo": "competencia"}, {"t": "Aceptarla, porque el deber de atender requerimientos de información recae en el contribuyente investigado y no en sus proveedores.", "j": "Es incorrecta. Es plausible porque el foco de la investigación es la constructora; falla porque el Estatuto Tributario, art. 686, extiende el deber de atender requerimientos a la información necesaria para verificar la situación impositiva de terceros relacionados con el requerido. Error de completitud: deja por fuera a los terceros que la norma comprende.", "tipo": "completitud"}, {"t": "Tratarla como desatención del requerimiento, porque la información es necesaria para verificar la situación impositiva de un tercero relacionado.", "j": "Es correcta. El Estatuto Tributario, art. 686, dispone que se deben atender los requerimientos de informaciones y pruebas relacionadas con investigaciones de la Administración cuando, a juicio de esta, sean necesarios para verificar la situación impositiva de unos y otros, o de terceros relacionados con ellos. La ferretería es proveedora de la constructora investigada y además respondió fuera de plazo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M008", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 686", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#686", "fecha": "2026-10-24"}]}, {"id": "C-E08-003-1", "caso_id": "C-E08-003", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 2", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II estudia un expediente cambiario abierto el 2 de abril contra la sociedad Maquinarias del Litoral S. A. S. Los hechos investigados ocurrieron entre agosto y noviembre de hace cuatro años: la empresa canalizó por su cuenta de compensación veintidós operaciones de importación y dejó de transmitir al Banco de la República nueve declaraciones de cambio dentro de la oportunidad legal entonces vigente. Con posterioridad a esos hechos, el régimen cambiario cambió el formato y el canal electrónico de transmisión, sin modificar los plazos. El apoderado alega que, al haber cambiado el régimen, la conducta debe valorarse con las reglas actuales, que la actuación debe archivarse y que el asunto tiene naturaleza penal porque hubo manejo de divisas. El expediente está en valoración probatoria, antes de la formulación de cargos, y el coordinador pide un diagnóstico escrito.", "enunciado": "¿Cómo debe diagnosticar el Gestor II la calificación de la conducta frente a los alegatos del apoderado?", "opciones": [{"t": "La conducta se califica con las disposiciones cambiarias vigentes al momento de la transgresión y es una contravención administrativa.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 2, define la infracción cambiaria como contravención administrativa de las disposiciones constitutivas del régimen cambiario vigentes al momento de la transgresión; el cambio posterior de formato y canal, que no tocó los plazos, no altera esa calificación.", "tipo": null}, {"t": "La conducta se califica con las condiciones de transmisión vigentes a la fecha de formulación de cargos, que son las aplicables al expediente.", "j": "Es incorrecta. Resulta plausible porque los cargos se formularán bajo el régimen actual, pero el Decreto Ley 2245 de 2011, art. 2, remite a las disposiciones vigentes al momento de la transgresión, no a las del acto de trámite. Error de norma.", "tipo": "norma"}, {"t": "La conducta pertenece a la jurisdicción penal por el manejo de divisas, de modo que la división debe archivar la investigación administrativa.", "j": "Es incorrecta. Resulta plausible porque algunas conductas con divisas tienen reproche penal, pero el Decreto Ley 2245 de 2011, art. 2, califica la infracción cambiaria como contravención administrativa con sanción propia, que la DIAN determina. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M022", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#2", "fecha": "2026-10-24"}]}, {"id": "C-E11-009-1", "caso_id": "C-E11-009", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 684", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "La Gestora II Carolina Vega, de la División de Fiscalización y Liquidación de una Dirección Seccional, debe clasificar tres insumos recibidos en la semana. Insumo 1: el cruce de información exógena muestra que terceros reportaron pagos por $1.200.000.000 a Servicios Logísticos Llano Grande S.A.S., que declaró ingresos por $700.000.000 en el año gravable 2024. Insumo 2: una denuncia, con facturas adjuntas, señala que una persona natural vende maquinaria usada desde 2023 y no ha presentado declaración de renta, aunque sus ventas anuales superan $2.000.000.000. Insumo 3: un contribuyente se queja porque un funcionario de la ventanilla de atención demoró la entrega de una certificación. La jefatura pide clasificar cada insumo según su potencial para el programa de fiscalización de la División antes del comité de selección.", "enunciado": "Evalúe los insumos y decida la clasificación que corresponde a cada uno.", "opciones": [{"t": "El 1 para verificar exactitud, el 2 para investigar hechos no declarados y el 3 para una investigación disciplinaria de la División.", "j": "Es incorrecta. Es plausible porque la queja describe una conducta de un servidor que merece atención. Sin embargo, la División ejerce las facultades del Estatuto Tributario, art. 684, sobre declaraciones y hechos generadores; la queja de servicio no tiene potencial de fiscalización y su trámite disciplinario corresponde a otra instancia. Error de competencia: asigna a la División un asunto ajeno a sus facultades.", "tipo": "competencia"}, {"t": "El 1 para verificar exactitud, el 2 para investigar hechos no declarados y el 3 no sustenta una investigación tributaria.", "j": "Es correcta. El Estatuto Tributario, art. 684, faculta a 'verificar la exactitud de las declaraciones' (literal a), supuesto del insumo 1, cuyo cruce del art. 631 muestra diferencias frente a lo declarado, y a 'establecer la ocurrencia de hechos generadores de obligaciones tributarias, no declarados' (literal b), supuesto del insumo 2. La queja de atención no remite a ninguna de esas facultades.", "tipo": null}, {"t": "El 1 para investigar hechos no declarados, el 2 para verificar exactitud de declaraciones y el 3 no sustenta investigación tributaria.", "j": "Es incorrecta. Resulta plausible porque el insumo 1 también revela ingresos que no aparecen en la declaración. Sin embargo, el Estatuto Tributario, art. 684, literal a, se refiere a verificar la exactitud de declaraciones presentadas, y el insumo 2 no tiene declaración que verificar; su caso es el del literal b. Error de norma: invierte los supuestos de los literales a y b.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}, {"fila": "M003", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 631", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#631", "fecha": "2026-10-24"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación. La División Jurídica de la Seccional solicita, con plazo de cinco días hábiles, el expediente de Lácteos del Páramo S.A. para atender una demanda contra una liquidación oficial del impuesto sobre la renta de 2021. Según el inventario documental firmado al cerrar la etapa de discusión, el expediente tiene tres cuadernos y 412 folios. El conteo físico que usted hace hoy arroja 389 folios: el tercer cuaderno, con las pruebas del recurso, termina en el folio 389. El índice del sistema relaciona documentos hasta el folio 412, pero sin imágenes cargadas para los últimos 23. Un auxiliar sugiere remitir lo que hay y anotar la diferencia en el oficio, porque el término de la División Jurídica vence antes de que termine la búsqueda en el archivo de gestión.", "enunciado": "Diagnostique la situación del expediente y lo que debe hacerse antes de remitirlo.", "opciones": [{"t": "Debe remitirse con 389 folios para que la División Jurídica reconstruya el faltante, pues es la dependencia que usará el expediente.", "j": "Es incorrecta. Es plausible porque la División Jurídica será la usuaria, pero el control del expediente corresponde a la dependencia que lo produjo y lo inventarió, según la Ley 594 de 2000, art. 26; el usuario no puede reconstruir folios que nunca tuvo. Error de competencia.", "tipo": "competencia"}, {"t": "Faltan 23 folios inventariados; deben ubicarse con base en el inventario para que el expediente sea recuperable antes de remitirlo.", "j": "Es correcta. La Ley 594 de 2000, art. 26, exige inventarios que aseguren el control de los documentos en sus diferentes fases, y el inventario de cierre prueba que los folios 390 a 412 existían. El art. 4 fija como objetivo que la información sea recuperable para uso de la administración, y la defensa judicial necesita las pruebas del recurso completas.", "tipo": null}, {"t": "La diferencia es menor frente al total y puede suplirse con el índice del sistema, que basta para acreditar los documentos.", "j": "Es incorrecta. Es plausible porque el índice describe los 23 documentos, pero una referencia descriptiva sin imagen no equivale al documento; la Ley 594 de 2000, art. 4, exige que la información misma sea recuperable, no solo su registro. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M097", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-24"}, {"fila": "M093", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#4", "fecha": "2026-10-24"}]}, {"id": "C-E06-001-1", "caso_id": "C-E06-001", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Laura Méndez, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe el 18 de agosto de 2025 un expediente remitido por el área de devoluciones. La sociedad Alfa Insumos S.A.S. presentó su declaración de renta del año gravable 2024 el 12 de mayo de 2025 con un saldo a favor de 1.800 UVT y pidió su devolución el 2 de julio de 2025. El área de devoluciones detectó costos por 420 UVT soportados en documentos de un proveedor que no aparece en los registros de facturación. El 25 de agosto el representante legal radica un escrito en el que sostiene que la DIAN, una vez iniciado el trámite de devolución, solo puede pronunciarse sobre la devolución misma, y que verificar los costos o proponer una sanción excede lo que le corresponde como entidad encargada del recaudo. Laura debe responder el escrito antes de abrir la verificación.", "enunciado": "¿Con qué fundamento debe Laura responder el escrito del representante legal?", "opciones": [{"t": "La Administración puede verificar los costos y proponer sanción, aunque solo después de que el área de devoluciones resuelva la solicitud en su totalidad.", "j": "Es incorrecta. Resulta plausible porque el trámite de devolución está en curso y parece razonable cerrarlo primero. Falla porque el Decreto 1742 de 2020, art. 1, ubica fiscalización, devolución y sanción dentro de una misma administración del impuesto, sin exigir que una etapa concluya para que la otra se active. Error de fase.", "tipo": "fase"}, {"t": "La DIAN puede verificar los costos dentro de la devolución, pero la sanción debe tramitarla otra autoridad, pues su administración cubre recaudo y control.", "j": "Es incorrecta. Es plausible porque reconoce la facultad de verificar los costos dentro del trámite. Falla porque el Decreto 1742 de 2020, art. 1, incluye expresamente la sanción entre los componentes de la administración de los impuestos que corresponde a la DIAN. Error de completitud: enumera solo parte de las funciones.", "tipo": "completitud"}, {"t": "La administración del impuesto comprende fiscalización, liquidación, devolución y sanción, así que verificar los costos cabe en sus funciones.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, dispone que la administración de los impuestos comprende su recaudación, fiscalización, liquidación, discusión, cobro, devolución, sanción y todos los demás aspectos relacionados con el cumplimiento de las obligaciones tributarias. Verificar costos dentro de una devolución es fiscalización y proponer una sanción es sanción, ambas dentro de esa administración. La objeción del representante legal reduce la entidad al recaudo y desconoce ese alcance.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M083", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E02-010-1", "caso_id": "C-E02-010", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Ley 594 de 2000, art. 12", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación. La Dirección Seccional contrató a Soluciones Documentales del Norte S.A.S. para digitalizar 2.300 expedientes de fiscalización activos, con plazo hasta el 31 de octubre de 2025. En un muestreo de 150 expedientes, usted detecta 37 con imágenes ilegibles o con folios omitidos frente al original físico. El contratista afirma que entregó a tiempo y que su obligación terminó con la carga al sistema. El jefe de la división opina que el problema es del contratista y que la división puede seguir trabajando con las imágenes. Tres de los expedientes afectados tienen liquidación oficial por proyectar este mes y otros dos esperan respuesta a requerimiento especial. Los originales físicos siguen en la bodega de la Seccional, a la espera de traslado.", "enunciado": "Diagnostique a quién corresponde responder por la calidad de esos documentos y qué implica para su trabajo.", "opciones": [{"t": "Responde el contratista, que asumió por contrato la gestión de esas imágenes, y la división puede seguir proyectando con ellas.", "j": "Es incorrecta. Es plausible porque el contrato fija obligaciones al contratista, pero la Ley 594 de 2000, art. 12, hace responsable a la administración pública de la gestión de sus documentos; esa responsabilidad no se traslada por contrato. Error de competencia.", "tipo": "competencia"}, {"t": "Responde la Seccional, que cumple al conservar los originales físicos, sin necesidad de revisar la fidelidad de las imágenes cargadas.", "j": "Es incorrecta. Es plausible porque identifica bien al responsable, pero omite que la Ley 594 de 2000, art. 16, exige velar por la integridad y fidelidad de la información, y las imágenes que se usarán para decidir presentan folios omitidos. Error de completitud.", "tipo": "completitud"}, {"t": "Responde la Seccional, que debe verificar la fidelidad de las imágenes frente a los originales antes de usarlas para decidir.", "j": "Es correcta. La Ley 594 de 2000, art. 12, hace a la administración pública responsable de la gestión de sus documentos, aunque contrate la digitalización, y el art. 16 obliga a velar por la integridad, autenticidad, veracidad y fidelidad de la información de los documentos de archivo. Antes de proyectar liquidaciones con esas imágenes, deben cotejarse con los originales.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M095", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#12", "fecha": "2026-10-24"}, {"fila": "M096", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#16", "fecha": "2026-10-24"}]}, {"id": "C-E04-008-1", "caso_id": "C-E04-008", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto 1165 de 2019, art. 51, núm. 13", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Un Gestor II de la división de fiscalización y liquidación de una Dirección Seccional revisa el expediente de la Agencia de Aduanas Meridiano S.A.S. Nivel 1. Entre enero y octubre de 2025 la agencia tramitó las declaraciones de importación de 23 contenedores de un mismo cliente que luego resultó sin instalaciones ni empleados; el jefe de operaciones de la agencia dejó por escrito que las mercancías llegaban sin trazabilidad del pago y que tres contenedores salieron con documentos de transporte alterados. La agencia no informó nada a la DIAN ni a otra autoridad. El 7 de mayo de 2026 la división debe decidir el curso de la actuación. En el proyecto de informe, un auxiliar propone concluir que la agencia incumplió un deber de reporte y, además, que participó en operaciones con mercancías de origen ilícito, por lo que debe liquidarse la sanción correspondiente al delito.", "enunciado": "¿Cómo debe valorar el Gestor las dos conclusiones del proyecto de informe?", "opciones": [{"t": "La segunda conclusión se sostiene y la primera no, porque el deber de reporte de la agencia de aduanas se limita a las infracciones cambiarias que detecte en su actividad.", "j": "Es incorrecta. Es plausible porque el Decreto 1165 de 2019, art. 51, núm. 13, menciona las infracciones cambiarias entre los hechos reportables. Falla porque el mismo numeral incluye la evasión, el contrabando y el lavado de activos; el recorte del deber no se desprende de la norma, y además la DIAN no tipifica delitos. Error de norma.", "tipo": "norma"}, {"t": "Las dos conclusiones se sostienen, porque la agencia incumplió el deber de reporte y su participación en operaciones con bienes de origen ilícito quedó probada en el expediente.", "j": "Es incorrecta. Es plausible porque la agencia sí incumplió el deber del Decreto 1165 de 2019, art. 51, núm. 13, y el escrito del jefe de operaciones es un indicio fuerte. Falla porque el Decreto 1742 de 2020, art. 33, núm. 1, asigna a la DIAN la investigación administrativa y el aviso inmediato a la autoridad competente; declarar probado el delito y sancionarlo excede esa función. Error de competencia.", "tipo": "competencia"}, {"t": "La primera conclusión se sostiene y la segunda no, porque los hechos sobre mercancías de posible origen ilícito se ponen en conocimiento de la autoridad competente.", "j": "Es correcta. El Decreto 1165 de 2019, art. 51, núm. 13, impone a las agencias de aduanas reportar a la DIAN o a las autoridades competentes las operaciones sospechosas que detecten en su actividad, deber que la agencia no cumplió; y el Decreto 1742 de 2020, art. 33, núm. 1, ordena poner en conocimiento inmediato de la autoridad competente la posible comisión de delitos, sin que la DIAN los tipifique ni los sancione.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M025", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 51", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#51", "fecha": "2026-10-24"}, {"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E02-003-1", "caso_id": "C-E02-003", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Evaluar", "fuente": "Ley 594 de 2000, art. 11", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional y coordina la transferencia al archivo central de 46 expedientes de fiscalización terminados entre 2022 y 2023, programada para el 15 de noviembre de 2025. Un auxiliar propone reordenar los folios de cada expediente por tipo documental, con todos los actos al inicio y todas las pruebas al final, para facilitar consultas futuras. También propone enviar las cajas sin inventario, porque el sistema de gestión tiene índice electrónico. Usted verifica que solo 32 de los 46 expedientes tienen el índice cargado completo y que los demás tienen folios sin registrar. El archivo central exige recibir las cajas con soporte de la entrega. El jefe de la división le pide valorar la propuesta antes de firmar el oficio de remisión.", "enunciado": "Evalúe la propuesta del auxiliar y sustente la decisión que debe tomarse.", "opciones": [{"t": "Aceptarla: el orden original y el inventario se exigen cuando los expedientes pasan al archivo histórico, no al archivo central.", "j": "Es incorrecta. Es plausible porque el archivo histórico es una etapa del ciclo vital, pero la Ley 594 de 2000, art. 26, exige que el inventario asegure el control de los documentos en sus diferentes fases, y el art. 11 aplica el orden original desde la organización inicial. Error de fase.", "tipo": "fase"}, {"t": "Rechazarla: los folios conservan el orden en que se produjeron y la transferencia requiere un inventario que asegure su control.", "j": "Es correcta. La Ley 594 de 2000, art. 11, obliga a organizar los archivos según los principios de procedencia y orden original y el ciclo vital de los documentos, lo que impide reordenar los folios por tipo documental. El art. 26 de la misma ley obliga a elaborar inventarios de los documentos producidos para asegurar su control en sus diferentes fases, incluida la transferencia al archivo central.", "tipo": null}, {"t": "Aceptarla en parte: elaborar inventario para los 14 expedientes sin índice y remitir los otros 32 con el índice del sistema.", "j": "Es incorrecta. Es plausible porque atiende el vacío de los expedientes sin índice, pero deja sin inventario a 32 expedientes y no corrige la reordenación de folios, que rompe el orden original exigido por la Ley 594 de 2000, art. 11. El art. 26 pide inventariar los documentos producidos, sin excepción por índice electrónico. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M094", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-24"}, {"fila": "M097", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-24"}]}, {"id": "C-E09-006-1", "caso_id": "C-E09-006", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 574", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II Mauricio Peña, de la división de fiscalización y liquidación de una Dirección Seccional, adelanta un programa de control a agentes de retención en la fuente. Fundación Horizonte Comunitario, entidad sin ánimo de lucro calificada como no contribuyente del impuesto sobre la renta, pagó honorarios y servicios entre enero y junio de 2026, practicó retenciones por 95 UVT según los certificados expedidos a sus proveedores y no presentó las declaraciones de retención de esos seis meses, cuyos plazos ya vencieron. La Administración no le ha notificado emplazamiento. El 10 de septiembre de 2026 su revisora fiscal informó por escrito que la fundación no presenta declaraciones tributarias porque no es contribuyente. El Gestor debe determinar el alcance de la obligación formal incumplida antes de proponer la actuación que corresponda ante la jefatura.", "enunciado": "¿Qué decisión debe adoptar el Gestor frente a la posición expresada por la fundación?", "opciones": [{"t": "Rechazarla, porque como agente de retención la fundación debía declarar las retenciones y su omisión la expone a la sanción por no declarar.", "j": "Es correcta. El Estatuto Tributario, art. 574, obliga a los contribuyentes, responsables y agentes de retención en la fuente a presentar las declaraciones tributarias; la fundación practicó retenciones, luego debía declararlas aunque no sea contribuyente de renta. El art. 643 sanciona a los agentes retenedores obligados a declarar que omitan la presentación.", "tipo": null}, {"t": "Aceptarla, porque la calidad de no contribuyente del impuesto sobre la renta la libera del deber de presentar declaraciones tributarias.", "j": "Es incorrecta. Es plausible porque la fundación no debe declarar renta como contribuyente; falla porque el Estatuto Tributario, art. 574, impone el deber de declarar también a los agentes de retención en la fuente, calidad que la fundación asumió al practicar retenciones. Error de completitud: considera solo una de las calidades que generan el deber de declarar.", "tipo": "completitud"}, {"t": "Aceptarla en parte, porque el deber de declarar las retenciones surge cuando la Administración le notifica un emplazamiento previo.", "j": "Es incorrecta. Es plausible porque el emplazamiento es un paso del trámite frente a quien omite declarar; falla porque el deber de presentar la declaración nace de la calidad de agente de retención (Estatuto Tributario, art. 574) y existía al vencer cada plazo, antes de cualquier actuación de la DIAN. Error de fase: traslada el nacimiento del deber a una etapa posterior del procedimiento.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M080", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 574", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#574", "fecha": "2026-10-24"}, {"fila": "M067", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 643", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#643", "fecha": "2026-10-24"}]}, {"id": "C-E01-001-1", "caso_id": "C-E01-001", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "Laura Méndez, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe el 4 de febrero de 2026 una denuncia anónima radicada en el buzón institucional. El escrito señala que Importadora Delta S.A.S. ingresó por un puerto del Caribe, entre octubre y diciembre de 2025, cuatro contenedores de calzado con un valor declarado de 310 UVT cada uno, cuando el valor de mercado estimado supera 1.400 UVT por contenedor. Añade que un servidor público de la administración aduanera habría recibido pagos para omitir la inspección física de la carga. La denuncia trae copia de dos transferencias bancarias y los números de las declaraciones de importación. La coordinadora pide concluir la precrítica antes del 11 de febrero y advierte que la división no adelanta investigaciones disciplinarias ni penales. El trámite sigue en análisis preliminar, sin auto de apertura.", "enunciado": "Para cerrar la precrítica, ¿qué decisión de direccionamiento debe sustentar Laura frente a los componentes de la denuncia?", "opciones": [{"t": "Abrir en la división una investigación que cubra la subvaloración y los pagos al servidor, porque los dos hechos provienen de la misma operación.", "j": "Es incorrecta. Es plausible porque ambos hechos se refieren a las mismas importaciones y la división fiscaliza operaciones aduaneras. Falla porque, en precrítica, el artículo 33, numeral 3, y el artículo 28, numeral 4, del Decreto 1742 de 2020 ordenan direccionar las denuncias a las dependencias y entidades competentes; la división no investiga la conducta del servidor, como advierte la coordinadora. Error de competencia.", "tipo": "competencia"}, {"t": "Clasificar los dos componentes y direccionar cada uno a la dependencia de la DIAN o a la entidad competente, incluida la presunta corrupción.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 33, numeral 3, asigna la función de «recibir, clasificar y direccionar a las dependencias de la DIAN y a las entidades competentes, las denuncias por contrabando, evasión, lavado de activos, corrupción y otros presuntos delitos», en concordancia con el artículo 28, numeral 4. La subvaloración y los pagos al servidor son hechos distintos que se clasifican y se envían a quien tiene competencia sobre cada uno.", "tipo": null}, {"t": "Direccionar el componente de contrabando y descartar el de los pagos al servidor, porque ese hecho no es materia que la DIAN clasifique.", "j": "Es incorrecta. Es plausible porque el artículo 28, numeral 4, del Decreto 1742 de 2020 enumera contrabando, evasión y lavado de activos sin nombrar la corrupción. Falla porque esa misma disposición incluye «otros presuntos delitos» y el artículo 33, numeral 3, menciona de forma expresa la corrupción entre las denuncias que se reciben, clasifican y direccionan; descartar ese componente deja incompleta la precrítica. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M001", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#28", "fecha": "2026-10-24"}]}, {"id": "C-E08-009-1", "caso_id": "C-E08-009", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Para el programa de control cambiario del próximo semestre, una Dirección Seccional dispone de capacidad operativa para ochenta casos. El análisis de riesgo entrega tres bolsas: cincuenta y dos exportadores con indicios de sobrefacturación por USD 18 millones y gastos asociados no soportados; dieciocho empresas con financiación en moneda extranjera de importaciones sin registro, por USD 6 millones; y nueve expedientes aduaneros de valoración en los que la liquidación oficial de revisión está en discusión ante el superior. El acta del comité del 14 de noviembre pide que el programa delimite el objeto cambiario. El Gestor II responsable de la planeación debe valorar qué operaciones entran en el programa y sustentar la decisión ante el comité.", "enunciado": "¿Qué decisión de programación debe sustentar el Gestor II ante el comité?", "opciones": [{"t": "Programar la sobrefacturación de exportaciones con sus gastos asociados y la financiación en moneda extranjera de importaciones sin registro.", "j": "Es correcta. El Decreto 1742 de 2020, art. 31, numeral 2, asigna la planeación y el control de las actividades del régimen cambiario en importación y exportación de bienes y servicios, los gastos asociados, la financiación en moneda extranjera y la sobrefacturación de esas operaciones.", "tipo": null}, {"t": "Posponer la programación cambiaria hasta que las nueve liquidaciones oficiales de revisión queden en firme y fijen los valores reales de las operaciones.", "j": "Es incorrecta. Resulta plausible porque los valores en discusión alimentarían el análisis de riesgo, pero el Decreto 1742 de 2020, art. 31, numeral 2, ordena planear y controlar las actividades cambiarias sin subordinarlas a la firmeza de actos aduaneros. Error de fase.", "tipo": "fase"}, {"t": "Programar la financiación en moneda extranjera de importaciones y dejar la sobrefacturación de exportaciones al control aduanero de valor, por su naturaleza.", "j": "Es incorrecta. Resulta plausible porque la sobrefacturación también interesa al control del valor, pero el Decreto 1742 de 2020, art. 31, numeral 2, incluye la sobrefacturación de esas operaciones en el control cambiario de la Entidad. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M057", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}]}, {"id": "C-E07-009-1", "caso_id": "C-E07-009", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 782", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "La Gestor II Mariana Quintero, de la división de fiscalización y liquidación de una Dirección Seccional, verifica obligaciones formales de Servicios Hoteleros Bahía Clara S.A.S. en el impuesto sobre las ventas de 2025. El expediente electrónico registra que la sociedad presentó las seis declaraciones bimestrales del año, pero el sistema de facturación electrónica muestra 1.430 documentos emitidos frente a 1.190 registrados en los libros auxiliares aportados el 17 de febrero de 2026. La sociedad está obligada a llevar contabilidad y sus libros están registrados. El auditor interno propone resolver el hallazgo con un simple cotejo de los archivos descargados del sistema, sin diligencia alguna sobre los libros, y dejar constancia en el expediente. La actuación está en investigación, el término de firmeza no se encuentra próximo y aún no se ha ordenado prueba alguna.", "enunciado": "Evalúe la propuesta del auditor interno y sustente la diligencia que corresponde ordenar.", "opciones": [{"t": "Es insuficiente: corresponde ordenar inspección contable a la sociedad, pues está obligada a llevar contabilidad y se verifica la exactitud de lo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 782, permite ordenar la práctica de la inspección contable al contribuyente obligado a llevar contabilidad para verificar la exactitud de las declaraciones y el cumplimiento de obligaciones formales, que es justo lo que exige la diferencia de 240 documentos. El art. 779 sustenta la actuación probatoria en esta etapa de investigación.", "tipo": null}, {"t": "Es insuficiente, pero la diligencia que corresponde es la inspección tributaria sobre terceros clientes, ya que los libros de la investigada están registrados.", "j": "Es incorrecta. Acierta en negar la suficiencia del cotejo, pero el registro de los libros no impide examinarlos: el Estatuto Tributario, art. 782, autoriza la inspección contable al contribuyente para verificar el cumplimiento de obligaciones formales. Error de competencia: dirige la diligencia a terceros y deja intacta la contabilidad cuestionada.", "tipo": "competencia"}, {"t": "Es suficiente, porque los archivos del sistema de facturación tienen mérito probatorio pleno y hacen innecesaria cualquier diligencia sobre la contabilidad.", "j": "Es incorrecta. Es plausible porque esos archivos provienen de un sistema institucional, pero el hallazgo consiste en una diferencia con los libros, y el Estatuto Tributario, art. 782, prevé la inspección contable al contribuyente obligado a llevar contabilidad para verificar la exactitud de las declaraciones y el cumplimiento de obligaciones formales. Error de granularidad: sustituye el examen de los libros por el cotejo de un extracto.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M010", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 782", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#782", "fecha": "2026-10-24"}, {"fila": "M009", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 779", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#779", "fecha": "2026-10-24"}]}, {"id": "C-E04-006-1", "caso_id": "C-E04-006", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 28", "integra": ["NORMAS Y TECNICAS DE AUDITORIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Para el plan operativo del primer semestre de 2026, la división de fiscalización y liquidación de una Dirección Seccional debe formular un programa dirigido a comercializadoras de chatarra. Un Gestor II reúne los insumos: 42 contribuyentes con compras en efectivo superiores a 15.000 UVT en 2025, nueve de ellos con proveedores inexistentes en el RUT y cuatro con operaciones de giro al exterior sin soporte cambiario. El cronograma de la seccional fija el 28 de febrero de 2026 como fecha límite para enviar la propuesta al nivel central y la evaluación de resultados para noviembre. En el comité, un asistente plantea que el programa se concentre solo en la verificación del IVA descontable, porque la detección de operaciones sospechosas de lavado de activos corresponde a otro proceso y no cabe en un programa de fiscalización.", "enunciado": "¿Cómo debe sustentar el Gestor el alcance del programa frente al planteamiento del asistente?", "opciones": [{"t": "El programa puede incluir la detección de operaciones sospechosas de lavado de activos junto con el control de las obligaciones tributarias y cambiarias.", "j": "Es correcta. El Decreto 1742 de 2020, art. 28, núm. 6, prevé la participación en la planeación, ejecución y evaluación de planes y programas de fiscalización y control destinados a determinar el cumplimiento de obligaciones tributarias, aduaneras y cambiarias, o que permitan detectar operaciones sospechosas relacionadas con el lavado de activos.", "tipo": null}, {"t": "El programa puede abarcar ese objetivo, pero la detección de operaciones sospechosas se incorpora al cerrar la evaluación de resultados de noviembre.", "j": "Es incorrecta. Es plausible porque la evaluación de resultados hace parte del ciclo del programa. Falla porque el Decreto 1742 de 2020, art. 28, núm. 6, contempla ese objetivo en la planeación, la ejecución y la evaluación, no solo al final del ciclo. Error de fase.", "tipo": "fase"}, {"t": "El programa debe limitarse a las obligaciones tributarias y cambiarias, y la detección de operaciones sospechosas se atiende por fuera de la planeación de fiscalización.", "j": "Es incorrecta. Es plausible porque el control de obligaciones es el objeto típico de un programa. Falla porque el Decreto 1742 de 2020, art. 28, núm. 6, incluye expresamente entre las finalidades de los programas de fiscalización la detección de operaciones sospechosas relacionadas con el lavado de activos. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M026", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#28", "fecha": "2026-10-24"}]}, {"id": "C-E08-005-1", "caso_id": "C-E08-005", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 11", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Mediante acto administrativo motivado del 8 de julio, notificado el 16 de julio, una Dirección Seccional formuló cargos a la sociedad Repuestos del Altiplano S. A. S. por no conservar siete declaraciones de cambio con sus soportes. El 24 de julio el apoderado radica un escrito de cuatro folios titulado recurso de reposición, en el que pide revocar la formulación de cargos, aporta dos certificaciones bancarias y solicita copia íntegra del expediente. El sistema de gestión documental registra el radicado, pero el expediente electrónico aún no tiene incorporadas las certificaciones ni foliada la pieza. El término para responder los cargos corre y el Gestor II debe decidir el trámite del escrito antes de preparar el proyecto de resolución sancionatoria que cierra la actuación.", "enunciado": "¿Qué decisión debe adoptar el Gestor II sobre el trámite del escrito radicado el 24 de julio?", "opciones": [{"t": "Conceder la reposición y revocar la formulación de cargos, con fundamento en las dos certificaciones bancarias aportadas con el escrito.", "j": "Es incorrecta. Resulta plausible porque las certificaciones tocan el fondo de los cargos, pero el Decreto Ley 2245 de 2011, art. 11, dispone que contra el acto de formulación de cargos no procede recurso alguno; la valoración se hace al decidir la actuación. Error de fase.", "tipo": "fase"}, {"t": "Remitir el escrito a la dependencia del nivel central para que resuelva el recurso interpuesto contra el acto de formulación de cargos.", "j": "Es incorrecta. Resulta plausible porque algunos recursos se deciden en una instancia distinta, pero el Decreto Ley 2245 de 2011, art. 11, excluye recurso contra ese acto, de modo que no hay asunto que trasladar. Error de competencia.", "tipo": "competencia"}, {"t": "Informar que contra el acto de formulación de cargos no procede recurso e incorporar el escrito como respuesta a los cargos con sus pruebas.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 11, señala que los cargos se formulan mediante acto administrativo motivado contra el cual no procede recurso alguno; el escrito y las certificaciones se incorporan al expediente y se valoran como respuesta dentro del término.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M032", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#11", "fecha": "2026-10-24"}]}, {"id": "C-E10-005-1", "caso_id": "C-E10-005", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Aplicar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 715", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "El Gestor II Salazar trabaja un programa de omisos en la división de fiscalización y liquidación. El expediente de Transportes Altamar S.A.S. muestra que la sociedad figura inscrita como responsable del impuesto sobre la renta, que su plazo para declarar el año gravable 2023 venció el 14 de mayo de 2024 y que no hay declaración presentada. El cruce con información de terceros arroja ingresos por 5.400 UVT y retenciones practicadas por 180 UVT, y la verificación del registro confirma que la obligación de declarar estaba vigente en ese periodo. El 7 de abril de 2026 la coordinación pide impulsar el expediente: una propuesta es proferir ya la liquidación de aforo con las cifras de terceros y otra es requerir información al contribuyente sin fijar plazo. El expediente no registra actuación previa frente a la sociedad.", "enunciado": "Decida cuál es la actuación que debe adelantar la división frente a la sociedad en esta fase.", "opciones": [{"t": "Emplazar a la sociedad, comprobada su obligación, para que declare en el término perentorio de un mes, con advertencia de las consecuencias.", "j": "Es correcta. El art. 715 del Estatuto Tributario ordena emplazar a quien incumple la obligación de declarar, previa comprobación de esa obligación, para que lo haga en el término perentorio de un mes, con advertencia de las consecuencias legales.", "tipo": null}, {"t": "Proferir la liquidación de aforo con las cifras del cruce de terceros, pues la omisión está demostrada y el expediente cuenta con base gravable.", "j": "Es incorrecta. Resulta atractiva por la solidez del cruce, pero adelanta la determinación oficial sin el emplazamiento previo que exige el art. 715 del Estatuto Tributario. Error de fase.", "tipo": "fase"}, {"t": "Requerir la información faltante sin señalar plazo de respuesta y, con lo que allegue la sociedad, proponer la determinación oficial del impuesto.", "j": "Es incorrecta. Es plausible porque robustece el acervo probatorio, pero omite el emplazamiento previsto en el art. 715 del Estatuto Tributario y su término perentorio de un mes con la advertencia legal. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 715", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#715", "fecha": "2026-10-24"}]}, {"id": "C-E08-001-1", "caso_id": "C-E08-001", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 7", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "La División de Fiscalización y Liquidación de una Dirección Seccional recibe el 12 de marzo un informe escrito de un tercero, enviado por correo electrónico, en el que se señala que la sociedad Comercial Andina del Norte S. A. S. canalizó pagos de importaciones por USD 480.000 a través de una cuenta abierta en el exterior durante el segundo semestre del año anterior, sin transmitir las declaraciones de cambio. El informe adjunta cuatro facturas de proveedor, dos extractos de la cuenta y el número de identificación tributaria de la sociedad, pero el firmante no aporta copia de su documento de identidad ni ratifica el contenido. El expediente electrónico registra que la sociedad no figura en programas de control en curso y que el acta de reparto asignó el asunto a un Gestor II el 15 de marzo. Antes de abrir expediente de investigación cambiaria, el jefe de división pide un concepto escrito.", "enunciado": "¿Qué debe sustentar el Gestor II en su concepto sobre la procedencia de iniciar la actuación administrativa cambiaria?", "opciones": [{"t": "Que la apertura del expediente queda condicionada a que el informante ratifique su escrito y aporte copia de su documento de identidad.", "j": "Es incorrecta. Resulta plausible porque la identificación del informante refuerza el valor de la prueba, pero el Decreto Ley 2245 de 2011, art. 7, no subordina el inicio de la actuación a esa ratificación: basta un medio que ofrezca credibilidad, y aquí el informe viene con facturas y extractos. Error de completitud.", "tipo": "completitud"}, {"t": "Que la actuación puede iniciarse con el informe del tercero, porque los documentos que lo acompañan le dan la credibilidad exigida.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 7, permite iniciar la actuación por informes recibidos de terceros y por cualquier otro medio que ofrezca credibilidad; las facturas, los extractos y la identificación tributaria aportados dan ese respaldo al informe recibido el 12 de marzo.", "tipo": null}, {"t": "Que el informe debe remitirse a la entidad de supervisión financiera para que esta establezca si existió infracción al régimen cambiario.", "j": "Es incorrecta. Resulta plausible porque los extractos provienen de una cuenta bancaria del exterior, pero la vigilancia de la canalización de pagos de importaciones corresponde a la DIAN según el Decreto Ley 2245 de 2011, art. 1, y el art. 7 habilita a la propia Entidad para iniciar la actuación. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M005", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#7", "fecha": "2026-10-24"}]}, {"id": "C-E07-010-1", "caso_id": "C-E07-010", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019, art. 591", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "IMPOSICION DE SANCIONES"], "caso": "El Gestor II Óscar Valdés, de la división de fiscalización y liquidación de una Dirección Seccional, cierra el estudio de control posterior de Agencia de Aduanas Río Blanco S.A.S. Sobre 31 declaraciones de importación de 2025 encontró que en 12 la subpartida declarada corresponde a una tarifa inferior a la de la mercancía descrita en las facturas y en los manifiestos de carga, con una diferencia estimada de tributos aduaneros de 870 millones de pesos. La agencia sostiene que, al no haber mercancía aprehendida ni usuario con sanción previa, el estudio debe cerrarse. El comité pide sustentar, antes del 25 de octubre de 2026, si la División puede continuar el estudio y con qué alcance, sin pronunciarse aún sobre la sanción aplicable a la agencia ni sobre la liquidación oficial.", "enunciado": "Diagnostique si procede continuar el estudio y con qué alcance.", "opciones": [{"t": "Continuar, pero limitando la verificación a los datos de las declaraciones, porque los documentos soporte pertenecen al archivo del usuario.", "j": "Es incorrecta. Acierta en que el estudio puede continuar, pero el Decreto 1165 de 2019, art. 591, numeral 3, incluye expresamente los documentos soporte y otros informes dentro del objeto de la verificación, y en este caso la diferencia surge de las facturas y los manifiestos. Error de completitud: recorta el alcance que la norma reconoce.", "tipo": "completitud"}, {"t": "Continuar, verificando las declaraciones y sus documentos soporte para establecer si hubo un menor monto de tributos aduaneros por la subpartida declarada.", "j": "Es correcta. El Decreto 1165 de 2019, art. 591, numeral 3, faculta para verifica
