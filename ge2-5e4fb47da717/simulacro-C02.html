r la exactitud de las declaraciones, los documentos soporte u otros informes cuando se considere necesario, para establecer la ocurrencia de hechos que impliquen un menor monto de los tributos aduaneros. La diferencia entre la subpartida declarada y la mercancía descrita en facturas y manifiestos, con 870 millones de pesos estimados, justifica continuar con ese alcance.", "tipo": null}, {"t": "Cerrar el estudio, porque sin mercancía aprehendida ni sanción previa impuesta al usuario aduanero no existe un hecho concreto que habilite la verificación posterior.", "j": "Es incorrecta. Recoge el argumento de la agencia, que parece razonable porque la aprehensión y la sanción son formas visibles de control, pero el Decreto 1165 de 2019, art. 591, numeral 3, permite verificar la exactitud de declaraciones y documentos soporte cuando se considere necesario, sin exigir aprehensión ni sanción previa. Error de fase: condiciona la verificación a actuaciones que no son presupuesto de ella.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M017", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E05-006-1", "caso_id": "C-E05-006", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 715", "integra": ["IMPOSICION DE SANCIONES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Diego Cárdenas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe un programa de control a omisos. Según la información exógena, Logística Zeta S.A.S. obtuvo ingresos brutos por 5.800 millones de pesos en el año gravable 2023 y no presentó la declaración de renta, cuyo plazo venció en mayo de 2024. La sociedad tiene RUT activo con la responsabilidad de renta y su certificado de existencia muestra actividad comercial continua. En el expediente no obra ningún acto previo dirigido a la sociedad. Un auditor propone proyectar de inmediato la liquidación de aforo, con el argumento de que la información de terceros basta para cuantificar el impuesto y de que el término para hacerlo es amplio. El jefe de la dependencia pide fijar la actuación que corresponde en esta etapa del proceso.", "enunciado": "Decida la actuación procedente en esta etapa y sustente su decisión.", "opciones": [{"t": "Emplazar a la sociedad, previa comprobación de su obligación, para que declare en el término de un mes.", "j": "Es correcta. El Estatuto Tributario, art. 715, ordena emplazar a quien incumple la obligación de declarar, previa comprobación de esa obligación, para que lo haga en el término perentorio de un mes, con advertencia de las consecuencias de persistir en la omisión. El art. 717 condiciona el aforo a haber agotado ese procedimiento.", "tipo": null}, {"t": "Proyectar la liquidación de aforo, porque el plazo de cinco años desde el vencimiento para declarar sigue vigente.", "j": "Es incorrecta. Es plausible porque el Estatuto Tributario, art. 717, concede cinco años desde el vencimiento del plazo para declarar, y ese término no ha corrido. Pero la misma norma exige agotar antes el procedimiento de los arts. 643, 715 y 716, y en el expediente no hay ningún acto previo; la opción salta a la fase final del procedimiento (fase).", "tipo": "fase"}, {"t": "Requerir a la sociedad para que corrija su declaración dentro de los tres años siguientes al vencimiento.", "j": "Es incorrecta. Resulta atractiva porque el término de tres años rige las correcciones que aumentan el impuesto. Pero la sociedad no presentó declaración alguna que pueda corregirse; para el omiso, el Estatuto Tributario, art. 715, prevé el emplazamiento para declarar, de modo que la opción aplica una regla que no gobierna el caso (norma).", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 715", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#715", "fecha": "2026-10-24"}, {"fila": "M041", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 717", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#717", "fecha": "2026-10-24"}]}, {"id": "C-E09-003-1", "caso_id": "C-E09-003", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 589", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "La Gestora II Paola Ríos, de la división de fiscalización y liquidación de una Dirección Seccional, recibe para revisión técnica una declaración de corrección de renta del año gravable 2024 presentada por Inversiones Laguna Azul S.A.S. El plazo para declarar ese año venció el 10 de abril de 2025, pero la sociedad presentó la declaración inicial el 20 de junio de 2025, con un saldo a favor de 90 UVT. El 2 de junio de 2026 la sociedad radicó, por el medio electrónico al que está obligada, la corrección que eleva el saldo a favor a 210 UVT por costos que no había incluido. No se le ha notificado requerimiento especial ni pliego de cargos. La sociedad pide que la corrección se tenga en cuenta para la solicitud de devolución que proyecta radicar. La Gestora debe sustentar su concepto antes de remitir el expediente.", "enunciado": "¿Qué concepto debe emitir la Gestora sobre la oportunidad de la corrección presentada?", "opciones": [{"t": "Es extemporánea, porque el año para corregir aumentando el saldo a favor corre desde el vencimiento del plazo y terminó el 10 de abril de 2026.", "j": "Es correcta. El Estatuto Tributario, art. 589, exige que la corrección que aumenta el saldo a favor se presente dentro del año siguiente al vencimiento del término para presentar la declaración. Ese término venció el 10 de abril de 2025, así que el año concluyó el 10 de abril de 2026 y la corrección del 2 de junio de 2026 quedó por fuera, aunque la declaración inicial haya sido tardía.", "tipo": null}, {"t": "Es oportuna, porque la corrección se presentó dentro de los tres años siguientes al vencimiento y antes de notificarse un requerimiento especial.", "j": "Es incorrecta. Es plausible porque ambas condiciones se cumplen en el caso, pero corresponden al Estatuto Tributario, art. 588, que regula las correcciones que aumentan el impuesto o disminuyen el saldo a favor; la corrección que aumenta el saldo a favor se rige por el art. 589 y su término es de un año. Error de norma.", "tipo": "norma"}, {"t": "Es oportuna, porque el año para corregir aumentando el saldo a favor se cuenta desde la presentación inicial y termina el 20 de junio de 2026.", "j": "Es incorrecta. Identifica bien el término de un año, lo que la hace plausible, pero lo cuenta desde la presentación de la declaración inicial; el Estatuto Tributario, art. 589, lo cuenta desde el vencimiento del término para presentar la declaración, es decir, desde el 10 de abril de 2025. Error de fase: ubica mal el momento en que empieza a correr el plazo.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E11-003-1", "caso_id": "C-E11-003", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 648", "integra": ["IMPOSICION DE SANCIONES", "LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "La Gestora II Paula Herrera, de la División de Fiscalización y Liquidación de una Dirección Seccional, proyecta la liquidación oficial de revisión de la declaración del impuesto sobre la renta del año gravable 2023 de Agroindustrias Meseta S.A.S. La sociedad declaró un saldo a pagar de $41.000.000. Con la respuesta al requerimiento especial quedó probado que omitió ingresos por $80.000.000, gravados a la tarifa general del 35 %, y la liquidación oficial determina un saldo a pagar de $69.000.000. El expediente registra además retenciones en la fuente por $9.000.000, ya incluidas en ambos saldos. La jefatura solicita fijar la sanción por inexactitud con la fórmula legal, antes de cualquier ajuste posterior, para incorporarla al proyecto que se someterá a revisión.", "enunciado": "Calcule el monto de la sanción que debe incorporarse al proyecto y sustente la base empleada.", "opciones": [{"t": "$12.000.000, porque se toma el quince por ciento de los ingresos omitidos que hacen inexacta la declaración.", "j": "Es incorrecta. Parece plausible porque el art. 648 del Estatuto Tributario prevé el 15 % de los valores inexactos y la omisión de ingresos es la conducta del caso. Sin embargo, ese porcentaje aplica a las declaraciones de ingresos y patrimonio, y la revisada es una declaración del impuesto sobre la renta de una sociedad. Error de norma: aplica la regla de un tipo de declaración distinto.", "tipo": "norma"}, {"t": "$28.000.000, porque se toma el ciento por ciento de la diferencia entre el saldo oficial y el declarado.", "j": "Es correcta. El Estatuto Tributario, art. 647, califica como inexactitud la omisión de ingresos que deriva un menor saldo a pagar, y el art. 648 fija la sanción en el 100 % de la diferencia entre el saldo determinado en la liquidación oficial y el declarado: $69.000.000 menos $41.000.000 da $28.000.000, cifra que coincide con el 35 % de los $80.000.000 omitidos. Las retenciones ya están incluidas en ambos saldos y no alteran la diferencia.", "tipo": null}, {"t": "$69.000.000, porque se toma el ciento por ciento del saldo a pagar determinado en la liquidación oficial.", "j": "Es incorrecta. Resulta plausible porque el porcentaje del 100 % y el saldo oficial forman parte de la fórmula. Sin embargo, el art. 648 del Estatuto Tributario aplica el 100 % a la diferencia entre el saldo oficial y el declarado, no al saldo oficial completo. Error de completitud: omite restar el saldo a pagar declarado por la sociedad.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M070", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 648", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#648", "fecha": "2026-10-24"}, {"fila": "M069", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 647", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#647", "fecha": "2026-10-24"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional. Por una reorganización interna, el Grupo Interno de Trabajo de Personas Jurídicas fue suprimido el 30 de septiembre de 2025 y sus 120 expedientes activos pasan al grupo que usted integra. De ellos, 41 están en etapa de emplazamiento, 57 tienen requerimiento especial notificado y 22 esperan liquidación oficial. Varios tienen cuadernos anexos con pruebas aportadas por terceros. El funcionario que entrega propone hacer el traslado con un correo que enumere los números de radicado. La entrega debe quedar lista el 10 de octubre y el jefe de la división le encarga recibir los expedientes en nombre del grupo. Usted debe precisar qué documento exigir para dar por recibida la entrega.", "enunciado": "Decida qué documento debe exigir para recibir los expedientes y sustente la razón.", "opciones": [{"t": "El correo con los radicados, pues el inventario se elabora cuando los expedientes terminan y se transfieren al archivo.", "j": "Es incorrecta. Es plausible porque la transferencia es un momento típico de inventario, pero la Ley 594 de 2000, art. 26, pide asegurar el control de los documentos en sus diferentes fases, y la entrega entre grupos de expedientes activos es una de ellas. Un listado de radicados no da cuenta de folios ni cuadernos. Error de fase.", "tipo": "fase"}, {"t": "Un inventario documental de los expedientes entregados, que permita controlar los documentos en la fase en que se encuentra cada uno.", "j": "Es correcta. La Ley 594 de 2000, art. 26, obliga a las entidades a elaborar inventarios de los documentos que producen, de manera que se asegure su control en sus diferentes fases. El cambio de grupo no altera la procedencia ni el orden original de los expedientes (art. 11), y el inventario registra qué se entrega, con sus cuadernos anexos, en cada etapa.", "tipo": null}, {"t": "Una certificación del archivo central sobre los 120 expedientes, porque esa dependencia controla los documentos en todas sus fases.", "j": "Es incorrecta. Es plausible porque el archivo central administra documentos, pero expedientes activos en emplazamiento, requerimiento o liquidación están en gestión del área productora; la obligación de inventariarlos recae en quien los produce y entrega, según la Ley 594 de 2000, art. 26. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M097", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-24"}, {"fila": "M094", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-24"}]}, {"id": "C-E10-007-1", "caso_id": "C-E10-007", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Decreto 1165 de 2019 (régimen de aduanas), art. 581", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "La división de fiscalización y liquidación recibe una alerta del sistema de riesgo sobre Importadora Oriente S.A.S., usuario aduanero que presentó catorce declaraciones de importación de autopartes entre febrero y noviembre de 2024, con tributos aduaneros declarados por 320 millones de pesos. La mercancía ya fue levantada y retirada del lugar de arribo, y el análisis de la alerta señala posible subvaloración por diferencias entre las facturas comerciales aportadas como documento soporte y los precios de referencia del periodo. El Gestor II Tovar debe estructurar la acción de control: dispone de los documentos relativos a las operaciones comerciales del periodo y de los registros contables del usuario, y el expediente no registra aprehensión de mercancía ni formulación de requerimiento especial aduanero. La coordinación fija como restricción que el análisis cubra las catorce declaraciones del periodo.", "enunciado": "Sustente el alcance que debe tener la acción de control que estructura el Gestor II en esta etapa.", "opciones": [{"t": "Limitar la verificación al reconocimiento físico de la mercancía de las autopartes, por ser el medio idóneo para establecer la subvaloración advertida.", "j": "Es incorrecta. Es plausible porque el valor se discute sobre bienes concretos, pero la mercancía ya fue retirada y el art. 581 del Decreto 1165 de 2019 extiende el control posterior a los documentos de las operaciones. Error de fase.", "tipo": "fase"}, {"t": "Concentrar el estudio en la declaración de mayor cuantía del periodo y derivar de ella el comportamiento de las trece restantes del usuario aduanero.", "j": "Es incorrecta. Parece eficiente ante la carga de trabajo, pero el art. 581 del Decreto 1165 de 2019 refiere la exactitud de los datos de las declaraciones presentadas durante un determinado periodo. Error de granularidad.", "tipo": "granularidad"}, {"t": "Comprobar, con estudios sobre los documentos del periodo, la exactitud de los datos de las catorce declaraciones y el acatamiento de la obligación aduanera.", "j": "Es correcta. El art. 581 del Decreto 1165 de 2019 define el control posterior sobre documentos de las operaciones comerciales mediante comprobaciones, estudios o investigaciones acerca del acatamiento de la obligación aduanera y la exactitud de los datos de las declaraciones de un periodo, y el art. 591 numerales 2, 3 y 5 habilita esas verificaciones.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M018", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 581", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#581", "fecha": "2026-10-24"}, {"fila": "M017", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}, {"fila": "M016", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}, {"fila": "M052", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E03-009-1", "caso_id": "C-E03-009", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Evaluar", "fuente": "Ley 1437 de 2011 (CPACA), art. 49", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Diana Molina, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, revisa el proyecto de resolución de clausura de Panadería Trigo Dorado, establecimiento de una persona natural. El acta de la visita del 8 de abril de 2026 y las pruebas que obran en los folios 12 a 30 del expediente registran operaciones sin factura. El 22 de abril de 2026 se dio traslado de cargos por diez días y la propietaria respondió sin desvirtuar los hechos. El proyecto identifica a la propietaria y su NIT, cita las normas infringidas y ordena el cierre por tres días con sellos oficiales, pero no examina el acta ni las pruebas ni explica cómo prueban los hechos. El proyecto debe pasar a firma del jefe de la división el 30 de octubre de 2026.", "enunciado": "Valore la decisión que debe adoptar la Gestor II frente al proyecto antes de remitirlo a firma.", "opciones": [{"t": "Devolverlo para que incluya el análisis de los hechos y las pruebas que soportan la sanción de clausura.", "j": "Es correcta. El art. 657 del Estatuto Tributario regula la sanción de clausura con sellos oficiales y su procedimiento, pero no el contenido del acto que la impone; en lo no previsto por la ley especial, el art. 47 de la Ley 1437 de 2011 hace aplicable la Parte Primera del CPACA a los procedimientos sancionatorios, y su art. 49 exige que el acto que pone fin al procedimiento contenga el análisis de hechos y pruebas con base en los cuales se impone la sanción, elemento que falta en el proyecto.", "tipo": null}, {"t": "Remitirlo a firma y ordenar que el análisis de las pruebas quede en el acta de imposición de los sellos oficiales.", "j": "Es incorrecta. Es plausible porque el cierre se documenta con un acta al fijar los sellos, pero el art. 49 de la Ley 1437 de 2011 ubica el análisis de hechos y pruebas en el acto que pone fin al procedimiento, no en la diligencia posterior que lo ejecuta (error de fase).", "tipo": "fase"}, {"t": "Remitirlo a firma, porque ya individualiza a la sancionada, cita las normas infringidas y adopta la decisión final.", "j": "Es incorrecta. Es plausible porque el proyecto reúne tres de los elementos que exige el art. 49 de la Ley 1437 de 2011, pero la norma también exige el análisis de hechos y pruebas, que falta; un acto con tres de cuatro requisitos queda incompleto (error de completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M075", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 49", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#49", "fecha": "2026-10-24"}, {"fila": "M073", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 657", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#657", "fecha": "2026-10-24"}]}, {"id": "C-E01-006-1", "caso_id": "C-E01-006", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 29", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Ricardo Salas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, ejecuta desde el 5 de enero de 2026 un programa de control a omisos en la declaración del impuesto sobre las ventas, cuyos lineamientos fijó el nivel central. De los 140 contribuyentes asignados, al 27 de febrero ha verificado 62 y encuentra que 25 ya habían presentado la declaración antes de la selección y otros 9 fueron liquidados de oficio en 2025 por los mismos periodos. El jefe de la división propone cambiar en la seccional los criterios de selección y reemplazar la lista por contribuyentes escogidos localmente, para cumplir la meta del trimestre que vence el 31 de marzo. Ricardo debe emitir concepto escrito sobre la propuesta antes de la reunión del 4 de marzo, con soporte en la norma de estructura.", "enunciado": "¿Qué concepto debe sustentar Ricardo sobre la propuesta del jefe de la división?", "opciones": [{"t": "Suspender todo el programa hasta que el nivel central reformule los criterios, sin verificar los contribuyentes que siguen pendientes.", "j": "Es incorrecta. Es plausible porque reconoce que la modificación corresponde al nivel central. Falla porque el Decreto 1742 de 2020, artículo 29, numeral 3, prevé la evaluación y la propuesta de ajustes sobre programas en curso; detener la ejecución antes de esa evaluación invierte el orden, ya que el reporte de hallazgos precede al ajuste y los 78 contribuyentes pendientes siguen bajo los lineamientos vigentes. Error de fase.", "tipo": "fase"}, {"t": "Acoger el cambio local de criterios, porque la seccional ejecuta el programa y puede adaptar su alcance a la meta del trimestre.", "j": "Es incorrecta. Es plausible porque la seccional conoce de primera mano los defectos de la lista y responde por la meta. Falla porque el Decreto 1742 de 2020, artículo 29, numeral 3, reserva a la subdirección del nivel central la evaluación de los programas y la propuesta de modificaciones; la ejecución no habilita a la seccional para rediseñar los criterios. Error de competencia.", "tipo": "competencia"}, {"t": "Continuar la ejecución conforme a los lineamientos y reportar los hallazgos para que la subdirección evalúe el programa y proponga ajustes.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 29, numeral 3, atribuye a la subdirección del nivel central «dar lineamientos para la ejecución de los programas y acciones de control de fiscalización», «evaluarlos y proponer las modificaciones necesarias cuando a ello hubiere lugar». Los 34 casos mal seleccionados son insumo para esa evaluación; la seccional ejecuta y reporta, pero no redefine el programa.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M056", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#29", "fecha": "2026-10-24"}, {"fila": "M053", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#29", "fecha": "2026-10-24"}]}, {"id": "C-E03-006-1", "caso_id": "C-E03-006", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 648", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Ricardo Salinas, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, proyecta la liquidación oficial de revisión de la declaración de renta del año gravable 2023 de Constructora Puerto Lindo S.A.S., sociedad contribuyente del impuesto sobre la renta. La sociedad declaró un saldo a pagar de 80 millones de pesos. Los extractos bancarios mostraron ingresos omitidos por 400 millones de pesos, que la sociedad no desvirtuó al responder el requerimiento especial. Con la adición de esos ingresos, la liquidación oficial determina un saldo a pagar de 220 millones de pesos. La coordinadora pide registrar en el proyecto el valor de la sanción por inexactitud antes de aplicar cualquier gradualidad, y advierte que el comité de la división revisará la base escogida y el cálculo.", "enunciado": "Calcule el valor de la sanción por inexactitud que debe registrarse antes de aplicar gradualidad.", "opciones": [{"t": "140 millones de pesos, que equivalen al 100 % de la diferencia entre el saldo determinado y el declarado.", "j": "Es correcta. La omisión de ingresos es inexactitud sancionable según el art. 647 del Estatuto Tributario, y el art. 648 fija la sanción en el 100 % de la diferencia entre el saldo a pagar determinado en la liquidación oficial y el declarado: 220 menos 80 da 140 millones de pesos.", "tipo": null}, {"t": "60 millones de pesos, que equivalen al 15 % de los ingresos omitidos que se adicionan en la liquidación.", "j": "Es incorrecta. Es plausible porque el art. 648 del Estatuto Tributario prevé el 15 % de los valores inexactos, pero ese porcentaje aplica a las declaraciones de ingresos y patrimonio; la sociedad es contribuyente de renta, de modo que la base es la diferencia de saldos (error de norma).", "tipo": "norma"}, {"t": "220 millones de pesos, que equivalen al 100 % del saldo a pagar que determina la liquidación oficial de revisión.", "j": "Es incorrecta. Es plausible porque el 100 % es el porcentaje correcto, pero el art. 648 del Estatuto Tributario lo aplica sobre la diferencia entre el saldo determinado y el declarado, no sobre el saldo total que fija la liquidación oficial (error de granularidad).", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M069", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 647", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#647", "fecha": "2026-10-24"}, {"fila": "M070", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 648", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#648", "fecha": "2026-10-24"}]}, {"id": "C-E05-008-1", "caso_id": "C-E05-008", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 588", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "IMPOSICION DE SANCIONES"], "caso": "Camilo Herrera, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la corrección que presentó Textiles Theta S.A.S. el 18 de septiembre de 2026 a su declaración de renta del año gravable 2023, cuyo plazo venció el 15 de mayo de 2024. La corrección incluye ingresos financieros omitidos por 260 millones de pesos y aumenta el impuesto a cargo en 91 millones. En el renglón de sanciones la sociedad registró cero, con una nota que alega buena fe por tratarse de un error del área contable. La División tiene abierto un programa de verificación sobre el sector, pero a la sociedad no se le ha notificado requerimiento especial ni pliego de cargos. El Gestor debe emitir un concepto técnico sobre la corrección para el expediente antes de cerrar la verificación.", "enunciado": "Diagnostique si la corrección cumple las condiciones legales y sustente su conclusión.", "opciones": [{"t": "No las cumple, porque, aunque es oportuna y previa al requerimiento, omitió liquidar la sanción por corrección.", "j": "Es correcta. El Estatuto Tributario, art. 588, permite corregir dentro de los tres años siguientes al vencimiento del plazo para declarar y antes de la notificación del requerimiento especial o pliego de cargos, y exige que se liquide la sanción por corrección. La corrección es oportuna, pues el término corre hasta mayo de 2027, pero registró cero en sanciones.", "tipo": null}, {"t": "No las cumple, porque se presentó después del año siguiente al vencimiento del plazo para declarar.", "j": "Es incorrecta. Es plausible porque el término de un año existe en el Estatuto Tributario, art. 589. Pero ese término rige las correcciones que disminuyen el valor a pagar o aumentan el saldo a favor; esta corrección aumenta el impuesto y se rige por el art. 588, con tres años; la opción aplica la regla equivocada (norma).", "tipo": "norma"}, {"t": "Las cumple, porque es oportuna y previa al requerimiento, y la buena fe exime de liquidar la sanción.", "j": "Es incorrecta. Resulta atractiva porque reconoce bien la oportunidad y la ausencia de requerimiento especial. Pero el Estatuto Tributario, art. 588, exige además que se liquide la sanción por corrección y no prevé una exención por buena fe; la opción deja por fuera una de las condiciones de la norma (completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}, {"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E06-010-1", "caso_id": "C-E06-010", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Felipe Moreno, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración de renta del año gravable 2024 de Agroindustrial Lambda S.A.S. La empresa trasladó en enero de 2024 su planta a un municipio donde una ley vigente concede un tratamiento tributario preferencial a quienes generen allí empleo directo. Las planillas de seguridad social muestran 120 empleados vinculados en el municipio desde febrero de 2024 y la maquinaria opera en el lugar según la visita del 4 de agosto de 2026. Por el beneficio, el impuesto a cargo bajó de 3.000 a 1.100 UVT. El coordinador propone recaracterizar el traslado como abuso, porque el recaudo de la seccional cayó 12 % y otras empresas del sector pagan más. Felipe debe emitir su concepto antes de que se decida el requerimiento especial.", "enunciado": "¿Qué concepto de Felipe sobre la propuesta del coordinador resiste mejor un examen jurídico?", "opciones": [{"t": "Procede recaracterizar la parte del beneficio que supere lo que pagan las demás empresas del sector, y aceptar el resto del ahorro.", "j": "Es incorrecta. Es plausible porque parece una salida intermedia y proporcionada. Falla porque el Estatuto Tributario, art. 869, no fija un tope comparativo con el sector: la operación es abusiva o no lo es, y la Constitución Política, art. 338, reserva a la ley los elementos del tributo. Error de granularidad.", "tipo": "granularidad"}, {"t": "Procede la recaracterización, porque el deber de contribuir autoriza a desconocer beneficios cuando el recaudo de la seccional disminuye.", "j": "Es incorrecta. Resulta plausible porque la caída del recaudo preocupa a la seccional y existe un deber constitucional de contribuir. Falla porque el Estatuto Tributario, art. 869, condiciona la recaracterización a que exista abuso, y el art. 683 prohíbe exigir al contribuyente más de lo que la ley ha querido. Error de norma.", "tipo": "norma"}, {"t": "No procede la recaracterización, porque la facultad se reserva a operaciones que constituyan abuso y el traslado tiene sustancia real comprobada.", "j": "Es correcta. El Estatuto Tributario, art. 869, permite recaracterizar la operación o serie de operaciones que constituya abuso en materia tributaria; aquí hay empleo y operación reales. La caída del recaudo no convierte en abuso el uso de un beneficio que la ley fija (Constitución Política, art. 338), y el art. 683 del Estatuto impide exigir más de lo que la ley ha querido.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M011", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869", "fecha": "2026-10-24"}, {"fila": "M050", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 683", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#683", "fecha": "2026-10-24"}, {"fila": "M091", "norma": "Constitución Política de Colombia", "articulo": "art. 338", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#338", "fecha": "2026-10-24"}]}, {"id": "C-E04-004-1", "caso_id": "C-E04-004", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto Ley 2245 de 2011, art. 7", "integra": ["NORMATIVA CAMBIARIA"], "caso": "El 10 de junio de 2026 llega a la división de fiscalización y liquidación de una Dirección Seccional una queja firmada por una persona natural, con copia de su documento de identidad. Afirma que la Importadora Boreal S.A.S. paga a sus proveedores del exterior por medio de un intermediario en zona de frontera que mueve dólares por fuera del mercado cambiario. Adjunta seis comprobantes de consignación a nombre del intermediario por un total de 310.000 dólares y copia de las facturas de los proveedores, cuyas fechas coinciden con las consignaciones. Un Gestor II recibe el expediente para sustentar el trámite. Un compañero de la división propone archivar la queja porque, a su juicio, no proviene de una entidad de control ni de otra autoridad y la actuación cambiaria solo puede abrirse dentro de un programa de fiscalización ya aprobado.", "enunciado": "¿Cómo debe valorar el Gestor la propuesta del compañero al sustentar el trámite de la queja?", "opciones": [{"t": "Debe rechazarla, porque la actuación cambiaria puede iniciarse por quejas de personas naturales que, como esta, ofrecen credibilidad con sus soportes.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 7, dispone que la actuación por infracciones cambiarias puede iniciarse de oficio, por quejas o informes de personas naturales o jurídicas y por cualquier otro medio que ofrezca credibilidad. La queja está firmada y trae comprobantes y facturas que se corresponden en fechas.", "tipo": null}, {"t": "Debe rechazarla, pero condicionar la apertura a que el quejoso ratifique la queja bajo juramento, requisito que le da credibilidad suficiente.", "j": "Es incorrecta. Es plausible porque la credibilidad de la fuente es el criterio que fija la norma. Falla porque el Decreto Ley 2245 de 2011, art. 7, no exige ratificación juramentada; ese requisito se toma de otro tipo de procedimiento y aquí la credibilidad la aportan los soportes. Error de norma.", "tipo": "norma"}, {"t": "Debe acogerla en parte y remitir la queja a la autoridad penal, porque mover divisas por un intermediario configura un delito que excluye la vía cambiaria.", "j": "Es incorrecta. Es plausible porque el uso de canales informales puede tener connotación penal. Falla porque el Decreto Ley 2245 de 2011, art. 7, permite iniciar la actuación administrativa por infracciones cambiarias con base en quejas que ofrezcan credibilidad; la posible arista penal no desplaza la competencia cambiaria de la DIAN. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M005", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#7", "fecha": "2026-10-24"}]}, {"id": "C-E07-002-1", "caso_id": "C-E07-002", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 746", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Andrés Pineda, de la división de fiscalización y liquidación de una Dirección Seccional, revisa la declaración de IVA del tercer bimestre de 2025 de Laboratorios Ébano S.A.S., que registra impuestos descontables por 410 millones de pesos, frente a 180 millones del bimestre anterior. El 14 de noviembre de 2025 se envió requerimiento ordinario para que explicara el aumento. La sociedad respondió el 2 de diciembre de 2025 que obedeció a la compra de un equipo de esterilización y adjuntó la factura electrónica del proveedor. Ninguna norma exige comprobación especial para ese descontable y la división no la ha solicitado. Un analista propone rechazar 230 millones en el proyecto de requerimiento especial porque el monto supera el promedio del sector, sin aportar otra prueba. El expediente sigue en etapa de investigación y el término para proferir el requerimiento especial no está próximo a vencer.", "enunciado": "Diagnostique el soporte jurídico de la propuesta del analista y la actuación que corresponde en esta etapa.", "opciones": [{"t": "Carece de soporte frente a la declaración, pero la respuesta al requerimiento no goza de presunción y puede desestimarse sin practicar otra prueba.", "j": "Es incorrecta. Acierta en que la declaración se presume cierta, pero el Estatuto Tributario, art. 746, extiende expresamente la presunción a las respuestas a requerimientos administrativos, de modo que la explicación de la sociedad también está amparada. Error de completitud: omite uno de los supuestos que cubre la norma.", "tipo": "completitud"}, {"t": "Carece de soporte, porque los hechos declarados y los de la respuesta se presumen ciertos; para desvirtuarlos procede ordenar inspección tributaria.", "j": "Es correcta. El Estatuto Tributario, art. 746, considera ciertos los hechos consignados en las declaraciones y en las respuestas a requerimientos mientras no se haya solicitado comprobación especial ni la ley la exija, situación del caso. Como el expediente sigue en investigación, el art. 779 permite ordenar inspección tributaria para verificar la exactitud de la declaración antes de proponer un rechazo.", "tipo": null}, {"t": "Tiene soporte, porque las amplias facultades de fiscalización trasladan al contribuyente la carga de probar cualquier descontable superior al promedio sectorial.", "j": "Es incorrecta. Es plausible porque el Estatuto Tributario, art. 684, otorga amplias facultades de fiscalización, pero esas facultades no derogan la presunción del art. 746, que ampara los hechos declarados y respondidos mientras no se solicite ni exija comprobación especial. Error de norma: aplica el art. 684 como si invirtiera la carga probatoria.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M013", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 746", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#746", "fecha": "2026-10-24"}, {"fila": "M009", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 779", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#779", "fecha": "2026-10-24"}]}, {"id": "C-E01-004-1", "caso_id": "C-E01-004", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["NORMATIVA CAMBIARIA"], "caso": "Jorge Pardo, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa el 16 de marzo de 2026 dos hallazgos remitidos por el área de análisis de riesgo. El primero corresponde a Felipe Arango, persona natural que en mayo de 2025 recibió un préstamo de una entidad del exterior por USD 180.000 y no figura en los registros de endeudamiento externo. El segundo corresponde a Textiles Andinos S.A.S., que pagó importaciones de hilaza en 2025 por un valor 35 % superior al facturado por su proveedor, según el cruce con las declaraciones de importación. Un compañero propone trasladar los dos hallazgos a otra autoridad, con el argumento de que la DIAN fiscaliza tributos y aduanas pero no operaciones de cambio. La jefatura debe responder el oficio de remisión antes del 27 de marzo y no se ha abierto ninguna investigación.", "enunciado": "¿Qué valoración debe sustentar Jorge frente a la propuesta de traslado de los hallazgos?", "opciones": [{"t": "Conservar el hallazgo de sobrefacturación de importaciones y trasladar el préstamo de la persona natural a la autoridad financiera competente.", "j": "Es incorrecta. Es plausible porque la sobrefacturación de importaciones guarda relación directa con el control aduanero. Falla porque el Decreto 1742 de 2020, artículo 31, numeral 2, incluye también el «endeudamiento externo de personas naturales» entre las operaciones cuyo control cambiario ejerce la DIAN; trasladarlo deja sin atender uno de los dos hallazgos. Error de completitud.", "tipo": "completitud"}, {"t": "Acoger el traslado de los dos hallazgos, porque la vigilancia del régimen cambiario corresponde a una autoridad distinta de la DIAN.", "j": "Es incorrecta. Es plausible porque otras entidades vigilan parte del régimen cambiario y el propio decreto excluye lo que sea competencia de ellas. Falla porque el Decreto 1742 de 2020, artículo 31, numerales 1 y 2, asigna a la DIAN la investigación y sanción por violación al régimen cambiario de su competencia, y nombra de forma expresa la sobrefacturación de importaciones y el endeudamiento externo de personas naturales. Error de competencia.", "tipo": "competencia"}, {"t": "Rechazar el traslado, porque el endeudamiento externo de personas naturales y la sobrefacturación de importaciones son de control cambiario.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 31, numeral 2, ordena ejercer el control sobre el régimen cambiario en importaciones, «subfacturación y sobrefacturación de estas operaciones, endeudamiento externo de personas naturales», y el numeral 1 asigna la investigación y sanción por violación al régimen cambiario de competencia de la entidad. Los dos hallazgos encajan en esas materias.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M057", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}, {"fila": "M087", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}]}, {"id": "C-E07-008-1", "caso_id": "C-E07-008", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 684", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Julián Betancur, de la división de fiscalización y liquidación de una Dirección Seccional, recibe el 4 de agosto de 2026 un insumo del área de análisis: entre marzo de 2024 y diciembre de 2025, Comercializadora Siete Ríos S.A.S. recibió 38 consignaciones en efectivo por 6.120 millones de pesos, de las cuales 2.300 millones corresponden a 2024, año en que declaró ingresos por 980 millones; no presentó la declaración de renta de 2025, cuyo plazo venció en mayo de 2026. Tres de sus proveedores reportados en exógena no aparecen en el RUT. El coordinador pide clasificar el insumo y definir la facultad legal que sustenta la apertura antes del comité del 20 de agosto de 2026, advirtiendo que no corresponde todavía valorar si procede un reporte de operación sospechosa ni cuantificar el impuesto. La división no ha solicitado comprobación especial sobre los hechos declarados en 2024.", "enunciado": "Diagnostique la facultad que sustenta la apertura y el tratamiento que corresponde dar al insumo.", "opciones": [{"t": "Verificar la exactitud de las declaraciones presentadas, y archivar lo relativo a 2025 mientras no se profiera emplazamiento por no declarar en otra dependencia.", "j": "Es incorrecta. Es plausible porque la omisión suele atenderse con emplazamiento, pero el Estatuto Tributario, art. 684, literal b, habilita a la propia división para investigar hechos generadores no declarados sin esperar una actuación de otra dependencia. Error de competencia: traslada a un tercero la facultad de investigar la omisión.", "tipo": "competencia"}, {"t": "Adelantar investigaciones por hechos generadores no declarados respecto de 2025, y verificar la exactitud de la declaración de 2024 cuando se considere necesario.", "j": "Es correcta. El Estatuto Tributario, art. 684, literal b, faculta para adelantar las investigaciones que establezcan la ocurrencia de hechos generadores no declarados, supuesto del año 2025 sin declaración; el literal a permite verificar la exactitud de las declaraciones cuando se considere necesario, tratamiento que corresponde al año 2024, en el que las consignaciones de 2.300 millones superan los ingresos declarados de 980 millones, declaración amparada por la presunción del art. 746 mientras no se desvirtúe.", "tipo": null}, {"t": "Adelantar investigaciones por hechos generadores no declarados respecto de 2025, y liquidar 2024 con las consignaciones de ese año, sin prueba adicional sobre lo declarado.", "j": "Es incorrecta. Clasifica bien el año 2025, pero el Estatuto Tributario, art. 746, considera ciertos los hechos declarados mientras no se solicite comprobación especial ni la ley la exija, por lo que los ingresos de 2024 no pueden reemplazarse por las consignaciones sin una actuación probatoria que desvirtúe lo declarado. Error de completitud: resuelve un año y omite el sustento del otro.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}, {"fila": "M013", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 746", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#746", "fecha": "2026-10-24"}]}, {"id": "C-E06-003-1", "caso_id": "C-E06-003", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Analizar", "fuente": "Constitución Política de Colombia, art. 209", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Sofía Parra, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, tiene a cargo el expediente de Beta Logística S.A.S. por el impuesto sobre la renta del año gravable 2023. El 3 de marzo de 2026 terminó la valoración de pruebas, que soportan ingresos omitidos por 540 UVT, y dejó listo el proyecto de requerimiento especial. El 9 de marzo el coordinador del grupo le indica de forma verbal que guarde el proyecto hasta nueva orden. Sofía verifica en el registro mercantil que el coordinador figura como socio del gerente de Beta Logística en otra empresa. Ningún otro expediente del grupo ha recibido una instrucción semejante, el sistema de gestión documental registra el proyecto como terminado y el término para notificar el requerimiento sigue corriendo. Sofía debe decidir cómo actuar frente a la instrucción y dejar trazabilidad de su decisión.", "enunciado": "¿Qué diagnóstico sobre la instrucción del coordinador puede sustentar Sofía con base constitucional?", "opciones": [{"t": "La instrucción no afecta ningún principio, porque el coordinador tiene la facultad de fijar el orden en que el grupo tramita sus expedientes.", "j": "Es incorrecta. Es plausible porque el coordinador sí organiza el reparto y la prioridad del trabajo. Falla porque esa facultad se ejerce al servicio de los intereses generales (Constitución Política, art. 209) y no ampara aplazar un solo expediente por un vínculo personal. Error de competencia.", "tipo": "competencia"}, {"t": "La instrucción afecta la imparcialidad y la celeridad, porque la función administrativa debe servir a los intereses generales y no a un vínculo personal.", "j": "Es correcta. La Constitución Política, art. 209, dispone que la función administrativa está al servicio de los intereses generales y se desarrolla con fundamento, entre otros, en los principios de imparcialidad y celeridad; el art. 2 fija como fin del Estado asegurar la vigencia de un orden justo. Detener un expediente listo solo para la empresa vinculada con el coordinador, mientras corre el término, lesiona ambos principios.", "tipo": null}, {"t": "La instrucción afecta el principio de progresividad, porque deja de exigir al contribuyente un impuesto acorde con su verdadera capacidad económica.", "j": "Es incorrecta. Resulta plausible porque el aplazamiento puede impedir cobrar lo que el contribuyente debe. Falla porque la progresividad es un principio del sistema tributario (Constitución Política, art. 363) que orienta el diseño de los tributos, no la conducta del servidor en un expediente; el principio comprometido está en el art. 209. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M089", "norma": "Constitución Política de Colombia", "articulo": "art. 209", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#209", "fecha": "2026-10-24"}, {"fila": "M088", "norma": "Constitución Política de Colombia", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#2", "fecha": "2026-10-24"}]}, {"id": "C-E02-004-1", "caso_id": "C-E02-004", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 742", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación y proyecta la liquidación oficial de revisión contra Agroinsumos La Pradera S.A.S. por el impuesto sobre las ventas del tercer bimestre de 2024. El requerimiento especial, notificado el 2 de mayo de 2025, propuso desconocer impuestos descontables por 1.320 UVT y fijó un término para responder que vencía el 2 de agosto. Al revisar el sistema de correspondencia, usted encuentra que el contribuyente radicó su respuesta con 214 facturas el 28 de julio en la ventanilla de la División de Recaudo, que no la trasladó. El expediente físico no contiene esa respuesta y su compañero ya redactó el proyecto con los folios existentes. La fecha prevista para firmar el acto es el 5 de septiembre de 2025.", "enunciado": "Diagnostique qué debe ocurrir con el proyecto de liquidación a partir de lo encontrado.", "opciones": [{"t": "Debe remitirse la respuesta a la División de Recaudo para que valore las facturas, porque fue la dependencia que recibió la radicación.", "j": "Es incorrecta. Es plausible porque la radicación entró por esa ventanilla, pero recibir un documento no confiere la competencia para valorarlo: la respuesta pertenece a la actuación de fiscalización y la Ley 1437 de 2011, art. 36, ordena reunirla en el expediente de esa actuación. Error de competencia.", "tipo": "competencia"}, {"t": "Puede firmarse el proyecto y las facturas se valorarán en el recurso de reconsideración, porque no estaban en el expediente al proyectar.", "j": "Es incorrecta. Es plausible porque el recurso permite revisar pruebas, pero la respuesta se radicó dentro del término y su ausencia se debe a una falla interna; aplazar su valoración contradice el Estatuto Tributario, art. 742, que exige fundar la determinación en lo demostrado en el expediente completo. Error de fase.", "tipo": "fase"}, {"t": "Debe incorporarse la respuesta al expediente y valorarse antes de firmar, porque la liquidación se funda en lo que este demuestre.", "j": "Es correcta. La Ley 1437 de 2011, art. 36, ordena organizar en un solo expediente los documentos de una misma actuación, y la respuesta al requerimiento hace parte de ella. El Estatuto Tributario, art. 742, exige que la determinación de tributos se funde en los hechos demostrados en el respectivo expediente, de modo que la liquidación no puede proyectarse sin las 214 facturas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M012", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 742", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#742", "fecha": "2026-10-24"}, {"fila": "M043", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-24"}]}, {"id": "C-E03-004-1", "caso_id": "C-E03-004", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 643", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Julián Ortega, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, recibe el resultado de un cruce de información sobre dos contribuyentes del régimen ordinario de renta del año gravable 2024, cuyo plazo para declarar venció en mayo de 2025. Ferretería Monte Claro S.A.S. presentó su declaración el 26 de septiembre de 2025, con un impuesto a cargo de 22 millones de pesos, y no liquidó sanción. Inversiones Bahía Quieta S.A.S. registró ingresos brutos de 3.100 millones de pesos en 2024, está obligada a declarar y a la fecha del cruce, 15 de octubre de 2026, no ha presentado la declaración. El jefe de la división solicita clasificar la infracción de cada sociedad antes de asignar las actuaciones a los grupos internos.", "enunciado": "Diagnostique la sanción que corresponde a la conducta de cada sociedad según el cruce.", "opciones": [{"t": "Monte Claro no tiene sanción a cargo de la DIAN, porque ya declaró; Bahía Quieta, la sanción por no declarar.", "j": "Es incorrecta. Es plausible porque el art. 641 del Estatuto Tributario asigna al declarante el deber de liquidar y pagar la sanción por extemporaneidad, pero esa carga no impide que la administración actúe cuando el declarante la omite; Monte Claro incurrió en la conducta del art. 641 (error de competencia).", "tipo": "competencia"}, {"t": "Monte Claro, sanción por extemporaneidad; Bahía Quieta, sanción por no declarar al omitir la presentación.", "j": "Es correcta. El art. 641 del Estatuto Tributario sanciona a quienes presenten las declaraciones en forma extemporánea, caso de Monte Claro, y el art. 643 sanciona a los obligados a declarar que omitan la presentación, caso de Bahía Quieta.", "tipo": null}, {"t": "Monte Claro, sanción por extemporaneidad; Bahía Quieta, ninguna hasta que declare y liquide su retardo.", "j": "Es incorrecta. Es plausible tratar la omisión como un retardo que se sancionará al presentar, pero el art. 643 del Estatuto Tributario sanciona a los obligados que omitan la presentación de las declaraciones; esperar la presentación desplaza la infracción a una fase que no ha ocurrido (error de fase).", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}, {"fila": "M067", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 643", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#643", "fecha": "2026-10-24"}]}, {"id": "C-E09-010-1", "caso_id": "C-E09-010", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 588", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "IMPOSICION DE SANCIONES"], "caso": "El Gestor II Ricardo Salazar, de la división de fiscalización y liquidación de una Dirección Seccional, revisa técnicamente dos correcciones de la declaración de renta del año gravable 2023 de Alimentos Valle Fértil S.A.S., cuyo plazo para declarar venció el 10 de mayo de 2024. La primera corrección, presentada el 20 de marzo de 2025 por el medio electrónico obligatorio, disminuyó el valor a pagar en 60 UVT por un error en la depuración de costos. La segunda, presentada el 15 de octubre de 2026, aumentó el impuesto a cargo en 140 UVT por ingresos omitidos y no incluyó sanción alguna en el renglón respectivo. A la sociedad no se le ha notificado requerimiento especial ni pliego de cargos. El Gestor debe emitir un concepto integral sobre ambas correcciones antes de definir si propone actuaciones de determinación.", "enunciado": "¿Qué concepto sobre las dos correcciones puede sustentar el Gestor?", "opciones": [{"t": "Las dos son oportunas y quedan como se presentaron, porque se radicaron dentro de los tres años y sin requerimiento especial notificado.", "j": "Es incorrecta. Es plausible porque ambas fechas caen dentro de los tres años y no hay requerimiento especial; falla porque el Estatuto Tributario, art. 588, exige además que en la corrección que aumenta el impuesto se liquide la sanción por corrección, y la segunda no lo hizo. Error de completitud: omite un requisito de la norma.", "tipo": "completitud"}, {"t": "La primera es oportuna por estar dentro del año siguiente al vencimiento; la segunda está en término, pero omitió la sanción por corrección.", "j": "Es correcta. La primera disminuyó el valor a pagar y se presentó el 20 de marzo de 2025, dentro del año siguiente al vencimiento, como exige el Estatuto Tributario, art. 589. La segunda aumentó el impuesto dentro de los tres años y sin requerimiento notificado, pero el art. 588 condiciona esa corrección a que se liquide la sanción por corrección, que la sociedad omitió.", "tipo": null}, {"t": "La primera es oportuna; la segunda es extemporánea, porque aumentar el impuesto exige corregir dentro del año siguiente al vencimiento del plazo.", "j": "Es incorrecta. Acierta con la primera corrección, lo que la hace plausible, pero aplica a la segunda el término de un año del Estatuto Tributario, art. 589, previsto para disminuir el valor a pagar; la corrección que aumenta el impuesto tiene tres años según el art. 588, plazo que vence el 10 de mayo de 2027. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}, {"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E01-009-1", "caso_id": "C-E01-009", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Camila Torres, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa el 6 de abril de 2026 el expediente de Equipos Médicos Sigma S.A.S. En control posterior se encontró que la declaración de importación del 14 de julio de 2025, por 3.600 UVT, clasificó los equipos en una subpartida con menor tributo aduanero. En la misma revisión se verificó que el pago al proveedor, por USD 210.000, se hizo desde una cuenta en el exterior sin canalizarlo por el mercado cambiario. El proyecto de acto que circula en la división propone una sola actuación aduanera que cubra los dos hechos, para ahorrar tiempo antes de que venza en julio el término de la fiscalización aduanera. Camila debe dar visto bueno al proyecto o devolverlo con observaciones antes del comité del 10 de abril.", "enunciado": "¿Qué decisión debe sustentar Camila frente al proyecto de actuación única?", "opciones": [{"t": "Devolverlo para remitir los dos hechos al control cambiario, porque el pago al exterior define la naturaleza de toda la operación.", "j": "Es incorrecta. Es plausible porque acierta en que el pago no canalizado es materia cambiaria. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, mantiene en el control posterior aduanero la determinación y sanción de la reclasificación arancelaria; enviar ambos hechos al control cambiario traslada una infracción aduanera a una función que no la cubre. Error de competencia.", "tipo": "competencia"}, {"t": "Aprobarlo, porque el control posterior aduanero comprende las sanciones y liquidaciones sobre los hechos de la misma operación de importación.", "j": "Es incorrecta. Es plausible porque los dos hechos provienen de la misma importación y el control posterior incluye sanciones y liquidaciones. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, limita esas sanciones a las infracciones al régimen aduanero; la falta de canalización viola el régimen cambiario, cuya sanción corresponde a la función del artículo 31, numeral 1. Error de completitud.", "tipo": "completitud"}, {"t": "Devolverlo, porque la reclasificación se sanciona en el control aduanero y el pago no canalizado, en el control cambiario de la entidad.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 30, numeral 1, refiere el control posterior a las function fmtTime(ms){
  const t = Math.max(0, Math.round(ms / 1000));

function construir(c){
  let items = [];
  if (c.modo === "practica") {
    BANCO.pjs.forEach((it, i) => { if (it.eje === c.eje) items.push({ p:"F", i }); });
  } else {
    items = BANCO.pjs.map((_, i) => ({ p:"F", i }));
    if (c.modo === "completo") SECC.forEach(s => s.items.forEach((_, i) => items.push({ p:s.clave, i })));
  }
  const limite = c.modo === "completo" ? M.tiempo_min.completo : c.modo === "funcionales" ? M.tiempo_min.funcionales : 0;
  return { cfg:{...c}, items, resp:{}, dud:{}, idx:0, inicio:Date.now(), limiteMin:limite, fin:null };
}

function itemDe(ref){
