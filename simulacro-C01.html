<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro SIM-2676-GE2-C01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: hoja de respuestas óptica. Columna de lectura a la izquierda, rejilla de burbujas a la derecha; en teléfono la rejilla baja. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --graphite:#1c1f24; --muted:#5d6370; --rule:#d9dce2;
  --ink:#b5175f;            /* tinta de lectura óptica (burbujas) */
  --ink-soft:#f7dbe8;
  --ok:#1f7a4d; --ok-soft:#dcefe5; --bad:#b3261e; --bad-soft:#f6dedc; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --sheet:#181b20; --graphite:#e7e9ee; --muted:#a2a8b4; --rule:#2c313a;
  --ink:#ff6fae; --ink-soft:#3a1c2b; --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f0c060; --warn-soft:#352a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--graphite);font-family:var(--display);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--graphite)}
.btn.primary{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.btn.ink{border-color:var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* ---------- inicio ---------- */
.masthead{display:grid;gap:6px;padding-bottom:18px;border-bottom:2px solid var(--graphite);margin-bottom:20px}
.masthead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.panel{padding:18px;display:grid;gap:14px;align-content:start}
.choice{display:grid;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:12px}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-card .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.opt-card[aria-pressed="true"] .dot{background:var(--graphite);border-color:var(--graphite)}
.opt-card b{display:block;font-weight:600}
.opt-card span{font-size:.86rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--graphite);max-width:100%;min-width:0;flex:1 1 180px}
[hidden]{display:none!important}
.compo td:first-child{font-weight:500}
.ejes{columns:2 220px;column-gap:20px;margin:0;padding-left:18px;font-size:.88rem}
.ejes li{break-inside:avoid;margin-bottom:3px}
details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ol.proto{margin:8px 0 0;padding-left:20px;font-size:.9rem;display:grid;gap:4px}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

/* ---------- prueba ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);margin:-20px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .row{justify-content:space-between}
.clock{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ink)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.item{padding:22px;display:grid;gap:16px}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.qnum{font-family:var(--mono);font-size:.85rem;font-weight:600}
.block-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.caso{font-family:var(--body);font-size:1.02rem;line-height:1.62;max-width:68ch}
.enun{font-family:var(--body);font-size:1.02rem;font-weight:600;max-width:68ch}
.opts{display:grid;gap:8px}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-family:var(--body);font-size:.98rem}
.op:hover{border-color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--graphite)}
.op[aria-pressed="true"] .bub{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.op.is-key{border-color:var(--ok);background:var(--ok-soft)}
.op.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feedback{display:grid;gap:10px;border-top:1px dashed var(--rule);padding-top:14px}
.just{font-size:.9rem;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.just .l{font-family:var(--mono);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:normal;max-width:100%}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.omr{padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.omr{position:static;max-height:none}}
.omr h3{font-size:.72rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:30px;border:1.5px solid var(--ink);border-radius:15px;background:transparent;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0}
.cell.done{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.cell.flagged{box-shadow:0 0 0 2px var(--warn)}
.cell.current{outline:2px solid var(--graphite);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:4px}
.legend i.d{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{box-shadow:0 0 0 2px var(--warn)}
.confirm{padding:14px;border:1px solid var(--graphite);border-radius:var(--r);background:var(--sheet);display:grid;gap:10px}

/* ---------- resultados ---------- */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px;display:grid;gap:4px}
.kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:820px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.res-grid .sheet{padding:14px;display:grid;gap:10px;align-content:start}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--graphite)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.warn{background:var(--warn)}
.review{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rv{padding:16px;display:grid;gap:10px}
.rv .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sub-caso{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.firma-autor{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>

<script>
"use strict";
/* Simulacro con cronómetro. Plantilla genérica del plugin concursos-merito.
   Todo lo específico de la convocatoria viene en BANCO.meta. */
const BANCO = {"meta": {"codigo": "SIM-2676-GE2-C01", "convocatoria": "Proceso de Selección DIAN 2676 de 2025", "entidad": "U.A.E. Dirección de Impuestos y Aduanas Nacionales - DIAN", "empleo": "Gestor II, nivel profesional, OPEC 236765", "empleo_corto": "Gestor II", "nivel_txt": "profesional", "modalidad": "ingreso", "n_opciones": 3, "tiempo_min": {"completo": 240, "funcionales": 165}, "minimo": 70.0, "caracter": "Eliminatoria", "aviso": "Simulacro de entrenamiento de elaboración propia. Material no oficial: no reproduce ítems de cuadernillos oficiales ni ha sido revisado por la CNSC, la entidad o el operador.", "creado_por": "Creado por: Jorge Armando Tamayo López", "version": "0.1.0", "fecha": "2026-10-24", "semilla": 236766, "corte_normativo": "2026-10-24"}, "pjs": [{"id": "C-E02-002-1", "caso_id": "C-E02-002", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 742", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Como Gestor II de la División de Fiscalización y Liquidación, usted proyecta un pliego de cargos contra Distribuciones Río Claro Ltda. por presentar fuera de plazo la información exógena del año gravable 2023, cuyo vencimiento era el 14 de mayo de 2024. El expediente contiene los 1.840 registros reportados. En el folio 27 obra una impresión de pantalla sin fecha de consulta ni firma de quien la generó, que indica envío el 3 de julio de 2024. En el folio 31 obra una certificación del área de tecnología que registra el envío el 30 de mayo de 2024. Un compañero sugiere expedir el pliego con el folio 27, porque muestra el mayor retraso. El jefe de la división necesita el proyecto en diez días hábiles y no hay otra actuación probatoria en curso.", "enunciado": "Diagnostique la situación probatoria del expediente frente a la sanción que se pretende proponer.", "opciones": [{"t": "La contradicción debe resolverla el área de archivo de la Seccional, que responde por la veracidad de los folios del expediente.", "j": "Es incorrecta. Es plausible porque la Ley 594 de 2000, art. 16, asigna a los responsables del archivo velar por la veracidad de los documentos, pero establecer qué folio demuestra la fecha de envío es una valoración probatoria del funcionario que proyecta el acto, no una tarea archivística. Error de competencia.", "tipo": "competencia"}, {"t": "El pliego debe fundarse en la certificación del folio 31; la impresión del folio 27, sin fecha ni autor, no demuestra el envío.", "j": "Es correcta. El Estatuto Tributario, art. 742, exige que la imposición de sanciones se funde en los hechos que aparezcan demostrados en el respectivo expediente. La certificación del área de tecnología del folio 31 demuestra el envío del 30 de mayo de 2024; la impresión del folio 27, sin fecha de consulta ni autor, no lo demuestra. La Ley 594 de 2000, art. 16, obliga además a velar por la autenticidad y veracidad de los documentos que se incorporan al expediente.", "tipo": null}, {"t": "El pliego puede expedirse con el folio 27, y la contradicción con el folio 31 se resolverá cuando el contribuyente responda los cargos.", "j": "Es incorrecta. Es plausible porque la respuesta al pliego permite controvertir pruebas, pero traslada a una fase posterior la depuración probatoria que corresponde antes de proponer la sanción: el Estatuto Tributario, art. 742, exige que la sanción se funde en hechos demostrados en el expediente, y el folio 27 no demuestra la fecha de envío. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M012", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 742", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#742", "fecha": "2026-10-24"}, {"fila": "M096", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#16", "fecha": "2026-10-24"}]}, {"id": "C-E09-006-1", "caso_id": "C-E09-006", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 574", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II Mauricio Peña, de la división de fiscalización y liquidación de una Dirección Seccional, adelanta un programa de control a agentes de retención en la fuente. Fundación Horizonte Comunitario, entidad sin ánimo de lucro calificada como no contribuyente del impuesto sobre la renta, pagó honorarios y servicios entre enero y junio de 2026, practicó retenciones por 95 UVT según los certificados expedidos a sus proveedores y no presentó las declaraciones de retención de esos seis meses, cuyos plazos ya vencieron. La Administración no le ha notificado emplazamiento. El 10 de septiembre de 2026 su revisora fiscal informó por escrito que la fundación no presenta declaraciones tributarias porque no es contribuyente. El Gestor debe determinar el alcance de la obligación formal incumplida antes de proponer la actuación que corresponda ante la jefatura.", "enunciado": "¿Qué decisión debe adoptar el Gestor frente a la posición expresada por la fundación?", "opciones": [{"t": "Rechazarla, porque como agente de retención la fundación debía declarar las retenciones y su omisión la expone a la sanción por no declarar.", "j": "Es correcta. El Estatuto Tributario, art. 574, obliga a los contribuyentes, responsables y agentes de retención en la fuente a presentar las declaraciones tributarias; la fundación practicó retenciones, luego debía declararlas aunque no sea contribuyente de renta. El art. 643 sanciona a los agentes retenedores obligados a declarar que omitan la presentación.", "tipo": null}, {"t": "Aceptarla en parte, porque el deber de declarar las retenciones surge cuando la Administración le notifica un emplazamiento previo.", "j": "Es incorrecta. Es plausible porque el emplazamiento es un paso del trámite frente a quien omite declarar; falla porque el deber de presentar la declaración nace de la calidad de agente de retención (Estatuto Tributario, art. 574) y existía al vencer cada plazo, antes de cualquier actuación de la DIAN. Error de fase: traslada el nacimiento del deber a una etapa posterior del procedimiento.", "tipo": "fase"}, {"t": "Aceptarla, porque la calidad de no contribuyente del impuesto sobre la renta la libera del deber de presentar declaraciones tributarias.", "j": "Es incorrecta. Es plausible porque la fundación no debe declarar renta como contribuyente; falla porque el Estatuto Tributario, art. 574, impone el deber de declarar también a los agentes de retención en la fuente, calidad que la fundación asumió al practicar retenciones. Error de completitud: considera solo una de las calidades que generan el deber de declarar.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M080", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 574", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#574", "fecha": "2026-10-24"}, {"fila": "M067", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 643", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#643", "fecha": "2026-10-24"}]}, {"id": "C-E08-001-1", "caso_id": "C-E08-001", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 7", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "La División de Fiscalización y Liquidación de una Dirección Seccional recibe el 12 de marzo un informe escrito de un tercero, enviado por correo electrónico, en el que se señala que la sociedad Comercial Andina del Norte S. A. S. canalizó pagos de importaciones por USD 480.000 a través de una cuenta abierta en el exterior durante el segundo semestre del año anterior, sin transmitir las declaraciones de cambio. El informe adjunta cuatro facturas de proveedor, dos extractos de la cuenta y el número de identificación tributaria de la sociedad, pero el firmante no aporta copia de su documento de identidad ni ratifica el contenido. El expediente electrónico registra que la sociedad no figura en programas de control en curso y que el acta de reparto asignó el asunto a un Gestor II el 15 de marzo. Antes de abrir expediente de investigación cambiaria, el jefe de división pide un concepto escrito.", "enunciado": "¿Qué debe sustentar el Gestor II en su concepto sobre la procedencia de iniciar la actuación administrativa cambiaria?", "opciones": [{"t": "Que la actuación puede iniciarse con el informe del tercero, porque los documentos que lo acompañan le dan la credibilidad exigida.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 7, permite iniciar la actuación por informes recibidos de terceros y por cualquier otro medio que ofrezca credibilidad; las facturas, los extractos y la identificación tributaria aportados dan ese respaldo al informe recibido el 12 de marzo.", "tipo": null}, {"t": "Que la apertura del expediente queda condicionada a que el informante ratifique su escrito y aporte copia de su documento de identidad.", "j": "Es incorrecta. Resulta plausible porque la identificación del informante refuerza el valor de la prueba, pero el Decreto Ley 2245 de 2011, art. 7, no subordina el inicio de la actuación a esa ratificación: basta un medio que ofrezca credibilidad, y aquí el informe viene con facturas y extractos. Error de completitud.", "tipo": "completitud"}, {"t": "Que el informe debe remitirse a la entidad de supervisión financiera para que esta establezca si existió infracción al régimen cambiario.", "j": "Es incorrecta. Resulta plausible porque los extractos provienen de una cuenta bancaria del exterior, pero la vigilancia de la canalización de pagos de importaciones corresponde a la DIAN según el Decreto Ley 2245 de 2011, art. 1, y el art. 7 habilita a la propia Entidad para iniciar la actuación. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M005", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#7", "fecha": "2026-10-24"}]}, {"id": "C-E01-001-1", "caso_id": "C-E01-001", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "Laura Méndez, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe el 4 de febrero de 2026 una denuncia anónima radicada en el buzón institucional. El escrito señala que Importadora Delta S.A.S. ingresó por un puerto del Caribe, entre octubre y diciembre de 2025, cuatro contenedores de calzado con un valor declarado de 310 UVT cada uno, cuando el valor de mercado estimado supera 1.400 UVT por contenedor. Añade que un servidor público de la administración aduanera habría recibido pagos para omitir la inspección física de la carga. La denuncia trae copia de dos transferencias bancarias y los números de las declaraciones de importación. La coordinadora pide concluir la precrítica antes del 11 de febrero y advierte que la división no adelanta investigaciones disciplinarias ni penales. El trámite sigue en análisis preliminar, sin auto de apertura.", "enunciado": "Para cerrar la precrítica, ¿qué decisión de direccionamiento debe sustentar Laura frente a los componentes de la denuncia?", "opciones": [{"t": "Clasificar los dos componentes y direccionar cada uno a la dependencia de la DIAN o a la entidad competente, incluida la presunta corrupción.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 33, numeral 3, asigna la función de «recibir, clasificar y direccionar a las dependencias de la DIAN y a las entidades competentes, las denuncias por contrabando, evasión, lavado de activos, corrupción y otros presuntos delitos», en concordancia con el artículo 28, numeral 4. La subvaloración y los pagos al servidor son hechos distintos que se clasifican y se envían a quien tiene competencia sobre cada uno.", "tipo": null}, {"t": "Direccionar el componente de contrabando y descartar el de los pagos al servidor, porque ese hecho no es materia que la DIAN clasifique.", "j": "Es incorrecta. Es plausible porque el artículo 28, numeral 4, del Decreto 1742 de 2020 enumera contrabando, evasión y lavado de activos sin nombrar la corrupción. Falla porque esa misma disposición incluye «otros presuntos delitos» y el artículo 33, numeral 3, menciona de forma expresa la corrupción entre las denuncias que se reciben, clasifican y direccionan; descartar ese componente deja incompleta la precrítica. Error de completitud.", "tipo": "completitud"}, {"t": "Abrir en la división una investigación que cubra la subvaloración y los pagos al servidor, porque los dos hechos provienen de la misma operación.", "j": "Es incorrecta. Es plausible porque ambos hechos se refieren a las mismas importaciones y la división fiscaliza operaciones aduaneras. Falla porque, en precrítica, el artículo 33, numeral 3, y el artículo 28, numeral 4, del Decreto 1742 de 2020 ordenan direccionar las denuncias a las dependencias y entidades competentes; la división no investiga la conducta del servidor, como advierte la coordinadora. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M001", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#28", "fecha": "2026-10-24"}]}, {"id": "C-E10-002-1", "caso_id": "C-E10-002", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 705", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Una Dirección Seccional adelanta un programa sobre deducciones improcedentes. El Gestor II Bedoya revisa el expediente de Insumos del Valle S.A.S., que presentó su declaración del impuesto sobre la renta del año gravable 2021 el 7 de abril de 2022, cuando el plazo para declarar de ese contribuyente vencía el 10 de abril de 2022. La investigación documentó deducciones sin soporte por 3.100 UVT y un ingreso omitido por 900 UVT. El proyecto de requerimiento especial quedó elaborado el 20 de marzo de 2025 y la dependencia de notificaciones informa que, por la carga del canal de correo certificado, el envío solo podría surtirse el 28 de abril de 2025. El contribuyente no ha corregido su declaración ni ha sido emplazado para corregir, y el expediente no registra suspensión de términos.", "enunciado": "Diagnostique el efecto que tiene sobre la actuación la fecha en que se podría surtir la notificación proyectada.", "opciones": [{"t": "La notificación es oportuna porque el término para notificar el requerimiento especial es de cinco años contados desde el vencimiento del plazo para declarar.", "j": "Es incorrecta. Resulta atractiva porque el art. 714 del Estatuto Tributario prevé términos de firmeza más largos para ciertas declaraciones, pero el art. 705 fija para el requerimiento especial tres años desde el vencimiento del plazo para declarar y el caso no presenta ningún supuesto de término especial. Error de norma.", "tipo": "norma"}, {"t": "La notificación conserva efectos porque el proyecto de requerimiento se elaboró dentro del término, que se interrumpe con la suscripción del acto.", "j": "Es incorrecta. Resulta atractiva porque el acto se elaboró el 20 de marzo de 2025, pero el art. 705 del Estatuto Tributario exige la notificación dentro del término y no basta con suscribir el proyecto. Error de fase.", "tipo": "fase"}, {"t": "La notificación sería tardía: el plazo de tres años venció el 10 de abril de 2025 y sin requerimiento notificado la declaración queda en firme.", "j": "Es correcta. El art. 705 del Estatuto Tributario ordena notificar el requerimiento especial a más tardar dentro de los tres años siguientes al vencimiento del plazo para declarar, y el art. 714 dispone la firmeza de la declaración si en ese lapso no se notificó requerimiento especial.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M035", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 705", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#705", "fecha": "2026-10-24"}, {"fila": "M045", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 714", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#714", "fecha": "2026-10-24"}]}, {"id": "C-E09-005-1", "caso_id": "C-E09-005", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 1", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestora II Diana Castaño, de la división de fiscalización y liquidación de una Dirección Seccional, estudia el expediente de Transportes Sierra Verde S.A.S., sociedad que en el año gravable 2024 obtuvo ingresos por 38.000 UVT según la información reportada por sus clientes. La sociedad no presentó la declaración de renta, cuyo plazo venció el 9 de mayo de 2025, y tampoco ha recibido liquidación oficial. En la respuesta a un requerimiento ordinario del 15 de julio de 2026, el representante legal sostiene que la obligación de pagar el impuesto aún no ha nacido, pues no se ha presentado declaración ni la Administración ha determinado el tributo mediante un acto en firme. La Gestora debe fijar el momento de origen de la obligación para orientar la propuesta de determinación oficial del impuesto que llevará al comité de la división.", "enunciado": "¿Qué debe concluir la Gestora sobre el momento en que se originó la obligación tributaria sustancial de la sociedad?", "opciones": [{"t": "Se originó cuando la sociedad realizó en 2024 los presupuestos que la ley prevé como generadores del impuesto, aunque no haya declarado.", "j": "Es correcta. El Estatuto Tributario, art. 1, dispone que la obligación tributaria sustancial se origina al realizarse el presupuesto o los presupuestos previstos en la ley como generadores del impuesto, y que tiene por objeto el pago del tributo. La sociedad obtuvo los ingresos en 2024; la falta de declaración o de liquidación oficial no impide que la obligación haya nacido.", "tipo": null}, {"t": "Se originará cuando quede en firme la liquidación oficial que profiera la Administración, pues ese acto es el que determina el tributo a pagar.", "j": "Es incorrecta. Es plausible porque la liquidación oficial cuantifica el impuesto cuando el contribuyente no lo hace; falla porque el Estatuto Tributario, art. 1, sitúa el origen de la obligación sustancial en la realización del presupuesto generador, y el acto oficial solo determina una obligación ya nacida. Error de fase: confunde el momento de la determinación con el del nacimiento.", "tipo": "fase"}, {"t": "Se originó con la inscripción de la sociedad en el RUT como responsable del impuesto sobre la renta, que la vinculó al pago de ese tributo.", "j": "Es incorrecta. Es plausible porque el RUT identifica y clasifica a los sujetos obligados; falla porque la inscripción es una obligación formal (Estatuto Tributario, art. 555-2) y la obligación sustancial nace de la realización del hecho generador, según el art. 1. Error de norma: atribuye a la regla del registro el origen del deber de pagar.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M077", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E09-010-1", "caso_id": "C-E09-010", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 588", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "IMPOSICION DE SANCIONES"], "caso": "El Gestor II Ricardo Salazar, de la división de fiscalización y liquidación de una Dirección Seccional, revisa técnicamente dos correcciones de la declaración de renta del año gravable 2023 de Alimentos Valle Fértil S.A.S., cuyo plazo para declarar venció el 10 de mayo de 2024. La primera corrección, presentada el 20 de marzo de 2025 por el medio electrónico obligatorio, disminuyó el valor a pagar en 60 UVT por un error en la depuración de costos. La segunda, presentada el 15 de octubre de 2026, aumentó el impuesto a cargo en 140 UVT por ingresos omitidos y no incluyó sanción alguna en el renglón respectivo. A la sociedad no se le ha notificado requerimiento especial ni pliego de cargos. El Gestor debe emitir un concepto integral sobre ambas correcciones antes de definir si propone actuaciones de determinación.", "enunciado": "¿Qué concepto sobre las dos correcciones puede sustentar el Gestor?", "opciones": [{"t": "La primera es oportuna por estar dentro del año siguiente al vencimiento; la segunda está en término, pero omitió la sanción por corrección.", "j": "Es correcta. La primera disminuyó el valor a pagar y se presentó el 20 de marzo de 2025, dentro del año siguiente al vencimiento, como exige el Estatuto Tributario, art. 589. La segunda aumentó el impuesto dentro de los tres años y sin requerimiento notificado, pero el art. 588 condiciona esa corrección a que se liquide la sanción por corrección, que la sociedad omitió.", "tipo": null}, {"t": "Las dos son oportunas y quedan como se presentaron, porque se radicaron dentro de los tres años y sin requerimiento especial notificado.", "j": "Es incorrecta. Es plausible porque ambas fechas caen dentro de los tres años y no hay requerimiento especial; falla porque el Estatuto Tributario, art. 588, exige además que en la corrección que aumenta el impuesto se liquide la sanción por corrección, y la segunda no lo hizo. Error de completitud: omite un requisito de la norma.", "tipo": "completitud"}, {"t": "La primera es oportuna; la segunda es extemporánea, porque aumentar el impuesto exige corregir dentro del año siguiente al vencimiento del plazo.", "j": "Es incorrecta. Acierta con la primera corrección, lo que la hace plausible, pero aplica a la segunda el término de un año del Estatuto Tributario, art. 589, previsto para disminuir el valor a pagar; la corrección que aumenta el impuesto tiene tres años según el art. 588, plazo que vence el 10 de mayo de 2027. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}, {"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E03-006-1", "caso_id": "C-E03-006", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 648", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Ricardo Salinas, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, proyecta la liquidación oficial de revisión de la declaración de renta del año gravable 2023 de Constructora Puerto Lindo S.A.S., sociedad contribuyente del impuesto sobre la renta. La sociedad declaró un saldo a pagar de 80 millones de pesos. Los extractos bancarios mostraron ingresos omitidos por 400 millones de pesos, que la sociedad no desvirtuó al responder el requerimiento especial. Con la adición de esos ingresos, la liquidación oficial determina un saldo a pagar de 220 millones de pesos. La coordinadora pide registrar en el proyecto el valor de la sanción por inexactitud antes de aplicar cualquier gradualidad, y advierte que el comité de la división revisará la base escogida y el cálculo.", "enunciado": "Calcule el valor de la sanción por inexactitud que debe registrarse antes de aplicar gradualidad.", "opciones": [{"t": "140 millones de pesos, que equivalen al 100 % de la diferencia entre el saldo determinado y el declarado.", "j": "Es correcta. La omisión de ingresos es inexactitud sancionable según el art. 647 del Estatuto Tributario, y el art. 648 fija la sanción en el 100 % de la diferencia entre el saldo a pagar determinado en la liquidación oficial y el declarado: 220 menos 80 da 140 millones de pesos.", "tipo": null}, {"t": "60 millones de pesos, que equivalen al 15 % de los ingresos omitidos que se adicionan en la liquidación.", "j": "Es incorrecta. Es plausible porque el art. 648 del Estatuto Tributario prevé el 15 % de los valores inexactos, pero ese porcentaje aplica a las declaraciones de ingresos y patrimonio; la sociedad es contribuyente de renta, de modo que la base es la diferencia de saldos (error de norma).", "tipo": "norma"}, {"t": "220 millones de pesos, que equivalen al 100 % del saldo a pagar que determina la liquidación oficial de revisión.", "j": "Es incorrecta. Es plausible porque el 100 % es el porcentaje correcto, pero el art. 648 del Estatuto Tributario lo aplica sobre la diferencia entre el saldo determinado y el declarado, no sobre el saldo total que fija la liquidación oficial (error de granularidad).", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M069", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 647", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#647", "fecha": "2026-10-24"}, {"fila": "M070", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 648", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#648", "fecha": "2026-10-24"}]}, {"id": "C-E05-002-1", "caso_id": "C-E05-002", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 702", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Julián Rojas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe para revisión técnica el expediente de IVA del cuarto bimestre de 2024 de Distribuidora Beta Ltda. El 3 de febrero de 2026 la División notificó una liquidación de revisión que rechazó IVA descontable por 410 millones de pesos, glosa propuesta en el requerimiento especial de 2025. El contribuyente interpuso recurso, que sigue en trámite. En marzo de 2026, un cruce con la facturación electrónica revela ingresos por 1.350 millones de pesos omitidos en esa misma declaración, que no se mencionaron en el requerimiento ni en su ampliación. El auditor que detectó el cruce propone proferir una segunda liquidación de revisión para el mismo bimestre, con el argumento de que el término legal para hacerlo aún no ha vencido. La coordinadora pide un concepto antes de asignar recursos a esa actuación.", "enunciado": "Decida si la actuación que propone el auditor es procedente y sustente su decisión.", "opciones": [{"t": "Procede ampliar el requerimiento especial para incorporar los ingresos y luego reliquidar el bimestre.", "j": "Es incorrecta. Resulta atractiva porque la ampliación es el medio para incorporar hechos al debate antes de liquidar, según el Estatuto Tributario, art. 711. Pero esa etapa ya se cerró con la liquidación de revisión notificada, y el art. 702 impide una nueva modificación; la opción retrocede a una fase agotada del procedimiento (fase).", "tipo": "fase"}, {"t": "No procede, porque la liquidación privada de ese bimestre ya fue modificada la vez que la ley permite.", "j": "Es correcta. El Estatuto Tributario, art. 702, faculta a la Administración para modificar las liquidaciones privadas por una sola vez mediante liquidación de revisión. La declaración del cuarto bimestre ya fue modificada por el acto notificado el 3 de febrero de 2026, de modo que el hallazgo posterior no habilita un segundo acto de revisión.", "tipo": null}, {"t": "Procede, porque los ingresos omitidos son hechos nuevos que no fueron objeto del primer acto de revisión.", "j": "Es incorrecta. Es plausible porque los ingresos no se discutieron en el primer acto y el art. 711 del Estatuto Tributario limita cada liquidación a los hechos del requerimiento. Pero el art. 702 permite modificar la liquidación privada por una sola vez, con independencia de que aparezcan hechos nuevos; la opción omite ese límite (completitud).", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M037", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 702", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#702", "fecha": "2026-10-24"}, {"fila": "M039", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 711", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#711", "fecha": "2026-10-24"}]}, {"id": "C-E11-004-1", "caso_id": "C-E11-004", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 697", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "El Gestor II Mauricio Salas, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa técnicamente la declaración del impuesto sobre la renta del año gravable 2024 de Inversiones Ribera S.A.S. Detecta dos inconsistencias. Primera: la renta líquida gravable declarada es de $500.000.000, coincide con los soportes contables y, aplicada la tarifa del 35 %, arroja $175.000.000; sin embargo, en el renglón del impuesto se anotó $157.500.000. Segunda: los reportes de terceros muestran ingresos por $1.300.000.000, mientras la declaración informa $1.120.000.000, sin explicación en los soportes. Ambas diferencias reducen el impuesto a cargo. El expediente aún no tiene requerimiento especial y la declaración no está en firme; la sociedad tampoco ha presentado corrección alguna. La jefatura pide clasificar las inconsistencias antes de definir el trámite que seguirá cada una.", "enunciado": "Diagnostique cuál de las inconsistencias encaja en la definición legal de error aritmético.", "opciones": [{"t": "La del renglón del impuesto, porque la base se declaró bien y el valor resultante anotado es equivocado.", "j": "Es correcta. El Estatuto Tributario, art. 697, define el error aritmético cuando, 'a pesar de haberse declarado correctamente los valores correspondientes a hechos imponibles o bases gravables, se anota como valor resultante un dato equivocado'. La renta líquida gravable coincide con los soportes y el 35 % da $175.000.000, pero se anotó $157.500.000. La omisión de ingresos es, en cambio, la conducta del art. 647.", "tipo": null}, {"t": "La de los ingresos, porque tramitarla como error aritmético evita abrir la etapa del requerimiento especial.", "j": "Es incorrecta. Resulta atractiva porque la vía del error aritmético es más corta que la determinación con requerimiento especial. Sin embargo, el Estatuto Tributario, art. 697, no cubre diferencias en la base gravable, y la omisión de ingresos es inexactitud según el art. 647, que debe discutirse en la etapa de determinación. Error de fase: escoge el trámite por su rapidez y salta la etapa que corresponde.", "tipo": "fase"}, {"t": "Las dos, porque ambas reducen el impuesto a cargo frente al valor que debió figurar en la declaración.", "j": "Es incorrecta. Es plausible porque las dos diferencias producen un menor impuesto, rasgo común de las inconsistencias sancionables. Sin embargo, el Estatuto Tributario, art. 697, exige que los valores de la base se hayan declarado correctamente; en los ingresos el dato equivocado es la base misma, que configura inexactitud según el art. 647. Error de completitud: atiende al efecto y omite la condición de la definición.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M044", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 697", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#697", "fecha": "2026-10-24"}, {"fila": "M069", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 647", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#647", "fecha": "2026-10-24"}]}, {"id": "C-E09-001-1", "caso_id": "C-E09-001", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 641", "integra": ["IMPOSICION DE SANCIONES", "LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "La Gestora II Laura Méndez, de la división de fiscalización y liquidación de una Dirección Seccional, revisa en la fase de verificación previa la declaración de renta del año gravable 2025 de Comercializadora Andina del Valle S.A.S. El plazo para declarar venció el 14 de abril de 2026 y la declaración se presentó el 22 de junio de 2026, sin que la Administración hubiera proferido emplazamiento alguno. La declaración registra un impuesto a cargo de 400 UVT, retenciones en la fuente por 250 UVT y un saldo a pagar de 150 UVT. En el renglón de sanciones, la sociedad liquidó 20 UVT. El jefe de la división le pide establecer, antes de estudiar cualquier reducción, el valor que la sociedad debió autoliquidar como sanción por extemporaneidad, para decidir si procede proponer un ajuste a la sociedad.", "enunciado": "¿Qué valor de la sanción por extemporaneidad debe tomar la Gestora como referencia para decidir si propone el ajuste?", "opciones": [{"t": "40 UVT, que equivalen al 5 % por cada uno de los dos meses completos de retardo sobre el impuesto a cargo de 400 UVT.", "j": "Es incorrecta. Usa la base correcta del impuesto a cargo, lo que la hace plausible, pero descarta los ocho días adicionales; el Estatuto Tributario, art. 641, liquida la sanción por cada mes o fracción de mes calendario de retardo, de modo que del 14 de abril al 22 de junio hay tres períodos sancionables. Error de completitud: omite el elemento de la fracción de mes.", "tipo": "completitud"}, {"t": "22,5 UVT, que equivalen al 5 % por cada uno de los tres meses o fracción de retardo sobre el saldo a pagar de 150 UVT.", "j": "Es incorrecta. Cuenta bien los meses o fracción de retardo, lo que la hace plausible, pero toma como base el saldo a pagar después de retenciones; el Estatuto Tributario, art. 641, ordena calcular el 5 % sobre el total del impuesto a cargo o retención objeto de la declaración, que aquí es de 400 UVT. Error de granularidad: aplica la tarifa sobre un renglón distinto de la declaración.", "tipo": "granularidad"}, {"t": "60 UVT, que equivalen al 5 % por cada uno de los tres meses o fracción de retardo sobre el impuesto a cargo.", "j": "Es correcta. El Estatuto Tributario, art. 641, fija la sanción por extemporaneidad en el 5 % del total del impuesto a cargo por cada mes o fracción de mes calendario de retardo, sin exceder el 100 %. Entre el 14 de abril y el 22 de junio de 2026 hay dos meses y ocho días, es decir, tres períodos: 3 x 5 % x 400 UVT = 60 UVT, frente a los 20 UVT liquidados.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E10-005-1", "caso_id": "C-E10-005", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Aplicar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 715", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "El Gestor II Salazar trabaja un programa de omisos en la división de fiscalización y liquidación. El expediente de Transportes Altamar S.A.S. muestra que la sociedad figura inscrita como responsable del impuesto sobre la renta, que su plazo para declarar el año gravable 2023 venció el 14 de mayo de 2024 y que no hay declaración presentada. El cruce con información de terceros arroja ingresos por 5.400 UVT y retenciones practicadas por 180 UVT, y la verificación del registro confirma que la obligación de declarar estaba vigente en ese periodo. El 7 de abril de 2026 la coordinación pide impulsar el expediente: una propuesta es proferir ya la liquidación de aforo con las cifras de terceros y otra es requerir información al contribuyente sin fijar plazo. El expediente no registra actuación previa frente a la sociedad.", "enunciado": "Decida cuál es la actuación que debe adelantar la división frente a la sociedad en esta fase.", "opciones": [{"t": "Emplazar a la sociedad, comprobada su obligación, para que declare en el término perentorio de un mes, con advertencia de las consecuencias.", "j": "Es correcta. El art. 715 del Estatuto Tributario ordena emplazar a quien incumple la obligación de declarar, previa comprobación de esa obligación, para que lo haga en el término perentorio de un mes, con advertencia de las consecuencias legales.", "tipo": null}, {"t": "Proferir la liquidación de aforo con las cifras del cruce de terceros, pues la omisión está demostrada y el expediente cuenta con base gravable.", "j": "Es incorrecta. Resulta atractiva por la solidez del cruce, pero adelanta la determinación oficial sin el emplazamiento previo que exige el art. 715 del Estatuto Tributario. Error de fase.", "tipo": "fase"}, {"t": "Requerir la información faltante sin señalar plazo de respuesta y, con lo que allegue la sociedad, proponer la determinación oficial del impuesto.", "j": "Es incorrecta. Es plausible porque robustece el acervo probatorio, pero omite el emplazamiento previsto en el art. 715 del Estatuto Tributario y su término perentorio de un mes con la advertencia legal. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M031", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 715", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#715", "fecha": "2026-10-24"}]}, {"id": "C-E10-006-1", "caso_id": "C-E10-006", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869-1", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "El Gestor II Lozano analiza el expediente de Inversiones Caribe S.A.S., cuyo plazo para declarar el impuesto sobre la renta del año gravable 2023 venció el 16 de mayo de 2024. El papel de trabajo de auditoría describe tres operaciones encadenadas en noviembre de 2023: venta de un inmueble a una vinculada por 4.900 UVT, retroarriendo inmediato del mismo bien y cesión del contrato a un tercero domiciliado en el exterior, con un efecto fiscal conjunto de 2.300 UVT menos de renta líquida. El auditor dejó constancia de indicios documentales sobre la ausencia de propósito de negocios en la secuencia, pero no hay prueba plena. El 11 de junio de 2026 el expediente está en investigación y en la coordinación hay posiciones encontradas sobre el paso siguiente.", "enunciado": "Diagnostique la actuación que habilita la normativa al funcionario competente con el material probatorio descrito.", "opciones": [{"t": "Cerrar la investigación y archivar el expediente, ya que la secuencia de operaciones no se puede discutir sin prueba plena del propósito elusivo.", "j": "Es incorrecta. Parece prudente frente a un acervo incompleto, pero el art. 869-1 del Estatuto Tributario se satisface con prueba sumaria de las razones del emplazamiento especial. Error de completitud.", "tipo": "completitud"}, {"t": "Emitir un emplazamiento especial, dentro del término de firmeza, con las razones de la posible configuración de abuso sustentadas en prueba sumaria.", "j": "Es correcta. El art. 869-1 del Estatuto Tributario obliga al funcionario competente que, dentro del término de firmeza, evidencie una posible operación abusiva, a emitir emplazamiento especial explicando las razones sustentadas siquiera en prueba sumaria, y el art. 714 fija ese término de firmeza.", "tipo": null}, {"t": "Proponer la liquidación de revisión con el efecto fiscal calculado, porque los indicios documentales respaldan la recaracterización de las tres operaciones.", "j": "Es incorrecta. Resulta tentadora porque el efecto fiscal está cuantificado, pero el art. 869-1 del Estatuto Tributario interpone el emplazamiento especial antes de la determinación oficial del abuso. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M054", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869-1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869-1", "fecha": "2026-10-24"}, {"fila": "M045", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 714", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#714", "fecha": "2026-10-24"}]}, {"id": "C-E03-005-1", "caso_id": "C-E03-005", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 644", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Liliana Cárdenas, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, adelanta un programa de control sobre declaraciones de IVA del año 2025. Servicios Integrales Cumbre S.A.S. presentó en término la declaración del tercer bimestre y el 12 de mayo de 2026 la corrigió por iniciativa propia, con lo cual aumentó el saldo a pagar en 30 millones de pesos por ingresos que había omitido. Al corregir no liquidó ninguna sanción. Hasta esa fecha la DIAN no le había notificado emplazamiento, requerimiento especial ni liquidación oficial. Un auxiliar del grupo propone imponer la sanción por inexactitud sobre los 30 millones, porque la omisión de ingresos está reconocida por la propia sociedad. La Gestor II debe fijar la posición del grupo antes de proyectar el acto.", "enunciado": "Decida qué sanción corresponde a la conducta de la sociedad y quién debía liquidarla.", "opciones": [{"t": "La sanción por corrección, que la sociedad debía liquidar y pagar al corregir su declaración.", "j": "Es correcta. El art. 644 del Estatuto Tributario dispone que los contribuyentes o responsables que corrijan sus declaraciones deberán liquidar y pagar una sanción; la sociedad corrigió por iniciativa propia y omitió liquidarla, de modo que esa es la sanción aplicable.", "tipo": null}, {"t": "Ninguna sanción, porque la corrección se hizo por iniciativa propia antes de cualquier actuación de la DIAN.", "j": "Es incorrecta. Es plausible suponer que la corrección espontánea borra la infracción, pero el art. 644 del Estatuto Tributario impone a quien corrige el deber de liquidar y pagar una sanción; la oportunidad de la corrección no suprime ese deber (error de completitud).", "tipo": "completitud"}, {"t": "La sanción por inexactitud del 100 % sobre los 30 millones, porque la sociedad reconoció haber omitido ingresos.", "j": "Es incorrecta. Es plausible porque la omisión de ingresos es una conducta de inexactitud, pero el art. 648 del Estatuto Tributario mide esa sanción sobre la diferencia determinada en la liquidación oficial frente a lo declarado, y aquí no existe liquidación oficial; la corrección voluntaria se rige por el art. 644 (error de norma).", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M068", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 644", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#644", "fecha": "2026-10-24"}, {"fila": "M070", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 648", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#648", "fecha": "2026-10-24"}]}, {"id": "C-E03-003-1", "caso_id": "C-E03-003", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 641", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Paula Herrera, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, verifica la declaración de renta del año gravable 2024 de Textiles Brisa Andina S.A.S. Según el calendario, el plazo venció el 14 de mayo de 2025, y la declaración se presentó el 21 de julio de 2025. En ella figura un impuesto a cargo de 48.000.000 de pesos, un anticipo para el año siguiente de 13.000.000 de pesos y un saldo a pagar de 61.000.000 de pesos. La sociedad no liquidó sanción. No hubo emplazamiento previo y el expediente no registra solicitud de reducción. La coordinadora pide fijar, como punto de partida del proyecto, la sanción que la sociedad debió liquidar, con el cálculo de los meses de retardo, para revisarlo en el comité del grupo.", "enunciado": "Calcule la sanción por extemporaneidad que la sociedad debió liquidar en su declaración, antes de cualquier incremento o graduación.", "opciones": [{"t": "9.150.000 pesos, que corresponden al 5 % del saldo a pagar declarado por tres meses o fracción de retardo.", "j": "Es incorrecta. Es plausible porque el saldo a pagar es la cifra que el contribuyente debía cancelar, pero el art. 641 del Estatuto Tributario toma como base el total del impuesto a cargo o la retención, no el saldo que incluye el anticipo (error de granularidad).", "tipo": "granularidad"}, {"t": "4.800.000 pesos, que corresponden al 5 % del impuesto a cargo por dos meses completos de retardo.", "j": "Es incorrecta. Es plausible porque entre el 14 de mayo y el 14 de julio corren dos meses completos, pero el art. 641 del Estatuto Tributario cuenta cada mes o fracción de mes calendario; los siete días posteriores forman una fracción que suma un tercer mes (error de completitud).", "tipo": "completitud"}, {"t": "7.200.000 pesos, que corresponden al 5 % del impuesto a cargo por tres meses o fracción de retardo.", "j": "Es correcta. Es la sanción que la sociedad debió liquidar y pagar: el art. 641 del Estatuto Tributario fija el 5 % del total del impuesto a cargo por cada mes o fracción de mes calendario de retardo: del 14 de mayo al 21 de julio hay dos meses y una fracción, es decir tres periodos; 15 % de 48.000.000 da 7.200.000, por debajo del tope del 100 %.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E04-004-1", "caso_id": "C-E04-004", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto Ley 2245 de 2011, art. 7", "integra": ["NORMATIVA CAMBIARIA"], "caso": "El 10 de junio de 2026 llega a la división de fiscalización y liquidación de una Dirección Seccional una queja firmada por una persona natural, con copia de su documento de identidad. Afirma que la Importadora Boreal S.A.S. paga a sus proveedores del exterior por medio de un intermediario en zona de frontera que mueve dólares por fuera del mercado cambiario. Adjunta seis comprobantes de consignación a nombre del intermediario por un total de 310.000 dólares y copia de las facturas de los proveedores, cuyas fechas coinciden con las consignaciones. Un Gestor II recibe el expediente para sustentar el trámite. Un compañero de la división propone archivar la queja porque, a su juicio, no proviene de una entidad de control ni de otra autoridad y la actuación cambiaria solo puede abrirse dentro de un programa de fiscalización ya aprobado.", "enunciado": "¿Cómo debe valorar el Gestor la propuesta del compañero al sustentar el trámite de la queja?", "opciones": [{"t": "Debe acogerla en parte y remitir la queja a la autoridad penal, porque mover divisas por un intermediario configura un delito que excluye la vía cambiaria.", "j": "Es incorrecta. Es plausible porque el uso de canales informales puede tener connotación penal. Falla porque el Decreto Ley 2245 de 2011, art. 7, permite iniciar la actuación administrativa por infracciones cambiarias con base en quejas que ofrezcan credibilidad; la posible arista penal no desplaza la competencia cambiaria de la DIAN. Error de competencia.", "tipo": "competencia"}, {"t": "Debe rechazarla, porque la actuación cambiaria puede iniciarse por quejas de personas naturales que, como esta, ofrecen credibilidad con sus soportes.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 7, dispone que la actuación por infracciones cambiarias puede iniciarse de oficio, por quejas o informes de personas naturales o jurídicas y por cualquier otro medio que ofrezca credibilidad. La queja está firmada y trae comprobantes y facturas que se corresponden en fechas.", "tipo": null}, {"t": "Debe rechazarla, pero condicionar la apertura a que el quejoso ratifique la queja bajo juramento, requisito que le da credibilidad suficiente.", "j": "Es incorrecta. Es plausible porque la credibilidad de la fuente es el criterio que fija la norma. Falla porque el Decreto Ley 2245 de 2011, art. 7, no exige ratificación juramentada; ese requisito se toma de otro tipo de procedimiento y aquí la credibilidad la aportan los soportes. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M005", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 7", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#7", "fecha": "2026-10-24"}]}, {"id": "C-E06-003-1", "caso_id": "C-E06-003", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Analizar", "fuente": "Constitución Política de Colombia, art. 209", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Sofía Parra, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, tiene a cargo el expediente de Beta Logística S.A.S. por el impuesto sobre la renta del año gravable 2023. El 3 de marzo de 2026 terminó la valoración de pruebas, que soportan ingresos omitidos por 540 UVT, y dejó listo el proyecto de requerimiento especial. El 9 de marzo el coordinador del grupo le indica de forma verbal que guarde el proyecto hasta nueva orden. Sofía verifica en el registro mercantil que el coordinador figura como socio del gerente de Beta Logística en otra empresa. Ningún otro expediente del grupo ha recibido una instrucción semejante, el sistema de gestión documental registra el proyecto como terminado y el término para notificar el requerimiento sigue corriendo. Sofía debe decidir cómo actuar frente a la instrucción y dejar trazabilidad de su decisión.", "enunciado": "¿Qué diagnóstico sobre la instrucción del coordinador puede sustentar Sofía con base constitucional?", "opciones": [{"t": "La instrucción no afecta ningún principio, porque el coordinador tiene la facultad de fijar el orden en que el grupo tramita sus expedientes.", "j": "Es incorrecta. Es plausible porque el coordinador sí organiza el reparto y la prioridad del trabajo. Falla porque esa facultad se ejerce al servicio de los intereses generales (Constitución Política, art. 209) y no ampara aplazar un solo expediente por un vínculo personal. Error de competencia.", "tipo": "competencia"}, {"t": "La instrucción afecta la imparcialidad y la celeridad, porque la función administrativa debe servir a los intereses generales y no a un vínculo personal.", "j": "Es correcta. La Constitución Política, art. 209, dispone que la función administrativa está al servicio de los intereses generales y se desarrolla con fundamento, entre otros, en los principios de imparcialidad y celeridad; el art. 2 fija como fin del Estado asegurar la vigencia de un orden justo. Detener un expediente listo solo para la empresa vinculada con el coordinador, mientras corre el término, lesiona ambos principios.", "tipo": null}, {"t": "La instrucción afecta el principio de progresividad, porque deja de exigir al contribuyente un impuesto acorde con su verdadera capacidad económica.", "j": "Es incorrecta. Resulta plausible porque el aplazamiento puede impedir cobrar lo que el contribuyente debe. Falla porque la progresividad es un principio del sistema tributario (Constitución Política, art. 363) que orienta el diseño de los tributos, no la conducta del servidor en un expediente; el principio comprometido está en el art. 209. Error de norma.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M089", "norma": "Constitución Política de Colombia", "articulo": "art. 209", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#209", "fecha": "2026-10-24"}, {"fila": "M088", "norma": "Constitución Política de Colombia", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#2", "fecha": "2026-10-24"}]}, {"id": "C-E08-003-1", "caso_id": "C-E08-003", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 2", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II estudia un expediente cambiario abierto el 2 de abril contra la sociedad Maquinarias del Litoral S. A. S. Los hechos investigados ocurrieron entre agosto y noviembre de hace cuatro años: la empresa canalizó por su cuenta de compensación veintidós operaciones de importación y dejó de transmitir al Banco de la República nueve declaraciones de cambio dentro de la oportunidad legal entonces vigente. Con posterioridad a esos hechos, el régimen cambiario cambió el formato y el canal electrónico de transmisión, sin modificar los plazos. El apoderado alega que, al haber cambiado el régimen, la conducta debe valorarse con las reglas actuales, que la actuación debe archivarse y que el asunto tiene naturaleza penal porque hubo manejo de divisas. El expediente está en valoración probatoria, antes de la formulación de cargos, y el coordinador pide un diagnóstico escrito.", "enunciado": "¿Cómo debe diagnosticar el Gestor II la calificación de la conducta frente a los alegatos del apoderado?", "opciones": [{"t": "La conducta se califica con las disposiciones cambiarias vigentes al momento de la transgresión y es una contravención administrativa.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 2, define la infracción cambiaria como contravención administrativa de las disposiciones constitutivas del régimen cambiario vigentes al momento de la transgresión; el cambio posterior de formato y canal, que no tocó los plazos, no altera esa calificación.", "tipo": null}, {"t": "La conducta pertenece a la jurisdicción penal por el manejo de divisas, de modo que la división debe archivar la investigación administrativa.", "j": "Es incorrecta. Resulta plausible porque algunas conductas con divisas tienen reproche penal, pero el Decreto Ley 2245 de 2011, art. 2, califica la infracción cambiaria como contravención administrativa con sanción propia, que la DIAN determina. Error de competencia.", "tipo": "competencia"}, {"t": "La conducta se califica con las condiciones de transmisión vigentes a la fecha de formulación de cargos, que son las aplicables al expediente.", "j": "Es incorrecta. Resulta plausible porque los cargos se formularán bajo el régimen actual, pero el Decreto Ley 2245 de 2011, art. 2, remite a las disposiciones vigentes al momento de la transgresión, no a las del acto de trámite. Error de norma.", "tipo": "norma"}], "clave": 0, "soporte": [{"fila": "M022", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 2", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#2", "fecha": "2026-10-24"}]}, {"id": "C-E11-005-1", "caso_id": "C-E11-005", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Aplicar", "fuente": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN), art. 3", "integra": ["NORMATIVA CAMBIARIA"], "caso": "La Gestora II Diana Ospina, de la División de Fiscalización y Liquidación de una Dirección Seccional, adelanta una investigación cambiaria contra Distribuidora Litoral Norte Ltda., importadora de repuestos. La DIAN exigió exhibir las declaraciones de cambio de siete pagos al exterior realizados en 2025, por un total de USD 340.000. La empresa exhibió seis: cuatro coinciden con los soportes bancarios y comerciales; dos registran un numeral cambiario distinto del que corresponde a la operación. Para el séptimo pago, de USD 18.000, la empresa reconoce que no presentó la declaración de cambio en la oportunidad legal. Las operaciones se canalizaron por intermediarios del mercado cambiario y ninguna pasó por cuenta de compensación. El expediente está en la etapa de formulación de cargos y la jefatura pide cuantificar en UVT la multa propuesta con los datos verificados.", "enunciado": "Determine el monto de la multa que corresponde proponer según los hallazgos verificados.", "opciones": [{"t": "175 UVT, porque la multa se impone por cada uno de los siete pagos incluidos en la exigencia.", "j": "Es incorrecta. Resulta plausible porque la exigencia de exhibición abarcó los siete pagos y la multa es por unidad. Sin embargo, el Decreto Ley 2245 de 2011, art. 3, numeral 1, impone la multa por cada declaración que incurre en la conducta, no por cada operación revisada; cuatro declaraciones son correctas. Error de granularidad: toma como unidad de cálculo el universo revisado y no las declaraciones infractoras.", "tipo": "granularidad"}, {"t": "25 UVT, porque solo la declaración no presentada a tiempo configura una conducta sancionable.", "j": "Es incorrecta. Parece plausible porque la falta de declaración es la infracción más visible del caso. Sin embargo, el Decreto Ley 2245 de 2011, art. 3, numeral 1, también sanciona presentar la declaración 'con datos equivocados', como ocurre con los dos numerales cambiarios errados. Error de completitud: deja fuera dos de las tres conductas sancionables.", "tipo": "completitud"}, {"t": "75 UVT, porque tres declaraciones incurren en conducta sancionable y la multa se impone por cada una.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 3, numeral 1, sanciona no presentar la declaración de cambio en la oportunidad legal y presentarla con datos equivocados con multa de 25 UVT 'por cada declaración'. Hay dos declaraciones con numeral equivocado y una no presentada a tiempo: tres por 25 UVT dan 75 UVT. Las cuatro correctas no generan multa.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#3", "fecha": "2026-10-24"}]}, {"id": "C-E09-007-1", "caso_id": "C-E09-007", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 686", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "La Gestora II Natalia Ospina, de la división de fiscalización y liquidación de una Dirección Seccional, investiga la declaración de renta del año gravable 2024 de Constructora Puerto Alto S.A.S., que registra costos por 6.500 UVT soportados en compras a Ferretería El Cerro S.A.S. El 4 de mayo de 2026 la Gestora envió a la ferretería, que no está siendo investigada, un requerimiento de información para que aportara las facturas, los comprobantes de pago y el registro de despachos a la constructora, con un plazo de respuesta que venció el 19 de mayo. La ferretería respondió el 2 de junio que solo debe entregar información sobre sus propias declaraciones y que cualquier dato sobre sus clientes debe pedirse directamente a la constructora. La Gestora debe decidir cómo tratar esa respuesta en el expediente y dejar constancia de su decisión.", "enunciado": "¿Qué decisión debe tomar la Gestora frente a la respuesta de la ferretería?", "opciones": [{"t": "Aceptarla, porque el deber de atender requerimientos de información recae en el contribuyente investigado y no en sus proveedores.", "j": "Es incorrecta. Es plausible porque el foco de la investigación es la constructora; falla porque el Estatuto Tributario, art. 686, extiende el deber de atender requerimientos a la información necesaria para verificar la situación impositiva de terceros relacionados con el requerido. Error de completitud: deja por fuera a los terceros que la norma comprende.", "tipo": "completitud"}, {"t": "Aceptarla, porque pedir información a un tercero que no está siendo investigado exige una autorización judicial previa.", "j": "Es incorrecta. Es plausible porque algunas medidas sobre terceros sí requieren control judicial; falla porque el Estatuto Tributario, art. 686, deja a juicio de la Administración la necesidad de la información y no condiciona el requerimiento a una orden del juez. Error de competencia: atribuye a otra autoridad una facultad propia de la DIAN.", "tipo": "competencia"}, {"t": "Tratarla como desatención del requerimiento, porque la información es necesaria para verificar la situación impositiva de un tercero relacionado.", "j": "Es correcta. El Estatuto Tributario, art. 686, dispone que se deben atender los requerimientos de informaciones y pruebas relacionadas con investigaciones de la Administración cuando, a juicio de esta, sean necesarios para verificar la situación impositiva de unos y otros, o de terceros relacionados con ellos. La ferretería es proveedora de la constructora investigada y además respondió fuera de plazo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M008", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 686", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#686", "fecha": "2026-10-24"}]}, {"id": "C-E02-006-1", "caso_id": "C-E02-006", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Aplicar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional. Por una reorganización interna, el Grupo Interno de Trabajo de Personas Jurídicas fue suprimido el 30 de septiembre de 2025 y sus 120 expedientes activos pasan al grupo que usted integra. De ellos, 41 están en etapa de emplazamiento, 57 tienen requerimiento especial notificado y 22 esperan liquidación oficial. Varios tienen cuadernos anexos con pruebas aportadas por terceros. El funcionario que entrega propone hacer el traslado con un correo que enumere los números de radicado. La entrega debe quedar lista el 10 de octubre y el jefe de la división le encarga recibir los expedientes en nombre del grupo. Usted debe precisar qué documento exigir para dar por recibida la entrega.", "enunciado": "Decida qué documento debe exigir para recibir los expedientes y sustente la razón.", "opciones": [{"t": "El correo con los radicados, pues el inventario se elabora cuando los expedientes terminan y se transfieren al archivo.", "j": "Es incorrecta. Es plausible porque la transferencia es un momento típico de inventario, pero la Ley 594 de 2000, art. 26, pide asegurar el control de los documentos en sus diferentes fases, y la entrega entre grupos de expedientes activos es una de ellas. Un listado de radicados no da cuenta de folios ni cuadernos. Error de fase.", "tipo": "fase"}, {"t": "Un inventario documental de los expedientes entregados, que permita controlar los documentos en la fase en que se encuentra cada uno.", "j": "Es correcta. La Ley 594 de 2000, art. 26, obliga a las entidades a elaborar inventarios de los documentos que producen, de manera que se asegure su control en sus diferentes fases. El cambio de grupo no altera la procedencia ni el orden original de los expedientes (art. 11), y el inventario registra qué se entrega, con sus cuadernos anexos, en cada etapa.", "tipo": null}, {"t": "Una certificación del archivo central sobre los 120 expedientes, porque esa dependencia controla los documentos en todas sus fases.", "j": "Es incorrecta. Es plausible porque el archivo central administra documentos, pero expedientes activos en emplazamiento, requerimiento o liquidación están en gestión del área productora; la obligación de inventariarlos recae en quien los produce y entrega, según la Ley 594 de 2000, art. 26. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M097", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-24"}, {"fila": "M094", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-24"}]}, {"id": "C-E07-004-1", "caso_id": "C-E07-004", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Evaluar", "fuente": "Decreto 1165 de 2019, art. 581", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Felipe Arango, de la división de fiscalización y liquidación de una Dirección Seccional, tiene a cargo el control posterior de Importadora Pacífico Verde S.A.S., que presentó 46 declaraciones de importación entre enero y diciembre de 2025, todas con levante autorizado. Un estudio de riesgo muestra que en 19 de ellas el valor declarado de los repuestos fue, en promedio, 27 % inferior al de las facturas comerciales obtenidas de la naviera y de la entidad financiera que giró los pagos. La mercancía ya fue vendida y no está disponible para examen físico. El coordinador propone abstenerse con dos argumentos: que el control posterior exige revisar físicamente la mercancía y que cada declaración debe tratarse como una actuación aislada, sin examinar el período en conjunto. La actuación está en estudio previo a la apertura del expediente y no se han proferido requerimientos.", "enunciado": "Evalúe los dos argumentos del coordinador y sustente la decisión que corresponde adoptar en esta etapa.", "opciones": [{"t": "El primero no es válido porque pueden revisarse documentos, pero el segundo sí, pues el control posterior se ejerce sobre cada declaración por separado.", "j": "Es incorrecta. Acierta frente al primer argumento, pero el Decreto 1165 de 2019, art. 581, prevé verificar la exactitud de las declaraciones presentadas durante un determinado período de tiempo, lo que permite examinar en conjunto las 46 declaraciones. Error de completitud: refuta solo uno de los dos argumentos.", "tipo": "completitud"}, {"t": "No son válidos: el control posterior recae también sobre documentos y sobre la exactitud de las declaraciones presentadas durante un período determinado.", "j": "
