le porque el art. 651 del Estatuto Tributario alcanza a los obligados a suministrar información tributaria, pero también a aquellas personas a quienes se les haya solicitado informaciones o pruebas; la falta surge del requerimiento de la división y no del reporte de exógena, que se presentó sin errores (error de competencia).", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M071", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 651", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#651", "fecha": "2026-10-24"}]}, {"id": "C-E06-004-1", "caso_id": "C-E06-004", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 683", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Mateo Gil, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración de renta del año gravable 2023 de Comercializadora Gamma S.A.S. Los extractos bancarios y los cruces con terceros soportan ingresos omitidos por 310 UVT. Una extrapolación hecha con el margen promedio del sector, sin ninguna prueba propia del contribuyente, arrojaría 900 UVT. El coordinador sugiere proponer los 900 UVT en el requerimiento especial para que la empresa negocie a la baja en su respuesta. El proyecto debe estar en el despacho de la jefatura el 30 de noviembre de 2026 y la empresa ya respondió un requerimiento ordinario en el que aportó la totalidad de su contabilidad. Mateo debe fijar la cifra que llevará al requerimiento especial y sustentar su posición ante la jefatura.", "enunciado": "¿Qué decisión sobre la cifra del requerimiento especial resiste mejor una revisión de su sustento?", "opciones": [{"t": "Proponer los 310 UVT soportados, porque el Estado no aspira a exigir al contribuyente más de aquello con lo que la ley quiere que coadyuve.", "j": "Es correcta. El Estatuto Tributario, art. 683, ordena que la aplicación recta de las leyes esté presidida por un relevante espíritu de justicia y que al contribuyente no se le exija más de lo que la ley ha querido; la Constitución Política, art. 95, num. 9, enmarca el deber de contribuir en la justicia y la equidad. Solo los 310 UVT tienen prueba.", "tipo": null}, {"t": "Proponer los 900 UVT, porque el deber de contribuir al financiamiento del Estado permite a la Administración fijar la base de mayor recaudo.", "j": "Es incorrecta. Resulta plausible porque invoca el deber constitucional de contribuir (Constitución Política, art. 95, num. 9). Falla porque ese mismo numeral sujeta la contribución a conceptos de justicia y equidad, y el Estatuto Tributario, art. 683, prohíbe exigir más de lo que la ley ha querido. Error de norma: lee el deber sin su límite.", "tipo": "norma"}, {"t": "Proponer los 900 UVT en el requerimiento y reducirlos a 310 UVT en la liquidación oficial, una vez la empresa controvierta la extrapolación.", "j": "Es incorrecta. Es plausible porque la respuesta del contribuyente es la etapa en la que se discuten las cifras. Falla porque traslada a una fase posterior la corrección de un exceso que ya se conoce; el Estatuto Tributario, art. 683, exige que la aplicación de la ley esté presidida desde el inicio por el espíritu de justicia. Error de fase.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M050", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 683", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#683", "fecha": "2026-10-24"}, {"fila": "M092", "norma": "Constitución Política de Colombia", "articulo": "art. 95", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#95", "fecha": "2026-10-24"}]}, {"id": "C-E04-008-1", "caso_id": "C-E04-008", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto 1165 de 2019, art. 51, núm. 13", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Un Gestor II de la división de fiscalización y liquidación de una Dirección Seccional revisa el expediente de la Agencia de Aduanas Meridiano S.A.S. Nivel 1. Entre enero y octubre de 2025 la agencia tramitó las declaraciones de importación de 23 contenedores de un mismo cliente que luego resultó sin instalaciones ni empleados; el jefe de operaciones de la agencia dejó por escrito que las mercancías llegaban sin trazabilidad del pago y que tres contenedores salieron con documentos de transporte alterados. La agencia no informó nada a la DIAN ni a otra autoridad. El 7 de mayo de 2026 la división debe decidir el curso de la actuación. En el proyecto de informe, un auxiliar propone concluir que la agencia incumplió un deber de reporte y, además, que participó en operaciones con mercancías de origen ilícito, por lo que debe liquidarse la sanción correspondiente al delito.", "enunciado": "¿Cómo debe valorar el Gestor las dos conclusiones del proyecto de informe?", "opciones": [{"t": "La primera conclusión se sostiene y la segunda no, porque los hechos sobre mercancías de posible origen ilícito se ponen en conocimiento de la autoridad competente.", "j": "Es correcta. El Decreto 1165 de 2019, art. 51, núm. 13, impone a las agencias de aduanas reportar a la DIAN o a las autoridades competentes las operaciones sospechosas que detecten en su actividad, deber que la agencia no cumplió; y el Decreto 1742 de 2020, art. 33, núm. 1, ordena poner en conocimiento inmediato de la autoridad competente la posible comisión de delitos, sin que la DIAN los tipifique ni los sancione.", "tipo": null}, {"t": "La segunda conclusión se sostiene y la primera no, porque el deber de reporte de la agencia de aduanas se limita a las infracciones cambiarias que detecte en su actividad.", "j": "Es incorrecta. Es plausible porque el Decreto 1165 de 2019, art. 51, núm. 13, menciona las infracciones cambiarias entre los hechos reportables. Falla porque el mismo numeral incluye la evasión, el contrabando y el lavado de activos; el recorte del deber no se desprende de la norma, y además la DIAN no tipifica delitos. Error de norma.", "tipo": "norma"}, {"t": "Las dos conclusiones se sostienen, porque la agencia incumplió el deber de reporte y su participación en operaciones con bienes de origen ilícito quedó probada en el expediente.", "j": "Es incorrecta. Es plausible porque la agencia sí incumplió el deber del Decreto 1165 de 2019, art. 51, núm. 13, y el escrito del jefe de operaciones es un indicio fuerte. Falla porque el Decreto 1742 de 2020, art. 33, núm. 1, asigna a la DIAN la investigación administrativa y el aviso inmediato a la autoridad competente; declarar probado el delito y sancionarlo excede esa función. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M025", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 51", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#51", "fecha": "2026-10-24"}, {"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E02-009-1", "caso_id": "C-E02-009", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Ley 594 de 2000, art. 26", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación. La División Jurídica de la Seccional solicita, con plazo de cinco días hábiles, el expediente de Lácteos del Páramo S.A. para atender una demanda contra una liquidación oficial del impuesto sobre la renta de 2021. Según el inventario documental firmado al cerrar la etapa de discusión, el expediente tiene tres cuadernos y 412 folios. El conteo físico que usted hace hoy arroja 389 folios: el tercer cuaderno, con las pruebas del recurso, termina en el folio 389. El índice del sistema relaciona documentos hasta el folio 412, pero sin imágenes cargadas para los últimos 23. Un auxiliar sugiere remitir lo que hay y anotar la diferencia en el oficio, porque el término de la División Jurídica vence antes de que termine la búsqueda en el archivo de gestión.", "enunciado": "Diagnostique la situación del expediente y lo que debe hacerse antes de remitirlo.", "opciones": [{"t": "Debe remitirse con 389 folios para que la División Jurídica reconstruya el faltante, pues es la dependencia que usará el expediente.", "j": "Es incorrecta. Es plausible porque la División Jurídica será la usuaria, pero el control del expediente corresponde a la dependencia que lo produjo y lo inventarió, según la Ley 594 de 2000, art. 26; el usuario no puede reconstruir folios que nunca tuvo. Error de competencia.", "tipo": "competencia"}, {"t": "La diferencia es menor frente al total y puede suplirse con el índice del sistema, que basta para acreditar los documentos.", "j": "Es incorrecta. Es plausible porque el índice describe los 23 documentos, pero una referencia descriptiva sin imagen no equivale al documento; la Ley 594 de 2000, art. 4, exige que la información misma sea recuperable, no solo su registro. Error de granularidad.", "tipo": "granularidad"}, {"t": "Faltan 23 folios inventariados; deben ubicarse con base en el inventario para que el expediente sea recuperable antes de remitirlo.", "j": "Es correcta. La Ley 594 de 2000, art. 26, exige inventarios que aseguren el control de los documentos en sus diferentes fases, y el inventario de cierre prueba que los folios 390 a 412 existían. El art. 4 fija como objetivo que la información sea recuperable para uso de la administración, y la defensa judicial necesita las pruebas del recurso completas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M097", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 26", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#26", "fecha": "2026-10-24"}, {"fila": "M093", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 4", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#4", "fecha": "2026-10-24"}]}, {"id": "C-E06-005-1", "caso_id": "C-E06-005", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Constitución Política de Colombia, art. 363", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Valentina Ortiz, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa en noviembre de 2025 la declaración de un impuesto nacional de período mensual presentada por Industrias Épsilon S.A. para septiembre de 2025, con una base gravable de 2.000 UVT. Una ley publicada el 14 de octubre de 2025 elevó la tarifa de ese impuesto del 4 % al 6 % y no fijó regla de transición. Un memorando de la Dirección Seccional fechado el 20 de octubre recomienda aplicar la tarifa del 6 % a todos los períodos de 2025 para uniformar las liquidaciones. La empresa declaró y pagó con la tarifa del 4 %. Valentina debe decidir qué tarifa usar en la liquidación del período de septiembre antes de proyectar un emplazamiento para corregir.", "enunciado": "¿Qué tarifa debe aplicar Valentina al período de septiembre y con qué fundamento?", "opciones": [{"t": "La del 6 %, porque la Dirección Seccional puede definir mediante memorando la tarifa aplicable a los contribuyentes de su jurisdicción.", "j": "Es incorrecta. Es plausible porque la seccional imparte instrucciones internas de trabajo a sus servidores. Falla porque la Constitución Política, art. 338, exige que la ley fije directamente las tarifas de los impuestos; un memorando no tiene esa competencia. Error de competencia.", "tipo": "competencia"}, {"t": "La del 6 %, porque el principio de eficiencia del sistema tributario permite unificar en un mismo año la tarifa de todos los períodos.", "j": "Es incorrecta. Resulta plausible porque la uniformidad facilita la gestión y la eficiencia es un principio del sistema (Constitución Política, art. 363). Falla porque el mismo artículo prohíbe aplicar las leyes tributarias con retroactividad, y septiembre es anterior a la ley. Error de norma.", "tipo": "norma"}, {"t": "La del 4 %, porque la ley tributaria no se aplica con retroactividad y un memorando no puede fijar la tarifa de un impuesto.", "j": "Es correcta. La Constitución Política, art. 363, dispone que las leyes tributarias no se aplicarán con retroactividad, y el art. 338 reserva a la ley fijar directamente las tarifas de los impuestos. El período de septiembre es anterior a la publicación de la ley, y el memorando de la seccional carece de aptitud para modificar la tarifa.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M090", "norma": "Constitución Política de Colombia", "articulo": "art. 363", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#363", "fecha": "2026-10-24"}, {"fila": "M091", "norma": "Constitución Política de Colombia", "articulo": "art. 338", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#338", "fecha": "2026-10-24"}]}, {"id": "C-E01-008-1", "caso_id": "C-E01-008", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Sergio Luna, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, apoya la consolidación del informe de gestión sobre denuncias del primer trimestre de 2026. Entre enero y marzo se radicaron 86 denuncias: 51 por evasión, 22 por contrabando, 9 por presunto lavado de activos y 4 por corrupción; 70 ya fueron direccionadas y 16 siguen en precrítica al cierre del trimestre. Una circular del Director General fija un formato único y un plazo de diez días hábiles después del cierre de cada trimestre para estos informes. El director seccional prefiere un informe semestral en formato propio, con el argumento de que reduce la carga del equipo. Sergio debe entregar el borrador el 8 de abril y anexar la trazabilidad de los radicados de cada denuncia en el expediente electrónico.", "enunciado": "¿Cómo debe Sergio estructurar la entrega del informe para cumplir la regla que rige estos reportes?", "opciones": [{"t": "Con el formato único y el plazo trimestral del Director General, e incluir las denuncias direccionadas y las que siguen en precrítica.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 33, ordena presentar «los informes periódicos de su gestión en la forma y oportunidad que establezca el Director General», y el numeral 3 del mismo artículo define esa gestión como recibir, clasificar y direccionar las denuncias. El consolidado trimestral, en el formato de la circular, recoge las 86 denuncias del periodo: 70 direccionadas y 16 en clasificación.", "tipo": null}, {"t": "Con el formato y el plazo trimestral del Director General, con las 70 denuncias direccionadas, y las demás en el informe siguiente.", "j": "Es incorrecta. Es plausible porque acoge la forma y la oportunidad que fijó el Director General y reporta lo que ya tiene un resultado. Falla porque el Decreto 1742 de 2020, artículo 33, exige informes periódicos «de su gestión», y esa gestión comprende recibir, clasificar y direccionar las denuncias (numeral 3); las 16 que siguen en precrítica ya fueron recibidas en el trimestre y su clasificación está en curso, de modo que aplazarlas confunde la etapa del trámite con el periodo del informe. Error de fase.", "tipo": "fase"}, {"t": "Con el formato único del Director General, pero con corte semestral, porque así lo dispuso el director seccional para su jurisdicción.", "j": "Es incorrecta. Es plausible porque respeta el formato de la circular y atiende la preferencia del director seccional, que dirige la gestión en su territorio. Falla porque el Decreto 1742 de 2020, artículo 33, remite al Director General tanto la forma como la «oportunidad» de los informes; la circular fijó un plazo trimestral, y el corte semestral acoge la forma y omite la oportunidad. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M059", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E07-003-1", "caso_id": "C-E07-003", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 684", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "La Gestor II Paula Cifuentes, de la división de fiscalización y liquidación de una Dirección Seccional, recibe dos insumos para clasificar en el plan de fiscalización de 2026. Ambos provienen de los cruces de la información exógena del año gravable 2024 que los terceros reportaron a la DIAN. En el primero, varios clientes reportaron pagos por 1.920 millones de pesos a Transportes Montaña Azul S.A.S., que no presentó declaración de renta por ese año aunque figura en el RUT como responsable del impuesto. En el segundo, Ferretería La Esquina S.A.S. declaró ingresos por 3.050 millones de pesos, mientras sus clientes reportaron compras por 3.870 millones. La coordinación pide clasificar cada insumo según la facultad del artículo 684 del Estatuto Tributario que sustenta la apertura, antes del comité de programación del 15 de abril de 2026, sin pronunciarse aún sobre sanciones.", "enunciado": "Decida la clasificación que debe presentarse al comité de programación para cada uno de los dos insumos.", "opciones": [{"t": "Ambos se clasifican como verificación de la exactitud de lo declarado, porque los dos provienen de cruces de información con terceros del mismo año.", "j": "Es incorrecta. Es plausible porque los dos insumos nacen de cruces de información del Estatuto Tributario, art. 631, pero el art. 684 distingue entre verificar la exactitud de las declaraciones (literal a) y establecer hechos generadores no declarados (literal b); Transportes Montaña Azul no presentó declaración, así que no hay exactitud que verificar. Error de granularidad: clasifica por el origen del dato y no por la facultad.", "tipo": "granularidad"}, {"t": "El de Transportes Montaña Azul va a investigación de hechos no declarados y el de Ferretería La Esquina se archiva por la presunción de veracidad.", "j": "Es incorrecta. Clasifica bien el primer insumo, pero la presunción de veracidad no impide que la Administración, según el Estatuto Tributario, art. 684, literal a, verifique la exactitud de las declaraciones cuando lo considere necesario; la diferencia de 820 millones frente a lo reportado por terceros justifica esa verificación. Error de norma: usa el art. 746 como causal de archivo.", "tipo": "norma"}, {"t": "El de Transportes Montaña Azul va a investigación de hechos no declarados y el de Ferretería La Esquina a verificación de la exactitud de lo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 684, literal b, faculta para adelantar investigaciones que establezcan hechos generadores no declarados, caso de la sociedad que no presentó declaración pese a recibir pagos; el literal a faculta para verificar la exactitud de las declaraciones, caso de la ferretería que declaró ingresos inferiores a lo reportado. Los cruces de información del art. 631 sustentan ambos insumos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}, {"fila": "M003", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 631", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#631", "fecha": "2026-10-24"}]}, {"id": "C-E07-005-1", "caso_id": "C-E07-005", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Aplicar", "fuente": "Decreto 1165 de 2019, art. 591", "integra": ["IMPOSICION DE SANCIONES"], "caso": "La Gestor II Natalia Ruiz, de la división de fiscalización y liquidación de una Dirección Seccional, participa el 9 de septiembre de 2026 en una visita de control a la bodega de Comercial Fronteriza del Sur S.A.S. Allí se hallan 1.240 pares de calzado deportivo de origen extranjero, con avalúo preliminar de 310 millones de pesos. La sociedad exhibe dos declaraciones de importación que amparan 800 pares; para los 440 restantes presenta una factura de compra a un proveedor local que no menciona declaración de importación alguna. El representante legal sostiene que la diferencia es un error de inventario y pide cerrar la diligencia sin más trámite. El acta debe dejar delimitado el objeto de la investigación que se abrirá respecto de los 440 pares, sin anticipar la sanción aplicable ni la liquidación de tributos, que se definirán en etapas posteriores del procedimiento.", "enunciado": "Decida cómo debe delimitarse en el acta el objeto de la investigación sobre los pares sin respaldo.", "opciones": [{"t": "Determinar si los 440 pares causaron tributos aduaneros que no se declararon ni pagaron y si configuran una infracción o una causal de decomiso.", "j": "Es correcta. El Decreto 1165 de 2019, art. 591, numeral 2, faculta para adelantar investigaciones que establezcan la ocurrencia de hechos generadores de obligaciones aduaneras no declaradas o no satisfechas, o de hechos constitutivos de infracción o decomiso. Los 440 pares sin declaración que los ampare, respaldados solo por una factura local, encajan en ambos supuestos, y el acta debe dejarlos abiertos sin anticipar sanción ni liquidación.", "tipo": null}, {"t": "Determinar si los 440 pares causaron tributos aduaneros que no se declararon ni pagaron, y reservar la infracción o el decomiso para cuando se liquide la deuda.", "j": "Es incorrecta. Es plausible porque la falta de declaración sugiere tributos no pagados, pero el Decreto 1165 de 2019, art. 591, numeral 2, incluye en el mismo objeto de investigación la ocurrencia de hechos constitutivos de infracción o decomiso, sin supeditarla a una liquidación previa. Error de completitud: recorta el objeto de la investigación.", "tipo": "completitud"}, {"t": "Determinar si los 440 pares configuran contrabando para remitirlos a la autoridad penal, sin abrir investigación aduanera mientras curse esa actuación.", "j": "Es incorrecta. Parece prudente ante un posible ilícito, pero el Decreto 1165 de 2019, art. 591, numeral 2, radica en la DIAN la investigación de hechos generadores no declarados y de hechos constitutivos de infracción o decomiso; un eventual traslado a la autoridad penal no sustituye esa función. Error de competencia: desplaza la actuación aduanera a otra autoridad.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M016", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E01-009-1", "caso_id": "C-E01-009", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Camila Torres, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa el 6 de abril de 2026 el expediente de Equipos Médicos Sigma S.A.S. En control posterior se encontró que la declaración de importación del 14 de julio de 2025, por 3.600 UVT, clasificó los equipos en una subpartida con menor tributo aduanero. En la misma revisión se verificó que el pago al proveedor, por USD 210.000, se hizo desde una cuenta en el exterior sin canalizarlo por el mercado cambiario. El proyecto de acto que circula en la división propone una sola actuación aduanera que cubra los dos hechos, para ahorrar tiempo antes de que venza en julio el término de la fiscalización aduanera. Camila debe dar visto bueno al proyecto o devolverlo con observaciones antes del comité del 10 de abril.", "enunciado": "¿Qué decisión debe sustentar Camila frente al proyecto de actuación única?", "opciones": [{"t": "Devolverlo, porque la reclasificación se sanciona en el control aduanero y el pago no canalizado, en el control cambiario de la entidad.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 30, numeral 1, refiere el control posterior a las infracciones a los regímenes aduaneros y a sus sanciones y liquidaciones, mientras el artículo 31, numeral 1, asigna la investigación, determinación y sanción «por violación al régimen cambiario de competencia de la Entidad». La subpartida y el pago no canalizado infringen regímenes distintos y se tramitan por separado.", "tipo": null}, {"t": "Devolverlo para remitir los dos hechos al control cambiario, porque el pago al exterior define la naturaleza de toda la operación.", "j": "Es incorrecta. Es plausible porque acierta en que el pago no canalizado es materia cambiaria. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, mantiene en el control posterior aduanero la determinación y sanción de la reclasificación arancelaria; enviar ambos hechos al control cambiario traslada una infracción aduanera a una función que no la cubre. Error de competencia.", "tipo": "competencia"}, {"t": "Aprobarlo, porque el control posterior aduanero comprende las sanciones y liquidaciones sobre los hechos de la misma operación de importación.", "j": "Es incorrecta. Es plausible porque los dos hechos provienen de la misma importación y el control posterior incluye sanciones y liquidaciones. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, limita esas sanciones a las infracciones al régimen aduanero; la falta de canalización viola el régimen cambiario, cuya sanción corresponde a la función del artículo 31, numeral 1. Error de completitud.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M087", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}, {"fila": "M086", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 30", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#30", "fecha": "2026-10-24"}]}, {"id": "C-E08-009-1", "caso_id": "C-E08-009", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Para el programa de control cambiario del próximo semestre, una Dirección Seccional dispone de capacidad operativa para ochenta casos. El análisis de riesgo entrega tres bolsas: cincuenta y dos exportadores con indicios de sobrefacturación por USD 18 millones y gastos asociados no soportados; dieciocho empresas con financiación en moneda extranjera de importaciones sin registro, por USD 6 millones; y nueve expedientes aduaneros de valoración en los que la liquidación oficial de revisión está en discusión ante el superior. El acta del comité del 14 de noviembre pide que el programa delimite el objeto cambiario. El Gestor II responsable de la planeación debe valorar qué operaciones entran en el programa y sustentar la decisión ante el comité.", "enunciado": "¿Qué decisión de programación debe sustentar el Gestor II ante el comité?", "opciones": [{"t": "Programar la financiación en moneda extranjera de importaciones y dejar la sobrefacturación de exportaciones al control aduanero de valor, por su naturaleza.", "j": "Es incorrecta. Resulta plausible porque la sobrefacturación también interesa al control del valor, pero el Decreto 1742 de 2020, art. 31, numeral 2, incluye la sobrefacturación de esas operaciones en el control cambiario de la Entidad. Error de competencia.", "tipo": "competencia"}, {"t": "Programar la sobrefacturación de exportaciones con sus gastos asociados y la financiación en moneda extranjera de importaciones sin registro.", "j": "Es correcta. El Decreto 1742 de 2020, art. 31, numeral 2, asigna la planeación y el control de las actividades del régimen cambiario en importación y exportación de bienes y servicios, los gastos asociados, la financiación en moneda extranjera y la sobrefacturación de esas operaciones.", "tipo": null}, {"t": "Posponer la programación cambiaria hasta que las nueve liquidaciones oficiales de revisión queden en firme y fijen los valores reales de las operaciones.", "j": "Es incorrecta. Resulta plausible porque los valores en discusión alimentarían el análisis de riesgo, pero el Decreto 1742 de 2020, art. 31, numeral 2, ordena planear y controlar las actividades cambiarias sin subordinarlas a la firmeza de actos aduaneros. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M057", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}]}, {"id": "C-E11-007-1", "caso_id": "C-E11-007", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestora II Natalia Prieto, de la División de Fiscalización y Liquidación de una Dirección Seccional, analiza un insumo sobre Inmobiliaria Cerros del Valle S.A.S. En febrero de 2025 la sociedad vendió un lote a su vinculada Proyectos Arrayán S.A.S. por $1.800.000.000, cuando el avalúo comercial vigente era de $3.000.000.000. Cincuenta días después, Proyectos Arrayán revendió el lote a un tercero independiente por $3.050.000.000 y compensó la ganancia con pérdidas fiscales acumuladas. Las dos sociedades tienen los mismos accionistas y el expediente no registra una razón comercial distinta de la reducción del impuesto. Cada venta, examinada por separado, cuenta con escritura pública y pago bancario. La investigación está en la etapa de fiscalización, antes de cualquier acto de determinación, y la División debe fijar la línea de la propuesta.", "enunciado": "Evalúe el hallazgo y decida el enfoque que debe sustentar la propuesta de la División.", "opciones": [{"t": "Remitir el insumo a la autoridad penal como posible lavado de activos y suspender la actuación tributaria de la División.", "j": "Es incorrecta. Resulta plausible porque las operaciones entre vinculadas con precios atípicos son señales de alerta que también se analizan en materia de lavado de activos. Sin embargo, el hallazgo describe un menor impuesto mediante una serie de operaciones, que el Estatuto Tributario, art. 869, asigna a la Administración Tributaria para recaracterizar. Error de competencia: traslada a otra autoridad un asunto de la División.", "tipo": "competencia"}, {"t": "Examinar las dos ventas como una serie que puede constituir abuso y proponer su recaracterización y la pérdida de efectos.", "j": "Es correcta. El Estatuto Tributario, art. 869, permite a la Administración 'recaracterizar o reconfigurar toda operación o serie de operaciones que constituya abuso en materia tributaria y, consecuentemente, desconocer sus efectos'. La venta a una vinculada muy por debajo del avalúo, la reventa a valor de mercado en cincuenta días, la compensación con pérdidas y la ausencia de razón comercial se valoran en conjunto, con las facultades del art. 684.", "tipo": null}, {"t": "Examinar cada venta por separado y archivar el insumo, porque las dos tienen escritura pública y pago bancario.", "j": "Es incorrecta. Es plausible porque cada venta, vista aislada, cumple las formalidades y tiene soporte. Sin embargo, el Estatuto Tributario, art. 869, se refiere a la 'serie de operaciones' y permite desconocer sus efectos aunque cada paso sea formalmente válido. Error de granularidad: analiza cada transacción y pierde de vista la serie que produce el beneficio.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M011", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869", "fecha": "2026-10-24"}, {"fila": "M007", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}]}, {"id": "C-E02-007-1", "caso_id": "C-E02-007", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Ley 1437 de 2011, art. 36", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional de Impuestos. Adelanta una investigación a Importadora Costa Azul S.A.S. por el impuesto sobre la renta de 2023, con requerimiento ordinario notificado el 4 de agosto de 2025. El 9 de septiembre recibe, por error de reparto, una caja con 63 folios de un proceso de aprehensión de mercancías contra la misma sociedad, adelantado por la división de fiscalización aduanera de otra Dirección Seccional. Un compañero propone intercalar esos folios por fecha en el expediente tributario, pues ambos asuntos tocan a la misma sociedad y podrían servir como prueba de ingresos omitidos. El expediente tributario tiene 210 folios y está en revisión de la respuesta al requerimiento, radicada el 2 de septiembre.", "enunciado": "Diagnostique si la propuesta del compañero es procedente y sustente por qué.", "opciones": [{"t": "Es procedente, porque ambos asuntos se refieren a la misma sociedad y su reunión en un solo expediente evita decisiones contradictorias.", "j": "Es incorrecta. Es plausible porque invoca la finalidad de la Ley 1437 de 2011, art. 36, pero omite sus condiciones: la acumulación procede para una misma actuación o para expedientes tramitados ante la misma autoridad, y aquí se trata de un proceso aduanero de otra Seccional. Error de completitud.", "tipo": "completitud"}, {"t": "Es procedente si la ordena el jefe de su división, pues él puede acumular expedientes que tramiten otras Direcciones Seccionales.", "j": "Es incorrecta. Es plausible porque la acumulación puede decretarse de oficio, pero la Ley 1437 de 2011, art. 36, la limita a expedientes que se tramiten ante la misma autoridad; el jefe de una división no dispone de actuaciones de otra Seccional. Error de competencia.", "tipo": "competencia"}, {"t": "No es procedente: la acumulación exige trámite ante la misma autoridad y los folios deben volver a la dependencia que los produjo.", "j": "Es correcta. La Ley 1437 de 2011, art. 36, permite acumular solo los expedientes de una misma actuación o que se tramiten ante la misma autoridad, y la Ley 594 de 2000, art. 11, exige organizar los archivos según los principios de procedencia y orden original. Los 63 folios pertenecen al archivo de la Seccional aduanera que los produjo.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M043", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-24"}, {"fila": "M094", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 11", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#11", "fecha": "2026-10-24"}]}, {"id": "C-E01-007-1", "caso_id": "C-E01-007", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 28", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "Diana Castro, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, ejecuta un programa de fiscalización de ingresos de personas naturales y está en etapa de investigación. El 10 de marzo de 2026 cruza la información exógena de Hernán Vélez: declaró ingresos por 1.100 UVT en el año gravable 2024, pero recibió 47 consignaciones en efectivo, fraccionadas por debajo del umbral de reporte, que suman cerca de 9.000 UVT en cuentas de cuatro ciudades. Dos de las consignaciones provienen de una sociedad sin actividad económica registrada. El auto de apertura está vigente y el emplazamiento para corregir se enviaría el 25 de marzo. Su coordinador sugiere esperar el cierre de la investigación tributaria para evaluar después si los hechos interesan a otra dependencia o autoridad.", "enunciado": "¿Qué diagnóstico debe sustentar Diana sobre el manejo de las consignaciones detectadas?", "opciones": [{"t": "Concluir primero la investigación tributaria y, con la liquidación en firme, poner los hechos en conocimiento de la dependencia competente.", "j": "Es incorrecta. Es plausible porque el programa en curso tiene un objeto tributario y un cronograma definido, y el coordinador propone ordenar los tiempos. Falla porque el Decreto 1742 de 2020, artículo 28, numeral 6, concibe los planes y programas de fiscalización como instrumentos que «permitan detectar operaciones sospechosas relacionadas con el lavado de activos»; esa detección ocurre dentro de la ejecución del programa, no después de su cierre, y diferir el traslado hasta la firmeza de la liquidación la convierte en un asunto posterior y ajeno al programa. Error de fase.", "tipo": "fase"}, {"t": "Limitar el análisis al impuesto sobre la renta, porque el programa se diseñó para verificar obligaciones tributarias y no otras conductas.", "j": "Es incorrecta. Es plausible porque el programa nació para verificar ingresos declarados. Falla porque el Decreto 1742 de 2020, artículo 28, numeral 6, define los planes y programas de fiscalización como destinados a verificar obligaciones tributarias, aduaneras y cambiarias «o que permitan detectar operaciones sospechosas relacionadas con el lavado de activos»; esa detección forma parte de su objeto. Error de competencia.", "tipo": "competencia"}, {"t": "Tratar el fraccionamiento como hallazgo del programa y trasladarlo a la dependencia competente sin esperar el cierre de la investigación.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 28, numeral 6, define los planes y programas de fiscalización como destinados a determinar el cumplimiento de las obligaciones tributarias, aduaneras y cambiarias «o que permitan detectar operaciones sospechosas relacionadas con el lavado de activos». Las consignaciones fraccionadas bajo el umbral de reporte y los aportes de una sociedad sin actividad son un hallazgo de ese tipo, obtenido en la ejecución del programa; se trasladan a la dependencia competente mientras la investigación tributaria continúa.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#28", "fecha": "2026-10-24"}]}, {"id": "C-E08-007-1", "caso_id": "C-E08-007", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 31", "integra": ["LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "En la investigación cambiaria de la sociedad Fletes y Carga Oriental S. A. S., el Gestor II concluye el 10 de octubre que trece declaraciones de cambio fueron presentadas con documentos soporte aparentemente alterados y que tres facturas de proveedor del exterior corresponden a una empresa inexistente, según el cruce con información del país de origen. El monto canalizado asciende a USD 2.100.000 en catorce meses. El expediente está listo para la formulación de cargos y el programa de control registra la operación como prioritaria. El jefe de división advierte que los hechos podrían configurar también una conducta punible y que la Seccional carece de competencia para valorarla. El Gestor II debe recomendar cómo manejar los dos frentes sin afectar los términos de la actuación cambiaria en curso.", "enunciado": "¿Qué manejo de los dos frentes debe recomendar el Gestor II al jefe de división?", "opciones": [{"t": "Calificar la conducta punible en el pliego de cargos cambiario y pedir en el mismo acto la sanción penal de los representantes de la sociedad.", "j": "Es incorrecta. Resulta plausible porque los hechos surgen del mismo expediente, pero el Decreto 1742 de 2020, art. 31, numeral 1, limita la actuación de la Entidad a las sanciones por violación al régimen cambiario y prevé el reporte de los hechos penales. Error de competencia.", "tipo": "competencia"}, {"t": "Suspender la investigación cambiaria hasta que la autoridad penal defina la responsabilidad de los representantes y devuelva el expediente a la Seccional.", "j": "Es incorrecta. Resulta plausible por el riesgo de decisiones contradictorias, pero el Decreto 1742 de 2020, art. 31, numeral 1, mantiene en la Entidad la investigación y liquidación de las sanciones cambiarias. Error de fase.", "tipo": "fase"}, {"t": "Reportar al área o a la entidad competente los hechos que dan lugar a la acción penal y continuar la investigación cambiaria con los términos en curso.", "j": "Es correcta. El Decreto 1742 de 2020, art. 31, numeral 1, ordena reportar, cuando sea del caso, al área o a la entidad competente los hechos detectados que den lugar al inicio de la acción penal, sin desplazar la determinación de las sanciones cambiarias.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M087", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 31", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#31", "fecha": "2026-10-24"}]}, {"id": "C-E07-009-1", "caso_id": "C-E07-009", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 782", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "La Gestor II Mariana Quintero, de la división de fiscalización y liquidación de una Dirección Seccional, verifica obligaciones formales de Servicios Hoteleros Bahía Clara S.A.S. en el impuesto sobre las ventas de 2025. El expediente electrónico registra que la sociedad presentó las seis declaraciones bimestrales del año, pero el sistema de facturación electrónica muestra 1.430 documentos emitidos frente a 1.190 registrados en los libros auxiliares aportados el 17 de febrero de 2026. La sociedad está obligada a llevar contabilidad y sus libros están registrados. El auditor interno propone resolver el hallazgo con un simple cotejo de los archivos descargados del sistema, sin diligencia alguna sobre los libros, y dejar constancia en el expediente. La actuación está en investigación, el término de firmeza no se encuentra próximo y aún no se ha ordenado prueba alguna.", "enunciado": "Evalúe la propuesta del auditor interno y sustente la diligencia que corresponde ordenar.", "opciones": [{"t": "Es insuficiente: corresponde ordenar inspección contable a la sociedad, pues está obligada a llevar contabilidad y se verifica la exactitud de lo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 782, permite ordenar la práctica de la inspección contable al contribuyente obligado a llevar contabilidad para verificar la exactitud de las declaraciones y el cumplimiento de obligaciones formales, que es justo lo que exige la diferencia de 240 documentos. El art. 779 sustenta la actuación probatoria en esta etapa de investigación.", "tipo": null}, {"t": "Es suficiente, porque los archivos del sistema de facturación tienen mérito probatorio pleno y hacen innecesaria cualquier diligencia sobre la contabilidad.", "j": "Es incorrecta. Es plausible porque esos archivos provienen de un sistema institucional, pero el hallazgo consiste en una diferencia con los libros, y el Estatuto Tributario, art. 782, prevé la inspección contable al contribuyente obligado a llevar contabilidad para verificar la exactitud de las declaraciones y el cumplimiento de obligaciones formales. Error de granularidad: sustituye el examen de los libros por el cotejo de un extracto.", "tipo": "granularidad"}, {"t": "Es insuficiente, pero la diligencia que corresponde es la inspección tributaria sobre terceros clientes, ya que los libros de la investigada están registrados.", "j": "Es incorrecta. Acierta en negar la suficiencia del cotejo, pero el registro de los libros no impide examinarlos: el Estatuto Tributario, art. 782, autoriza la inspección contable al contribuyente para verificar el cumplimiento de obligaciones formales. Error de competencia: dirige la diligencia a terceros y deja intacta la contabilidad cuestionada.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M010", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 782", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#782", "fecha": "2026-10-24"}, {"fila": "M009", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 779", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#779", "fecha": "2026-10-24"}]}, {"id": "C-E03-002-1", "caso_id": "C-E03-002", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 638", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Mauricio Acosta, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, revisa el expediente de Agroinsumos La Pradera S.A.S. por su declaración de renta del año gravable 2022, presentada en término el 18 de abril de 2023. El requerimiento especial propuso adicionar ingresos por 620 millones de pesos e imponer la sanción por inexactitud. El término para practicar la liquidación oficial de revisión está vigente porque estuvo suspendido durante una inspección tributaria documentada en el expediente. El 20 de octubre de 2026 un abogado del grupo sostiene que la sanción ya no puede imponerse, pues pasaron más de tres años desde la presentación de la declaración y, a su juicio, rige la caducidad general de la facultad sancionatoria. El proyecto de liquidación debe pasar a firma esta semana.", "enunciado": "Sustente qué término gobierna la facultad para imponer la sanción propuesta en este proyecto.", "opciones": [{"t": "El término de tres años contados desde la conducta, propio de la caducidad sancionatoria general.", "j": "Es incorrecta. Es plausible porque el art. 52 de la Ley 1437 de 2011 fija una caducidad de tres años, pero esa regla opera salvo lo dispuesto en leyes especiales, y el art. 638 del Estatuto Tributario regula de forma especial la sanción impuesta en la liquidación oficial (error de norma).", "tipo": "norma"}, {"t": "El mismo término que existe para practicar la liquidación oficial, porque la sanción se impone en ella.", "j": "Es correcta. El art. 638 del Estatuto Tributario establece que, cuando las sanciones se imponen en liquidaciones oficiales, la facultad para imponerlas prescribe en el mismo término que existe para practicar la respectiva liquidación oficial; si ese término sigue vigente por la suspensión documentada, la sanción puede incluirse.", "tipo": null}, {"t": "Un término nuevo que empieza a correr con la notificación del acto que decida de fondo la determinación del impuesto.", "j": "Es incorrecta. Resulta plausible ligar la sanción al acto de determinación, pero el art. 638 del Estatuto Tributario no hace correr un término nuevo desde esa notificación; la facultad se mide con el mismo término previsto para practicar la liquidación oficial, que transcurre antes de expedirla (error de fase).", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M064", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 638", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#638", "fecha": "2026-10-24"}, {"fila": "M076", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 52", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#52", "fecha": "2026-10-24"}]}, {"id": "C-E08-006-1", "caso_id": "C-E08-006", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Analizar", "fuente": "Decreto Ley 2245 de 2011, art. 9", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "El 3 de septiembre un Gestor II recibe el expediente cambiario de la sociedad Agroexportadora del Sinú S. A. S., abierto por un informe de tercero que afirma el pago de gastos asociados a exportaciones por USD 320.000 sin declaración de cambio. El expediente contiene dos extractos de una cuenta del exterior sin identificación del titular, una relación de cinco facturas elaborada por el informante y un acta de reparto del 1 de septiembre. No hay respuesta al requerimiento ordinario enviado en julio, ni cruce con los registros de exportación de la Entidad, ni visita administrativa practicada. El programa de auditoría aprobado prevé cuatro semanas de ejecución y el término de la actuación apenas comienza. El coordinador pregunta cuál es la siguiente actuación procedente y pide que se sustente con la facultad aplicable.", "enunciado": "¿Qué actuación debe sustentar el Gestor II como paso siguiente en el expediente?", "opciones": [{"t": "Archivar la investigación porque los extractos del informante no identifican al titular de la cuenta ni acreditan el monto de las operaciones.", "j": "Es incorrecta. Resulta plausible por la debilidad de la prueba allegada, pero el Decreto Ley 2245 de 2011, art. 9, numeral 1, permite completar la investigación con diligencias propias antes de cerrar el asunto. Error de completitud.", "tipo": "completitud"}, {"t": "Formular los cargos con la información que reposa en el expediente y esperar que el investigado aporte en su respuesta los soportes faltantes.", "j": "Es incorrecta. Resulta plausible porque la respuesta del investigado también aporta pruebas, pero el Decreto Ley 2245 de 2011, art. 9, numeral 1, prevé la comprobación previa de los hechos; sin ella los cargos carecen de respaldo probatorio. Error de fase.", "tipo": "fase"}, {"t": "Adelantar las diligencias, pesquisas y averiguaciones necesarias para comprobar los hechos, con visita administrativa y cruce de registros.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 9, numeral 1, faculta para adelantar toda clase de diligencias, pesquisas y averiguaciones que se estimen necesarias a fin de comprobar la existencia de hechos constitutivos de violación de las disposiciones vigiladas.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M023", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 9", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#9", "fecha": "2026-10-24"}]}, {"id": "C-E08-002-1", "caso_id": "C-E08-002", "caso_pos": 1, "caso_n": 1, "eje": "NORMATIVA CAMBIARIA", "bloom": "Aplicar", "fuente": "Decreto Ley 2245 de 2011, art. 3", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "En una investigación cambiaria, el Gestor II verifica que la sociedad Textiles del Río Grande S. A. S. canalizó seis pagos de importación entre el 4 de febrero y el 30 de junio por un total de USD 1.250.000. Del cruce entre los formularios recibidos, los registros de la Entidad y los soportes aportados en la visita administrativa del 11 de agosto resulta que tres declaraciones de cambio quedaron con el número de identificación del beneficiario del exterior equivocado y con un código de operación que no corresponde al documento soporte; las otras tres coinciden con sus facturas. La sociedad corrigió los datos en su contabilidad, pero no reemplazó los formularios ante la entidad vigilada. El intermediario certificó que, según el régimen cambiario, esos datos no admitían modificación posterior de la declaración. El pliego de cargos está en preparación y el coordinador pide la liquidación de la multa que corresponde a los hechos probados.", "enunciado": "¿Qué liquidación de la multa debe proponer el Gestor II por los hechos probados en el expediente?", "opciones": [{"t": "Una multa de 150 UVT, esto es, 25 UVT por cada uno de los dos datos equivocados en cada una de las tres declaraciones de cambio.", "j": "Es incorrecta. Resulta plausible porque cada declaración presenta dos datos errados, el beneficiario y el código de operación, pero el Decreto Ley 2245 de 2011, art. 3, numeral 1, fija la multa de 25 UVT por cada declaración y no por cada dato equivocado. Error de granularidad.", "tipo": "granularidad"}, {"t": "Ninguna multa, porque la corrección de los datos en la contabilidad de la sociedad subsana los formularios de cambio presentados.", "j": "Es incorrecta. Resulta plausible porque la sociedad sí depuró su información interna, pero el Decreto Ley 2245 de 2011, art. 3, numeral 1, sanciona la presentación de la declaración de cambio con datos equivocados; la corrección contable no reemplaza el formulario y el intermediario certificó que esos datos no admitían modificación posterior. Error de completitud.", "tipo": "completitud"}, {"t": "Una multa de 75 UVT, esto es, 25 UVT por cada una de las tres declaraciones de cambio presentadas con datos equivocados.", "j": "Es correcta. El Decreto Ley 2245 de 2011, art. 3, numeral 1, impone multa de veinticinco (25) UVT por cada declaración presentada con datos equivocados; probadas tres declaraciones con el beneficiario y el código errados, cuya modificación posterior no admitía el régimen según la certificación del intermediario, la liquidación asciende a 75 UVT.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M024", "norma": "Decreto Ley 2245 de 2011 (régimen sancionatorio y procedimiento administrativo cambiario DIAN)", "articulo": "art. 3", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_2245_2011.htm#3", "fecha": "2026-10-24"}]}, {"id": "C-E10-003-1", "caso_id": "C-E10-003", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), arts. 703 y 704", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "El Gestor II Ocampo revisa, en la división de fiscalización y liquidación, el proyecto de requerimiento especial dirigido a Distribuidora Pacífico S.A.S. por el impuesto sobre las ventas del tercer bimestre de 2023. El proyecto propone desconocer impuestos descontables por 2.600 UVT y explica las razones del rechazo, pero no expresa en cifras el mayor impuesto ni la sanción que se pretende adicionar a la liquidación privada. Durante la revisión aparece un hallazgo adicional: ingresos gravados no declarados por 1.400 UVT, detectados el 9 de mayo de 2026 en el cruce con facturación electrónica. El plazo para declarar de ese bimestre venció el 18 de julio de 2023 y el expediente no registra requerimiento especial notificado. El coordinador propone enviar el proyecto como está y, cuando se consolide el nuevo hallazgo, remitir un segundo requerimiento especial por ese punto.", "enunciado": "Sustente qué ajuste exige el proyecto antes de su notificación al responsable del impuesto.", "opciones": [{"t": "Notificar el proyecto con las razones expuestas y reservar la cuantificación para la liquidación de revisión, que es el acto que fija las sumas.", "j": "Es incorrecta. Tiene asidero porque la liquidación concreta las sumas a cargo, pero el art. 704 del Estatuto Tributario exige que el propio requerimiento contenga la cuantificación de impuestos, anticipos, retenciones y sanciones. Error de granularidad.", "tipo": "granularidad"}, {"t": "Incorporar el hallazgo de ingresos no declarados y la cuantificación del mayor impuesto y de la sanción, en un solo requerimiento.", "j": "Es correcta. El art. 703 del Estatuto Tributario ordena enviar por una sola vez un requerimiento con todos los puntos que se proponga modificar y el art. 704 exige la cuantificación de impuestos, anticipos, retenciones y sanciones que se pretende adicionar a la liquidación privada.", "tipo": null}, {"t": "Notificar el proyecto actual y remitir luego un segundo requerimiento especial con el hallazgo de ingresos no declarados que se consolide.", "j": "Es incorrecta. Es plausible porque el hallazgo apareció durante la revisión, pero el art. 703 del Estatuto Tributario permite enviar el requerimiento especial por una sola vez y con todos los puntos que se proponga modificar. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M033", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 703", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#703", "fecha": "2026-10-24"}, {"fila": "M034", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 704", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#704", "fecha": "2026-10-24"}]}, {"id": "C-E05-010-1", "caso_id": "C-E05-010", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 691", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Ricardo Salas, Gestor II de fiscalización de una Dirección Seccional cuya estructura separa la Unidad de Fiscalización y la Unidad de Liquidación, adelanta la investigación del impuesto de renta del año gravable 2022 de Minera Kappa S.A. El requerimiento especial, firmado por el jefe de la Unidad de Fiscalización, se notificó en marzo de 2026, y el contribuyente lo respondió en junio con soportes que revelan pagos al exterior por 1.900 millones de pesos no examinados en la auditoría. Con base en esa respuesta, el Gestor proyecta una ampliación al requerimiento especial. El jefe de la Unidad de Fiscalización solicita que el proyecto vuelva a su despacho para firmarlo, porque fue él quien suscribió el requerimiento inicial. La coordinadora pide verificar la dependencia competente antes de enviar el proyecto a firma y registrar el reparto en el expediente.", "enunciado": "Determine quién debe proferir el acto proyectado y sustente su decisión.", "opciones": [{"t": "El jefe de la Unidad de Fiscalización, porque quien profirió el requerimiento especial debe suscribir su ampliación.", "j": "Es incorrecta. Es plausible porque el jefe de la Unidad de Fiscalización suscribió el requerimiento inicial y conoce la investigación. Pero el Estatuto Tributario, art. 691, atribuye al Jefe de la Unidad de Liquidación proferir las ampliaciones a los requerimientos especiales; la opción asigna el acto a una dependencia sin esa competencia (competencia).", "tipo": "competencia"}, {"t": "El Gestor II que sustanció la investigación, porque el proyecto de ampliación es un acto de trámite interno.", "j": "Es incorrecta. Resulta atractiva porque el Gestor proyectó el acto y conoce el expediente. Pero el Estatuto Tributario, art. 691, radica la facultad de proferir las ampliaciones en el Jefe de la Unidad de Liquidación, y proyectar no equivale a proferir; la opción confunde la sustanciación con la competencia para firmar (competencia).", "tipo": "competencia"}, {"t": "El jefe de la Unidad de Liquidación, porque a esa jefatura corresponde proferir las ampliaciones al requerimiento.", "j": "Es correcta. El Estatuto Tributario, art. 691, dispone que corresponde al Jefe de la Unidad de Liquidación proferir las ampliaciones a los requerimientos especiales, además de las liquidaciones de revisión, corrección y aforo y los demás actos de determinación oficial.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 691", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#691", "fecha": "2026-10-24"}]}], "likert": [{"clave": "C", "nombre": "Competencias comportamentales", "caracter": "Clasificatoria", "items": [{"ind": "Adaptabilidad nivel 3", "t": "Anticipo los efectos de un cambio de procedimiento sobre los términos de los expedientes y propongo ajustes antes de que se venzan.", "inv": false}, {"ind": "Comunicación efectiva nivel 1", "t": "Explico a un contribuyente el motivo de un requerimiento con palabras sencillas aunque la atención tome más tiempo.", "inv": false}, {"ind": "Orientación al usuario y al ciudadano nivel 1", "t": "Remito al ciudadano a la página web cuando su pregunta ya está resuelta allí, sin revisarla con él.", "inv": true}, {"ind": "Comunicación efectiva nivel 1", "t": "Escucho completo el planteamiento de un ciudadano antes de responder aunque haya fila de espera.", "inv": false}, {"ind": "Control", "t": "Siempre mantengo la calma, sin importar la situación.", "inv": false, "control": true}, {"ind": "Trabajo en equipo nivel 3", "t": "Medio entre compañeros con posiciones opuestas para llegar a un acuerdo de trabajo.", "inv": false}, {"ind": "Comportamiento ético nivel 4", "t": "Cuestiono ante el nivel directivo un   </div>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;
  app.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { cfg.modo = b.dataset.modo; vistaInicio(); });
  const ej = document.getElementById("eje"); if (ej) ej.onchange = e => { cfg.eje = e.target.value; vistaInicio(); };
  document.getElementById("empezar").onclick = () => { S = construir(cfg); guardar(); vistaPrueba(); };
  if (enCurso) {
    document.getElementById("seguir").onclick = vistaPrueba;
    document.getElementById("descartar").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };
  }
}
function opcionModo(v, t, d){
  return `<button class="opt-card" data-modo="${v}" aria-pressed="${cfg.modo === v}"><span class="dot"></span><span><b>${t}</b><span>${d}</span></span></button>`;
}
function nombreModo(c){
  return c.modo === "completo" ? "Simulacro completo" : c.modo === "funcionales" ? "Solo funcionales" : `Práctica: ${c.eje}`;
}

/* ------------------------------ PRUEBA ------------------------------ */
function restante(){ return S.limiteMin ? S.limiteMin * 60000 - (Date.now() - S.inicio) : null; }
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
function tick(){
  const el = document.getElementById("clock");
  const r = restante();
  if (r === null || !el) return;
  el.textContent = fmtTime(r);
  el.classList.toggle("low", r < 15 * 60000);
  if (r <= 0) entregar();
}

function vistaPrueba(){
  confirmando = false;
  stopTimer();
  render();
  if (S.limiteMin) timer = setInterval(tick, 1000);
}

function render(){
  const ref = S.items[S.idx];
  const it = itemDe(ref);
  const n = S.items.length;
  const resp = S.resp[S.idx];
  const practica = S.cfg.modo === "practica";
  const respondidas = Object.keys(S.resp).length;
  const r = restante();
  const revelar = practica && resp !== undefined && ref.p === "F";

  let cuerpo;
  if (ref.p === "F") {
    const sub = it.caso_n > 1 ? ` <span class="sub-caso">· caso compartido, pregunta ${it.caso_pos} de ${it.caso_n}</span>` : "";
    cuerpo = `
      <div><div class="block-label">Caso${sub}</div><p class="caso">${esc(it.caso)}</p></div>
      <div><div class="block-label">Enunciado</div><p class="enun">${esc(it.enunciado)}</p></div>
      <div class="opts" role="group" aria-label="Opciones de respuesta">
        ${it.opciones.map((o, k) => {
          let cls = "op";
          if (revelar && k === it.clave) cls += " is-key";
          if (revelar && k === resp && k !== it.clave) cls += " is-wrong";
          return `<button class="${cls}" data-k="${k}" aria-pressed="${resp === k}" ${revelar ? "disabled" : ""}><span class="bub">${LETRAS[k]}</span><span>${esc(o.t)}</span></button>`;
        }).join("")}
      </div>
      ${revelar ? `<div class="feedback">
        <div class="row"><span class="chip ${resp === it.clave ? "ok" : "bad"}">${resp === it.clave ? "Correcta" : "Incorrecta"}</span><span class="tag">${esc(it.bloom)}</span><span class="tag">${esc(it.fuente)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
        ${justificaciones(it)}
      </div>` : ""}`;
  } else {
    cuerpo = `
      <div><div class="block-label">Afirmación</div><p class="enun">${esc(it.t)}</p></div>
      <div class="opts" role="group" aria-label="Escala de acuerdo">
        ${LIKERT.map((l, k) => `<button class="op" data-k="${k}" aria-pressed="${resp === k}"><span class="bub">${LETRAS[k]}</span><span>${l}</span></button>`).join("")}
      </div>`;
  }

  app.innerHTML = `
  <div class="bar">
    <div class="row">
      <div><span class="eyebrow">${esc(nombreModo(S.cfg))}</span><div class="mono">${respondidas}/${n} respondidas</div></div>
      <div class="row">
        ${r !== null ? `<span class="clock" id="clock" aria-label="Tiempo restante">${fmtTime(r)}</span>` : ""}
        <button class="btn" id="salir">Pausar</button>
        <button class="btn ink" id="entregar">Entregar</button>
      </div>
    </div>
    <div class="progress"><i style="width:${(respondidas / n * 100).toFixed(1)}%"></i></div>
  </div>
  ${confirmando ? `<div class="confirm" style="margin-bottom:16px">
      <p><b>¿Entregar el cuadernillo?</b> Tienes ${n - respondidas} preguntas sin responder${Object.values(S.dud).filter(Boolean).length ? ` y ${Object.values(S.dud).filter(Boolean).length} marcadas como dudosas` : ""}. Una omisión en funcionales cuenta como no acierto.</p>
      <div class="row"><button class="btn primary" id="si">Entregar ahora</button><button class="btn" id="no">Seguir respondiendo</button></div>
    </div>` : ""}
  <div class="exam">
    <article class="sheet item">
      <div class="head">
        <span class="qnum">Pregunta ${S.idx + 1} de ${n}</span>
        <span class="eyebrow">${esc(PARTE[ref.p])}${practica ? " · " + esc(it.eje) : ""}</span>
      </div>
      ${cuerpo}
      <div class="nav">
        <button class="btn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn flag" id="flag" aria-pressed="${!!S.dud[S.idx]}">${S.dud[S.idx] ? "Marcada como dudosa" : "Marcar como dudosa"}</button>
        <button class="btn primary" id="next">${S.idx === n - 1 ? "Revisar y entregar" : "Siguiente"}</button>
      </div>
    </article>
    <aside class="sheet omr" aria-label="Hoja de respuestas">
      ${Object.keys(PARTE).filter(p => S.items.some(x => x.p === p)).map(p => `
        <div><h3>${esc(PARTE[p])}</h3><div class="grid">
          ${S.items.map((x, k) => x.p !== p ? "" : `<button class="cell${S.resp[k] !== undefined ? " done" : ""}${S.dud[k] ? " flagged" : ""}${k === S.idx ? " current" : ""}" data-go="${k}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join("")}
        </div></div>`).join("")}
      <div class="legend"><span><i class="d"></i>Respondida</span><span><i></i>Pendiente</span><span><i class="f"></i>Dudosa</span></div>
    </aside>
  </div>`;

  app.querySelectorAll(".op[data-k]").forEach(b => b.onclick = () => {
    S.resp[S.idx] = Number(b.dataset.k); guardar(); render();
  });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.idx = Number(b.dataset.go); guardar(); render(); });
  document.getElementById("prev").onclick = () => { if (S.idx > 0) { S.idx--; guardar(); render(); } };
  document.getElementById("next").onclick = () => {
    if (S.idx < n - 1) { S.idx++; guardar(); render(); window.scrollTo({ top:0 }); }
    else { confirmando = true; render(); window.scrollTo({ top:0 }); }
  };
  document.getElementById("flag").onclick = () => { S.dud[S.idx] = !S.dud[S.idx]; guardar(); render(); };
  document.getElementById("salir").onclick = () => { guardar(); vistaInicio(); };
  document.getElementById("entregar").onclick = () => { confirmando = true; render(); window.scrollTo({ top:0 }); };
  const si = document.getElementById("si"); if (si) si.onclick = entregar;
  const no = document.getElementById("no"); if (no) no.onclick = () => { confirmando = false; render(); };
}

function justificaciones(it){
  const sop = (it.soporte || []).map(s => `<p class="muted" style="font-size:.82rem">Soporte: ${esc(s.norma)}, ${esc(s.articulo)} · verificado el ${esc(s.fecha)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">fuente oficial</a></p>`).join("");
  return it.opciones.map((o, k) => `<div class="just"><span class="l">${LETRAS[k]}</span><span>${esc(o.j)}${o.tipo ? ` <span class="tag">${esc(TIPO_TXT[o.tipo])}</span>` : ""}</span></div>`).join("") + sop;
}

function entregar(){
  stopTimer();
  if (!S.fin) {
    S.fin = Date.now();
    const r = calcular();
    const hist = store.get(KEY_HIST, []);
    const d = new Date(S.fin);
    hist.push({ fecha: d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit" }),
      modo: nombreModo(S.cfg), ac: r.ac, n: r.nF, esc: trunc2(r.escala) });
    store.set(KEY_HIST, hist.slice(-30));
    guardar();
  }
  vistaResultados();
}

/* ------------------------------ RESULTADOS ------------------------------ */
function calcular(){
  let ac = 0, nF = 0;
  const porEje = {}, porBloom = {}, porTipo = {};
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); nF++;
    const r = S.resp[k];
    porEje[it.eje] = porEje[it.eje] || { ac:0, n:0 };
    porBloom[it.bloom] = porBloom[it.bloom] || { ac:0, n:0 };
    porEje[it.eje].n++; porBloom[it.bloom].n++;
    if (r === it.clave) { ac++; porEje[it.eje].ac++; porBloom[it.bloom].ac++; }
    else {
      const tipo = r === undefined ? "omision" : it.opciones[r].tipo;
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
    }
  });
  const escala = nF ? ac / nF * 100 : 0;
  const ind = {}; let ctrlAcuerdo = 0, ctrlN = 0, extremos = 0, nL = 0;
  S.items.forEach((ref, k) => {
    if (ref.p === "F") return;
    const it = itemDe(ref); const r = S.resp[k];
    if (r === undefined) return;
    if (it.control) { ctrlN++; if (r >= 2) ctrlAcuerdo++; return; }
    nL++;
    if (r === 3 || (it.inv && r === 0)) extremos++;
    const v = it.inv ? 4 - r : r + 1;
    const key = PARTE[ref.p] + " · " + it.ind;
    ind[key] = ind[key] || { s:0, n:0 };
    ind[key].s += v; ind[key].n++;
  });
  return { ac, nF, escala, porEje, porBloom, porTipo, ind, ctrlAcuerdo, ctrlN, extremos, nL };
}

function vistaResultados(){
  stopTimer();
  const R = calcular();
  const pasa = R.escala >= M.minimo;
  const dur = S.fin ? fmtTime(S.fin - S.inicio) : "";
  const hayLikert = S.items.some(x => x.p !== "F");
  const fav = R.nL ? R.extremos / R.nL : 0;
  const ctrlRate = R.ctrlN ? R.ctrlAcuerdo / R.ctrlN : 0;
  const alerta = ctrlRate >= .5 || fav >= .7;
  const tiposOrden = Object.entries(R.porTipo).sort((a, b) => b[1] - a[1]);
  const minTxt = trunc2(M.minimo);

  app.innerHTML = `
  <header class="masthead">
    <span class="eyebrow">Resultado · ${esc(nombreModo(S.cfg))} · ${esc(M.codigo)}</span>
    <h1>${pasa ? "Superas" : "No alcanzas"} el mínimo de ${minTxt} en funcionales</h1>
    <div class="meta"><span>Tiempo usado ${dur}</span><span>${Object.keys(S.resp).length}/${S.items.length} respondidas</span></div>
  </header>
  <div class="score">
    <div class="sheet kpi"><span class="eyebrow">Aciertos funcionales</span><span class="v">${R.ac}/${R.nF}</span><span class="muted">${R.nF - R.ac} errores u omisiones</span></div>
    <div class="sheet kpi"><span class="eyebrow">Escala 0 a 100</span><span class="v">${trunc2(R.escala)}</span><span><span class="chip ${pasa ? "ok" : "bad"}">${pasa ? "Supera " + minTxt : "Por debajo de " + minTxt}</span></span></div>
    <div class="sheet kpi"><span class="eyebrow">Aciertos para ${minTxt}</span><span class="v">${Math.ceil(R.nF * M.minimo / 100)}</span><span class="muted">Si la escala fuera porcentual</span></div>
  </div>
  <p class="note" style="margin-bottom:16px">La escala es lineal (aciertos / ítems × 100) y truncada a dos decimales. La fórmula oficial se aplica después del análisis psicométrico de los ítems y puede diferir.</p>
  <div class="res-grid">
    <section class="sheet"><h2>Aciertos por eje</h2>
      <div class="tablewrap"><table><thead><tr><th>Eje</th><th class="num">Aciertos</th><th></th></tr></thead><tbody>
      ${Object.entries(R.porEje).sort((a, b) => a[1].ac / a[1].n - b[1].ac / b[1].n).map(([e, v]) => {
        const p = v.ac / v.n; return `<tr><td>${esc(e)}</td><td class="num">${v.ac}/${v.n}</td><td style="width:90px"><div class="meter"><i class="${p >= .7 ? "ok" : p >= .5 ? "warn" : "bad"}" style="width:${p * 100}%"></i></div></td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="muted" style="font-size:.85rem">Ordenado de menor a mayor acierto. Repasa primero los ejes de arriba en modo práctica.</p>
    </section>
    <section class="sheet"><h2>Por qué fallaste</h2>
      ${tiposOrden.length ? `<div class="tablewrap"><table><thead><tr><th>Tipo de distractor elegido</th><th class="num">Veces</th></tr></thead><tbody>
      ${tiposOrden.map(([t, c]) => `<tr><td>${t === "omision" ? "Sin responder" : esc(TIPO_TXT[t])}</td><td class="num">${c}</td></tr>`).join("")}</tbody></table></div>` : `<p>Sin errores en funcionales.</p>`}
      <h3>Por nivel cognitivo</h3>
      <div class="tablewrap"><table><thead><tr><th>Bloom revisada</th><th class="num">Aciertos</th></tr></thead><tbody>
      ${["Recordar","Comprender","Aplicar","Analizar","Evaluar","Crear"].filter(b => R.porBloom[b]).map(b => `<tr><td>${b}</td><td class="num">${R.porBloom[b].ac}/${R.porBloom[b].n}</td></tr>`).join("")}</tbody></table></div>
    </section>
  </div>
  ${hayLikert ? `<section class="sheet" style="padding:14px;display:grid;gap:10px;margin-bottom:16px">
    <div class="row" style="justify-content:space-between"><h2>Perfil de autoinforme</h2><span class="chip ${alerta ? "warn" : "ok"}">${alerta ? "Patrón muy favorable" : "Patrón sin alertas"}</span></div>
    <p class="muted" style="font-size:.88rem">Estas pruebas no tienen respuestas correctas. El perfil es una lectura de entrenamiento: promedio de 1 a 4 por indicador, con las afirmaciones invertidas recodificadas. Acuerdo con afirmaciones de control: ${R.ctrlAcuerdo} de ${R.ctrlN}. Respuestas extremas favorables: ${Math.round(fav * 100)} %. ${alerta ? "Un patrón así es el que las subescalas de control de la prueba real buscan detectar." : ""}</p>
    <div class="tablewrap"><table><thead><tr><th>Indicador</th><th class="num">Promedio</th><th></th></tr></thead><tbody>
    ${Object.entries(R.ind).map(([k, v]) => { const m = v.s / v.n; return `<tr><td>${esc(k)}</td><td class="num">${m.toFixed(2).replace(".", ",")}</td><td style="width:110px"><div class="meter"><i style="width:${(m - 1) / 3 * 100}%"></i></div></td></tr>`; }).join("")}
    </tbody></table></div>
  </section>` : ""}
  <section aria-labelledby="t-rev">
    <div class="row" style="justify-content:space-between"><h2 id="t-rev">Revisión de funcionales</h2>
      <div class="row"><button class="btn" id="inicio">Volver al inicio</button></div></div>
    <div class="filters" role="group" aria-label="Filtro">
      ${[["todos","Todas"],["errores","Solo errores"],["dudosas","Solo dudosas"]].map(([v, l]) => `<button class="btn" data-f="${v}" aria-pressed="${filtro === v}">${l}</button>`).join("")}
    </div>
    <div class="review">${revision()}</div>
  </section>
  <p class="firma-autor">${esc(M.creado_por)} · Versión ${esc(M.version)} · ${esc(M.fecha)}</p>`;

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; vistaResultados(); });
  document.getElementById("inicio").onclick = () => { store.del(KEY_STATE); S = null; vistaInicio(); };
  window.scrollTo({ top:0 });
}

function revision(){
  const out = [];
  S.items.forEach((ref, k) => {
    if (ref.p !== "F") return;
    const it = itemDe(ref); const r = S.resp[k]; const ok = r === it.clave;
    if (filtro === "errores" && ok) return;
    if (filtro === "dudosas" && !S.dud[k]) return;
    out.push(`<article class="sheet rv">
      <div class="head"><span class="qnum">Pregunta ${k + 1}</span>
        <span class="tag ${ok ? "ok" : "bad"}">${ok ? "Acierto" : r === undefined ? "Omitida" : "Error"}</span>
        ${S.dud[k] ? `<span class="tag warn">Dudosa</span>` : ""}
        <span class="tag">${esc(it.eje)}</span><span class="tag">${esc(it.bloom)}</span>${(it.integra || []).map(x => `<span class="tag warn">Integra: ${esc(x)}</span>`).join("")}</div>
      <p class="caso">${esc(it.caso)}</p>
      <p class="enun">${esc(it.enunciado)}</p>
      <div class="opts">${it.opciones.map((o, j) => `<div class="op${j === it.clave ? " is-key" : ""}${j === r && !ok ? " is-wrong" : ""}" aria-pressed="${j === r}"><span class="bub">${LETRAS[j]}</span><span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="feedback">
        ${justificaciones(it)}
        <p class="muted" style="font-size:.82rem">Fuente: ${esc(it.fuente)}</p>
      </div>
    </article>`);
  });
  return out.length ? out.join("") : `<p class="muted">No hay preguntas con este filtro.</p>`;
}

/* ------------------------------ ARRANQUE ------------------------------ */
if (S && S.fin) vistaResultados();
else vistaInicio();
</script>
</body>
</html>
