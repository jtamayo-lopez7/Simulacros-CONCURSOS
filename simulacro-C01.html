Es correcta. El Decreto 1165 de 2019, art. 581, dispone que el control posterior se lleva a cabo sobre las mercancías y sobre los documentos relativos a las operaciones comerciales, para establecer la exactitud de los datos de las declaraciones presentadas durante un determinado período. El art. 591, numeral 3, añade la verificación de documentos soporte para establecer un menor monto de tributos aduaneros.", "tipo": null}, {"t": "Son válidos, porque con el levante autorizado la verificación del valor y de los documentos se agotó en el control simultáneo y no puede reabrirse.", "j": "Es incorrecta. Es plausible porque el levante cierra una etapa del control, pero el Decreto 1165 de 2019, art. 581, regula precisamente el control posterior sobre mercancías y documentos de operaciones ya realizadas, y el art. 591, numeral 3, permite verificar la exactitud de declaraciones y documentos soporte cuando se considere necesario. Error de fase: ubica la verificación en una etapa anterior.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M018", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 581", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#581", "fecha": "2026-10-24"}, {"fila": "M017", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E05-009-1", "caso_id": "C-E05-009", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 589", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Natalia Vargas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, evalúa la corrección que presentó Alimentos Iota S.A.S. a su declaración de IVA del tercer bimestre de 2025, cuyo plazo venció el 10 de julio de 2025. La corrección, enviada por el servicio informático electrónico al que está obligada la sociedad el 22 de septiembre de 2026, incluye IVA descontable omitido por 120 millones de pesos y convierte un saldo a pagar de 45 millones en un saldo a favor de 75 millones. La sociedad no ha sido objeto de requerimiento especial ni de pliego de cargos. Su revisor fiscal sostiene que la declaración puede corregirse durante tres años y que el formulario se envió por el medio obligado. La jefatura pide decidir si la corrección produce efectos.", "enunciado": "Evalúe la oportunidad de la corrección y decida si debe aceptarse.", "opciones": [{"t": "Debe aceptarse, porque se presentó dentro de los tres años y antes de cualquier requerimiento especial.", "j": "Es incorrecta. Es plausible porque el Estatuto Tributario, art. 588, concede tres años para corregir antes del requerimiento especial. Pero esa regla gobierna las correcciones que aumentan el impuesto; esta aumenta el saldo a favor y se rige por el art. 589; la opción aplica la norma de otro tipo de corrección (norma).", "tipo": "norma"}, {"t": "No debe aceptarse, porque al aumentar el saldo a favor el plazo era el año siguiente al vencimiento.", "j": "Es correcta. El Estatuto Tributario, art. 589, ordena que la corrección que disminuye el valor a pagar o aumenta el saldo a favor se presente por el medio obligado dentro del año siguiente al vencimiento del término para declarar. Ese año terminó el 10 de julio de 2026 y la corrección se envió el 22 de septiembre de 2026.", "tipo": null}, {"t": "Debe aceptarse, porque se presentó por el medio obligado, que es la condición que exige esta corrección.", "j": "Es incorrecta. Resulta atractiva porque el Estatuto Tributario, art. 589, exige presentar la corrección por el medio al que está obligado el contribuyente, y así ocurrió. Pero la norma exige además hacerlo dentro del año siguiente al vencimiento del término para declarar; la opción toma una condición y omite la otra (completitud).", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}, {"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}]}, {"id": "C-E03-008-1", "caso_id": "C-E03-008", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 655", "integra": ["NORMAS Y TECNICAS DE AUDITORIA"], "caso": "Óscar Valencia, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, dirigió el 18 de noviembre de 2025 una inspección contable a Distribuidora Cerro Azul S.A.S. El acta dejó constancia de que el libro diario estaba atrasado nueve meses y de costos por 140 millones de pesos sin soporte contable en la renta de 2024. La resolución sancionatoria se expedirá en 2026. Según las declaraciones de renta, en 2024 la sociedad tuvo patrimonio líquido de 2.000 millones e ingresos netos de 3.100 millones, y en 2025 patrimonio líquido de 2.400 millones e ingresos netos de 3.800 millones de pesos. La sociedad solicita que, si se le sanciona por los libros, se abandone el rechazo de los costos para no ser castigada dos veces por el mismo hecho.", "enunciado": "Sustente el valor de la sanción por libros y su efecto sobre el rechazo de los costos.", "opciones": [{"t": "19 millones de pesos, calculados sobre los ingresos netos de 2025, y se abandona el rechazo de los costos sin soporte.", "j": "Es incorrecta. Es plausible porque el valor está bien calculado y la sociedad invoca la prohibición de doble sanción, pero el art. 655 del Estatuto Tributario dispone que la sanción opera sin perjuicio del rechazo de los costos que carezcan de soporte en la contabilidad (error de completitud).", "tipo": "completitud"}, {"t": "15,5 millones de pesos, calculados sobre los ingresos netos de 2024, y se mantiene el rechazo de los costos.", "j": "Es incorrecta. Es plausible tomar el año en que se detectó la irregularidad, pero el art. 655 del Estatuto Tributario usa el mayor valor entre patrimonio líquido e ingresos netos del año anterior al de su imposición; si la sanción se impone en 2026, el año base es 2025 (error de fase).", "tipo": "fase"}, {"t": "19 millones de pesos, calculados sobre los ingresos netos de 2025, y se mantiene el rechazo de los costos.", "j": "Es correcta. El art. 655 del Estatuto Tributario fija la sanción en el 0,5 % del mayor valor entre el patrimonio líquido y los ingresos netos del año anterior al de su imposición, sin exceder 20.000 UVT: 0,5 % de 3.800 millones da 19 millones, y la norma la aplica sin perjuicio del rechazo de los costos sin soporte.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M072", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 655", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#655", "fecha": "2026-10-24"}]}, {"id": "C-E11-010-1", "caso_id": "C-E11-010", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Analizar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 641", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II Ricardo Mora, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración del impuesto sobre la renta del año gravable 2023 de Ferretería Los Almendros S.A.S. El plazo para declarar venció el 15 de abril de 2024 y la declaración se presentó el 3 de junio de 2026, por iniciativa propia de la sociedad y sin actuación previa de la Administración. El impuesto a cargo declarado es de $12.000.000. En la misma declaración la sociedad liquidó una sanción por extemporaneidad de $15.600.000, equivalente a 26 meses de retardo al cinco por ciento. El contador sostiene que el cálculo es correcto porque cada fracción de mes cuenta como mes completo. La revisión está en la etapa de verificación de la sanción autoliquidada, sin considerar otros factores de graduación ni intereses.", "enunciado": "Diagnostique la inconsistencia de la sanción autoliquidada y determine el valor que corresponde.", "opciones": [{"t": "$12.000.000, porque los 26 meses suman 130 % y la sanción no puede exceder el impuesto a cargo declarado.", "j": "Es correcta. El Estatuto Tributario, art. 641, fija el 5 % del impuesto a cargo por cada mes o fracción de mes de retardo, 'sin exceder del ciento por ciento (100%) del impuesto'. Del 15 de abril de 2024 al 3 de junio de 2026 hay 25 meses completos y una fracción, 26 periodos que suman 130 %; el tope reduce la sanción a $12.000.000.", "tipo": null}, {"t": "$15.600.000, porque los 26 meses de retardo están bien contados y cada mes suma el cinco por ciento.", "j": "Es incorrecta. Es plausible porque el conteo de 26 periodos, con la fracción final, es correcto y el 5 % por mes es la tarifa del Estatuto Tributario, art. 641. Sin embargo, la misma norma limita la sanción 'sin exceder del ciento por ciento (100%) del impuesto', y el 130 % supera ese límite. Error de completitud: aplica la tarifa y omite el tope.", "tipo": "completitud"}, {"t": "$15.000.000, porque se cuentan solo los 25 meses completos de retardo y se descarta la fracción final del periodo.", "j": "Es incorrecta. Resulta plausible porque del 15 de abril de 2024 al 15 de mayo de 2026 hay 25 meses completos. Sin embargo, el Estatuto Tributario, art. 641, cuenta cada mes o fracción de mes calendario, lo que da 26 periodos, y además limita la sanción al 100 % del impuesto. Error de granularidad: descarta la fracción final y omite el tope.", "tipo": "granularidad"}], "clave": 0, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E10-011-1", "caso_id": "C-E10-011", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Evaluar", "fuente": "Decreto 1165 de 2019 (régimen de aduanas), art. 749", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "En una Dirección Seccional, el Gestor II Quintero integra el grupo que prepara la disposición de mercancías decomisadas que permanecen en el almacén de la entidad. El inventario del 2 de septiembre de 2026 agrupa tres lotes: el lote 1, de 1.200 bultos de alimento para mascotas con fecha de vencimiento expirada en julio de 2026; el lote 2, de 300 bidones de solvente industrial que, según una nota del almacenista, podrían representar un riesgo para la salubridad, sin que obre concepto de la autoridad sanitaria; y el lote 3, de 80 bicicletas nuevas en buen estado, avaluadas en 96 millones de pesos y sin restricciones legales o administrativas. El almacén debe liberar espacio antes del 30 de noviembre de 2026. Un funcionario propone que el Gestor II firme una orden de destrucción conjunta de los tres lotes, en un solo acto de chatarrización, para reducir los costos de custodia.", "enunciado": "Valore la propuesta del funcionario y decida el tratamiento que corresponde a cada lote del inventario.", "opciones": [{"t": "Procede la destrucción conjunta de los tres lotes por orden del Gestor II, porque integra el grupo de disposición y la custodia genera costos.", "j": "Es incorrecta. Resulta plausible porque el Gestor II participa en las diligencias de destrucción y la custodia es costosa, pero el art. 749 del Decreto 1165 de 2019, modificado por el Decreto 659 de 2024, atribuye a la Dirección Seccional la determinación de la modalidad de disposición, y el lote 3 no encuadra en ninguna causal. Error de competencia.", "tipo": "competencia"}, {"t": "Procede destruir de inmediato los lotes 1 y 2, por vencimiento y por riesgo, y reservar el lote 3 para otra modalidad que determine la Seccional.", "j": "Es incorrecta. Acierta frente a los lotes 1 y 3, pero el art. 749 del Decreto 1165 de 2019 condiciona la causal de alto riesgo para la seguridad o salubridad pública a la certificación previa de la autoridad respectiva, que no obra para el lote 2. Error de completitud.", "tipo": "completitud"}, {"t": "Procede que la Seccional determine destruir el lote 1; el lote 2 exige certificación previa de la autoridad y el lote 3 admite otra modalidad.", "j": "Es correcta. El art. 749 del Decreto 1165 de 2019, modificado por el Decreto 659 de 2024, asigna a la Dirección Seccional determinar la destrucción o chatarrización cuando la mercancía tenga fecha de vencimiento expirada (lote 1) o implique alto riesgo para la salubridad certificado previamente por la autoridad respectiva (lote 2); el lote 3 tiene valor comercial, carece de restricciones y puede disponerse bajo otra modalidad.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M062", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 749", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#749", "fecha": "2026-10-24"}]}, {"id": "C-E02-010-1", "caso_id": "C-E02-010", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Analizar", "fuente": "Ley 594 de 2000, art. 12", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación. La Dirección Seccional contrató a Soluciones Documentales del Norte S.A.S. para digitalizar 2.300 expedientes de fiscalización activos, con plazo hasta el 31 de octubre de 2025. En un muestreo de 150 expedientes, usted detecta 37 con imágenes ilegibles o con folios omitidos frente al original físico. El contratista afirma que entregó a tiempo y que su obligación terminó con la carga al sistema. El jefe de la división opina que el problema es del contratista y que la división puede seguir trabajando con las imágenes. Tres de los expedientes afectados tienen liquidación oficial por proyectar este mes y otros dos esperan respuesta a requerimiento especial. Los originales físicos siguen en la bodega de la Seccional, a la espera de traslado.", "enunciado": "Diagnostique a quién corresponde responder por la calidad de esos documentos y qué implica para su trabajo.", "opciones": [{"t": "Responde la Seccional, que cumple al conservar los originales físicos, sin necesidad de revisar la fidelidad de las imágenes cargadas.", "j": "Es incorrecta. Es plausible porque identifica bien al responsable, pero omite que la Ley 594 de 2000, art. 16, exige velar por la integridad y fidelidad de la información, y las imágenes que se usarán para decidir presentan folios omitidos. Error de completitud.", "tipo": "completitud"}, {"t": "Responde la Seccional, que debe verificar la fidelidad de las imágenes frente a los originales antes de usarlas para decidir.", "j": "Es correcta. La Ley 594 de 2000, art. 12, hace a la administración pública responsable de la gestión de sus documentos, aunque contrate la digitalización, y el art. 16 obliga a velar por la integridad, autenticidad, veracidad y fidelidad de la información de los documentos de archivo. Antes de proyectar liquidaciones con esas imágenes, deben cotejarse con los originales.", "tipo": null}, {"t": "Responde el contratista, que asumió por contrato la gestión de esas imágenes, y la división puede seguir proyectando con ellas.", "j": "Es incorrecta. Es plausible porque el contrato fija obligaciones al contratista, pero la Ley 594 de 2000, art. 12, hace responsable a la administración pública de la gestión de sus documentos; esa responsabilidad no se traslada por contrato. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M095", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 12", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#12", "fecha": "2026-10-24"}, {"fila": "M096", "norma": "Ley 594 de 2000 (Ley General de Archivos)", "articulo": "art. 16", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0594_2000.htm#16", "fecha": "2026-10-24"}]}, {"id": "C-E10-004-1", "caso_id": "C-E10-004", "caso_pos": 1, "caso_n": 1, "eje": "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 691", "integra": ["ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "En una Dirección Seccional, el requerimiento especial contra Agroinsumos del Norte S.A.S. por el impuesto sobre la renta del año gravable 2022 se notificó el 4 de febrero de 2026. La respuesta del contribuyente, radicada el 15 de marzo de 2026, aporta contratos que obligan a replantear la cifra propuesta y revelan una operación de venta de activos no analizada. El expediente pasó a la unidad de liquidación, donde el Gestor II Herrera prepara dos actos: una ampliación al requerimiento especial por 1.200 UVT adicionales y el proyecto de liquidación de revisión. El jefe de la unidad de fiscalización, que firmó el requerimiento inicial, ofrece suscribir también los dos nuevos actos para no demorar el reparto, mientras el jefe de la unidad de liquidación resuelve otros expedientes del mismo programa.", "enunciado": "Valore la propuesta de firma que se formula para los dos actos que prepara el Gestor II.", "opciones": [{"t": "Es admisible para la ampliación del requerimiento, por ser acto de trámite, y debe reservarse al jefe de liquidación la liquidación de revisión.", "j": "Es incorrecta. Resulta verosímil porque la ampliación precede a la decisión de fondo, pero el art. 691 del Estatuto Tributario enumera la ampliación entre los actos del jefe de la unidad de liquidación. Error de granularidad.", "tipo": "granularidad"}, {"t": "Es admisible porque quien profirió el requerimiento especial conserva la competencia sobre los actos que derivan de esa misma investigación.", "j": "Es incorrecta. Parece coherente con la continuidad del expediente, pero el art. 691 del Estatuto Tributario separa la determinación oficial y la radica en el jefe de la unidad de liquidación. Error de competencia.", "tipo": "competencia"}, {"t": "Es inadmisible: la ampliación al requerimiento especial y la liquidación de revisión corresponden al jefe de la unidad de liquidación.", "j": "Es correcta. El art. 691 del Estatuto Tributario atribuye al jefe de la unidad de liquidación las ampliaciones a los requerimientos especiales y las liquidaciones de revisión, mientras el art. 688 limita al jefe de fiscalización a los actos de trámite y previos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M036", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 691", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#691", "fecha": "2026-10-24"}, {"fila": "M030", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 688", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#688", "fecha": "2026-10-24"}]}, {"id": "C-E01-006-1", "caso_id": "C-E01-006", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 29", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Ricardo Salas, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, ejecuta desde el 5 de enero de 2026 un programa de control a omisos en la declaración del impuesto sobre las ventas, cuyos lineamientos fijó el nivel central. De los 140 contribuyentes asignados, al 27 de febrero ha verificado 62 y encuentra que 25 ya habían presentado la declaración antes de la selección y otros 9 fueron liquidados de oficio en 2025 por los mismos periodos. El jefe de la división propone cambiar en la seccional los criterios de selección y reemplazar la lista por contribuyentes escogidos localmente, para cumplir la meta del trimestre que vence el 31 de marzo. Ricardo debe emitir concepto escrito sobre la propuesta antes de la reunión del 4 de marzo, con soporte en la norma de estructura.", "enunciado": "¿Qué concepto debe sustentar Ricardo sobre la propuesta del jefe de la división?", "opciones": [{"t": "Suspender todo el programa hasta que el nivel central reformule los criterios, sin verificar los contribuyentes que siguen pendientes.", "j": "Es incorrecta. Es plausible porque reconoce que la modificación corresponde al nivel central. Falla porque el Decreto 1742 de 2020, artículo 29, numeral 3, prevé la evaluación y la propuesta de ajustes sobre programas en curso; detener la ejecución antes de esa evaluación invierte el orden, ya que el reporte de hallazgos precede al ajuste y los 78 contribuyentes pendientes siguen bajo los lineamientos vigentes. Error de fase.", "tipo": "fase"}, {"t": "Continuar la ejecución conforme a los lineamientos y reportar los hallazgos para que la subdirección evalúe el programa y proponga ajustes.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 29, numeral 3, atribuye a la subdirección del nivel central «dar lineamientos para la ejecución de los programas y acciones de control de fiscalización», «evaluarlos y proponer las modificaciones necesarias cuando a ello hubiere lugar». Los 34 casos mal seleccionados son insumo para esa evaluación; la seccional ejecuta y reporta, pero no redefine el programa.", "tipo": null}, {"t": "Acoger el cambio local de criterios, porque la seccional ejecuta el programa y puede adaptar su alcance a la meta del trimestre.", "j": "Es incorrecta. Es plausible porque la seccional conoce de primera mano los defectos de la lista y responde por la meta. Falla porque el Decreto 1742 de 2020, artículo 29, numeral 3, reserva a la subdirección del nivel central la evaluación de los programas y la propuesta de modificaciones; la ejecución no habilita a la seccional para rediseñar los criterios. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M056", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#29", "fecha": "2026-10-24"}, {"fila": "M053", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 29", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#29", "fecha": "2026-10-24"}]}, {"id": "C-E06-008-1", "caso_id": "C-E06-008", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Evaluar", "fuente": "Ley 599 de 2000 (Código Penal), art. 319", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS"], "caso": "Diego Salazar, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional con jurisdicción costera, acompaña el 6 de junio de 2026 un operativo de control. Se identifican dos situaciones. En la primera, un lote de electrodomésticos valorado en 80 salarios mínimos legales mensuales fue descargado de una embarcación en un muelle privado de pesca que no está habilitado para operaciones de comercio exterior. En la segunda, un lote de repuestos valorado en 30 salarios mínimos legales mensuales ingresó por el puerto habilitado de la ciudad con su declaración de importación, aunque con una subpartida arancelaria discutible. Ambos lotes pertenecen a Comercial Iota S.A.S. El director seccional pide a Diego, antes del 12 de junio, una recomendación sobre qué hechos deben ponerse en conocimiento para la acción penal y cuáles se tramitan solo en sede administrativa.", "enunciado": "¿Qué recomendación de Diego se sostiene mejor frente al texto de las normas aplicables?", "opciones": [{"t": "Poner en conocimiento los dos lotes, porque la ley anticontrabando ordena sancionar penalmente toda mercancía que presente una irregularidad aduanera.", "j": "Es incorrecta. Resulta plausible porque la Ley 1762 de 2015, art. 1, busca prevenir, controlar y sancionar el contrabando y la defraudación fiscal. Falla porque la conducta penal del art. 319 de la Ley 599 de 2000 exige introducción por lugar no habilitado y cuantía superior a 50 salarios mínimos; el segundo lote ingresó por puerto habilitado y vale 30. Error de granularidad.", "tipo": "granularidad"}, {"t": "Poner en conocimiento el lote descargado en el muelle no habilitado y tramitar en sede administrativa la discusión sobre la subpartida.", "j": "Es correcta. La Ley 599 de 2000, art. 319, describe introducir mercancías en cuantía superior a 50 salarios mínimos legales mensuales por lugares no habilitados; el primer lote reúne ambos elementos. La Ley 1762 de 2015, art. 1, orienta la normativa a prevenir, controlar y sancionar el contrabando. El segundo lote entró por puerto habilitado, con declaración y por debajo de esa cuantía.", "tipo": null}, {"t": "Abstenerse de poner en conocimiento los dos lotes, porque el control del contrabando le corresponde a la fuerza pública y no a la DIAN.", "j": "Es incorrecta. Es plausible porque la fuerza pública participa en los operativos contra el contrabando. Falla porque a la DIAN le corresponde controlar el cumplimiento de las obligaciones aduaneras (Decreto 1742 de 2020, art. 3, num. 3) y la Ley 1762 de 2015, art. 1, orienta la normativa a controlar el contrabando. Error de competencia.", "tipo": "competencia"}], "clave": 1, "soporte": [{"fila": "M019", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 319", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#319", "fecha": "2026-10-24"}, {"fila": "M020", "norma": "Ley 1762 de 2015 (ley anticontrabando)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1762_2015.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E02-001-1", "caso_id": "C-E02-001", "caso_pos": 1, "caso_n": 1, "eje": "GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES", "bloom": "Aplicar", "fuente": "Ley 1437 de 2011, art. 36", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "Usted es Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional de Impuestos. Revisa dos expedientes abiertos a Comercializadora Andina del Valle S.A.S. por el impuesto sobre la renta del año gravable 2023. El primero, RT-2025-0118, nació de un programa de control de costos el 12 de marzo de 2025 y tiene emplazamiento para corregir notificado el 10 de junio. El segundo, RT-2025-0457, nació el 2 de julio de 2025 de un cruce con información exógena y contiene un auto de inspección contable del 18 de agosto. Ambos cuestionan las mismas deducciones por 2.150 UVT y están asignados a la misma división. El contribuyente no ha pedido nada sobre la forma de tramitarlos. La jefa de la división debe aprobar esta semana el proyecto de requerimiento especial y le pide su concepto sobre el manejo documental.", "enunciado": "Decida el tratamiento documental que corresponde a estos expedientes antes de proyectar el requerimiento especial.", "opciones": [{"t": "Tramitarlos por separado hasta notificar el requerimiento especial y unificarlos al proyectar la liquidación oficial de revisión.", "j": "Es incorrecta. Es plausible porque la acumulación termina reflejada en la liquidación, pero ubica la unión en una fase tardía: el requerimiento especial ya debe apoyarse en un expediente único, y proponerlo con dos expedientes paralelos abre la puerta a las decisiones contradictorias que la Ley 1437 de 2011, art. 36, busca evitar. Error de fase.", "tipo": "fase"}, {"t": "Mantenerlos separados mientras el contribuyente no pida la acumulación, pues la reunión de expedientes procede a petición de parte.", "j": "Es incorrecta. Es plausible porque la Ley 1437 de 2011, art. 36, prevé la acumulación a petición del interesado, pero omite que la misma norma la ordena también de oficio; el silencio del contribuyente no impide acumular dos expedientes tramitados ante la misma autoridad sobre las mismas deducciones. Error de completitud.", "tipo": "completitud"}, {"t": "Acumularlos de oficio en un solo expediente, porque se tramitan ante la misma autoridad sobre las mismas deducciones y evitan decisiones contradictorias.", "j": "Es correcta. La Ley 1437 de 2011, art. 36, ordena acumular al expediente de una actuación, de oficio o a petición del interesado, cualesquiera otros que se tramiten ante la misma autoridad, con el fin de evitar decisiones contradictorias. Los dos expedientes nacieron de actuaciones distintas, pero cuestionan las mismas deducciones del mismo año ante la misma división. El Estatuto Tributario, art. 742, exige además que la determinación se funde en los hechos demostrados en el respectivo expediente.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M043", "norma": "Ley 1437 de 2011 (CPACA)", "articulo": "art. 36", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_1437_2011.htm#36", "fecha": "2026-10-24"}, {"fila": "M012", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 742", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#742", "fecha": "2026-10-24"}]}, {"id": "C-E04-007-1", "caso_id": "C-E04-007", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["GESTION DOCUMENTAL Y TRAZABILIDAD DE EXPEDIENTES"], "caso": "Un Gestor II de la Subdirección de Apoyo en la Lucha contra el Delito Aduanero y Fiscal debe consolidar el informe de gestión del cuarto trimestre de 2025 sobre denuncias recibidas, con corte al 31 de diciembre y entrega el 20 de enero de 2026 en el formato y la periodicidad definidos por el Director General, que exige reportar todas las denuncias recibidas en el periodo, por tipo y con su estado (direccionada, en análisis o archivada), sin datos de identificación de los denunciados. En el aplicativo figuran 58 denuncias: 31 por evasión, 18 por contrabando y 9 por presunto lavado de activos. De estas últimas, siete fueron direccionadas a entidades externas y dos siguen en análisis preliminar. El coordinador propone excluir del informe las nueve denuncias de lavado de activos y dejar constancia en un documento reservado de la dependencia, porque los hechos fueron trasladados a otra entidad y mencionarlos podría afectar investigaciones en curso.", "enunciado": "¿Qué debe decidir el Gestor sobre la propuesta del coordinador antes de remitir el informe?", "opciones": [{"t": "Rechazarla en parte y reportar solo las dos denuncias en análisis preliminar, porque las siete direccionadas pasaron a ser gestión de la entidad receptora.", "j": "Es incorrecta. Es plausible porque el expediente de las siete salió de la dependencia. Falla porque el Decreto 1742 de 2020, art. 33, ordena presentar el informe en la forma que fije el Director General, y esa forma pide todas las denuncias del periodo con su estado, incluido el de direccionada; recortar el informe a lo pendiente desconoce el formato. Error de granularidad.", "tipo": "granularidad"}, {"t": "Rechazarla y reportar las 58 denuncias por tipo y estado, sin identificar a los denunciados, en la forma fijada por el Director General.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, exige presentar los informes periódicos de gestión en la forma y oportunidad que establezca el Director General. La forma fijada en el caso exige todas las denuncias recibidas en el periodo, por tipo y con su estado, de modo que entran las nueve de lavado de activos; omitir los datos de identificación de los denunciados atiende la reserva que preocupa al coordinador.", "tipo": null}, {"t": "Acogerla y dejar las nueve denuncias en el documento reservado, pues la reserva de la información penal prevalece sobre el formato del informe de gestión.", "j": "Es incorrecta. Es plausible porque la reserva de la información penal exige cuidado en su manejo. Falla porque el Decreto 1742 de 2020, art. 33, obliga a presentar los informes periódicos de gestión en la forma y oportunidad que establezca el Director General, y la forma fijada exige todas las denuncias del periodo sin datos de identificación de los denunciados, lo que ya protege la reserva. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M059", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M004", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E07-007-1", "caso_id": "C-E07-007", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Evaluar", "fuente": "Decreto 1165 de 2019, art. 581", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestor II Sandra Lozano, de la división de fiscalización y liquidación de una Dirección Seccional, integra el grupo de control posterior sobre Importaciones Altamar S.A.S. El 11 de mayo de 2026 recibe un informe que compara 23 declaraciones de importación de maquinaria agrícola presentadas en 2025 con los documentos soporte: en 7 casos el certificado de origen difiere del país consignado en la declaración, y en 4 casos la mercancía ingresó con exención de tributos aduaneros por un régimen que exige destinación específica, sin que obre constancia de su cumplimiento. El valor involucrado asciende a 2.640 millones de pesos. La jefatura propone cerrar el estudio con el solo cotejo documental del origen y aplazar el examen del régimen hasta un plan posterior. La actuación está en control posterior y el plazo interno para el informe de hallazgos vence el 30 de junio de 2026.", "enunciado": "Evalúe la propuesta de la jefatura y sustente el alcance que debe tener el informe de hallazgos.", "opciones": [{"t": "Es insuficiente: el control posterior abarca también los requisitos del régimen y de las mercancías con exención, así que el informe debe cubrir ambos hallazgos.", "j": "Es correcta. El Decreto 1165 de 2019, art. 581, extiende el control posterior al cumplimiento de los requisitos exigidos para un régimen o modalidad aduanera determinada y a los exigidos a las mercancías sometidas a un régimen con o sin pago de tributos aduaneros. El art. 591, numeral 5, respalda realizar acciones de control para verificar el cumplimiento de las obligaciones aduaneras.", "tipo": null}, {"t": "Es adecuada, porque el examen de los requisitos del régimen corresponde a la etapa de control previo y no puede retomarse en el control posterior.", "j": "Es incorrecta. Es plausible porque los requisitos se acreditan al ingreso, pero el Decreto 1165 de 2019, art. 581, incluye en el control posterior el cumplimiento de los requisitos exigidos para un régimen o modalidad aduanera y para las mercancías sometidas a él con o sin pago de tributos. Error de fase: asigna al control previo una verificación propia del posterior.", "tipo": "fase"}, {"t": "Es insuficiente, pero el informe debe limitarse a los cuatro casos del régimen porque el cotejo de origen ya quedó resuelto con los certificados obtenidos.", "j": "Es incorrecta. Acierta en incluir el régimen, pero el Decreto 1165 de 2019, art. 581, prevé el control sobre los documentos relativos a las operaciones comerciales y la exactitud de los datos consignados en las declaraciones, de modo que las siete discrepancias de origen son también hallazgo. Error de completitud: deja fuera parte de lo verificado.", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M018", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 581", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#581", "fecha": "2026-10-24"}, {"fila": "M052", "norma": "Decreto 1165 de 2019 (régimen de aduanas)", "articulo": "art. 591", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1165_2019.htm#591", "fecha": "2026-10-24"}]}, {"id": "C-E04-005-1", "caso_id": "C-E04-005", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "En la fiscalización del impuesto de renta del año gravable 2025 de Inversiones Cumbre S.A.S., un Gestor II de la división de fiscalización y liquidación de una Dirección Seccional establece que la sociedad compró tres inmuebles por 2.700 millones de pesos entre marzo y agosto de 2025. Los pagos se hicieron con consignaciones en efectivo del socio mayoritario, cuyos ingresos declarados en 2024 equivalen a 1.200 UVT. La sociedad no registró pasivos con el socio ni aportes de capital. El 14 de septiembre de 2026 el Gestor entrega a su jefe un borrador de memorando que dice: «Se configuró el delito de lavado de activos; se compulsan copias y la división se abstiene de proponer la liquidación de revisión hasta que exista sentencia penal». La sociedad aún no ha recibido requerimiento especial.", "enunciado": "¿Qué defecto debe diagnosticar el jefe en el borrador del memorando antes de firmarlo?", "opciones": [{"t": "El memorando omite citar el artículo 323 con su modificación de 2015; con esa precisión normativa la compulsa quedaría bien sustentada.", "j": "Es incorrecta. Es plausible porque la Ley 599 de 2000, art. 323, fue modificada por la Ley 1762 de 2015 y citar la versión vigente es buena práctica. Falla porque el defecto no es de cita: el memorando declara configurado un delito, calificación que no corresponde a la DIAN según el Decreto 1742 de 2020, art. 33. Error de granularidad.", "tipo": "granularidad"}, {"t": "El memorando califica el delito, cuando a la DIAN le corresponde poner en conocimiento los hechos de adquisición de bienes con posible origen ilícito.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, núm. 1, asigna a la DIAN las acciones de investigación administrativa y el deber de poner en conocimiento inmediato de la autoridad competente la posible comisión de delitos. Adquirir bienes con recursos de origen no justificado coincide con conductas de la Ley 599 de 2000, art. 323, pero la DIAN reporta y no tipifica.", "tipo": null}, {"t": "El memorando es prematuro, porque los hechos deben informarse después de que la liquidación oficial de revisión quede en firme.", "j": "Es incorrecta. Es plausible porque la firmeza da certeza sobre los ingresos omitidos. Falla porque el Decreto 1742 de 2020, art. 33, núm. 1, ordena poner en conocimiento inmediato la posible comisión de delitos; atar el aviso a la firmeza del acto tributario lo aplaza sin fundamento. Error de fase.", "tipo": "fase"}], "clave": 1, "soporte": [{"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M027", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 323", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#323", "fecha": "2026-10-24"}]}, {"id": "C-E01-003-1", "caso_id": "C-E01-003", "caso_pos": 1, "caso_n": 1, "eje": "ESTRUCTURA ORGANIZACIONAL DE LA DIAN", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 30", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Marta Gil, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, adelanta desde el 12 de enero de 2026 un programa de control posterior sobre declaraciones de importación de repuestos automotores. En el expediente de Comercializadora Norte S.A.S. cruza tres datos: la declaración de importación del 20 de agosto de 2025, por 2.150 UVT; la factura comercial aportada en la visita del 3 de febrero de 2026, por un valor 40 % superior; y una certificación del proveedor extranjero que niega haber expedido la factura anexa a la declaración. El acto de formulación de cargos aún no se ha proferido y el término para hacerlo sigue corriendo. Su jefe le recuerda que la división no ejerce la acción penal y le pide definir el tratamiento de los hallazgos antes del comité del 17 de febrero.", "enunciado": "¿Qué tratamiento de los hallazgos debe sustentar Marta ante el comité?", "opciones": [{"t": "Suspender el control posterior hasta que la autoridad penal decida sobre la factura, y reanudarlo cuando esa decisión quede en firme.", "j": "Es incorrecta. Es plausible porque la falsedad de la factura afecta la prueba del valor en aduana. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, articula el control posterior aduanero y el reporte penal como actuaciones concurrentes; la norma no subordina la determinación aduanera al resultado penal, y suspender el expediente arriesga el término que sigue corriendo. Error de fase.", "tipo": "fase"}, {"t": "Continuar el control posterior hacia la liquidación y la sanción aduaneras, y reportar los hechos al área competente para la acción penal.", "j": "Es correcta. El Decreto 1742 de 2020, artículo 30, numeral 1, comprende en el control posterior la «determinación, liquidación, por infracciones a los regímenes aduaneros y la aplicación de sanciones», y ordena «reportar, al área competente, cuando sea del caso, los hechos, para inicio de la acción penal». El artículo 33, numeral 1, exige poner la posible comisión de delitos aduaneros en conocimiento inmediato de la dependencia o autoridad competente. Las dos vías corren en paralelo.", "tipo": null}, {"t": "Remitir los hechos a la autoridad penal y cerrar el expediente aduanero, porque la presunta falsedad absorbe la infracción aduanera.", "j": "Es incorrecta. Es plausible porque el reporte penal es una de las obligaciones que surgen del hallazgo. Falla porque el Decreto 1742 de 2020, artículo 30, numeral 1, mantiene la determinación, la liquidación y la sanción por infracciones al régimen aduanero junto con el reporte para la acción penal; cerrar el expediente omite la mitad de la función. Error de completitud.", "tipo": "completitud"}], "clave": 1, "soporte": [{"fila": "M086", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 30", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#30", "fecha": "2026-10-24"}, {"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}]}, {"id": "C-E07-001-1", "caso_id": "C-E07-001", "caso_pos": 1, "caso_n": 1, "eje": "NORMAS Y TECNICAS DE AUDITORIA", "bloom": "Aplicar", "fuente": "Estatuto Tributario, art. 782", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "La Gestor II Laura Méndez, de la división de fiscalización y liquidación de una Dirección Seccional, adelanta la investigación del impuesto sobre la renta del año gravable 2024 de Distribuidora Caribeña del Norte S.A.S., abierta el 3 de marzo de 2026. La sociedad declaró costos por 9.400 millones de pesos; de ellos, 2.100 millones corresponden a compras a dos proveedores: Insumos Metálicos Delta S.A.S., sociedad obligada a llevar contabilidad, por 1.500 millones, y el señor Ramiro Ortega, persona natural que según el RUT no está obligado a llevarla, por 600 millones. La investigada aportó las facturas, pero los valores no coinciden con lo que ambos proveedores reportaron en información exógena. El jefe de la división pide resolver, antes del 30 de junio de 2026, respecto de quiénes puede ordenarse inspección contable para verificar la exactitud de esos costos, sin acudir por ahora a otras diligencias.", "enunciado": "Decida respecto de quiénes procede ordenar la diligencia que pide el jefe de la división.", "opciones": [{"t": "Respecto de la investigada y de Insumos Metálicos Delta S.A.S., obligada a llevar contabilidad, pero no respecto del proveedor persona natural no obligado.", "j": "Es correcta. El Estatuto Tributario, art. 782, autoriza la inspección contable al contribuyente y a terceros legalmente obligados a llevar contabilidad, para verificar la exactitud de las declaraciones. Insumos Metálicos Delta S.A.S. cumple esa condición; el señor Ortega, según el RUT, no está obligado a llevar contabilidad, de modo que la inspección contable no es la diligencia que procede frente a él.", "tipo": null}, {"t": "Respecto de la investigada y de ambos proveedores, porque basta que hayan facturado operaciones incluidas en los costos que se están verificando.", "j": "Es incorrecta. Parece razonable porque ambos proveedores intervinieron en las compras cuestionadas, pero el Estatuto Tributario, art. 782, limita la inspección contable de terceros a quienes estén legalmente obligados a llevar contabilidad, condición que no cumple el proveedor persona natural. Error de granularidad: toma la relación comercial como criterio en lugar de la obligación contable.", "tipo": "granularidad"}, {"t": "Respecto de la sociedad investigada y de nadie más, porque la inspección contable no puede extenderse a terceros que no son parte de la investigación tributaria abierta.", "j": "Es incorrecta. Resulta plausible porque la investigación está abierta contra la sociedad, pero el Estatuto Tributario, art. 782, permite ordenar la inspección contable tanto al contribuyente como a terceros legalmente obligados a llevar contabilidad para verificar la exactitud de las declaraciones. Error de competencia: restringe la facultad a la investigada.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M010", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 782", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#782", "fecha": "2026-10-24"}]}, {"id": "C-E04-003-1", "caso_id": "C-E04-003", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Analizar", "fuente": "Decreto 1742 de 2020, art. 33", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Un Gestor II de la división de fiscalización y liquidación de una Dirección Seccional adelanta la investigación del impuesto de renta del año gravable 2024 de la Fundación Raíces del Valle, entidad sin ánimo de lucro. El requerimiento ordinario se notificó el 2 de marzo de 2026 y el plazo de respuesta vence el 20 de abril. En la contabilidad aportada encuentra donaciones por 1.900 millones de pesos recibidas de 37 personas sin vínculo aparente con la fundación, trasladadas en menos de diez días a cuentas de terceros en una zona donde la entidad no ejecuta programas. Entre los soportes hay correos internos que mencionan la entrega periódica de esos recursos a un grupo armado ilegal. El director de la fundación pidió aplazar una reunión de verificación prevista para el 15 de abril.", "enunciado": "¿Qué decisión debe tomar el Gestor frente al hallazgo de los correos y los traslados de fondos?", "opciones": [{"t": "Poner los hechos en conocimiento inmediato de la dependencia o autoridad competente, porque podrían corresponder a una entrega de fondos con fines ilícitos.", "j": "Es correcta. El Decreto 1742 de 2020, art. 33, núm. 1, ordena poner en conocimiento inmediato de la dependencia de la DIAN o de la autoridad competente la posible comisión de delitos. Recibir y entregar fondos a un grupo armado coincide con las conductas que describe la Ley 599 de 2000, art. 345; la calificación queda en manos de esa autoridad.", "tipo": null}, {"t": "Esperar a que venza el plazo de respuesta al requerimiento ordinario y, con la contabilidad completa, informar los hechos a la autoridad competente.", "j": "Es incorrecta. Es plausible porque la respuesta al requerimiento podría aportar más soportes. Falla porque el Decreto 1742 de 2020, art. 33, núm. 1, exige poner los hechos en conocimiento inmediato; supeditar el aviso a una etapa del procedimiento tributario lo retrasa sin base legal. Error de fase.", "tipo": "fase"}, {"t": "Calificar la conducta como financiación del terrorismo y usar esa calificación como fundamento del requerimiento especial que proponga la liquidación de revisión.", "j": "Es incorrecta. Es plausible porque los correos y los traslados son pruebas con valor en la investigación de renta. Falla porque calificar el delito de la Ley 599 de 2000, art. 345, no corresponde a la DIAN; el Decreto 1742 de 2020, art. 33, le ordena ponerlo en conocimiento de la autoridad competente. Error de competencia.", "tipo": "competencia"}], "clave": 0, "soporte": [{"fila": "M029", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 33", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#33", "fecha": "2026-10-24"}, {"fila": "M028", "norma": "Ley 599 de 2000 (Código Penal)", "articulo": "art. 345", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/ley_0599_2000.htm#345", "fecha": "2026-10-24"}]}, {"id": "C-E11-006-1", "caso_id": "C-E11-006", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 746", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "El Gestor II Felipe Arango, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración del impuesto sobre la renta del año gravable 2024 de Confecciones Altamar S.A.S. Los costos declarados equivalen al 92 % de los ingresos, mientras el promedio del sector según estudios internos es del 70 %. En mayo de 2026 la División envió un requerimiento ordinario que pidió soportes de los ingresos por exportaciones; la sociedad respondió a tiempo y no se le ha solicitado prueba alguna sobre los costos. Ninguna norma exige para esos costos una comprobación especial adicional. El jefe del grupo propone incluir en el requerimiento especial el rechazo de la diferencia de costos frente al promedio sectorial, sin más actuaciones previas. La declaración no está en firme y el término para notificar el requerimiento especial vence en abril de 2028.", "enunciado": "Evalúe la propuesta del jefe del grupo y decida la actuación que procede sobre los costos.", "opciones": [{"t": "Solicitar primero la comprobación de los costos, porque mientras no se pida se tienen por ciertos los hechos declarados.", "j": "Es correcta. El Estatuto Tributario, art. 746, considera ciertos los hechos consignados en la declaración 'siempre y cuando que sobre tales hechos, no se haya solicitado una comprobación especial, ni la ley la exija'. Sobre los costos no se ha pedido prueba ni la ley la exige; con la facultad del art. 684, literal a, la División debe verificar su exactitud antes de proponer su rechazo, y el término lo permite.", "tipo": null}, {"t": "Acoger la propuesta, porque el requerimiento ordinario de mayo ya pidió pruebas y la presunción de veracidad decayó.", "j": "Es incorrecta. Resulta plausible porque ya existe un requerimiento ordinario respondido dentro del expediente. Sin embargo, ese requerimiento versó sobre los ingresos por exportaciones; sobre los costos no se ha solicitado comprobación, de modo que el Estatuto Tributario, art. 746, los sigue considerando ciertos. Error de completitud: extiende a los costos una solicitud que cubrió otro hecho.", "tipo": "completitud"}, {"t": "Acoger la propuesta, porque la brecha frente al promedio sectorial basta para rechazar los costos en el requerimiento especial.", "j": "Es incorrecta. Es plausible porque una diferencia de 22 puntos frente al sector es un indicio relevante para seleccionar el caso. Sin embargo, el Estatuto Tributario, art. 746, tiene por ciertos los hechos declarados mientras no se haya solicitado una comprobación especial, y el art. 684 faculta a verificar la exactitud antes de proponer modificaciones. Error de fase: salta la verificación y pasa directo a la determinación.", "tipo": "fase"}], "clave": 0, "soporte": [{"fila": "M013", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 746", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#746", "fecha": "2026-10-24"}, {"fila": "M002", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 684", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#684", "fecha": "2026-10-24"}]}, {"id": "C-E06-010-1", "caso_id": "C-E06-010", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Evaluar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 869", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Felipe Moreno, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración de renta del año gravable 2024 de Agroindustrial Lambda S.A.S. La empresa trasladó en enero de 2024 su planta a un municipio donde una ley vigente concede un tratamiento tributario preferencial a quienes generen allí empleo directo. Las planillas de seguridad social muestran 120 empleados vinculados en el municipio desde febrero de 2024 y la maquinaria opera en el lugar según la visita del 4 de agosto de 2026. Por el beneficio, el impuesto a cargo bajó de 3.000 a 1.100 UVT. El coordinador propone recaracterizar el traslado como abuso, porque el recaudo de la seccional cayó 12 % y otras empresas del sector pagan más. Felipe debe emitir su concepto antes de que se decida el requerimiento especial.", "enunciado": "¿Qué concepto de Felipe sobre la propuesta del coordinador resiste mejor un examen jurídico?", "opciones": [{"t": "Procede la recaracterización, porque el deber de contribuir autoriza a desconocer beneficios cuando el recaudo de la seccional disminuye.", "j": "Es incorrecta. Resulta plausible porque la caída del recaudo preocupa a la seccional y existe un deber constitucional de contribuir. Falla porque el Estatuto Tributario, art. 869, condiciona la recaracterización a que exista abuso, y el art. 683 prohíbe exigir al contribuyente más de lo que la ley ha querido. Error de norma.", "tipo": "norma"}, {"t": "No procede la recaracterización, porque la facultad se reserva a operaciones que constituyan abuso y el traslado tiene sustancia real comprobada.", "j": "Es correcta. El Estatuto Tributario, art. 869, permite recaracterizar la operación o serie de operaciones que constituya abuso en materia tributaria; aquí hay empleo y operación reales. La caída del recaudo no convierte en abuso el uso de un beneficio que la ley fija (Constitución Política, art. 338), y el art. 683 del Estatuto impide exigir más de lo que la ley ha querido.", "tipo": null}, {"t": "Procede recaracterizar la parte del beneficio que supere lo que pagan las demás empresas del sector, y aceptar el resto del ahorro.", "j": "Es incorrecta. Es plausible porque parece una salida intermedia y proporcionada. Falla porque el Estatuto Tributario, art. 869, no fija un tope comparativo con el sector: la operación es abusiva o no lo es, y la Constitución Política, art. 338, reserva a la ley los elementos del tributo. Error de granularidad.", "tipo": "granularidad"}], "clave": 1, "soporte": [{"fila": "M011", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 869", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#869", "fecha": "2026-10-24"}, {"fila": "M050", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 683", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#683", "fecha": "2026-10-24"}, {"fila": "M091", "norma": "Constitución Política de Colombia", "articulo": "art. 338", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/constitucion_politica_1991.htm#338", "fecha": "2026-10-24"}]}, {"id": "C-E09-003-1", "caso_id": "C-E09-003", "caso_pos": 1, "caso_n": 1, "eje": "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 589", "integra": ["LIQUIDACION DE IMPUESTOS NACIONALES"], "caso": "La Gestora II Paola Ríos, de la división de fiscalización y liquidación de una Dirección Seccional, recibe para revisión técnica una declaración de corrección de renta del año gravable 2024 presentada por Inversiones Laguna Azul S.A.S. El plazo para declarar ese año venció el 10 de abril de 2025, pero la sociedad presentó la declaración inicial el 20 de junio de 2025, con un saldo a favor de 90 UVT. El 2 de junio de 2026 la sociedad radicó, por el medio electrónico al que está obligada, la corrección que eleva el saldo a favor a 210 UVT por costos que no había incluido. No se le ha notificado requerimiento especial ni pliego de cargos. La sociedad pide que la corrección se tenga en cuenta para la solicitud de devolución que proyecta radicar. La Gestora debe sustentar su concepto antes de remitir el expediente.", "enunciado": "¿Qué concepto debe emitir la Gestora sobre la oportunidad de la corrección presentada?", "opciones": [{"t": "Es oportuna, porque el año para corregir aumentando el saldo a favor se cuenta desde la presentación inicial y termina el 20 de junio de 2026.", "j": "Es incorrecta. Identifica bien el término de un año, lo que la hace plausible, pero lo cuenta desde la presentación de la declaración inicial; el Estatuto Tributario, art. 589, lo cuenta desde el vencimiento del término para presentar la declaración, es decir, desde el 10 de abril de 2025. Error de fase: ubica mal el momento en que empieza a correr el plazo.", "tipo": "fase"}, {"t": "Es oportuna, porque la corrección se presentó dentro de los tres años siguientes al vencimiento y antes de notificarse un requerimiento especial.", "j": "Es incorrecta. Es plausible porque ambas condiciones se cumplen en el caso, pero corresponden al Estatuto Tributario, art. 588, que regula las correcciones que aumentan el impuesto o disminuyen el saldo a favor; la corrección que aumenta el saldo a favor se rige por el art. 589 y su término es de un año. Error de norma.", "tipo": "norma"}, {"t": "Es extemporánea, porque el año para corregir aumentando el saldo a favor corre desde el vencimiento del plazo y terminó el 10 de abril de 2026.", "j": "Es correcta. El Estatuto Tributario, art. 589, exige que la corrección que aumenta el saldo a favor se presente dentro del año siguiente al vencimiento del término para presentar la declaración. Ese término venció el 10 de abril de 2025, así que el año concluyó el 10 de abril de 2026 y la corrección del 2 de junio de 2026 quedó por fuera, aunque la declaración inicial haya sido tardía.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E05-008-1", "caso_id": "C-E05-008", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Analizar", "fuente": "Estatuto Tributario, art. 588", "integra": ["OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA", "IMPOSICION DE SANCIONES"], "caso": "Camilo Herrera, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la corrección que presentó Textiles Theta S.A.S. el 18 de septiembre de 2026 a su declaración de renta del año gravable 2023, cuyo plazo venció el 15 de mayo de 2024. La corrección incluye ingresos financieros omitidos por 260 millones de pesos y aumenta el impuesto a cargo en 91 millones. En el renglón de sanciones la sociedad registró cero, con una nota que alega buena fe por tratarse de un error del área contable. La División tiene abierto un programa de verificación sobre el sector, pero a la sociedad no se le ha notificado requerimiento especial ni pliego de cargos. El Gestor debe emitir un concepto técnico sobre la corrección para el expediente antes de cerrar la verificación.", "enunciado": "Diagnostique si la corrección cumple las condiciones legales y sustente su conclusión.", "opciones": [{"t": "Las cumple, porque es oportuna y previa al requerimiento, y la buena fe exime de liquidar la sanción.", "j": "Es incorrecta. Resulta atractiva porque reconoce bien la oportunidad y la ausencia de requerimiento especial. Pero el Estatuto Tributario, art. 588, exige además que se liquide la sanción por corrección y no prevé una exención por buena fe; la opción deja por fuera una de las condiciones de la norma (completitud).", "tipo": "completitud"}, {"t": "No las cumple, porque, aunque es oportuna y previa al requerimiento, omitió liquidar la sanción por corrección.", "j": "Es correcta. El Estatuto Tributario, art. 588, permite corregir dentro de los tres años siguientes al vencimiento del plazo para declarar y antes de la notificación del requerimiento especial o pliego de cargos, y exige que se liquide la sanción por corrección. La corrección es oportuna, pues el término corre hasta mayo de 2027, pero registró cero en sanciones.", "tipo": null}, {"t": "No las cumple, porque se presentó después del año siguiente al vencimiento del plazo para declarar.", "j": "Es incorrecta. Es plausible porque el término de un año existe en el Estatuto Tributario, art. 589. Pero ese término rige las correcciones que disminuyen el valor a pagar o aumentan el saldo a favor; esta corrección aumenta el impuesto y se rige por el art. 588, con tres años; la opción aplica la regla equivocada (norma).", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M081", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 588", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#588", "fecha": "2026-10-24"}, {"fila": "M082", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 589", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#589", "fecha": "2026-10-24"}]}, {"id": "C-E06-001-1", "caso_id": "C-E06-001", "caso_pos": 1, "caso_n": 1, "eje": "MISIONALIDAD DE LA DIAN", "bloom": "Aplicar", "fuente": "Decreto 1742 de 2020, art. 1", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "ESTRUCTURA ORGANIZACIONAL DE LA DIAN"], "caso": "Laura Méndez, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, recibe el 18 de agosto de 2025 un expediente remitido por el área de devoluciones. La sociedad Alfa Insumos S.A.S. presentó su declaración de renta del año gravable 2024 el 12 de mayo de 2025 con un saldo a favor de 1.800 UVT y pidió su devolución el 2 de julio de 2025. El área de devoluciones detectó costos por 420 UVT soportados en documentos de un proveedor que no aparece en los registros de facturación. El 25 de agosto el representante legal radica un escrito en el que sostiene que la DIAN, una vez iniciado el trámite de devolución, solo puede pronunciarse sobre la devolución misma, y que verificar los costos o proponer una sanción excede lo que le corresponde como entidad encargada del recaudo. Laura debe responder el escrito antes de abrir la verificación.", "enunciado": "¿Con qué fundamento debe Laura responder el escrito del representante legal?", "opciones": [{"t": "La Administración puede verificar los costos y proponer sanción, aunque solo después de que el área de devoluciones resuelva la solicitud en su totalidad.", "j": "Es incorrecta. Resulta plausible porque el trámite de devolución está en curso y parece razonable cerrarlo primero. Falla porque el Decreto 1742 de 2020, art. 1, ubica fiscalización, devolución y sanción dentro de una misma administración del impuesto, sin exigir que una etapa concluya para que la otra se active. Error de fase.", "tipo": "fase"}, {"t": "La DIAN puede verificar los costos dentro de la devolución, pero la sanción debe tramitarla otra autoridad, pues su administración cubre recaudo y control.", "j": "Es incorrecta. Es plausible porque reconoce la facultad de verificar los costos dentro del trámite. Falla porque el Decreto 1742 de 2020, art. 1, incluye expresamente la sanción entre los componentes de la administración de los impuestos que corresponde a la DIAN. Error de completitud: enumera solo parte de las funciones.", "tipo": "completitud"}, {"t": "La administración del impuesto comprende fiscalización, liquidación, devolución y sanción, así que verificar los costos cabe en sus funciones.", "j": "Es correcta. El Decreto 1742 de 2020, art. 1, dispone que la administración de los impuestos comprende su recaudación, fiscalización, liquidación, discusión, cobro, devolución, sanción y todos los demás aspectos relacionados con el cumplimiento de las obligaciones tributarias. Verificar costos dentro de una devolución es fiscalización y proponer una sanción es sanción, ambas dentro de esa administración. La objeción del representante legal reduce la entidad al recaudo y desconoce ese alcance.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M083", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 1", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#1", "fecha": "2026-10-24"}]}, {"id": "C-E05-004-1", "caso_id": "C-E05-004", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 711", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "NORMAS Y TECNICAS DE AUDITORIA"], "caso": "Sergio Pardo, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa el proyecto de liquidación de revisión del impuesto de renta del año gravable 2023 de Constructora Delta S.A.S. El requerimiento especial, notificado en abril de 2026, propuso adicionar ingresos no declarados por 980 millones de pesos; no hubo ampliación. En su respuesta, el contribuyente aceptó parte de esos ingresos. Al preparar el proyecto, el auditor encontró en los papeles de trabajo que las deducciones por intereses, de 340 millones de pesos, carecen de soporte, e incluyó su rechazo en el mismo acto. El término para notificar la liquidación vence en tres semanas, lapso que no alcanza para tramitar una ampliación. La jefatura pide al Gestor un concepto técnico sobre el proyecto antes de enviarlo a firma.", "enunciado": "Evalúe el proyecto y decida qué ajuste debe hacerse antes de la firma.", "opciones": [{"t": "Mantener las dos glosas, porque ambas recaen sobre la misma declaración y el mismo período gravable.", "j": "Es incorrecta. Parece razonable porque el Estatuto Tributario, art. 711, sujeta la liquidación a la declaración del contribuyente, y las dos glosas recaen sobre ella. Pero la norma exige además que se trate de hechos contemplados en el requerimiento especial o en su ampliación, y los intereses no lo fueron; la opción toma una sola de las dos condiciones (completitud).", "tipo": "completitud"}, {"t": "Mantener las dos glosas y dejar que el contribuyente controvierta los intereses al interponer el recurso.", "j": "Es incorrecta. Resulta plausible porque el recurso permite al contribuyente discutir el acto. Pero el Estatuto Tributario, art. 711, fija el límite de la liquidación de revisión en los hechos del requerimiento o su ampliación; trasladar el debate al recurso desplaza a una fase posterior lo que debía resolverse antes de proferir el acto (fase).", "tipo": "fase"}, {"t": "Retirar el rechazo de intereses, pues no figuró en el requerimiento especial ni en una ampliación.", "j": "Es correcta. El Estatuto Tributario, art. 711, dispone que la liquidación de revisión debe contraerse a la declaración y a los hechos contemplados en el requerimiento especial o en su ampliación. El rechazo de intereses no figuró en el requerimiento y no hubo ampliación, por lo que debe salir del proyecto.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M039", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 711", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#711", "fecha": "2026-10-24"}]}, {"id": "C-E11-002-1", "caso_id": "C-E11-002", "caso_pos": 1, "caso_n": 1, "eje": "RAZONAMIENTO ANALITICO", "bloom": "Aplicar", "fuente": "Estatuto Tributario (Decreto 624 de 1989), art. 641", "integra": ["IMPOSICION DE SANCIONES"], "caso": "El Gestor II Andrés Rincón, de la División de Fiscalización y Liquidación de una Dirección Seccional, revisa la declaración del impuesto sobre la renta del año gravable 2024 de Talleres Cordillera S.A.S., seleccionada por presentación tardía. El plazo para declarar venció el 22 de abril de 2025 y la declaración se presentó el 10 de julio de 2025. El impuesto a cargo declarado es de $48.000.000 y los ingresos brutos ascienden a $910.000.000. En la misma declaración el contribuyente liquidó una sanción por extemporaneidad de $4.800.000, con el argumento de que entre el vencimiento y la presentación solo transcurrieron dos meses completos. El expediente está en la etapa de verificación de la sanción autoliquidada, previa a cualquier acto oficial. La jefatura pide que la revisión se limite al número de meses de retardo y a la tarifa, sin considerar otros factores de graduación.", "enunciado": "Determine el valor de la sanción que debió liquidar el contribuyente con los datos del caso.", "opciones": [{"t": "$4.800.000, porque solo cuentan los dos meses completos transcurridos después del vencimiento.", "j": "Es incorrecta. Es plausible porque entre el 22 de abril y el 22 de junio de 2025 hay dos meses completos y el 10 % de $48.000.000 da ese valor. Sin embargo, el Estatuto Tributario, art. 641, liquida la sanción 'por cada mes o fracción de mes calendario de retardo', y del 22 de junio al 10 de julio corre una fracción que también se cuenta. Error de completitud: omite la fracción del tercer mes.", "tipo": "completitud"}, {"t": "$7.200.000, porque el retardo suma dos meses completos y una fracción que cuenta como mes.", "j": "Es correcta. El Estatuto Tributario, art. 641, fija la sanción en el 5 % del impuesto a cargo por cada mes o fracción de mes calendario de retardo. Del 22 de abril al 10 de julio de 2025 hay dos meses completos y una fracción, es decir, tres periodos: 15 % de $48.000.000 equivale a $7.200.000, valor inferior al tope del 100 % del impuesto.", "tipo": null}, {"t": "$48.000.000, porque la sanción por retardo equivale al ciento por ciento del impuesto a cargo.", "j": "Es incorrecta. Resulta plausible porque el art. 641 del Estatuto Tributario menciona el ciento por ciento del impuesto. Sin embargo, ese porcentaje es el límite máximo ('sin exceder del ciento por ciento'), no la tarifa; la sanción se calcula al 5 % por mes o fracción. Error de norma: toma el tope como si fuera la regla de cálculo.", "tipo": "norma"}], "clave": 1, "soporte": [{"fila": "M066", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 641", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#641", "fecha": "2026-10-24"}]}, {"id": "C-E04-006-1", "caso_id": "C-E04-006", "caso_pos": 1, "caso_n": 1, "eje": "LAVADO DE ACTIVOS FINANCIACION DEL TERRORISMO REPORTE DE OPERACIONES SOSPECHOSAS Y DENUNCIAS", "bloom": "Evaluar", "fuente": "Decreto 1742 de 2020, art. 28", "integra": ["NORMAS Y TECNICAS DE AUDITORIA", "PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA"], "caso": "Para el plan operativo del primer semestre de 2026, la división de fiscalización y liquidación de una Dirección Seccional debe formular un programa dirigido a comercializadoras de chatarra. Un Gestor II reúne los insumos: 42 contribuyentes con compras en efectivo superiores a 15.000 UVT en 2025, nueve de ellos con proveedores inexistentes en el RUT y cuatro con operaciones de giro al exterior sin soporte cambiario. El cronograma de la seccional fija el 28 de febrero de 2026 como fecha límite para enviar la propuesta al nivel central y la evaluación de resultados para noviembre. En el comité, un asistente plantea que el programa se concentre solo en la verificación del IVA descontable, porque la detección de operaciones sospechosas de lavado de activos corresponde a otro proceso y no cabe en un programa de fiscalización.", "enunciado": "¿Cómo debe sustentar el Gestor el alcance del programa frente al planteamiento del asistente?", "opciones": [{"t": "El programa debe limitarse a las obligaciones tributarias y cambiarias, y la detección de operaciones sospechosas se atiende por fuera de la planeación de fiscalización.", "j": "Es incorrecta. Es plausible porque el control de obligaciones es el objeto típico de un programa. Falla porque el Decreto 1742 de 2020, art. 28, núm. 6, incluye expresamente entre las finalidades de los programas de fiscalización la detección de operaciones sospechosas relacionadas con el lavado de activos. Error de competencia.", "tipo": "competencia"}, {"t": "El programa puede abarcar ese objetivo, pero la detección de operaciones sospechosas se incorpora al cerrar la evaluación de resultados de noviembre.", "j": "Es incorrecta. Es plausible porque la evaluación de resultados hace parte del ciclo del programa. Falla porque el Decreto 1742 de 2020, art. 28, núm. 6, contempla ese objetivo en la planeación, la ejecución y la evaluación, no solo al final del ciclo. Error de fase.", "tipo": "fase"}, {"t": "El programa puede incluir la detección de operaciones sospechosas de lavado de activos junto con el control de las obligaciones tributarias y cambiarias.", "j": "Es correcta. El Decreto 1742 de 2020, art. 28, núm. 6, prevé la participación en la planeación, ejecución y evaluación de planes y programas de fiscalización y control destinados a determinar el cumplimiento de obligaciones tributarias, aduaneras y cambiarias, o que permitan detectar operaciones sospechosas relacionadas con el lavado de activos.", "tipo": null}], "clave": 2, "soporte": [{"fila": "M026", "norma": "Decreto 1742 de 2020 (estructura de la DIAN)", "articulo": "art. 28", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/decreto_1742_2020.htm#28", "fecha": "2026-10-24"}]}, {"id": "C-E05-007-1", "caso_id": "C-E05-007", "caso_pos": 1, "caso_n": 1, "eje": "LIQUIDACION DE IMPUESTOS NACIONALES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 717", "integra": ["IMPOSICION DE SANCIONES"], "caso": "Paula Rincón, Gestor II de la División de Fiscalización y Liquidación de una Dirección Seccional, retoma un expediente de omisión de Agroindustrial Eta S.A. por el impuesto de renta del año gravable 2020, cuyo plazo para declarar venció el 12 de agosto de 2021. La sociedad fue emplazada para declarar el 15 de marzo de 2023, no atendió el emplazamiento, y la resolución sanción por no declarar quedó en firme el 2 de diciembre de 2024. El proyecto de liquidación de aforo, con un impuesto estimado de 7.400 UVT, quedó sin firma por el traslado del funcionario anterior. La fecha actual es el 24 de octubre de 2026. El jefe de la dependencia pide evaluar si el proyecto puede firmarse y notificarse durante lo que resta del mes, y dejar constancia del cómputo en el expediente.", "enunciado": "Evalúe la viabilidad de proferir el acto y sustente su conclusión con el cómputo del término.", "opciones": [{"t": "No es viable, porque los cinco años se cuentan desde el vencimiento para declarar y concluyeron el 12 de agosto de 2026.", "j": "Es correcta. El Estatuto Tributario, art. 717, permite determinar la obligación mediante liquidación de aforo dentro de los cinco años siguientes al vencimiento del plazo señalado para declarar. El plazo venció el 12 de agosto de 2021, de modo que la facultad terminó el 12 de agosto de 2026, antes de la fecha actual.", "tipo": null}, {"t": "Es viable, porque los cinco años se cuentan desde el emplazamiento y vencen el 15 de marzo de 2028.", "j": "Es incorrecta. Es plausible porque el emplazamiento es el acto que abre el procedimiento contra el omiso. Pero el Estatuto Tributario, art. 717, cuenta los cinco años desde el vencimiento del plazo señalado para declarar; la opción traslada el inicio del término a una fase posterior del procedimiento (fase).", "tipo": "fase"}, {"t": "Es viable, porque los cinco años se cuentan desde la firmeza de la sanción y vencen el 2 de diciembre de 2029.", "j": "Es incorrecta. Resulta atractiva porque el Estatuto Tributario, art. 717, exige agotar el procedimiento del art. 643 antes del aforo. Pero esa exigencia es una condición previa y no el punto de partida del término, que la norma fija en el vencimiento del plazo para declarar; la opción mezcla los dos elementos de la regla (completitud).", "tipo": "completitud"}], "clave": 0, "soporte": [{"fila": "M041", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 717", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#717", "fecha": "2026-10-24"}, {"fila": "M031", "norma": "Estatuto Tributario (Decreto 624 de 1989)", "articulo": "art. 715", "url": "https://normograma.dian.gov.co/dian/compilacion/docs/estatuto_tributario.htm#715", "fecha": "2026-10-24"}]}, {"id": "C-E03-007-1", "caso_id": "C-E03-007", "caso_pos": 1, "caso_n": 1, "eje": "IMPOSICION DE SANCIONES", "bloom": "Evaluar", "fuente": "Estatuto Tributario, art. 651", "integra": ["PROCEDIMIENTO DE FISCALIZACION Y LIQUIDACION TRIBUTARIA Y ADUANERA", "OBLIGACIONES FORMALES Y SUSTANCIALES EN MATERIA TRIBUTARIA"], "caso": "Natalia Fuentes, Gestor II de la división de fiscalización y liquidación de una Dirección Seccional, investiga a Logística Portuaria Delta S.A.S. El 2 de febrero de 2026 la división le envió un requerimiento ordinario de información con plazo de quince días para entregar las facturas de compra de 2025 de cinco proveedores. La sociedad respondió el 20 de febrero de 2026, dentro del plazo, pero anexó facturas de 2024 de esos proveedores. Su reporte de información exógena de 2025 se presentó en término y sin errores. El apoderado afirma que la sociedad cumplió porque contestó a tiempo y que la falta, de existir, la debe tramitar el área que administra la información exógena. La Gestor II debe valorar si la conducta es sancionable antes de proponer la actuación.", "enunciado": "Valore si la respuesta de la sociedad configura la conducta sancionable y bajo qué supuesto.", "opciones": [{"t": "No la configura, pues la respuesta llegó dentro del plazo y la norma reprocha no suministrar o hacerlo tarde.", "j": "Es incorrecta. Es plausible porque el art. 651 del Estatuto Tributario sanciona no suministrar la información o hacerlo fuera de plazo, pero el mismo texto incluye el caso en que el contenido presente errores o no corresponda a lo solicitado; la lectura omite ese supuesto (error de completitud).", "tipo": "completitud"}, {"t": "La configura, porque se respondió a tiempo con un contenido que no corresponde a lo que se solicitó.", "j": "Es correcta. El art. 651 del Estatuto Tributario sanciona a quienes se les haya solicitado informaciones o pruebas y cuyo contenido no corresponda a lo solicitado, aunque se entregue dentro del plazo; las facturas de 2024 no son las de 2025 que pidió el requerimiento.", "tipo": null}, {"t": "La configura, pero su trámite corresponde al área de exógena, porque la norma sanciona a los obligados a reportar.", "j": "Es incorrecta. Es plausib
